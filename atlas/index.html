<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Atlas — Liverpool Rummy architecture, zoomable</title>
<meta name="description" content="The Liverpool Rummy architecture as an infinite zoomable canvas. Zoom out for the skeleton, zoom in for the details.">
<style>
  :root{ --bg:#0a0a0c; --ink:#fafafa; --dim:#a1a1aa; --card:#f5f5f4; --cardink:#18181b;
         --hot:#60a5fa; --line:#3f3f46; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  #stage{position:fixed;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  #stage.dragging{cursor:grabbing}
  svg text{pointer-events:none}
  .node{cursor:pointer}
  .node rect.card{fill:var(--card);stroke:#d4d4d8;stroke-width:1.5;transition:stroke .2s}
  .node.focused rect.card{stroke:var(--hot);stroke-width:3}
  .lod2,.lod3,.lod4{opacity:0;transition:opacity .28s ease}
  svg[data-lod="2"] .lod2{opacity:1}
  svg[data-lod="3"] .lod2,svg[data-lod="3"] .lod3{opacity:1}
  svg[data-lod="4"] .lod2,svg[data-lod="4"] .lod3,svg[data-lod="4"] .lod4{opacity:1}
  .elabel{opacity:0;transition:opacity .28s ease}
  svg[data-lod="3"] .elabel,svg[data-lod="4"] .elabel{opacity:1}
  header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;pointer-events:none;z-index:5}
  header .brand{pointer-events:auto;background:rgba(10,10,12,.72);backdrop-filter:blur(8px);
    border:1px solid #27272a;border-radius:12px;padding:8px 14px;font-size:14px}
  header .brand b{font-size:15px}
  header .brand span{color:var(--dim)}
  .zoomctl{pointer-events:auto;display:flex;gap:8px;align-items:center;
    background:rgba(10,10,12,.72);backdrop-filter:blur(8px);border:1px solid #27272a;border-radius:12px;padding:6px}
  .zoomctl button{touch-action:manipulation;width:36px;height:36px;border-radius:8px;border:1px solid #3f3f46;
    background:#18181b;color:#fafafa;font-size:18px;cursor:pointer;line-height:1}
  .zoomctl button:hover{background:#27272a}
  #index{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:6px;
    background:rgba(10,10,12,.72);backdrop-filter:blur(8px);border:1px solid #27272a;border-radius:14px;padding:10px;max-width:190px}
  #index .cap{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:2px 6px}
  #index button{touch-action:manipulation;text-align:left;background:transparent;border:1px solid transparent;color:var(--ink);
    border-radius:8px;padding:7px 9px;font-size:13px;cursor:pointer}
  #index button:hover{background:#18181b;border-color:#3f3f46}
  #hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;white-space:nowrap;
    background:rgba(10,10,12,.72);backdrop-filter:blur(8px);border:1px solid #27272a;border-radius:999px;
    padding:9px 18px;font-size:13px;color:var(--dim);transition:opacity .6s;pointer-events:none}
  #hint b{color:var(--ink);font-weight:600}
  #ver{position:fixed;right:12px;bottom:12px;z-index:5;font-size:11px;color:#52525b;font-family:ui-monospace,monospace}
  @media (max-width:640px){
    #index{display:none}
    #hint{font-size:11px;padding:8px 14px;bottom:12px}
    header{padding:10px 12px}
  }
</style>
</head>
<body>
<div id="stage">
<svg id="canvas" width="100%" height="100%" data-lod="1" role="img"
     aria-label="Zoomable architecture diagram of the Liverpool Rummy card game">
  <defs>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#232327"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52525b"/>
    </marker>
    <marker id="arrowHot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect id="bgrect" width="100%" height="100%" fill="url(#dots)"/>
  <g id="world"><g id="edges"></g><g id="nodes"></g></g>
</svg>
</div>

<header>
  <div class="brand"><b>Atlas</b> <span>· Liverpool Rummy architecture — keep zooming, it keeps going deeper</span></div>
  <div class="zoomctl">
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">−</button>
    <button id="zreset" aria-label="Reset view" style="font-size:13px;width:auto;padding:0 12px">reset</button>
  </div>
</header>

<nav id="index" aria-label="Jump to a part of the architecture"><div class="cap">Jump to</div></nav>
<div id="hint"><b>Drag</b> to move &nbsp;·&nbsp; <b>scroll / pinch</b> to zoom &nbsp;·&nbsp; <b>click a card</b> to dive in</div>
<div id="ver">v2026.10.01</div>

<script>
"use strict";
/* ============ data: 4 levels of detail per node ============ */
const NODES = [
 {id:"you", x:0, y:0, chip:"player", accent:"#a3e635",
  title:"You, on your phone",
  l2:["Nothing to install — the whole game runs in the browser."],
  l3:["Local pass-and-play: 100% client-side","Online rooms: 2–6 players, 4-letter codes"],
  l4:["tip: add ?dev=1 to the URL and jump anywhere →"]},
 {id:"client", x:600, y:0, chip:"cloudflare pages", accent:"#fbbf24",
  title:"Static client",
  l2:["liverpool-rummy.pages.dev — the game UI."],
  l3:["app.js renders the table","engine.js runs local games","dev.js powers ?dev=1"],
  l4:["deploy.sh stamps WORKER_URL + the build badge","auto-deploys from GitHub main"]},
 {id:"worker", x:1200, y:0, chip:"cloudflare worker", accent:"#60a5fa",
  title:"Referee worker",
  l2:["liverpool-rummy-rooms…workers.dev — the authority."],
  l3:["Routes WebSocket + debug HTTP to the per-room","Durable Object"],
  l4:["ships as an esbuild bundle, pasted in the dashboard","build 27979ecb · 2026-10-01"]},
 {id:"room", x:1800, y:0, chip:"durable object", accent:"#f472b6",
  title:"Room — one per game",
  l2:["Class Room. A 4-letter code gets its own object."],
  l3:["Holds the full game state","TURN_MS = 90000 — 90-second turn clocks","buy prompts never eat into your turn"],
  l4:["server bots fill empty seats (BOT_MS = 1500)","wire frames look like {t:\"deals\"}, {t:\"kick\"}","/ws endpoint · stock order + lastHands stripped","from public snapshots (2026-09-30)","buyRequest carries buyerPid (fixed 2026-10-01)"]},
 {id:"engine", x:900, y:660, chip:"shared rules", accent:"#34d399",
  title:"engine.js — the rules",
  l2:["One rules engine, used by client and worker."],
  l3:["7-deal contracts + quick 3-deal","jokers + 2s wild · joker-steal"],
  l4:["lay-offs open the turn after going down","deal 7: go out holding all 12 cards","no buying once you're down","bend/ holds a Bend2 proof of the card logic"]},
 {id:"devmode", x:0, y:660, chip:"testing", accent:"#c084fc",
  title:"?dev=1 — dev mode",
  l2:["“Test anywhere, not from the beginning.”"],
  l3:["Jump to any deal / contract","rig hands + piles · force buy rounds","take over any turn"],
  l4:["lives in dev.js · covered by test/dev.smoke.js"]},
 {id:"repo", x:900, y:1330, chip:"github · private", accent:"#94a3b8",
  title:"absolukie/liverpool-rummy",
  l2:["Source of truth."],
  l3:["Pushes go through clean-temp-tree + gh_push.py","tests: engine.test.js · room.test.js · app.smoke.js"],
  l4:["Pages auto-deploys main on push","Worker ships via dashboard bundle paste"]},
];
const EDGES = [
 {from:"you",    fs:"r", to:"client", ts:"l", label:"opens the URL", hot:true},
 {from:"client", fs:"r", to:"worker", ts:"l", label:"WebSocket · /ws", hot:true},
 {from:"worker", fs:"r", to:"room",   ts:"l", label:"routes by room code", hot:true},
 {from:"engine", fs:"t", to:"client", ts:"b", label:"powers local games"},
 {from:"engine", fs:"t", to:"room",   ts:"b", label:"validates every move"},
 {from:"you",    fs:"b", to:"devmode",ts:"t", label:"adds ?dev=1"},
 {from:"repo",   fs:"t", to:"client", ts:"b", label:"push → auto-deploy", dashed:true},
 {from:"repo",   fs:"t", to:"worker", ts:"b", label:"bundle → dashboard", dashed:true},
];

/* ============ svg helpers ============ */
const SVGNS="http://www.w3.org/2000/svg";
const svg=document.getElementById("canvas"), world=document.getElementById("world"),
      gE=document.getElementById("edges"), gN=document.getElementById("nodes");
function el(name,attrs,parent){const e=document.createElementNS(SVGNS,name);
  for(const k in attrs)e.setAttribute(k,attrs[k]); if(parent)parent.appendChild(e); return e;}
function txt(parent,x,y,str,o){o=o||{};const t=el("text",{x:x,y:y,"font-size":o.size||16,
  "font-weight":o.weight||400,fill:o.fill||"#18181b","font-family":o.mono?
  "ui-monospace,SFMono-Regular,Menlo,monospace":"-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif"},
  parent); t.textContent=str; return t;}

/* ============ build nodes (measure, then frame) ============ */
const NW=380, PAD=26;
const byId={};
NODES.forEach(n=>{
  const g=el("g",{class:"node",id:"n-"+n.id,transform:`translate(${n.x},${n.y})`},gN);
  const c=el("g",{},g); let y=PAD;
  txt(c,PAD,y+24,n.title,{size:29,weight:700}); y+=44;
  const chip=el("g",{class:"lod2"},c);
  const ct=txt(chip,PAD+12,y+15,n.chip.toUpperCase(),{size:12,weight:700,fill:"#3f3f46"});
  const cw=ct.getComputedTextLength();
  el("rect",{x:PAD,y:y,width:cw+24,height:26,rx:13,fill:n.accent,opacity:.28},chip);
  chip.insertBefore(chip.lastChild,chip.firstChild); chip.appendChild(ct); y+=42;
  const g2=el("g",{class:"lod2"},c);
  n.l2.forEach(s=>{txt(g2,PAD,y+16,s,{size:16,fill:"#3f3f46"}); y+=26;});
  y+=6;
  const g3=el("g",{class:"lod3"},c);
  n.l3.forEach(s=>{txt(g3,PAD,y+15,"•  "+s,{size:15,fill:"#27272a"}); y+=25;});
  y+=6;
  const g4=el("g",{class:"lod4"},c);
  n.l4.forEach(s=>{txt(g4,PAD,y+13,s,{size:12.5,mono:true,fill:"#52525b"}); y+=21;});
  y+=PAD-14;
  const bb=c.getBBox();
  const w=NW, h=bb.height+bb.y+PAD;
  el("rect",{class:"card",x:0,y:0,width:w,height:h,rx:18},g);
  g.insertBefore(g.lastChild,g.firstChild);
  n.w=w; n.h=h; n.cx=n.x+w/2; n.cy=n.y+h/2; n.el=g; byId[n.id]=n;
  g.addEventListener("click",ev=>{ if(!moved){ focusNode(n);} });
});

/* ============ edges (after layout) ============ */
function anchor(n,side){
  if(side==="l")return[n.x,n.cy]; if(side==="r")return[n.x+n.w,n.cy];
  if(side==="t")return[n.cx,n.y]; return[n.cx,n.y+n.h];
}
EDGES.forEach(e=>{
  const a=byId[e.from], b=byId[e.to];
  const [x1,y1]=anchor(a,e.fs), [x2,y2]=anchor(b,e.ts);
  const mx=(x1+x2)/2;
  const p=el("path",{d:`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`,
    fill:"none",stroke:e.hot?"#60a5fa":"#52525b","stroke-width":e.hot?3:2,
    "stroke-dasharray":e.dashed?"8 7":(e.hot?"none":"3 6"),
    "marker-end":e.hot?"url(#arrowHot)":"url(#arrow)"},gE);
  const lx=(x1+x2)/2, ly=(y1+y2)/2;
  const t=el("text",{x:lx,y:ly-10,"text-anchor":"middle",class:"elabel","font-size":14,
    fill:"#d4d4d8","font-family":"-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif",
    style:"paint-order:stroke;stroke:#0a0a0c;stroke-width:5"},gE);
  t.textContent=e.label;
});

/* ============ pan / zoom ============ */
const stage=document.getElementById("stage");
const S={x:0,y:0,z:1};
function apply(){
  world.setAttribute("transform",`translate(${S.x},${S.y}) scale(${S.z})`);
  svg.dataset.lod = S.z>=1.9?4 : S.z>=1.0?3 : S.z>=0.5?2 : 1;
}
function zoomAt(cx,cy,f){
  const wx=(cx-S.x)/S.z, wy=(cy-S.y)/S.z;
  S.z=Math.min(5,Math.max(.22,S.z*f));
  S.x=cx-wx*S.z; S.y=cy-wy*S.z; apply();
}
function flyTo(wx,wy,z,dur){
  const sx=S.x, sy=S.y, sz=S.z;
  const vw=innerWidth, vh=innerHeight;
  const tx=vw/2-wx*z, ty=vh/2-wy*z;
  const t0=performance.now(); dur=dur||650;
  cancelAnimationFrame(flyTo.raf);
  (function step(t){
    let k=Math.min(1,(t-t0)/dur); k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    S.x=sx+(tx-sx)*k; S.y=sy+(ty-sy)*k; S.z=sz*Math.pow(z/sz,k);
    apply(); if(k<1)flyTo.raf=requestAnimationFrame(step);
  })(t0);
}
function focusNode(n){
  document.querySelectorAll(".node.focused").forEach(e=>e.classList.remove("focused"));
  n.el.classList.add("focused");
  flyTo(n.cx,n.cy,2.3);
  hideHint();
}
function fitAll(){
  const pad=90;
  const x0=Math.min(...NODES.map(n=>n.x))-pad, x1=Math.max(...NODES.map(n=>n.x+n.w))+pad;
  const y0=Math.min(...NODES.map(n=>n.y))-pad-40, y1=Math.max(...NODES.map(n=>n.y+n.h))+pad;
  S.z=Math.min(innerWidth/(x1-x0), innerHeight/(y1-y0), 1.1);
  S.x=innerWidth/2-(x0+x1)/2*S.z; S.y=innerHeight/2-(y0+y1)/2*S.z;
  document.querySelectorAll(".node.focused").forEach(e=>e.classList.remove("focused"));
  apply();
}

/* pointers: drag pan + pinch */
const ptrs=new Map(); let moved=false, downPos=null, pinchD0=0;
stage.addEventListener("pointerdown",e=>{
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){moved=false;downPos={x:e.clientX,y:e.clientY};stage.classList.add("dragging");}
  if(ptrs.size===2){const p=[...ptrs.values()];pinchD0=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}
});
stage.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){
    const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    if(downPos&&Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>6)moved=true;
    S.x+=dx; S.y+=dy; apply(); hideHintSoon();
  }else if(ptrs.size===2){
    const p=[...ptrs.values()];
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    const mx=(p[0].x+p[1].x)/2, my=(p[0].y+p[1].y)/2;
    if(pinchD0>0)zoomAt(mx,my,d/pinchD0);
    pinchD0=d; moved=true; hideHintSoon();
  }
});
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size===0)stage.classList.remove("dragging");}
stage.addEventListener("pointerup",endPtr); stage.addEventListener("pointercancel",endPtr);
stage.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.0016));hideHintSoon();},{passive:false});
stage.addEventListener("dblclick",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,1.6);});

/* ============ chrome ============ */
const hint=document.getElementById("hint"); let hintT=null;
function hideHint(){hint.style.opacity=0;}
function hideHintSoon(){clearTimeout(hintT);hintT=setTimeout(hideHint,2500);}
document.getElementById("zin").onclick=()=>{zoomAt(innerWidth/2,innerHeight/2,1.35);hideHint();};
document.getElementById("zout").onclick=()=>{zoomAt(innerWidth/2,innerHeight/2,1/1.35);hideHint();};
document.getElementById("zreset").onclick=()=>{fitAll();hideHint();};
addEventListener("keydown",e=>{
  if(e.key==="+"||e.key==="=")zoomAt(innerWidth/2,innerHeight/2,1.3);
  if(e.key==="-")zoomAt(innerWidth/2,innerHeight/2,1/1.3);
  if(e.key==="0")fitAll();
});
const idx=document.getElementById("index");
NODES.forEach(n=>{
  const b=document.createElement("button"); b.textContent=n.title;
  b.onclick=()=>{document.querySelectorAll(".node.focused").forEach(e=>e.classList.remove("focused"));
    n.el.classList.add("focused"); flyTo(n.cx,n.cy,1.7); hideHint();};
  idx.appendChild(b);
});
addEventListener("resize",apply);
fitAll();
setTimeout(hideHint,9000);
</script>
</body>
</html>
