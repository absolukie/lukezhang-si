<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Atlas — Meridian org pyramid</title>
<meta name="description" content="The Meridian org chart as a pyramid: CEO, 12 departments, ~100 teams, ~1,900 people. Zoom into any section and it opens up.">
<style>
  :root{ --bg:#08080a; --ink:#fafafa; --dim:#a1a1aa; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  #stage{position:fixed;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  #stage.dragging{cursor:grabbing}
  canvas{display:block}
  header{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;
    padding:14px 18px;pointer-events:none;z-index:5;gap:10px}
  .brand{pointer-events:auto;background:rgba(8,8,10,.72);backdrop-filter:blur(8px);
    border:1px solid #27272a;border-radius:12px;padding:8px 14px;font-size:14px;max-width:64vw}
  .brand b{font-size:15px}
  .brand span{color:var(--dim);font-size:12.5px}
  #crumb{margin-top:6px;font-size:12px;color:#d4d4d8;font-family:ui-monospace,Menlo,monospace;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
  .zoomctl{pointer-events:auto;display:flex;gap:8px;align-items:center;flex:none;
    background:rgba(8,8,10,.72);backdrop-filter:blur(8px);border:1px solid #27272a;border-radius:12px;padding:6px}
  .zoomctl button{touch-action:manipulation;width:36px;height:36px;border-radius:8px;border:1px solid #3f3f46;
    background:#18181b;color:#fafafa;font-size:18px;cursor:pointer;line-height:1}
  .zoomctl button:hover{background:#27272a}
  #index{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:4px;
    background:rgba(8,8,10,.72);backdrop-filter:blur(8px);border:1px solid #27272a;border-radius:14px;padding:10px;
    max-width:210px;max-height:70vh;overflow:auto}
  #index .cap{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:2px 6px}
  #index button{touch-action:manipulation;text-align:left;background:transparent;border:1px solid transparent;color:var(--ink);
    border-radius:8px;padding:6px 9px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
  #index button:hover{background:#18181b;border-color:#3f3f46}
  #index .dot{width:10px;height:10px;border-radius:50%;flex:none}
  #hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;white-space:nowrap;
    background:rgba(8,8,10,.72);backdrop-filter:blur(8px);border:1px solid #27272a;border-radius:999px;
    padding:9px 18px;font-size:13px;color:var(--dim);transition:opacity .6s;pointer-events:none}
  #hint b{color:var(--ink);font-weight:600}
  #count{position:fixed;left:12px;bottom:12px;z-index:5;font-size:11.5px;color:var(--dim);
    background:rgba(8,8,10,.72);border:1px solid #27272a;border-radius:999px;padding:6px 12px;font-family:ui-monospace,Menlo,monospace}
  #ver{position:fixed;right:12px;bottom:12px;z-index:5;font-size:11px;color:#52525b;font-family:ui-monospace,monospace}
  @media (max-width:640px){
    #index{display:none}
    #hint{font-size:11px;padding:8px 14px;bottom:52px}
    header{padding:10px 12px}
    .brand{max-width:calc(100vw - 150px)}
  }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<header>
  <div>
    <div class="brand"><b>Atlas</b> <span>· Meridian, a fictional fintech — the whole org as a pyramid. Zoom into any section and it opens up.</span></div>
    <div id="crumb" class="brand" style="margin-top:8px;display:inline-block">Meridian</div>
  </div>
  <div class="zoomctl">
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">−</button>
    <button id="zreset" aria-label="Reset view" style="font-size:13px;width:auto;padding:0 12px">reset</button>
  </div>
</header>

<nav id="index" aria-label="Jump to a department"><div class="cap">Departments</div></nav>
<div id="hint"><b>Scroll / pinch</b> to zoom &nbsp;·&nbsp; <b>drag</b> to pan &nbsp;·&nbsp; <b>click</b> selects, <b>double-click</b> dives</div>
<div id="count">– visible</div>
<div id="ver">v2026.10.02a</div>

<script>
"use strict";
/* ================= Meridian (fictional fintech), 1,904 people =================
   Static pyramid, 4 tiers: CEO → 12 departments → ~100 teams → ~1,790 people.
   Every person owns a horizontal segment; teams/depts center over their people.
   Zoom never reshapes the layout — it only changes what each node draws as:
   dots → blocks → cards → opened team grids. Click selects (no camera flight). */
const DEPTS=[
  ["Brokerage","SVP, Brokerage",["Equities Trading","Options Trading","Margin & Lending","Order Routing","Market Data","Clearing & Settlement","Corporate Actions","Fractional Shares"]],
  ["Crypto","SVP, Crypto",["Trading Engine","Wallet","Custody","Token Listings","Staking & Rewards","Crypto Compliance","Onchain Data","DeFi Integrations"]],
  ["Operations","COO",["Trade Operations","Reconciliation","Fraud Operations","Client Money Movement","Settlements","Vendor Management","Risk Operations","Treasury Ops"]],
  ["Engineering","CTO",["iOS","Android","Web","Backend Platform","Infrastructure","SRE","Developer Experience","Core Services"]],
  ["Product","CPO",["Invest Experience","Growth & Activation","Crypto Product","Cash & Banking","Platform Product","New Markets"]],
  ["Design","VP, Design",["Product Design","Brand Design","Design Systems","UX Research","Motion & Interaction"]],
  ["Marketing","CMO",["Brand Marketing","Performance Marketing","Content & Social","Communications","Lifecycle Marketing"]],
  ["Finance","CFO",["FP&A","Accounting","Treasury","Tax","Investor Relations","Procurement"]],
  ["Legal & Compliance","General Counsel",["Securities Counsel","Crypto Regulatory","Litigation","Compliance Testing","Privacy","Government Affairs"]],
  ["Customer Experience","VP, Customer Experience",["Support Operations","Trust & Safety","Escalations","Help Center","Community"]],
  ["Data","VP, Data",["Data Engineering","Analytics","Machine Learning","Experimentation","Data Governance"]],
  ["Security","CISO",["AppSec","Infrastructure Security","Detection & Response","Identity & Access","Red Team"]],
];
const FIRST=["James","Mary","John","Patricia","Robert","Jennifer","Michael","Linda","William","Elizabeth","David","Barbara","Richard","Susan","Joseph","Jessica","Thomas","Sarah","Charles","Karen","Christopher","Nancy","Daniel","Lisa","Matthew","Betty","Anthony","Margaret","Mark","Sandra","Donald","Ashley","Steven","Kimberly","Paul","Emily","Andrew","Donna","Joshua","Michelle","Kenneth","Laura","Kevin","Stephanie","Brian","Rebecca","George","Sharon"];
const LAST=["Smith","Johnson","Williams","Brown","Jones","Garcia","Miller","Davis","Rodriguez","Martinez","Hernandez","Lopez","Gonzalez","Wilson","Anderson","Thomas","Taylor","Moore","Jackson","Martin","Lee","Perez","Thompson","White","Harris","Sanchez","Clark","Ramirez","Lewis","Robinson","Walker","Young","Allen","King","Wright","Scott","Torres","Nguyen","Hill","Flores","Green","Adams","Nelson","Baker","Hall","Rivera","Campbell","Mitchell"];
const ROLES=["Software Engineer","Senior Software Engineer","Staff Engineer","Engineering Manager","Product Manager","Senior PM","Product Designer","Data Scientist","Data Analyst","QA Engineer","DevOps Engineer","Support Specialist","Account Executive","Marketing Manager","Recruiter","Financial Analyst","Security Engineer","Compliance Analyst","Operations Analyst","Designer","Tech Lead","Business Analyst","Customer Advocate","Risk Analyst"];

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const cache=new Map();
function rngFor(tag,path){return mulberry32(hashStr(tag+":"+path.join("/")));}
function makeNode(path){
  const key=path.join("/");
  if(cache.has(key))return cache.get(key);
  let n;
  if(path.length===0){
    n={path:[],level:0,parent:null,idx:-1,hue:45,kind:"ceo",name:"Ava Chen",title:"Chief Executive Officer",initials:"AC",kids:null};
  }else n=childrenOf(makeNode(path.slice(0,-1)))[path[path.length-1]];
  cache.set(key,n);return n;
}
function spanCount(p){
  const r=rngFor("span",p.path);
  if(p.level===0)return 12;
  if(p.level===1)return 7+Math.floor(r()*4);
  if(p.level===2)return 14+Math.floor(r()*8);
  return 0;
}
function childrenOf(p){
  if(p.kids)return p.kids;
  const k=spanCount(p),kids=[];
  for(let i=0;i<k;i++){
    const path=p.path.concat(i),level=path.length,top=path[0];
    const w=rngFor("who",path);
    const name=FIRST[Math.floor(w()*FIRST.length)]+" "+LAST[Math.floor(w()*LAST.length)];
    let kind,title,nm;
    if(level===1){kind="dept";const d=DEPTS[i];nm=d[0];title=d[1];
      kids.push({path,level,parent:p,idx:i,hue:top*30,kind,name:nm,title,lead:name,leadTitle:d[1],teams:d[2],kids:null,headcount:0});
    }else if(level===2){kind="team";const tnm=p.teams[i%p.teams.length];title="Head of "+tnm;
      kids.push({path,level,parent:p,idx:i,hue:top*30,kind,name:tnm,title,lead:name,leadTitle:title,kids:null,headcount:0});
    }else{kind="person";title=ROLES[Math.floor(w()*ROLES.length)];
      kids.push({path,level,parent:p,idx:i,hue:top*30,kind,name,title,initials:name.split(" ").map(s=>s[0]).join(""),kids:null});
    }
  }
  kids.forEach(c=>{if(c.kind!=="person"){let hc=0;childrenOf(c).forEach(g=>{hc+=g.kind==="person"?1:childrenOf(g).length;});c.headcount=hc;}});
  p.kids=kids;return kids;
}

/* ---------- static segment layout: every person owns a slice ---------- */
const PITCH=14, LAYER_Y=2600;
const _dpc={};
function deptPeople(d){if(_dpc[d]!==undefined)return _dpc[d];
  let s=0;const k=spanCount({path:[d],level:1});
  for(let j=0;j<k;j++)s+=spanCount({path:[d,j],level:2});
  _dpc[d]=s;return s;}
function deptStart(d){let s=0;for(let i=0;i<d;i++)s+=deptPeople(i);return s;}
function teamStart(d,j){let s=0;for(let t=0;t<j;t++)s+=spanCount({path:[d,t],level:2});return s;}
let N_PEOPLE=0;for(let d=0;d<12;d++)N_PEOPLE+=deptPeople(d);
const TOT_W=N_PEOPLE*PITCH;
const POS=new Map();
let TOTAL=0;
(function(){const seen=new Set();
  function pos(n){
    const p=n.path;let x,y;
    if(p.length===0){x=0;y=0;}
    else if(p.length===1){const i=p[0],c=deptPeople(i),s=deptStart(i);x=(s+c/2)*PITCH-TOT_W/2;y=LAYER_Y;}
    else if(p.length===2){const i=p[0],j=p[1],c=spanCount({path:[i,j],level:2}),s=deptStart(i)+teamStart(i,j);
      x=(s+c/2)*PITCH-TOT_W/2;y=2*LAYER_Y;}
    else{const i=p[0],j=p[1],k=p[2],g=deptStart(i)+teamStart(i,j)+k;
      x=(g+0.5)*PITCH-TOT_W/2;y=3*LAYER_Y;}
    POS.set(p.join("/"),{x:x,y:y});
  }
  (function walk(n){const k=n.path.join("/");if(seen.has(k))return;seen.add(k);
    TOTAL++;pos(n);childrenOf(n).forEach(walk);})(makeNode([]));})();
function P(n){return POS.get(n.path.join("/"));}

/* ---------- camera & canvas ---------- */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");
const crumb=document.getElementById("crumb"),countEl=document.getElementById("count"),hint=document.getElementById("hint");
let vw=0,vh=0;
function resize(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  vw=window.innerWidth;vh=window.innerHeight;
  cv.width=vw*dpr;cv.height=vh*dpr;cv.style.width=vw+"px";cv.style.height=vh+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);requestDraw();
}
window.addEventListener("resize",resize);
const S={x:0,y:0,z:0.05};
let drawQueued=false;
function requestDraw(){if(drawQueued)return;drawQueued=true;requestAnimationFrame(()=>{drawQueued=false;draw();});}
function zoomAt(cx,cy,f){
  const wx=(cx-S.x)/S.z,wy=(cy-S.y)/S.z;
  S.z=Math.min(8,Math.max(0.02,S.z*f));
  S.x=cx-wx*S.z;S.y=cy-wy*S.z;requestDraw();
}
function flyTo(wx,wy,z,dur){
  dur=dur||700;cancelAnimationFrame(flyTo.raf);
  const sx=S.x,sy=S.y,sz=S.z,tx=vw/2-wx*z,ty=vh*0.42-wy*z,t0=performance.now();
  (function step(t){
    let k=Math.min(1,(t-t0)/dur);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    S.x=sx+(tx-sx)*k;S.y=sy+(ty-sy)*k;S.z=sz*Math.pow(z/sz,k);
    draw();if(k<1)flyTo.raf=requestAnimationFrame(step);
  })(t0);
}
function fitOverview(){
  S.z=Math.min(vw/(TOT_W+800),vh/1100);
  S.x=vw/2;S.y=vh*0.46-1.5*LAYER_Y*S.z;draw();
}

/* ---------- draw ---------- */
let openTeams=[], drawnCount=0, selected=null;
function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function draw(){
  ctx.clearRect(0,0,vw,vh);
  ctx.fillStyle="#121216";
  const gs=44,ox=((S.x%gs)+gs)%gs,oy=((S.y%gs)+gs)%gs;
  for(let gx=ox;gx<vw;gx+=gs)for(let gy=oy;gy<vh;gy+=gs)ctx.fillRect(gx,gy,1.6,1.6);
  const z=S.z,X=wx=>wx*z+S.x,Y=wy=>wy*z+S.y;
  drawnCount=0;openTeams=[];
  const root=makeNode([]),depts=childrenOf(root);
  const inView=(sx,sy,m)=>sx>-m&&sx<vw+m&&sy>-m&&sy<vh+m;

  // faint layer guides
  ctx.strokeStyle="rgba(255,255,255,0.045)";ctx.lineWidth=1;ctx.beginPath();
  for(let L=0;L<4;L++){const yy=Y(L*LAYER_Y);if(yy>-40&&yy<vh+40){ctx.moveTo(0,yy);ctx.lineTo(vw,yy);}}
  ctx.stroke();

  // reporting lines: CEO->dept, dept->team (always)
  ctx.strokeStyle="rgba(255,255,255,0.10)";ctx.lineWidth=1;ctx.beginPath();
  depts.forEach(d=>{
    const dp=P(d),x1=X(0),y1=Y(0)+56*z,x2=X(dp.x),y2=Y(dp.y)-52*z,my=(y1+y2)/2;
    if(inView(x2,y2,300)){ctx.moveTo(x1,y1);ctx.lineTo(x1,my);ctx.lineTo(x2,my);ctx.lineTo(x2,y2);}
    childrenOf(d).forEach(t=>{
      const tp=P(t),a1=Y(dp.y)+52*z,a2=Y(tp.y)-48*z,am=(a1+a2)/2;
      const bx=X(tp.x);
      if(bx>-300&&bx<vw+300){ctx.moveTo(X(dp.x),a1);ctx.lineTo(X(dp.x),am);ctx.lineTo(bx,am);ctx.lineTo(bx,a2);}
    });
  });
  ctx.stroke();

  function card(n,w,h,fill){
    const p=P(n),sx=X(p.x),sy=Y(p.y),sw=w*z,sh=h*z;
    if(!inView(sx,sy,Math.max(sw,sh)))return null;
    drawn++;
    roundRect(sx-sw/2,sy-sh/2,sw,sh,Math.min(12,8*z+3));
    ctx.fillStyle=fill;ctx.fill();
    ctx.strokeStyle=(selected===n)?"#60a5fa":`hsla(${n.hue},70%,60%,0.5)`;
    ctx.lineWidth=(selected===n)?3:1.5;ctx.stroke();
    ctx.fillStyle=`hsl(${n.hue},70%,55%)`;
    const bw=Math.max(2,4*z);
    roundRect(sx-sw/2,sy-sh/2,bw,sh,Math.min(12,8*z+3));ctx.fill();
    return {sx:sx,sy:sy,sw:sw,sh:sh};
  }
  function text(str,x,y,px,color,weight){
    if(px<7)return;
    ctx.font=`${weight||500} ${px}px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif`;
    ctx.fillStyle=color;ctx.fillText(str,x,y);
  }

  // CEO
  {const n=root,r=card(n,280,112,"#1c1c22");
   if(r&&r.sw>110){ctx.textAlign="left";
     text(n.name,r.sx-r.sw/2+20*z,r.sy-6*z,Math.max(9,20*z),"#fafafa",700);
     text(n.title,r.sx-r.sw/2+20*z,r.sy+20*z,Math.max(8,12.5*z),"#a1a1aa");}}

  // departments + teams
  depts.forEach(d=>{
    const p=P(d),sx=X(p.x),sy=Y(p.y),sw=260*z,sh=104*z;
    if(inView(sx,sy,Math.max(sw,sh))){
      drawn++;
      if(sw<14){
        ctx.fillStyle=`hsl(${d.hue},60%,45%)`;ctx.fillRect(sx-sw/2,sy-3,sw,6);
      }else if(sw<130){
        roundRect(sx-sw/2,sy-sh/2,sw,sh,6);
        ctx.fillStyle=`hsl(${d.hue},50%,36%)`;ctx.fill();
      }else{
        const r=card(d,260,104,"#101014");
        if(r){ctx.textAlign="left";
          text(d.name,r.sx-r.sw/2+18*z,r.sy-8*z,Math.max(9,20*z),"#fafafa",700);
          text(d.lead+" · "+d.leadTitle,r.sx-r.sw/2+18*z,r.sy+18*z,Math.max(8,12.5*z),"#a1a1aa");
          text(d.headcount+" people",r.sx-r.sw/2+18*z,r.sy+36*z,Math.max(8,11*z),"#63636b");
        }
      }
      if(selected===d){ctx.strokeStyle="#60a5fa";ctx.lineWidth=3;
        ctx.strokeRect(sx-sw/2-4,sy-sh/2-4,sw+8,sh+8);}
    }
    childrenOf(d).forEach(t=>{
      const tp=P(t),tx=X(tp.x),ty=Y(tp.y),tw=230*z,th=96*z;
      if(!inView(tx,ty,Math.max(tw,th)))return;
      drawn++;
      const open=tw>340;
      if(open)openTeams.push(t);
      if(tw<10){
        ctx.fillStyle=`hsl(${t.hue},55%,42%)`;ctx.fillRect(tx-tw/2,ty-2.5,tw,5);
      }else if(tw<110){
        roundRect(tx-tw/2,ty-th/2,tw,th,5);
        ctx.fillStyle=`hsl(${t.hue},50%,34%)`;ctx.fill();
      }else{
        const r=card(t,230,96,"#101014");
        if(r){ctx.textAlign="left";
          text(t.name,r.sx-r.sw/2+16*z,r.sy-4*z,Math.max(9,17*z),"#fafafa",700);
          if(r.sw>200)text(t.headcount+" people",r.sx-r.sw/2+16*z,r.sy+22*z,Math.max(8,11*z),"#63636b");
        }
      }
      if(selected===t){ctx.strokeStyle="#60a5fa";ctx.lineWidth=3;
        ctx.strokeRect(tx-tw/2-4,ty-th/2-4,tw+8,th+8);}
    });
  });

  // people: dots, except inside opened teams (drawn as grids below)
  const openSet=new Set(openTeams);
  ctx.textAlign="left";
  depts.forEach(d=>childrenOf(d).forEach(t=>{
    if(openSet.has(t))return;
    const dotR=Math.max(1.6,Math.min(5,9*z));
    ctx.fillStyle=`hsl(${t.hue},60%,52%)`;
    childrenOf(t).forEach(k=>{
      const p=P(k),sx=X(p.x),sy=Y(p.y);
      if(sx<-10||sx>vw+10||sy<-10||sy>vh+10)return;
      drawn++;
      ctx.beginPath();ctx.arc(sx,sy,dotR,0,7);ctx.fill();
      if(selected===k){ctx.strokeStyle="#60a5fa";ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(sx,sy,dotR+3,0,7);ctx.stroke();}
    });
  }));

  // opened team grids
  t_grid_store.length=0;
  openTeams.forEach(t=>{
    const p=P(t),tx=X(p.x),ty=Y(p.y);
    const kids=childrenOf(t),n=kids.length,cols=5,rows=Math.ceil(n/cols);
    const gx=224*z,gy=114*z,gw=cols*gx,gh=rows*gy;
    const gx0=tx-gw/2,gy0=ty+95*z;
    roundRect(gx0-18*z,gy0-18*z,gw+36*z,gh+56*z,14);
    ctx.fillStyle="rgba(8,8,12,0.88)";ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,0.12)";ctx.lineWidth=1.5;ctx.stroke();
    // team->person lines
    ctx.strokeStyle="rgba(255,255,255,0.14)";ctx.lineWidth=1;ctx.beginPath();
    const lines=[];
    kids.forEach((k,i)=>{
      const col=i%cols,row=(i/cols)|0;
      const px=gx0+col*gx+gx/2,py=gy0+row*gy+gy/2+8*z;
      lines.push([px,py]);
      ctx.moveTo(tx,ty+48*z);ctx.lineTo(px,py-38*z);
    });
    ctx.stroke();
    kids.forEach((k,i)=>{
      const px=lines[i][0],py=lines[i][1],pw=190*z,ph=76*z;
      drawn++;
      roundRect(px-pw/2,py-ph/2,pw,ph,8);
      ctx.fillStyle="#141419";ctx.fill();
      ctx.strokeStyle=(selected===k)?"#60a5fa":`hsla(${k.hue},65%,60%,0.5)`;
      ctx.lineWidth=(selected===k)?3:1.5;ctx.stroke();
      const ar=Math.min(ph*0.3,24*z);
      ctx.beginPath();ctx.arc(px-pw/2+ar+10*z,py,ar,0,7);
      ctx.fillStyle=`hsl(${k.hue},60%,52%)`;ctx.fill();
      ctx.fillStyle="rgba(255,255,255,0.95)";
      ctx.font=`700 ${ar*0.85}px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif`;
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(k.initials,px-pw/2+ar+10*z,py+1);
      ctx.textAlign="left";ctx.textBaseline="alphabetic";
      text(k.name,px-pw/2+ar*2+18*z,py-3*z,Math.max(8,13*z),"#fafafa",600);
      text(k.title,px-pw/2+ar*2+18*z,py+15*z,Math.max(7,11*z),"#a1a1aa");
      t_grid_store.push({n:k,x:px,y:py,w:pw,h:ph});
    });
  });

  // breadcrumb
  const names=["Meridian"];
  if(selected){const ch=[];let q=selected;while(q&&q.level>0){ch.unshift(q.name);q=q.parent;}
    crumb.textContent="Meridian  /  "+ch.join("  /  ");}
  else crumb.textContent="Meridian";
  countEl.textContent=drawnCount.toLocaleString()+" drawn · "+TOTAL.toLocaleString()+" total";
}
const t_grid_store=[];

/* ---------- interaction: click selects, never flies ---------- */
let moved=false,downPos=null;const ptrs=new Map();let pinchD0=0;
function hitTest(cx,cy){
  for(const g of t_grid_store)
    if(Math.abs(cx-g.x)<g.w/2&&Math.abs(cy-g.y)<g.h/2)return g.n;
  const z=S.z;
  const depts=childrenOf(makeNode([]));
  for(const d of depts){
    const p=P(d),sx=p.x*z+S.x,sy=p.y*z+S.y,sw=260*z,sh=104*z;
    if(sw>24&&Math.abs(cx-sx)<sw/2&&Math.abs(cy-sy)<sh/2)return d;
    for(const t of childrenOf(d)){
      const tp=P(t),tx=tp.x*z+S.x,ty=tp.y*z+S.y,tw=230*z,th=96*z;
      if(tw>20&&Math.abs(cx-tx)<tw/2&&Math.abs(cy-ty)<th/2)return t;
    }
  }
  const r0x=S.x,r0y=S.y;
  if(280*z>24&&Math.abs(cx-r0x)<280*z/2&&Math.abs(cy-r0y)<112*z/2)return makeNode([]);
  return null;
}
stage.addEventListener("pointerdown",e=>{
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){moved=false;downPos={x:e.clientX,y:e.clientY};stage.classList.add("dragging");}
  if(ptrs.size===2){const p=[...ptrs.values()];pinchD0=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}
  cancelAnimationFrame(flyTo.raf);
});
stage.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){
    const dx=e.clientX-prev.x,dy=e.clientY-prev.y;
    if(downPos&&Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>6)moved=true;
    S.x+=dx;S.y+=dy;requestDraw();hideHintSoon();
  }else if(ptrs.size===2){
    const p=[...ptrs.values()];
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinchD0>0)zoomAt((p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2,d/pinchD0);
    pinchD0=d;moved=true;hideHintSoon();
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size===0)stage.classList.remove("dragging");
  if(!moved&&downPos&&e.type==="pointerup"){
    selected=hitTest(e.clientX,e.clientY); // select only — camera stays put
    requestDraw();
  }
}
stage.addEventListener("pointerup",endPtr);
stage.addEventListener("pointercancel",endPtr);
stage.addEventListener("wheel",e=>{e.preventDefault();cancelAnimationFrame(flyTo.raf);
  zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.0016));hideHintSoon();},{passive:false});
stage.addEventListener("dblclick",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,1.6);});
stage.addEventListener("contextmenu",e=>e.preventDefault());

let hintT=null;
function hideHint(){hint.style.opacity=0;}
function hideHintSoon(){clearTimeout(hintT);hintT=setTimeout(hideHint,2500);}
document.getElementById("zin").onclick=()=>{zoomAt(vw/2,vh/2,1.4);hideHint();};
document.getElementById("zout").onclick=()=>{zoomAt(vw/2,vh/2,1/1.4);hideHint();};
document.getElementById("zreset").onclick=()=>{selected=null;fitOverview();hideHint();};
window.addEventListener("keydown",e=>{
  if(e.key==="+"||e.key==="=")zoomAt(vw/2,vh/2,1.35);
  if(e.key==="-")zoomAt(vw/2,vh/2,1/1.35);
  if(e.key==="0"){selected=null;fitOverview();}
});
const idx=document.getElementById("index");
childrenOf(makeNode([])).forEach(d=>{
  const b=document.createElement("button");
  const dot=document.createElement("span");dot.className="dot";dot.style.background=`hsl(${d.hue},70%,55%)`;
  b.appendChild(dot);
  const t=document.createElement("span");t.textContent=d.name;
  b.appendChild(t);
  b.onclick=()=>{const p=P(d);selected=d;flyTo(p.x,p.y,1.15);hideHint();};
  idx.appendChild(b);
});

resize();fitOverview();
setTimeout(hideHint,10000);
</script>
</body>
</html>
