<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Atlas — the infinite pyramid</title>
<meta name="description" content="An infinite pyramid you scroll through forever: every block splits in two, rows go down without end.">
<style>
  :root{ --bg:#08080a; --ink:#fafafa; --dim:#a1a1aa; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  #stage{position:fixed;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  #stage.dragging{cursor:grabbing}
  canvas{display:block}
  header{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;
    padding:14px 18px;pointer-events:none;z-index:5;gap:10px}
  .brand{pointer-events:auto;background:rgba(8,8,10,.72);backdrop-filter:blur(8px);
    border:1px solid #27272a;border-radius:12px;padding:8px 14px;font-size:14px;max-width:64vw}
  .brand b{font-size:15px}
  .brand span{color:var(--dim);font-size:12.5px}
  #crumb{margin-top:6px;font-size:12px;color:#d4d4d8;font-family:ui-monospace,Menlo,monospace;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
  .zoomctl{pointer-events:auto;display:flex;gap:8px;align-items:center;flex:none;
    background:rgba(8,8,10,.72);backdrop-filter:blur(8px);border:1px solid #27272a;border-radius:12px;padding:6px}
  .zoomctl button{touch-action:manipulation;width:36px;height:36px;border-radius:8px;border:1px solid #3f3f46;
    background:#18181b;color:#fafafa;font-size:18px;cursor:pointer;line-height:1}
  .zoomctl button:hover{background:#27272a}
  #hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;white-space:nowrap;
    background:rgba(8,8,10,.72);backdrop-filter:blur(8px);border:1px solid #27272a;border-radius:999px;
    padding:9px 18px;font-size:13px;color:var(--dim);transition:opacity .6s;pointer-events:none}
  #hint b{color:var(--ink);font-weight:600}
  #depth{position:fixed;left:12px;bottom:12px;z-index:5;font-size:11.5px;color:var(--dim);
    background:rgba(8,8,10,.72);border:1px solid #27272a;border-radius:999px;padding:6px 12px;font-family:ui-monospace,Menlo,monospace}
  #ver{position:fixed;right:12px;bottom:12px;z-index:5;font-size:11px;color:#52525b;font-family:ui-monospace,monospace}
  @media (max-width:640px){
    #hint{font-size:11px;padding:8px 14px;bottom:52px}
    header{padding:10px 12px}
    .brand{max-width:calc(100vw - 150px)}
  }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<header>
  <div>
    <div class="brand"><b>Atlas</b> <span>· the infinite pyramid — scroll down, it never ends.</span></div>
    <div id="crumb" class="brand" style="margin-top:8px;display:inline-block">Meridian</div>
  </div>
  <div class="zoomctl">
    <button id="zin" aria-label="Scroll down">+</button>
    <button id="zout" aria-label="Scroll up">−</button>
    <button id="zreset" aria-label="Back to top" style="font-size:13px;width:auto;padding:0 12px">top</button>
  </div>
</header>

<div id="hint"><b>Scroll</b> to descend forever &nbsp;·&nbsp; <b>drag</b> to pan &nbsp;·&nbsp; <b>tap</b> a block to select</div>
<div id="depth">ROW 0 · ∞</div>
<div id="ver">v2026.10.02d</div>

<script>
"use strict";
/* ================ the infinite pyramid: infinite-scroll edition ================
   Row r holds 2^r blocks, rows go down forever. There is no bottom because
   nothing is stored: a block's name, headcount and color are pure functions
   of (row, index), so any row can be materialized on demand. Only the blocks
   intersecting the viewport are drawn. Scroll to descend, drag to pan,
   tap a block to select it (the camera never moves on tap). */
function hashNI(r,i){
  let h=(Math.imul(r|0,2654435761)^Math.imul(i>>>0,40503)^Math.imul((i/4294967296)|0,2246822519))>>>0;
  h^=h>>>15;h=Math.imul(h,0x85ebca6b)>>>0;h^=h>>>13;h=Math.imul(h,0xc2b2ae35)>>>0;h^=h>>>16;
  return h>>>0;
}
const DIRS=["North","South","East","West","Arctic","Pacific","Atlantic","Central","Harbor","Summit",
  "Delta","Crest","Beacon","Alpine","Coral","Ember","Frost","Grove","Haven","Juniper",
  "Kestrel","Lagoon","Meadow","Nimbus","Onyx","Prairie","Quarry","Ridgeline","Sable","Tundra"];
const SUF=["II","III","IV","V","VI","VII"];
function nameFor(r,i){
  if(r===0)return "Meridian";
  const h=hashNI(r,i);
  let s=DIRS[h%DIRS.length];
  if(((h>>>5)%3)===0)s+=" "+SUF[(h>>>7)%SUF.length];
  return s;
}
function headcountFor(r,i){
  if(r===0)return 1904;
  const h=hashNI(r,i);
  return 180+((h>>>4)%9800);
}
function hueFor(r,i){
  if(r===0)return 212;
  return 150+(hashNI(r,i)>>>9)%210;
}
function ancIndex(r,i,k){return Math.floor(i/Math.pow(2,r-k));} // index of the level-k ancestor

/* ---------- layout ---------- */
const BW=300,BH=110,GX=28,GY=64;
const PITCH=BW+GX, ROWH=BH+GY;
const MINY=-(BH+140);
function blockCX(r,i){const n=Math.pow(2,r);return (i-(n-1)/2)*PITCH;}
function blockCY(r){return r*ROWH;}

/* ---------- camera ---------- */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");
const crumb=document.getElementById("crumb"),depthEl=document.getElementById("depth"),hint=document.getElementById("hint");
let vw=0,vh=0;
let camX=0,camY=0,tX=0,tY=0;   // world coords at viewport top-left (+ smoothed targets)
let selected=null;             // {r,i} or null
function homeTargets(){return {x:-vw/2,y:-vh*0.14};}
function centerRow(){return Math.max(0,Math.round((tY+vh/2)/ROWH));}
function topRow(){return Math.max(0,Math.floor(tY/ROWH));}
function clampTargets(){
  if(tY<MINY)tY=MINY;
  const rc=centerRow(),halfW=Math.pow(2,rc)*PITCH/2;
  const lo=-halfW-vw+PITCH,hi=halfW-PITCH;
  tX=(lo>hi)?-vw/2:Math.min(hi,Math.max(lo,tX));
}
function goHome(){const h=homeTargets();tX=h.x;tY=h.y;camX=tX;camY=tY;selected=null;}

/* ---------- canvas ---------- */
function resize(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  vw=window.innerWidth;vh=window.innerHeight;
  cv.width=vw*dpr;cv.height=vh*dpr;cv.style.width=vw+"px";cv.style.height=vh+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  clampTargets();
}
window.addEventListener("resize",resize);

/* ---------- draw ---------- */
function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function visibleRows(){
  const r0=Math.max(0,Math.floor(camY/ROWH)-1);
  const r1=Math.ceil((camY+vh)/ROWH)+1;
  return [r0,r1];
}
function indexRange(r){
  const n=Math.pow(2,r),x0=-n*PITCH/2;
  const i0=Math.max(0,Math.floor((camX-x0)/PITCH)-1);
  const i1=Math.min(n-1,Math.ceil((camX+vw-x0)/PITCH)+1);
  return [i0,i1];
}
function draw(){
  ctx.clearRect(0,0,vw,vh);
  // dotted backdrop, parallaxes with the camera
  ctx.fillStyle="#121216";
  const gs=44;
  const ox=((-camX%gs)+gs)%gs,oy=((-camY%gs)+gs)%gs;
  for(let gx=ox;gx<vw;gx+=gs)for(let gy=oy;gy<vh;gy+=gs)ctx.fillRect(gx,gy,1.6,1.6);
  const X=wx=>wx-camX, Y=wy=>wy-camY;
  const [r0,r1]=visibleRows();
  // edges: child -> parent, one batched stroke
  ctx.strokeStyle="rgba(255,255,255,0.13)";ctx.lineWidth=1.5;ctx.beginPath();
  for(let r=Math.max(1,r0);r<=r1;r++){
    const [i0,i1]=indexRange(r);
    for(let i=i0;i<=i1;i++){
      const pi=Math.floor(i/2);
      ctx.moveTo(X(blockCX(r,i)),Y(blockCY(r)));
      ctx.lineTo(X(blockCX(r-1,pi)),Y(blockCY(r-1)+BH));
    }
  }
  ctx.stroke();
  // blocks
  for(let r=r0;r<=r1;r++){
    const [i0,i1]=indexRange(r);
    for(let i=i0;i<=i1;i++){
      const sx=X(blockCX(r,i)),sy=Y(blockCY(r));
      if(sx<-BW||sx>vw+BW||sy<-BH||sy>vh+BH)continue;
      drawBlock(r,i,sx,sy);
    }
  }
  // bottom fade: hints at infinity below
  const grd=ctx.createLinearGradient(0,vh-140,0,vh);
  grd.addColorStop(0,"rgba(8,8,10,0)");grd.addColorStop(1,"rgba(8,8,10,0.85)");
  ctx.fillStyle=grd;ctx.fillRect(0,vh-140,vw,140);
  // chrome
  if(selected){
    const names=[];
    for(let k=0;k<=selected.r;k++)names.push(nameFor(k,ancIndex(selected.r,selected.i,k)));
    crumb.textContent=(names.length>4?"… / "+names.slice(-3).join(" / "):names.join(" / "));
  }else{
    crumb.textContent="Meridian";
  }
  const rc=topRow(),label="ROW "+rc+" · ∞";
  if(depthEl.textContent!==label)depthEl.textContent=label;
}
function drawBlock(r,i,sx,sy){
  const nm=nameFor(r,i),hc=headcountFor(r,i),hue=hueFor(r,i);
  const sel=selected&&selected.r===r&&selected.i===i;
  roundRect(sx,sy,BW,BH,14);
  ctx.fillStyle="#101014";ctx.fill();
  ctx.strokeStyle=sel?"#60a5fa":`hsla(${hue},70%,60%,0.55)`;
  ctx.lineWidth=sel?3:1.5;ctx.stroke();
  ctx.fillStyle=`hsl(${hue},70%,55%)`;
  const bw=Math.max(2,BW*0.02);
  roundRect(sx,sy,bw,BH,14);ctx.fill();
  ctx.textAlign="left";ctx.textBaseline="alphabetic";
  ctx.font=`700 ${BW*0.075}px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif`;
  ctx.fillStyle="#fafafa";
  ctx.fillText(nm,sx+BW*0.07,sy+BH*0.42);
  ctx.font=`${BW*0.042}px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif`;
  ctx.fillStyle="#a1a1aa";
  ctx.fillText(hc.toLocaleString()+" people",sx+BW*0.07,sy+BH*0.72);
  ctx.textAlign="left";
}

/* ---------- interaction ---------- */
function hitTest(cx,cy){
  const [r0,r1]=visibleRows();
  for(let r=r0;r<=r1;r++){
    const [i0,i1]=indexRange(r);
    for(let i=i0;i<=i1;i++){
      const sx=blockCX(r,i)-camX,sy=blockCY(r)-camY;
      if(cx>=sx&&cx<=sx+BW&&cy>=sy&&cy<=sy+BH)return {r:r,i:i};
    }
  }
  return null;
}
let moved=false,downPos=null;const ptrs=new Map();
stage.addEventListener("pointerdown",e=>{
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){moved=false;downPos={x:e.clientX,y:e.clientY};stage.classList.add("dragging");}
  else moved=true;
});
stage.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){
    const dx=e.clientX-prev.x,dy=e.clientY-prev.y;
    if(downPos&&Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>6)moved=true;
    tX-=dx;tY-=dy;clampTargets();hideHintSoon();
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size===0)stage.classList.remove("dragging");
  if(!moved&&downPos&&e.type==="pointerup"){
    const hit=hitTest(e.clientX,e.clientY);
    selected=hit?{r:hit.r,i:hit.i}:null; // select only — the camera never moves on tap
  }
  downPos=null;
}
stage.addEventListener("pointerup",endPtr);
stage.addEventListener("pointercancel",endPtr);
stage.addEventListener("wheel",e=>{
  e.preventDefault();
  tX+=e.deltaX;tY+=e.deltaY;clampTargets();hideHintSoon();
},{passive:false});
stage.addEventListener("dblclick",e=>{
  e.preventDefault();
  const hit=hitTest(e.clientX,e.clientY);
  if(!hit)return;
  tX=blockCX(hit.r,hit.i)+BW/2-vw/2;
  tY=blockCY(hit.r,hit.i)+BH/2-vh/2;
  clampTargets();
});
stage.addEventListener("contextmenu",e=>e.preventDefault());

let hintT=null;
function hideHint(){hint.style.opacity=0;}
function hideHintSoon(){clearTimeout(hintT);hintT=setTimeout(hideHint,2500);}
function page(d){tY+=d*ROWH*3;clampTargets();hideHint();}
document.getElementById("zin").onclick=()=>page(1);
document.getElementById("zout").onclick=()=>page(-1);
document.getElementById("zreset").onclick=()=>{goHome();hideHint();};
window.addEventListener("keydown",e=>{
  if(e.key==="+"||e.key==="="||e.key==="ArrowDown"||e.key==="PageDown"||e.key===" ")page(1);
  else if(e.key==="-"||e.key==="ArrowUp"||e.key==="PageUp")page(-1);
  else if(e.key==="0"){goHome();}
});

/* ---------- main loop: ease the camera toward its target ---------- */
function frame(){
  const dx=tX-camX,dy=tY-camY;
  if(Math.abs(dx)>0.05||Math.abs(dy)>0.05){
    camX+=dx*0.18;camY+=dy*0.18;
  }else{camX=tX;camY=tY;}
  draw();
  requestAnimationFrame(frame);
}
resize();goHome();clampTargets();
requestAnimationFrame(frame);
setTimeout(hideHint,12000);
</script>
</body>
</html>
