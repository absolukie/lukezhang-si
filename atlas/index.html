<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Atlas — a graph that unfolds as you zoom</title>
<meta name="description" content="A 1,885-node graph. Zoomed out you see 12 nodes. Zoom into any node and it unfolds into 12 more. Keep going.">
<style>
  :root{ --bg:#08080a; --ink:#fafafa; --dim:#a1a1aa; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  #stage{position:fixed;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  #stage.dragging{cursor:grabbing}
  canvas{display:block}
  header{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;
    padding:14px 18px;pointer-events:none;z-index:5;gap:10px}
  .brand{pointer-events:auto;background:rgba(8,8,10,.72);backdrop-filter:blur(8px);
    border:1px solid #27272a;border-radius:12px;padding:8px 14px;font-size:14px;max-width:60vw}
  .brand b{font-size:15px}
  .brand span{color:var(--dim);font-size:12.5px}
  #crumb{margin-top:6px;font-size:12px;color:#d4d4d8;font-family:ui-monospace,Menlo,monospace;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
  .zoomctl{pointer-events:auto;display:flex;gap:8px;align-items:center;flex:none;
    background:rgba(8,8,10,.72);backdrop-filter:blur(8px);border:1px solid #27272a;border-radius:12px;padding:6px}
  .zoomctl button{touch-action:manipulation;width:36px;height:36px;border-radius:8px;border:1px solid #3f3f46;
    background:#18181b;color:#fafafa;font-size:18px;cursor:pointer;line-height:1}
  .zoomctl button:hover{background:#27272a}
  #index{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:4px;
    background:rgba(8,8,10,.72);backdrop-filter:blur(8px);border:1px solid #27272a;border-radius:14px;padding:10px;
    max-width:190px;max-height:70vh;overflow:auto}
  #index .cap{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:2px 6px}
  #index button{touch-action:manipulation;text-align:left;background:transparent;border:1px solid transparent;color:var(--ink);
    border-radius:8px;padding:6px 9px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
  #index button:hover{background:#18181b;border-color:#3f3f46}
  #index .dot{width:10px;height:10px;border-radius:50%;flex:none}
  #hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;white-space:nowrap;
    background:rgba(8,8,10,.72);backdrop-filter:blur(8px);border:1px solid #27272a;border-radius:999px;
    padding:9px 18px;font-size:13px;color:var(--dim);transition:opacity .6s;pointer-events:none}
  #hint b{color:var(--ink);font-weight:600}
  #count{position:fixed;left:12px;bottom:12px;z-index:5;font-size:11.5px;color:var(--dim);
    background:rgba(8,8,10,.72);border:1px solid #27272a;border-radius:999px;padding:6px 12px;font-family:ui-monospace,Menlo,monospace}
  #ver{position:fixed;right:12px;bottom:12px;z-index:5;font-size:11px;color:#52525b;font-family:ui-monospace,monospace}
  @media (max-width:640px){
    #index{display:none}
    #hint{font-size:11px;padding:8px 14px;bottom:52px}
    header{padding:10px 12px}
    .brand{max-width:calc(100vw - 150px)}
  }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<header>
  <div>
    <div class="brand"><b>Atlas</b> <span>· a 1,885-node generated graph — zoom in and it keeps unfolding</span></div>
    <div id="crumb" class="brand" style="margin-top:8px;display:inline-block">acme-app</div>
  </div>
  <div class="zoomctl">
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">−</button>
    <button id="zreset" aria-label="Reset view" style="font-size:13px;width:auto;padding:0 12px">reset</button>
  </div>
</header>

<nav id="index" aria-label="Jump to a subsystem"><div class="cap">Jump to</div></nav>
<div id="hint"><b>Drag</b> to move &nbsp;·&nbsp; <b>scroll / pinch</b> to zoom &nbsp;·&nbsp; <b>click a node</b> to dive in</div>
<div id="count">– visible · 1,885 total</div>
<div id="ver">v2026.10.01b</div>

<script>
"use strict";
/* ================= graph model =================
   Root (level 0) → 12 subsystems (L1) → 12 modules each (L2)
   → 12 leaves each (L3). 1 + 12 + 144 + 1728 = 1,885 nodes.
   A node's position is a pure function of its path, so any
   node can be materialized without building the whole tree. */
const BRANCH = 12, MAX_LEVEL = 3, ROOT_R = 12000, CHILD_F = 0.21;
const EXPAND_PX = 110, LABEL_PX = 24;
const SUBS = ["auth","billing","feed","search","media","chat","notify","analytics","growth","platform","safety","api"];
const WORDS = ["core","gateway","worker","sync","index","store","cache","queue","stream","batch","ledger","vault",
  "beacon","relay","forge","scout","lens","pulse","harbor","cipher","drift","ember","flux","grove","halo","iris",
  "koda","lumen","mesa","onyx","prism","ridge","spark","tide","umbra","vale","wisp","zephyr","anchor","bravo",
  "cobalt","delta","echo","flint","garnet","helios","ion","juniper","krypton"];
const EXTS = ["ts","ts","js","py","go","tsx"];

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const cache = new Map();

function makeNode(path){
  const key = path.join("/");
  if(cache.has(key)) return cache.get(key);
  const level = path.length; // 0=root … 3=leaf
  let n;
  if(level===0){
    n = {path:[],level:0,x:0,y:0,r:ROOT_R,parent:null,idx:-1,hue:0,label:"acme-app",kids:null,links:null};
  }else{
    const parent = makeNode(path.slice(0,-1));
    const kids = childrenOf(parent);
    n = kids[path[path.length-1]];
  }
  cache.set(key,n); return n;
}
function childrenOf(p){
  if(p.kids) return p.kids;
  if(p.level>=MAX_LEVEL){ p.kids=[]; return p.kids; }
  const rng = mulberry32(hashStr("kids:"+p.path.join("/")));
  const cr = p.r*CHILD_F, ringD = p.r-cr, off = rng()*Math.PI*2;
  const kids=[];
  for(let i=0;i<BRANCH;i++){
    let x,y;
    if(i===0){ x=p.x; y=p.y; }
    else{ const a=off+(i-1)*(Math.PI*2/(BRANCH-1)); x=p.x+Math.cos(a)*ringD; y=p.y+Math.sin(a)*ringD; }
    const path=p.path.concat(i);
    const lrng=mulberry32(hashStr("n:"+path.join("/")));
    let label,hue;
    const top = path[0];
    hue = top*30;
    if(path.length===1) label=SUBS[i];
    else if(path.length===2) label=SUBS[top]+"."+WORDS[Math.floor(lrng()*WORDS.length)];
    else label=WORDS[Math.floor(lrng()*WORDS.length)]+"."+EXTS[Math.floor(lrng()*EXTS.length)];
    kids.push({path,level:path.length,x,y,r:cr,parent:p,idx:i,hue,label,kids:null,links:null,
      seed:Math.floor(lrng()*1e9)});
  }
  p.kids=kids; return kids;
}
function linksOf(n){
  if(n.links) return n.links;
  n.links=[];
  if(n.level===0) return n.links;
  const rng=mulberry32(hashStr("links:"+n.path.join("/")));
  const count = rng()<0.7?1:2;
  for(let k=0;k<count;k++){
    const tp=n.path.slice();
    let ti=Math.floor(rng()*BRANCH);
    if(ti===tp[0]) ti=(ti+1)%BRANCH;
    tp[0]=ti;
    for(let d=1;d<tp.length;d++) tp[d]=Math.floor(rng()*BRANCH);
    n.links.push(makeNode(tp));
  }
  return n.links;
}

/* ================= camera & canvas ================= */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d"), stage=document.getElementById("stage");
const crumb=document.getElementById("crumb"), countEl=document.getElementById("count"), hint=document.getElementById("hint");
let vw=0,vh=0,dpr=1;
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  vw=window.innerWidth; vh=window.innerHeight;
  cv.width=vw*dpr; cv.height=vh*dpr; cv.style.width=vw+"px"; cv.style.height=vh+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener("resize",resize);

const S={x:0,y:0,z:0.03}; // pan (px) + zoom
function zoomAt(cx,cy,f){
  const wx=(cx-S.x)/S.z, wy=(cy-S.y)/S.z;
  S.z=Math.min(8,Math.max(0.008,S.z*f));
  S.x=cx-wx*S.z; S.y=cy-wy*S.z; draw();
}
function flyTo(wx,wy,z,dur){
  dur=dur||650;
  const sx=S.x,sy=S.y,sz=S.z, tx=vw/2-wx*z, ty=vh/2-wy*z, t0=performance.now();
  cancelAnimationFrame(flyTo.raf);
  (function step(t){
    let k=Math.min(1,(t-t0)/dur); k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    S.x=sx+(tx-sx)*k; S.y=sy+(ty-sy)*k; S.z=sz*Math.pow(z/sz,k);
    draw(); if(k<1) flyTo.raf=requestAnimationFrame(step);
  })(t0);
}
function fitRoot(){ S.z=Math.min(vw,vh)/(2*ROOT_R*1.06); S.x=vw/2; S.y=vh/2; draw(); }

/* ================= visibility: expand frontier ================= */
let visible=[];
function computeVisible(){
  visible=[];
  const root=makeNode([]);
  (function visit(n){
    const sr=n.r*S.z, sx=n.x*S.z+S.x, sy=n.y*S.z+S.y;
    if(sx+sr<-60||sx-sr>vw+60||sy+sr<-60||sy-sr>vh+60) return;
    n._sr=sr; n._sx=sx; n._sy=sy;
    n._expanded = n.level<MAX_LEVEL && (n.level===0 || sr>EXPAND_PX);
    visible.push(n);
    if(n._expanded) childrenOf(n).forEach(visit);
  })(root);
}

/* ================= draw ================= */
function draw(){
  computeVisible();
  ctx.clearRect(0,0,vw,vh);
  // faint dot grid for orientation (screen space)
  ctx.fillStyle="#17171b";
  const gs=44;
  for(let gx=(S.x%gs+gs)%gs; gx<vw; gx+=gs)
    for(let gy=(S.y%gs+gs)%gs; gy<vh; gy+=gs)
      ctx.fillRect(gx,gy,1.6,1.6);

  const visSet=new Set(visible);
  // ancestor boundary rings (walk up from each visible node)
  ctx.setLineDash([7,7]);
  visible.forEach(n=>{
    let p=n.parent;
    while(p){ if(p._sr!==undefined && p._sr<40000){
      ctx.strokeStyle="rgba(255,255,255,0.06)"; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(p._sx,p._sy,p._sr,0,Math.PI*2); ctx.stroke();
    } p=p.parent; }
  });
  ctx.setLineDash([]);

  // parent→child edges
  ctx.strokeStyle="rgba(255,255,255,0.10)"; ctx.lineWidth=1;
  visible.forEach(n=>{
    if(!n.parent||!visSet.has(n.parent)) return;
    ctx.beginPath(); ctx.moveTo(n.parent._sx,n.parent._sy); ctx.lineTo(n._sx,n._sy); ctx.stroke();
  });
  // cross links (draw once)
  ctx.strokeStyle="rgba(96,165,250,0.20)"; ctx.lineWidth=1;
  const drawn=new Set();
  visible.forEach(n=>{
    linksOf(n).forEach(t=>{
      if(!visSet.has(t)) return;
      const k=n.path.join("/")+"|"+t.path.join("/");
      const k2=t.path.join("/")+"|"+n.path.join("/");
      if(drawn.has(k)||drawn.has(k2)) return;
      drawn.add(k);
      const mx=(n._sx+t._sx)/2, my=(n._sy+t._sy)/2-24;
      ctx.beginPath(); ctx.moveTo(n._sx,n._sy); ctx.quadraticCurveTo(mx,my,t._sx,t._sy); ctx.stroke();
    });
  });
  // nodes (parents first → children on top)
  visible.forEach(n=>{
    const sr=Math.max(1.2,n._sr);
    const L=n.level===1?56:n.level===2?48:42;
    ctx.beginPath(); ctx.arc(n._sx,n._sy,sr,0,Math.PI*2);
    ctx.fillStyle=n.level===0?"rgba(255,255,255,0.03)":`hsl(${n.hue},62%,${L}%)`;
    ctx.fill();
    if(n.level>0){ ctx.strokeStyle="rgba(0,0,0,0.4)"; ctx.lineWidth=1.5; ctx.stroke(); }
    if(n._focused){ ctx.strokeStyle="#60a5fa"; ctx.lineWidth=3; ctx.stroke(); }
  });
  // labels
  ctx.textAlign="center";
  visible.forEach(n=>{
    if(n.level===0||n._sr<LABEL_PX) return;
    const fs=n._sr>200?15:12;
    ctx.font=`500 ${fs}px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif`;
    ctx.lineWidth=4; ctx.strokeStyle="rgba(8,8,10,0.85)";
    const ly=n._sy+n._sr+fs+6;
    ctx.strokeText(n.label,n._sx,ly); ctx.fillStyle="#e7e7ea"; ctx.fillText(n.label,n._sx,ly);
  });

  // breadcrumb: deepest expanded node containing viewport center
  let b=makeNode([]);
  while(b._expanded){
    const kids=childrenOf(b);
    const hit=kids.find(k=>{const dx=vw/2-k._sx,dy=vh/2-k._sy;return dx*dx+dy*dy<k._sr*k._sr;});
    if(!hit) break; b=hit;
  }
  const names=[]; let q=b; while(q){names.unshift(q.label); q=q.parent;}
  crumb.textContent=names.join(" / ");
  countEl.textContent=`${visible.length} visible · 1,885 total`;
}

/* ================= interaction ================= */
let moved=false,downPos=null; const ptrs=new Map(); let pinchD0=0;
function clearFocus(){visible.forEach(n=>n._focused=false);}
stage.addEventListener("pointerdown",e=>{
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){moved=false;downPos={x:e.clientX,y:e.clientY};stage.classList.add("dragging");}
  if(ptrs.size===2){const p=[...ptrs.values()];pinchD0=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}
  cancelAnimationFrame(flyTo.raf);
});
stage.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){
    const dx=e.clientX-prev.x,dy=e.clientY-prev.y;
    if(downPos&&Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>6)moved=true;
    S.x+=dx;S.y+=dy;draw();hideHintSoon();
  }else if(ptrs.size===2){
    const p=[...ptrs.values()];
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinchD0>0)zoomAt((p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2,d/pinchD0);
    pinchD0=d;moved=true;hideHintSoon();
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size===0)stage.classList.remove("dragging");
  if(!moved&&downPos&&e.type==="pointerup"){
    // click: dive into topmost node under cursor
    const wx=(e.clientX-S.x)/S.z, wy=(e.clientY-S.y)/S.z;
    for(let i=visible.length-1;i>=0;i--){
      const n=visible[i];
      if(n.level===0)continue;
      const dx=wx-n.x,dy=wy-n.y;
      if(dx*dx+dy*dy<n.r*n.r){
        clearFocus(); n._focused=true;
        const tz=n.level<MAX_LEVEL?Math.min(8,190/n.r):Math.min(8,320/n.r);
        flyTo(n.x,n.y,tz); hideHint(); draw(); break;
      }
    }
  }
}
stage.addEventListener("pointerup",endPtr);
stage.addEventListener("pointercancel",endPtr);
stage.addEventListener("wheel",e=>{e.preventDefault();cancelAnimationFrame(flyTo.raf);
  zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.0016));hideHintSoon();},{passive:false});
stage.addEventListener("dblclick",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,1.7);});
stage.addEventListener("contextmenu",e=>e.preventDefault());

let hintT=null;
function hideHint(){hint.style.opacity=0;}
function hideHintSoon(){clearTimeout(hintT);hintT=setTimeout(hideHint,2500);}
document.getElementById("zin").onclick=()=>{zoomAt(vw/2,vh/2,1.4);hideHint();};
document.getElementById("zout").onclick=()=>{zoomAt(vw/2,vh/2,1/1.4);hideHint();};
document.getElementById("zreset").onclick=()=>{clearFocus();fitRoot();hideHint();};
window.addEventListener("keydown",e=>{
  if(e.key==="+"||e.key==="=")zoomAt(vw/2,vh/2,1.35);
  if(e.key==="-")zoomAt(vw/2,vh/2,1/1.35);
  if(e.key==="0"){clearFocus();fitRoot();}
});
const idx=document.getElementById("index");
childrenOf(makeNode([])).forEach(n=>{
  const b=document.createElement("button");
  const d=document.createElement("span");d.className="dot";d.style.background=`hsl(${n.hue},62%,56%)`;
  b.appendChild(d); b.appendChild(document.createTextNode(n.label));
  b.onclick=()=>{clearFocus();n._focused=true;flyTo(n.x,n.y,Math.min(8,200/n.r));hideHint();};
  idx.appendChild(b);
});

resize(); fitRoot();
setTimeout(hideHint,10000);
</script>
</body>
</html>
