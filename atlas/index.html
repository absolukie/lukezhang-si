<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Atlas — Meridian org chart</title>
<meta name="description" content="The org chart of Meridian, a fictional fintech. Zoomed out: departments. Zoom in: teams unfold, then people.">
<style>
  :root{ --bg:#08080a; --ink:#fafafa; --dim:#a1a1aa; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  #stage{position:fixed;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  #stage.dragging{cursor:grabbing}
  canvas{display:block}
  header{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;
    padding:14px 18px;pointer-events:none;z-index:5;gap:10px}
  .brand{pointer-events:auto;background:rgba(8,8,10,.72);backdrop-filter:blur(8px);
    border:1px solid #27272a;border-radius:12px;padding:8px 14px;font-size:14px;max-width:62vw}
  .brand b{font-size:15px}
  .brand span{color:var(--dim);font-size:12.5px}
  #crumb{margin-top:6px;font-size:12px;color:#d4d4d8;font-family:ui-monospace,Menlo,monospace;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58vw}
  .zoomctl{pointer-events:auto;display:flex;gap:8px;align-items:center;flex:none;
    background:rgba(8,8,10,.72);backdrop-filter:blur(8px);border:1px solid #27272a;border-radius:12px;padding:6px}
  .zoomctl button{touch-action:manipulation;width:36px;height:36px;border-radius:8px;border:1px solid #3f3f46;
    background:#18181b;color:#fafafa;font-size:18px;cursor:pointer;line-height:1}
  .zoomctl button:hover{background:#27272a}
  #index{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:4px;
    background:rgba(8,8,10,.72);backdrop-filter:blur(8px);border:1px solid #27272a;border-radius:14px;padding:10px;
    max-width:210px;max-height:70vh;overflow:auto}
  #index .cap{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:2px 6px}
  #index button{touch-action:manipulation;text-align:left;background:transparent;border:1px solid transparent;color:var(--ink);
    border-radius:8px;padding:6px 9px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
  #index button:hover{background:#18181b;border-color:#3f3f46}
  #index .dot{width:10px;height:10px;border-radius:50%;flex:none}
  #hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;white-space:nowrap;
    background:rgba(8,8,10,.72);backdrop-filter:blur(8px);border:1px solid #27272a;border-radius:999px;
    padding:9px 18px;font-size:13px;color:var(--dim);transition:opacity .6s;pointer-events:none}
  #hint b{color:var(--ink);font-weight:600}
  #count{position:fixed;left:12px;bottom:12px;z-index:5;font-size:11.5px;color:var(--dim);
    background:rgba(8,8,10,.72);border:1px solid #27272a;border-radius:999px;padding:6px 12px;font-family:ui-monospace,Menlo,monospace}
  #ver{position:fixed;right:12px;bottom:12px;z-index:5;font-size:11px;color:#52525b;font-family:ui-monospace,monospace}
  @media (max-width:640px){
    #index{display:none}
    #hint{font-size:11px;padding:8px 14px;bottom:52px}
    header{padding:10px 12px}
    .brand{max-width:calc(100vw - 150px)}
  }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<header>
  <div>
    <div class="brand"><b>Atlas</b> <span>· Meridian, a fictional fintech — zoomed out: departments. Zoom in: teams unfold, then people.</span></div>
    <div id="crumb" class="brand" style="margin-top:8px;display:inline-block">Meridian</div>
  </div>
  <div class="zoomctl">
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">−</button>
    <button id="zreset" aria-label="Reset view" style="font-size:13px;width:auto;padding:0 12px">reset</button>
  </div>
</header>

<nav id="index" aria-label="Jump to a department"><div class="cap">Departments</div></nav>
<div id="hint"><b>Click a card</b> to unfold its team &nbsp;·&nbsp; <b>scroll / pinch</b> to zoom &nbsp;·&nbsp; <b>drag</b> to pan</div>
<div id="count">– visible</div>
<div id="ver">v2026.10.01e</div>

<script>
"use strict";
/* ================= Meridian (fictional fintech) =================
   CEO → 12 departments → 7–10 teams each → 14–21 people each.
   Classic top-down pyramid. Click a card to unfold its subtree;
   deep zoom auto-unfolds too. Layout is recomputed only when the
   expand-set changes; collapsed subtrees take one card of width. */
const HGAP=28, VGAP=130;
const CARD={0:[270,108],1:[250,100],2:[220,92],3:[180,72]};
const DEPTS=[
  ["Brokerage","SVP, Brokerage",["Equities Trading","Options Trading","Margin & Lending","Order Routing","Market Data","Clearing & Settlement","Corporate Actions","Fractional Shares"]],
  ["Crypto","SVP, Crypto",["Trading Engine","Wallet","Custody","Token Listings","Staking & Rewards","Crypto Compliance","Onchain Data","DeFi Integrations"]],
  ["Operations","COO",["Trade Operations","Reconciliation","Fraud Operations","Client Money Movement","Settlements","Vendor Management","Risk Operations","Treasury Ops"]],
  ["Engineering","CTO",["iOS","Android","Web","Backend Platform","Infrastructure","SRE","Developer Experience","Core Services"]],
  ["Product","CPO",["Invest Experience","Growth & Activation","Crypto Product","Cash & Banking","Platform Product","New Markets"]],
  ["Design","VP, Design",["Product Design","Brand Design","Design Systems","UX Research","Motion & Interaction"]],
  ["Marketing","CMO",["Brand Marketing","Performance Marketing","Content & Social","Communications","Lifecycle Marketing"]],
  ["Finance","CFO",["FP&A","Accounting","Treasury","Tax","Investor Relations","Procurement"]],
  ["Legal & Compliance","General Counsel",["Securities Counsel","Crypto Regulatory","Litigation","Compliance Testing","Privacy","Government Affairs"]],
  ["Customer Experience","VP, Customer Experience",["Support Operations","Trust & Safety","Escalations","Help Center","Community"]],
  ["Data","VP, Data",["Data Engineering","Analytics","Machine Learning","Experimentation","Data Governance"]],
  ["Security","CISO",["AppSec","Infrastructure Security","Detection & Response","Identity & Access","Red Team"]],
];
const FIRST=["James","Mary","John","Patricia","Robert","Jennifer","Michael","Linda","William","Elizabeth","David","Barbara","Richard","Susan","Joseph","Jessica","Thomas","Sarah","Charles","Karen","Christopher","Nancy","Daniel","Lisa","Matthew","Betty","Anthony","Margaret","Mark","Sandra","Donald","Ashley","Steven","Kimberly","Paul","Emily","Andrew","Donna","Joshua","Michelle","Kenneth","Laura","Kevin","Stephanie","Brian","Rebecca","George","Sharon"];
const LAST=["Smith","Johnson","Williams","Brown","Jones","Garcia","Miller","Davis","Rodriguez","Martinez","Hernandez","Lopez","Gonzalez","Wilson","Anderson","Thomas","Taylor","Moore","Jackson","Martin","Lee","Perez","Thompson","White","Harris","Sanchez","Clark","Ramirez","Lewis","Robinson","Walker","Young","Allen","King","Wright","Scott","Torres","Nguyen","Hill","Flores","Green","Adams","Nelson","Baker","Hall","Rivera","Campbell","Mitchell"];
const ROLES=["Software Engineer","Senior Software Engineer","Staff Engineer","Engineering Manager","Product Manager","Senior PM","Product Designer","Data Scientist","Data Analyst","QA Engineer","DevOps Engineer","Support Specialist","Account Executive","Marketing Manager","Recruiter","Financial Analyst","Security Engineer","Compliance Analyst","Operations Analyst","Designer","Tech Lead","Business Analyst","Customer Advocate","Risk Analyst","Engineering Manager"];

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const cache=new Map();
function rngFor(tag,path){return mulberry32(hashStr(tag+":"+path.join("/")));}

function makeNode(path){
  const key=path.join("/");
  if(cache.has(key))return cache.get(key);
  let n;
  if(path.length===0){
    n={path:[],level:0,parent:null,idx:-1,hue:45,kind:"ceo",
       name:"Ava Chen",title:"Chief Executive Officer",initials:"AC",kids:null};
  }else{
    n=childrenOf(makeNode(path.slice(0,-1)))[path[path.length-1]];
  }
  cache.set(key,n);return n;
}
function spanCount(p){
  const r=rngFor("span",p.path);
  if(p.level===0)return 12;
  if(p.level===1)return 7+Math.floor(r()*4);   // 7–10 teams
  if(p.level===2)return 14+Math.floor(r()*8);  // 14–21 people
  return 0;
}
function childrenOf(p){
  if(p.kids)return p.kids;
  const k=spanCount(p),kids=[];
  for(let i=0;i<k;i++){
    const path=p.path.concat(i),level=path.length,top=path[0];
    const w=rngFor("who",path);
    const name=FIRST[Math.floor(w()*FIRST.length)]+" "+LAST[Math.floor(w()*LAST.length)];
    let kind,name2,title,hue=top*30;
    if(level===1){
      kind="dept";const d=DEPTS[i];
      name2=d[0];title=name+" · "+d[1];
      kids.push({path,level,parent:p,idx:i,hue,kind,name:name2,title,lead:name,leadTitle:d[1],
                 teams:d[2],kids:null,headcount:0});
    }else if(level===2){
      kind="team";const tname=p.teams[i%p.teams.length];
      title="Head of "+tname;
      kids.push({path,level,parent:p,idx:i,hue,kind,name:tname,title,lead:name,leadTitle:title,
                 kids:null,headcount:0});
    }else{
      kind="person";
      title=ROLES[Math.floor(w()*ROLES.length)];
      kids.push({path,level,parent:p,idx:i,hue,kind,name,title,
                 initials:name.split(" ").map(s=>s[0]).join(""),kids:null});
    }
  }
  // headcounts (people under each dept/team)
  kids.forEach(c=>{ if(c.kind!=="person"){let hc=0;childrenOf(c).forEach(g=>{hc+=g.kind==="person"?1:childrenOf(g).length;});c.headcount=hc;} });
  p.kids=kids;return kids;
}
let TOTAL=0;
(function(){const seen=new Set();(function walk(n){const k=n.path.join("/");
  if(seen.has(k))return;seen.add(k);TOTAL++;childrenOf(n).forEach(walk);})(makeNode([]));})();

/* ================= expand state + layout ================= */
const pinned=new Set(); // path keys manually unfolded
function autoExpanded(n){
  if(n.level===0)return true;
  if(n.level===1)return CARD[1][0]*S.z>210;
  if(n.level===2)return CARD[2][0]*S.z>320;
  return false;
}
function isExpanded(n){
  if(n.level>=3)return false;
  const k=n.path.join("/");
  if(pinned.has(k))return true;
  return autoExpanded(n);
}
let POS=new Map(), layoutBand="";
function band(){ // layout only changes when these change
  return (S.z>0.84?"B":"A")+(S.z>1.45?"C":"");
}
function relayout(){
  const widths=new Map();
  function width(n){
    const k=n.path.join("/");
    if(widths.has(k))return widths.get(k);
    let w;
    if(isExpanded(n)){
      const kids=childrenOf(n);
      w=kids.reduce((s,c)=>s+width(c),0)+HGAP*(kids.length-1);
      w=Math.max(w,CARD[n.level][0]);
    }else w=CARD[n.level][0];
    widths.set(k,w);return w;
  }
  POS=new Map();
  function place(n,cx,y){
    POS.set(n.path.join("/"),{x:cx,y:y});
    if(!isExpanded(n))return;
    const kids=childrenOf(n);
    const total=kids.reduce((s,c)=>s+width(c),0)+HGAP*(kids.length-1);
    let x=cx-total/2;
    kids.forEach(c=>{const w=width(c);place(c,x+w/2,y+CARD[n.level][1]+VGAP);x+=w+HGAP;});
  }
  const root=makeNode([]);
  width(root);place(root,0,0);
  layoutBand=band()+":"+pinned.size;
}
function nodePos(n){const p=POS.get(n.path.join("/"));return p;}
function ensureLayout(){
  const b=band()+":"+pinned.size;
  if(b!==layoutBand)relayout();
}

/* ================= camera & canvas ================= */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");
const crumb=document.getElementById("crumb"),countEl=document.getElementById("count"),hint=document.getElementById("hint");
let vw=0,vh=0;
function resize(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  vw=window.innerWidth;vh=window.innerHeight;
  cv.width=vw*dpr;cv.height=vh*dpr;cv.style.width=vw+"px";cv.style.height=vh+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);requestDraw();
}
window.addEventListener("resize",resize);
const S={x:0,y:0,z:0.4};
let drawQueued=false;
function requestDraw(){if(drawQueued)return;drawQueued=true;requestAnimationFrame(()=>{drawQueued=false;draw();});}
function zoomAt(cx,cy,f){
  const anchor=nodeAt(cx,cy); // card under the cursor before anything moves
  const akey=anchor?anchor.path.join("/"):"";
  const nz=Math.min(6,Math.max(0.05,S.z*f));
  const wx=(cx-S.x)/S.z,wy=(cy-S.y)/S.z;
  S.z=nz;S.x=cx-wx*nz;S.y=cy-wy*nz;
  ensureLayout();
  // layout may have reshaped (auto unfold/collapse): keep the anchor glued to the cursor
  if(anchor){
    let n=anchor,k=akey;
    while(n&&!POS.has(k)){k=k.split("/").slice(0,-1).join("/");n=n.parent;}
    const p=POS.get(k);
    if(p){S.x=cx-p.x*S.z;S.y=cy-p.y*S.z;}
  }
  requestDraw();
}
// fly to a node; target re-resolved every frame so mid-flight layout changes track it
function flyToNode(n,z,dur){
  dur=dur||700;cancelAnimationFrame(flyToNode.raf);
  const sz=S.z,t0=performance.now(),key=n.path.join("/");
  (function step(t){
    ensureLayout();
    const p=POS.get(key);if(!p)return;
    const tx=vw/2-p.x*z,ty=vh*0.32-p.y*z;
    let k=Math.min(1,(t-t0)/dur);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    const first=t===t0;
    if(first){flyToNode.sx=S.x;flyToNode.sy=S.y;}
    S.x=flyToNode.sx+(tx-flyToNode.sx)*k;
    S.y=flyToNode.sy+(ty-flyToNode.sy)*k;
    S.z=sz*Math.pow(z/sz,k);
    draw();if(k<1)flyToNode.raf=requestAnimationFrame(step);
  })(t0);
}
function fitOverview(){
  ensureLayout();
  const root=makeNode([]);let x0=1e18,x1=-1e18;
  childrenOf(root).forEach(d=>{const p=nodePos(d);const w=CARD[1][0];
    x0=Math.min(x0,p.x-w/2);x1=Math.max(x1,p.x+w/2);});
  const rp=nodePos(root);
  S.z=Math.min(vw/(x1-x0+160),vh/700);
  S.x=vw/2-(x0+x1)/2*S.z;S.y=vh*0.30-rp.y*S.z;draw();
}

/* ================= visibility ================= */
let visible=[];
function computeVisible(){
  ensureLayout();visible=[];
  const z=S.z;
  (function visit(n){
    const p=nodePos(n);if(!p)return;
    const w=CARD[n.level][0],h=CARD[n.level][1];
    const sx=p.x*z+S.x,sy=p.y*z+S.y;
    if(sx+w*z/2<-80||sx-w*z/2>vw+80||sy+h*z/2<-80||sy-h*z/2>vh+80){
      // still recurse if expanded: children may be in view (parent centered above them)
      if(isExpanded(n))childrenOf(n).forEach(visit);
      return;
    }
    n._sx=sx;n._sy=sy;n._sw=w*z;n._sh=h*z;n._x=p.x;n._y=p.y;
    visible.push(n);
    if(isExpanded(n))childrenOf(n).forEach(visit);
  })(makeNode([]));
}

/* ================= draw ================= */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function draw(){
  computeVisible();
  ctx.clearRect(0,0,vw,vh);
  ctx.fillStyle="#121216";
  const gs=44,ox=((S.x%gs)+gs)%gs,oy=((S.y%gs)+gs)%gs;
  for(let gx=ox;gx<vw;gx+=gs)for(let gy=oy;gy<vh;gy+=gs)ctx.fillRect(gx,gy,1.6,1.6);

  const visSet=new Set(visible);
  // reporting lines (elbow connectors), batched
  ctx.strokeStyle="rgba(255,255,255,0.13)";ctx.lineWidth=1.5;ctx.beginPath();
  for(let i=0;i<visible.length;i++){const n=visible[i];
    if(!n.parent||!visSet.has(n.parent)||n.parent._sx===undefined)continue;
    const pw=CARD[n.parent.level][0]*S.z,ph=CARD[n.parent.level][1]*S.z;
    const x1=n.parent._sx,y1=n.parent._sy+ph/2,x2=n._sx,y2=n._sy-n._sh/2;
    const my=(y1+y2)/2;
    ctx.moveTo(x1,y1);ctx.lineTo(x1,my);ctx.lineTo(x2,my);ctx.lineTo(x2,y2);
  }
  ctx.stroke();
  // cards, parents first
  ctx.textAlign="left";ctx.textBaseline="alphabetic";
  for(let i=0;i<visible.length;i++){const n=visible[i];
    const w=n._sw,h=n._sh,x=n._sx-w/2,y=n._sy-h/2;
    roundRect(x,y,w,h,Math.min(14,8*S.z+4));
    if(n.level===0){ctx.fillStyle="#1c1c22";}
    else{ctx.fillStyle="#101014";}
    ctx.fill();
    ctx.strokeStyle=n._focused?"#60a5fa":`hsla(${n.hue},70%,60%,0.55)`;
    ctx.lineWidth=n._focused?3:1.5;ctx.stroke();
    // accent bar
    ctx.fillStyle=`hsl(${n.hue},70%,55%)`;
    const bw=Math.max(2,4*S.z);
    roundRect(x,y,bw,h,Math.min(14,8*S.z+4));ctx.fill();

    const padL=14*S.z+8, cx=x+padL;
    ctx.fillStyle="#fafafa";
    if(n.kind==="person"){
      const ar=Math.min(h*0.30,26*S.z);
      ctx.beginPath();ctx.arc(x+ar+10*S.z,n._sy,ar,0,Math.PI*2);
      ctx.fillStyle=`hsl(${n.hue},60%,52%)`;ctx.fill();
      ctx.fillStyle="rgba(255,255,255,0.95)";
      ctx.font=`700 ${ar*0.9}px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif`;
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(n.initials,x+ar+10*S.z,n._sy+1);
      ctx.textAlign="left";ctx.textBaseline="alphabetic";
      const tx=x+ar*2+18*S.z;
      ctx.fillStyle="#fafafa";
      ctx.font=`600 ${Math.max(9,13*S.z)}px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif`;
      ctx.fillText(n.name,tx,n._sy-2*S.z);
      ctx.fillStyle="#a1a1aa";
      ctx.font=`${Math.max(8,11*S.z)}px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif`;
      ctx.fillText(n.title,tx,n._sy+14*S.z);
    }else{
      const fs=Math.max(10,19*S.z);
      ctx.font=`700 ${fs}px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif`;
      ctx.fillStyle="#fafafa";
      ctx.fillText(n.name,cx,y+fs+14*S.z);
      ctx.font=`${Math.max(8,12.5*S.z)}px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif`;
      ctx.fillStyle="#a1a1aa";
      const sub=n.kind==="ceo"?n.title:(n.kind==="dept"?n.lead+" · "+n.leadTitle:n.lead+" · "+n.leadTitle);
      ctx.fillText(sub,cx,y+fs+32*S.z);
      if(n.kind!=="ceo"){
        ctx.fillStyle="#63636b";
        ctx.font=`${Math.max(8,11*S.z)}px ui-monospace,Menlo,monospace`;
        ctx.fillText(n.headcount+" people · "+(isExpanded(n)?"tap to collapse":"tap to unfold"),
          cx,y+fs+48*S.z);
      }
    }
  }
  // breadcrumb: deepest visible node containing viewport center
  let best=null,bestLevel=-1;
  for(let i=0;i<visible.length;i++){const n=visible[i];
    if(Math.abs(vw/2-n._sx)<n._sw/2&&Math.abs(vh/2-n._sy)<n._sh/2&&n.level>bestLevel){best=n;bestLevel=n.level;}}
  const names=["Meridian"];let q=best;
  const chain=[];
  while(q){chain.unshift(q.kind==="person"?q.name:q.name);q=q.parent;}
  if(chain.length>1)names.push(...chain.slice(1));
  crumb.textContent=names.join("  /  ");
  countEl.textContent=visible.length+" visible · "+TOTAL.toLocaleString()+" total";
}

/* ================= interaction ================= */
let moved=false,downPos=null;const ptrs=new Map();let pinchD0=0;
function clearFocus(){for(let i=0;i<visible.length;i++)visible[i]._focused=false;}
function nodeAt(cx,cy){
  const wx=(cx-S.x)/S.z,wy=(cy-S.y)/S.z;
  for(let i=visible.length-1;i>=0;i--){const n=visible[i];
    const w=CARD[n.level][0],h=CARD[n.level][1];
    if(Math.abs(wx-n._x)<w/2&&Math.abs(wy-n._y)<h/2)return n;}
  return null;
}
stage.addEventListener("pointerdown",e=>{
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){moved=false;downPos={x:e.clientX,y:e.clientY};stage.classList.add("dragging");}
  if(ptrs.size===2){const p=[...ptrs.values()];pinchD0=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}
  cancelAnimationFrame(flyToNode.raf);
});
stage.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){
    const dx=e.clientX-prev.x,dy=e.clientY-prev.y;
    if(downPos&&Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>6)moved=true;
    S.x+=dx;S.y+=dy;requestDraw();hideHintSoon();
  }else if(ptrs.size===2){
    const p=[...ptrs.values()];
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinchD0>0)zoomAt((p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2,d/pinchD0);
    pinchD0=d;moved=true;hideHintSoon();
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size===0)stage.classList.remove("dragging");
  if(!moved&&downPos&&e.type==="pointerup"){
    const n=nodeAt(e.clientX,e.clientY);
    clearFocus();
    if(n){
      n._focused=true;
      const key=n.path.join("/");
      let z=S.z;
      if(n.level===1||n.level===2){
        if(isExpanded(n)){
          // collapse: unpin AND ease just below this level's auto-unfold
          // threshold, otherwise auto-unfold would instantly re-open it
          pinned.delete(key);
          z=n.level===1?Math.min(S.z,0.75):Math.min(S.z,1.35);
        }else{
          // unfold: pin open and dive in
          pinned.add(key);
          z=n.level===1?Math.max(S.z,0.9):Math.max(S.z,1.7);
        }
        ensureLayout();
      }
      flyToNode(n,z);hideHint();
    }
    requestDraw();
  }
}
stage.addEventListener("pointerup",endPtr);
stage.addEventListener("pointercancel",endPtr);
stage.addEventListener("wheel",e=>{e.preventDefault();cancelAnimationFrame(flyToNode.raf);
  zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.0016));hideHintSoon();},{passive:false});
stage.addEventListener("dblclick",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,1.6);});
stage.addEventListener("contextmenu",e=>e.preventDefault());

let hintT=null;
function hideHint(){hint.style.opacity=0;}
function hideHintSoon(){clearTimeout(hintT);hintT=setTimeout(hideHint,2500);}
document.getElementById("zin").onclick=()=>{zoomAt(vw/2,vh/2,1.4);hideHint();};
document.getElementById("zout").onclick=()=>{zoomAt(vw/2,vh/2,1/1.4);hideHint();};
document.getElementById("zreset").onclick=()=>{pinned.clear();clearFocus();fitOverview();hideHint();};
window.addEventListener("keydown",e=>{
  if(e.key==="+"||e.key==="=")zoomAt(vw/2,vh/2,1.35);
  if(e.key==="-")zoomAt(vw/2,vh/2,1/1.35);
  if(e.key==="0"){pinned.clear();clearFocus();fitOverview();}
});
const idx=document.getElementById("index");
childrenOf(makeNode([])).forEach(n=>{
  const b=document.createElement("button");
  const d=document.createElement("span");d.className="dot";d.style.background=`hsl(${n.hue},70%,55%)`;
  b.appendChild(d);
  const t=document.createElement("span");t.textContent=n.name;
  b.appendChild(t);
  b.onclick=()=>{clearFocus();pinned.add(n.path.join("/"));n._focused=true;ensureLayout();
    flyToNode(n,0.9);hideHint();};
  idx.appendChild(b);
});

resize();fitOverview();
setTimeout(hideHint,10000);
</script>
</body>
</html>
