<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{height:100%;margin:0}
  body{background:radial-gradient(120vmin 90vmin at 50% 62%, #3d2b23 0%, #241a16 55%, #141013 100%);
       display:flex;align-items:center;justify-content:center}
  #stage{width:420px;aspect-ratio:400/460}
  svg{width:100%;height:100%;display:block;overflow:visible}
</style></head>
<body>
<div id="stage">
<svg id="cat" viewBox="0 0 400 460">
  <defs>
    <radialGradient id="fur" cx="42%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="65%" stop-color="#fbf1dd"/>
      <stop offset="100%" stop-color="#f0d9b8"/>
    </radialGradient>
    <radialGradient id="patchg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#f7c489"/>
      <stop offset="100%" stop-color="#efa25c"/>
    </radialGradient>
    <clipPath id="headClip"><circle cx="200" cy="188" r="118"/></clipPath>
  </defs>

  <ellipse cx="200" cy="434" rx="104" ry="13" fill="#000" opacity=".28"/>

  <g id="catAll">
    <g id="tail">
      <path d="M282 396 C 332 392, 350 350, 322 330 C 306 318, 288 328, 290 344 C 292 360, 312 362, 314 376 C 316 388, 300 394, 286 392 Z"
            fill="url(#fur)" stroke="#d8b48f" stroke-width="3" stroke-linejoin="round"/>
      <path d="M302 330 q 14 -4 20 10" stroke="#efa25c" stroke-width="9" stroke-linecap="round" fill="none" opacity=".85"/>
    </g>

    <g id="breathe">
      <ellipse cx="200" cy="366" rx="70" ry="56" fill="url(#fur)" stroke="#d8b48f" stroke-width="3"/>
      <ellipse cx="152" cy="416" rx="25" ry="13" fill="url(#fur)" stroke="#d8b48f" stroke-width="3"/>
      <ellipse cx="248" cy="416" rx="25" ry="13" fill="url(#fur)" stroke="#d8b48f" stroke-width="3"/>

      <g id="pawL" class="paw">
        <rect x="150" y="370" width="34" height="52" rx="17" fill="url(#fur)" stroke="#d8b48f" stroke-width="3"/>
        <ellipse cx="167" cy="409" rx="6.5" ry="5.5" fill="#f2a3b3"/>
        <circle cx="158" cy="400" r="3.4" fill="#f2a3b3"/><circle cx="167" cy="398" r="3.4" fill="#f2a3b3"/><circle cx="176" cy="400" r="3.4" fill="#f2a3b3"/>
      </g>
      <g id="pawR" class="paw">
        <rect x="216" y="370" width="34" height="52" rx="17" fill="url(#fur)" stroke="#d8b48f" stroke-width="3"/>
        <ellipse cx="233" cy="409" rx="6.5" ry="5.5" fill="#f2a3b3"/>
        <circle cx="224" cy="400" r="3.4" fill="#f2a3b3"/><circle cx="233" cy="398" r="3.4" fill="#f2a3b3"/><circle cx="242" cy="400" r="3.4" fill="#f2a3b3"/>
      </g>

      <g id="headG">
        <g id="earL">
          <path d="M112 92 L94 30 Q92 22 100 26 L170 62 Z" fill="url(#fur)" stroke="#d8b48f" stroke-width="3" stroke-linejoin="round"/>
          <path d="M116 78 L108 42 L148 62 Z" fill="#f7b3c2"/>
        </g>
        <g id="earR">
          <path d="M288 92 L306 30 Q308 22 300 26 L230 62 Z" fill="url(#fur)" stroke="#d8b48f" stroke-width="3" stroke-linejoin="round"/>
          <path d="M284 78 L292 42 L252 62 Z" fill="#f7b3c2"/>
        </g>
        <circle cx="200" cy="188" r="118" fill="url(#fur)" stroke="#d8b48f" stroke-width="3"/>
        <g clip-path="url(#headClip)">
          <path d="M70 100 Q 78 34 140 26 Q 200 20 206 84 Q 160 70 128 92 Q 92 112 70 100 Z"
                fill="url(#patchg)" opacity=".55"/>
        </g>

        <g class="eye" id="eyeL">
          <ellipse class="eye-white" cx="132" cy="208" rx="33" ry="43" fill="#fff" stroke="#c9a37f" stroke-width="2.5"/>
          <g class="pupil" id="pupilL">
            <ellipse cx="132" cy="212" rx="19" ry="27" fill="#463326"/>
            <circle cx="139" cy="202" r="8" fill="#fff"/>
            <circle cx="126" cy="220" r="3.5" fill="#fff" opacity=".9"/>
          </g>
        </g>
        <g class="eye" id="eyeR">
          <ellipse class="eye-white" cx="268" cy="208" rx="33" ry="43" fill="#fff" stroke="#c9a37f" stroke-width="2.5"/>
          <g class="pupil" id="pupilR">
            <ellipse cx="268" cy="212" rx="19" ry="27" fill="#463326"/>
            <circle cx="275" cy="202" r="8" fill="#fff"/>
            <circle cx="262" cy="220" r="3.5" fill="#fff" opacity=".9"/>
          </g>
        </g>

        <ellipse cx="90" cy="262" rx="20" ry="12" fill="#f6a8b8" opacity=".5"/>
        <ellipse cx="310" cy="262" rx="20" ry="12" fill="#f6a8b8" opacity=".5"/>

        <path d="M193 250 Q200 246 207 250 Q204 257 200 257 Q196 257 193 250 Z" fill="#e88a9a"/>
        <path d="M200 257 Q200 264 192 264 M200 257 Q200 264 208 264" stroke="#a07a5c" stroke-width="3"
              fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
</div>
</body></html>
