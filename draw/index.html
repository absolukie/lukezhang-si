<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>draw &middot; lukezhang.si</title>
<style>
  :root {
    --paper: #fdfbf4;
    --ink: #2b2118;
    --bar: #fff8ea;
    --line: #efdfc2;
    --accent: #e8833a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  /* ---------- toolbar ---------- */
  #bar {
    flex: 0 0 auto;
    padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    z-index: 3;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .row + .row { margin-top: 10px; }
  #home {
    flex: 0 0 auto;
    color: var(--ink);
    text-decoration: none;
    font-weight: 700;
    font-size: 17px;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px;
    background: #f7ecd4;
    touch-action: manipulation;
  }
  #colors {
    display: flex; align-items: center; gap: 10px;
    overflow-x: auto; flex: 1 1 auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding: 2px;
  }
  #colors::-webkit-scrollbar { display: none; }
  .sw {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(0,0,0,.14);
    flex: 0 0 auto; padding: 0; cursor: pointer;
    touch-action: manipulation;
    transition: transform 120ms ease;
  }
  .sw:active { transform: scale(1.15); }
  .sw.sel { border-color: var(--ink); box-shadow: 0 0 0 2px var(--bar), 0 0 0 4px var(--ink); }
  .sw.custom { position: relative; overflow: hidden;
    background: conic-gradient(#e23b3b,#f07f1f,#f5c518,#2fa84f,#2b7de2,#7a4fd0,#e23b3b); }
  .sw.custom input {
    position: absolute; inset: -8px; opacity: 0; cursor: pointer;
    touch-action: manipulation;
  }
  .toolbtn {
    flex: 0 0 auto;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid transparent; border-radius: 14px;
    background: #f7ecd4; color: var(--ink);
    cursor: pointer; touch-action: manipulation;
    transition: transform 120ms ease, background 120ms ease;
  }
  .toolbtn:active { transform: scale(0.92); }
  .toolbtn.sel { background: var(--ink); color: #fff8ea; }
  .toolbtn:disabled { opacity: 0.35; }
  .toolbtn svg { width: 24px; height: 24px; display: block; }
  #dlBtn {
    transition: transform 120ms ease;
  }
  #dlBtn .dl-icons { position: relative; width: 24px; height: 24px; }
  #dlBtn .dl-icon { position: absolute; inset: 0; pointer-events: none; }
  #dlBtn .dl-copy { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  #dlBtn .dl-share { opacity: 0; transform: translateY(3px) rotate(6deg) scale(0.82); }
  #dlBtn.share .dl-copy { opacity: 0; transform: translateY(-2px) rotate(-6deg) scale(0.82); }
  #dlBtn.share .dl-share { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  @media (prefers-reduced-motion: reduce) {
    #dlBtn { transition: none; }
  }
  #sizes { display: flex; align-items: center; gap: 6px; flex: 1 1 auto; }
  .sizebtn {
    flex: 0 0 auto;
    width: 44px; height: 44px; border-radius: 14px;
    border: 2px solid transparent; background: #f7ecd4;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: manipulation;
  }
  .sizebtn.sel { border-color: var(--ink); }
  .sizebtn span { display: block; border-radius: 50%; background: var(--ink); }
  #clearBtn {
    width: auto; padding: 0 16px; height: 44px;
    font-weight: 700; font-size: 15px; gap: 8px;
  }
  #clearBtn.armed { background: #d43a2e; color: #fff; border-color: #d43a2e; }
  #photoBtn {
    width: auto; padding: 0 14px; height: 44px;
    font-weight: 700; font-size: 15px; gap: 8px;
  }
  #photoBtn.armed { background: #d43a2e; color: #fff; border-color: #d43a2e; }
  #photoBtn.hasphoto { border-color: var(--ink); }

  /* ---------- canvas ---------- */
  #wrap { position: relative; flex: 1 1 auto; }
  #bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
    z-index: 0;
  }
  #pad {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    z-index: 1;
    touch-action: none;
    cursor: crosshair;
  }
  #hint {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    color: rgba(43,33,24,.28);
    font-size: 17px; font-weight: 600; text-align: center;
    padding: 0 40px; line-height: 1.5;
    transition: opacity 400ms ease;
  }
  #hint.gone { opacity: 0; }
  #saved {
    position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(8px);
    background: rgba(43,33,24,.82); color: #fff8ea;
    font-size: 13px; font-weight: 600;
    padding: 8px 16px; border-radius: 999px;
    opacity: 0; pointer-events: none;
    transition: opacity 250ms ease, transform 250ms ease;
    z-index: 2;
  }
  #saved.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div id="bar">
    <div class="row">
      <a id="home" href="/" aria-label="back to lukezhang.si">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div id="colors" role="radiogroup" aria-label="colors"></div>
    </div>
    <div class="row">
      <div id="sizes" role="radiogroup" aria-label="brush sizes"></div>
      <button class="toolbtn" id="eraserBtn" aria-label="eraser" title="eraser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l8.5-8.5a2.1 2.1 0 013 3L11 15H8l-3-3z"/><path d="M5 15l3 3h9a2 2 0 002-2v-1l-2-2"/><path d="M13.5 6.5l3 3"/></svg>
      </button>
      <button class="toolbtn" id="photoBtn" aria-label="add photo" title="add photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M3.5 17.5l5-4.5 3.5 3 3-2.5 5.5 4"/></svg>
        <span id="photoLabel">photo</span>
      </button>
      <input type="file" id="photoInput" accept="image/*" hidden>
      <button class="toolbtn" id="undoBtn" aria-label="undo" title="undo" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5L3 10l5 5"/><path d="M3 10h11a6 6 0 016 6v1"/></svg>
      </button>
      <button class="toolbtn" id="dlBtn" aria-label="save image" title="save image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
      </button>
      <button class="toolbtn" id="clearBtn" aria-label="clear drawing" title="clear drawing">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2"/><path d="M6 7l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13"/><path d="M10 11v6M14 11v6"/></svg>
        <span id="clearLabel">clear</span>
      </button>
    </div>
  </div>

  <div id="wrap">
    <canvas id="bg"></canvas>
    <canvas id="pad"></canvas>
    <div id="hint">draw anything, or tap photo to mark up a picture</div>
    <div id="saved">saved</div>
  </div>

<script>
(function () {
  "use strict";
  var KEY = "lzsi.draw.v1";
  var PAPER = "#fdfbf4";

  var COLORS = ["#1c1a17", "#e23b3b", "#f07f1f", "#f5c518",
                "#2fa84f", "#2b7de2", "#7a4fd0", "#ef6fb0",
                "#8a5a3b", "#9aa0a6"];
  var SIZES = [4, 10, 22];

  var canvas = document.getElementById("pad");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var hint = document.getElementById("hint");
  var savedPill = document.getElementById("saved");
  var undoBtn = document.getElementById("undoBtn");
  var eraserBtn = document.getElementById("eraserBtn");
  var clearBtn = document.getElementById("clearBtn");
  var clearLabel = document.getElementById("clearLabel");
  var bgCanvas = document.getElementById("bg");
  var bgCtx = bgCanvas.getContext("2d");
  var photoBtn = document.getElementById("photoBtn");
  var photoLabel = document.getElementById("photoLabel");
  var photoInput = document.getElementById("photoInput");
  var photo = null;   // {img} — drawn contain-fit on the bg canvas under the strokes

  var strokes = [];      // {c, s, e, p:[[nx,ny],...]} — points stored normalized 0..1
  var clearedBackup = null; // strokes wiped by the last clear, restorable via undo
  var curColor = COLORS[0];
  var curSize = SIZES[1];
  var erasing = false;
  var drawing = null;    // active stroke
  var dpr = 1, W = 0, H = 0;

  /* ---------- storage ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) strokes = arr.filter(function (s) {
        return s && Array.isArray(s.p) && s.p.length > 0;
      });
    } catch (e) { /* corrupted or unavailable — start blank */ }
  }
  var saveTimer = null, savedTimer = null;
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(KEY, JSON.stringify(strokes)); } catch (e) { /* storage full/blocked */ }
      savedPill.classList.add("show");
      clearTimeout(savedTimer);
      savedTimer = setTimeout(function () { savedPill.classList.remove("show"); }, 1400);
    }, 500);
  }

  /* ---------- canvas sizing ---------- */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    var r = wrap.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bgCanvas.width = canvas.width;
    bgCanvas.height = canvas.height;
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawPhoto();
    redrawAll();
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 120); });

  /* ---------- drawing ---------- */
  function strokeStyle(s) {
    ctx.strokeStyle = s.e ? "#000" : s.c;
    ctx.lineWidth = s.s;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.globalCompositeOperation = s.e ? "destination-out" : "source-over";
  }
  function drawStroke(s) {
    var pts = s.p;
    if (pts.length === 1) {
      strokeStyle(s);
      ctx.beginPath();
      ctx.arc(pts[0][0] * W, pts[0][1] * H, s.s / 2, 0, Math.PI * 2);
      ctx.globalCompositeOperation = s.e ? "destination-out" : "source-over";
      ctx.fillStyle = s.e ? "#000" : s.c;
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      return;
    }
    strokeStyle(s);
    ctx.beginPath();
    var x0 = pts[0][0] * W, y0 = pts[0][1] * H;
    ctx.moveTo(x0, y0);
    for (var i = 1; i < pts.length - 1; i++) {
      var xc = (pts[i][0] * W + pts[i + 1][0] * W) / 2;
      var yc = (pts[i][1] * H + pts[i + 1][1] * H) / 2;
      ctx.quadraticCurveTo(pts[i][0] * W, pts[i][1] * H, xc, yc);
    }
    var last = pts[pts.length - 1];
    ctx.lineTo(last[0] * W, last[1] * H);
    ctx.stroke();
    ctx.globalCompositeOperation = "source-over";
  }
  function redrawAll() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < strokes.length; i++) drawStroke(strokes[i]);
  }
  // incremental: draw only the newest segment of the live stroke
  function drawLiveSegment(s) {
    var pts = s.p, n = pts.length;
    strokeStyle(s);
    ctx.beginPath();
    if (n === 1) {
      ctx.arc(pts[0][0] * W, pts[0][1] * H, s.s / 2, 0, Math.PI * 2);
      ctx.fillStyle = s.e ? "#000" : s.c;
      ctx.fill();
    } else if (n === 2) {
      ctx.moveTo(pts[0][0] * W, pts[0][1] * H);
      ctx.lineTo(pts[1][0] * W, pts[1][1] * H);
      ctx.stroke();
    } else {
      var a = pts[n - 3], b = pts[n - 2], c = pts[n - 1];
      var ax = a[0] * W, ay = a[1] * H, bx = b[0] * W, by = b[1] * H;
      var mx1 = (ax + bx) / 2, my1 = (ay + by) / 2;
      var mx2 = (bx + c[0] * W) / 2, my2 = (by + c[1] * H) / 2;
      ctx.moveTo(mx1, my1);
      ctx.quadraticCurveTo(bx, by, mx2, my2);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
  }
  function hideHint() { hint.classList.add("gone"); }

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (drawing) return;                       // one stroke at a time
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    disarmClear();
    disarmPhoto();
    setShareMode(false);   // drawing changed — back to copy
    drawing = { c: curColor, s: curSize, e: erasing, p: [pos(e)], id: e.pointerId };
    drawLiveSegment(drawing);
    hideHint();
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!drawing || e.pointerId !== drawing.id) return;
    e.preventDefault();
    var p = pos(e), last = drawing.p[drawing.p.length - 1];
    var dx = (p[0] - last[0]) * W, dy = (p[1] - last[1]) * H;
    if (dx * dx + dy * dy < 1.2) return;        // skip sub-pixel jitter
    drawing.p.push(p);
    drawLiveSegment(drawing);
  });
  function endStroke(e) {
    if (!drawing || (e && e.pointerId !== drawing.id)) return;
    if (drawing.p.length > 0) {
      strokes.push({ c: drawing.c, s: drawing.s, e: drawing.e, p: drawing.p });
      clearedBackup = null;   // a new stroke discards the clear backup
      updateUndo();
      scheduleSave();
    }
    drawing = null;
  }
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  /* ---------- photo background ----------
     The photo lives on its own canvas under the stroke canvas, so the
     eraser (destination-out) can never eat the photo. Export flattens
     paper + photo + strokes. The photo blob persists in IndexedDB;
     strokes keep using localStorage as before. */
  function drawPhoto() {
    bgCtx.clearRect(0, 0, W, H);
    if (!photo || !photo.img) return;
    var s = Math.min(W / photo.img.width, H / photo.img.height);
    var dw = photo.img.width * s, dh = photo.img.height * s;
    bgCtx.drawImage(photo.img, (W - dw) / 2, (H - dh) / 2, dw, dh);
  }
  var idb = null;
  function idbOpen(cb) {
    cb = cb || function () {};
    try {
      var rq = indexedDB.open("lzsi.draw", 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore("kv"); };
      rq.onsuccess = function () { idb = rq.result; cb(); };
      rq.onerror = function () { cb(); };
    } catch (e) { cb(); }
  }
  function idbTx(mode, fn) {
    if (!idb) return;
    try { fn(idb.transaction("kv", mode).objectStore("kv")); } catch (e) {}
  }
  function setPhotoFromBlob(blob, done) {
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function () {
      URL.revokeObjectURL(url);
      photo = { img: img };
      drawPhoto();
      idbTx("readwrite", function (store) { store.put(blob, "photo"); });
      hideHint();
      setShareMode(false);
      paintPhotoBtn();
      if (done) done(true);
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      flashPill("couldn't load that photo");
      if (done) done(false);
    };
    img.src = url;
  }
  function removePhoto() {
    photo = null;
    idbTx("readwrite", function (store) { store.delete("photo"); });
    drawPhoto();
    setShareMode(false);
    paintPhotoBtn();
  }
  function paintPhotoBtn() {
    photoBtn.classList.toggle("hasphoto", !!photo);
    photoBtn.title = photo ? "remove photo" : "add photo";
    photoBtn.setAttribute("aria-label", photo ? "remove photo" : "add photo");
    if (!photoArmed) photoLabel.textContent = "photo";
  }
  var photoArmed = false, photoTimer = null;
  function disarmPhoto() {
    if (!photoArmed) return;
    photoArmed = false;
    photoBtn.classList.remove("armed");
    clearTimeout(photoTimer);
    paintPhotoBtn();
  }
  photoBtn.addEventListener("click", function () {
    if (!photo) { photoInput.click(); return; }
    if (!photoArmed) {
      photoArmed = true;
      photoBtn.classList.add("armed");
      photoLabel.textContent = "remove?";
      photoTimer = setTimeout(disarmPhoto, 2600);
      return;
    }
    disarmPhoto();
    removePhoto();
  });
  photoInput.addEventListener("change", function () {
    disarmPhoto();
    var f = photoInput.files && photoInput.files[0];
    photoInput.value = "";
    if (f) setPhotoFromBlob(f);
  });

  /* ---------- toolbar ---------- */
  var colorsEl = document.getElementById("colors");
  COLORS.forEach(function (c, i) {
    var b = document.createElement("button");
    b.className = "sw" + (i === 0 ? " sel" : "");
    b.style.background = c;
    b.setAttribute("aria-label", "color " + c);
    b.addEventListener("click", function () {
      curColor = c; erasing = false; eraserBtn.classList.remove("sel");
      setSel(colorsEl, b);
    });
    colorsEl.appendChild(b);
  });
  var customWrap = document.createElement("div");
  customWrap.className = "sw custom";
  customWrap.title = "custom color";
  var customInput = document.createElement("input");
  customInput.type = "color";
  customInput.value = "#e8833a";
  customInput.setAttribute("aria-label", "custom color");
  customInput.addEventListener("input", function () {
    curColor = customInput.value; erasing = false; eraserBtn.classList.remove("sel");
    setSel(colorsEl, customWrap);
  });
  customWrap.appendChild(customInput);
  colorsEl.appendChild(customWrap);

  function setSel(container, el) {
    var kids = container.children;
    for (var i = 0; i < kids.length; i++) kids[i].classList.remove("sel");
    el.classList.add("sel");
  }

  var sizesEl = document.getElementById("sizes");
  SIZES.forEach(function (s, i) {
    var b = document.createElement("button");
    b.className = "sizebtn" + (i === 1 ? " sel" : "");
    b.setAttribute("aria-label", "brush size " + s);
    var dot = document.createElement("span");
    var d = Math.max(6, Math.min(26, s));
    dot.style.width = d + "px"; dot.style.height = d + "px";
    b.appendChild(dot);
    b.addEventListener("click", function () {
      curSize = s; setSel(sizesEl, b);
    });
    sizesEl.appendChild(b);
  });

  eraserBtn.addEventListener("click", function () {
    erasing = !erasing;
    eraserBtn.classList.toggle("sel", erasing);
  });

  function updateUndo() {
    undoBtn.disabled = !(strokes.length || clearedBackup);
  }

  undoBtn.addEventListener("click", function () {
    if (clearedBackup && !strokes.length) {
      // undo a clear: bring the whole wiped drawing back
      strokes = clearedBackup;
      clearedBackup = null;
      redrawAll();
      hideHint();
    } else if (strokes.length) {
      strokes.pop();
      redrawAll();
      if (!strokes.length) hint.classList.remove("gone");
    } else {
      return;
    }
    setShareMode(false);   // drawing changed — back to copy
    updateUndo();
    scheduleSave();
  });

  /* ---------- clear: tap once to arm, tap again to wipe ---------- */
  var clearArmed = false, clearTimer = null;
  function disarmClear() {
    if (!clearArmed) return;
    clearArmed = false;
    clearBtn.classList.remove("armed");
    clearLabel.textContent = "clear";
    clearTimeout(clearTimer);
  }
  clearBtn.addEventListener("click", function () {
    if (!clearArmed) {
      clearArmed = true;
      clearBtn.classList.add("armed");
      clearLabel.textContent = "sure?";
      clearTimer = setTimeout(disarmClear, 2600);
      return;
    }
    disarmClear();
    clearedBackup = strokes;   // keep it so one undo brings the drawing back
    strokes = [];
    redrawAll();
    hint.classList.remove("gone");
    setShareMode(false);   // drawing wiped — back to copy
    updateUndo();
    scheduleSave();
  });

  /* ---------- copy, then morph into share ----------
     One tap copies the drawing PNG to the clipboard. On success the
     button animates into a share button (tinted, new icon) offering the
     natural next step; it morphs back to copy after sharing or as soon
     as the drawing changes again. If copy is refused, share directly. */
  var dlBtn = document.getElementById("dlBtn");
  var COPY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';
  var SHARE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>';
  var shareMode = false;
  // Mount once: both glyphs share a fixed center throughout the handoff.
  dlBtn.innerHTML = '<span class="dl-icons" aria-hidden="true">' +
    '<span class="dl-icon dl-copy">' + COPY_SVG + '</span>' +
    '<span class="dl-icon dl-share">' + SHARE_SVG + '</span></span>';
  var dlCopy = dlBtn.querySelector(".dl-copy");
  var dlShare = dlBtn.querySelector(".dl-share");
  var dlAnimations = [];
  var dlReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  function cancelDlAnimations() {
    dlAnimations.forEach(function (animation) { animation.cancel(); });
    dlAnimations = [];
  }
  function dlPose(element) {
    var style = getComputedStyle(element);
    return { transform: style.transform, opacity: style.opacity };
  }
  function paintDlBtn() {
    dlBtn.title = shareMode ? "share image" : "copy image";
    dlBtn.setAttribute("aria-label", shareMode ? "share image" : "copy image");
    dlBtn.classList.toggle("share", shareMode);
  }
  function setShareMode(on) {
    if (shareMode === on) return;
    var animate = !dlReducedMotion.matches && typeof dlBtn.animate === "function";
    // Read the rendered poses before cancelling, including a partially finished morph.
    var copyPose = animate ? dlPose(dlCopy) : null;
    var sharePose = animate ? dlPose(dlShare) : null;
    var buttonPose = animate ? getComputedStyle(dlBtn).transform : null;
    cancelDlAnimations();
    shareMode = on;
    paintDlBtn(); // Commit semantics and resting styles immediately; no deferred state changes.
    if (!animate) return;

    var incoming = on ? dlShare : dlCopy;
    var outgoing = on ? dlCopy : dlShare;
    var incomingEnd = dlPose(incoming);
    var outgoingEnd = dlPose(outgoing);
    var buttonEnd = getComputedStyle(dlBtn).transform;
    dlAnimations.push(outgoing.animate([
      on ? copyPose : sharePose,
      outgoingEnd
    ], { duration: 180, easing: "cubic-bezier(0.4, 0, 0.2, 1)" }));
    dlAnimations.push(incoming.animate([
      Object.assign({}, on ? sharePose : copyPose, {
        offset: 0, easing: "cubic-bezier(0.16, 1, 0.3, 1)"
      }),
      { transform: "translateY(0) rotate(" + (on ? -1 : 1) + "deg) scale(1.06)",
        opacity: 1, offset: 0.68, easing: "cubic-bezier(0.33, 0, 0.2, 1)" },
      incomingEnd
    ], { duration: 400 }));
    // A small confirmation pulse on copy success; reversals simply settle from the current scale.
    var buttonFrames = [{ transform: buttonPose }];
    if (on) {
      buttonFrames[0].easing = "cubic-bezier(0.2, 0.8, 0.3, 1)";
      buttonFrames.push({ transform: "scale(1.06)", offset: 0.35,
        easing: "cubic-bezier(0.22, 1, 0.36, 1)" });
    }
    buttonFrames.push({ transform: buttonEnd });
    dlAnimations.push(dlBtn.animate(buttonFrames, {
      duration: on ? 400 : 240, easing: on ? "linear" : "cubic-bezier(0.22, 1, 0.36, 1)"
    }));
  }
  function dlMotionChanged() {
    if (dlReducedMotion.matches) cancelDlAnimations();
  }
  if (dlReducedMotion.addEventListener) dlReducedMotion.addEventListener("change", dlMotionChanged);
  else dlReducedMotion.addListener(dlMotionChanged);
  paintDlBtn();
  function renderPNG(cb) {
    var out = document.createElement("canvas");
    out.width = canvas.width; out.height = canvas.height;
    var octx = out.getContext("2d");
    octx.fillStyle = PAPER;
    octx.fillRect(0, 0, out.width, out.height);
    octx.drawImage(bgCanvas, 0, 0);
    octx.drawImage(canvas, 0, 0);
    out.toBlob(cb, "image/png");
  }
  function flashPill(text) {
    savedPill.textContent = text;
    savedPill.classList.add("show");
    clearTimeout(savedTimer);
    savedTimer = setTimeout(function () {
      savedPill.classList.remove("show");
      setTimeout(function () { savedPill.textContent = "saved"; }, 300);
    }, 1400);
  }
  function shareFallback(blob, done) {
    var file = null;
    try { file = new File([blob], "drawing.png", { type: "image/png" }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: "drawing" }).then(done, done);
    } else {
      var url = URL.createObjectURL(blob);
      window.open(url, "_blank");
      setTimeout(function () { URL.revokeObjectURL(url); }, 120000);
      done();
    }
  }
  dlBtn.addEventListener("click", function () {
    if (shareMode) {
      // share the current drawing, then morph back to copy
      renderPNG(function (blob) {
        if (blob) shareFallback(blob, function () { setShareMode(false); });
        else setShareMode(false);
      });
      return;
    }
    renderPNG(function (blob) {
      if (!blob) return;
      var copyFailed = function () { shareFallback(blob, function () {}); };
      if (navigator.clipboard && window.ClipboardItem) {
        try {
          var item = new ClipboardItem({ "image/png": blob });
          navigator.clipboard.write([item]).then(
            function () { flashPill("copied"); setShareMode(true); },
            copyFailed
          );
        } catch (e) { copyFailed(); }
      } else {
        copyFailed();
      }
    });
  });

  /* ---------- init ---------- */
  load();
  resize();
  if (strokes.length) { hideHint(); updateUndo(); }
  paintPhotoBtn();
  idbOpen(function () {
    var tx;
    try {
      tx = idb.transaction("kv", "readonly").objectStore("kv").get("photo");
    } catch (e) { return; }
    tx.onsuccess = function () {
      if (tx.result) setPhotoFromBlob(tx.result);
    };
  });
})();
</script>
</body>
