<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>lukezhang.si</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 42%, #4a3226 0%, #2a1d18 45%, #100d0e 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #catWrap {
    position: relative;
    width: min(92vmin, 620px);
    height: min(92vmin, 620px);
    will-change: transform;
    cursor: pointer;
    touch-action: manipulation;
  }
  /* Warm halo behind the cat — pure radial CSS, no square edges. */
  #glow {
    position: absolute; inset: -22%;
    background: radial-gradient(closest-side,
      rgba(255, 176, 110, 0.20) 0%,
      rgba(255, 150, 90, 0.08) 55%,
      rgba(255, 150, 90, 0) 100%);
    pointer-events: none;
  }
  #cat {
    position: relative;
    width: 100%; height: 100%;
    display: block;
    pointer-events: none;
    filter: drop-shadow(0 22px 26px rgba(0, 0, 0, 0.45));
    transition: transform 120ms ease-out, filter 120ms ease-out;
  }
  #cat.squash { transform: scale(1.07, 0.9); }
  #bubble {
    position: absolute;
    top: 6%; left: 50%;
    transform: translateX(-50%) scale(0);
    background: #fff8f0;
    color: #5a3b28;
    font-weight: 700;
    font-size: clamp(18px, 4vmin, 30px);
    padding: 0.45em 0.9em;
    border-radius: 999px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    transition: transform 160ms cubic-bezier(.34,1.56,.64,1);
    pointer-events: none;
    white-space: nowrap;
  }
  #bubble.show { transform: translateX(-50%) scale(1); }
  .heart {
    position: absolute;
    bottom: 55%;
    font-size: clamp(16px, 3.4vmin, 26px);
    pointer-events: none;
    animation: floatUp 1.1s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) scale(0.6); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translateY(-34vmin) scale(1.15) rotate(18deg); opacity: 0; }
  }
#designLink {
    position: fixed;
    left: 10px; bottom: 8px;
    color: rgba(255,235,210,0.35);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-decoration: none;
    pointer-events: auto;
  }
  #badge {
    position: fixed;
    right: 10px; bottom: 8px;
    color: rgba(255,235,210,0.35);
    font-size: 11px;
    letter-spacing: 0.04em;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="catWrap">
      <div id="glow"></div>
      <img id="cat" src="frames/idle.png" alt="cute kitten" draggable="false">
      <div id="bubble">mew!</div>
    </div>
  </div>
  <a id="designLink" href="/design.html">design space</a>
  <div id="badge">v2026.10.01-00.08</div>

<script>
(function () {
  var FRAMES = {
    idle:  "frames/idle.png",
    blink: "frames/blink.png",
    swatL: "frames/swatL.png",
    swatR: "frames/swatR.png",
    happy: "frames/happy.png"
  };
  // Preload every frame so swaps are instant.
  Object.keys(FRAMES).forEach(function (k) { var i = new Image(); i.src = FRAMES[k]; });

  var cat = document.getElementById("cat");
  var wrap = document.getElementById("catWrap");
  var bubble = document.getElementById("bubble");

  var state = "idle";       // idle | blink | swatL | swatR | happy
  var happyUntil = 0;
  var lastSwap = 0;
  var pointer = { x: -9999, y: -9999, active: false };
  var lean = { x: 0, r: 0 }; // smoothed lean values

  function setFrame(name) {
    if (state === name) return;
    state = name;
    cat.src = FRAMES[name];
    lastSwap = performance.now();
  }

  // ---- Blinking (only while idle) ----
  function scheduleBlink() {
    setTimeout(function () {
      var now = performance.now();
      if (state === "idle" && now > happyUntil) {
        setFrame("blink");
        setTimeout(function () { if (state === "blink") setFrame("idle"); }, 160);
      }
      scheduleBlink();
    }, 2600 + Math.random() * 3200);
  }
  scheduleBlink();

  // ---- Cursor tracking: swat toward the pointer, lean into it ----
  function catCenter() {
    var r = wrap.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height };
  }

  window.addEventListener("pointermove", function (e) {
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true;
  }, { passive: true });
  document.addEventListener("pointerleave", function () { pointer.active = false; });

  function updateSwat(now) {
    if (now < happyUntil) return;                    // tap celebration owns the frames
    if (now - lastSwap < 120) return;                // anti-flicker cooldown
    if (!pointer.active) { if (state === "swatL" || state === "swatR") setFrame("idle"); return; }
    var c = catCenter();
    var nx = (pointer.x - c.x) / (c.w / 2);          // -1..1 across the cat
    var ny = (pointer.y - c.y) / (c.h / 2);
    var near = Math.abs(nx) < 2.2 && ny > -1.6 && ny < 1.2;
    var inSwat = (state === "swatL" || state === "swatR");
    var enterAt = 0.38, leaveAt = 0.16;              // hysteresis band
    if (!near) { if (inSwat) setFrame("idle"); return; }
    if (!inSwat && Math.abs(nx) > enterAt) {
      setFrame(nx < 0 ? "swatL" : "swatR");
    } else if (inSwat) {
      var wantLeft = state === "swatL";
      if ((wantLeft && nx > -leaveAt) || (!wantLeft && nx < leaveAt)) setFrame("idle");
      else if (wantLeft && nx > enterAt + 0.3) setFrame("swatR");
      else if (!wantLeft && nx < -enterAt - 0.3) setFrame("swatL");
    }
  }

  // ---- Tap: happy + squash + hearts + mew ----
  var HEARTS = ["\u2764\uFE0F", "\uD83D\uDC96", "\uD83D\uDC97", "\uD83D\uDC9C"];
  function burstHearts() {
    for (var i = 0; i < 6; i++) {
      var s = document.createElement("span");
      s.className = "heart";
      s.textContent = HEARTS[i % HEARTS.length];
      s.style.left = (30 + Math.random() * 40) + "%";
      s.style.animationDelay = (Math.random() * 0.25) + "s";
      wrap.appendChild(s);
      setTimeout(function (el) { return function () { el.remove(); }; }(s), 1500);
    }
  }
  wrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var now = performance.now();
    happyUntil = now + 850;
    setFrame("happy");
    cat.classList.add("squash");
    setTimeout(function () { cat.classList.remove("squash"); }, 200);
    bubble.classList.add("show");
    setTimeout(function () { bubble.classList.remove("show"); }, 1200);
    burstHearts();
    setTimeout(function () { if (performance.now() >= happyUntil) setFrame("idle"); }, 900);
  });

  // ---- Per-frame loop: breathing bob + smoothed lean ----
  var t0 = performance.now();
  function tick(now) {
    updateSwat(now);
    var c = catCenter();
    var nx = pointer.active ? (pointer.x - c.x) / (c.w / 2) : 0;
    nx = Math.max(-1.5, Math.min(1.5, nx));
    var targetX = nx * 14;
    var targetR = nx * 4;
    lean.x += (targetX - lean.x) * 0.12;
    lean.r += (targetR - lean.r) * 0.12;
    var bob = Math.sin((now - t0) / 1000 * 2.1) * 7;
    wrap.style.transform =
      "translate(" + lean.x.toFixed(1) + "px," + bob.toFixed(1) + "px) rotate(" + lean.r.toFixed(2) + "deg)";
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
