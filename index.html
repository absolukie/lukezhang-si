<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>lukezhang.si</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    background: radial-gradient(120vmin 90vmin at 50% 62%, #3d2b23 0%, #241a16 55%, #141013 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    cursor: pointer;
  }
  /* soft warm glow behind the cat */
  #glow {
    position: absolute;
    width: 92vmin; height: 92vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,196,140,.14) 0%, rgba(255,196,140,0) 62%);
    pointer-events: none;
  }
  #stage {
    position: relative;
    width: min(78vmin, 480px);
    aspect-ratio: 400 / 460;
  }
  #cat { width: 100%; height: 100%; display: block; overflow: visible; }

  /* ---- idle animations ---- */
  #breathe { animation: breathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.012,1.028); } }

  #tail { animation: tailsway 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 12% 88%; }
  @keyframes tailsway { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(9deg); } }

  .eye { transform-box: fill-box; transform-origin: 50% 50%; }

  #earL { animation: eartwitch 7s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 90%; }
  #earR { animation: eartwitch 9.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 20% 90%; }
  @keyframes eartwitch { 0%, 93%, 100% { transform: rotate(0); } 95% { transform: rotate(-9deg); } 97% { transform: rotate(4deg); } }

  .paw { transform-box: fill-box; transform-origin: 50% 12%; }

  #stage { transform-origin: 50% 100%; }
  #catAll { transform-box: fill-box; transform-origin: 50% 100%; }

  /* ---- speech bubble ---- */
  #mew {
    position: absolute;
    top: 2%; left: 50%;
    transform: translateX(-50%) scale(0);
    background: #fff8ef;
    color: #6b4a35;
    font-weight: 700;
    font-size: clamp(15px, 3.4vmin, 24px);
    padding: .45em .9em;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,.28);
    pointer-events: none;
    white-space: nowrap;
  }
  #mew::after {
    content: "";
    position: absolute;
    left: 50%; bottom: -7px;
    width: 14px; height: 14px;
    background: #fff8ef;
    transform: translateX(-50%) rotate(45deg);
    border-radius: 3px;
  }
  #mew.pop { animation: mewpop 1.4s ease forwards; }
  @keyframes mewpop {
    0% { transform: translateX(-50%) scale(0); opacity: 0; }
    18% { transform: translateX(-50%) scale(1.12); opacity: 1; }
    30% { transform: translateX(-50%) scale(1); }
    75% { transform: translateX(-50%) scale(1); opacity: 1; }
    100% { transform: translateX(-50%) translateY(-14px) scale(.9); opacity: 0; }
  }

  /* ---- floating hearts ---- */
  .heart {
    position: absolute;
    color: #ff9db1;
    font-size: clamp(16px, 3.6vmin, 26px);
    pointer-events: none;
    animation: floatheart 1.3s ease-out forwards;
  }
  @keyframes floatheart {
    0% { transform: translateY(0) scale(.4); opacity: 0; }
    25% { opacity: 1; transform: translateY(-14px) scale(1.15); }
    100% { transform: translateY(-70px) scale(.8) rotate(12deg); opacity: 0; }
  }

  #badge {
    position: fixed;
    left: 14px; bottom: 12px;
    color: rgba(255,235,210,.34);
    font: 11px/1.4 ui-monospace, monospace;
    letter-spacing: .04em;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="glow"></div>

<div id="stage">
  <div id="mew">mew!</div>
  <svg id="cat" viewBox="0 0 400 460" aria-label="a cute cat">
    <defs>
      <radialGradient id="fur" cx="42%" cy="30%" r="85%">
        <stop offset="0%" stop-color="#fffdf6"/>
        <stop offset="60%" stop-color="#fbeed8"/>
        <stop offset="100%" stop-color="#f3d9b4"/>
      </radialGradient>
      <radialGradient id="cream" cx="50%" cy="40%" r="75%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#fdf3e3"/>
      </radialGradient>
      <radialGradient id="patchg" cx="50%" cy="40%" r="70%">
        <stop offset="0%" stop-color="#f7c489"/>
        <stop offset="100%" stop-color="#efa25c"/>
      </radialGradient>
    </defs>

    <ellipse cx="200" cy="434" rx="104" ry="13" fill="#000" opacity=".28"/>

    <g id="catAll">
      <!-- tail (behind body) -->
      <g id="tail">
        <ellipse cx="298" cy="362" rx="34" ry="52" transform="rotate(-16 298 362)"
                 fill="url(#fur)" stroke="#b08968" stroke-width="3.5"/>
        <ellipse cx="308" cy="324" rx="19" ry="27" transform="rotate(-16 308 324)" fill="url(#patchg)"/>
      </g>

      <g id="breathe">
        <!-- body -->
        <ellipse cx="200" cy="366" rx="70" ry="56" fill="url(#fur)" stroke="#b08968" stroke-width="3.5"/>
        <!-- fluffy chest bib -->
        <path d="M200 314 C180 314 168 330 168 350 C168 366 162 372 168 380 C174 388 184 384 188 392 C193 400 207 400 212 392 C216 384 226 388 232 380 C238 372 232 366 232 350 C232 330 220 314 200 314 Z"
              fill="url(#cream)" stroke="#b08968" stroke-width="3" stroke-linejoin="round"/>
        <!-- feet -->
        <ellipse cx="152" cy="416" rx="25" ry="13" fill="url(#fur)" stroke="#b08968" stroke-width="3.5"/>
        <ellipse cx="248" cy="416" rx="25" ry="13" fill="url(#fur)" stroke="#b08968" stroke-width="3.5"/>

        <!-- front paws (these do the batting) -->
        <g id="pawL" class="paw">
          <rect x="148" y="366" width="37" height="56" rx="18" fill="url(#fur)" stroke="#b08968" stroke-width="3.5"/>
          <ellipse cx="166.5" cy="410" rx="7" ry="6" fill="#f2a3b3"/>
          <circle cx="157" cy="401" r="3.6" fill="#f2a3b3"/><circle cx="166.5" cy="399" r="3.6" fill="#f2a3b3"/><circle cx="176" cy="401" r="3.6" fill="#f2a3b3"/>
        </g>
        <g id="pawR" class="paw">
          <rect x="215" y="366" width="37" height="56" rx="18" fill="url(#fur)" stroke="#b08968" stroke-width="3.5"/>
          <ellipse cx="233.5" cy="410" rx="7" ry="6" fill="#f2a3b3"/>
          <circle cx="224" cy="401" r="3.6" fill="#f2a3b3"/><circle cx="233.5" cy="399" r="3.6" fill="#f2a3b3"/><circle cx="242" cy="401" r="3.6" fill="#f2a3b3"/>
        </g>

        <!-- head -->
        <g id="headG">
          <!-- cheek fluff (behind the head) -->
          <g fill="url(#fur)" stroke="#b08968" stroke-width="3.5" stroke-linejoin="round">
            <path d="M100 205 L68 200 L92 222 Z"/>
            <path d="M96 232 L60 236 L90 252 Z"/>
            <path d="M100 258 L72 268 L98 276 Z"/>
            <path d="M300 205 L332 200 L308 222 Z"/>
            <path d="M304 232 L340 236 L310 252 Z"/>
            <path d="M300 258 L328 268 L302 276 Z"/>
          </g>
          <!-- ears -->
          <g id="earL">
            <path d="M96 110 L104 28 L172 74 Z" fill="url(#fur)" stroke="#b08968" stroke-width="3.5" stroke-linejoin="round"/>
            <path d="M110 92 L112 44 L150 70 Z" fill="#f7b3c2"/>
          </g>
          <g id="earR">
            <path d="M304 110 L296 28 L228 74 Z" fill="url(#fur)" stroke="#b08968" stroke-width="3.5" stroke-linejoin="round"/>
            <path d="M290 92 L288 44 L250 70 Z" fill="#f7b3c2"/>
          </g>
          <!-- head -->
          <circle cx="200" cy="188" r="115" fill="url(#fur)" stroke="#b08968" stroke-width="3.5"/>
          <!-- tabby forehead stripes -->
          <g stroke="#efa25c" stroke-width="7" stroke-linecap="round" fill="none" opacity=".85">
            <path d="M186 98 Q189 108 187 118"/>
            <path d="M200 94 Q200 106 200 118"/>
            <path d="M214 98 Q211 108 213 118"/>
          </g>

          <!-- eyes: big, round, low, close together -->
          <g class="eye" id="eyeL">
            <circle class="eye-white" cx="146" cy="234" r="40" fill="#fff" stroke="#a87f5f" stroke-width="3"/>
            <g class="pupil" id="pupilL">
              <ellipse cx="146" cy="238" rx="24" ry="27" fill="#463326"/>
              <circle cx="154" cy="228" r="9" fill="#fff"/>
              <circle cx="137" cy="246" r="4.5" fill="#fff" opacity=".9"/>
            </g>
          </g>
          <g class="eye" id="eyeR">
            <circle class="eye-white" cx="254" cy="234" r="40" fill="#fff" stroke="#a87f5f" stroke-width="3"/>
            <g class="pupil" id="pupilR">
              <ellipse cx="254" cy="238" rx="24" ry="27" fill="#463326"/>
              <circle cx="262" cy="228" r="9" fill="#fff"/>
              <circle cx="245" cy="246" r="4.5" fill="#fff" opacity=".9"/>
            </g>
          </g>

          <!-- blush, tucked under the eyes -->
          <ellipse cx="112" cy="284" rx="17" ry="9" fill="#f6a8b8" opacity=".55"/>
          <ellipse cx="288" cy="284" rx="17" ry="9" fill="#f6a8b8" opacity=".55"/>

          <!-- nose + mouth -->
          <path id="noseEl" d="M192 272 Q200 268 208 272 Q205 280 200 280 Q195 280 192 272 Z" fill="#e88a9a"/>
          <path d="M200 280 Q200 287 192 287 M200 280 Q200 287 208 287" stroke="#a07a5c" stroke-width="3"
                fill="none" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </svg>
</div>

<div id="badge">v2026.09.30-16.05</div>

<script>
(function () {
  "use strict";
  var stage = document.getElementById('stage');
  var catAll = document.getElementById('catAll');
  var headG = document.getElementById('headG');
  var pupils = [document.getElementById('pupilL'), document.getElementById('pupilR')];
  var eyes = Array.prototype.slice.call(document.querySelectorAll('.eye'));
  var pawL = document.getElementById('pawL');
  var pawR = document.getElementById('pawR');
  var mew = document.getElementById('mew');

  var px = innerWidth / 2, py = innerHeight * 0.42;   // pointer pos
  var hasPointer = false;
  var lastBat = 0, batting = false;

  function catCenter() {
    var r = stage.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height * 0.52, w: r.width };
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  addEventListener('pointermove', function (e) {
    px = e.clientX; py = e.clientY; hasPointer = true;
  }, { passive: true });

  // ---- per-frame: eyes + head follow the pointer ----
  function tick() {
    var c = catCenter();
    var dx = (px - c.x) / Math.max(c.w, 1);
    var dy = (py - c.y) / Math.max(c.w, 1);
    var ex = clamp(dx * 26, -11, 11);
    var ey = clamp(dy * 26, -9, 11);
    for (var i = 0; i < pupils.length; i++) {
      pupils[i].setAttribute('transform', 'translate(' + ex + ',' + ey + ')');
    }
    headG.setAttribute('transform',
      'rotate(' + clamp(dx * 14, -8, 8).toFixed(2) + ' 200 188)' +
      ' translate(' + clamp(dx * 8, -5, 5).toFixed(2) + ',' + clamp(dy * 6, -4, 4).toFixed(2) + ')');

    runTweens(performance.now());  // swat / hop / squash

    // paw at the cursor when it gets close
    if (hasPointer && !batting) {
      var d = Math.hypot(px - c.x, py - c.y);
      var now = performance.now();
      if (d < c.w * 0.62 && now - lastBat > 1100) {
        bat(px < c.x ? pawL : pawR, px - c.x, py - c.y);
      }
    }
    requestAnimationFrame(tick);
  }

  // ---- tiny rAF tween engine -------------------------------------------
  // Drives the swat / hop / squash. (JS-triggered CSS keyframe animations
  // on SVG elements proved unreliable in some Chromium builds, so motion
  // that matters runs here — the same per-frame machinery as the pupils,
  // which visibly track.)
  var tweens = [];
  function addTween(dur, fn, done) {
    tweens.push({ t0: performance.now(), dur: dur, fn: fn, done: done });
  }
  function runTweens(nowMs) {
    for (var i = tweens.length - 1; i >= 0; i--) {
      var tw = tweens[i], t = (nowMs - tw.t0) / tw.dur;
      if (t >= 1) { tweens.splice(i, 1); tw.fn(1); if (tw.done) tw.done(); }
      else tw.fn(t);
    }
  }

  // Whole-body pulse, applied to the svg element itself so it composes
  // with the inner breathe animation instead of fighting it.
  function bodyPulse(kind) {
    var dur = kind === 'hop' ? 500 : 460;
    addTween(dur, function (t) {
      var k = Math.sin(Math.PI * t);  // 0 → 1 → 0
      stage.style.transform = kind === 'hop'
        ? 'translateY(' + (-12 * k).toFixed(2) + 'px)'
        : 'scale(' + (1 + 0.08 * k).toFixed(3) + ',' + (1 - 0.12 * k).toFixed(3) + ')';
    }, function () { stage.style.transform = ''; });
  }

  // ---- the swat: nearer paw lifts and swipes toward the pointer ----
  function bat(paw, dx, dy) {
    if (batting) return;
    batting = true;
    lastBat = performance.now();
    var ang = clamp(Math.atan2(dy, dx) * 180 / Math.PI - 90, -75, 75);
    addTween(620, function (t) {
      var k = Math.sin(Math.PI * t);  // 0 → 1 → 0
      paw.style.transform =
        'rotate(' + (ang * k).toFixed(2) + 'deg)' +
        ' translateY(' + (-34 * k).toFixed(2) + 'px)';
    }, function () { paw.style.transform = ''; batting = false; });
    bodyPulse('hop');
  }

  // ---- blinking (whole eye, so the pupil blinks too) ----
  (function blinkLoop() {
    setTimeout(function () {
      addTween(170, function (t) {
        var k = Math.sin(Math.PI * t);  // 0 → 1 → 0
        eyes.forEach(function (e) {
          e.style.transform = 'scale(1,' + (1 - 0.93 * k).toFixed(3) + ')';
        });
      }, function () {
        eyes.forEach(function (e) { e.style.transform = ''; });
      });
      blinkLoop();
    }, 2200 + Math.random() * 3400);
  })();

  // ---- speech ----
  var words = ['mew!', 'mrrp!', 'prrp?', 'mew mew!', 'mrow!'];
  function say(t) {
    mew.textContent = t || words[(Math.random() * words.length) | 0];
    mew.classList.remove('pop');
    void mew.offsetWidth;
    mew.classList.add('pop');
  }

  // ---- hearts ----
  function hearts(n) {
    for (var i = 0; i < n; i++) {
      var h = document.createElement('div');
      h.className = 'heart';
      h.textContent = '\u2665';
      h.style.left = (30 + Math.random() * 40) + '%';
      h.style.top = (18 + Math.random() * 22) + '%';
      h.style.animationDelay = (i * 0.12) + 's';
      stage.appendChild(h);
      (function (el) { setTimeout(function () { el.remove(); }, 1800); })(h);
    }
  }

  // ---- tap / click: pounce + love ----
  addEventListener('pointerdown', function (e) {
    px = e.clientX; py = e.clientY; hasPointer = true;
    var c = catCenter();
    if (Math.hypot(px - c.x, py - c.y) < c.w * 0.75) {
      // the nearer paw swats toward the tap point (on touch, the finger IS the cursor)
      bat(px < c.x ? pawL : pawR, px - c.x, py - c.y);
      bodyPulse('squash');
      say();
      hearts(3);
    }
  }, { passive: true });

  // ---- idle chatter: occasional soft mew ----
  (function idleChatter() {
    setTimeout(function () {
      if (Math.random() < 0.5) say();
      idleChatter();
    }, 14000 + Math.random() * 12000);
  })();


  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
