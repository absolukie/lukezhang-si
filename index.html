<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>lukezhang.si</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    background: radial-gradient(120vmin 90vmin at 50% 62%, #3d2b23 0%, #241a16 55%, #141013 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    cursor: pointer;
  }
  /* soft warm glow behind the cat */
  #glow {
    position: absolute;
    width: 92vmin; height: 92vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,196,140,.14) 0%, rgba(255,196,140,0) 62%);
    pointer-events: none;
  }
  #stage {
    position: relative;
    width: min(78vmin, 480px);
    aspect-ratio: 400 / 460;
  }
  #cat { width: 100%; height: 100%; display: block; overflow: visible; }

  /* ---- idle animations ---- */
  #breathe { animation: breathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.012,1.028); } }

  #tail { animation: tailsway 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 12% 88%; }
  @keyframes tailsway { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(9deg); } }

  .eye { transform-box: fill-box; transform-origin: 50% 50%; }
  .eye.blink { animation: eyeblink .16s ease-in-out; }
  @keyframes eyeblink { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.08); } }

  #earL { animation: eartwitch 7s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 90%; }
  #earR { animation: eartwitch 9.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 20% 90%; }
  @keyframes eartwitch { 0%, 93%, 100% { transform: rotate(0); } 95% { transform: rotate(-9deg); } 97% { transform: rotate(4deg); } }

  .paw { transform-box: fill-box; transform-origin: 50% 12%; }
  .paw.swat { animation: swat .62s cubic-bezier(.3,.9,.4,1); }
  @keyframes swat {
    0% { transform: rotate(0deg); }
    35% { transform: rotate(var(--aim, 0deg)) translateY(-34px); }
    62% { transform: rotate(var(--aim2, 0deg)) translateY(-30px); }
    100% { transform: rotate(0deg); }
  }

  #catAll { transform-box: fill-box; transform-origin: 50% 100%; }
  #catAll.hop { animation: hop .62s ease-out; }
  @keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-10px); } 100% { transform: translateY(0); } }
  #catAll.squash { animation: squash .48s ease-out; }
  @keyframes squash {
    0% { transform: scale(1,1); }
    35% { transform: scale(1.1,.86); }
    65% { transform: scale(.96,1.06); }
    100% { transform: scale(1,1); }
  }

  /* ---- speech bubble ---- */
  #mew {
    position: absolute;
    top: 2%; left: 50%;
    transform: translateX(-50%) scale(0);
    background: #fff8ef;
    color: #6b4a35;
    font-weight: 700;
    font-size: clamp(15px, 3.4vmin, 24px);
    padding: .45em .9em;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,.28);
    pointer-events: none;
    white-space: nowrap;
  }
  #mew::after {
    content: "";
    position: absolute;
    left: 50%; bottom: -7px;
    width: 14px; height: 14px;
    background: #fff8ef;
    transform: translateX(-50%) rotate(45deg);
    border-radius: 3px;
  }
  #mew.pop { animation: mewpop 1.4s ease forwards; }
  @keyframes mewpop {
    0% { transform: translateX(-50%) scale(0); opacity: 0; }
    18% { transform: translateX(-50%) scale(1.12); opacity: 1; }
    30% { transform: translateX(-50%) scale(1); }
    75% { transform: translateX(-50%) scale(1); opacity: 1; }
    100% { transform: translateX(-50%) translateY(-14px) scale(.9); opacity: 0; }
  }

  /* ---- floating hearts ---- */
  .heart {
    position: absolute;
    color: #ff9db1;
    font-size: clamp(16px, 3.6vmin, 26px);
    pointer-events: none;
    animation: floatheart 1.3s ease-out forwards;
  }
  @keyframes floatheart {
    0% { transform: translateY(0) scale(.4); opacity: 0; }
    25% { opacity: 1; transform: translateY(-14px) scale(1.15); }
    100% { transform: translateY(-70px) scale(.8) rotate(12deg); opacity: 0; }
  }

  #badge {
    position: fixed;
    left: 14px; bottom: 12px;
    color: rgba(255,235,210,.34);
    font: 11px/1.4 ui-monospace, monospace;
    letter-spacing: .04em;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="glow"></div>

<div id="stage">
  <div id="mew">mew!</div>
  <svg id="cat" viewBox="0 0 400 460" aria-label="a cute cat">
    <defs>
      <radialGradient id="fur" cx="42%" cy="32%" r="85%">
        <stop offset="0%" stop-color="#fffdf7"/>
        <stop offset="65%" stop-color="#fbf1dd"/>
        <stop offset="100%" stop-color="#f0d9b8"/>
      </radialGradient>
      <radialGradient id="patchg" cx="50%" cy="40%" r="70%">
        <stop offset="0%" stop-color="#f7c489"/>
        <stop offset="100%" stop-color="#efa25c"/>
      </radialGradient>
      <clipPath id="headClip"><circle cx="200" cy="188" r="118"/></clipPath>
      <filter id="soften" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="10"/>
      </filter>
    </defs>

    <ellipse cx="200" cy="434" rx="104" ry="13" fill="#000" opacity=".28"/>

    <g id="catAll">
      <!-- tail (behind body) -->
      <g id="tail">
        <ellipse cx="296" cy="368" rx="30" ry="44" transform="rotate(-18 296 368)"
                 fill="url(#fur)" stroke="#d8b48f" stroke-width="3"/>
        <ellipse cx="303" cy="338" rx="16" ry="24" transform="rotate(-18 303 338)" fill="url(#patchg)"/>
      </g>

      <g id="breathe">
        <!-- body -->
        <ellipse cx="200" cy="366" rx="70" ry="56" fill="url(#fur)" stroke="#d8b48f" stroke-width="3"/>
        <ellipse cx="152" cy="416" rx="25" ry="13" fill="url(#fur)" stroke="#d8b48f" stroke-width="3"/>
        <ellipse cx="248" cy="416" rx="25" ry="13" fill="url(#fur)" stroke="#d8b48f" stroke-width="3"/>

        <!-- front paws (these do the batting) -->
        <g id="pawL" class="paw">
          <rect x="150" y="370" width="34" height="52" rx="17" fill="url(#fur)" stroke="#d8b48f" stroke-width="3"/>
          <ellipse cx="167" cy="409" rx="6.5" ry="5.5" fill="#f2a3b3"/>
          <circle cx="158" cy="400" r="3.4" fill="#f2a3b3"/><circle cx="167" cy="398" r="3.4" fill="#f2a3b3"/><circle cx="176" cy="400" r="3.4" fill="#f2a3b3"/>
        </g>
        <g id="pawR" class="paw">
          <rect x="216" y="370" width="34" height="52" rx="17" fill="url(#fur)" stroke="#d8b48f" stroke-width="3"/>
          <ellipse cx="233" cy="409" rx="6.5" ry="5.5" fill="#f2a3b3"/>
          <circle cx="224" cy="400" r="3.4" fill="#f2a3b3"/><circle cx="233" cy="398" r="3.4" fill="#f2a3b3"/><circle cx="242" cy="400" r="3.4" fill="#f2a3b3"/>
        </g>

        <!-- head -->
        <g id="headG">
          <g id="earL">
            <path d="M112 96 C108 72 118 52 138 46 C156 41 162 58 166 72 Z" fill="url(#fur)" stroke="#d8b48f" stroke-width="3" stroke-linejoin="round"/>
            <path d="M122 84 C119 70 124 60 132 57 C140 55 145 63 148 71 Z" fill="#f7b3c2"/>
          </g>
          <g id="earR">
            <path d="M288 96 C292 72 282 52 262 46 C244 41 238 58 234 72 Z" fill="url(#fur)" stroke="#d8b48f" stroke-width="3" stroke-linejoin="round"/>
            <path d="M278 84 C281 70 276 60 268 57 C260 55 255 63 252 71 Z" fill="#f7b3c2"/>
          </g>
          <circle cx="200" cy="188" r="118" fill="url(#fur)" stroke="#d8b48f" stroke-width="3"/>
          <g clip-path="url(#headClip)">
            <path d="M72 100 Q 80 34 142 26 Q 202 20 208 84 Q 164 68 130 90 Q 94 110 72 100 Z"
                  fill="url(#patchg)" opacity=".8" filter="url(#soften)"/>
          </g>

          <!-- eyes -->
          <g class="eye" id="eyeL">
            <ellipse class="eye-white" cx="136" cy="214" rx="36" ry="38" fill="#fff" stroke="#c9a37f" stroke-width="2.5"/>
            <g class="pupil" id="pupilL">
              <ellipse cx="136" cy="218" rx="21" ry="24" fill="#463326"/>
              <circle cx="144" cy="208" r="8.5" fill="#fff"/>
              <circle cx="130" cy="226" r="4" fill="#fff" opacity=".9"/>
            </g>
          </g>
          <g class="eye" id="eyeR">
            <ellipse class="eye-white" cx="264" cy="214" rx="36" ry="38" fill="#fff" stroke="#c9a37f" stroke-width="2.5"/>
            <g class="pupil" id="pupilR">
              <ellipse cx="264" cy="218" rx="21" ry="24" fill="#463326"/>
              <circle cx="272" cy="208" r="8.5" fill="#fff"/>
              <circle cx="258" cy="226" r="4" fill="#fff" opacity=".9"/>
            </g>
          </g>

          <!-- blush -->
          <ellipse cx="126" cy="262" rx="16" ry="9" fill="#f6a8b8" opacity=".5"/>
          <ellipse cx="274" cy="262" rx="16" ry="9" fill="#f6a8b8" opacity=".5"/>

          <!-- nose + mouth -->
          <path id="noseEl" d="M193 250 Q200 246 207 250 Q204 257 200 257 Q196 257 193 250 Z" fill="#e88a9a"/>
          <path d="M200 257 Q200 264 192 264 M200 257 Q200 264 208 264" stroke="#a07a5c" stroke-width="3"
                fill="none" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </svg>
</div>

<div id="badge">v2026.09.30-12.20</div>

<script>
(function () {
  "use strict";
  var stage = document.getElementById('stage');
  var catAll = document.getElementById('catAll');
  var headG = document.getElementById('headG');
  var pupils = [document.getElementById('pupilL'), document.getElementById('pupilR')];
  var eyes = Array.prototype.slice.call(document.querySelectorAll('.eye'));
  var pawL = document.getElementById('pawL');
  var pawR = document.getElementById('pawR');
  var mew = document.getElementById('mew');

  var px = innerWidth / 2, py = innerHeight * 0.42;   // pointer pos
  var hasPointer = false;
  var lastBat = 0, batting = false;

  function catCenter() {
    var r = stage.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height * 0.52, w: r.width };
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  addEventListener('pointermove', function (e) {
    px = e.clientX; py = e.clientY; hasPointer = true;
  }, { passive: true });

  // ---- per-frame: eyes + head follow the pointer ----
  function tick() {
    var c = catCenter();
    var dx = (px - c.x) / Math.max(c.w, 1);
    var dy = (py - c.y) / Math.max(c.w, 1);
    var ex = clamp(dx * 26, -11, 11);
    var ey = clamp(dy * 26, -9, 11);
    for (var i = 0; i < pupils.length; i++) {
      pupils[i].setAttribute('transform', 'translate(' + ex + ',' + ey + ')');
    }
    headG.setAttribute('transform',
      'rotate(' + clamp(dx * 14, -8, 8).toFixed(2) + ' 200 188)' +
      ' translate(' + clamp(dx * 8, -5, 5).toFixed(2) + ',' + clamp(dy * 6, -4, 4).toFixed(2) + ')');

    // paw at the cursor when it gets close
    if (hasPointer && !batting) {
      var d = Math.hypot(px - c.x, py - c.y);
      var now = performance.now();
      if (d < c.w * 0.62 && now - lastBat > 1100) {
        bat(px < c.x ? pawL : pawR, px - c.x, py - c.y, true);
      }
    }
    requestAnimationFrame(tick);
  }

  // ---- whole-cat pulse (hop on swat, squash on tap) ----
  function pulseCat(cls) {
    catAll.classList.remove('hop', 'squash');
    void catAll.getBoundingClientRect();
    catAll.classList.add(cls);
  }
  catAll.addEventListener('animationend', function () {
    catAll.classList.remove('hop', 'squash');
  });

  // ---- the swat (CSS keyframes: same machinery as the working tail/ears/blink) ----
  function endSwat() {
    pawL.classList.remove('swat');
    pawR.classList.remove('swat');
    batting = false;
  }
  pawL.addEventListener('animationend', endSwat);
  pawR.addEventListener('animationend', endSwat);

  function bat(paw, dx, dy, hop) {
    if (batting) return;
    batting = true;
    lastBat = performance.now();
    var ang = clamp(Math.atan2(dy, dx) * 180 / Math.PI - 90, -75, 75);
    paw.style.setProperty('--aim', (ang * 0.55).toFixed(1) + 'deg');
    paw.style.setProperty('--aim2', ang.toFixed(1) + 'deg');
    paw.classList.remove('swat');
    void paw.getBoundingClientRect();   // restart the keyframes
    paw.classList.add('swat');
    if (hop !== false) pulseCat('hop');
    setTimeout(function () { if (batting) endSwat(); }, 900);  // safety: never get stuck mid-swat
  }

  // ---- blinking (whole eye, so the pupil blinks too) ----
  (function blinkLoop() {
    setTimeout(function () {
      eyes.forEach(function (e) { e.classList.add('blink'); });
      setTimeout(function () {
        eyes.forEach(function (e) { e.classList.remove('blink'); });
        blinkLoop();
      }, 180);
    }, 2200 + Math.random() * 3400);
  })();

  // ---- speech ----
  var words = ['mew!', 'mrrp!', 'prrp?', 'mew mew!', 'mrow!'];
  function say(t) {
    mew.textContent = t || words[(Math.random() * words.length) | 0];
    mew.classList.remove('pop');
    void mew.offsetWidth;
    mew.classList.add('pop');
  }

  // ---- hearts ----
  function hearts(n) {
    for (var i = 0; i < n; i++) {
      var h = document.createElement('div');
      h.className = 'heart';
      h.textContent = '\u2665';
      h.style.left = (30 + Math.random() * 40) + '%';
      h.style.top = (18 + Math.random() * 22) + '%';
      h.style.animationDelay = (i * 0.12) + 's';
      stage.appendChild(h);
      (function (el) { setTimeout(function () { el.remove(); }, 1800); })(h);
    }
  }

  // ---- tap / click: pounce + love ----
  addEventListener('pointerdown', function (e) {
    px = e.clientX; py = e.clientY; hasPointer = true;
    var c = catCenter();
    if (Math.hypot(px - c.x, py - c.y) < c.w * 0.75) {
      // the nearer paw swats toward the tap point (on touch, the finger IS the cursor)
      bat(px < c.x ? pawL : pawR, px - c.x, py - c.y, false);
      pulseCat('squash');
      say();
      hearts(3);
    }
  }, { passive: true });

  // ---- idle chatter: occasional soft mew ----
  (function idleChatter() {
    setTimeout(function () {
      if (Math.random() < 0.5) say();
      idleChatter();
    }, 14000 + Math.random() * 12000);
  })();

  // ---- temporary diagnostic: ?diag=swat auto-fires the swat on a timer ----
  if (/[?&]diag=swat/.test(location.search)) {
    setInterval(function () {
      if (!batting) bat(pawL, -120, -40, true);
    }, 1500);
    setInterval(function () {
      document.title = 'DIAG batting=' + batting +
        ' swat=' + !!document.querySelector('.paw.swat');
    }, 400);
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
