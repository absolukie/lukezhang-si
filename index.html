<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>lukezhang.si</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    background: radial-gradient(120vmin 90vmin at 50% 62%, #3d2b23 0%, #241a16 55%, #141013 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    cursor: pointer;
  }
  /* soft warm glow behind the cat */
  #glow {
    position: absolute;
    width: 92vmin; height: 92vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,196,140,.14) 0%, rgba(255,196,140,0) 62%);
    pointer-events: none;
  }
  #stage {
    position: relative;
    width: min(78vmin, 480px);
    aspect-ratio: 400 / 440;
  }
  #cat { width: 100%; height: 100%; display: block; overflow: visible; }

  /* ---- idle animations ---- */
  #breathe { animation: breathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.012,1.028); } }

  #tail { animation: tailsway 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 12% 88%; }
  @keyframes tailsway { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(9deg); } }

  .eye-white { transition: transform .12s ease; transform-box: fill-box; transform-origin: 50% 50%; }
  .eye-white.blink { transform: scaleY(.08); }

  #earL { animation: eartwitch 7s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 90%; }
  #earR { animation: eartwitch 9.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 20% 90%; }
  @keyframes eartwitch { 0%, 93%, 100% { transform: rotate(0); } 95% { transform: rotate(-9deg); } 97% { transform: rotate(4deg); } }

  .paw { transform-box: fill-box; transform-origin: 50% 12%; }

  /* ---- speech bubble ---- */
  #mew {
    position: absolute;
    top: 2%; left: 50%;
    transform: translateX(-50%) scale(0);
    background: #fff8ef;
    color: #6b4a35;
    font-weight: 700;
    font-size: clamp(15px, 3.4vmin, 24px);
    padding: .45em .9em;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,.28);
    pointer-events: none;
    white-space: nowrap;
  }
  #mew::after {
    content: "";
    position: absolute;
    left: 50%; bottom: -7px;
    width: 14px; height: 14px;
    background: #fff8ef;
    transform: translateX(-50%) rotate(45deg);
    border-radius: 3px;
  }
  #mew.pop { animation: mewpop 1.4s ease forwards; }
  @keyframes mewpop {
    0% { transform: translateX(-50%) scale(0); opacity: 0; }
    18% { transform: translateX(-50%) scale(1.12); opacity: 1; }
    30% { transform: translateX(-50%) scale(1); }
    75% { transform: translateX(-50%) scale(1); opacity: 1; }
    100% { transform: translateX(-50%) translateY(-14px) scale(.9); opacity: 0; }
  }

  /* ---- floating hearts ---- */
  .heart {
    position: absolute;
    color: #ff9db1;
    font-size: clamp(16px, 3.6vmin, 26px);
    pointer-events: none;
    animation: floatheart 1.3s ease-out forwards;
  }
  @keyframes floatheart {
    0% { transform: translateY(0) scale(.4); opacity: 0; }
    25% { opacity: 1; transform: translateY(-14px) scale(1.15); }
    100% { transform: translateY(-70px) scale(.8) rotate(12deg); opacity: 0; }
  }

  #badge {
    position: fixed;
    left: 14px; bottom: 12px;
    color: rgba(255,235,210,.34);
    font: 11px/1.4 ui-monospace, monospace;
    letter-spacing: .04em;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="glow"></div>

<div id="stage">
  <div id="mew">mew!</div>
  <svg id="cat" viewBox="0 0 400 440" aria-label="a cute cat">
    <defs>
      <radialGradient id="fur" cx="42%" cy="34%" r="80%">
        <stop offset="0%" stop-color="#fdf3e3"/>
        <stop offset="70%" stop-color="#f6e3c6"/>
        <stop offset="100%" stop-color="#ecd0a8"/>
      </radialGradient>
      <radialGradient id="belly" cx="50%" cy="40%" r="70%">
        <stop offset="0%" stop-color="#fffaf1"/>
        <stop offset="100%" stop-color="#f7e7cd"/>
      </radialGradient>
    </defs>

    <ellipse cx="200" cy="414" rx="112" ry="17" fill="#000" opacity=".28"/>

    <g id="catAll">
      <!-- tail (behind body) -->
      <g id="tail">
        <path d="M292 372 C 352 366, 366 300, 330 268 C 312 250, 288 258, 288 280 C 288 300, 312 306, 318 326 C 322 342, 308 356, 290 358 Z"
              fill="url(#fur)" stroke="#d9b98c" stroke-width="3" stroke-linejoin="round"/>
        <path d="M306 292 q 14 -6 22 6" stroke="#e0a56a" stroke-width="7" stroke-linecap="round" fill="none" opacity=".8"/>
        <path d="M312 318 q 12 -4 18 8" stroke="#e0a56a" stroke-width="7" stroke-linecap="round" fill="none" opacity=".8"/>
      </g>

      <g id="breathe">
        <!-- body -->
        <ellipse cx="200" cy="330" rx="88" ry="76" fill="url(#fur)" stroke="#d9b98c" stroke-width="3"/>
        <ellipse cx="200" cy="348" rx="52" ry="52" fill="url(#belly)" opacity=".9"/>
        <!-- back feet -->
        <ellipse cx="132" cy="398" rx="30" ry="17" fill="url(#fur)" stroke="#d9b98c" stroke-width="3"/>
        <ellipse cx="268" cy="398" rx="30" ry="17" fill="url(#fur)" stroke="#d9b98c" stroke-width="3"/>
        <g stroke="#d9b98c" stroke-width="2.5" opacity=".8">
          <line x1="124" y1="392" x2="124" y2="404"/><line x1="140" y1="390" x2="140" y2="403"/>
          <line x1="260" y1="390" x2="260" y2="403"/><line x1="276" y1="392" x2="276" y2="404"/>
        </g>

        <!-- front paws (these do the batting) -->
        <g id="pawL" class="paw">
          <rect x="138" y="318" width="44" height="72" rx="22" fill="url(#fur)" stroke="#d9b98c" stroke-width="3"/>
          <g stroke="#d9b98c" stroke-width="2.5" opacity=".8">
            <line x1="152" y1="378" x2="152" y2="388"/><line x1="164" y1="380" x2="164" y2="390"/>
          </g>
          <ellipse cx="160" cy="368" rx="13" ry="10" fill="#f9d9c4" opacity=".9"/>
        </g>
        <g id="pawR" class="paw">
          <rect x="218" y="318" width="44" height="72" rx="22" fill="url(#fur)" stroke="#d9b98c" stroke-width="3"/>
          <g stroke="#d9b98c" stroke-width="2.5" opacity=".8">
            <line x1="236" y1="380" x2="236" y2="390"/><line x1="248" y1="378" x2="248" y2="388"/>
          </g>
          <ellipse cx="240" cy="368" rx="13" ry="10" fill="#f9d9c4" opacity=".9"/>
        </g>

        <!-- head -->
        <g id="headG">
          <g id="earL">
            <path d="M112 108 L96 34 L168 74 Z" fill="url(#fur)" stroke="#d9b98c" stroke-width="3" stroke-linejoin="round"/>
            <path d="M114 92 L106 52 L146 76 Z" fill="#f7b8c4"/>
          </g>
          <g id="earR">
            <path d="M288 108 L304 34 L232 74 Z" fill="url(#fur)" stroke="#d9b98c" stroke-width="3" stroke-linejoin="round"/>
            <path d="M286 92 L294 52 L254 76 Z" fill="#f7b8c4"/>
          </g>
          <circle cx="200" cy="170" r="98" fill="url(#fur)" stroke="#d9b98c" stroke-width="3"/>
          <!-- forehead stripes -->
          <g stroke="#e0a56a" stroke-width="9" stroke-linecap="round" opacity=".75">
            <line x1="178" y1="88" x2="174" y2="112"/>
            <line x1="200" y1="84" x2="200" y2="110"/>
            <line x1="222" y1="88" x2="226" y2="112"/>
          </g>

          <!-- eyes -->
          <g id="eyeL">
            <ellipse class="eye-white" cx="152" cy="168" rx="27" ry="33" fill="#fff"/>
            <g class="pupil" id="pupilL">
              <ellipse cx="152" cy="172" rx="14.5" ry="19" fill="#3a2c22"/>
              <circle cx="157" cy="164" r="5.5" fill="#fff"/>
              <circle cx="147" cy="178" r="2.6" fill="#fff" opacity=".85"/>
            </g>
          </g>
          <g id="eyeR">
            <ellipse class="eye-white" cx="248" cy="168" rx="27" ry="33" fill="#fff"/>
            <g class="pupil" id="pupilR">
              <ellipse cx="248" cy="172" rx="14.5" ry="19" fill="#3a2c22"/>
              <circle cx="253" cy="164" r="5.5" fill="#fff"/>
              <circle cx="243" cy="178" r="2.6" fill="#fff" opacity=".85"/>
            </g>
          </g>

          <!-- blush -->
          <ellipse cx="112" cy="212" rx="17" ry="11" fill="#f5a3b5" opacity=".55"/>
          <ellipse cx="288" cy="212" rx="17" ry="11" fill="#f5a3b5" opacity=".55"/>

          <!-- nose + mouth -->
          <path d="M191 202 Q200 197 209 202 Q205 211 200 211 Q195 211 191 202 Z" fill="#e87f96"/>
          <path d="M200 211 Q200 220 190 221 M200 211 Q200 220 210 221" stroke="#8a6a52" stroke-width="3.5"
                fill="none" stroke-linecap="round"/>

          <!-- whiskers -->
          <g stroke="#cbb59a" stroke-width="2.5" stroke-linecap="round" opacity=".9">
            <line x1="104" y1="200" x2="66" y2="192"/><line x1="104" y1="212" x2="68" y2="214"/>
            <line x1="296" y1="200" x2="334" y2="192"/><line x1="296" y1="212" x2="332" y2="214"/>
          </g>
        </g>
      </g>
    </g>
  </svg>
</div>

<div id="badge">v2026.09.30-11.00</div>

<script>
(function () {
  "use strict";
  var stage = document.getElementById('stage');
  var catAll = document.getElementById('catAll');
  var headG = document.getElementById('headG');
  var pupils = [document.getElementById('pupilL'), document.getElementById('pupilR')];
  var eyeWhites = Array.prototype.slice.call(document.querySelectorAll('.eye-white'));
  var pawL = document.getElementById('pawL');
  var pawR = document.getElementById('pawR');
  var mew = document.getElementById('mew');

  var px = innerWidth / 2, py = innerHeight * 0.42;   // pointer pos
  var hasPointer = false;
  var lastBat = 0, batting = false;

  function catCenter() {
    var r = stage.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height * 0.52, w: r.width };
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  addEventListener('pointermove', function (e) {
    px = e.clientX; py = e.clientY; hasPointer = true;
  }, { passive: true });

  // ---- per-frame: eyes + head follow the pointer ----
  function tick() {
    var c = catCenter();
    var dx = (px - c.x) / Math.max(c.w, 1);
    var dy = (py - c.y) / Math.max(c.w, 1);
    var ex = clamp(dx * 26, -11, 11);
    var ey = clamp(dy * 26, -9, 11);
    for (var i = 0; i < pupils.length; i++) {
      pupils[i].setAttribute('transform', 'translate(' + ex + ',' + ey + ')');
    }
    headG.setAttribute('transform',
      'rotate(' + clamp(dx * 14, -8, 8).toFixed(2) + ' 200 170)' +
      ' translate(' + clamp(dx * 8, -5, 5).toFixed(2) + ',' + clamp(dy * 6, -4, 4).toFixed(2) + ')');

    // paw at the cursor when it gets close
    if (hasPointer && !batting) {
      var d = Math.hypot(px - c.x, py - c.y);
      var now = performance.now();
      if (d < c.w * 0.62 && now - lastBat > 1100) {
        lastBat = now;
        bat(px < c.x ? pawL : pawR, px - c.x, py - c.y);
      }
    }
    requestAnimationFrame(tick);
  }

  // ---- the swat ----
  function bat(paw, dx, dy) {
    batting = true;
    var ang = clamp(Math.atan2(dy, dx) * 180 / Math.PI - 90, -75, 75);
    var lift = 'rotate(' + (ang * 0.55).toFixed(1) + 'deg) translateY(-34px)';
    var swipe = 'rotate(' + ang.toFixed(1) + 'deg) translateY(-30px)';
    var a = paw.animate(
      [{ transform: 'rotate(0deg)' },
       { transform: lift, offset: 0.35 },
       { transform: swipe, offset: 0.62 },
       { transform: 'rotate(0deg)' }],
      { duration: 620, easing: 'cubic-bezier(.3,.9,.4,1)' });
    // happy little hop with the swat
    catAll.animate(
      [{ transform: 'translateY(0)' },
       { transform: 'translateY(-10px)', offset: 0.4 },
       { transform: 'translateY(0)' }],
      { duration: 620, easing: 'ease-out' });
    a.onfinish = function () { batting = false; };
  }

  // ---- blinking ----
  (function blinkLoop() {
    setTimeout(function () {
      eyeWhites.forEach(function (e) { e.classList.add('blink'); });
      setTimeout(function () {
        eyeWhites.forEach(function (e) { e.classList.remove('blink'); });
        blinkLoop();
      }, 160);
    }, 2200 + Math.random() * 3400);
  })();

  // ---- speech ----
  var words = ['mew!', 'mrrp!', 'prrp?', 'mew mew!', 'mrow!'];
  function say(t) {
    mew.textContent = t || words[(Math.random() * words.length) | 0];
    mew.classList.remove('pop');
    void mew.offsetWidth;
    mew.classList.add('pop');
  }

  // ---- hearts ----
  function hearts(n) {
    for (var i = 0; i < n; i++) {
      var h = document.createElement('div');
      h.className = 'heart';
      h.textContent = '\u2665';
      h.style.left = (30 + Math.random() * 40) + '%';
      h.style.top = (18 + Math.random() * 22) + '%';
      h.style.animationDelay = (i * 0.12) + 's';
      stage.appendChild(h);
      (function (el) { setTimeout(function () { el.remove(); }, 1800); })(h);
    }
  }

  // ---- tap / click: pounce + love ----
  addEventListener('pointerdown', function (e) {
    px = e.clientX; py = e.clientY; hasPointer = true;
    var c = catCenter();
    if (Math.hypot(px - c.x, py - c.y) < c.w * 0.75) {
      catAll.animate(
        [{ transform: 'scale(1,1)' },
         { transform: 'scale(1.1,.86)', offset: 0.35 },
         { transform: 'scale(.96,1.06)', offset: 0.65 },
         { transform: 'scale(1,1)' }],
        { duration: 480, easing: 'ease-out' });
      say();
      hearts(3);
    }
  }, { passive: true });

  // ---- idle chatter: occasional soft mew ----
  (function idleChatter() {
    setTimeout(function () {
      if (Math.random() < 0.5) say();
      idleChatter();
    }, 14000 + Math.random() * 12000);
  })();

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
