<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memes , lukezhang.si</title>
<meta name="description" content="Luke's meme collection.">
<style>
:root{
  --bg:#141311; --panel:#1d1b17; --panel2:#26231d; --line:#3a362c;
  --ink:#f2ede0; --muted:#a39c88; --faint:#6f695b; --accent:#e8a33d;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;
  line-height:1.6;}
.wrap{max-width:1080px;margin:0 auto;padding:40px 20px 80px;}
nav.top{margin-bottom:28px;font-size:14px;}
nav.top a{color:rgba(243,226,205,.55);text-decoration:none;}
nav.top a:hover{color:var(--accent);}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;}
h1{font-size:clamp(34px,8vw,54px);letter-spacing:-0.02em;margin:0 0 8px;line-height:1.05;}
.sub{color:var(--muted);font-size:17px;margin:0 0 26px;max-width:560px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;padding:8px 14px;border-radius:99px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;touch-action:manipulation;}
.chip.on{background:var(--accent);border-color:var(--accent);color:#141311;font-weight:700;}
.count{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;color:var(--faint);margin-bottom:16px;text-transform:uppercase;}
.grid{column-count:3;column-gap:18px;}
@media(max-width:900px){.grid{column-count:2;}}
@media(max-width:600px){.grid{column-count:1;}}
.card{break-inside:avoid;margin-bottom:18px;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;}
.card img{width:100%;display:block;}
.card .body{padding:18px 20px 20px;}
.card .text{font-size:21px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;margin:0 0 8px;}
.card .title{font-size:13.5px;color:var(--faint);margin:0 0 10px;}
.card .desc{font-size:14.5px;color:var(--muted);margin:0 0 12px;}
.card .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.card .author{font-family:var(--mono);font-size:12px;color:var(--muted);}
.card .src{font-family:var(--mono);font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap;}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;}
.card .tag{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--faint);
  border:1px solid var(--line);border-radius:99px;padding:3px 10px;}
.card.hide{display:none;}
footer.end{margin-top:44px;font-size:13px;color:var(--faint);border-top:1px solid var(--line);padding-top:18px;}
@media (prefers-reduced-motion:reduce){.chip{transition:none;}}
</style>
<style>
.empty{text-align:center; padding:80px 20px; color:var(--muted);}
.empty p{font-size:19px; margin:0;}
</style>
</head>
<body>
<div class="wrap">
<nav class="top"><a href="/">&larr; lukezhang.si</a></nav>
<p class="kicker">memes</p>
<h1>memes</h1>
<div class="empty">
<p>no rare memes found</p>
</div>
</div>
</body>
</html>
