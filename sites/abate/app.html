<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABATE: Asbestos Abatement Compliance Dossier</title>
<meta name="description" content="Compliance-dossier software for asbestos abatement contractors. Daily logs, air monitoring, waste manifests, clearance certificates, assembled into one audit-proof file.">
<style>
:root{
  --bg:#141414; --bg2:#1d1d1d; --bg3:#262626; --line:#333;
  --ink:#f2f2f2; --muted:#a8a8a8; --dim:#6e6e6e;
  --orange:#ff6a00; --orange-d:#c25200;
  --green:#2ecc71; --red:#ff4d4d; --amber:#ffb020; --blue:#4da3ff;
  --radius:10px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.45;}
button{touch-action:manipulation; font-size:16px; cursor:pointer;}
input,select,textarea{font-size:16px !important; width:100%; background:#101010; color:var(--ink);
  border:1px solid var(--line); border-radius:8px; padding:12px; margin:0;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--orange); border-color:var(--orange);}
label{display:block; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:14px 0 6px;}
.stencil{font-family:"Arial Black","Archivo Black",Impact,Haettenschweiler,sans-serif;
  text-transform:uppercase; letter-spacing:.06em;}
#app{max-width:860px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
header.top{position:sticky; top:0; z-index:20; background:#0d0d0d; border-bottom:3px solid var(--orange);
  padding:10px 14px; display:flex; align-items:center; gap:10px;}
.logo{display:flex; align-items:center; gap:9px;}
.logo .mark{width:34px;height:34px;flex:0 0 34px;}
.logo .name{font-size:20px; color:#fff;}
.logo .name em{font-style:normal; color:var(--orange);}
.hazard{height:8px; background:repeating-linear-gradient(-45deg,var(--orange) 0 14px,#141414 14px 28px);}
main{flex:1; padding:14px 14px 96px;}
.disclaimer{background:#2a1a05; border:1px solid var(--orange-d); color:#ffd9ae; border-radius:var(--radius);
  padding:10px 12px; font-size:13px; margin-bottom:14px;}
.disclaimer strong{color:var(--orange);}
/* cards */
.card{background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
.card h3{margin:0 0 8px; font-size:15px;}
.row{display:flex; gap:10px; align-items:center;}
.grow{flex:1;}
.muted{color:var(--muted);} .dim{color:var(--dim);} .small{font-size:13px;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
/* buttons */
.btn{display:inline-flex; align-items:center; gap:8px; justify-content:center;
  background:var(--orange); color:#141414; border:none; border-radius:9px; padding:13px 18px;
  font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:15px;}
.btn:active{transform:scale(.98);}
.btn.ghost{background:transparent; color:var(--orange); border:2px solid var(--orange);}
.btn.dark{background:var(--bg3); color:var(--ink); border:1px solid var(--line);}
.btn.danger{background:transparent; color:var(--red); border:1px solid var(--red);}
.btn.block{width:100%;}
.btn.sm{padding:9px 12px; font-size:13px;}
svg.ic{width:18px; height:18px; flex:0 0 18px;}
/* project list */
.proj{background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
.proj .t{font-size:18px; font-weight:800; margin:0 0 2px;}
.proj .a{color:var(--muted); font-size:14px; margin-bottom:10px;}
.meter{height:10px; background:#0e0e0e; border-radius:6px; overflow:hidden; border:1px solid var(--line);}
.meter > i{display:block; height:100%; background:linear-gradient(90deg,var(--orange-d),var(--orange)); transition:width .5s;}
.meter.green > i{background:linear-gradient(90deg,#1e9e54,var(--green));}
.meter.red > i{background:linear-gradient(90deg,#a11,var(--red));}
.pill{display:inline-block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  padding:4px 10px; border-radius:20px; border:1px solid var(--line); color:var(--muted);}
.pill.active{color:var(--amber); border-color:var(--amber);}
.pill.clear{color:var(--blue); border-color:var(--blue);}
.pill.closed{color:var(--green); border-color:var(--green);}
.alert{background:#2b0d0d; border:1px solid var(--red); color:#ffc9c9; border-radius:var(--radius); padding:10px 12px; margin-bottom:12px; font-size:14px;}
.alert b{color:var(--red);}
/* tabs */
.tabs{position:sticky; top:57px; z-index:15; background:#0d0d0d; margin:0 -14px; padding:8px 14px;
  display:flex; gap:8px; overflow-x:auto; border-bottom:1px solid var(--line); scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto; background:var(--bg3); color:var(--muted); border:1px solid var(--line);
  border-radius:20px; padding:9px 14px; font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
.tab.on{background:var(--orange); border-color:var(--orange); color:#141414;}
/* fab */
.fab{position:fixed; right:18px; bottom:24px; width:62px; height:62px; border-radius:50%;
  background:var(--orange); color:#141414; border:none; font-size:34px; line-height:1;
  box-shadow:0 6px 24px rgba(255,106,0,.4); z-index:30; display:flex; align-items:center; justify-content:center;}
/* sheet (modal form) */
.sheet-wrap{position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:40; display:none; align-items:flex-end; justify-content:center;}
.sheet-wrap.open{display:flex;}
.sheet{background:var(--bg2); width:100%; max-width:860px; max-height:92vh; overflow-y:auto;
  border-radius:16px 16px 0 0; border-top:3px solid var(--orange); padding:18px 16px 40px;}
.sheet h2{margin:0 0 4px; font-size:19px;}
.checks{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px;}
.check{display:flex; gap:8px; align-items:center; background:#101010; border:1px solid var(--line);
  border-radius:8px; padding:10px; font-size:14px;}
.check input{width:auto; margin:0;}
.kv{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--muted);}
.badge{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; padding:4px 10px; border-radius:6px;}
.badge.pass{background:#0e2b1a; color:var(--green); border:1px solid var(--green);}
.badge.fail{background:#2b0d0d; color:var(--red); border:1px solid var(--red);}
.badge.pend{background:#2a1e05; color:var(--amber); border:1px solid var(--amber);}
.badge.info{background:#0d1c2b; color:var(--blue); border:1px solid var(--blue);}
/* timeline */
.tl{position:relative; margin:8px 0 0 6px; padding-left:22px; border-left:2px solid var(--line);}
.tl .ev{position:relative; padding:0 0 16px;}
.tl .ev::before{content:""; position:absolute; left:-29px; top:2px; width:12px; height:12px; border-radius:50%;
  background:var(--bg); border:2px solid var(--orange);}
.tl .ev.warn::before{border-color:var(--red);}
.tl .ev.good::before{border-color:var(--green);}
.tl .when{font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em;}
.tl .what{font-size:15px; margin-top:2px;}
/* ring */
.ringwrap{display:flex; align-items:center; gap:14px;}
.ring{transform:rotate(-90deg);}
.ring .bg{stroke:#2c2c2c;}
.ring .fg{stroke:var(--orange); transition:stroke-dashoffset .6s;}
.ringtxt{font-size:26px; font-weight:800;}
/* photos */
.photogrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.photo{position:relative; border-radius:8px; overflow:hidden; border:1px solid var(--line); aspect-ratio:1; background:#0e0e0e;}
.photo img{width:100%; height:100%; object-fit:cover; display:block;}
.photo .cap{position:absolute; left:0; right:0; bottom:0; font-size:10px; padding:4px 6px;
  background:rgba(0,0,0,.75); color:#fff;}
.photo .ts{position:absolute; top:4px; left:4px; font-size:10px; background:rgba(0,0,0,.75);
  color:var(--orange); padding:2px 6px; border-radius:4px; font-family:ui-monospace,monospace;}
.empty{border:2px dashed var(--line); border-radius:var(--radius); padding:26px 16px; text-align:center; color:var(--dim); font-size:14px;}
.print-only{display:none;}
footer.app{padding:18px 14px 110px; color:var(--dim); font-size:12px; text-align:center; border-top:1px solid var(--line);}
.toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(16px); background:#262626;
  border:1px solid var(--orange); color:var(--ink); padding:12px 18px; border-radius:10px; font-size:14px;
  font-weight:600; z-index:70; opacity:0; transition:opacity .25s, transform .25s; max-width:92vw;
  text-align:center; pointer-events:none;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.coach{position:fixed; left:12px; right:12px; bottom:96px; z-index:65; background:#1d1d1d;
  border:2px solid var(--orange); border-radius:14px; padding:16px; box-shadow:0 10px 40px rgba(0,0,0,.6);}
.coach h3{margin:0 0 6px; font-size:16px; color:var(--orange);}
.coach p{margin:0 0 12px; font-size:14px; color:var(--muted);}
.coach .dots{display:flex; gap:6px; margin-bottom:12px;}
.coach .dots i{width:8px; height:8px; border-radius:50%; background:#3a3a3a;}
.coach .dots i.on{background:var(--orange);}
.verdict{display:inline-block; font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
  padding:6px 14px; border-radius:8px; margin-top:8px;}
.verdict.ready{background:#0e2b1a; color:var(--green); border:1px solid var(--green);}
.verdict.soon{background:#2a1e05; color:var(--amber); border:1px solid var(--amber);}
.verdict.early{background:#2b0d0d; color:var(--red); border:1px solid var(--red);}
.misslist{margin:10px 0 0; padding:0; list-style:none;}
.misslist li{font-size:14px; color:var(--muted); padding:7px 0 7px 28px; position:relative; border-bottom:1px solid var(--line);}
.misslist li:last-child{border-bottom:none;}
.misslist li::before{content:""; position:absolute; left:4px; top:11px; width:14px; height:14px; border-radius:4px;
  border:2px solid var(--amber);}
.countdown{font-weight:800;}
.countdown.over{color:var(--red);}
.countdown.soon{color:var(--amber);}
/* custody chain stepper */
.chain{display:flex; align-items:flex-start; margin:12px 0 4px;}
.clink{flex:1; text-align:center; position:relative; font-size:11px; color:var(--dim);}
.clink::before{content:""; position:absolute; top:14px; left:-50%; width:100%; height:2px; background:var(--line); z-index:0;}
.clink:first-child::before{display:none;}
.clink.done::before{background:var(--green);}
.cdot{width:28px; height:28px; border-radius:50%; border:2px solid var(--line); background:#101010;
  display:flex; align-items:center; justify-content:center; margin:0 auto 4px; position:relative; z-index:1; color:var(--green);}
.clink.done .cdot{border-color:var(--green); background:#0e2b1a;}
.clink .who{font-size:10px; color:var(--dim); display:block; margin-top:2px; line-height:1.35;}
@media print{
  header.top,.tabs,.fab,.sheet-wrap,.disclaimer,.btn,footer.app,.no-print,#dashSearch{display:none !important;}
  .print-only{display:block !important;}
  body{background:#fff; color:#000; font-size:12px;}
  #app{max-width:100%;}
  main{padding:44px 0 0;}
  .card,.proj{background:#fff; border:1px solid #999; color:#000; break-inside:avoid;}
  .muted,.dim,.kv .k{color:#444;}
  .print-head{position:fixed; top:0; left:0; right:0; background:#fff; border-bottom:2px solid #000;
    padding:8px 12px; font-size:11px;}
  .print-section{break-before:page;}
  table.ptab{width:100%; border-collapse:collapse; margin-top:8px;}
  table.ptab th,table.ptab td{border:1px solid #999; padding:6px 8px; font-size:12px; text-align:left;}
  .pthumbs{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:8px;}
  .pthumbs img{width:100%; border:1px solid #999; display:block;}
}
</style>
</head>

<script>
"use strict";
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO=()=>new Date().toISOString().slice(0,10);
const fmtD=iso=>{ if(!iso) return "–"; const d=new Date(iso+"T12:00:00"); return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); };
const fmtDT=ts=>new Date(ts).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const store={
  loadRaw(){ try{ return localStorage.getItem("abate.v1"); }catch(e){ return null; } },
  load(){ try{ return JSON.parse(localStorage.getItem("abate.v1"))||null; }catch(e){ return null; } },
  /* Returns false instead of throwing when the device is out of space. */
  save(d){ try{ localStorage.setItem("abate.v1", JSON.stringify(d)); return true; }catch(e){ return false; } }
};
/* Quota-safe save state: once a save fails, the app keeps rendering but no
 * further save is attempted until the user taps Retry on the visible banner. */
let saveFailed=false;
</script>

   "Critical barriers and the decon unit flaps stay sealed all shift.",

  const c=document.createElement("canvas"); c.width=320; c.height=320;
  const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,320,320); g.addColorStop(0,"hsl("+hue+",30%,22%)"); g.addColorStop(1,"hsl("+hue+",25%,10%)");
  x.fillStyle=g; x.fillRect(0,0,320,320);
  x.strokeStyle="rgba(255,106,0,.55)"; x.lineWidth=3;
  for(let i=0;i<5;i++){ x.strokeRect(24+i*14,24+i*14,272-i*28,272-i*28); }
  x.fillStyle="#ff6a00"; x.font="bold 26px Arial"; x.textAlign="center";
  x.fillText(label,160,160);
  x.fillStyle="rgba(255,255,255,.65)"; x.font="15px Arial";
  x.fillText("SAMPLE PLACEHOLDER",160,190);
  return c.toDataURL("image/jpeg",0.7);
}

 * Existing installs get the synthetic flag via migration on demo1. */
function loadDb(){
  const raw=store.loadRaw();
  if(raw===null){ const db=seed(); store.save(db); return db; }

    if(db&&Array.isArray(db.projects)){

        (p.manifests||[]).forEach(m=>{ if(!Array.isArray(m.custody)){ m.custody=[]; dirty=true; } });
      });

}

function completeness(p){
  const parts=[];
  const setup = (p.neshapNotified?0.5:0) + (p.competentPerson?0.5:0);
  parts.push({label:"Regulatory setup (NESHAP notice + competent person)", pct:setup*15, max:15});
  const logs=live(p.dailyLogs), samples=live(p.airSamples), manis=live(p.manifests), photos=live(p.photos);
  parts.push({label:"Daily logs ("+logs.length+")", pct:Math.min(logs.length,3)/3*10, max:10});
  const hasArea=samples.some(s=>s.type!=="clearance"), hasClear=samples.some(s=>s.type==="clearance");
  parts.push({label:"Air monitoring (work-area + clearance samples)", pct:((hasArea?0.6:0)+(hasClear?0.4:0))*15, max:15});
  const m=manis, allSigned=m.length>0&&m.every(x=>x.signedCopyReceived);
  parts.push({label:"Waste manifests ("+m.length+", "+(allSigned?"all signed":"awaiting signatures")+")",
    pct:(m.length?0.5:0)*20 + (allSigned?0.5:0)*20, max:20});
  parts.push({label:"Photo documentation ("+photos.length+")", pct:Math.min(photos.length,6)/6*10, max:10});
  const cl=p.clearance, keys=["visual","airClear","wasteShipped","manifestsBack","neshapFiled","areaReleased"];
  const done=keys.filter(k=>cl[k]).length;
  parts.push({label:"Clearance certificate ("+done+"/6)", pct:done/6*30, max:30});
  /* Pass 3: toolbox talks are bonus evidence. They can push a near-complete
   * dossier to 100, the total is capped, and the row is labeled bonus. */
  const talks=live(p.toolboxTalks);
  parts.push({label:"Toolbox talks ("+talks.length+") bonus", pct:Math.min(talks.length,5), max:5, bonus:true});
  const total=Math.min(100,Math.round(parts.reduce((a,x)=>a+x.pct,0)));
  return {parts, total};
}
function missingItems(p){

/* Site coverage map: relative positions of GPS-tagged photos on a canvas.
 * Explicitly labeled relative, not to scale, never a survey. */
function paintCovMap(p){
  const cv=document.getElementById("covMap"); if(!cv) return;
  const tagged=live(p.photos).filter(x=>x.lat!=null&&x.lng!=null).sort((a,b)=>a.takenAt-b.takenAt);
  if(!tagged.length) return;
  const W=cv.clientWidth||320, H=220, dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr;
  const g=cv.getContext("2d"); g.scale(dpr,dpr);
  const lats=tagged.map(x=>x.lat), lngs=tagged.map(x=>x.lng);
  let loLa=Math.min.apply(null,lats), hiLa=Math.max.apply(null,lats),
      loLn=Math.min.apply(null,lngs), hiLn=Math.max.apply(null,lngs);
  if(hiLa-loLa<1e-7){ hiLa+=5e-6; loLa-=5e-6; }
  if(hiLn-loLn<1e-7){ hiLn+=5e-6; loLn-=5e-6; }
  const pad=30;
  const X=lng=>pad+(lng-loLn)/(hiLn-loLn)*(W-2*pad);
  const Y=lat=>pad+(hiLa-lat)/(hiLa-loLa)*(H-2*pad);
  g.strokeStyle="#2c2c2c"; g.lineWidth=1;
  for(let i=0;i<=4;i++){
    const gx=pad+i*(W-2*pad)/4, gy=pad+i*(H-2*pad)/4;
    g.beginPath(); g.moveTo(gx,0); g.lineTo(gx,H); g.stroke();
    g.beginPath(); g.moveTo(0,gy); g.lineTo(W,gy); g.stroke();
  }
  tagged.forEach((t,i)=>{
    const cx=X(t.lng), cy=Y(t.lat);
    g.fillStyle="#ff6a00"; g.beginPath(); g.arc(cx,cy,13,0,7); g.fill();
    g.fillStyle="#141414"; g.font="bold 12px sans-serif"; g.textAlign="center"; g.textBaseline="middle";
    g.fillText(String(i+1),cx,cy+0.5);
  });
}

function renderProject(main,p){

  let body="";

  else if(view.tab==="daily") body=vDaily(p);
  else if(view.tab==="toolbox") body=vToolbox(p);
  else if(view.tab==="air") body=vAir(p);
  else if(view.tab==="waste") body=vWaste(p);
  else if(view.tab==="photos") body=vPhotos(p);
  else if(view.tab==="clearance") body=vClearance(p);
  else body=vDossier(p,c);
  main.innerHTML='<div class="card"><div class="row"><div class="grow"><h3 class="stencil" style="font-size:17px">'+esc(p.name)+
    (p.synthetic?' <span class="badge pend">Synthetic demo data</span>':"")+'</h3>'+
    '<div class="small muted">'+esc(p.address)+'</div></div><div class="ringwrap">'+ring(c.total,64)+
    '<div><div class="ringtxt">'+c.total+'<span class="small">%</span></div><div class="small dim">dossier</div></div></div></div></div>'+
    '<div class="tabs">'+tabs+'</div><div style="height:12px"></div>'+body;
  main.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ view.tab=b.dataset.tab; save(); });
  bindActions(main,p);
  if(view.tab==="photos") paintCovMap(p);
  const rn=document.getElementById("ringNum");
  if(rn){ const target=c.total; let n=0; const step=Math.max(1,Math.round(target/30));
    const tick=()=>{ n=Math.min(target,n+step); rn.textContent=n; if(n<target) requestAnimationFrame(tick); };
    requestAnimationFrame(tick); }
  showCoach("abate.coach1", COACH_STEPS);
  if(view.tab==="air") showCoach("abate.coachAir", COACH_AIR);
  if(view.tab==="waste") showCoach("abate.coachWaste", COACH_WASTE);
  /* The Audit Moment: first time the dossier hits 100%, celebrate it, then
   * offer the one-tap print of the assembled file. */
  if(view.tab==="dossier" && c.total>=100 && !p.auditReadySeen){
    p.auditReadySeen=true; persist();
    setTimeout(()=>auditMoment(p), 500);
  }
}

function showCoach(key, steps){
  if(!steps || !steps.length || localStorage.getItem(key)) return;
  let i=0;
  const paint=()=>{
    let el=document.getElementById("coach");
    if(!el){ el=document.createElement("div"); el.id="coach"; el.className="coach"; document.body.appendChild(el); }
    el.innerHTML='<div class="dots">'+steps.map((_,k)=>'<i class="'+(k===i?"on":"")+'"></i>').join("")+'</div>'+
      '<h3>'+esc(steps[i][0])+'</h3><p>'+esc(steps[i][1])+'</p>'+
      '<div class="row"><button class="btn grow" id="coachNext">'+(i<steps.length-1?"Next":"Got it")+'</button>'+
      '<button class="btn dark" id="coachSkip">Skip</button></div>';
    document.getElementById("coachNext").onclick=()=>{ i++; if(i>=steps.length){ done(); } else paint(); };
    document.getElementById("coachSkip").onclick=done;
  };
  const done=()=>{ const el=document.getElementById("coach"); if(el) el.remove(); try{ localStorage.setItem(key,"1"); }catch(e){} };
  setTimeout(paint,600);
}

  const ev=[];
  live(p.dailyLogs).forEach(l=>ev.push({t:new Date(l.date+"T12:00:00").getTime(), cls:"", when:fmtD(l.date), what:"Daily log, "+l.crew.length+" crew, "+l.activities.slice(0,3).join(", ")+((l.corrections&&l.corrections.length)?" [corrected]":"")}));
  live(p.airSamples).forEach(s=>ev.push({t:new Date(s.date+"T12:00:00").getTime()+1, cls:s.pass?"good":"warn", when:fmtD(s.date), what:"Air sample, "+s.location+": "+s.result+" f/cc ("+(s.pass?"PASS":"EXCEEDS")+")"+((s.corrections&&s.corrections.length)?" [corrected]":"")}));
  live(p.manifests).forEach(m=>ev.push({t:new Date(m.dateShipped+"T12:00:00").getTime()+2, cls:m.signedCopyReceived?"good":"warn", when:fmtD(m.dateShipped), what:"Waste manifest "+m.manifestNo+": "+m.qtyYd3+" yd³ → "+m.disposalSite+(m.signedCopyReceived?" (signed copy back)":" (signature PENDING)")+((m.corrections&&m.corrections.length)?" [corrected]":"")}));
  live(p.photos).forEach(x=>ev.push({t:x.takenAt, cls:"", when:fmtDT(x.takenAt), what:"Photo: "+(x.caption||x.category)}));
  live(p.toolboxTalks).forEach(t=>ev.push({t:new Date(t.date+"T12:00:00").getTime()+3, cls:"good", when:fmtD(t.date),
    what:"Toolbox talk: "+t.topic+" by "+t.by+" ("+(t.attendees||[]).length+" attendee"+((t.attendees||[]).length===1?"":"s")+")"}));
  (p.events||[]).forEach(e=>ev.push({t:e.t, cls:e.cls||"", when:fmtDT(e.t), what:e.what}));
  ev.sort((a,b)=>a.t-b.t);
  const retainUntil=new Date(Math.max.apply(null,ev.map(e=>e.t).concat([Date.now()]))+30*365.25*864e5).getFullYear();
  /* Record events: every correction, deletion, and sign-off change, in order. */
  const recEv=(p.events||[]).filter(e=>["correction","deletion","revocation","signoff","manifest"].indexOf(e.kind)>=0).sort((a,b)=>a.t-b.t);
  const recEvHtml=recEv.length?'<div class="tl">'+recEv.map(e=>'<div class="ev '+e.cls+'"><div class="when">'+esc(fmtDT(e.t))+'</div><div class="what">'+esc(e.what)+'</div></div>').join("")+'</div>'
    :'<div class="empty">No corrections, deletions, or sign-off changes recorded.</div>';
  const cl=p.clearance;
  const signRows=[["visual","Visual inspection"],["airClear","Clearance air sampling"],["wasteShipped","Waste shipped"],["manifestsBack","Signed manifests received"],["neshapFiled","Notifications filed"],["areaReleased","Area released"]];
  const printHead='<div class="print-only"><div class="print-head"><b>ABATE dossier</b> · '+esc(p.name)+' · Owner: '+esc(p.owner||"–")+' · Contract '+esc(p.contractNo||"–")+' · Generated '+new Date().toLocaleString("en-US")+'</div>'+
    '<h1 style="font-size:20px;margin:0 0 4px">Abatement Compliance Dossier</h1>'+
    '<div style="font-size:12px"><b>'+esc(p.name)+'</b><br>'+esc(p.address)+'<br>Owner: '+esc(p.owner||"–")+' · Contract '+esc(p.contractNo||"–")+
    '<br>Generated '+new Date().toLocaleString("en-US")+' · Dossier completeness '+c.total+'%'+
    '<br>Keep this file until '+retainUntil+' (30-year retention, OSHA 29 CFR 1926.1101). This printed copy came from a device; keep the exported archive for long-term storage.'+
    '<br><i>Prototype record. Not legal or compliance advice.</i></div><hr></div>'+
    '<div class="print-only print-section"><h2 style="font-size:15px">Sign-off stamps</h2>'+
    '<table class="ptab"><tr><th>Item</th><th>Status</th><th>Signed by</th><th>Date</th></tr>'+
    signRows.map(r=>'<tr><td>'+r[1]+'</td><td>'+(cl[r[0]]?"SIGNED":"open")+'</td><td>'+esc(cl[r[0]+"By"]||"–")+'</td><td>'+(cl[r[0]+"Date"]?fmtD(cl[r[0]+"Date"]):"–")+'</td></tr>').join("")+
    '</table></div>'+
    '<div class="print-only print-section"><h2 style="font-size:15px">Photo evidence ('+live(p.photos).length+')</h2>'+
    (live(p.photos).length?'<div class="pthumbs">'+live(p.photos).map(x=>'<div><img src="'+x.thumb+'" alt="'+esc(x.caption||"site photo")+'"><div style="font-size:10px">'+esc(x.caption||x.category)+'<br>'+fmtDT(x.takenAt)+(x.lat!=null?'<br>GPS '+x.lat.toFixed(5)+', '+x.lng.toFixed(5):"")+'</div></div>').join("")+'</div>'
      :'<div style="font-size:12px">No photos on file.</div>')+'</div>'+
    '<div class="print-only print-section"><h2 style="font-size:15px">Toolbox talks ('+live(p.toolboxTalks).length+')</h2>'+
    (live(p.toolboxTalks).length?live(p.toolboxTalks).sort((a,b)=>a.date.localeCompare(b.date)).map(t=>'<div style="font-size:11px; margin-bottom:6px"><b>'+esc(fmtD(t.date))+' '+esc(t.topic)+'</b>, given by '+esc(t.by||"–")+': '+(t.attendees||[]).map(a=>esc(a.name)).join(", ")+'</div>').join("")
      :'<div style="font-size:12px">None logged.</div>')+'</div>'+
    '<div class="print-only print-section"><h2 style="font-size:15px">Record events</h2>'+
    (recEv.length?recEv.map(e=>'<div style="font-size:11px; margin-bottom:6px"><b>'+esc(fmtDT(e.t))+'</b>: '+esc(e.what)+'</div>').join("")
      :'<div style="font-size:12px">No corrections, deletions, or sign-off changes recorded.</div>')+'</div>';
  return printHead+'<div class="card" id="dossierHero"><div class="ringwrap">'+ring(c.total,84)+
    '<div><div class="ringtxt" style="font-size:34px"><span id="ringNum">0</span><span class="small">%</span></div>'+
    '<div class="small muted">dossier complete</div>'+dossierVerdict(c.total)+
    '<div class="small dim" style="margin-top:6px">Keep this file until <b style="color:var(--orange)">'+retainUntil+'</b> (30-year retention, OSHA 29 CFR 1926.1101). This copy lives on your device. Export the archive for long-term storage.</div></div></div>'+
    (miss.length?'<h3 class="stencil" style="color:var(--amber); font-size:14px; margin:14px 0 2px;">To reach 100%: '+miss.length+' item'+(miss.length===1?"":"s")+'</h3><ul class="misslist">'+miss.map(mi=>'<li>'+esc(mi)+'</li>').join("")+'</ul>'
      :'<div class="alert" style="background:#0e2b1a; border-color:var(--green); color:#c9f5da; margin:14px 0 0"><b style="color:var(--green)">Dossier sealed.</b> Every required record is present. This file is ready for the auditor, the insurer, or the property buyer.</div>')+
    '<div class="row" style="margin-top:12px"><button class="btn ghost sm grow" data-act="print">'+IC.print+' Print dossier</button>'+
    '<button class="btn ghost sm grow" data-act="export">'+IC.down+' Export archive</button></div></div>'+
    '<h2 class="stencil" style="font-size:15px; color:var(--muted); margin:4px 0 4px;">Record events</h2>'+
    '<div class="small dim" style="margin-bottom:8px">Corrections, deletions, and sign-off changes, in order. The dossier remembers what happened.</div>'+recEvHtml+
    '<h2 class="stencil" style="font-size:15px; color:var(--muted); margin:14px 0 4px;">Assembled timeline</h2>'+
    '<div class="small dim" style="margin-bottom:8px">Everything logged, in order. This is the file an auditor, insurer, or buyer reads.</div>'+
    (ev.length?'<div class="tl">'+ev.map(e=>'<div class="ev '+e.cls+'"><div class="when">'+esc(e.when)+'</div><div class="what">'+esc(e.what)+'</div></div>').join("")+'</div>'
    :'<div class="empty">Nothing logged yet. The timeline assembles itself as the crew works.</div>');
}
</script>
<script>
"use strict";
/* ============ forms ============ */
function openSheet(html){ $("#sheet").innerHTML=html; $("#sheetWrap").classList.add("open"); }
function closeSheet(){ $("#sheetWrap").classList.remove("open"); }
let toastT=null;
function toast(m){ let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }
function openConfirm(title,body,okLabel,danger){
  return new Promise(res=>{
    openSheet('<h2 class="stencil">'+esc(title)+'</h2><div class="small muted" style="margin-bottom:16px">'+body+'</div>'+
      '<div class="row"><button class="btn '+(danger?"danger":"")+' grow" id="cfOk">'+esc(okLabel||"Confirm")+'</button>'+
      '<button class="btn dark" id="cfNo">Cancel</button></div>');
    $("#cfOk").onclick=()=>{ closeSheet(); res(true); };
    $("#cfNo").onclick=()=>{ closeSheet(); res(false); };
  });
}
/* Soft delete: the record leaves every list but stays in the store with a
 * tombstone, and the deletion is logged with who, when, and why. */
function openDeleteReason(title, whatLine){
  return new Promise(res=>{
    openSheet('<h2 class="stencil">'+esc(title)+'</h2>'+
      '<div class="small muted" style="margin-bottom:12px">'+esc(whatLine)+'<br><br>The record leaves the lists but stays in the file as a tombstone, and this deletion is logged for the auditor.</div>'+
      '<form id="delForm"><label>Your name *</label><input name="who" required autocomplete="off" placeholder="Who is deleting this?">'+
      '<label>Reason *</label><textarea name="reason" rows="2" required placeholder="Why is this record being removed?"></textarea>'+
      '<div style="height:14px"></div><div class="row"><button class="btn danger grow" type="submit">Delete record</button>'+
      '<button class="btn dark" type="button" id="delNo">Cancel</button></div></form>');
    $("#delNo").onclick=()=>{ closeSheet(); res(null); };
    $("#delForm").onsubmit=e=>{ e.preventDefault(); const d=collect(e.target);
      const who=String(d.who||"").trim(), reason=String(d.reason||"").trim();
      if(!who||!reason){ toast("Name and reason are required."); return; }
      closeSheet(); res({who:who, reason:reason});
    };
  });
}
async function softDelete(p, arr, id, label, whatLine){
  const r=await openDeleteReason("Delete "+label+"?", whatLine);
  if(!r) return false;
  const rec=arr.find(x=>x.id===id); if(!rec) return false;
  rec.deleted=true; rec.deletedAt=Date.now(); rec.deletedBy=r.who; rec.deletedReason=r.reason;
  /* Quota hygiene: a tombstoned photo keeps its thumbnail for the record but
   * drops the full-res dataUrl. The export already treats deleted photos this
   * way (thumbnails kept, full-res excluded). */
  if(rec.dataUrl) rec.dataUrl="";
  logEvent(p,"deletion","warn", label+" deleted by "+r.who+" ("+whatLine+"). Reason: "+r.reason);
  return true;
}
function openSignoff(title,sub,defName){
  return new Promise(res=>{
    openSheet('<h2 class="stencil">'+esc(title)+'</h2><div class="small dim" style="margin-bottom:6px">'+esc(sub||"Each sign-off is stamped with name and date.")+'</div>'+
      '<form id="soForm"><label>Sign-off name</label><input name="who" required autocomplete="off" placeholder="Competent person name" value="'+esc(defName||"")+'">'+
      '<div style="height:14px"></div><div class="row"><button class="btn grow" type="submit">Sign off</button>'+
      '<button class="btn dark" type="button" id="soNo">Cancel</button></div></form>');
    $("#soNo").onclick=()=>{ closeSheet(); res(null); };
    $("#soForm").onsubmit=e=>{ e.preventDefault(); const v=e.target.who.value.trim(); closeSheet(); res(v||null); };
  });
}
function openDatePrompt(title){
  return new Promise(res=>{
    openSheet('<h2 class="stencil">'+esc(title)+'</h2><form id="dtForm"><label>Date signed copy received</label>'+
      '<input name="d" type="date" value="'+todayISO()+'" required>'+
      '<label>Recorded by</label><input name="by" autocomplete="off" placeholder="Who recorded this?">'+
      '<div style="height:14px"></div><div class="row"><button class="btn grow" type="submit">Save</button>'+
      '<button class="btn dark" type="button" id="dtNo">Cancel</button></div></form>');
    $("#dtNo").onclick=()=>{ closeSheet(); res(null); };
    $("#dtForm").onsubmit=e=>{ e.preventDefault(); const d=collect(e.target); const v=d.d;
      closeSheet(); res(v?{date:v, by:String(d.by||"").trim()}:null); };
  });
}
/* Custody handoff recorder: each link in the chain gets a date, a time, and
 * a name. Used by the Waste tab buttons for loading, departure, delivery. */
function openCustodyPrompt(title, defName){
  return new Promise(res=>{
    openSheet('<h2 class="stencil">'+esc(title)+'</h2><form id="cuForm">'+
      field("Date","d",todayISO(),"date","required")+
      field("Time","t",new Date().toTimeString().slice(0,5),"time")+
      field("Recorded by","by",defName||"","text placeholder='Who recorded this handoff'")+
      '<div style="height:14px"></div><div class="row"><button class="btn grow" type="submit">Record</button>'+
      '<button class="btn dark" type="button" id="cuNo">Cancel</button></div></form>');
    $("#cuNo").onclick=()=>{ closeSheet(); res(null); };
    $("#cuForm").onsubmit=e=>{ e.preventDefault(); const d=collect(e.target); closeSheet();
      res({at:new Date(d.d+"T"+(d.t||"12:00")+":00").getTime(), by:String(d.by||"").trim()}); };
  });
}
$("#sheetWrap").addEventListener("click",e=>{ if(e.target.id==="sheetWrap") closeSheet(); });
function field(label,name,val,type,attrs){
  return '<label>'+esc(label)+'</label><input name="'+name+'" type="'+(type||"text")+'" value="'+esc(val==null?"":val)+'" '+(attrs||"")+'>';
}
function formShell(title,inner,saveLabel){
  return '<h2 class="stencil">'+esc(title)+'</h2><div class="small dim" style="margin-bottom:6px">Fields marked * are required for the dossier.</div>'+
    '<form id="sheetForm">'+inner+'<div style="height:14px"></div>'+
    '<div class="row"><button type="submit" class="btn grow">'+esc(saveLabel||"Save")+'</button>'+
    '<button type="button" class="btn dark" id="sheetCancel">Cancel</button></div></form>';
}
function collect(form){
  const d={};
  new FormData(form).forEach((v,k)=>{
    if(d[k]!==undefined){ if(!Array.isArray(d[k])) d[k]=[d[k]]; d[k].push(v); } else d[k]=v;
  });
  return d;
}
const ACTIVITIES=["Containment setup","Negative-air units placed","Tile removal","Pipe insulation removal","Mastic removal","Wet methods","Bagging","HEPA vacuuming","Decon","Teardown","Air monitoring","Waste loadout"];
function fProject(p){
  p=p||{};
  openSheet(formShell(p.id?"Correct project setup":"New abatement project",
    (p.id?CORR_DISCLAIMER:"")+
    field("Project name *","name",p.name,"text","required")+
    field("Site address *","address",p.address,"text","required")+
    field("Building owner","owner",p.owner)+
    field("Owner phone","ownerPhone",p.ownerPhone,"tel")+
    field("Contract #","contractNo",p.contractNo)+
    '<label>NESHAP notification filed? *</label><select name="neshapNotified"><option value="1"'+(p.neshapNotified?" selected":"")+'>Yes, agency notified</option><option value="0"'+(!p.neshapNotified?" selected":"")+'>Not yet</option></select>'+
    field("NESHAP notice date","neshapDate",p.neshapDate,"date")+
    field("Competent person (OSHA 1926.1101) *","competentPerson",p.competentPerson,"text","required")+
    field("Competent person license #","competentLicense",p.competentLicense)+
    field("Start date","startDate",p.startDate||todayISO(),"date")+
    field("Est. end date","estEndDate",p.estEndDate,"date")+
    (p.id?corrFields()+CORR_REASON:"")+
    (!p.id&&DB.projects.length?'<label>Start from a template (optional)</label><select name="templateId"><option value="">Blank dossier</option>'+
      DB.projects.map(q=>'<option value="'+q.id+'">'+esc(q.name)+'</option>').join("")+'</select>'+
      '<div class="small dim" style="margin-top:4px">Copies the setup and crew roster, never the logs, samples, manifests, or photos.</div>':""),
    p.id?"Record correction":"Create dossier"));
  $("#sheetCancel").onclick=closeSheet;
  $("#sheetForm").onsubmit=e=>{ e.preventDefault(); const d=collect(e.target);
    if(p.id){
      /* Regulatory facts (competent person, NESHAP notice) are never edited
       * silently: the correction names who changed what and why, and the
       * original stays in p.corrections and the audit event. */
      const cr=corrRequired(d); if(!cr) return;
      const before={name:p.name,address:p.address,owner:p.owner,ownerPhone:p.ownerPhone,contractNo:p.contractNo,
        neshapNotified:p.neshapNotified,neshapDate:p.neshapDate,competentPerson:p.competentPerson,
        competentLicense:p.competentLicense,startDate:p.startDate,estEndDate:p.estEndDate};
      const after={name:d.name,address:d.address,owner:d.owner,ownerPhone:d.ownerPhone,contractNo:d.contractNo,
        neshapNotified:d.neshapNotified==="1",neshapDate:d.neshapDate,competentPerson:d.competentPerson,
        competentLicense:d.competentLicense,startDate:d.startDate,estEndDate:d.estEndDate};
      const diff=corrDiff(before,after);
      if(!diff){ closeSheet(); toast("No changes."); return; }
      Object.assign(p,after);
      p.corrections=p.corrections||[];
      p.corrections.push({at:Date.now(),by:cr.by,reason:cr.reason,before:before,after:after});
      logEvent(p,"correction","","Project setup corrected by "+cr.by+": "+diff+". Reason: "+cr.reason);
      closeSheet(); save(); toast("Correction recorded. Original preserved.");
      return;
    }
    const rec=Object.assign({id:uid(),status:"active",dailyLogs:[],airSamples:[],manifests:[],photos:[],events:[],
      clearance:{visual:false,airClear:false,wasteShipped:false,manifestsBack:false,neshapFiled:false,areaReleased:false}},d);
    Object.assign(rec,{name:d.name,address:d.address,owner:d.owner,ownerPhone:d.ownerPhone,contractNo:d.contractNo,
      neshapNotified:d.neshapNotified==="1",neshapDate:d.neshapDate,competentPerson:d.competentPerson,
      competentLicense:d.competentLicense,startDate:d.startDate,estEndDate:d.estEndDate});
    const tpl=DB.projects.find(q=>q.id===d.templateId);
    if(tpl){
      rec.owner=tpl.owner; rec.ownerPhone=tpl.ownerPhone;
      rec.competentPerson=tpl.competentPerson; rec.competentLicense=tpl.competentLicense;
      const rr=rosterStore.load();
      rr[rec.id]=(rr[tpl.id]||[]).map(c=>({name:c.name,cred:c.cred}));
      rosterStore.save(rr);
      rec.events.push({t:Date.now(),kind:"info",cls:"",what:"Project created from template \u2018"+tpl.name+"\u2019 (setup and roster copied)"});
    }
    DB.projects.unshift(rec); view={name:"project",projectId:rec.id,tab:"overview"};
    closeSheet(); save();
  };
}
function fDaily(p, existing){
  const L=existing||{};
  const ros=getRoster(p.id);
  const rosTxt=ros.map(c=>c.name+(c.cred?", "+c.cred:"")).join("\n");
  const crewTxt=(L.crew||[]).map(c=>c.name+(c.cred?", "+c.cred:"")).join("\n")||(!existing?rosTxt:"");
  const has=a=>(L.activities||[]).includes(a);
  openSheet(formShell(existing?"Correct daily log: "+fmtD(L.date):"Daily field log: "+fmtD(todayISO()),
    (existing?CORR_DISCLAIMER:"")+
    field("Date *","date",L.date||todayISO(),"date","required")+
    '<label>Crew (one per line: name, accreditation #)</label>'+
    (!existing&&ros.length?'<div class="small dim" style="margin-bottom:6px">Roster: tap to add:</div><div class="row" style="flex-wrap:wrap; gap:6px; margin-bottom:8px">'+
      ros.map((c,i)=>'<button type="button" class="btn dark sm" data-ros="'+i+'">'+esc(c.name)+(c.cred?' <span class="dim">'+esc(c.cred)+'</span>':"")+'</button>').join("")+'</div>':"")+
    '<textarea id="crewTa" name="crew" rows="3" placeholder="Marcus Webb, AZ-ABT-4471 (supervisor)&#10;D. Okafor, AZ-ABT-5120">'+esc(crewTxt)+'</textarea>'+
    '<div id="credHint"></div>'+
    '<div class="row"><div class="grow">'+field("Shift start","start",L.start||"06:30","time")+'</div><div class="grow">'+field("Shift end","end",L.end||"15:00","time")+'</div></div>'+
    '<label>Activities performed</label><div class="checks">'+ACTIVITIES.map(a=>'<label class="check"><input type="checkbox" name="activities" value="'+esc(a)+'"'+(has(a)?" checked":"")+'> '+esc(a)+'</label>').join("")+'</div>'+
    field("Neg-air differential (in w.g., e.g. -0.024)","negAir",L.negAir||"")+
    '<label>Notes</label><textarea name="notes" rows="3" placeholder="Containment intact, decon shower operational…">'+esc(L.notes||"")+'</textarea>'+
    (existing?corrFields()+CORR_REASON:""),
    existing?"Record correction":"Log shift"));
  $("#sheetCancel").onclick=closeSheet;
  /* Roster chips: tap to append "name, cred" as a new line. */
  const ta=$("#crewTa");
  document.querySelectorAll("#sheet [data-ros]").forEach(b=>b.onclick=()=>{
    const c=ros[+b.dataset.ros]; if(!c) return;
    const line=c.name+(c.cred?", "+c.cred:"");
    ta.value=(ta.value.replace(/\s+$/,"")?ta.value.replace(/\s+$/,"")+"\n":"")+line;
    ta.dispatchEvent(new Event("input")); ta.focus();
  });
  /* Typing a roster name offers the saved credential. */
  const hint=$("#credHint");
  const paintHint=()=>{
    hint.innerHTML="";
    if(!ros.length) return;
    const lines=ta.value.split("\n"), last=lines[lines.length-1].trim();
    if(!last||/,/.test(last)) return;
    const m=ros.find(c=>c.name.toLowerCase()===last.toLowerCase()&&c.cred);
    if(!m) return;
    hint.innerHTML='<button type="button" class="btn ghost sm" id="credAdd" style="margin-top:6px">Add credential: '+esc(m.cred)+'</button>';
    $("#credAdd").onclick=()=>{ lines[lines.length-1]=m.name+", "+m.cred; ta.value=lines.join("\n"); paintHint(); ta.focus(); };
  };
  ta.addEventListener("input",paintHint); paintHint();
  $("#sheetForm").onsubmit=e=>{ e.preventDefault(); const d=collect(e.target);
    const crew=String(d.crew||"").split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{ const m=s.match(/^(.*?),\s*(.*)$/); return {name:m?m[1]:s, cred:m?m[2]:""}; });
    addToRoster(p.id, crew);
    let acts=d.activities||[]; if(!Array.isArray(acts)) acts=[acts];
    if(existing){
      /* Daily logs are regulatory records: corrections name who changed what
       * and why, and the original stays in existing.corrections and the
       * audit event. The record is updated in place so history survives. */
      const cr=corrRequired(d); if(!cr) return;
      const before={date:existing.date,crew:existing.crew,start:existing.start,end:existing.end,activities:existing.activities,negAir:existing.negAir,notes:existing.notes};
      const after={date:d.date,crew:crew,start:d.start,end:d.end,activities:acts,negAir:d.negAir,notes:d.notes};
      const diff=corrDiff(before,after);
      if(!diff){ closeSheet(); toast("No changes."); return; }
      existing.corrections=existing.corrections||[];
      existing.corrections.push({at:Date.now(),by:cr.by,reason:cr.reason,before:before,after:after});
      Object.assign(existing,after);
      logEvent(p,"correction","","Daily log corrected by "+cr.by+" ("+fmtD(d.date)+"): "+diff+". Reason: "+cr.reason);
      closeSheet(); save(); toast("Correction recorded. Original preserved.");
      return;
    }

    ta.focus();
  });
  $("#sheetForm").onsubmit=e=>{ e.preventDefault(); const d=collect(e.target);
    const tp=TALK_TOPICS.find(x=>x.t===d.topic)||TALK_TOPICS[0];
    const attendees=String(d.attendees||"").split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{ const m=s.match(/^(.*?),\s*(.*)$/); return {name:m?m[1]:s, cred:m?m[2]:""}; });
    addToRoster(p.id, attendees);
    if(existing){
      /* Talks are safety records: corrections name who changed what and why,
       * and the original stays in existing.corrections and the audit event. */
      const cr=corrRequired(d); if(!cr) return;
      const before={date:existing.date,topic:existing.topic,points:existing.points,by:existing.by,attendees:existing.attendees};
      const after={date:d.date,topic:d.topic,points:tp.points.slice(),by:d.by,attendees:attendees};
      const diff=corrDiff(before,after);

      existing.corrections=existing.corrections||[];
      existing.corrections.push({at:Date.now(),by:cr.by,reason:cr.reason,before:before,after:after});
      Object.assign(existing,after);
      logEvent(p,"correction","","Toolbox talk corrected by "+cr.by+" ("+fmtD(d.date)+"): "+diff+". Reason: "+cr.reason);
      closeSheet(); save(); toast("Correction recorded. Original preserved.");
      return;
    }
    const rec={id:uid(),date:d.date,topic:d.topic,points:tp.points.slice(),by:d.by,attendees:attendees,createdAt:Date.now()};
    p.toolboxTalks.push(rec);

    closeSheet(); save(); toast("Toolbox talk logged");

}
function fAir(p, existing){
  const S=existing||{};
  openSheet(formShell(existing?"Correct air sample":"Log air sample",
    (existing?'<div class="disclaimer" style="margin-bottom:4px"><strong>Correction, not an edit.</strong> The original reading stays in the record. Your name, today\u2019s date, and a reason are logged with the change.</div>':"")+
    field("Date *","date",S.date||todayISO(),"date","required")+
    field("Sample location *","location",S.location||"","text","required placeholder='Inside containment, north corner'")+
    '<label>Sample type *</label><select name="type">'+
      [["area","Work-area"],["personal","Personal (breathing zone)"],["clearance","Clearance"]].map(o=>'<option value="'+o[0]+'"'+(S.type===o[0]?" selected":"")+'>'+o[1]+'</option>').join("")+'</select>'+
    field("Result (fibers/cc) *","result",S.result==null?"":S.result,"number","required step='0.001' min='0' placeholder='0.042'")+
    '<label>Limit basis *</label><select name="basis">'+
      [["8hr","8-hr TWA: PEL 0.1 f/cc"],["exc","30-min excursion: 1.0 f/cc"],["clr","Clearance: 0.01 f/cc"]].map(o=>'<option value="'+o[0]+'"'+(S.basis===o[0]?" selected":"")+'>'+o[1]+'</option>').join("")+'</select>'+
    field("Pump / cassette ID","pump",S.pump||"","text placeholder='SKC-03'")+
    (existing?field("Corrected by (your name) *","corrBy","","text","required placeholder='Who is making this correction'")+
      '<label>Reason for correction *</label><textarea name="corrReason" rows="2" required placeholder="e.g. Transcribed 0.42 instead of 0.042 from the lab sheet"></textarea>':""),
    existing?"Record correction":"Log sample"));
  $("#sheetCancel").onclick=closeSheet;
  $("#sheetForm").onsubmit=e=>{ e.preventDefault(); const d=collect(e.target);
    const r=parseFloat(d.result);
    const limit=d.type==="clearance"?0.01:(d.basis==="8hr"?0.1:d.basis==="exc"?1.0:0.01);
    if(existing){
      const by=String(d.corrBy||"").trim(), reason=String(d.corrReason||"").trim();
      if(!by||!reason){ toast("Name and reason are required to record a correction."); return; }
      const before={date:S.date,result:S.result,location:S.location,type:S.type,basis:S.basis,pump:S.pump};
      const after={date:d.date,result:r,location:d.location,type:d.type,basis:d.basis,pump:d.pump};
      if(JSON.stringify(before)===JSON.stringify(after)){ closeSheet(); toast("No changes."); return; }
      S.corrections=S.corrections||[];
      S.corrections.push({at:Date.now(),by:by,reason:reason,before:before,after:after});
      S.date=d.date; S.result=r; S.location=d.location; S.type=d.type; S.basis=d.basis; S.pump=d.pump; S.pass=r<=limit;
      logEvent(p,"correction","", "Air sample corrected by "+by+" ("+fmtD(S.date)+", "+S.location+"): "+before.result+" → "+r+" f/cc. Reason: "+reason);
      closeSheet(); save(); toast("Correction recorded. Original preserved.");
      return;
    }
    const rec={id:uid(),date:d.date,location:d.location,type:d.type,result:r,basis:d.basis,pump:d.pump,pass:r<=limit,createdAt:Date.now()};
    p.airSamples.push(rec);
    closeSheet(); save();
  };
}

function fPhoto(p){
  const cats=["Containment","Removal","Waste","Decon","Clearance","Other"];
  openSheet(formShell("Add site photo",
    '<label>Photo *</label><input type="file" name="photo" accept="image/*" capture="environment" required>'+
    '<div id="geoStatus" class="small dim" style="margin-top:8px">Locating: the GPS position is burned into the photo next to the timestamp.</div>'+
    '<label>Category</label><select name="category">'+cats.map(c=>'<option>'+c+'</option>').join("")+'</select>'+
    field("Caption","caption","","text placeholder='North wall after final HEPA pass'"),
    "Add to dossier"));
  $("#sheetCancel").onclick=closeSheet;
  /* Best-effort GPS at capture: coordinates are burned into the strip next to
   * the timestamp. No fix is fine; the photo still gets its timestamp. */
  let geo=null;
  const gs=$("#geoStatus");
  const setGeo=t=>{ if(gs) gs.innerHTML=t; };
  try{
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        pos=>{ geo={lat:pos.coords.latitude, lng:pos.coords.longitude, acc:Math.round(pos.coords.accuracy||0)};
          setGeo('<span style="color:var(--green)">Location captured</span>: '+geo.lat.toFixed(5)+', '+geo.lng.toFixed(5)+' (±'+geo.acc+' m). It will be burned into the photo.'); },
        ()=>{ setGeo("No GPS fix. The photo still gets its timestamp."); },
        {timeout:12000, maximumAge:60000, enableHighAccuracy:true});
    } else setGeo("Location not available on this device. The photo still gets its timestamp.");
  }catch(e){ setGeo("No GPS fix. The photo still gets its timestamp."); }
  $("#sheetForm").onsubmit=e=>{ e.preventDefault();
    const file=e.target.photo.files[0]; if(!file){ return; }
    const d=collect(e.target);
    const img=new Image();
    img.onload=()=>{ const cv=document.createElement("canvas");
      const s=Math.min(1,900/Math.max(img.width,img.height));
      cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      const stamp=new Date().toLocaleString("en-US");
      const cx=cv.getContext("2d"); cx.fillStyle="rgba(0,0,0,.7)"; cx.fillRect(0,cv.height-46,cv.width,46);
      cx.fillStyle="#ff6a00"; cx.font="16px monospace"; cx.fillText(stamp+" - ABATE",10,cv.height-26);
      cx.fillStyle="#ffd9ae"; cx.font="13px monospace";
      cx.fillText(geo?("GPS "+geo.lat.toFixed(5)+", "+geo.lng.toFixed(5)+" (+/-"+geo.acc+"m)"):"no GPS fix",10,cv.height-8);
      const full= cv.toDataURL("image/jpeg",0.72);
      const tc=document.createElement("canvas"); const tr=240/Math.max(cv.width,cv.height);
      tc.width=Math.round(cv.width*tr); tc.height=Math.round(cv.height*tr);
      tc.getContext("2d").drawImage(cv,0,0,tc.width,tc.height);
      p.photos.push({id:uid(),dataUrl:full,thumb:tc.toDataURL("image/jpeg",0.6),caption:d.caption,category:d.category,takenAt:Date.now(),
        lat:geo?geo.lat:null, lng:geo?geo.lng:null, acc:geo?geo.acc:null});
      URL.revokeObjectURL(img.src); closeSheet(); save();
    };
    img.src=URL.createObjectURL(file);
  };
}
/* ============ actions ============ */
function bindActions(main,p){
  main.querySelectorAll("[data-act]").forEach(b=>{
    const act=b.dataset.act, id=b.dataset.id;
    if(act==="edit-project") b.onclick=()=>fProject(p);
    else if(act==="edit-log") b.onclick=()=>fDaily(p, p.dailyLogs.find(x=>x.id===id));
    else if(act==="del-log") b.onclick=async()=>{ const l=p.dailyLogs.find(x=>x.id===id);
      if(await softDelete(p,p.dailyLogs,id,"daily log","Shift log "+fmtD(l?l.date:""))){ save(); toast("Daily log deleted. Tombstone kept."); } };
    else if(act==="del-air") b.onclick=async()=>{ const s=p.airSamples.find(x=>x.id===id);
      if(await softDelete(p,p.airSamples,id,"air sample","Sample "+fmtD(s?s.date:"")+", "+(s?s.location:""))){ save(); toast("Air sample deleted. Tombstone kept."); } };
    else if(act==="edit-air") b.onclick=()=>fAir(p, p.airSamples.find(x=>x.id===id));
    else if(act==="edit-manifest") b.onclick=()=>fManifest(p, p.manifests.find(x=>x.id===id));
    else if(act==="del-manifest") b.onclick=async()=>{ const m=p.manifests.find(x=>x.id===id);
      if(await softDelete(p,p.manifests,id,"manifest record","Manifest "+(m?m.manifestNo:""))){ save(); toast("Manifest record deleted. Tombstone kept."); } };
    else if(act==="sign-manifest") b.onclick=async()=>{ const m=p.manifests.find(x=>x.id===id);
      const d=await openDatePrompt("Signed copy received"); if(!d) return;
      const wasSigned=m.signedCopyReceived;
      m.signedCopyReceived=true; m.signedDate=d.date; m.signedRecordedAt=Date.now(); m.signedRecordedBy=d.by;
      /* The signed copy is the final custody link. */
      m.custody=m.custody||[];
      const se=m.custody.find(c=>c.stage==="signed");
      if(se){ se.at=Date.now(); se.by=d.by; } else m.custody.push({stage:"signed", at:Date.now(), by:d.by});
      logEvent(p,"manifest","good","Signed copy recorded for manifest "+m.manifestNo+", dated "+fmtD(d.date)+(d.by?" by "+d.by:"")+(wasSigned?" (updated)":""));
      save(); toast("Manifest signed copy recorded"); };
    else if(act==="cust-loaded"||act==="cust-departed"||act==="cust-delivered") b.onclick=async()=>{
      const m=p.manifests.find(x=>x.id===id); if(!m) return;
      const stage=act==="cust-loaded"?"loaded":act==="cust-departed"?"departed":"delivered";
      const label=stage==="loaded"?"loading":stage==="departed"?"site departure":"disposal-site delivery";
      const r=await openCustodyPrompt("Record "+label, p.competentPerson||"");
      if(!r) return;
      m.custody=m.custody||[];
      m.custody.push({stage:stage, at:r.at, by:r.by});
      logEvent(p,"manifest","", "Manifest "+m.manifestNo+": "+label+" recorded "+fmtDT(r.at)+(r.by?" by "+r.by:""));
      save(); toast("Custody link recorded"); };
    else if(act==="edit-talk") b.onclick=()=>fTalk(p, p.toolboxTalks.find(x=>x.id===id));
    else if(act==="del-talk") b.onclick=async()=>{ const t=p.toolboxTalks.find(x=>x.id===id);
      if(await softDelete(p,p.toolboxTalks,id,"toolbox talk","Talk '"+(t?t.topic:"")+"' "+fmtD(t?t.date:""))){ save(); toast("Toolbox talk deleted. Tombstone kept."); } };
    else if(act==="print") b.onclick=()=>window.print();
    else if(act==="export") b.onclick=()=>exportArchive(p);
    else if(act==="close-project") b.onclick=async()=>{ const c=completeness(p);
      if(c.total<100 && !(await openConfirm("Close with incomplete dossier?","Dossier is only "+c.total+"% complete. Closed projects keep every record for the 30-year retention file.","Close anyway",true))) return;
      p.status="closed"; logEvent(p,"info","","Project closed on "+fmtD(todayISO())+". Records retained for the 30-year retention file."); save(); toast("Project closed. Records retained."); };
  });
  main.querySelectorAll("[data-clear]").forEach(cb=>cb.onchange=async()=>{
    const k=cb.dataset.clear, cl=p.clearance;
    const label=cb.closest(".card").querySelector("b").textContent;
    if(cb.checked){
      /* Guard: visual inspection needs photo evidence in the Clearance
       * category. Checked before asking for the name. */
      if(k==="visual"&&!live(p.photos).some(x=>x.category==="Clearance")){
        cb.checked=false;
        openSheet('<h2 class="stencil">Clearance photo needed</h2>'+
          '<div class="small muted" style="margin-bottom:14px">Add at least one photo in the <b>Clearance</b> category before the visual-inspection sign-off. The photo documents the area you walked through.</div>'+
          '<div class="row"><button class="btn grow" id="vpGo">Go to Photos</button><button class="btn dark" id="vpBack">Back</button></div>');
        $("#vpBack").onclick=closeSheet;
        $("#vpGo").onclick=()=>{ closeSheet(); view.tab="photos"; save(); };
        return;
      }
      /* Guard: manifests-back can only be checked when no manifest is pending.
       * No "sign off anyway" escape hatch: each signed copy is recorded
       * individually under the Waste tab. Checked before asking for the name. */
      if(k==="manifestsBack"&&live(p.manifests).some(m=>!m.signedCopyReceived)){
        const pend=live(p.manifests).filter(m=>!m.signedCopyReceived);
        cb.checked=false;
        openSheet('<h2 class="stencil">Signed copies still missing</h2>'+
          '<div class="small muted" style="margin-bottom:12px">This sign-off can only be checked after <b>every</b> manifest has its own signed-copy date recorded. '+pend.length+' still pending:</div>'+
          pend.map(m=>'<div class="kv"><div class="k mono">'+esc(m.manifestNo)+'</div><div><button class="btn ghost sm" data-mb-go="'+m.id+'">Record signed copy</button></div></div>').join("")+
          '<div style="height:12px"></div><button class="btn dark block" id="mbBack">Back</button>');
        $("#mbBack").onclick=closeSheet;
        document.querySelectorAll("#sheet [data-mb-go]").forEach(b=>b.onclick=()=>{ closeSheet(); view.tab="waste"; save(); });
        return;
      }
      /* Guard: clearance air needs a passing aggressive clearance sample.
       * Checked before asking for the name. */
      if(k==="airClear"&&!live(p.airSamples).some(s=>s.type==="clearance"&&s.pass)){
        cb.checked=false;
        if(await openConfirm("No passing clearance sample","Clearance sign-off needs an aggressive air sample at or below 0.01 f/cc. Add one now?","Add sample")){ view.tab="air"; save(); fAir(p); }
        return;
      }
      const who=await openSignoff("Sign off: "+label,
        "Your name and today's date are stamped into the dossier.", p.competentPerson||"");
      if(!who){ cb.checked=false; return; }
      if(k==="manifestsBack"){
        const names=live(p.manifests).map(m=>m.manifestNo).join(", ");
        logEvent(p,"signoff","good","Manifests-back asserted by "+who+": signed copies received for "+(names||"no manifests on file"));
      }
      cl[k]=true; cl[k+"By"]=who; cl[k+"Date"]=todayISO();
      cl[k+"History"]=cl[k+"History"]||[];
      cl[k+"History"].push({action:"signed",by:who,date:todayISO(),at:Date.now()});
      if(k!=="manifestsBack") logEvent(p,"signoff","good","Clearance item '"+label+"' signed by "+who+" on "+fmtD(todayISO()));
      toast("Signed off by "+who);
    } else {
      /* Revocation: never silent. The event and the history stay on the item. */
      const who=await openSignoff("Revoke: "+label,
        "Revoking removes this sign-off. The revocation is stamped into the record with your name and today's date.", cl[k+"By"]||"");
      if(!who){ cb.checked=true; return; }
      cl[k]=false; cl[k+"By"]=""; cl[k+"Date"]="";
      cl[k+"History"]=cl[k+"History"]||[];
      cl[k+"History"].push({action:"revoked",by:who,date:todayISO(),at:Date.now()});
      logEvent(p,"revocation","warn","Clearance item '"+label+"' revoked by "+who+" on "+fmtD(todayISO()));
      toast("Sign-off revoked. Logged.");
    }
    save();
  });
  main.querySelectorAll("[data-pcat]").forEach(ch=>ch.onclick=()=>{ view.photoCat=ch.dataset.pcat; save(); });
  main.querySelectorAll("[data-photo]").forEach(el=>el.onclick=()=>photoSheet(p,el.dataset.photo));
}

function download(name, text, type){
  const blob=new Blob([text],{type:type||"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
/* Export archive: the full dossier plus every photo's full-res dataURL keyed
 * by photo id, plus a photo-manifest of capture times and captions.
 * Tombstoned records are included with their deletion log, never silently. */
function buildArchive(p, withPhotos){
  const c=completeness(p);
  const evT=(p.events||[]).map(e=>e.t).concat(live(p.photos).map(x=>x.takenAt),[Date.now()]);
  const retainUntil=new Date(Math.max.apply(null,evT)+30*365.25*864e5).getFullYear();
  const photos={};
  if(withPhotos) live(p.photos).forEach(x=>{ if(x.dataUrl) photos[x.id]=x.dataUrl; });
  const strip=x=>({id:x.id,caption:x.caption,category:x.category,takenAt:x.takenAt,thumb:x.thumb,
    deleted:!!x.deleted,deletedAt:x.deletedAt||0,deletedBy:x.deletedBy||"",deletedReason:x.deletedReason||""});
  const project=Object.assign({},p,{photos:p.photos.map(strip)});
  return { exportedAt:new Date().toISOString(), app:"ABATE prototype", completeness:c.total,
    retention:"Keep this file until "+retainUntil+" (30-year retention, OSHA 29 CFR 1926.1101). This file was exported from a device copy; keep the archive for long-term storage.",
    photoManifest:p.photos.map(x=>({id:x.id,caption:x.caption,category:x.category,takenAt:x.takenAt,deleted:!!x.deleted})),
    photos:photos, project:project };
}
function exportArchive(p){
  const full=buildArchive(p,true);
  const size=JSON.stringify(full).length, MB=size/1048576;
  const fname="abate-dossier-"+p.id+"-"+todayISO()+".json";
  if(size>5*1048576){
    openSheet('<h2 class="stencil">Large archive</h2>'+
      '<div class="small muted" style="margin-bottom:14px">This archive is about <b>'+MB.toFixed(1)+' MB</b>, mostly photos. Export it whole, or split it into the record file plus a separate photos file.</div>'+
      '<div class="row"><button class="btn grow" id="exFull">Full archive</button></div><div style="height:8px"></div>'+
      '<div class="row"><button class="btn dark grow" id="exSplit">Split: records + photos</button></div><div style="height:8px"></div>'+
      '<button class="btn dark block" id="exNo">Cancel</button>');
    $("#exNo").onclick=closeSheet;
    $("#exFull").onclick=()=>{ closeSheet(); download(fname, JSON.stringify(full,null,2)); toast("Archive exported ("+MB.toFixed(1)+" MB)"); };
    $("#exSplit").onclick=()=>{ closeSheet();
      download(fname, JSON.stringify(buildArchive(p,false),null,2));
      download("abate-photos-"+p.id+"-"+todayISO()+".json",
        JSON.stringify({exportedAt:full.exportedAt, project:p.name, photoManifest:full.photoManifest, photos:full.photos},null,2));
      toast("Exported records file and photos file");
    };
    return;
  }
  download(fname, JSON.stringify(full,null,2));
  toast("Archive exported");
}
/* ============ fab + init ============ */
$("#fab").onclick=()=>{
  if(view.name==="dash"){ fProject(); return; }
  const p=proj(); if(!p) return;
  if(view.tab==="overview") fProject(p);
  else if(view.tab==="daily") fDaily(p);
  else if(view.tab==="toolbox") fTalk(p);
  else if(view.tab==="air") fAir(p);
  else if(view.tab==="waste") fManifest(p);
  else if(view.tab==="photos") fPhoto(p);
  else if(view.tab==="clearance"){ toast("Use the checklist above. Each item needs a named sign-off."); }
  else if(view.tab==="dossier") exportArchive(p);
};
$("#backBtn").onclick=()=>{ view={name:"dash"}; save(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
persist();
render();
