<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bihua 笔画 · Stroke Order Game</title>
<style>
  :root{
    --paper:#f6efdd; --paper2:#fbf7ea; --ink:#2b2118; --ink-soft:#6b5d4c;
    --line:#d9c9a4; --accent:#c93a2e;
    --btn:#fdfaf0; --btn-line:#d9c9a4;
    --shadow:0 10px 30px rgba(90,70,40,.12), 0 2px 6px rgba(90,70,40,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Avenir Next","Hiragino Sans GB","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    background-image:radial-gradient(rgba(120,95,60,.10) 1px, transparent 1.4px);
    background-size:22px 22px;
    padding:0 16px calc(28px + env(safe-area-inset-bottom));
    user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  .wrap{width:100%; max-width:520px; display:flex; flex-direction:column; gap:14px; padding-top:calc(14px + env(safe-area-inset-top));}

  header{display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
  .diff{display:flex; gap:6px; justify-content:flex-end;}
  .diff button{
    font-family:inherit; font-size:12px; font-weight:700; letter-spacing:.04em;
    padding:6px 13px; border-radius:999px; cursor:pointer; touch-action:manipulation;
    border:2px solid var(--btn-line); background:var(--btn); color:var(--ink-soft);
    transition:background .15s, color .15s, border-color .15s, opacity .15s, transform .08s;
  }
  .diff button:active{transform:scale(.94);}
  .diff button.on{background:var(--ink); border-color:var(--ink); color:var(--paper);}
  .diff button:not(.on){opacity:.5;}
  .diff button.tremble{animation:tremble .22s;}
  @keyframes tremble{0%,100%{transform:translateX(0)}30%{transform:translateX(-2px) rotate(-1deg)}70%{transform:translateX(2px) rotate(1deg)}}

  .brand h1{margin:0; font-size:30px; letter-spacing:.02em; font-weight:800;}
  .brand h1 .cn{color:var(--accent);}
  .brand p{margin:2px 0 0; font-size:11px; letter-spacing:.42em; color:var(--ink-soft); font-weight:600;}
  .stats{display:flex; gap:14px; font-size:13px; color:var(--ink-soft); white-space:nowrap;}
  .stats b{color:var(--ink); font-size:18px; font-variant-numeric:tabular-nums;}

  .charhead{text-align:center; margin-top:2px;}
  .charhead .py{color:var(--accent); font-size:20px; letter-spacing:.35em; text-indent:.35em; font-weight:600;}
  .charhead .en{color:var(--ink-soft); font-size:17px; margin-top:2px;}
  .charhead .en .n{font-variant-numeric:tabular-nums;}

  .card{
    background:var(--paper2);
    border:2px solid var(--line);
    border-radius:28px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  #stage{aspect-ratio:1/1; width:100%;}
  #stage svg{width:100%; height:100%; display:block; touch-action:none;}
  #stage.shake{animation:shk .4s;}
  @keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
  /* boss: video-based stroke animation */
  .boss-stage{position:relative; width:100%; height:100%;}
  .boss-ghost{position:absolute; inset:0; width:100%; height:100%;}
  .boss-stroke{position:absolute; mix-blend-mode:multiply; opacity:0; transition:opacity 0.15s; pointer-events:none;}
  .boss-stroke.shown{opacity:1;}

  .stamp{
    position:absolute; right:18px; bottom:14px;
    width:84px; height:84px; border-radius:14px;
    border:5px solid var(--accent); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-size:52px; font-weight:800;
    transform:rotate(-8deg) scale(2.2); opacity:0; pointer-events:none;
    background:rgba(201,58,46,.06);
    font-family:"Hiragino Sans GB","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .stamp.show{animation:stampIn .45s cubic-bezier(.2,2.4,.4,1) forwards;}
  @keyframes stampIn{to{transform:rotate(-8deg) scale(1); opacity:.92;}}

  /* the stroke keyboard: same keys every time, only the word's strokes enabled */
  #keys{display:flex; flex-wrap:wrap; justify-content:center; gap:10px;}
  .key{
    width:64px; height:64px; flex:none;
    background:var(--btn);
    border:2px solid var(--btn-line);
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(120,95,60,.20);
    transition:transform .08s, box-shadow .08s, border-color .15s, opacity .25s;
    touch-action:manipulation;
    padding:7px;
    color:var(--ink);
  }
  .key:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(120,95,60,.20);}
  .key svg{width:100%; height:100%; display:block; pointer-events:none;}
  .key.off{opacity:.28; box-shadow:none;}
  .key:disabled{cursor:default;}
  .key:disabled:active{transform:none;}
  .key.hintpulse{animation:hpulse .8s ease 2;}
  @keyframes hpulse{0%,100%{border-color:var(--btn-line)}50%{border-color:var(--accent); box-shadow:0 0 0 4px rgba(201,58,46,.25);}}

  .drawn{stroke-dasharray:1; stroke-dashoffset:1; animation:drawin .55s ease-out forwards;}
  @keyframes drawin{to{stroke-dashoffset:0;}}

  /* subtle ancient-China backdrop: pale sun, ink-wash mountains, mist */
  #bgart{position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden;}
  #bgart svg{position:absolute; bottom:0; left:0; width:100%; height:62%;}

  /* red seal stamp */
  .seal{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:7px;
    background:#c0392b; color:#fdf6e8;
    font-size:17px; font-weight:800; line-height:1;
    font-family:"Hiragino Sans GB","PingFang SC","Microsoft YaHei",serif;
    transform:rotate(-6deg);
    box-shadow:0 2px 5px rgba(120,40,25,.25);
    flex:none;
  }
  .brand{display:flex; align-items:center; gap:10px;}

  /* cute loading overlay: an ink brush draws a heng, over and over */
  #loader{
    position:fixed; inset:0; z-index:50;
    background:var(--paper);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    transition:opacity .45s ease;
  }
  #loader.hide{opacity:0; pointer-events:none;}
  #loader svg{width:190px; height:110px; overflow:visible;}
  #loadstroke{
    stroke-dasharray:1; stroke-dashoffset:1;
    animation:inkdraw 1.7s ease-in-out infinite;
  }
  @keyframes inkdraw{
    0%{stroke-dashoffset:1; opacity:0;}
    12%{opacity:1;}
    62%{stroke-dashoffset:0; opacity:1;}
    82%{stroke-dashoffset:0; opacity:0;}
    100%{stroke-dashoffset:1; opacity:0;}
  }
  .loadtext{font-size:14px; letter-spacing:.28em; text-indent:.28em; color:var(--ink-soft); font-weight:600;}
  .loadtext .cn{color:var(--accent);}
</style>
</head>
<body>
<div id="bgart" aria-hidden="true">
<svg preserveAspectRatio="xMidYMax slice" viewBox="0 0 400 500">
  <circle cx="316" cy="90" r="34" fill="#c0392b" opacity="0.10"/>
  <path d="M0,380 L60,300 L110,350 L180,270 L250,360 L310,310 L360,360 L400,330 L400,500 L0,500 Z" fill="#b3a78d" opacity="0.16"/>
  <path d="M0,430 L50,370 L105,410 L170,350 L235,420 L300,380 L355,420 L400,395 L400,500 L0,500 Z" fill="#9d9178" opacity="0.20"/>
  <rect x="0" y="360" width="400" height="46" fill="#f6efdd" opacity="0.55"/>
  <rect x="0" y="410" width="400" height="30" fill="#f6efdd" opacity="0.35"/>
</svg>
</div>

<div id="loader" role="status" aria-label="Loading">
  <svg viewBox="0 0 200 110">
    <path id="loadstroke" d="M28,62 C70,54 130,68 172,58" pathLength="1"
          fill="none" stroke="#2b2118" stroke-width="11" stroke-linecap="round"/>
  </svg>
  <div class="loadtext"><span class="cn">磨墨</span> · CRUSHING INK</div>
</div>

<div class="wrap">
  <header>
    <div class="brand">
      <span class="seal">笔画</span>
      <div>
        <h1><span class="cn">笔画</span> Bihua</h1>
        <p>STROKE ORDER GAME</p>
      </div>
    </div>
    <div class="stats"><span><b id="doneN">0</b> done</span><span><b id="streakN">0</b> streak</span></div>
  </header>

  <div class="charhead">
    <div class="py" id="pinyin">mu</div>
    <div class="en"><span id="meaning">tree</span> · <span class="n" id="nstr">4 strokes</span></div>
  </div>

  <div class="diff" role="group" aria-label="Difficulty">
    <button type="button" id="dEasy" class="on" aria-pressed="true">easy</button><button type="button" id="dHard" class="on" aria-pressed="true">hard</button>
  </div>

  <div class="card" id="stageCard">
    <div id="stage"></div>
    <div class="stamp" id="stamp">好</div>
  </div>

  <div id="keys"></div>
</div>

<script>
"use strict";
/* Bihua: a fixed keyboard of stroke types under an outline-only character.
   The keyboard is the same every word; only the types in the word are enabled.
   Tap the types in stroke order. Wrong tap shakes. 3 misses pulses the right key.
   Finish one word, get the next, forever. */

const CHARS = [
  {c:"木", py:"mu", en:"tree", t:["heng","shu","pie","na"]},
  {c:"人", py:"ren", en:"person", t:["pie","na"]},
  {c:"大", py:"da", en:"big", t:["heng","pie","na"]},
  {c:"小", py:"xiao", en:"small", t:["shugou","pie","dian"]},
  {c:"十", py:"shi", en:"ten", t:["heng","shu"]},
  {c:"王", py:"wang", en:"king", t:["heng","heng","shu","heng"]},
  {c:"天", py:"tian", en:"sky", t:["heng","heng","pie","na"]},
  {c:"日", py:"ri", en:"sun", t:["shu","hengzhe","heng","heng"]},
  {c:"月", py:"yue", en:"moon", t:["shu","hengzhegou","heng","heng"]},
  {c:"山", py:"shan", en:"mountain", t:["shu","shuzhe","shu"]},
  {c:"水", py:"shui", en:"water", t:["shugou","hengpie","pie","na"]},
  {c:"火", py:"huo", en:"fire", t:["dian","pie","pie","na"]},
  {c:"田", py:"tian", en:"field", t:["shu","hengzhe","heng","shu","heng"]},
  {c:"白", py:"bai", en:"white", t:["pie","shu","hengzhe","heng","heng"]},
  {c:"目", py:"mu", en:"eye", t:["shu","hengzhe","heng","heng","heng"]},
  {c:"石", py:"shi", en:"stone", t:["heng","pie","shu","hengzhe","heng"]},
  {c:"立", py:"li", en:"stand", t:["dian","heng","dian","pie","heng"]},
  {c:"生", py:"sheng", en:"life", t:["pie","heng","heng","shu","heng"]},
  {c:"好", py:"hao", en:"good", t:["piezhe","pie","heng","hengpie","shugou","heng"]},
  {c:"一", py:"yi", en:"one", t:["heng"]},
{c:"二", py:"er", en:"two", t:["heng", "heng"]},
  {c:"儿", py:"er", en:"son", t:["pie", "shuwangou"]},
  {c:"入", py:"ru", en:"enter", t:["pie", "na"]},
  {c:"力", py:"li", en:"strength", t:["hengzhegou", "pie"]},
  {c:"三", py:"san", en:"three", t:["heng", "heng", "heng"]},
  {c:"上", py:"shang", en:"up", t:["shu", "heng", "heng"]},
  {c:"下", py:"xia", en:"down", t:["heng", "shu", "dian"]},
  {c:"口", py:"kou", en:"mouth", t:["shu", "hengzhe", "heng"]},
  {c:"土", py:"tu", en:"earth", t:["heng", "shu", "heng"]},
  {c:"女", py:"nv", en:"woman", t:["piezhe", "pie", "heng"]},
  {c:"子", py:"zi", en:"child", t:["hengpie", "shugou", "heng"]},
  {c:"川", py:"chuan", en:"river", t:["shu", "shu", "shu"]},
  {c:"干", py:"gan", en:"dry", t:["heng", "heng", "shu"]},
  {c:"门", py:"men", en:"door", t:["dian", "shu", "shugou"]},
  {c:"飞", py:"fei", en:"fly", t:["hengzhegou", "pie", "dian"]},
  {c:"中", py:"zhong", en:"middle", t:["shu", "hengzhe", "heng", "shu"]},
  {c:"云", py:"yun", en:"cloud", t:["heng", "heng", "pieheng", "dian"]},
  {c:"夫", py:"fu", en:"husband", t:["heng", "heng", "pie", "na"]},
  {c:"少", py:"shao", en:"few", t:["shu", "shu", "dian", "pie"]},
  {c:"开", py:"kai", en:"open", t:["heng", "heng", "shu", "shu"]},
  {c:"心", py:"xin", en:"heart", t:["dian", "wogou", "dian", "dian"]},
  {c:"手", py:"shou", en:"hand", t:["ti", "heng", "heng", "shugou"]},
  {c:"父", py:"fu", en:"father", t:["pie", "dian", "pie", "na"]},
  {c:"牛", py:"niu", en:"cow", t:["pie", "heng", "heng", "shu"]},
  {c:"犬", py:"quan", en:"dog", t:["heng", "pie", "na", "dian"]},
  {c:"车", py:"che", en:"car", t:["heng", "shuzhe", "heng", "shu"]},
  {c:"风", py:"feng", en:"wind", t:["shu", "hengzhegou", "pie", "na"]},
  {c:"去", py:"qu", en:"go", t:["heng", "shu", "heng", "pieheng", "dian"]},
  {c:"古", py:"gu", en:"ancient", t:["heng", "shu", "shu", "hengzhe", "heng"]},
  {c:"右", py:"you", en:"right", t:["heng", "pie", "shu", "hengzhe", "heng"]},
  {c:"左", py:"zuo", en:"left", t:["heng", "pie", "heng", "shu", "heng"]},
  {c:"本", py:"ben", en:"root", t:["heng", "shu", "pie", "na", "heng"]},
  {c:"母", py:"mu", en:"mother", t:["shuzhe", "hengzhegou", "dian", "heng", "dian"]},
  {c:"玉", py:"yu", en:"jade", t:["heng", "heng", "shu", "heng", "dian"]},
  {c:"电", py:"dian", en:"electricity", t:["shu", "hengzhe", "heng", "heng", "shuwangou"]},
  {c:"鸟", py:"niao", en:"bird", t:["pie", "hengpie", "dian", "wogou", "heng"]},
  {c:"多", py:"duo", en:"many", t:["pie", "hengpie", "dian", "pie", "hengpie", "dian"]},
  {c:"竹", py:"zhu", en:"bamboo", t:["pie", "heng", "shu", "shu", "heng", "shugou"]},
  {c:"米", py:"mi", en:"rice", t:["dian", "pie", "heng", "shu", "pie", "na"]},
  {c:"红", py:"hong", en:"red", t:["shuzhe", "pieheng", "heng", "heng", "shu", "heng"]},
  {c:"羊", py:"yang", en:"sheep", t:["dian", "pie", "heng", "heng", "heng", "shu"]},
  {c:"耳", py:"er", en:"ear", t:["heng", "shu", "shu", "heng", "heng", "heng"]},
  {c:"虫", py:"chong", en:"insect", t:["shu", "hengzhe", "heng", "shu", "heng", "dian"]},
  {c:"听", py:"ting", en:"listen", t:["shu", "hengzhe", "heng", "ti", "shu", "heng", "shu"]},
  {c:"来", py:"lai", en:"come", t:["heng", "dian", "pie", "heng", "shu", "pie", "na"]},
  {c:"花", py:"hua", en:"flower", t:["heng", "shu", "shu", "pie", "shu", "pie", "shuwangou"]},
  {c:"走", py:"zou", en:"walk", t:["heng", "shu", "heng", "shu", "heng", "pie", "heng"]},
  {c:"足", py:"zu", en:"foot", t:["shu", "hengpie", "heng", "shu", "heng", "pie", "heng"]},
  {c:"林", py:"lin", en:"forest", t:["heng", "shu", "pie", "dian", "heng", "shu", "pie", "na"]},
  {c:"雨", py:"yu", en:"rain", t:["heng", "shu", "hengzhegou", "shu", "dian", "dian", "heng", "dian"]},
  {c:"鱼", py:"yu", en:"fish", t:["pie", "hengpie", "shu", "hengzhe", "heng", "shu", "heng", "heng"]},
  {c:"树", py:"shu", en:"tree", t:["heng", "shu", "pie", "dian", "hengpie", "na", "heng", "shugou", "dian"]},
  {c:"看", py:"kan", en:"look", t:["ti", "heng", "heng", "pie", "shu", "hengzhe", "heng", "heng", "heng"]},
  {c:"草", py:"cao", en:"grass", t:["heng", "shu", "shu", "shu", "hengzhe", "heng", "heng", "heng", "shu"]},
  {c:"说", py:"shuo", en:"speak", t:["dian", "hengzheti", "dian", "pie", "shu", "hengzhe", "heng", "pie", "shuwangou"]},
  {c:"高", py:"gao", en:"tall", t:["dian", "heng", "shu", "hengzhe", "heng", "shu", "hengzhegou", "shu", "hengzhe", "heng"]},
  {c:"喝", py:"he", en:"drink", t:["shu", "hengzhe", "heng", "shu", "hengzhe", "heng", "heng", "pie", "hengzhegou", "pie", "dian", "shuzhe"]},
  {c:"黑", py:"hei", en:"black", t:["shu", "hengzhe", "dian", "dian", "heng", "shu", "heng", "heng", "shu", "dian", "dian", "dian"]},
  /* boss: the hardest character (traditional biang, 58 strokes). Only via the hard-button easter egg, never in normal rotation. */
  {c:"𰻞", py:"biang", en:"biangbiang noodles", boss:true, w:48, t:["dian","heng","pie","pie","na","shu","hengzhegou","heng","heng","piezhe","piezhe","na","dian","heng","heng","heng","shu","heng","dian","piezhe","piezhe","na","heng","shu","heng","heng","heng","shuzhe","pie","na","heng","shu","heng","heng","shugou","hengzhegou","shu","pie","pie","pie","heng","shu","heng","heng","heng","shuzhe","pie","na","dian","wogou","dian","dian","shu","shugou","dian","dian","shu","na"]},
];

/* fixed keyboard: one key per stroke type, canonical shape from real data */
const TYPES = [
  {id:"heng",       c:"一", i:0},
  {id:"shu",        c:"十", i:1},
  {id:"pie",        c:"人", i:0},
  {id:"na",         c:"人", i:1},
  {id:"dian",       c:"火", i:0},
  {id:"ti",         c:"手", i:0},
  {id:"hengzhe",    c:"日", i:1},
  {id:"hengpie",    c:"水", i:1},
  {id:"shugou",     c:"水", i:0},
  {id:"shuzhe",     c:"山", i:1},
  {id:"shuwangou",  c:"儿", i:1},
  {id:"piezhe",     c:"好", i:0},
  {id:"pieheng",    c:"云", i:2},
  {id:"hengzhegou", c:"月", i:1},
  {id:"hengzheti",  c:"说", i:1},
  {id:"wogou",      c:"鸟", i:3},
];

const $ = id => document.getElementById(id);
const stage = $("stage"), stageCard = $("stageCard"), stamp = $("stamp");
const keysEl = $("keys");

let data = {};
let cur = 0;
let nextStroke = 0;
let misses = 0;
let roundMistakes = 0;
let remaining = {};   // type -> unfilled strokes of that type left
let doneSet = new Set(JSON.parse(localStorage.getItem("bihua.done")||"[]"));
let streak = +(localStorage.getItem("bihua.streak")||0);

/* difficulty filter: easy = 4 strokes or fewer (40 chars), hard = 5+ (38).
   Normal toggles with one guard: the last remaining ON button swaps instead
   of leaving nothing selected, so both-on is always reachable again. */
let diffState = JSON.parse(localStorage.getItem("bihua.diff")||'{"easy":true,"hard":true}');
let easyOn = diffState.easy !== false, hardOn = diffState.hard !== false;
if(!easyOn && !hardOn){ easyOn = hardOn = true; } /* never both off */

const isEasy = ch => ch.t.length <= 4;
function charAllowed(ch){
  if(ch.boss) return true; /* boss is only reachable via the egg, never filtered out */
  if(easyOn && hardOn) return true;
  return easyOn ? isEasy(ch) : !isEasy(ch);
}
function advanceCur(){
  for(let k = 0; k < CHARS.length; k++){
    cur = (cur + 1) % CHARS.length;
    if(!CHARS[cur].boss && charAllowed(CHARS[cur])) return;
  }
}
function paintDiff(){
  const e = $("dEasy"), h = $("dHard");
  e.classList.toggle("on", easyOn); e.setAttribute("aria-pressed", easyOn);
  h.classList.toggle("on", hardOn); h.setAttribute("aria-pressed", hardOn);
}
function tapDiff(which){
  const onlyThis = which === "easy" ? (easyOn && !hardOn) : (hardOn && !easyOn);
  if(onlyThis){
    /* last one on: swap instead of selecting nothing */
    if(which === "easy"){ easyOn = false; hardOn = true; }
    else { hardOn = false; easyOn = true; }
  } else if(which === "easy"){ easyOn = !easyOn; }
  else { hardOn = !hardOn; }
  localStorage.setItem("bihua.diff", JSON.stringify({easy:easyOn, hard:hardOn}));
  paintDiff();
  if(!charAllowed(CHARS[cur])){ advanceCur(); renderChar(); }
}

/* easter egg: spam the hard button 5 times within 2.5s to take on biang,
   the hardest Chinese character (58 strokes). Each tap gives the button a
   tiny shake, subtle enough to feel like nothing, suspicious enough to keep
   tapping. */
let hardTapTimes = [];
function onHardTap(){
  const b = $("dHard");
  b.classList.remove("tremble"); void b.offsetWidth; b.classList.add("tremble");
  const now = Date.now();
  hardTapTimes = hardTapTimes.filter(t => now - t < 2500);
  hardTapTimes.push(now);
  if(hardTapTimes.length >= 5){
    hardTapTimes = [];
    const bi = CHARS.findIndex(ch => ch.boss);
    if(bi >= 0){ cur = bi; nextStroke = 0; misses = 0; renderChar(); }
  }
  tapDiff("hard");
}

function path(d, w){
  return '<path d="'+d+'" fill="none" stroke-width="'+(w||90)+'" stroke-linecap="round" stroke-linejoin="round"/>';
}
/* hanzi-writer-data uses a y-up coordinate space: flip vertically for screen */
const FLIP = 'transform="translate(0,1024) scale(1,-1)"';

/* lazy loading: the first word + the 14 keyboard source characters up front,
   everything else streams in quietly in the background, nearest words first */
const KEY_CHARS = ["一","十","人","火","手","日","水","山","儿","好","云","月","说","鸟"];

async function fetchChar(c){
  const r = await fetch("data/"+c+".json");
  data[c] = (await r.json()).strokes;
}

async function loadEssential(first){
  const need = [first, ...KEY_CHARS.filter(c => c !== first)];
  for(const c of need) if(!data[c]) await fetchChar(c);
  for(const ty of TYPES) ty.d = data[ty.c][ty.i];
}

let bgLoading = false;
async function loadRest(){
  if(bgLoading) return;
  bgLoading = true;
  const n = CHARS.length;
  for(let k=1; k<n; k++){
    const c = CHARS[(cur+k)%n].c;
    if(!data[c]){
      try{ await fetchChar(c); }catch(e){ /* retry on demand */ }
    }
    await new Promise(r=>setTimeout(r,0)); /* yield so taps stay snappy */
  }
}

function updateStats(){
  $("doneN").textContent = doneSet.size;
  $("streakN").textContent = streak;
}

/* frame the svg tightly on its content so the character is centered, never cut */
function fitViewBox(svg){
  const b = svg.querySelector("g.tight").getBBox();
  const pad = 95; /* covers half the 90-unit stroke width + margin */
  const vx = b.x - pad, vy = 1024 - (b.y + b.height) - pad;
  svg.setAttribute("viewBox", vx+" "+vy+" "+(b.width+pad*2)+" "+(b.height+pad*2));
}

/* the keyboard is identical every round: build it once, never tear it down,
   so advancing to the next character causes zero layout shift */
function buildKeyboard(){
  keysEl.innerHTML = "";
  for(const ty of TYPES){
    const b = document.createElement("button");
    b.className = "key";
    b.dataset.type = ty.id;
    b.setAttribute("aria-label", ty.id);
    b.innerHTML = '<svg viewBox="0 0 1024 1024" aria-hidden="true"><g '+FLIP+'><g class="tight" stroke="#2b2118">'+path(ty.d)+"</g></g></svg>";
    b.addEventListener("click", ()=>tapKey(b, ty.id));
    keysEl.appendChild(b);
    fitViewBox(b.querySelector("svg"));
  }
}

function refreshKeys(){
  keysEl.querySelectorAll(".key").forEach(k=>{
    const on = (remaining[k.dataset.type]||0) > 0;
    k.classList.toggle("off", !on);
    k.disabled = !on;
  });
}

function tapKey(btn, type){
  const ch = CHARS[cur];
  const n = ch.boss ? ch.t.length : data[ch.c].length;
  if(type === ch.t[nextStroke]){
    if(ch.boss){
      /* boss: reveal the next stroke image */
      const strokes = stage._bossStrokes;
      if(strokes && nextStroke < strokes.length){
        strokes[nextStroke].classList.add('shown');
      }
    } else {
      const strokes = data[ch.c];
      const g = stage.querySelector("#filled");
      const tmp = document.createElementNS("http://www.w3.org/2000/svg","g");
      tmp.innerHTML = path(strokes[nextStroke], ch.w).replace("<path", '<path pathLength="1" class="drawn"');
      g.appendChild(tmp.firstChild);
    }
    remaining[type]--; nextStroke++; misses = 0;
    refreshKeys();
    if(nextStroke === n) complete();
  } else {
    misses++; roundMistakes++;
    stageCard.classList.remove("shake"); void stageCard.offsetWidth;
    stageCard.classList.add("shake");
    if(misses >= 3){
      misses = 0;
      const right = keysEl.querySelector('[data-type="'+ch.t[nextStroke]+'"]');
      if(right){
        right.classList.remove("hintpulse"); void right.offsetWidth;
        right.classList.add("hintpulse");
      }
    }
  }
}

function complete(){
  const ch = CHARS[cur];
  doneSet.add(ch.c);
  localStorage.setItem("bihua.done", JSON.stringify([...doneSet]));
  streak = (roundMistakes===0) ? streak+1 : 0;
  localStorage.setItem("bihua.streak", streak);
  updateStats();
  stamp.classList.add("show");
  // next word, forever (leave the scroll point alone)
  setTimeout(async ()=>{
    advanceCur();
    if(!data[CHARS[cur].c]){
      $("loader").classList.remove("hide");
      try{ await fetchChar(CHARS[cur].c); }catch(e){}
      $("loader").classList.add("hide");
    }
    renderChar();
  }, 750);
}

(async function boot(){
  const q = new URLSearchParams(location.search).get("c");
  if(q){
    const qi = CHARS.findIndex(ch => ch.c === q);
    if(qi >= 0) cur = qi;
  }
  await loadEssential(CHARS[cur].c);
  buildKeyboard();
  paintDiff();
  $("dEasy").addEventListener("click", ()=>tapDiff("easy"));
  $("dHard").addEventListener("click", onHardTap);
  updateStats();
  renderChar();
  $("loader").classList.add("hide");
  loadRest(); /* the rest streams in behind the scenes */
  /* preload boss ghost in the background */
  try{
    const bg = new Image(); bg.src = 'biang_ghost.png';
  }catch(e){}
})();
