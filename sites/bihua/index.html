<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bihua 笔画 · Stroke Order Game</title>
<style>
  :root{
    --paper:#f6efdd; --paper2:#fbf7ea; --ink:#2b2118; --ink-soft:#6b5d4c;
    --line:#d9c9a4; --accent:#c93a2e;
    --btn:#fdfaf0; --btn-line:#d9c9a4;
    --shadow:0 10px 30px rgba(90,70,40,.12), 0 2px 6px rgba(90,70,40,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Avenir Next","Hiragino Sans GB","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    background-image:radial-gradient(rgba(120,95,60,.10) 1px, transparent 1.4px);
    background-size:22px 22px;
    padding:0 16px calc(28px + env(safe-area-inset-bottom));
    user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  .wrap{width:100%; max-width:520px; display:flex; flex-direction:column; gap:14px; padding-top:calc(14px + env(safe-area-inset-top));}

  header{display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
  .brand h1{margin:0; font-size:30px; letter-spacing:.02em; font-weight:800;}
  .brand h1 .cn{color:var(--accent);}
  .brand p{margin:2px 0 0; font-size:11px; letter-spacing:.42em; color:var(--ink-soft); font-weight:600;}
  .stats{display:flex; gap:14px; font-size:13px; color:var(--ink-soft); white-space:nowrap;}
  .stats b{color:var(--ink); font-size:18px; font-variant-numeric:tabular-nums;}

  .charhead{text-align:center; margin-top:2px;}
  .charhead .py{color:var(--accent); font-size:20px; letter-spacing:.35em; text-indent:.35em; font-weight:600;}
  .charhead .en{color:var(--ink-soft); font-size:17px; margin-top:2px;}
  .charhead .en .n{font-variant-numeric:tabular-nums;}

  .card{
    background:var(--paper2);
    border:2px solid var(--line);
    border-radius:28px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  #stage{aspect-ratio:1/1; width:100%;}
  #stage svg{width:100%; height:100%; display:block; touch-action:none;}
  #stage.shake{animation:shk .4s;}
  @keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}

  .stamp{
    position:absolute; right:18px; bottom:14px;
    width:84px; height:84px; border-radius:14px;
    border:5px solid var(--accent); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-size:52px; font-weight:800;
    transform:rotate(-8deg) scale(2.2); opacity:0; pointer-events:none;
    background:rgba(201,58,46,.06);
    font-family:"Hiragino Sans GB","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .stamp.show{animation:stampIn .45s cubic-bezier(.2,2.4,.4,1) forwards;}
  @keyframes stampIn{to{transform:rotate(-8deg) scale(1); opacity:.92;}}

  /* the stroke keyboard: same keys every time, only the word's strokes enabled */
  #keys{display:flex; flex-wrap:wrap; justify-content:center; gap:10px;}
  .key{
    width:64px; height:64px; flex:none;
    background:var(--btn);
    border:2px solid var(--btn-line);
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(120,95,60,.20);
    transition:transform .08s, box-shadow .08s, border-color .15s, opacity .25s;
    touch-action:manipulation;
    padding:7px;
    color:var(--ink);
  }
  .key:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(120,95,60,.20);}
  .key svg{width:100%; height:100%; display:block; pointer-events:none;}
  .key.off{opacity:.28; box-shadow:none;}
  .key:disabled{cursor:default;}
  .key:disabled:active{transform:none;}
  .key.hintpulse{animation:hpulse .8s ease 2;}
  @keyframes hpulse{0%,100%{border-color:var(--btn-line)}50%{border-color:var(--accent); box-shadow:0 0 0 4px rgba(201,58,46,.25);}}

  .drawn{stroke-dasharray:1; stroke-dashoffset:1; animation:drawin .55s ease-out forwards;}
  @keyframes drawin{to{stroke-dashoffset:0;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1><span class="cn">笔画</span> Bihua</h1>
      <p>STROKE ORDER GAME</p>
    </div>
    <div class="stats"><span><b id="doneN">0</b> done</span><span><b id="streakN">0</b> streak</span></div>
  </header>

  <div class="charhead">
    <div class="py" id="pinyin">mu</div>
    <div class="en"><span id="meaning">tree</span> · <span class="n" id="nstr">4 strokes</span></div>
  </div>

  <div class="card" id="stageCard">
    <div id="stage"></div>
    <div class="stamp" id="stamp">好</div>
  </div>

  <div id="keys"></div>
</div>

<script>
"use strict";
/* Bihua: a fixed keyboard of stroke types under an outline-only character.
   The keyboard is the same every word; only the types in the word are enabled.
   Tap the types in stroke order. Wrong tap shakes. 3 misses pulses the right key.
   Finish one word, get the next, forever. */

const CHARS = [
  {c:"木", py:"mu", en:"tree", t:["heng","shu","pie","na"]},
  {c:"人", py:"ren", en:"person", t:["pie","na"]},
  {c:"大", py:"da", en:"big", t:["heng","pie","na"]},
  {c:"小", py:"xiao", en:"small", t:["shugou","pie","dian"]},
  {c:"十", py:"shi", en:"ten", t:["heng","shu"]},
  {c:"王", py:"wang", en:"king", t:["heng","heng","shu","heng"]},
  {c:"天", py:"tian", en:"sky", t:["heng","heng","pie","na"]},
  {c:"日", py:"ri", en:"sun", t:["shu","hengzhe","heng","heng"]},
  {c:"月", py:"yue", en:"moon", t:["shu","hengzhegou","heng","heng"]},
  {c:"山", py:"shan", en:"mountain", t:["shu","shuzhe","shu"]},
  {c:"水", py:"shui", en:"water", t:["shugou","hengpie","pie","na"]},
  {c:"火", py:"huo", en:"fire", t:["dian","pie","pie","na"]},
  {c:"田", py:"tian", en:"field", t:["shu","hengzhe","heng","shu","heng"]},
  {c:"白", py:"bai", en:"white", t:["pie","shu","hengzhe","heng","heng"]},
  {c:"目", py:"mu", en:"eye", t:["shu","hengzhe","heng","heng","heng"]},
  {c:"石", py:"shi", en:"stone", t:["heng","pie","shu","hengzhe","heng"]},
  {c:"立", py:"li", en:"stand", t:["dian","heng","dian","pie","heng"]},
  {c:"生", py:"sheng", en:"life", t:["pie","heng","heng","shu","heng"]},
  {c:"好", py:"hao", en:"good", t:["piezhe","pie","heng","hengpie","shugou","heng"]},
  {c:"一", py:"yi", en:"one", t:["heng"]},
];

/* fixed keyboard: one key per stroke type, canonical shape from real data */
const TYPES = [
  {id:"heng",       c:"一", i:0},
  {id:"shu",        c:"十", i:1},
  {id:"pie",        c:"人", i:0},
  {id:"na",         c:"人", i:1},
  {id:"dian",       c:"火", i:0},
  {id:"hengzhe",    c:"日", i:1},
  {id:"hengpie",    c:"水", i:1},
  {id:"shugou",     c:"水", i:0},
  {id:"shuzhe",     c:"山", i:1},
  {id:"piezhe",     c:"好", i:0},
  {id:"hengzhegou", c:"月", i:1},
];

const $ = id => document.getElementById(id);
const stage = $("stage"), stageCard = $("stageCard"), stamp = $("stamp");
const keysEl = $("keys");

let data = {};
let cur = 0;
let nextStroke = 0;
let misses = 0;
let roundMistakes = 0;
let remaining = {};   // type -> unfilled strokes of that type left
let doneSet = new Set(JSON.parse(localStorage.getItem("bihua.done")||"[]"));
let streak = +(localStorage.getItem("bihua.streak")||0);

function path(d){
  return '<path d="'+d+'" fill="none" stroke-width="90" stroke-linecap="round" stroke-linejoin="round"/>';
}
/* hanzi-writer-data uses a y-up coordinate space: flip vertically for screen */
const FLIP = 'transform="translate(0,1024) scale(1,-1)"';

async function loadData(){
  for(const ch of CHARS){
    const r = await fetch("data/"+ch.c+".json");
    data[ch.c] = (await r.json()).strokes;
  }
  for(const ty of TYPES) ty.d = data[ty.c][ty.i];
}

function updateStats(){
  $("doneN").textContent = doneSet.size;
  $("streakN").textContent = streak;
}

/* frame the svg tightly on its content so the character is centered, never cut */
function fitViewBox(svg){
  const b = svg.querySelector("g.tight").getBBox();
  const pad = 95; /* covers half the 90-unit stroke width + margin */
  const vx = b.x - pad, vy = 1024 - (b.y + b.height) - pad;
  svg.setAttribute("viewBox", vx+" "+vy+" "+(b.width+pad*2)+" "+(b.height+pad*2));
}

function renderChar(){
  const ch = CHARS[cur], strokes = data[ch.c], n = strokes.length;
  nextStroke = 0; misses = 0; roundMistakes = 0;
  remaining = {};
  ch.t.forEach(t => remaining[t] = (remaining[t]||0)+1);
  $("pinyin").textContent = ch.py;
  $("meaning").textContent = ch.en;
  $("nstr").textContent = n + (n===1?" stroke":" strokes");
  stamp.classList.remove("show");

  stage.innerHTML =
    '<svg id="charsvg" viewBox="0 0 1024 1024" aria-label="'+ch.c+' outline">' +
    '<g '+FLIP+'><g class="tight"><g stroke="#ddcda6">' + strokes.map(path).join("") + "</g>" +
    '<g id="filled" stroke="#2b2118"></g></g></g>' +
    "</svg>";
  fitViewBox($("charsvg"));

  keysEl.innerHTML = "";
  for(const ty of TYPES){
    const b = document.createElement("button");
    b.className = "key";
    b.dataset.type = ty.id;
    b.setAttribute("aria-label", ty.id);
    b.innerHTML = '<svg viewBox="0 0 1024 1024" aria-hidden="true"><g '+FLIP+'><g class="tight" stroke="#2b2118">'+path(ty.d)+"</g></g></svg>";
    b.addEventListener("click", ()=>tapKey(b, ty.id));
    keysEl.appendChild(b);
    fitViewBox(b.querySelector("svg"));
  }
  refreshKeys();
}

function refreshKeys(){
  keysEl.querySelectorAll(".key").forEach(k=>{
    const on = (remaining[k.dataset.type]||0) > 0;
    k.classList.toggle("off", !on);
    k.disabled = !on;
  });
}

function tapKey(btn, type){
  const ch = CHARS[cur], strokes = data[ch.c], n = strokes.length;
  if(type === ch.t[nextStroke]){
    const g = stage.querySelector("#filled");
    const tmp = document.createElementNS("http://www.w3.org/2000/svg","g");
    tmp.innerHTML = path(strokes[nextStroke]).replace("<path", '<path pathLength="1" class="drawn"');
    g.appendChild(tmp.firstChild);
    remaining[type]--; nextStroke++; misses = 0;
    refreshKeys();
    if(nextStroke === n) complete();
  } else {
    misses++; roundMistakes++;
    stageCard.classList.remove("shake"); void stageCard.offsetWidth;
    stageCard.classList.add("shake");
    if(misses >= 3){
      misses = 0;
      const right = keysEl.querySelector('[data-type="'+ch.t[nextStroke]+'"]');
      if(right){
        right.classList.remove("hintpulse"); void right.offsetWidth;
        right.classList.add("hintpulse");
      }
    }
  }
}

function complete(){
  const ch = CHARS[cur];
  doneSet.add(ch.c);
  localStorage.setItem("bihua.done", JSON.stringify([...doneSet]));
  streak = (roundMistakes===0) ? streak+1 : 0;
  localStorage.setItem("bihua.streak", streak);
  updateStats();
  stamp.classList.add("show");
  // next word, forever
  setTimeout(()=>{
    cur = (cur+1) % CHARS.length;
    renderChar();
    window.scrollTo({top:0,behavior:"smooth"});
  }, 1400);
}

(async function boot(){
  await loadData();
  updateStats();
  renderChar();
})();
</script>
</body>
</html>
