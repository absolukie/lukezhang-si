<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bihua 笔画 · Stroke Order Game</title>
<style>
  :root{
    --paper:#f6efdd; --paper2:#fbf7ea; --ink:#2b2118; --ink-soft:#6b5d4c;
    --line:#d9c9a4; --accent:#c93a2e; --accent-deep:#a52a20;
    --btn:#fdfaf0; --btn-line:#d9c9a4;
    --shadow:0 10px 30px rgba(90,70,40,.12), 0 2px 6px rgba(90,70,40,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Avenir Next","Hiragino Sans GB","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    background-image:radial-gradient(rgba(120,95,60,.10) 1px, transparent 1.4px);
    background-size:22px 22px;
    padding:0 16px calc(28px + env(safe-area-inset-bottom));
    user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  .wrap{width:100%; max-width:520px; display:flex; flex-direction:column; gap:14px; padding-top:calc(14px + env(safe-area-inset-top));}

  header{display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
  .brand h1{margin:0; font-size:30px; letter-spacing:.02em; font-weight:800;}
  .brand h1 .cn{color:var(--accent);}
  .brand p{margin:2px 0 0; font-size:11px; letter-spacing:.42em; color:var(--ink-soft); font-weight:600;}
  .stats{display:flex; gap:14px; font-size:13px; color:var(--ink-soft); white-space:nowrap;}
  .stats b{color:var(--ink); font-size:18px; font-variant-numeric:tabular-nums;}

  .charhead{text-align:center; margin-top:2px;}
  .charhead .py{color:var(--accent); font-size:20px; letter-spacing:.35em; text-indent:.35em; font-weight:600;}
  .charhead .en{color:var(--ink-soft); font-size:17px; margin-top:2px;}
  .charhead .en .n{font-variant-numeric:tabular-nums;}

  .card{
    background:var(--paper2);
    border:2px solid var(--line);
    border-radius:28px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  #stage{aspect-ratio:1/1; width:100%;}
  #stage svg{width:100%; height:100%; display:block; touch-action:none;}
  #stage.shake{animation:shk .4s;}
  @keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}

  .stamp{
    position:absolute; right:18px; bottom:14px;
    width:84px; height:84px; border-radius:14px;
    border:5px solid var(--accent); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-size:52px; font-weight:800;
    transform:rotate(-8deg) scale(2.2); opacity:0; pointer-events:none;
    background:rgba(201,58,46,.06);
    font-family:"Hiragino Sans GB","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .stamp.show{animation:stampIn .45s cubic-bezier(.2,2.4,.4,1) forwards;}
  @keyframes stampIn{to{transform:rotate(-8deg) scale(1); opacity:.92;}}

  .prog{text-align:center; font-size:13px; letter-spacing:.28em; text-indent:.28em; color:var(--ink-soft); font-weight:600; font-variant-numeric:tabular-nums;}

  #strokes{display:grid; gap:10px;}
  #strokes.cols2{grid-template-columns:repeat(2,1fr);}
  #strokes.cols3{grid-template-columns:repeat(3,1fr);}
  #strokes.cols4{grid-template-columns:repeat(4,1fr);}
  #strokes.cols6{grid-template-columns:repeat(6,1fr);}
  .sbtn{
    background:var(--btn);
    border:2px solid var(--btn-line);
    border-radius:18px;
    aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 3px 0 rgba(120,95,60,.18);
    transition:transform .08s, box-shadow .08s, border-color .15s, opacity .2s;
    touch-action:manipulation;
    padding:8%;
  }
  .sbtn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(120,95,60,.18);}
  .sbtn svg{width:100%; height:100%; display:block; pointer-events:none;}
  .sbtn.used{opacity:.25; pointer-events:none; transform:none; box-shadow:none;}
  .sbtn.hintpulse{animation:hpulse .8s ease 2;}
  @keyframes hpulse{0%,100%{border-color:var(--btn-line)}50%{border-color:var(--accent); box-shadow:0 0 0 4px rgba(201,58,46,.25);}}

  .levels{margin-top:6px;}
  .levels h2{font-size:12px; letter-spacing:.4em; text-indent:.4em; color:var(--ink-soft); margin:0 0 10px; font-weight:700;}
  .lvl{margin-bottom:12px;}
  .lvl .lt{font-size:11px; letter-spacing:.24em; color:var(--ink-soft); margin-bottom:6px; font-weight:600;}
  .lvl .grid{display:flex; flex-wrap:wrap; gap:8px;}
  .cbtn{
    width:52px; height:52px; border-radius:14px;
    border:2px solid var(--btn-line); background:var(--btn);
    font-size:26px; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:"Hiragino Sans GB","PingFang SC","Microsoft YaHei",sans-serif;
    touch-action:manipulation;
    box-shadow:0 2px 0 rgba(120,95,60,.15);
    transition:transform .08s;
  }
  .cbtn:active{transform:translateY(1px);}
  .cbtn.cur{border-color:var(--accent); box-shadow:0 0 0 3px rgba(201,58,46,.22);}
  .cbtn.done{background:#e9f3e2; border-color:#9db98a;}

  footer{margin-top:10px; text-align:center; font-size:11px; color:var(--ink-soft); line-height:1.7;}
  footer a{color:var(--accent-deep);}

  .drawn{stroke-dasharray:1; stroke-dashoffset:1; animation:drawin .55s ease-out forwards;}
  @keyframes drawin{to{stroke-dashoffset:0;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1><span class="cn">笔画</span> Bihua</h1>
      <p>STROKE ORDER GAME</p>
    </div>
    <div class="stats"><span><b id="doneN">0</b> done</span><span><b id="streakN">0</b> streak</span></div>
  </header>

  <div class="charhead">
    <div class="py" id="pinyin">yi</div>
    <div class="en"><span id="meaning">one</span> · <span class="n" id="nstr">1 stroke</span></div>
  </div>

  <div class="card" id="stageCard">
    <div id="stage"></div>
    <div class="stamp" id="stamp">好</div>
  </div>

  <div class="prog" id="prog">TAP THE STROKES IN ORDER</div>

  <div id="strokes" class="cols2"></div>

  <div class="levels">
    <h2>CHARACTERS</h2>
    <div id="levels"></div>
  </div>

  <footer>
    Tap the stroke buttons in the correct stroke order.<br>
    Stroke data: <a href="https://github.com/chanind/hanzi-writer-data" target="_blank" rel="noopener">hanzi-writer-data</a> (MIT)
  </footer>
</div>

<script>
"use strict";
/* Bihua: tap the stroke buttons in the correct stroke order.
   Canvas starts as outline only. A correct tap draws that stroke in.
   A wrong tap shakes. 3 misses on one stroke pulses the right button. */

const CHARS = [
  {c:"一", py:"yi", en:"one"},
  {c:"人", py:"ren", en:"person"},
  {c:"大", py:"da", en:"big"},
  {c:"小", py:"xiao", en:"small"},
  {c:"十", py:"shi", en:"ten"},
  {c:"木", py:"mu", en:"tree"},
  {c:"王", py:"wang", en:"king"},
  {c:"天", py:"tian", en:"sky"},
  {c:"日", py:"ri", en:"sun"},
  {c:"月", py:"yue", en:"moon"},
  {c:"山", py:"shan", en:"mountain"},
  {c:"水", py:"shui", en:"water"},
  {c:"火", py:"huo", en:"fire"},
  {c:"田", py:"tian", en:"field"},
  {c:"白", py:"bai", en:"white"},
  {c:"目", py:"mu", en:"eye"},
  {c:"石", py:"shi", en:"stone"},
  {c:"立", py:"li", en:"stand"},
  {c:"生", py:"sheng", en:"life"},
  {c:"好", py:"hao", en:"good"},
];

const $ = id => document.getElementById(id);
const stage = $("stage"), stageCard = $("stageCard"), stamp = $("stamp");
const strokesEl = $("strokes"), prog = $("prog");

let data = {};        // char -> strokes array of path strings
let cur = 0;         // index into CHARS
let nextStroke = 0;  // which stroke index the player must tap next
let misses = 0;      // consecutive misses on the current stroke
let roundMistakes = 0; // total misses this round (for streak)
let doneSet = new Set(JSON.parse(localStorage.getItem("bihua.done")||"[]"));
let streak = +(localStorage.getItem("bihua.streak")||0);

function path(d){
  return '<path d="'+d+'" fill="none" stroke-width="90" stroke-linecap="round" stroke-linejoin="round"/>';
}
function strokeSVG(d){
  return '<svg viewBox="0 0 1024 1024" aria-hidden="true">'+path(d)+"</svg>";
}

async function loadData(){
  for(const ch of CHARS){
    const r = await fetch("data/"+ch.c+".json");
    data[ch.c] = (await r.json()).strokes;
  }
}

function updateStats(){
  $("doneN").textContent = doneSet.size;
  $("streakN").textContent = streak;
}

function shuffled(n){
  const a = Array.from({length:n}, (_,i)=>i);
  for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; }
  // never deal the already-correct order for n>1
  if(n>1 && a.every((v,i)=>v===i)){ [a[0],a[1]]=[a[1],a[0]]; }
  return a;
}

function renderChar(){
  const ch = CHARS[cur], strokes = data[ch.c], n = strokes.length;
  nextStroke = 0; misses = 0; roundMistakes = 0;
  $("pinyin").textContent = ch.py;
  $("meaning").textContent = ch.en;
  $("nstr").textContent = n + (n===1?" stroke":" strokes");
  prog.textContent = n===1 ? "TAP THE STROKE" : "TAP THE STROKES IN ORDER";
  stamp.classList.remove("show");

  // canvas: outline only, no strokes filled in
  stage.innerHTML =
    '<svg viewBox="0 0 1024 1024" aria-label="'+ch.c+' outline">' +
    '<g stroke="#ddcda6">' + strokes.map(path).join("") + "</g>" +
    '<g id="filled" stroke="#2b2118"></g>' +
    "</svg>";

  // stroke buttons: shuffled order, shapes only, no numbers
  strokesEl.className = "cols" + Math.min(6, Math.max(2, n));
  strokesEl.innerHTML = "";
  for(const si of shuffled(n)){
    const b = document.createElement("button");
    b.className = "sbtn";
    b.dataset.stroke = si;
    b.setAttribute("aria-label", "stroke");
    b.innerHTML = strokeSVG(strokes[si]);
    b.addEventListener("click", ()=>tapStroke(b, si));
    strokesEl.appendChild(b);
  }
  renderLevels();
}

function tapStroke(btn, si){
  const ch = CHARS[cur], strokes = data[ch.c], n = strokes.length;
  if(si === nextStroke){
    // correct: draw the stroke onto the canvas
    btn.classList.add("used");
    const g = stage.querySelector("#filled");
    const tmp = document.createElementNS("http://www.w3.org/2000/svg","g");
    tmp.innerHTML = path(strokes[si]).replace("<path", '<path pathLength="1" class="drawn"');
    g.appendChild(tmp.firstChild);
    nextStroke++; misses = 0;
    prog.textContent = nextStroke+" / "+n;
    if(nextStroke === n) complete();
  } else {
    // wrong: shake, count the miss
    misses++; roundMistakes++;
    stageCard.classList.remove("shake"); void stageCard.offsetWidth;
    stageCard.classList.add("shake");
    if(misses >= 3){
      misses = 0;
      const right = strokesEl.querySelector('[data-stroke="'+nextStroke+'"]');
      if(right && !right.classList.contains("used")){
        right.classList.remove("hintpulse"); void right.offsetWidth;
        right.classList.add("hintpulse");
      }
    }
  }
}

function complete(){
  const ch = CHARS[cur];
  const first = !doneSet.has(ch.c);
  doneSet.add(ch.c);
  localStorage.setItem("bihua.done", JSON.stringify([...doneSet]));
  streak = (roundMistakes===0) ? streak+1 : 0;
  localStorage.setItem("bihua.streak", streak);
  updateStats();
  stamp.classList.add("show");
  renderLevels();
  if(cur < CHARS.length-1 && first){
    setTimeout(()=>{ cur++; renderChar(); window.scrollTo({top:0,behavior:"smooth"}); }, 1400);
  }
}

function renderLevels(){
  const host = $("levels"); host.innerHTML = "";
  const groups = {};
  CHARS.forEach((ch,i)=>{ const n=data[ch.c].length; (groups[n]=groups[n]||[]).push(i); });
  Object.keys(groups).sort((a,b)=>a-b).forEach(k=>{
    const div = document.createElement("div"); div.className="lvl";
    div.innerHTML = '<div class="lt">'+k+(k==="1"?" STROKE":" STROKES")+"</div>";
    const grid = document.createElement("div"); grid.className="grid";
    groups[k].forEach(i=>{
      const b=document.createElement("button");
      b.className="cbtn"+(i===cur?" cur":"")+(doneSet.has(CHARS[i].c)?" done":"");
      b.textContent=CHARS[i].c;
      b.setAttribute("aria-label",CHARS[i].c+" "+CHARS[i].en);
      b.addEventListener("click",()=>{ cur=i; renderChar(); window.scrollTo({top:0,behavior:"smooth"}); });
      grid.appendChild(b);
    });
    div.appendChild(grid); host.appendChild(div);
  });
}

(async function boot(){
  await loadData();
  updateStats();
  renderChar();
})();
</script>
</body>
</html>
