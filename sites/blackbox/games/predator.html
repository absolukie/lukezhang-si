<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PREDATOR — BLACKBOX Arcade</title>
<style>
  :root{
    --bg:#04060b;
    --ink:#dfe9ff;
    --dim:#8b96b3;
    --cyan:#46e8ff;
    --mint:#3dffb0;
    --pink:#ff5fa2;
    --red:#ff4d5e;
  }
  *{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    overflow:hidden; position:fixed; inset:0;
    overscroll-behavior:none;
  }
  /* faint laboratory grid */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(70,232,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(70,232,255,0.045) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse at center, black 30%, transparent 90%);
    -webkit-mask-image:radial-gradient(ellipse at center, black 30%, transparent 90%);
  }
  #game{ position:fixed; inset:0; z-index:1; display:block; touch-action:none; }
  #vignette{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  }
  #beachflash{
    position:fixed; inset:0; z-index:3; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse at center, rgba(255,77,94,0.12) 40%, rgba(255,77,94,0.55) 100%);
    transition:opacity 0.12s linear;
  }
  /* ---------- HUD ---------- */
  #hud{
    position:fixed; top:0; left:0; right:0; z-index:5;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) 20px 0;
    pointer-events:none; user-select:none; -webkit-user-select:none;
  }
  .hud-block{ display:flex; flex-direction:column; gap:2px; }
  .hud-label{
    font-size:10px; letter-spacing:3px; color:var(--dim);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .hud-value{
    font-size:26px; font-weight:700; letter-spacing:1px; color:#fff;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    text-shadow:0 0 14px rgba(70,232,255,0.8);
    font-variant-numeric:tabular-nums;
  }
  #hud .mid{ text-align:center; }
  #hud .right{ text-align:right; }
  #livesVal{ color:var(--pink); text-shadow:0 0 14px rgba(255,95,162,0.8); letter-spacing:2px; }
  /* ---------- Overlays ---------- */
  .overlay{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px 28px;
    background:rgba(4,6,11,0.66);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .overlay.hidden{ display:none; }
  .kicker{
    font-size:11px; letter-spacing:5px; color:var(--dim); margin-bottom:14px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  h1.title{
    margin:0 0 10px; font-size:56px; font-weight:800; letter-spacing:10px; text-indent:10px;
    color:#fff; text-shadow:0 0 18px rgba(255,95,162,0.9), 0 0 60px rgba(255,95,162,0.45);
  }
  .tagline{ margin:0 0 8px; font-size:14px; color:var(--dim); letter-spacing:1px; }
  .howto{
    margin:18px 0 30px; font-size:16px; line-height:1.6; color:var(--ink); max-width:340px;
  }
  .howto b{ color:var(--cyan); font-weight:600; }
  .btn{
    touch-action:manipulation; cursor:pointer; user-select:none; -webkit-user-select:none;
    font-family:inherit; font-size:17px; font-weight:700; letter-spacing:4px; text-indent:4px;
    color:#04121a; background:linear-gradient(180deg,#7df3ff,#2fd4f5);
    border:none; border-radius:14px; padding:16px 52px;
    box-shadow:0 0 24px rgba(70,232,255,0.45), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .btn:active{ transform:scale(0.96); }
  .trick{
    margin-top:34px; touch-action:manipulation; cursor:pointer;
    background:none; border:1px solid rgba(139,150,179,0.35); border-radius:999px;
    color:var(--dim); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11px; letter-spacing:2px; padding:9px 18px;
  }
  .trick .neon{ color:var(--mint); text-shadow:0 0 10px rgba(61,255,176,0.8); }
  .trick.revealed{ border-color:rgba(61,255,176,0.5); }
  .reveal{
    margin-top:34px; font-size:12px; color:var(--dim); letter-spacing:0.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .reveal .neon{ color:var(--mint); }
  h2.endhead{
    margin:0 0 6px; font-size:15px; letter-spacing:6px; text-indent:6px; color:var(--dim);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-weight:400;
  }
  #finalScore{
    font-size:84px; font-weight:800; color:#fff; margin:0 0 4px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    text-shadow:0 0 22px rgba(61,255,176,0.85);
    font-variant-numeric:tabular-nums;
  }
  #endStats{
    margin:0 0 10px; font-size:13px; letter-spacing:2px; color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  #newBest{
    display:none; margin:0 0 10px; font-size:13px; letter-spacing:3px; color:var(--pink);
    text-shadow:0 0 12px rgba(255,95,162,0.8);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .bestline{
    margin:0 0 30px; font-size:14px; color:var(--dim); letter-spacing:2px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .bestline span{ color:var(--ink); }
  #autotest{
    position:fixed; left:8px; bottom:8px; z-index:50; max-width:94vw;
    font:10px ui-monospace,Menlo,Consolas,monospace; color:#3dffb0;
    background:rgba(0,0,0,0.8); padding:8px; border-radius:6px;
    white-space:pre-wrap; word-break:break-all; display:none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="beachflash"></div>

<div id="hud" style="display:none">
  <div class="hud-block">
    <div class="hud-label">EATEN</div>
    <div class="hud-value" id="eatenVal">0/20</div>
  </div>
  <div class="hud-block mid">
    <div class="hud-label">SCORE</div>
    <div class="hud-value" id="scoreVal">0</div>
  </div>
  <div class="hud-block right">
    <div class="hud-label">LIVES</div>
    <div class="hud-value" id="livesVal">♥♥♥</div>
  </div>
</div>

<div class="overlay" id="titleScr">
  <div class="kicker">BLACKBOX ARCADE</div>
  <h1 class="title">PREDATOR</h1>
  <p class="tagline">a steering-behavior hunt</p>
  <p class="howto"><b>Drag anywhere</b> to steer the shark.<br>Eat <b>20 fish</b>. Stay in the water.<br>Beach yourself 3 times and it is over.</p>
  <button class="btn" id="startBtn">START</button>
  <button class="trick" id="trickBtn">▸ REVEAL THE TRICK</button>
</div>

<div class="overlay hidden" id="endScr">
  <h2 class="endhead" id="endHead">FULL BELLY</h2>
  <div id="finalScore">0</div>
  <p id="endStats"></p>
  <div id="newBest">NEW BEST</div>
  <p class="bestline">BEST&nbsp;&nbsp;<span id="bestScore">0</span></p>
  <button class="btn" id="againBtn">PLAY AGAIN</button>
  <div class="reveal">powered by <span class="neon">steering behaviors</span>.</div>
</div>

<div id="autotest"></div>

<script>
'use strict';
/* ============================================================
   PREDATOR — you are the shark.
   Player: pursuit steering with turn limits + arrival.
   Fish:   classic boids (separation / alignment / cohesion)
           + evade (the shark) + wander, spatial-hash neighbors.
   Zero dependencies, zero network.
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
function angDiff(a, b) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}

/* ---------------- canvas ---------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
const water = { x: 0, y: 0, w: 0, h: 0 };   // the ocean tank
let staticBg = null;

function rrPath(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function renderStatic() {
  staticBg = document.createElement('canvas');
  staticBg.width = Math.max(1, Math.round(W * DPR));
  staticBg.height = Math.max(1, Math.round(H * DPR));
  const g = staticBg.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  // sand / lab floor outside the water
  g.fillStyle = '#0b0a09';
  g.fillRect(0, 0, W, H);
  for (let i = 0; i < 420; i++) {
    const a = 0.03 + Math.random() * 0.05;
    g.fillStyle = 'rgba(216,186,140,' + a.toFixed(3) + ')';
    const s = 1 + Math.random() * 2.2;
    g.fillRect(Math.random() * W, Math.random() * H, s, s);
  }
  // water
  const grad = g.createLinearGradient(0, water.y, 0, water.y + water.h);
  grad.addColorStop(0, '#073049');
  grad.addColorStop(0.55, '#052338');
  grad.addColorStop(1, '#031627');
  rrPath(g, water.x, water.y, water.w, water.h, 26);
  g.fillStyle = grad;
  g.fill();
  g.save();
  rrPath(g, water.x, water.y, water.w, water.h, 26);
  g.clip();
  // drifting motes
  for (let i = 0; i < 130; i++) {
    const a = 0.04 + Math.random() * 0.08;
    g.fillStyle = 'rgba(120,220,255,' + a.toFixed(3) + ')';
    const s = 1 + Math.random() * 2;
    g.fillRect(water.x + Math.random() * water.w, water.y + Math.random() * water.h, s, s);
  }
  // faint grid
  g.strokeStyle = 'rgba(70,232,255,0.055)';
  g.lineWidth = 1;
  g.beginPath();
  for (let gx = water.x; gx <= water.x + water.w; gx += 44) { g.moveTo(gx, water.y); g.lineTo(gx, water.y + water.h); }
  for (let gy = water.y; gy <= water.y + water.h; gy += 44) { g.moveTo(water.x, gy); g.lineTo(water.x + water.w, gy); }
  g.stroke();
  g.restore();
  // neon rim
  rrPath(g, water.x, water.y, water.w, water.h, 26);
  g.strokeStyle = 'rgba(70,232,255,0.55)';
  g.lineWidth = 2;
  g.shadowColor = '#46e8ff';
  g.shadowBlur = 12;
  g.stroke();
  g.shadowBlur = 0;
}

/* ---------------- tuning ---------------- */
const N = 48;                 // fish in the school
const WIN_EAT = 20;
const START_LIVES = 3;
const S_MAX = 310;            // shark top speed, px/s
const S_TURN = 3.6;           // shark turn limit, rad/s
const S_ARRIVE = 120;         // arrival radius, px
const F_MAXS0 = 152;          // fish base top speed, px/s
const F_MAXA = 360;           // fish max steering accel, px/s^2
const SEP_R2 = 26 * 26;
const NB_R2 = 64 * 64;
const EVADE_R = 200;
const EAT_R = 28;
const CELL = 44;

/* ---------------- fish state (typed arrays) ---------------- */
const fx = new Float32Array(N);
const fy = new Float32Array(N);
const fvx = new Float32Array(N);
const fvy = new Float32Array(N);
const fwander = new Float32Array(N);
const falive = new Uint8Array(N);
const fspr = new Uint8Array(N);
const fscale = new Float32Array(N);

let cols = 1, rows = 1;
let grid = [];
function buildGrid() {
  cols = Math.max(1, Math.ceil(W / CELL));
  rows = Math.max(1, Math.ceil(H / CELL));
  grid = new Array(cols * rows);
  for (let i = 0; i < grid.length; i++) grid[i] = [];
}

/* ---------------- shark state ---------------- */
let sx = 0, sy = 0, svx = 0, svy = 0, sang = 0, sspeed = 0;
let tx = 0, ty = 0;           // drag target (pursuit point)
let dragging = false;
let invuln = 0;               // post-beach grace, seconds
let shakeT = 0;

/* ---------------- game state ---------------- */
let state = 'title';          // title | playing | over
let simT = 0;                 // frames
let eaten = 0;
let lives = START_LIVES;
let score = 0;
let elapsed = 0;              // seconds, while playing
let alive = N;
let won = false;
let best = 0;
try { best = parseInt(localStorage.getItem('bb-predator-best') || '0', 10) || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('bb-predator-best', String(best)); } catch (e) {} }

/* ---------------- sprites ---------------- */
function makeFishSprite(color, glow) {
  const s = 30;
  const c = document.createElement('canvas');
  c.width = s; c.height = s;
  const g = c.getContext('2d');
  g.translate(s / 2, s / 2);
  g.shadowColor = glow;
  g.shadowBlur = 7;
  g.fillStyle = color;
  // tail
  g.beginPath();
  g.moveTo(-4, 0); g.lineTo(-11, -4.5); g.lineTo(-11, 4.5);
  g.closePath(); g.fill();
  // body
  g.beginPath();
  g.ellipse(2, 0, 7.5, 3.4, 0, 0, TAU);
  g.fill();
  // eye
  g.shadowBlur = 0;
  g.fillStyle = '#04121a';
  g.beginPath(); g.arc(6, -1, 1.1, 0, TAU); g.fill();
  return c;
}
const fishSprites = [
  makeFishSprite('#9ff5ff', '#35e0ff'),
  makeFishSprite('#c9ffe6', '#2bff9e'),
  makeFishSprite('#ffc2da', '#ff5fa2')
];

/* ---------------- particles / ripples / popups (fixed pools) ---------------- */
const PMAX = 200;
const parts = [];
for (let i = 0; i < PMAX; i++) parts.push({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, col: '#fff' });
const PCOLS = ['#7df9ff', '#eaffff', '#3dffb0', '#ff5fa2'];
function burst(x, y, n, cols) {
  for (let i = 0; i < PMAX && n > 0; i++) {
    const p = parts[i];
    if (p.life > 0) continue;
    const a = Math.random() * TAU;
    const sp = 40 + Math.random() * 170;
    p.x = x; p.y = y;
    p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
    p.max = p.life = 0.45 + Math.random() * 0.4;
    p.col = cols[(Math.random() * cols.length) | 0];
    n--;
  }
}
const ripples = [];
for (let i = 0; i < 10; i++) ripples.push({ x: 0, y: 0, life: 0 });
let ripIdx = 0;
function ripple(x, y) {
  const r = ripples[ripIdx]; ripIdx = (ripIdx + 1) % ripples.length;
  r.x = x; r.y = y; r.life = 0.45;
}
const popups = [];
for (let i = 0; i < 8; i++) popups.push({ x: 0, y: 0, life: 0, txt: '' });
let popIdx = 0;
function popup(x, y, txt) {
  const p = popups[popIdx]; popIdx = (popIdx + 1) % popups.length;
  p.x = x; p.y = y; p.txt = txt; p.life = 1.0;
}

/* ---------------- audio (tiny synth, gesture-guarded) ---------------- */
let AC = null;
function ensureAudio() {
  try {
    const ua = navigator.userActivation;
    // Without a real user gesture, creating/resuming an AudioContext makes
    // Chrome log a console warning. Stay silent until a genuine gesture occurs
    // (synthetic test clicks report isActive === false).
    if (ua && !ua.isActive && (!AC || AC.state === 'suspended')) return;
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (C) AC = new C();
    }
    if (AC && AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function blip(freq, dur, vol, type) {
  try {
    if (!AC) return;
    const t = AC.currentTime;
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.4), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function chomp() { blip(420, 0.14, 0.25, 'triangle'); }
function thud() { blip(110, 0.35, 0.4, 'sawtooth'); }
function winJingle() {
  try {
    if (!AC) return;
    const notes = [523.25, 659.25, 783.99, 1046.5];
    for (let i = 0; i < notes.length; i++) {
      const t = AC.currentTime + i * 0.11;
      const o = AC.createOscillator();
      const g = AC.createGain();
      o.type = 'triangle';
      o.frequency.value = notes[i];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      o.connect(g); g.connect(AC.destination);
      o.start(t); o.stop(t + 0.45);
    }
  } catch (e) {}
}

/* ---------------- entities ---------------- */
function spawnFish() {
  // School center: random point in the tank, kept well away from the shark's
  // home (tank center) so a run never starts with free eats.
  const hx = water.x + water.w / 2, hy = water.y + water.h / 2;
  let cx = hx, cy = hy;
  for (let tries = 0; tries < 24; tries++) {
    const px = water.x + 90 + Math.random() * Math.max(1, water.w - 180);
    const py = water.y + 110 + Math.random() * Math.max(1, water.h - 220);
    if (Math.hypot(px - hx, py - hy) > 180) { cx = px; cy = py; break; }
  }
  alive = N;
  for (let i = 0; i < N; i++) {
    const gx = (Math.random() + Math.random() + Math.random() - 1.5) * 130;
    const gy = (Math.random() + Math.random() + Math.random() - 1.5) * 130;
    fx[i] = clamp(cx + gx, water.x + 20, water.x + water.w - 20);
    fy[i] = clamp(cy + gy, water.y + 20, water.y + water.h - 20);
    const a = Math.random() * TAU;
    const s = 60 + Math.random() * 60;
    fvx[i] = Math.cos(a) * s;
    fvy[i] = Math.sin(a) * s;
    fwander[i] = Math.random() * TAU;
    falive[i] = 1;
    fspr[i] = (Math.random() * 3) | 0;
    fscale[i] = 0.8 + Math.random() * 0.5;
  }
}
function resetShark() {
  sx = water.x + water.w / 2;
  sy = water.y + water.h / 2;
  svx = 0; svy = 0; sang = -Math.PI / 2; sspeed = 0;
  tx = sx; ty = sy;
  invuln = 0;
}

/* ---------------- physics step ---------------- */
function step(dt) {
  simT++;
  const playing = state === 'playing';
  if (playing) elapsed += dt;
  if (invuln > 0) invuln -= dt;
  if (shakeT > 0) shakeT -= dt;

  // thinning factor: survivors get faster and more evasive
  const thin = 1 - alive / N;
  const F_MAXS = F_MAXS0 * (1 + 0.85 * thin);
  const EVADE_W = 2.8 + 1.8 * thin;

  // rebuild spatial hash (alive fish only)
  for (let i = 0; i < grid.length; i++) grid[i].length = 0;
  for (let i = 0; i < N; i++) {
    if (!falive[i]) continue;
    let c = ((fx[i] / CELL) | 0);
    if (c < 0) c = 0; else if (c >= cols) c = cols - 1;
    let r = ((fy[i] / CELL) | 0);
    if (r < 0) r = 0; else if (r >= rows) r = rows - 1;
    grid[r * cols + c].push(i);
  }

  // predicted shark position: fish EVADE the future, not the present
  const shPx = sx + svx * 0.25;
  const shPy = sy + svy * 0.25;

  for (let i = 0; i < N; i++) {
    if (!falive[i]) continue;
    const xi = fx[i], yi = fy[i];
    const vxi = fvx[i], vyi = fvy[i];
    let sepx = 0, sepy = 0, sepc = 0;
    let alx = 0, aly = 0, alc = 0;
    let cohx = 0, cohy = 0;

    let cc = (xi / CELL) | 0;
    if (cc < 0) cc = 0; else if (cc >= cols) cc = cols - 1;
    let rr = (yi / CELL) | 0;
    if (rr < 0) rr = 0; else if (rr >= rows) rr = rows - 1;

    for (let dr = -1; dr <= 1; dr++) {
      const r2 = rr + dr;
      if (r2 < 0 || r2 >= rows) continue;
      for (let dc = -1; dc <= 1; dc++) {
        const c2 = cc + dc;
        if (c2 < 0 || c2 >= cols) continue;
        const cell = grid[r2 * cols + c2];
        for (let k = 0; k < cell.length; k++) {
          const j = cell[k];
          if (j === i) continue;
          const dx = xi - fx[j], dy = yi - fy[j];
          const d2 = dx * dx + dy * dy;
          if (d2 > NB_R2) continue;
          if (d2 < SEP_R2 && d2 > 1e-6) {
            const inv = 1 / d2;
            sepx += dx * inv; sepy += dy * inv; sepc++;
          }
          alx += fvx[j]; aly += fvy[j]; alc++;
          cohx += fx[j]; cohy += fy[j];
        }
      }
    }

    let ax = 0, ay = 0;
    // separation
    if (sepc > 0) {
      let dx = sepx / sepc, dy = sepy / sepc;
      const m = Math.sqrt(dx * dx + dy * dy);
      if (m > 1e-6) {
        dx = dx / m * F_MAXS - vxi; dy = dy / m * F_MAXS - vyi;
        ax += dx * 1.7; ay += dy * 1.7;
      }
    }
    // alignment
    if (alc > 0) {
      let dx = alx / alc, dy = aly / alc;
      const m = Math.sqrt(dx * dx + dy * dy);
      if (m > 1e-6) {
        dx = dx / m * F_MAXS - vxi; dy = dy / m * F_MAXS - vyi;
        ax += dx; ay += dy;
      }
    }
    // cohesion
    if (alc > 0) {
      let dx = cohx / alc - xi, dy = cohy / alc - yi;
      const m = Math.sqrt(dx * dx + dy * dy);
      if (m > 1e-6) {
        dx = dx / m * F_MAXS - vxi; dy = dy / m * F_MAXS - vyi;
        ax += dx * 0.85; ay += dy * 0.85;
      }
    }
    // evade the shark (predicted position)
    {
      const dx = xi - shPx, dy = yi - shPy;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < EVADE_R && d > 1e-6) {
        const urg = 1.15 + 0.85 * (1 - d / EVADE_R);
        let ex = dx / d * F_MAXS * urg - vxi;
        let ey = dy / d * F_MAXS * urg - vyi;
        ax += ex * EVADE_W; ay += ey * EVADE_W;
      }
    }
    // wander: slow random walk of a per-fish heading
    fwander[i] += (Math.random() * 2 - 1) * 5.5 * dt;
    ax += Math.cos(fwander[i]) * F_MAXA * 0.32;
    ay += Math.sin(fwander[i]) * F_MAXA * 0.32;
    // soft-steer inside the water tank (quadratic ramp near edges)
    const mg = 52;
    const wx0 = water.x, wy0 = water.y, wx1 = water.x + water.w, wy1 = water.y + water.h;
    if (xi < wx0 + mg) { const k = (wx0 + mg - xi) / mg; ax += k * k * 520; }
    else if (xi > wx1 - mg) { const k = (xi - (wx1 - mg)) / mg; ax -= k * k * 520; }
    if (yi < wy0 + mg) { const k = (wy0 + mg - yi) / mg; ay += k * k * 520; }
    else if (yi > wy1 - mg) { const k = (yi - (wy1 - mg)) / mg; ay -= k * k * 520; }

    // clamp steering accel
    const am = Math.sqrt(ax * ax + ay * ay);
    if (am > F_MAXA) { ax = ax / am * F_MAXA; ay = ay / am * F_MAXA; }

    let nvx = vxi + ax * dt;
    let nvy = vyi + ay * dt;
    const sp = Math.sqrt(nvx * nvx + nvy * nvy);
    if (sp > F_MAXS) { nvx = nvx / sp * F_MAXS; nvy = nvy / sp * F_MAXS; }
    else if (sp < 42 && sp > 1e-6) { nvx = nvx / sp * 42; nvy = nvy / sp * 42; }
    fvx[i] = nvx; fvy[i] = nvy;
    fx[i] = clamp(xi + nvx * dt, wx0 + 6, wx1 - 6);
    fy[i] = clamp(yi + nvy * dt, wy0 + 6, wy1 - 6);
  }

  /* ---- shark: pursuit steering toward the drag point ----
     1. desired heading from target, rotated toward at S_TURN rad/s
        (the turn limit — the shark cannot snap around)
     2. arrival: target speed eases off inside S_ARRIVE px
     3. speed eases toward target speed (acceleration, not teleport) */
  {
    const dx = tx - sx, dy = ty - sy;
    const d = Math.sqrt(dx * dx + dy * dy);
    const desiredAng = Math.atan2(dy, dx);
    const maxTurn = S_TURN * dt;
    sang += clamp(angDiff(sang, desiredAng), -maxTurn, maxTurn);
    const targetSpeed = S_MAX * Math.min(1, d / S_ARRIVE);
    sspeed += (targetSpeed - sspeed) * (1 - Math.exp(-4.5 * dt));
    if (sspeed < 0.5 && d < 6) sspeed = 0;
    svx = Math.cos(sang) * sspeed;
    svy = Math.sin(sang) * sspeed;
    sx += svx * dt;
    sy += svy * dt;
  }

  if (playing) {
    // eating: nose check
    const nx = sx + Math.cos(sang) * 26;
    const ny = sy + Math.sin(sang) * 26;
    for (let i = 0; i < N; i++) {
      if (!falive[i]) continue;
      const dx = fx[i] - nx, dy = fy[i] - ny;
      if (dx * dx + dy * dy < EAT_R * EAT_R) {
        falive[i] = 0;
        alive--;
        eaten++;
        score += 100;
        chomp();
        burst(fx[i], fy[i], 16, PCOLS);
        ripple(nx, ny);
        popup(fx[i], fy[i] - 16, '+100');
        updateHUD();
        if (eaten >= WIN_EAT) { endGame(true); break; }
      }
    }
    // beaching: the shark left the water
    if (state === 'playing' && invuln <= 0 &&
        (sx < water.x || sx > water.x + water.w || sy < water.y || sy > water.y + water.h)) {
      beach();
    }
  }

  // ambient shark cruise on the title screen: slow lissajous pursuit target
  if (state === 'title') {
    const t = simT * dt;
    tx = water.x + water.w / 2 + Math.cos(t * 0.35) * water.w * 0.3;
    ty = water.y + water.h / 2 + Math.sin(t * 0.53) * water.h * 0.3;
  }

  // particles / ripples / popups always animate
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i];
    if (p.life <= 0) continue;
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - 2.2 * dt); p.vy *= (1 - 2.2 * dt);
  }
  for (let i = 0; i < ripples.length; i++) if (ripples[i].life > 0) ripples[i].life -= dt;
  for (let i = 0; i < popups.length; i++) if (popups[i].life > 0) { popups[i].life -= dt; popups[i].y -= 34 * dt; }
}

function beach() {
  lives--;
  updateHUD();
  thud();
  shakeT = 0.35;
  const flash = document.getElementById('beachflash');
  flash.style.opacity = '1';
  setTimeout(function () { flash.style.opacity = '0'; }, 260);
  burst(clamp(sx, water.x, water.x + water.w), clamp(sy, water.y, water.y + water.h), 22, ['#ff4d5e', '#ffd0d4', '#ffffff']);
  if (lives <= 0) {
    endGame(false);
  } else {
    resetShark();
    invuln = 2.0;
    popup(sx, sy - 30, 'BEACHED! ' + lives + (lives === 1 ? ' LIFE' : ' LIVES') + ' LEFT');
  }
}

/* ---------------- render ---------------- */
function draw() {
  let ox = 0, oy = 0;
  if (shakeT > 0) {
    const k = shakeT / 0.35;
    ox = (Math.random() * 2 - 1) * 7 * k;
    oy = (Math.random() * 2 - 1) * 7 * k;
  }
  ctx.setTransform(DPR, 0, 0, DPR, ox * DPR, oy * DPR);
  ctx.clearRect(-12, -12, W + 24, H + 24);
  if (staticBg) ctx.drawImage(staticBg, 0, 0, W, H);

  // danger glow: shark near the water's edge
  if (state === 'playing' && invuln <= 0) {
    const ed = Math.min(sx - water.x, water.x + water.w - sx, sy - water.y, water.y + water.h - sy);
    if (ed < 52) {
      const a = clamp(1 - ed / 52, 0, 1) * (0.45 + 0.35 * Math.sin(simT * 0.35));
      rrPath(ctx, water.x - 3, water.y - 3, water.w + 6, water.h + 6, 29);
      ctx.strokeStyle = 'rgba(255,77,94,' + a.toFixed(3) + ')';
      ctx.lineWidth = 5;
      ctx.shadowColor = '#ff4d5e';
      ctx.shadowBlur = 20;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  // drag target marker
  if (state === 'playing' && dragging) {
    ctx.save();
    ctx.strokeStyle = 'rgba(70,232,255,0.7)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.arc(tx, ty, 14 + 3 * Math.sin(simT * 0.25), 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  // fish: rotated sprite blits, no save/restore
  for (let i = 0; i < N; i++) {
    if (!falive[i]) continue;
    const ang = Math.atan2(fvy[i], fvx[i]);
    const sc = fscale[i] * DPR;
    const ca = Math.cos(ang) * sc, sa = Math.sin(ang) * sc;
    ctx.setTransform(ca, sa, -sa, ca, (fx[i] + ox) * DPR, (fy[i] + oy) * DPR);
    ctx.drawImage(fishSprites[fspr[i]], -15, -15);
  }
  ctx.setTransform(DPR, 0, 0, DPR, ox * DPR, oy * DPR);

  drawShark(ox, oy);

  // particles
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i];
    if (p.life <= 0) continue;
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;

  // ripples
  for (let i = 0; i < ripples.length; i++) {
    const r = ripples[i];
    if (r.life <= 0) continue;
    const k = r.life / 0.45;
    ctx.strokeStyle = 'rgba(125,249,255,' + (k * 0.75).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(r.x, r.y, 6 + (1 - k) * 44, 0, TAU);
    ctx.stroke();
  }

  // popups
  ctx.textAlign = 'center';
  ctx.font = 'bold 17px ui-monospace, Menlo, Consolas, monospace';
  for (let i = 0; i < popups.length; i++) {
    const p = popups[i];
    if (p.life <= 0) continue;
    ctx.globalAlpha = clamp(p.life / 0.4, 0, 1);
    ctx.fillStyle = p.txt.charAt(0) === 'B' ? '#ffb3ba' : '#eafff3';
    ctx.shadowColor = p.txt.charAt(0) === 'B' ? '#ff4d5e' : '#3dffb0';
    ctx.shadowBlur = 12;
    ctx.fillText(p.txt, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawShark(ox, oy) {
  if (invuln > 0 && ((simT >> 2) & 1) === 0) return;  // blink during grace
  const wag = Math.sin(simT * 0.42) * 0.55 * clamp(sspeed / S_MAX, 0.15, 1);
  ctx.save();
  ctx.translate(sx + ox, sy + oy);
  ctx.rotate(sang);
  ctx.shadowColor = 'rgba(70,232,255,0.9)';
  ctx.shadowBlur = 14;
  // tail fin (wags with speed)
  ctx.save();
  ctx.translate(-22, 0);
  ctx.rotate(wag * 0.8);
  ctx.fillStyle = '#123a5c';
  ctx.beginPath();
  ctx.moveTo(2, 0); ctx.lineTo(-15, -11); ctx.lineTo(-10, 0); ctx.lineTo(-15, 11);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  // body
  const grad = ctx.createLinearGradient(0, -9, 0, 9);
  grad.addColorStop(0, '#1d4e80');
  grad.addColorStop(0.5, '#16406b');
  grad.addColorStop(1, '#0d2a49');
  ctx.fillStyle = grad;
  ctx.strokeStyle = '#46e8ff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(28, 0);
  ctx.quadraticCurveTo(12, -10, -8, -8);
  ctx.quadraticCurveTo(-20, -6, -24, -2);
  ctx.lineTo(-24, 2);
  ctx.quadraticCurveTo(-20, 6, -8, 8);
  ctx.quadraticCurveTo(12, 10, 28, 0);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;
  // dorsal fin
  ctx.fillStyle = '#123a5c';
  ctx.beginPath();
  ctx.moveTo(-2, -7); ctx.lineTo(-11, -19); ctx.lineTo(-16, -6);
  ctx.closePath(); ctx.fill();
  // pectoral fins
  ctx.beginPath();
  ctx.moveTo(6, 6); ctx.lineTo(-2, 15); ctx.lineTo(0, 5);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(6, -6); ctx.lineTo(-2, -13); ctx.lineTo(0, -5);
  ctx.closePath(); ctx.fill();
  // gill slits
  ctx.strokeStyle = 'rgba(70,232,255,0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let gi = 0; gi < 3; gi++) {
    const gx = 8 - gi * 3.5;
    ctx.moveTo(gx, -5); ctx.lineTo(gx - 1, 5);
  }
  ctx.stroke();
  // eye
  ctx.fillStyle = '#eaffff';
  ctx.beginPath(); ctx.arc(16, -3.5, 2.2, 0, TAU); ctx.fill();
  ctx.fillStyle = '#04121a';
  ctx.beginPath(); ctx.arc(16.6, -3.5, 1.1, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ---------------- HUD / screens ---------------- */
const hud = document.getElementById('hud');
const eatenVal = document.getElementById('eatenVal');
const scoreVal = document.getElementById('scoreVal');
const livesVal = document.getElementById('livesVal');
const titleScr = document.getElementById('titleScr');
const endScr = document.getElementById('endScr');
const endHead = document.getElementById('endHead');
const finalScore = document.getElementById('finalScore');
const endStats = document.getElementById('endStats');
const bestScore = document.getElementById('bestScore');
const newBest = document.getElementById('newBest');

function updateHUD() {
  eatenVal.textContent = eaten + '/' + WIN_EAT;
  scoreVal.textContent = score;
  livesVal.textContent = '♥'.repeat(Math.max(0, lives)) || '—';
}
function startGame() {
  eaten = 0;
  lives = START_LIVES;
  score = 0;
  elapsed = 0;
  won = false;
  for (let i = 0; i < PMAX; i++) parts[i].life = 0;
  for (let i = 0; i < ripples.length; i++) ripples[i].life = 0;
  for (let i = 0; i < popups.length; i++) popups[i].life = 0;
  spawnFish();
  resetShark();
  updateHUD();
  state = 'playing';
  titleScr.classList.add('hidden');
  endScr.classList.add('hidden');
  hud.style.display = 'flex';
  ensureAudio();
}
function endGame(didWin) {
  won = didWin;
  state = 'over';
  let timeBonus = 0;
  if (didWin) {
    timeBonus = Math.max(0, Math.round((300 - elapsed) * 5));
    score += timeBonus;
  }
  const isBest = score > best;
  if (isBest) { best = score; saveBest(); }
  endHead.textContent = didWin ? 'FULL BELLY' : 'BEACHED';
  finalScore.textContent = score;
  if (didWin) {
    const s = Math.round(elapsed);
    endStats.textContent = '20 fish · ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') +
      ' · time bonus +' + timeBonus;
  } else {
    endStats.textContent = eaten + ' fish eaten · ' + (WIN_EAT - eaten) + ' got away';
  }
  bestScore.textContent = best;
  newBest.style.display = isBest && score > 0 ? 'block' : 'none';
  updateHUD();
  if (didWin) winJingle(); else thud();
  endScr.classList.remove('hidden');
}
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);

/* tap-to-reveal the algorithm label */
(function () {
  const btn = document.getElementById('trickBtn');
  btn.addEventListener('click', function () {
    btn.classList.add('revealed');
    btn.innerHTML = 'powered by <span class="neon">steering behaviors</span>';
  });
})();

/* ---------------- input: drag to steer ---------------- */
function pointTo(e) { return { x: e.clientX, y: e.clientY }; }
canvas.addEventListener('pointerdown', function (e) {
  const p = pointTo(e);
  dragging = true;
  tx = p.x; ty = p.y;
  ripple(p.x, p.y);
  ensureAudio();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  const p = pointTo(e);
  tx = p.x; ty = p.y;
});
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

/* ---------------- resize ---------------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  const m = 22;
  water.x = m;
  water.w = Math.max(120, W - 2 * m);
  water.y = 100;
  water.h = Math.max(120, H - 100 - 34);
  renderStatic();
  buildGrid();
  // keep everyone inside the new tank
  for (let i = 0; i < N; i++) {
    fx[i] = clamp(fx[i], water.x + 6, water.x + water.w - 6);
    fy[i] = clamp(fy[i], water.y + 6, water.y + water.h - 6);
  }
  sx = clamp(sx, water.x, water.x + water.w);
  sy = clamp(sy, water.y, water.y + water.h);
}
window.addEventListener('resize', resize);

/* ---------------- test hooks ---------------- */
window.__test = {
  state: function () { return state; },
  start: function () { startGame(); },
  shark: function () { return { x: sx, y: sy, vx: svx, vy: svy, ang: sang, speed: sspeed }; },
  setTarget: function (x, y) { tx = x; ty = y; dragging = true; },
  clearTarget: function () { dragging = false; },
  teleportShark: function (x, y) { sx = x; sy = y; sspeed = 0; svx = 0; svy = 0; },
  eaten: function () { return eaten; },
  lives: function () { return lives; },
  score: function () { return score; },
  fishAlive: function () { return alive; },
  fishPos: function (i) { return { x: fx[i], y: fy[i], alive: !!falive[i] }; },
  water: function () { return { x: water.x, y: water.y, w: water.w, h: water.h }; },
  turnLimit: function () { return S_TURN; }
};

/* ---------------- boot ---------------- */
resize();
spawnFish();
resetShark();
updateHUD();

/* ---- autotest mode (?autotest=1): scripted smoke test that writes a
   JSON report into #autotest. Run headless with --virtual-time-budget. ---- */
const AUTOTEST = location.search.indexOf('autotest') !== -1;
const atErrors = [];
if (AUTOTEST) {
  const origErr = console.error;
  const origWarn = console.warn;
  console.error = function () { atErrors.push('console.error: ' + Array.prototype.join.call(arguments, ' ')); origErr.apply(console, arguments); };
  console.warn = function () { atErrors.push('console.warn: ' + Array.prototype.join.call(arguments, ' ')); origWarn.apply(console, arguments); };
  window.addEventListener('error', function (e) { atErrors.push('window.onerror: ' + (e.message || e.type)); });
  window.addEventListener('unhandledrejection', function (e) { atErrors.push('unhandledrejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
}
const at = {
  phase: -1, frame: 0, results: [], done: false,
  sx0: 0, sy0: 0, maxTurnObs: 0, maxTurnAllow: 0,
  dist0: 0, prevAng: 0, havePrev: false, prevDt: 0
};
function atCheck(name, ok, detail) {
  at.results.push({ name: name, ok: !!ok, detail: detail === undefined ? '' : String(detail) });
}
function schoolCentroid() {
  let x = 0, y = 0, c = 0;
  for (let i = 0; i < N; i++) {
    if (!falive[i]) continue;
    x += fx[i]; y += fy[i]; c++;
  }
  return c ? { x: x / c, y: y / c } : { x: water.x + water.w / 2, y: water.y + water.h / 2 };
}
/* Average distance of the k nearest fish to the shark: the ones inside
   evade range must scatter when the shark drops into the school. */
function nearestAvgDist(k) {
  const ds = [];
  for (let i = 0; i < N; i++) {
    if (!falive[i]) continue;
    const dx = fx[i] - sx, dy = fy[i] - sy;
    ds.push(Math.sqrt(dx * dx + dy * dy));
  }
  ds.sort(function (a, b) { return a - b; });
  const n = Math.min(k, ds.length);
  let s = 0;
  for (let i = 0; i < n; i++) s += ds[i];
  return n ? s / n : 0;
}
function nearestFish() {
  let bi = -1, bd = 1e18;
  for (let i = 0; i < N; i++) {
    if (!falive[i]) continue;
    const dx = fx[i] - sx, dy = fy[i] - sy;
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; bi = i; }
  }
  return bi;
}
/* Place the shark so its nose lands exactly on the nearest fish (guaranteed
   chomp next step), approaching from the water-center side so the shark stays wet. */
function noseOntoFish() {
  const bi = nearestFish();
  if (bi < 0) return false;
  const cx = water.x + water.w / 2, cy = water.y + water.h / 2;
  let ax = cx - fx[bi], ay = cy - fy[bi];
  const am = Math.sqrt(ax * ax + ay * ay) || 1;
  ax /= am; ay /= am;
  sang = Math.atan2(ay, ax);
  sx = fx[bi] - ax * 26;
  sy = fy[bi] - ay * 26;
  tx = sx; ty = sy;
  dragging = false;
  sspeed = 0; svx = 0; svy = 0;
  return true;
}
function atStep(dt) {
  if (!AUTOTEST || at.done) return;
  at.frame++;
  const F = at.frame;
  if (F === 5) {
    startGame();
    atCheck('game starts', state === 'playing', 'state=' + state);
    at.sx0 = sx; at.sy0 = sy;
    // drag to the far corner of the tank: shark must pursue with turn limits
    window.__test.setTarget(water.x + water.w - 30, water.y + water.h - 30);
    at.phase = 0;
  } else if (at.phase === 0) {
    // Track heading deltas vs the turn limit. The heading observed now was
    // produced by the PREVIOUS frame's step, so compare against that step's dt.
    if (at.havePrev) {
      const dAng = Math.abs(angDiff(at.prevAng, sang));
      const allow = S_TURN * at.prevDt + 0.002;
      if (dAng > at.maxTurnObs) at.maxTurnObs = dAng;
      if (allow > at.maxTurnAllow) at.maxTurnAllow = allow;
      if (dAng > allow) at.turnViolated = true;
    }
    at.prevAng = sang; at.havePrev = true; at.prevDt = dt;
    if (F === 125) {
      const moved = Math.hypot(sx - at.sx0, sy - at.sy0);
      atCheck('shark pursues drag target', moved > 60, 'moved=' + moved.toFixed(1) + 'px');
      atCheck('turning limit respected', !at.turnViolated,
        'maxObs=' + at.maxTurnObs.toFixed(4) + ' maxAllow=' + at.maxTurnAllow.toFixed(4));
      // flee check: drop the shark onto the school centroid, the nearest
      // fish should scatter
      const sc = schoolCentroid();
      window.__test.teleportShark(sc.x, sc.y);
      window.__test.setTarget(sc.x, sc.y);
      at.dist0 = nearestAvgDist(8);
      at.phase = 1;
    }
  } else if (at.phase === 1) {
    if (F === 245) {
      const d1 = nearestAvgDist(8);
      atCheck('fish flee the shark', d1 > at.dist0 + 10,
        'nearest-8 avg dist ' + at.dist0.toFixed(1) + ' -> ' + d1.toFixed(1));
      // eat check: put the nose exactly on the nearest fish
      noseOntoFish();
      at.phase = 2;
    }
  } else if (at.phase === 2) {
    if (F === 275) {
      atCheck('eating increments counter', eaten >= 1, 'eaten=' + eaten);
      atCheck('fish removed from school', alive === N - eaten, 'alive=' + alive);
      // beaching check: shove the shark out of the water
      window.__test.teleportShark(water.x - 20, water.y + water.h / 2);
      at.phase = 3;
    }
  } else if (at.phase === 3) {
    if (F === 290) {
      atCheck('beaching costs a life', lives === START_LIVES - 1, 'lives=' + lives);
      atCheck('shark respawned in water',
        sx >= water.x && sx <= water.x + water.w && sy >= water.y && sy <= water.y + water.h,
        'shark=(' + sx.toFixed(0) + ',' + sy.toFixed(0) + ')');
      // two more beachings must end the game
      invuln = 0;
      window.__test.teleportShark(water.x + water.w + 20, water.y + water.h / 2);
      at.phase = 4;
    }
  } else if (at.phase === 4) {
    if (F === 305) {
      atCheck('second beaching costs another life', lives === START_LIVES - 2, 'lives=' + lives);
      invuln = 0;
      window.__test.teleportShark(water.x - 20, water.y + water.h / 2);
      at.phase = 5;
    }
  } else if (at.phase === 5) {
    if (F === 320) {
      atCheck('third beaching ends the game', state === 'over', 'state=' + state);
      atCheck('lose screen shown', !endScr.classList.contains('hidden'), 'endScr visible');
      atCheck('lives exhausted', lives === 0, 'lives=' + lives);
      document.getElementById('againBtn').click();
      // check the reset synchronously: no frame has run since the click, so
      // no incidental eat can pollute the counters
      atCheck('restart resets the run', state === 'playing' && lives === START_LIVES && eaten === 0 && alive === N,
        'state=' + state + ' lives=' + lives + ' eaten=' + eaten + ' alive=' + alive);
      at.phase = 6;
    }
  } else if (at.phase === 6) {
    if (F === 335) {
      // win path: eat the remaining quota instantly via nose checks
      let guard = 0;
      while (eaten < WIN_EAT && guard++ < 400) {
        if (!noseOntoFish()) break;
        step(1 / 60);
      }
      atCheck('eating 20 wins the game', state === 'over' && won === true,
        'state=' + state + ' eaten=' + eaten);
      atCheck('win screen shown', !endScr.classList.contains('hidden'), 'endScr visible');
      atCheck('score = fish + time bonus', score >= WIN_EAT * 100, 'score=' + score);
      let bestStored = null;
      try { bestStored = localStorage.getItem('bb-predator-best'); } catch (e) {}
      atCheck('best score persisted', bestStored !== null && parseInt(bestStored, 10) === score,
        'bb-predator-best=' + bestStored);
      atCheck('zero console errors', atErrors.length === 0, atErrors.slice(0, 3).join(' | '));
      at.done = true;
      const report = {
        passed: at.results.every(function (r) { return r.ok; }),
        checks: at.results,
        consoleErrors: atErrors
      };
      const el = document.getElementById('autotest');
      el.style.display = 'block';
      el.textContent = 'AUTOTEST ' + JSON.stringify(report);
      document.title = 'AUTOTEST-DONE passed=' + report.passed;
    }
  }
}

/* ---------------- main loop ---------------- */
let lastT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  let dt = (t - lastT) / 1000;
  if (!(dt > 0)) dt = 1 / 60;
  if (dt > 1 / 20) dt = 1 / 20;
  lastT = t;
  atStep(dt);
  step(dt);
  draw();
}
requestAnimationFrame(function (t) { lastT = t; requestAnimationFrame(frame); });
</script>
</body>
