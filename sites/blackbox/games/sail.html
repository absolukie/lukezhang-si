<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#070b12"/>
<title>SAIL · BLACKBOX</title>
<style>
  :root{
    --bg:#070b12; --panel:rgba(10,16,26,.92); --line:rgba(34,211,238,.25);
    --neon:#22d3ee; --mag:#e879f9; --amber:#fbbf24; --red:#ef4444;
    --txt:#dbe7f3; --dim:#7d8ea3;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-user-select:none;user-select:none;}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  button{touch-action:manipulation;font-family:inherit;cursor:pointer;}
  input[type=range]{touch-action:manipulation;}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:calc(10px + env(safe-area-inset-top)) 12px 0;}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:7px 11px;font-size:12px;letter-spacing:1.5px;color:var(--neon);white-space:nowrap;}
  .pill b{color:#fff;font-weight:700;}
  #hudLeft{display:flex;gap:8px;}
  #windBox{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;}
  #windBox span{font-size:9px;letter-spacing:2px;color:var(--dim);}
  #compass{display:block;}

  #heelWrap{position:fixed;top:calc(118px + env(safe-area-inset-top));left:12px;z-index:5;
    pointer-events:none;display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
  #heelWrap .cap{font-size:9px;letter-spacing:2px;color:var(--dim);}
  #heelBar{width:110px;height:10px;border:1px solid var(--line);border-radius:6px;
    background:rgba(10,16,26,.85);overflow:hidden;}
  #heelFill{height:100%;width:0%;border-radius:5px;
    background:linear-gradient(90deg,var(--neon),var(--amber),var(--red));}

  /* ---------- steering ---------- */
  #steer{position:fixed;left:0;right:0;bottom:calc(118px + env(safe-area-inset-bottom));
    z-index:5;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none;}
  .sbtn{pointer-events:auto;width:76px;height:76px;border-radius:50%;
    background:var(--panel);border:2px solid var(--line);color:var(--neon);
    font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .sbtn:active{background:rgba(34,211,238,.22);transform:scale(.95);}

  /* ---------- trim slider ---------- */
  #trimWrap{position:fixed;left:0;right:0;bottom:0;z-index:5;
    padding:10px 18px calc(18px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,transparent,rgba(4,7,12,.85) 40%);
    pointer-events:none;}
  #trimRow{display:flex;align-items:center;gap:10px;pointer-events:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;}
  #trimRow .lab{font-size:10px;letter-spacing:2px;color:var(--dim);white-space:nowrap;}
  #trimRow .val{font-size:12px;color:var(--neon);min-width:44px;text-align:right;}
  #trim{flex:1;-webkit-appearance:none;appearance:none;height:34px;background:transparent;}
  #trim::-webkit-slider-runnable-track{height:8px;border-radius:4px;
    background:linear-gradient(90deg,#0e3a46,#155e75 45%,#7c2d12);}
  #trim::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:34px;height:34px;margin-top:-13px;
    border-radius:50%;background:#0a1c24;border:2px solid var(--neon);
    box-shadow:0 0 14px rgba(34,211,238,.55);}
  #trim::-moz-range-track{height:8px;border-radius:4px;
    background:linear-gradient(90deg,#0e3a46,#155e75 45%,#7c2d12);}
  #trim::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#0a1c24;
    border:2px solid var(--neon);box-shadow:0 0 14px rgba(34,211,238,.55);}
  #pointSail{font-size:10px;letter-spacing:2px;color:var(--amber);text-align:center;
    margin-top:6px;min-height:14px;}

  /* ---------- overlays ---------- */
  #panel{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    background:rgba(4,7,12,.72);padding:24px;}
  #panel.hidden{display:none;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:26px 24px;max-width:330px;width:100%;text-align:center;
    box-shadow:0 0 40px rgba(34,211,238,.12);}
  .card h1{font-size:36px;letter-spacing:10px;color:#fff;margin-bottom:4px;
    text-shadow:0 0 18px rgba(34,211,238,.8);}
  .card .sub{font-size:11px;letter-spacing:3px;color:var(--dim);margin-bottom:14px;}
  .card p{font-size:13px;line-height:1.75;color:var(--txt);margin-bottom:12px;}
  .card .stat{font-size:13px;letter-spacing:1px;color:var(--neon);margin:4px 0;}
  .card .stat.big{font-size:26px;color:#fff;margin:10px 0;}
  .bigbtn{display:block;width:100%;margin-top:12px;background:linear-gradient(180deg,#0e2a33,#0a1c24);
    border:2px solid var(--neon);color:#fff;border-radius:14px;padding:15px;
    font-size:15px;letter-spacing:4px;box-shadow:0 0 24px rgba(34,211,238,.35);}
  .bigbtn:active{transform:scale(.97);}
  #revealBtn{background:transparent;border:1px dashed var(--line);color:var(--dim);
    border-radius:10px;padding:8px 14px;font-size:11px;letter-spacing:2px;margin-bottom:12px;}
  #tagLabel{display:none;font-size:12px;letter-spacing:2px;color:var(--mag);margin-bottom:12px;
    text-shadow:0 0 12px rgba(232,121,249,.6);}
  #tagLabel.show{display:block;}

  #banner{position:fixed;top:34%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:8;
    background:rgba(10,16,26,.95);border:2px solid var(--red);color:#ffb4b4;
    border-radius:14px;padding:14px 26px;font-size:16px;letter-spacing:3px;white-space:nowrap;
    opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;text-align:center;}
  #banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  #banner small{display:block;font-size:11px;letter-spacing:2px;color:var(--dim);margin-top:6px;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="hudLeft">
    <div class="pill" id="timePill">⏱ <b>0:00.0</b></div>
    <div class="pill" id="lapPill">LAP <b>1</b>/3</div>
    <div class="pill" id="spdPill"><b>0.0</b> kn</div>
  </div>
  <div id="windBox"><canvas id="compass" width="72" height="72"></canvas><span>WIND</span></div>
</div>

<div id="heelWrap">
  <div class="cap">HEEL</div>
  <div id="heelBar"><div id="heelFill"></div></div>
</div>

<div id="steer">
  <button class="sbtn" id="leftBtn" aria-label="steer left">◀</button>
  <button class="sbtn" id="rightBtn" aria-label="steer right">▶</button>
</div>

<div id="trimWrap">
  <div id="trimRow">
    <span class="lab">TRIM</span>
    <input type="range" id="trim" min="0" max="100" value="30" step="1" aria-label="sail trim"/>
    <span class="val" id="trimVal">23°</span>
  </div>
  <div id="pointSail">CLOSE HAUL</div>
</div>

<div id="banner"></div>

<div id="panel"><div class="card" id="cardBox"></div></div>

<script>
'use strict';
/* ============================================================
   SAIL — verlet cloth mainsail + curl-noise wind field (BLACKBOX)
   ============================================================ */

// ---------- utils ----------
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function fmtTime(s){
  s=Math.max(0,s);
  const m=Math.floor(s/60), sec=s-m*60;
  return m+':'+(sec<10?'0':'')+sec.toFixed(1);
}

// ---------- value noise (hash lattice) ----------
function hash2(ix,iy){
  let h=(ix*374761393+iy*668265263)|0;
  h=(h^(h>>>13))|0; h=(h*1274126177)|0; h=(h^(h>>>16))>>>0;
  return h/4294967295;
}
function vnoise(x,y){
  const ix=Math.floor(x), iy=Math.floor(y);
  const fx=x-ix, fy=y-iy;
  const ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
  const a=hash2(ix,iy), b=hash2(ix+1,iy), c=hash2(ix,iy+1), d=hash2(ix+1,iy+1);
  return lerp(lerp(a,b,ux), lerp(c,d,ux), uy); // 0..1
}
// potential field P(x,y,t); curl of P = (dP/dy, -dP/dx) -> divergence-free wind
function potential(x,y,t){
  return vnoise(x*0.0016+t*0.045, y*0.0016-t*0.031)*0.65
       + vnoise(x*0.0043-t*0.07,  y*0.0043+t*0.05 )*0.35;
}
// returns {ang, spd} — ang = direction wind blows TOWARD (radians, screen coords: -y = up/north)
function sampleWind(x,y,t){
  const e=26, s=1.0;
  const px1=potential(x+e,y,t), px0=potential(x-e,y,t);
  const py1=potential(x,y+e,t), py0=potential(x,y-e,t);
  let vx=(py1-py0)/(2*e)*s, vy=-(px1-px0)/(2*e)*s; // curl
  vx+=0; vy+=1.0;                                  // prevailing flow: toward south (+y)
  const g=0.55+0.75*vnoise(x*0.0011-t*0.06, y*0.0011+t*0.04); // gust 0.55..1.3
  const m=Math.hypot(vx,vy)||1;
  return {ang:Math.atan2(vy,vx), spd:g*(0.75+0.25*m)};
}
// wind-FROM bearing (what the compass shows), radians
function windFromAng(w){ return (w.ang+Math.PI)%TAU; }

// ---------- canvas ----------
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1;
let waterTile=null;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildWater();
}
window.addEventListener('resize',resize);

// cached water tile (256px, tiled) — gradient + noise caustics, drawn once
function buildWater(){
  const S=256, off=document.createElement('canvas');
  off.width=off.height=S;
  const g=off.getContext('2d');
  const grad=g.createLinearGradient(0,0,S,S);
  grad.addColorStop(0,'#0a1420'); grad.addColorStop(.5,'#0b1a26'); grad.addColorStop(1,'#081018');
  g.fillStyle=grad; g.fillRect(0,0,S,S);
  for(let i=0;i<420;i++){
    const x=Math.random()*S, y=Math.random()*S, r=1+Math.random()*3;
    const a=0.02+Math.random()*0.05;
    g.fillStyle='rgba(34,211,238,'+a.toFixed(3)+')';
    g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }
  g.strokeStyle='rgba(34,211,238,0.05)';
  for(let i=0;i<9;i++){
    g.beginPath();
    const y=Math.random()*S;
    g.moveTo(0,y);
    for(let x=0;x<=S;x+=16) g.lineTo(x,y+Math.sin(x*0.09+i*2.1)*5);
    g.stroke();
  }
  waterTile=off;
}
function drawWater(camX,camY){
  const S=256;
  const ox=-(((camX-W/2)%S)+S)%S, oy=-(((camY-H/2)%S)+S)%S;
  for(let x=ox-S;x<W+S;x+=S) for(let y=oy-S;y<H+S;y+=S) ctx.drawImage(waterTile,x,y);
}

// ---------- DOM ----------
const timePill=document.getElementById('timePill');
const lapPill=document.getElementById('lapPill');
const spdPill=document.getElementById('spdPill');
const heelFill=document.getElementById('heelFill');
const trimInput=document.getElementById('trim');
const trimVal=document.getElementById('trimVal');
const pointSailEl=document.getElementById('pointSail');
const panel=document.getElementById('panel');
const cardBox=document.getElementById('cardBox');
const banner=document.getElementById('banner');
const compC=document.getElementById('compass');
const compX=compC.getContext('2d');

// ---------- game state ----------
const LAPS=3, MAXSPD=150;             // px/s top speed
const NO_GO=20*Math.PI/180;           // no-go zone half-angle
const HEEL_MAX=0.82, HEEL_TIME=1.0;   // capsize when heel>HEEL_MAX for HEEL_TIME
const G={
  mode:'title',        // title | race | done
  t:0, raceT:0, penalty:0,
  lap:1, wp:0,         // wp: 0 -> buoy W, 1 -> buoy S(finish line)
  bx:0, by:0,          // boat pos (world)
  heading:0, speed:0,
  trim:23*Math.PI/180, // sail angle off centerline (rad)
  fullness:0, heel:0, heelT:0, _heelPower:1,
  capsized:false, capT:0,
  steer:0,
  camX:0, camY:0,
  finished:false,
};
// course: start/finish buoy S south, windward buoy W north. wind blows toward +y (south).
const BUOY_S={x:0,y:260}, BUOY_W={x:0,y:-260}, BUOY_R=46;
const WPS=[BUOY_W,BUOY_S];

function optimalTrim(offWind){ return clamp(offWind*0.45, 4*Math.PI/180, 78*Math.PI/180); }
function pointOfSail(off){
  const d=off*180/Math.PI;
  if(d<NO_GO*180/Math.PI) return 'IN IRONS';
  if(d<60)  return 'CLOSE HAUL';
  if(d<120) return 'REACH';
  return 'RUN';
}

// ---------- verlet cloth sail ----------
// grid: CW points along chord (luff->leech) x CH rows head->foot.
// top-down: luff pins at mast point M; row j leech end fans toward boom end.
// col 0 pinned at mast; clew (last row, last col) pinned at boom end.
const CW=8, CH=6;
const cloth={x:null,y:null,px:null,py:null,n:0};
function clothInit(){
  const n=CW*CH;
  cloth.x=new Float32Array(n); cloth.y=new Float32Array(n);
  cloth.px=new Float32Array(n); cloth.py=new Float32Array(n);
  cloth.n=n;
}
function clothReset(Mx,My){
  for(let j=0;j<CH;j++)for(let i=0;i<CW;i++){
    const k=j*CW+i;
    cloth.x[k]=cloth.px[k]=Mx+i*4;
    cloth.y[k]=cloth.py[k]=My+j*4;
  }
}
// pins + wind forces + verlet integrate + 3 constraint relaxations
let sampleWindCached={ang:Math.PI/2,spd:1}; // refreshed each frame at boat pos
function updateSail(dt){
  const from=windFromAng(sampleWindCached);
  // leeward side: wind comes from `from`; boom swings away from wind.
  // boom direction = aft rotated AWAY from wind side:
  const aft=G.heading+Math.PI;
  let side=Math.sin(from-aft); // >0 => wind from port-ish of aft => boom to starboard
  side=side>=0?1:-1;
  const boomAng=aft+side*G.trim;
  const Mx=G.bx, My=G.by;
  const BOOM=64;
  const Cx=Mx+Math.cos(boomAng)*BOOM, Cy=My+Math.sin(boomAng)*BOOM;

  const offWind=Math.abs(angDiff(G.heading,from));
  const opt=optimalTrim(offWind);
  const trimErr=Math.abs(G.trim-opt);
  const luffFlat = trimErr>0.42 && G.trim<opt;   // too flat for the point of sail
  const irons = offWind<NO_GO;
  // drive fullness: flat side spills wind fast (luffing stall); open side keeps
  // pulling, just less efficiently. heel power stays high when over-eased.
  let full, heelPower;
  if(irons){ full=0.05; heelPower=0.05; }
  else if(G.trim<=opt){ full=clamp(1-trimErr/0.5,0.05,1); heelPower=full; }
  else { full=clamp(1-trimErr/1.1,0.3,1); heelPower=clamp(1-trimErr/1.4,0.5,1); }
  G.fullness=full;
  G._heelPower=heelPower; G._luff=luffFlat||irons;

  const n=cloth.n;
  const gust=sampleWindCached.spd;
  // wind push direction: perpendicular to chord, toward leeward
  const pushAng=boomAng+side*Math.PI/2;
  const pushMag=(G._luff? 26: 120)*gust*G.fullness + (G._luff? 60:0);
  const tNow=G.t;
  for(let j=0;j<CH;j++){
    const rowF=j/(CH-1);
    const chordLen=lerp(10,BOOM,rowF); // head short, foot full boom
    for(let i=0;i<CW;i++){
      const k=j*CW+i;
      const pinnedLuff=(i===0), pinnedClew=(i===CW-1&&j===CH-1);
      if(pinnedLuff){ cloth.x[k]=cloth.px[k]=Mx; cloth.y[k]=cloth.py[k]=My; continue; }
      if(pinnedClew){ cloth.x[k]=cloth.px[k]=Cx; cloth.y[k]=cloth.py[k]=Cy; continue; }
      // leech end for this row (fan from mast toward boom dir)
      const ex=Mx+Math.cos(boomAng)*chordLen, ey=My+Math.sin(boomAng)*chordLen;
      const rx=Mx+(ex-Mx)*(i/(CW-1)), ry=My+(ey-My)*(i/(CW-1));
      // spring toward rest shape (keeps cloth near sail planform)
      let fx=(rx-cloth.x[k])*22, fy=(ry-cloth.y[k])*22;
      // wind pressure: max mid-chord, perpendicular
      const camber=Math.sin(Math.PI*(i/(CW-1)));
      let pm=pushMag*camber;
      let pa=pushAng;
      if(G._luff){ // flapping: oscillating pressure
        const fl=Math.sin(tNow*22 + i*1.7 + j*2.3);
        pm=(40+90*Math.abs(fl))*gust*camber;
        pa=pushAng+fl*1.2;
      }
      fx+=Math.cos(pa)*pm; fy+=Math.sin(pa)*pm;
      // verlet integrate
      const nx=cloth.x[k]+(cloth.x[k]-cloth.px[k])*0.985+fx*dt*dt*60;
      const ny=cloth.y[k]+(cloth.y[k]-cloth.py[k])*0.985+fy*dt*dt*60;
      cloth.px[k]=cloth.x[k]; cloth.py[k]=cloth.y[k];
      cloth.x[k]=nx; cloth.y[k]=ny;
    }
  }
  // distance constraints, 3 iterations
  for(let it=0;it<3;it++){
    for(let j=0;j<CH;j++){
      const rowF=j/(CH-1);
      const rc=lerp(10,BOOM,rowF)/(CW-1);
      for(let i=0;i<CW-1;i++){
        relax(j*CW+i, j*CW+i+1, rc);
      }
      if(j<CH-1) for(let i=0;i<CW;i++){
        // column rest: distance between row leech fans ~ row spacing at leech
        relax(j*CW+i,(j+1)*CW+i, 0); // 0 => keep close (fan rows), soft
      }
    }
  }
  G._boomAng=boomAng; G._side=side;
}
function relax(a,b,rest){
  let dx=cloth.x[b]-cloth.x[a], dy=cloth.y[b]-cloth.y[a];
  const d=Math.hypot(dx,dy)||1e-6;
  const diff=(d-rest)/d*0.5;
  const aPinned=(a%CW===0)||(a===(CH-1)*CW+CW-1);
  const bPinned=(b%CW===0)||(b===(CH-1)*CW+CW-1);
  if(rest===0){ // soft: pull rows together slightly
    if(!aPinned){cloth.x[a]+=dx*0.06;cloth.y[a]+=dy*0.06;}
    if(!bPinned){cloth.x[b]-=dx*0.06;cloth.y[b]-=dy*0.06;}
    return;
  }
  if(!aPinned){cloth.x[a]+=dx*diff;cloth.y[a]+=dy*diff;}
  if(!bPinned){cloth.x[b]-=dx*diff;cloth.y[b]-=dy*diff;}
}

// ---------- wind streaks (130, analytic wobble — no noise evals) ----------
const NSTREAK=130;
const streaks=[];
function initStreaks(){
  streaks.length=0;
  for(let i=0;i<NSTREAK;i++){
    streaks.push({
      x:Math.random()*2000-1000, y:Math.random()*2000-1000,
      len:14+Math.random()*22, sp:0.7+Math.random()*0.8,
      ph:Math.random()*TAU, wob:0.25+Math.random()*0.45, fq:1+Math.random()*2,
      a:0.10+Math.random()*0.16,
    });
  }
}

// ---------- boat update ----------
function updateBoat(dt){
  // wind AT the boat (own sample — not shared with streak loop)
  sampleWindCached=sampleWind(G.bx,G.by,G.t);
  const from=windFromAng(sampleWindCached);
  const offWind=Math.abs(angDiff(G.heading,from));

  if(!G.capsized && G.mode==='race'){
    G.heading+=G.steer*2.1*dt*(0.35+0.65*Math.min(1,G.speed/60));
  }
  // drive efficiency: in irons ~0; rises to full on reach; run slightly less
  const od=offWind*180/Math.PI;
  let eff;
  if(od<NO_GO*180/Math.PI) eff=0.04;
  else eff=0.55+0.45*Math.sin(Math.min(od,140)/140*Math.PI/2*1.15);
  eff=clamp(eff,0,1);
  const gust=clamp(sampleWindCached.spd,0.5,1.35);
  const target=G.capsized?0:MAXSPD*G.fullness*eff*(0.75+0.25*gust);
  const acc=target>G.speed?46:90;
  G.speed+=clamp(target-G.speed,-acc*dt,acc*dt);
  if(G.capsized){
    G.capT-=dt;
    if(G.capT<=0){G.capsized=false; hideBanner();}
  } else {
    G.bx+=Math.cos(G.heading)*G.speed*dt;
    G.by+=Math.sin(G.heading)*G.speed*dt;
  }
  // heel: driven by EXCESS openness beyond optimal trim — strapped-in optimal
  // trim never capsizes; easing too far out in a gust does.
  const opt=optimalTrim(offWind);
  const excess=clamp((G.trim-opt)/0.5,0,1);
  const heelT=G.capsized?1:clamp(G._heelPower*(0.15+0.85*excess)*(0.35+0.85*gust)*1.35,0,1.1);
  G.heel+=(heelT-G.heel)*Math.min(1,dt*3);
  if(G.heel>HEEL_MAX && !G.capsized && G.mode==='race'){
    G.heelT+=dt;
    if(G.heelT>HEEL_TIME){
      G.capsized=true; G.capT=2.0; G.heelT=0;
      G.penalty+=8;
      showBanner('CAPSIZED','+8s penalty · resuming…');
    }
  } else G.heelT=Math.max(0,G.heelT-dt*2);

  // waypoints / laps
  if(G.mode==='race' && !G.capsized){
    const wp=WPS[G.wp];
    const d=Math.hypot(G.bx-wp.x,G.by-wp.y);
    if(d<BUOY_R){
      if(G.wp===1){ // crossed finish line after rounding W
        G.lap++;
        if(G.lap>LAPS){ finishRace(); }
        else { flashLap(); }
      }
      G.wp=(G.wp+1)%2;
    }
  }
  if(G.mode==='race' && !G.finished) G.raceT+=dt;

  // camera follows boat
  G.camX+=(G.bx-G.camX)*Math.min(1,dt*4);
  G.camY+=(G.by-G.camY)*Math.min(1,dt*4);
}

// ---------- rendering ----------
function draw(){
  ctx.clearRect(0,0,W,H);
  drawWater(G.camX,G.camY);
  const ox=W/2-G.camX, oy=H/2-G.camY;
  ctx.save(); ctx.translate(ox,oy);
  drawCourse();
  drawStreaks();
  drawBoat();
  ctx.restore();
  drawVignette();
}
function drawCourse(){
  // start/finish line at S, windward mark W
  for(const b of [BUOY_S,BUOY_W]){
    const pulse=1+0.12*Math.sin(G.t*3);
    ctx.strokeStyle='rgba(232,121,249,.9)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(b.x,b.y,BUOY_R*pulse,0,TAU); ctx.stroke();
    ctx.fillStyle='rgba(232,121,249,.18)';
    ctx.beginPath(); ctx.arc(b.x,b.y,BUOY_R*pulse,0,TAU); ctx.fill();
    // buoy
    ctx.fillStyle='#e879f9';
    ctx.beginPath(); ctx.arc(b.x,b.y,9,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(b.x-3,b.y-3,3,0,TAU); ctx.fill();
  }
  // target waypoint marker
  const wp=WPS[G.wp];
  if(G.mode==='race'){
    ctx.strokeStyle='rgba(251,191,36,.95)'; ctx.lineWidth=2;
    ctx.setLineDash([8,6]); ctx.lineDashOffset=-G.t*30;
    ctx.beginPath(); ctx.arc(wp.x,wp.y,BUOY_R+14,0,TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  // labels
  ctx.fillStyle='rgba(125,142,163,.9)'; ctx.font='11px ui-monospace,monospace';
  ctx.textAlign='center';
  ctx.fillText('START/FINISH',BUOY_S.x,BUOY_S.y+BUOY_R+22);
  ctx.fillText('WINDWARD',BUOY_W.x,BUOY_W.y-BUOY_R-12);
}
function drawStreaks(){
  const wA=sampleWindCached.ang, gust=sampleWindCached.spd;
  const t=G.t;
  ctx.lineWidth=1.5;
  for(let i=0;i<NSTREAK;i++){
    const s=streaks[i];
    // analytic wobble: NOT a noise eval — cheap sin per streak
    const a=wA+Math.sin(t*s.fq+s.ph)*s.wob;
    const vx=Math.cos(a)*s.sp*(60+120*gust), vy=Math.sin(a)*s.sp*(60+120*gust);
    s.x+=vx*0.016; s.y+=vy*0.016;
    // wrap around camera view
    const m=120, vw=W+m*2, vh=H+m*2;
    let rx=(s.x-(G.camX-W/2-m))%vw; if(rx<0)rx+=vw;
    let ry=(s.y-(G.camY-H/2-m))%vh; if(ry<0)ry+=vh;
    const x=G.camX-W/2-m+rx, y=G.camY-H/2-m+ry;
    const L=s.len*(0.6+0.7*gust);
    const ex=x-Math.cos(a)*L, ey=y-Math.sin(a)*L;
    ctx.strokeStyle='rgba(34,211,238,'+s.a.toFixed(3)+')';
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(ex,ey); ctx.stroke();
  }
}
function drawBoat(){
  const bx=G.bx, by=G.by, hd=G.heading;
  ctx.save();
  ctx.translate(bx,by);
  // heel tilt: rotate hull slightly + shift
  const heelVis=G.capsized?0.9:G.heel*0.35*G._side;
  ctx.rotate(heelVis*0.4);
  // hull: sleek neon outline, bow toward heading
  ctx.rotate(hd);
  const hullLen=46, hullW=16;
  ctx.fillStyle=G.capsized?'rgba(60,70,85,.9)':'rgba(16,28,40,.95)';
  ctx.strokeStyle=G.capsized?'#5b6675':'#22d3ee'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(hullLen/2,0);
  ctx.quadraticCurveTo(hullLen/4,-hullW/2,-hullLen/2,-hullW/2+3);
  ctx.quadraticCurveTo(-hullLen/2-4,0,-hullLen/2,-hullW/2+3);
  ctx.quadraticCurveTo(-hullLen/2,hullW/2-3,-hullLen/2-4,0);
  ctx.quadraticCurveTo(-hullLen/2,hullW/2-3,hullLen/4,hullW/2);
  ctx.quadraticCurveTo(hullLen/2+2,0,hullLen/2,0);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // cockpit dot
  ctx.fillStyle='rgba(34,211,238,.5)';
  ctx.beginPath(); ctx.arc(-4,0,4,0,TAU); ctx.fill();
  ctx.rotate(-hd);
  ctx.restore();

  // sail cloth (world space, not hull-rotated)
  drawSail(bx,by);
}
function drawSail(bx,by){
  const luff=G._luff;
  // fill per-row strips with camber shading
  for(let j=0;j<CH-1;j++){
    const shade=0.5+0.5*(j/(CH-1));
    ctx.beginPath();
    for(let i=0;i<CW;i++){const k=j*CW+i; i?ctx.lineTo(cloth.x[k],cloth.y[k]):ctx.moveTo(cloth.x[k],cloth.y[k]);}
    for(let i=CW-1;i>=0;i--){const k=(j+1)*CW+i; ctx.lineTo(cloth.x[k],cloth.y[k]);}
    ctx.closePath();
    const c=luff?'232,121,120':'34,211,238';
    ctx.fillStyle='rgba('+c+','+(0.16+0.10*shade).toFixed(3)+')';
    ctx.fill();
    ctx.strokeStyle='rgba('+c+',0.5)'; ctx.lineWidth=1;
    ctx.stroke();
  }
  // battens (chord lines)
  ctx.strokeStyle='rgba(219,231,243,.28)'; ctx.lineWidth=1;
  for(let j=0;j<CH;j+=2){
    ctx.beginPath();
    for(let i=0;i<CW;i++){const k=j*CW+i; i?ctx.lineTo(cloth.x[k],cloth.y[k]):ctx.moveTo(cloth.x[k],cloth.y[k]);}
    ctx.stroke();
  }
  // mast + boom
  ctx.strokeStyle='#dbe7f3'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(bx,by,4,0,TAU); ctx.stroke();
  ctx.strokeStyle='rgba(219,231,243,.7)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(bx,by);
  ctx.lineTo(bx+Math.cos(G._boomAng)*64, by+Math.sin(G._boomAng)*64); ctx.stroke();
  if(luff){ // luff flutter indicator
    ctx.fillStyle='rgba(232,121,120,.9)'; ctx.font='10px ui-monospace,monospace'; ctx.textAlign='center';
    ctx.fillText('LUFFING',bx,by-84);
  }
}
function drawVignette(){
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.42,W/2,H/2,Math.max(W,H)*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(2,4,8,.55)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

// ---------- compass (re-samples wind AT boat — own object, not shared) ----------
function drawCompass(){
  const w=sampleWind(G.bx,G.by,G.t); // fresh sample, separate from streak loop's cache
  const from=windFromAng(w);
  const c=compX, S=72, cx=36, cy=36, R=30;
  c.clearRect(0,0,S,S);
  // no-go wedge (head-to-wind)
  c.fillStyle='rgba(239,68,68,.22)';
  c.beginPath(); c.moveTo(cx,cy);
  c.arc(cx,cy,R,from-NO_GO-Math.PI/2,from+NO_GO-Math.PI/2); c.closePath(); c.fill();
  // ring
  c.strokeStyle='rgba(34,211,238,.4)'; c.lineWidth=1.5;
  c.beginPath(); c.arc(cx,cy,R,0,TAU); c.stroke();
  // N tick
  c.fillStyle='rgba(125,142,163,.9)'; c.font='8px ui-monospace,monospace'; c.textAlign='center';
  c.fillText('N',cx,cy-R-7);
  // wind arrow: points where wind blows TOWARD, tail marks FROM
  const to=w.ang;
  c.strokeStyle='#22d3ee'; c.lineWidth=2.5;
  c.beginPath();
  c.moveTo(cx-Math.cos(to)*R*0.55, cy-Math.sin(to)*R*0.55);
  c.lineTo(cx+Math.cos(to)*R*0.8, cy+Math.sin(to)*R*0.8);
  c.stroke();
  // boat heading tick
  c.strokeStyle='#fbbf24'; c.lineWidth=2.5;
  const ha=G.heading-Math.PI/2;
  c.beginPath();
  c.moveTo(cx+Math.cos(ha)*R*0.72, cy+Math.sin(ha)*R*0.72);
  c.lineTo(cx+Math.cos(ha)*R*0.95, cy+Math.sin(ha)*R*0.95);
  c.stroke();
}

// ---------- HUD (no per-frame string allocs: update only on change) ----------
const hudCache={time:'',lap:'',spd:'',trim:'',sail:'',heel:-1};
function updateHUD(){
  const tstr=fmtTime(G.raceT+G.penalty);
  if(tstr!==hudCache.time){hudCache.time=tstr;timePill.innerHTML='⏱ <b>'+tstr+'</b>';}
  const lstr='LAP <b>'+Math.min(G.lap,LAPS)+'</b>/'+LAPS;
  if(lstr!==hudCache.lap){hudCache.lap=lstr;lapPill.innerHTML=lstr;}
  const sstr='<b>'+(G.speed*0.12).toFixed(1)+'</b> kn';
  if(sstr!==hudCache.spd){hudCache.spd=sstr;spdPill.innerHTML=sstr;}
  const hPct=Math.round(clamp(G.heel,0,1)*100);
  if(hPct!==hudCache.heel){hudCache.heel=hPct;heelFill.style.width=hPct+'%';}
  const from=windFromAng(sampleWindCached);
  const off=Math.abs(angDiff(G.heading,from));
  const ps=pointOfSail(off);
  if(ps!==hudCache.sail){hudCache.sail=ps;pointSailEl.textContent=ps;}
}

// ---------- input ----------
const leftBtn=document.getElementById('leftBtn'), rightBtn=document.getElementById('rightBtn');
function bindHold(el,dir){
  const on=e=>{e.preventDefault();G.steer=dir;};
  const off=()=>{if(G.steer===dir)G.steer=0;};
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('pointerleave',off);
}
bindHold(leftBtn,-1); bindHold(rightBtn,1);
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')G.steer=-1;
  if(e.key==='ArrowRight')G.steer=1;
});
window.addEventListener('keyup',e=>{
  if((e.key==='ArrowLeft'&&G.steer===-1)||(e.key==='ArrowRight'&&G.steer===1))G.steer=0;
});
function trimDeg(){return Math.round(4+(78-4)*(trimInput.value/100));}
function syncTrim(){
  G.trim=(4+(78-4)*(trimInput.value/100))*Math.PI/180;
  const d=trimDeg()+'°';
  if(d!==hudCache.trim){hudCache.trim=d;trimVal.textContent=d;}
}
trimInput.addEventListener('input',syncTrim);
syncTrim();

// ---------- banner / toast ----------
let bannerTimer=0;
function showBanner(txt,sub){
  banner.innerHTML=txt+(sub?'<small>'+sub+'</small>':'');
  banner.classList.add('show');
}
function hideBanner(){banner.classList.remove('show');}
function flashLap(){
  showBanner('LAP '+Math.min(G.lap,LAPS)+' / '+LAPS,'');
  clearTimeout(bannerTimer);
  bannerTimer=setTimeout(hideBanner,1400);
}

// ---------- screens ----------
function showTitle(){
  G.mode='title';
  const best=localStorage.getItem('bb-sail-best');
  cardBox.innerHTML=
    '<button id="revealBtn">? HOW DOES IT WORK</button>'+
    '<div id="tagLabel">verlet cloth + wind field</div>'+
    '<h1>SAIL</h1><div class="sub">BLACKBOX · 03</div>'+
    '<p>Race 3 laps around the buoys. Steer with ◀ ▶, trim the sail with the slider. '+
    'Beat upwind through the red no-go zone, ease out downwind. Too open in a gust and you capsize.</p>'+
    (best?'<div class="stat">BEST '+fmtTime(parseFloat(best))+'</div>':'')+
    '<button class="bigbtn" id="startBtn">START RACE</button>';
  panel.classList.remove('hidden');
  document.getElementById('revealBtn').addEventListener('click',()=>{
    document.getElementById('tagLabel').classList.toggle('show');
  });
  document.getElementById('startBtn').addEventListener('click',startRace);
}
function startRace(){
  panel.classList.add('hidden');
  G.mode='race'; G.t=0; G.raceT=0; G.penalty=0;
  G.lap=1; G.wp=0; G.finished=false;
  G.bx=BUOY_S.x; G.by=BUOY_S.y+BUOY_R+40;
  const w0=sampleWind(G.bx,G.by,0);
  G.heading=windFromAng(w0)+Math.PI-0.7; // start on a close reach, not in irons
  G.speed=0; G.heel=0; G.heelT=0; G.capsized=false;
  G.camX=G.bx; G.camY=G.by;
  clothReset(G.bx,G.by);
  showBanner('LAP 1 / 3','round the pink marks');
  clearTimeout(bannerTimer);
  bannerTimer=setTimeout(hideBanner,1600);
}
function finishRace(){
  G.finished=true; G.mode='done';
  const total=G.raceT+G.penalty;
  let best=parseFloat(localStorage.getItem('bb-sail-best')||'0');
  const isBest=!best||total<best;
  if(isBest){best=total;localStorage.setItem('bb-sail-best',String(total));}
  cardBox.innerHTML=
    '<h1>SAIL</h1><div class="sub">RACE COMPLETE</div>'+
    '<div class="stat">TOTAL TIME</div>'+
    '<div class="stat big">'+fmtTime(total)+'</div>'+
    (G.penalty>0?'<div class="stat">includes +'+G.penalty.toFixed(0)+'s capsize penalty</div>':'')+
    '<div class="stat">BEST '+fmtTime(best)+(isBest?' · NEW!':'')+'</div>'+
    '<button class="bigbtn" id="againBtn">RACE AGAIN</button>';
  panel.classList.remove('hidden');
  document.getElementById('againBtn').addEventListener('click',()=>{startRace();});
}

// ---------- main loop ----------
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.033,(ts-last)/1000||0.016);
  last=ts;
  G.t+=dt;
  if(G.mode==='race'||G.mode==='done'){
    updateBoat(dt);
    if(G.mode==='race') updateSail(dt);
  } else {
    // title screen: idle demo — boat drifts, sail breathes
    sampleWindCached=sampleWind(G.bx,G.by,G.t);
    G.heading+=dt*0.1;
    updateSail(dt);
  }
  draw();
  drawCompass();
  updateHUD();
}

// ---------- boot ----------
clothInit();
initStreaks();
resize();
G.bx=BUOY_S.x; G.by=BUOY_S.y+BUOY_R+40;
G.camX=G.bx; G.camY=G.by;
clothReset(G.bx,G.by);
showTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
