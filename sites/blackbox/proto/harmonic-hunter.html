<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HARMONIC HUNTER — Orbital Lab</title>
<style>
  :root{
    --bg:#0a0a12;
    --cyan:#00e5ff;
    --magenta:#ff4fd8;
    --dim:#8a8aa3;
    --panel:#12121c;
    --good:#4ade80;
    --bad:#f87171;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:#e8e8f2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;}
  #app{display:flex;flex-direction:column;height:100%;height:100dvh;}
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;background:var(--panel);border-bottom:1px solid #1e1e2e;
    flex:0 0 auto;
  }
  .brand{font-weight:800;letter-spacing:3px;font-size:15px;color:var(--cyan);
    text-shadow:0 0 12px rgba(0,229,255,.6);}
  .hud{display:flex;gap:14px;font-size:13px;font-weight:700;color:var(--dim);}
  .hud b{color:#e8e8f2;}
  #wrap{position:relative;flex:1 1 auto;min-height:0;}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #banner{
    position:absolute;left:12px;right:12px;top:12px;z-index:2;
    background:rgba(18,18,28,.92);border:1px solid #2c2c44;border-radius:14px;
    padding:14px;text-align:center;display:none;
  }
  #banner.show{display:block;}
  #banner .verdict{font-size:18px;font-weight:800;margin-bottom:4px;}
  #banner .verdict.good{color:var(--good);}
  #banner .verdict.bad{color:var(--bad);}
  #banner .detail{font-size:14px;color:#c9c9dd;margin-bottom:12px;}
  #nextBtn{
    font-size:16px;font-weight:800;padding:12px 30px;border-radius:12px;
    background:transparent;border:2px solid var(--cyan);color:var(--cyan);
    min-height:48px;touch-action:manipulation;font-family:inherit;cursor:pointer;
  }
  #panel{flex:0 0 auto;background:var(--panel);border-top:1px solid #1e1e2e;padding:10px 12px;}
  #krow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  #kread{font-size:14px;font-weight:800;color:var(--cyan);min-width:52px;}
  #worth{font-size:13px;color:var(--dim);font-weight:600;}
  #worth b{color:var(--magenta);}
  #sharpen{
    margin-left:auto;font-family:inherit;font-size:14px;font-weight:700;
    background:#181826;color:#e8e8f2;border:1px solid rgba(255,79,216,.55);
    color:var(--magenta);border-radius:10px;padding:10px 14px;min-height:44px;
    cursor:pointer;touch-action:manipulation;
  }
  #sharpen:active{transform:scale(.96);}
  #sharpen:disabled{opacity:.35;cursor:default;transform:none;}
  #opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .opt{
    font-family:inherit;font-size:15px;font-weight:700;
    background:#181826;color:#e8e8f2;border:1px solid #2c2c44;border-radius:12px;
    padding:12px 8px;min-height:52px;cursor:pointer;touch-action:manipulation;
  }
  .opt:active{transform:scale(.96);}
  .opt:disabled{cursor:default;transform:none;}
  .opt.right{border-color:var(--good);color:var(--good);box-shadow:0 0 12px rgba(74,222,128,.35);}
  .opt.wrong{border-color:var(--bad);color:var(--bad);}
  .opt.dim{opacity:.45;}
  footer{flex:0 0 auto;text-align:center;font-size:10.5px;color:#55556e;padding:6px 10px 8px;line-height:1.4;}
  .overlay{
    position:fixed;inset:0;z-index:10;background:rgba(10,10,18,.96);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;gap:14px;
  }
  .overlay.hidden{display:none;}
  .overlay h1{margin:0;font-size:40px;font-weight:900;letter-spacing:6px;color:var(--cyan);
    text-shadow:0 0 24px rgba(0,229,255,.7),0 0 60px rgba(0,229,255,.3);}
  .overlay .how{font-size:16px;color:#c9c9dd;max-width:340px;line-height:1.55;}
  .overlay .score{font-size:22px;font-weight:800;color:#e8e8f2;}
  .overlay .score b{color:var(--magenta);}
  .overlay .bestline{font-size:14px;color:var(--dim);}
  .overlay .bestline b{color:var(--cyan);}
  .bigbtn{
    font-family:inherit;font-size:18px;font-weight:800;padding:14px 44px;border-radius:14px;
    background:transparent;border:2px solid var(--cyan);color:var(--cyan);
    box-shadow:0 0 18px rgba(0,229,255,.35);min-height:56px;cursor:pointer;
    touch-action:manipulation;
  }
  .bigbtn:active{transform:scale(.96);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">HARMONIC HUNTER</div>
    <div class="hud"><span>ROUND <b id="roundread">1/8</b></span><span>SCORE <b id="scoreread">0</b></span></div>
  </header>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="banner">
      <div class="verdict" id="verdict"></div>
      <div class="detail" id="detail"></div>
      <button id="nextBtn" type="button">Next shape</button>
    </div>
  </div>
  <div id="panel">
    <div id="krow">
      <span id="kread">K = 4</span>
      <span id="worth">worth <b>100</b></span>
      <button id="sharpen" type="button">Sharpen +4</button>
    </div>
    <div id="opts"></div>
  </div>
  <footer>Discrete Fourier Transform &mdash; any closed curve is a sum of spinning circles.</footer>
</div>

<div class="overlay" id="title">
  <h1>HARMONIC<br>HUNTER</h1>
  <div class="how">A mystery shape hides in blurry circles. Sharpen to reveal it, but every sharpen costs you 10 points. Name it before it gets obvious.</div>
  <button class="bigbtn" id="startBtn" type="button">Start hunt</button>
</div>

<div class="overlay hidden" id="results">
  <h1>HUNTED</h1>
  <div class="score">TOTAL <b id="finalscore">0</b> / 800</div>
  <div class="bestline" id="bestline"></div>
  <button class="bigbtn" id="againBtn" type="button">Play again</button>
</div>

<script>
'use strict';
/* HARMONIC HUNTER — guess the mystery shape from its epicycle reconstruction.
   Shared DFT core (hand-rolled, no libraries). */

var N = 256;
var PERIOD = 5;       // seconds per full trace
var ROUNDS = 8;

function resampleClosed(pts, n){
  var m = pts.length;
  if(m === 0) return [];
  var segs = new Array(m);
  var total = 0, i;
  for(i = 0; i < m; i++){
    var a = pts[i], b = pts[(i + 1) % m];
    var d = Math.hypot(b[0] - a[0], b[1] - a[1]);
    segs[i] = d; total += d;
  }
  if(total < 1e-9){
    var out0 = [];
    for(i = 0; i < n; i++) out0.push([pts[0][0], pts[0][1]]);
    return out0;
  }
  var out = [];
  var step = total / n;
  var target = 0;
  var segStart = 0;
  for(i = 0; i < m && out.length < n; i++){
    var p = pts[i], q = pts[(i + 1) % m];
    var dd = segs[i];
    while(target <= segStart + dd + 1e-9 && out.length < n){
      var f = dd > 1e-12 ? (target - segStart) / dd : 0;
      out.push([p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f]);
      target += step;
    }
    segStart += dd;
  }
  while(out.length < n) out.push([pts[0][0], pts[0][1]]);
  return out;
}

function dftSorted(seq){
  var n = seq.length, k, j;
  var out = new Array(n);
  for(k = 0; k < n; k++){
    var re = 0, im = 0;
    for(j = 0; j < n; j++){
      var a = 2 * Math.PI * k * j / n;
      var ca = Math.cos(a), sa = Math.sin(a);
      var x = seq[j][0], y = seq[j][1];
      re += x * ca + y * sa;
      im += -x * sa + y * ca;
    }
    var amp = Math.hypot(re, im) / n;
    out[k] = { k: k > n / 2 ? k - n : k, re: re, im: im, amp: amp };
  }
  out.sort(function(h1, h2){ return h2.amp - h1.amp; });
  return out;
}

function tipAt(t, harm, K){
  var x = 0, y = 0;
  var lim = Math.min(K, harm.length);
  for(var i = 0; i < lim; i++){
    var h = harm[i];
    var a = 2 * Math.PI * h.k * t / N;
    var ca = Math.cos(a), sa = Math.sin(a);
    x += (h.re * ca - h.im * sa) / N;
    y += (h.re * sa + h.im * ca) / N;
  }
  return [x, y];
}

/* ---------- procedural shape pool (math coords, y up, ~[-1.2, 1.2]) ---------- */

function heartPts(){
  var P = [], i, t;
  for(i = 0; i < 220; i++){
    t = i / 220 * 2 * Math.PI;
    var x = 16 * Math.pow(Math.sin(t), 3);
    var y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    P.push([x / 17, y / 17]);
  }
  return P;
}
function starPts(){
  var P = [], i, a, rad;
  for(i = 0; i < 10; i++){
    rad = (i % 2 === 0) ? 1 : 0.42;
    a = -Math.PI / 2 + i * Math.PI / 5;
    P.push([Math.cos(a) * rad, Math.sin(a) * rad]);
  }
  return P;
}
function catPts(){
  var D = Math.PI / 180;
  var P = [], a;
  function ept(deg, rr){ return [Math.cos(deg * D) * rr, Math.sin(deg * D) * rr * 0.95]; }
  function tip(deg){ return [Math.cos(deg * D) * 1.5, Math.sin(deg * D) * 1.5 * 0.95]; }
  P.push(ept(140, 1));
  P.push(tip(117));
  P.push(ept(95, 1));
  for(a = 95; a >= 85; a -= 2) P.push(ept(a, 1));
  P.push(tip(63));
  P.push(ept(40, 1));
  for(a = 40; a >= -220; a -= 4) P.push(ept(a, 1));
  return P;
}
function fishPts(){
  var P = [], i, th;
  P.push([-1.35, 0]);
  P.push([-0.55, 0.42]);
  for(i = 0; i <= 80; i++){
    th = (136 - i / 80 * 272) * Math.PI / 180;
    P.push([0.1 + 0.9 * Math.cos(th), 0.55 * Math.sin(th)]);
  }
  P.push([-0.55, -0.42]);
  return P;
}
function spiralPts(){
  var P = [], i, th, r;
  for(i = 0; i < 200; i++){
    th = i / 200 * 4 * Math.PI;
    r = 0.15 + 0.85 * (th / (4 * Math.PI));
    P.push([r * Math.cos(th), r * Math.sin(th)]);
  }
  return P;
}
function flowerPts(){
  var P = [], i, th, r;
  for(i = 0; i < 180; i++){
    th = i / 180 * 2 * Math.PI;
    r = 0.55 + 0.45 * Math.cos(6 * th);
    P.push([r * Math.cos(th), r * Math.sin(th)]);
  }
  return P;
}
function moonPts(){
  var P = [], i, th;
  for(i = 0; i <= 100; i++){
    th = (60 + i / 100 * 240) * Math.PI / 180;
    P.push([Math.cos(th), Math.sin(th)]);
  }
  for(i = 0; i <= 80; i++){
    th = (-86.7 + i / 80 * 173.4) * Math.PI / 180;
    P.push([0.45 + 0.8676 * Math.cos(th), 0.8676 * Math.sin(th)]);
  }
  return P;
}
function lightningPts(){
  return [[-0.05, 1.0], [0.55, 1.0], [0.05, 0.05], [0.45, 0.05],
          [-0.35, -1.0], [-0.05, -0.05], [-0.4, -0.05]];
}
function ghostPts(){
  var P = [], i, th;
  for(i = 0; i <= 60; i++){
    th = i / 60 * Math.PI;
    P.push([0.9 * Math.cos(th), -0.1 + 0.9 * Math.sin(th)]);
  }
  var zig = [[-0.7, -0.75], [-0.45, -0.35], [-0.2, -0.75], [0.05, -0.35],
             [0.3, -0.75], [0.55, -0.35], [0.75, -0.7]];
  for(i = 0; i < zig.length; i++) P.push(zig[i]);
  return P;
}
function crownPts(){
  return [[-0.9, -0.6], [-0.9, 0.2], [-0.6, 0.9], [-0.3, 0.35], [0, 1.0],
          [0.3, 0.35], [0.6, 0.9], [0.9, 0.2], [0.9, -0.6]];
}
function leafPts(){
  var P = [], i, t, x, y;
  for(i = 0; i <= 60; i++){
    t = i / 60; x = -0.9 + 2.0 * t; y = 0.75 * 4 * t * (1 - t);
    P.push([x, y]);
  }
  for(i = 1; i <= 60; i++){
    t = i / 60; x = 1.1 - 2.0 * t; y = -0.75 * 4 * t * (1 - t);
    P.push([x, y]);
  }
  return P;
}
function dropPts(){
  var P = [], i, th;
  for(i = 0; i <= 90; i++){
    th = (135 + i / 90 * 270) * Math.PI / 180;
    P.push([0.75 * Math.cos(th), -0.25 + 0.75 * Math.sin(th)]);
  }
  P.push([0, 1.05]);
  return P;
}

var SHAPES = [
  { id: 'heart',     name: 'Heart',     pts: heartPts },
  { id: 'star',      name: 'Star',      pts: starPts },
  { id: 'cat',       name: 'Cat',       pts: catPts },
  { id: 'fish',      name: 'Fish',      pts: fishPts },
  { id: 'spiral',    name: 'Spiral',    pts: spiralPts },
  { id: 'flower',    name: 'Flower',    pts: flowerPts },
  { id: 'moon',      name: 'Moon',      pts: moonPts },
  { id: 'lightning', name: 'Lightning', pts: lightningPts },
  { id: 'ghost',     name: 'Ghost',     pts: ghostPts },
  { id: 'crown',     name: 'Crown',     pts: crownPts },
  { id: 'leaf',      name: 'Leaf',      pts: leafPts },
  { id: 'drop',      name: 'Drop',      pts: dropPts }
];

/* ---------- dom ---------- */

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var trail = document.createElement('canvas');
var tctx = trail.getContext('2d');
var roundread = document.getElementById('roundread');
var scoreread = document.getElementById('scoreread');
var kread = document.getElementById('kread');
var worth = document.getElementById('worth');
var sharpenBtn = document.getElementById('sharpen');
var optsEl = document.getElementById('opts');
var banner = document.getElementById('banner');
var verdictEl = document.getElementById('verdict');
var detailEl = document.getElementById('detail');
var nextBtn = document.getElementById('nextBtn');
var titleEl = document.getElementById('title');
var resultsEl = document.getElementById('results');
var finalscore = document.getElementById('finalscore');
var bestline = document.getElementById('bestline');

var W = 0, H = 0, DPR = 1;

var state = {
  screen: 'title',   // title | play | results
  round: 0,
  total: 0,
  order: [],
  harm: null,
  K: 4,              // target K
  dispK: 4,          // animated K
  sharpens: 0,
  guessed: false,
  t: 0,
  prevTip: null,
  prevT: 0,
  best: loadBest()
};

function loadBest(){
  try{
    var v = window.localStorage.getItem('bb-proto-harmonic-hunter-best');
    if(v === null) return 0;
    var f = parseInt(v, 10);
    return isFinite(f) && f > 0 ? f : 0;
  }catch(e){ return 0; }
}
function saveBest(v){
  try{ window.localStorage.setItem('bb-proto-harmonic-hunter-best', String(v)); }catch(e){}
}

function shuffle(a){
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ---------- sizing ---------- */

function resize(){
  var r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  trail.width = cv.width;
  trail.height = cv.height;
  tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if(state.screen === 'play') startRound(true); // refit current shape
}
window.addEventListener('resize', resize);

/* ---------- rounds ---------- */

function roundScore(){
  return Math.max(10, 100 - 10 * state.sharpens);
}

function startRound(keepOrder){
  if(!keepOrder){
    state.order = shuffle(SHAPES.slice()).slice(0, ROUNDS);
  }
  var sh = state.order[state.round];
  var raw = sh.pts();
  var s = Math.min(W, H) * 0.34, cxp = W / 2, cyp = H / 2;
  var pts = raw.map(function(p){ return [cxp + p[0] * s, cyp - p[1] * s]; });
  state.harm = dftSorted(resampleClosed(pts, N));
  state.K = 4;
  state.dispK = 4;
  state.sharpens = 0;
  state.guessed = false;
  state.t = 0;
  clearTrail();

  // 4 options: correct + 3 distractors
  var others = shuffle(SHAPES.filter(function(o){ return o.id !== sh.id; })).slice(0, 3);
  var opts = shuffle([sh].concat(others));
  optsEl.innerHTML = '';
  opts.forEach(function(o){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.textContent = o.name;
    b.setAttribute('data-id', o.id);
    b.addEventListener('click', function(){ guess(o.id, b); });
    optsEl.appendChild(b);
  });

  banner.classList.remove('show');
  sharpenBtn.disabled = false;
  updateHud();
}

function updateHud(){
  roundread.textContent = (state.round + 1) + '/' + ROUNDS;
  scoreread.textContent = String(state.total);
  kread.textContent = 'K = ' + Math.round(state.dispK);
  worth.innerHTML = 'worth <b>' + roundScore() + '</b>';
}

function clearTrail(){
  state.prevT = 0;
  state.prevTip = null;
  tctx.clearRect(0, 0, W, H);
}

function guess(id, btn){
  if(state.guessed || state.screen !== 'play') return;
  state.guessed = true;
  var sh = state.order[state.round];
  var correct = (id === sh.id);
  var pts = correct ? roundScore() : 0;
  state.total += pts;

  // reveal: animate up to a clear K
  state.K = 64;
  clearTrail();

  var btns = optsEl.querySelectorAll('.opt');
  for(var i = 0; i < btns.length; i++){
    var b = btns[i];
    b.disabled = true;
    if(b.getAttribute('data-id') === sh.id) b.classList.add('right');
    else if(b === btn) b.classList.add('wrong');
    else b.classList.add('dim');
  }
  sharpenBtn.disabled = true;

  verdictEl.textContent = correct ? 'Correct! +' + pts : 'It was ' + sh.name;
  verdictEl.className = 'verdict ' + (correct ? 'good' : 'bad');
  detailEl.textContent = correct
    ? (state.sharpens === 0 ? 'Nailed it at maximum blur.' : 'Solved after ' + state.sharpens + ' sharpen' + (state.sharpens === 1 ? '' : 's') + '.')
    : 'No points this round.';
  nextBtn.textContent = (state.round + 1 < ROUNDS) ? 'Next shape' : 'See results';
  banner.classList.add('show');
  updateHud();
}

function next(){
  state.round++;
  if(state.round < ROUNDS){
    startRound(true);
  }else{
    showResults();
  }
}

function showResults(){
  state.screen = 'results';
  var isBest = state.total > state.best;
  if(isBest){ state.best = state.total; saveBest(state.total); }
  finalscore.textContent = String(state.total);
  bestline.innerHTML = 'best: <b>' + state.best + '</b>' + (isBest ? ' — new record!' : '');
  resultsEl.classList.remove('hidden');
}

function startGame(){
  state.screen = 'play';
  state.round = 0;
  state.total = 0;
  titleEl.classList.add('hidden');
  resultsEl.classList.add('hidden');
  startRound(false);
}

/* ---------- buttons ---------- */

sharpenBtn.addEventListener('click', function(){
  if(state.guessed || state.screen !== 'play' || state.K >= 96) return;
  state.sharpens++;
  state.K = Math.min(96, state.K + 4);
  clearTrail();
  if(state.K >= 96) sharpenBtn.disabled = true;
  updateHud();
});
nextBtn.addEventListener('click', next);
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);

/* ---------- test hook ---------- */
window.__test = {
  answer: function(){ return state.order[state.round].id; },
  round: function(){ return state.round; },
  total: function(){ return state.total; },
  K: function(){ return Math.round(state.dispK); },
  screen: function(){ return state.screen; },
  sharpens: function(){ return state.sharpens; }
};

/* ---------- render loop ---------- */

function drawFrame(dt){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0, 0, W, H);
  if(!state.harm) return;
  ctx.drawImage(trail, 0, 0, W, H);

  // ease displayed K toward target K (the sharpen/reveal animation)
  var diff = state.K - state.dispK;
  if(Math.abs(diff) < 0.05){
    state.dispK = state.K;
  }else{
    state.dispK += diff * Math.min(1, dt * 5);
  }
  var K = Math.max(1, Math.round(state.dispK));
  var harm = state.harm;

  var dc = null, i;
  for(i = 0; i < harm.length; i++){
    if(harm[i].k === 0){ dc = harm[i]; break; }
  }
  var cx = dc.re / N, cy = dc.im / N;
  ctx.lineWidth = 1;

  for(i = 0; i < K && i < harm.length; i++){
    var h = harm[i];
    if(h.k === 0) continue;
    var r = h.amp;
    var a = 2 * Math.PI * h.k * state.t / N;
    var ca = Math.cos(a), sa = Math.sin(a);
    var dx = (h.re * ca - h.im * sa) / N;
    var dy = (h.re * sa + h.im * ca) / N;
    if(r > 0.35){
      ctx.strokeStyle = 'rgba(0,229,255,0.22)';
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, 2 * Math.PI);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(0,229,255,0.45)';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + dx, cy + dy);
    ctx.stroke();
    cx += dx; cy += dy;
  }

  // bright tip
  ctx.fillStyle = '#ff4fd8';
  ctx.shadowColor = '#ff4fd8';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, 2 * Math.PI);
  ctx.fill();
  ctx.shadowBlur = 0;

  // fading trail of Fourier tips only
  if(state.prevTip){
    tctx.globalCompositeOperation = 'destination-out';
    tctx.fillStyle = 'rgba(0,0,0,' + (1 - Math.exp(-0.15 * dt)) + ')';
    tctx.fillRect(0, 0, W, H);
    tctx.globalCompositeOperation = 'source-over';
    tctx.strokeStyle = 'rgba(0,229,255,0.9)';
    tctx.lineWidth = 2.5;
    tctx.lineCap = 'round';
    tctx.lineJoin = 'round';
    tctx.beginPath();
    tctx.moveTo(state.prevTip[0], state.prevTip[1]);
    var endT = state.t < state.prevT ? state.t + N : state.t;
    var steps = Math.max(1, Math.ceil((endT - state.prevT) * 4));
    for(var j = 1; j <= steps; j++){
      var p = tipAt(state.prevT + (endT - state.prevT) * j / steps, harm, K);
      tctx.lineTo(p[0], p[1]);
    }
    tctx.stroke();
  }
  state.prevTip = [cx, cy];
  state.prevT = state.t;

  // K readout follows the animation
  var kr = Math.round(state.dispK);
  if(kread.textContent !== 'K = ' + kr) kread.textContent = 'K = ' + kr;
}

var lastT = 0;
function frame(now){
  var dt = lastT ? (now - lastT) / 1000 : 0.016;
  lastT = now;
  if(dt > 0.05) dt = 0.05;
  if(state.screen === 'play' && state.harm){
    state.t += dt / PERIOD * N;
    if(state.t >= N) state.t -= N;
  }
  drawFrame(dt);
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
