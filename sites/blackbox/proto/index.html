<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ORBITAL LAB — prototypes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    background: #0a0a12;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(34,211,238,.07), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(232,121,249,.06), transparent 45%);
    color: #e8e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 28px 18px 60px;
    touch-action: manipulation;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 8px; }
  .kicker { font-size: 12px; letter-spacing: 4px; text-transform: uppercase; color: #e879f9; margin-bottom: 10px; }
  h1 { font-size: 38px; font-weight: 800; letter-spacing: 5px; margin-bottom: 10px;
    background: linear-gradient(100deg, #e879f9, #22d3ee);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: #9a9ab0; font-size: 15px; line-height: 1.5; margin-bottom: 28px; text-align: center; }
  .back { display: inline-block; margin-bottom: 18px; color: #8a8aa5; font-size: 14px; text-decoration: none; }
  .card { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.09);
    border-radius: 16px; padding: 20px; margin-bottom: 14px; }
  .card h2 { font-size: 21px; letter-spacing: 2px; margin-bottom: 6px; }
  .card h2 .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 10px; }
  .card p.hook { color: #b9b9d0; font-size: 14.5px; line-height: 1.5; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .play { display: inline-block; text-decoration: none; color: #06121a; font-weight: 700;
    background: linear-gradient(100deg, #e879f9, #f0abfc);
    padding: 11px 26px; border-radius: 999px; font-size: 15px; touch-action: manipulation; }
  .tag { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #e879f9;
    border: 1px solid rgba(232,121,249,.4); border-radius: 999px; padding: 4px 10px; }
  footer { text-align: center; color: #55556e; font-size: 12.5px; margin-top: 34px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">prototype lab</div>
    <h1>ORBITAL LAB</h1>
    <p class="sub">Five rough game prototypes built on ORBITAL's Fourier-epicycle engine.<br>Unpolished. Experimental. Tell Kit which ones deserve to live.</p>
  </header>
  <a class="back" href="../index.html">&larr; back to BLACKBOX</a>
  <div id="cards"></div>
  <footer>No libraries. No frameworks. Every algorithm hand-rolled.<br>Prototypes — expect rough edges.</footer>
</div>
<script>
var GAMES = [
  { slug: "trace-race", name: "TRACE RACE", color: "#22d3ee",
    hook: "Redraw the target shape freehand. Scored on pure accuracy — one attempt per round." },
  { slug: "harmonic-hunter", name: "HARMONIC HUNTER", color: "#e879f9",
    hook: "Guess the shape from a blobby low-circle reconstruction. Sharpening costs points." },
  { slug: "epicycle-golf", name: "EPICYCLE GOLF", color: "#a3e635",
    hook: "Draw a loop; the ball flies its smoothed reconstruction. Anticipate the error, sink the putt." },
  { slug: "circle-budget", name: "CIRCLE BUDGET", color: "#fb923c",
    hook: "Match the target with as few Fourier circles as possible. Fewest circles wins." },
  { slug: "spectrum-duel", name: "SPECTRUM DUEL", color: "#67e8f9",
    hook: "You vs the house: draw the prompt better than its reconstruction. First to 3 takes it." },
];
var host = document.getElementById("cards");
GAMES.forEach(function(g){
  var el = document.createElement("div");
  el.className = "card";
  el.innerHTML =
    '<h2><span class="dot" style="background:' + g.color + ';box-shadow:0 0 8px ' + g.color + '"></span>' + g.name + "</h2>" +
    '<p class="hook">' + g.hook + "</p>" +
    '<div class="row"><a class="play" href="' + g.slug + '.html">Play prototype</a>' +
    '<span class="tag">prototype</span></div>";
  host.appendChild(el);
});
</script>
</body>
</html>
