<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SPECTRUM DUEL — Blackbox Arcade</title>
<style>
  :root{ --bg:#0a0a12; --cyan:#00e5ff; --magenta:#ff4fd8; --dim:#8a8aa3; --panel:#12121c; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:#e8e8f2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;overscroll-behavior:none;}
  #app{display:flex;flex-direction:column;height:100%;height:100dvh;}
  header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);
    border-bottom:1px solid #1e1e2e;flex:0 0 auto;}
  .brand{font-weight:800;letter-spacing:2px;font-size:14px;color:var(--cyan);
    text-shadow:0 0 12px rgba(0,229,255,.6);}
  #score{margin-left:auto;font-size:13px;font-weight:800;letter-spacing:1px;white-space:nowrap;}
  #score .you{color:var(--cyan);} #score .rv{color:var(--magenta);}
  #roundlab{font-size:12px;color:var(--dim);font-weight:700;white-space:nowrap;}
  #wrap{position:relative;flex:1 1 auto;min-height:0;}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #banner{position:absolute;left:0;right:0;top:10px;text-align:center;pointer-events:none;z-index:2;padding:0 12px;}
  #banner .big{font-size:20px;font-weight:800;letter-spacing:2px;}
  #banner .big .hl{color:var(--cyan);}
  #banner .small{font-size:13px;color:var(--dim);margin-top:4px;font-weight:600;}
  #overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:24px;background:rgba(10,10,18,.9);gap:12px;}
  #overlay.hidden{display:none;}
  #overlay h1{margin:0;font-size:38px;font-weight:900;letter-spacing:6px;color:var(--cyan);
    text-shadow:0 0 24px rgba(0,229,255,.7);}
  #overlay h1.lose{color:var(--magenta);text-shadow:0 0 24px rgba(255,79,216,.7);}
  #overlay .how{font-size:15px;color:#c9c9dd;max-width:320px;line-height:1.55;}
  #overlay .result{font-size:22px;font-weight:800;letter-spacing:1px;}
  #overlay .detail{font-size:14px;color:var(--dim);line-height:1.7;}
  #overlay .detail b{color:#e8e8f2;}
  #overlay .detail .you{color:var(--cyan);font-weight:800;}
  #overlay .detail .rv{color:var(--magenta);font-weight:800;}
  .bigbtn{touch-action:manipulation;font-family:inherit;font-size:18px;font-weight:800;
    padding:14px 44px;border-radius:14px;background:transparent;border:2px solid var(--cyan);
    color:var(--cyan);box-shadow:0 0 18px rgba(0,229,255,.35);min-height:56px;cursor:pointer;}
  .bigbtn:active{transform:scale(.96);}
  footer{flex:0 0 auto;background:var(--panel);border-top:1px solid #1e1e2e;
    padding:8px 12px 10px;text-align:center;}
  #bestline{font-size:12px;color:var(--dim);margin-bottom:2px;min-height:16px;}
  #bestline b{color:var(--cyan);}
  footer .reveal{font-size:10.5px;color:#55556e;line-height:1.4;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">SPECTRUM DUEL</div>
    <div id="roundlab"></div>
    <div id="score"><span class="you">YOU 0</span> &ndash; <span class="rv">0 RIVAL</span></div>
  </header>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="banner"><div class="big"></div><div class="small"></div></div>
    <div id="overlay">
      <h1>SPECTRUM<br>DUEL</h1>
      <div class="how">Draw the named shape. Your trace duels the house's at 24 harmonics.
        Lowest error wins the round &mdash; first to 3 takes the duel.</div>
      <button class="bigbtn" id="startBtn" type="button">Start duel</button>
    </div>
  </div>
  <footer>
    <div id="bestline"></div>
    <div class="reveal">Discrete Fourier Transform &mdash; any closed curve is a sum of spinning circles.</div>
  </footer>
</div>
<script>
'use strict';
/* SPECTRUM DUEL — you vs the house. Draw the named shape; your normalized RMS
   error vs the canonical template duels the rival's jittered K=24 reconstruction.
   Shared hand-rolled DFT core. No libraries. */

/* ---------- shared DFT core ---------- */
var N = 256;
function resampleClosed(pts, n){
  var m = pts.length; if(m === 0) return [];
  var segs = new Array(m), total = 0, i;
  for(i = 0; i < m; i++){
    var a = pts[i], b = pts[(i+1)%m];
    var d = Math.hypot(b[0]-a[0], b[1]-a[1]); segs[i] = d; total += d;
  }
  if(total < 1e-9){ var o=[]; for(i=0;i<n;i++) o.push([pts[0][0],pts[0][1]]); return o; }
  var out=[], step=total/n, target=0, segStart=0;
  for(i=0; i<m && out.length<n; i++){
    var p=pts[i], q=pts[(i+1)%m], dd=segs[i];
    while(target <= segStart+dd+1e-9 && out.length<n){
      var f = dd>1e-12 ? (target-segStart)/dd : 0;
      out.push([p[0]+(q[0]-p[0])*f, p[1]+(q[1]-p[1])*f]); target += step;
    }
    segStart += dd;
  }
  while(out.length<n) out.push([pts[0][0],pts[0][1]]);
  return out;
}
function dftSorted(seq){
  var n=seq.length, k, j, out=new Array(n);
  for(k=0;k<n;k++){ var re=0, im=0;
    for(j=0;j<n;j++){ var a=2*Math.PI*k*j/n, ca=Math.cos(a), sa=Math.sin(a);
      var x=seq[j][0], y=seq[j][1];
      re += x*ca + y*sa; im += -x*sa + y*ca; }
    out[k]={ k: k>n/2 ? k-n : k, re:re, im:im, amp:Math.hypot(re,im)/n };
  }
  out.sort(function(h1,h2){ return h2.amp-h1.amp; });
  return out;
}
function tipAt(t, harm, K){
  var x=0, y=0, lim=Math.min(K,harm.length);
  for(var i=0;i<lim;i++){ var h=harm[i], a=2*Math.PI*h.k*t/N;
    var ca=Math.cos(a), sa=Math.sin(a);
    x += (h.re*ca - h.im*sa)/N; y += (h.re*sa + h.im*ca)/N; }
  return [x,y];
}
function normalize(pts){
  var cx=0, cy=0, i, minx=1e18, maxx=-1e18, miny=1e18, maxy=-1e18;
  for(i=0;i<pts.length;i++){ cx+=pts[i][0]; cy+=pts[i][1]; }
  cx/=pts.length; cy/=pts.length;
  for(i=0;i<pts.length;i++){
    var x=pts[i][0]-cx, y=pts[i][1]-cy;
    if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y;
  }
  var s=Math.max(maxx-minx, maxy-miny) || 1;
  var out=new Array(pts.length);
  for(i=0;i<pts.length;i++) out[i]=[(pts[i][0]-cx)/s, (pts[i][1]-cy)/s];
  return out;
}
/* min RMS over all cyclic shifts and both winding directions (drawing can
   start anywhere and go either way) */
function rmsAligned(a, b){
  var best=Infinity, rev, sh, j, s, idx, dx, dy;
  for(rev=0;rev<2;rev++){
    for(sh=0;sh<N;sh++){
      s=0;
      for(j=0;j<N;j++){
        idx=(j+sh)%N;
        if(rev===0){ dx=a[j][0]-b[idx][0]; dy=a[j][1]-b[idx][1]; }
        else { var bi=(N-idx)%N; dx=a[j][0]-b[bi][0]; dy=a[j][1]-b[bi][1]; }
        s+=dx*dx+dy*dy;
      }
      var r=Math.sqrt(s/N);
      if(r<best) best=r;
    }
  }
  return best;
}
function gauss(){
  var u=0, v=0;
  while(u===0) u=Math.random();
  while(v===0) v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

/* ---------- canonical shape templates (procedural, closed loops) ---------- */
function genHeart(){ var P=[],i,t;
  for(i=0;i<200;i++){ t=i/200*2*Math.PI;
    var x=16*Math.pow(Math.sin(t),3);
    var y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    P.push([x/17,-y/17]); } return P; }
function genStar(){ var P=[],i,a,rad;
  for(i=0;i<10;i++){ rad=(i%2===0)?1:0.42; a=-Math.PI/2+i*Math.PI/5;
    P.push([Math.cos(a)*rad,-Math.sin(a)*rad]); } return P; }
function genCat(){ var P=[],D=Math.PI/180,a;
  var ept=function(dg,rr){ return [Math.cos(dg*D)*rr, -Math.sin(dg*D)*rr*0.95]; };
  var tip=function(dg){ return [Math.cos(dg*D)*1.5, -Math.sin(dg*D)*1.5*0.95]; };
  P.push(ept(140,1)); P.push(tip(117)); P.push(ept(95,1));
  for(a=95;a>=85;a-=2) P.push(ept(a,1));
  P.push(tip(63)); P.push(ept(40,1));
  for(a=40;a>=-220;a-=4) P.push(ept(a,1)); return P; }
function genFish(){ var P=[[-1.15,0]],d,a;
  for(d=150;d>=-150;d-=4){ a=d*Math.PI/180;
    P.push([0.15+0.75*Math.cos(a), 0.5*Math.sin(a)]); }
  P.push([-1.15,0]); return P; }
function genFlower(){ var P=[],i,t,r;
  for(i=0;i<180;i++){ t=i/180*2*Math.PI; r=0.55+0.38*Math.cos(6*t);
    P.push([r*Math.cos(t), r*Math.sin(t)]); } return P; }
function genMoon(){ var P=[],d,a;
  for(d=105;d<=255;d+=3){ a=d*Math.PI/180; P.push([Math.cos(a), Math.sin(a)]); }
  for(d=255;d>=105;d-=3){ a=d*Math.PI/180;
    P.push([0.38+0.82*Math.cos(a), 0.82*Math.sin(a)]); }
  return P; }
function genCrown(){
  return [[-1,-0.55],[-1,0.15],[-0.66,0.62],[-0.33,0.08],[0,0.72],
          [0.33,0.08],[0.66,0.62],[1,0.15],[1,-0.55]]; }
function genLeaf(){ var P=[],i,t;
  for(i=0;i<=80;i++){ t=i/80; P.push([-1+2*t, 0.62*Math.sin(Math.PI*t)]); }
  for(i=1;i<80;i++){ t=i/80; P.push([1-2*t, -0.62*Math.sin(Math.PI*t)]); }
  return P; }
function genGhost(){ var P=[],d,a,i;
  for(d=180;d>=0;d-=4){ a=d*Math.PI/180;
    P.push([0.85*Math.cos(a), 0.9*Math.sin(a)+0.1]); }
  for(i=0;i<60;i++){ var t=i/60;
    P.push([0.85-1.7*t, 0.1-0.28*Math.abs(Math.sin(t*Math.PI*3))]); }
  return P; }
function genLightning(){
  return [[0.25,1],[-0.35,0.12],[-0.02,0.12],[-0.25,-1],[0.35,-0.1],[0.02,-0.1]]; }

var SHAPES = [
  {name:'HEART', gen:genHeart}, {name:'STAR', gen:genStar},
  {name:'CAT', gen:genCat}, {name:'FISH', gen:genFish},
  {name:'FLOWER', gen:genFlower}, {name:'MOON', gen:genMoon},
  {name:'CROWN', gen:genCrown}, {name:'LEAF', gen:genLeaf},
  {name:'GHOST', gen:genGhost}, {name:'LIGHTNING', gen:genLightning}
];
/* precompute normalized 256-pt templates + their DFTs */
SHAPES.forEach(function(s){
  s.pts = normalize(resampleClosed(s.gen(), N));
  s.harm = dftSorted(s.pts);
});

/* ---------- dom ---------- */
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var overlay=document.getElementById('overlay');
var bannerBig=document.querySelector('#banner .big');
var bannerSmall=document.querySelector('#banner .small');
var scoreEl=document.getElementById('score');
var roundLab=document.getElementById('roundlab');
var bestLine=document.getElementById('bestline');
var W=0, H=0, DPR=1;

/* ---------- game state ---------- */
var RIVAL_K=24, PLAYER_K=24, RACE_DUR=3.0, MAX_ROUNDS=5, WIN_SCORE=3;
var screen='title';           // title | draw | race | roundEnd | duelEnd
var order=[], round=0, you=0, rival=0;
var cur=null;                 // current shape object
var raw=[];                   // player stroke (pixels)
var playerNorm=null, playerRecon=null, playerRMS=NaN;
var rivalPts=null, rivalRMS=NaN, rivalSigma=0;
var raceT=0;
var lastRace=null;            // frozen for result backdrop
var drawing=false, activePointer=null;

function loadBest(){
  try{ var v=JSON.parse(window.localStorage.getItem('bb-proto-spectrum-duel-best'));
    if(v && typeof v.w==='number') return v; }catch(e){}
  return null;
}
function saveBest(w,l){
  try{ window.localStorage.setItem('bb-proto-spectrum-duel-best', JSON.stringify({w:w,l:l})); }catch(e){}
}
function renderBest(){
  var b=loadBest();
  bestLine.innerHTML = b ? ('Best duel: <b>'+b.w+'&ndash;'+b.l+'</b>') : '';
}
function updateHUD(){
  scoreEl.innerHTML='<span class="you">YOU '+you+'</span> &ndash; <span class="rv">'+rival+' RIVAL</span>';
  roundLab.textContent = (screen==='title') ? '' : ('ROUND '+Math.min(round,MAX_ROUNDS)+'/'+MAX_ROUNDS);
}
function setBanner(big, small){
  bannerBig.innerHTML=big||''; bannerSmall.innerHTML=small||'';
}
function showOverlay(html){ overlay.innerHTML=html; overlay.classList.remove('hidden'); wireOverlay(); }
function hideOverlay(){ overlay.classList.add('hidden'); }

function wireOverlay(){
  var st=overlay.querySelector('#startBtn');
  if(st) st.addEventListener('click', startDuel);
  var nx=overlay.querySelector('#nextBtn');
  if(nx) nx.addEventListener('click', nextRound);
  var ag=overlay.querySelector('#againBtn');
  if(ag) ag.addEventListener('click', startDuel);
}

/* ---------- flow ---------- */
function shuffled(arr){
  var a=arr.slice(), i, j, t;
  for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function startDuel(){
  order=shuffled(SHAPES).slice(0, MAX_ROUNDS);
  round=1; you=0; rival=0;
  hideOverlay(); updateHUD(); showDraw();
}
function showDraw(){
  screen='draw'; cur=order[round-1]; raw=[];
  setBanner('ROUND '+round+' &mdash; draw a <span class="hl">'+cur.name+'</span>',
            'One loop. Lift your finger to lock it in.');
  updateHUD();
}
function submitDrawing(pts){
  if(screen!=='draw') return;
  var length=0, i;
  for(i=1;i<pts.length;i++) length+=Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
  if(pts.length<3 || length<60){
    setBanner('ROUND '+round+' &mdash; draw a <span class="hl">'+cur.name+'</span>',
              'Too small &mdash; draw a bigger loop.');
    raw=[]; return;
  }
  /* player score: normalized drawing vs normalized template, phase-aligned */
  playerNorm=normalize(resampleClosed(pts, N));
  var ph=dftSorted(playerNorm);
  playerRMS=rmsAligned(playerNorm, cur.pts);
  playerRecon=new Array(N);
  for(i=0;i<N;i++) playerRecon[i]=tipAt(i, ph, PLAYER_K);
  /* rival: K=24 reconstruction of the template + Gaussian jitter */
  rivalSigma=0.035+Math.random()*0.04;
  rivalPts=new Array(N);
  var s=0;
  for(i=0;i<N;i++){
    var p=tipAt(i, cur.harm, RIVAL_K);
    var jx=p[0]+gauss()*rivalSigma, jy=p[1]+gauss()*rivalSigma;
    rivalPts[i]=[jx,jy];
    var dx=jx-cur.pts[i][0], dy=jy-cur.pts[i][1];
    s+=dx*dx+dy*dy;
  }
  rivalRMS=Math.sqrt(s/N);
  screen='race'; raceT=0;
  setBanner('Racing&hellip;','<span style="color:#00e5ff">YOU</span> vs <span style="color:#ff4fd8">RIVAL</span>');
}
function endRace(){
  lastRace={player:playerRecon, rival:rivalPts, pGhost:playerNorm, rGhost:cur.pts};
  screen='roundEnd';
  var diff=playerRMS-rivalRMS, title, cls, btn;
  if(Math.abs(diff)<0.002){
    title='DEAD HEAT'; cls='';
    btn='<button class="bigbtn" id="nextBtn" type="button">Redraw</button>';
    showOverlay('<h1 class="'+cls+'">'+title+'</h1>'+
      '<div class="detail">You <b>'+playerRMS.toFixed(3)+'</b> &middot; Rival <b>'+rivalRMS.toFixed(3)+'</b><br>'+
      'Too close to call &mdash; draw it again.</div>'+btn);
    setBanner('','');
    return;
  }
  var youWon = diff<0;
  if(youWon) you++; else rival++;
  updateHUD();
  title = youWon ? 'YOU TAKE IT' : 'RIVAL TAKES IT';
  cls = youWon ? '' : 'lose';
  var duelOver = (you>=WIN_SCORE || rival>=WIN_SCORE || round>=MAX_ROUNDS);
  btn='<button class="bigbtn" id="nextBtn" type="button">'+(duelOver?'See results':'Next round')+'</button>';
  showOverlay('<h1 class="'+cls+'">'+title+'</h1>'+
    '<div class="detail"><span class="you">YOU '+playerRMS.toFixed(3)+'</span> &middot; '+
    '<span class="rv">RIVAL '+rivalRMS.toFixed(3)+'</span><br>'+
    'YOU '+you+' &ndash; '+rival+' RIVAL</div>'+btn);
  setBanner('','');
}
function nextRound(){
  hideOverlay();
  if(you>=WIN_SCORE || rival>=WIN_SCORE || round>=MAX_ROUNDS){ showDuelEnd(); return; }
  round++; showDraw();
}
function showDuelEnd(){
  screen='duelEnd';
  var won = you>rival;
  var b=loadBest();
  if(!b || you>b.w || (you===b.w && rival<b.l)){ saveBest(you,rival); }
  renderBest();
  var bb=loadBest();
  showOverlay('<h1 class="'+(won?'':'lose')+'">'+(won?'YOU WIN<br>THE DUEL':'RIVAL WINS<br>THE DUEL')+'</h1>'+
    '<div class="detail">Final: <b>YOU '+you+' &ndash; '+rival+' RIVAL</b><br>'+
    'Best duel: <b>'+bb.w+'&ndash;'+bb.l+'</b></div>'+
    '<button class="bigbtn" id="againBtn" type="button">Play again</button>');
  setBanner('',''); updateHUD();
}

/* ---------- canvas ---------- */
function resize(){
  var r=cv.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1, 2);
  W=Math.max(1,r.width); H=Math.max(1,r.height);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
}
window.addEventListener('resize', resize);

function mapTo(pts, x0,y0,x1,y1){
  var cx=(x0+x1)/2, cy=(y0+y1)/2, s=Math.min(x1-x0,y1-y0)*0.42;
  var out=new Array(pts.length);
  for(var i=0;i<pts.length;i++) out[i]=[cx+pts[i][0]*s, cy+pts[i][1]*s];
  return out;
}
function strokePts(pts, upto, style, width, glow){
  var n=Math.min(pts.length, Math.max(1, Math.floor(upto)));
  ctx.strokeStyle=style; ctx.lineWidth=width;
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(glow){ ctx.shadowColor=style; ctx.shadowBlur=10; }
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(var i=1;i<n;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke(); ctx.shadowBlur=0;
}
function ghostPts(pts){
  ctx.strokeStyle='rgba(232,232,242,0.14)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.stroke();
}
function label(txt, x, color){
  ctx.fillStyle=color; ctx.font='700 13px -apple-system,sans-serif';
  ctx.textAlign='center'; ctx.fillText(txt, x, 26);
}

function drawStroke(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0a0a12'; ctx.fillRect(0,0,W,H);
  if(raw.length>1) strokePts(raw, raw.length, '#00e5ff', 3, true);
}
function drawRace(p){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0a0a12'; ctx.fillRect(0,0,W,H);
  var mid=W/2;
  /* divider */
  ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(mid,0); ctx.lineTo(mid,H); ctx.stroke();
  label('YOU', mid/2, '#00e5ff'); label('RIVAL', mid+mid/2, '#ff4fd8');
  var pad=8, top=34;
  /* player panel */
  var pg=mapTo(playerNorm, pad,top,mid-pad,H-14);
  ghostPts(pg);
  var pr=mapTo(playerRecon, pad,top,mid-pad,H-14);
  strokePts(pr, p*N, '#00e5ff', 2.5, false);
  var pi=pr[Math.min(N-1, Math.floor(p*N))];
  ctx.fillStyle='#00e5ff'; ctx.beginPath(); ctx.arc(pi[0],pi[1],4,0,2*Math.PI); ctx.fill();
  /* rival panel */
  var rg=mapTo(cur.pts, mid+pad,top,W-pad,H-14);
  ghostPts(rg);
  var rr=mapTo(rivalPts, mid+pad,top,W-pad,H-14);
  strokePts(rr, p*N, '#ff4fd8', 2.5, false);
  var ri=rr[Math.min(N-1, Math.floor(p*N))];
  ctx.fillStyle='#ff4fd8'; ctx.beginPath(); ctx.arc(ri[0],ri[1],4,0,2*Math.PI); ctx.fill();
  /* progress */
  ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(0,H-4,W,4);
  ctx.fillStyle='#00e5ff'; ctx.fillRect(0,H-4,W*p,4);
}
function drawBackdrop(){
  /* frozen full traces behind result overlays */
  if(!lastRace) return;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0a0a12'; ctx.fillRect(0,0,W,H);
  var mid=W/2, pad=8, top=34;
  ghostPts(mapTo(lastRace.pGhost, pad,top,mid-pad,H-14));
  strokePts(mapTo(lastRace.player, pad,top,mid-pad,H-14), N, 'rgba(0,229,255,0.8)', 2, false);
  ghostPts(mapTo(lastRace.rGhost, mid+pad,top,W-pad,H-14));
  strokePts(mapTo(lastRace.rival, mid+pad,top,W-pad,H-14), N, 'rgba(255,79,216,0.8)', 2, false);
  label('YOU', mid/2, '#00e5ff'); label('RIVAL', mid+mid/2, '#ff4fd8');
}

var lastT=0;
function frame(now){
  var dt=lastT ? (now-lastT)/1000 : 0.016;
  lastT=now; if(dt>0.05) dt=0.05;
  if(screen==='race'){
    raceT+=dt;
    var p=Math.min(1, raceT/RACE_DUR);
    drawRace(p);
    if(p>=1) endRace();
  }else if(screen==='draw'){
    drawStroke();
  }else if((screen==='roundEnd'||screen==='duelEnd') && lastRace){
    drawBackdrop();
  }
  requestAnimationFrame(frame);
}

/* ---------- pointer drawing ---------- */
function posOf(e){ var r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
cv.addEventListener('pointerdown', function(e){
  if(screen!=='draw' || !e.isPrimary || activePointer!==null) return;
  if(e.button!==0 && e.pointerType==='mouse') return;
  activePointer=e.pointerId; e.preventDefault();
  drawing=true; raw=[];
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  raw.push(posOf(e));
});
cv.addEventListener('pointermove', function(e){
  if(!drawing || e.pointerId!==activePointer) return;
  e.preventDefault();
  var p=posOf(e), last=raw[raw.length-1];
  if(!last || Math.hypot(p[0]-last[0], p[1]-last[1])>2) raw.push(p);
});
function endStroke(e){
  if(!drawing || e.pointerId!==activePointer) return;
  drawing=false; activePointer=null;
  submitDrawing(raw);
}
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', function(e){
  if(!drawing || e.pointerId!==activePointer) return;
  drawing=false; activePointer=null; raw=[];
});

/* ---------- test hook ---------- */
window.__test={
  drawTemplate:function(){
    if(screen!=='draw'||!cur) return false;
    var s=Math.min(W,H)*0.32, cx=W/2, cy=H/2, pts=[];
    for(var i=0;i<cur.pts.length;i+=2)
      pts.push([cx+cur.pts[i][0]*s, cy+cur.pts[i][1]*s]);
    submitDrawing(pts);
    return true;
  },
  state:function(){ return {screen:screen, round:round, you:you, rival:rival,
    playerRMS:playerRMS, rivalRMS:rivalRMS}; }
};

/* ---------- boot ---------- */
resize(); renderBest(); updateHUD(); wireOverlay();
requestAnimationFrame(frame);
</script>
