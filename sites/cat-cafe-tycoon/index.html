<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF4E4">
<meta name="description" content="A little café. A lot of cats. A cozy, self-contained idle café simulation.">
<title>Cat Café Tycoon</title>
<style>
:root{--cream:#fff4e4;
  --paper:#fffaf2;
  --floor:#d9ad7c;
  --wood:#a96f4b;
  --ink:#49332d;
  --muted:#786259;
  --rose:#e9a6a0;
  --sage:#aabf9a;
  --butter:#f2cf76;
  --line:#e9d8c4;
  --green:#526b45;
  --shadow:0 3px 0 #49332d12;
  font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  font-size:16px;
  font-synthesis:none}

*{box-sizing:border-box}
body{margin:0;
  background:#eedcc5}
button,input,textarea,select,[role=button],a{touch-action:manipulation;
  font:inherit}
button,[role=button]{-webkit-tap-highlight-color:transparent;
  cursor:pointer}
button{color:inherit;
  border:0;
  min-height:44px;
  border-radius:14px;
  font-weight:750;
  background:var(--cream);
  padding:10px 14px}
button:disabled{cursor:default;
  opacity:.62}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:3px solid #926e38;
  outline-offset:3px}
button:active:not(:disabled){transform:translateY(2px)}
input,textarea,select{font-size:16px}
svg{overflow:visible}
.icon{width:22px;
  height:22px;
  vertical-align:middle;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex-shrink:0}
.sr-only{position:absolute;
  width:1px;
  height:1px;
  padding:0;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0}

#app{height:100dvh;
  max-width:780px;
  margin:auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--cream);
  box-shadow:0 0 70px #49332d15;
  position:relative;
  padding-top:env(safe-area-inset-top)}
header{height:72px;
  flex:0 0 72px;
  display:flex;
  align-items:center;
  padding:10px 17px;
  gap:10px;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  z-index:2}
.brand{display:flex;
  align-items:center;
  gap:9px;
  flex:1;
  min-width:0}
.brandmark{background:#f1dec8;
  border-radius:15px;
  width:42px;
  height:44px;
  display:grid;
  place-items:center;
  flex-shrink:0}
.brand h1{font-size:22px;
  line-height:1.1;
  letter-spacing:-.6px;
  margin:0}
.brand small{font-size:9px;
  letter-spacing:3px;
  font-weight:800;
  display:block;
  margin-top:5px;
  text-transform:uppercase;
  color:var(--muted)}
.wallet{display:flex;
  gap:5px;
  align-items:center;
  white-space:nowrap;
  font-size:22px;
  font-weight:850;
  letter-spacing:-.6px;
  font-variant-numeric:tabular-nums}
.wallet .icon{color:#a17023;
  fill:#f2cf76;
  width:23px}
#settingsButton{padding:10px;
  background:none;
  width:44px}
.scene-wrap{height:min(36dvh,320px);
  flex:0 0 min(36dvh,320px);
  position:relative;
  overflow:hidden;
  background:#fff0d8}
.scene-wrap>svg{width:100%;
  height:100%;
  display:block;
  overflow:hidden}
.room-selector{position:absolute;
  top:7px;
  left:11px;
  right:11px;
  display:flex;
  justify-content:center;
  gap:5px;
  height:44px;
  z-index:2;
  pointer-events:none}
.room-selector button{pointer-events:auto;
  font-size:11px;
  min-height:44px;
  padding:6px 12px;
  background:#fffaf2e8;
  box-shadow:0 2px 0 #49332d10;
  border:1px solid #ddc8ae}
.room-selector button[aria-pressed=true]{background:#49332d;
  color:var(--cream);
  border-color:var(--ink)}
.room-selector button:disabled{opacity:.75;
  background:#f5e4ccba;
  color:#786259}
.scene-caption{position:absolute;
  bottom:8px;
  left:12px;
  display:flex;
  gap:5px;
  align-items:center;
  font-size:10px;
  font-weight:700;
  background:#fffaf2dc;
  border-radius:20px;
  padding:5px 9px;
  pointer-events:none}
.open-dot{width:6px;
  height:6px;
  border-radius:100%;
  background:#789465}
.scene-time{position:absolute;
  right:12px;
  bottom:9px;
  font-size:10px;
  color:#49332d;
  background:#fffaf2d9;
  border-radius:20px;
  padding:4px 8px}
.pet-hint{position:absolute;
  top:53%;
  left:66%;
  font-size:10px;
  font-weight:800;
  line-height:1.3;
  background:var(--paper);
  padding:7px 9px;
  border-radius:10px;
  box-shadow:var(--shadow);
  pointer-events:none;
  max-width:100px}
.pet-hint:after{content:"";
  position:absolute;
  left:15px;
  bottom:-6px;
  border-width:6px 5px 0;
  border-style:solid;
  border-color:var(--paper) transparent transparent}
.status-strip{height:40px;
  flex:0 0 40px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  border-top:1px solid #e1c3a1;
  border-bottom:1px solid var(--line);
  background:#fcf0df;
  font-size:11px;
  font-weight:750;
  gap:7px}
.status-strip>span,.status-strip>button{display:flex;
  align-items:center;
  gap:5px;
  white-space:nowrap}
.status-strip .icon{width:17px;
  height:17px}
.status-strip>button{background:none;
  padding:0 3px;
  font-size:11px;
  min-height:44px;
  position:relative;
  z-index:1}
.tabs{height:48px;
  flex:0 0 48px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:var(--paper);
  border-bottom:1px solid var(--line);
  padding:0 9px;
  gap:4px}
.tabs button{min-width:0;
  border-radius:0;
  background:transparent;
  font-size:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  position:relative;
  padding:8px 3px;
  min-height:44px;
  color:var(--muted)}
.tabs .icon{width:18px;
  height:18px}
.tabs button[aria-selected=true]{color:var(--ink)}
.tabs button[aria-selected=true]:after{content:"";
  position:absolute;
  bottom:0;
  left:12px;
  right:12px;
  height:3px;
  background:var(--wood);
  border-radius:3px 3px 0 0}
#shop{overflow-y:auto;
  overscroll-behavior:contain;
  flex:1;
  padding:15px 14px calc(32px + env(safe-area-inset-bottom));
  scrollbar-width:thin;
  scrollbar-color:#d9bea1 transparent;
  background:#fcf5eb}
.shop-heading{display:flex;
  align-items:flex-start;
  justify-content:space-between;
  margin:0 0 12px;
  gap:8px}
.shop-heading h2{font-size:23px;
  line-height:1.2;
  letter-spacing:-.7px;
  margin:0 0 4px}
.shop-heading p{font-size:11px;
  margin:0;
  color:var(--muted);
  line-height:1.5}
.pill{display:inline-flex;
  align-items:center;
  gap:4px;
  border-radius:20px;
  background:#eee5d5;
  color:#625345;
  font-size:10px;
  font-weight:800;
  padding:6px 9px;
  white-space:nowrap}
.pill.green{background:#e4ead9;
  color:#506442}
.pill.rare{background:#eee2ee;
  color:#765976}
.goals{display:flex;
  gap:5px;
  margin-bottom:13px}
.goal{flex:1;
  min-width:0;
  font-size:9px;
  background:#f0e7d9;
  color:#6b584a;
  border:1px solid #e6d6c2;
  border-radius:9px;
  padding:7px 4px;
  text-align:center;
  font-weight:700}
.goal.done{background:#e3ead8;
  color:#506442;
  border-color:#c9d5b8}
.card{background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  margin-bottom:9px;
  box-shadow:var(--shadow)}
.cat-card{display:grid;
  grid-template-columns:72px 1fr auto;
  gap:9px;
  align-items:center}
.cat-preview{padding:0;
  background:#f4e7d5;
  border-radius:13px;
  height:78px;
  width:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden}
.cat-preview svg{width:74px;
  height:75px}
.cat-copy{min-width:0}
.cat-copy h3,.upgrade-copy h3{font-size:15px;
  margin:0 0 3px;
  letter-spacing:-.2px}
.cat-copy p,.upgrade-copy p{font-size:10px;
  line-height:1.5;
  margin:2px 0;
  color:var(--muted)}
.cat-copy .personality{font-size:10px;
  color:#8c6555}
.cat-action{text-align:right;
  max-width:98px}
.buy{background:var(--sage);
  box-shadow:0 3px 0 #8ea780;
  font-size:12px;
  min-width:77px;
  padding:8px 10px}
.buy:disabled{background:#e8dfd1;
  box-shadow:0 3px 0 #d8cbb8;
  color:#675b4e;
  opacity:1}
.buy .icon{width:14px;
  height:14px;
  position:relative;
  top:-1px}
.buy.rose{background:var(--rose);
  box-shadow:0 3px 0 #cf8b86}
.minor{font-size:9px;
  color:var(--muted);
  line-height:1.45;
  margin-top:6px}
.requirement{grid-column:2 / 4;
  font-size:10px;
  line-height:1.45;
  color:#856248;
  margin-top:-4px}
.mood-bar{height:4px;
  max-width:115px;
  background:#ebdfcd;
  border-radius:6px;
  overflow:hidden;
  margin:6px 0 3px}
.mood-bar span{height:100%;
  display:block;
  background:var(--sage);
  border-radius:6px}
.section-label{font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--muted);
  margin:19px 0 9px;
  font-weight:800}
.upgrade-card{display:flex;
  align-items:center;
  gap:10px}
.upgrade-icon{width:42px;
  height:48px;
  background:#f3e6d3;
  border-radius:12px;
  display:grid;
  place-items:center;
  flex-shrink:0}
.upgrade-icon .icon{width:26px;
  height:26px}
.upgrade-copy{flex:1}
.upgrade-copy .requirement{font-size:10px;
  margin:3px 0}
.upgrade-card .cat-action{flex-shrink:0}
.stat-grid{display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:12px 0}
.stat-box{padding:13px;
  background:#f3e8d8;
  border-radius:12px;
  font-size:11px;
  color:var(--muted)}
.stat-box strong{display:block;
  font-size:23px;
  color:var(--ink);
  margin-bottom:3px}
.wide{width:100%}
.body-copy{font-size:12px;
  line-height:1.7;
  color:var(--muted);
  margin:7px 0}
.gallery{display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px}
.gallery>div{border-radius:12px;
  background:#f1e4d2;
  text-align:center;
  overflow:hidden}
.gallery svg{width:100%;
  height:48px}
.gallery small{display:block;
  font-size:8px;
  padding-bottom:6px}
.undiscovered{opacity:.4}
.notice{position:absolute;
  top:69px;
  left:50%;
  transform:translateX(-50%);
  z-index:8;
  max-width:90%;
  background:#49332df2;
  color:#fff4e4;
  border-radius:12px;
  padding:10px 15px;
  font-size:12px;
  box-shadow:0 4px 15px #49332d26;
  pointer-events:none;
  text-align:center;
  transition:opacity .2s}
.notice:empty{opacity:0}
.version{position:fixed;
  bottom:calc(4px + env(safe-area-inset-bottom));
  right:8px;
  z-index:5;
  background:#fff4e4e8;
  border:1px solid #e2cdb3;
  border-radius:6px;
  color:#7a6153;
  padding:3px 6px;
  font-size:9px;
  letter-spacing:.25px;
  pointer-events:none}
.save-notice{position:absolute;
  left:10px;
  bottom:5px;
  font-size:10px;
  z-index:4;
  padding:4px 8px;
  min-height:44px;
  background:#f2cf76;
  display:none}
dialog{border:1px solid #e2c9ac;
  border-radius:23px;
  background:var(--paper);
  color:var(--ink);
  padding:22px;
  width:min(92vw,430px);
  max-height:87dvh;
  box-shadow:0 20px 90px #241b3050;
  overscroll-behavior:contain}
dialog::backdrop{background:#3c302b6b;
  backdrop-filter:blur(3px)}
.modal-head{display:flex;
  align-items:center;
  gap:8px;
  justify-content:space-between;
  margin-bottom:8px}
.modal-head h2{font-size:24px;
  letter-spacing:-.7px;
  margin:0}
.close{background:#f0e5d5;
  font-size:23px;
  padding:0;
  width:44px;
  flex-shrink:0}
.modal-body{font-size:13px;
  line-height:1.65}
.setting-row{display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 0;
  border-bottom:1px solid var(--line);
  gap:12px}
.setting-row strong{display:block;
  font-size:13px}
.setting-row small{font-size:11px;
  color:var(--muted)}
.toggle{background:#e7dece;
  min-width:62px;
  font-size:12px}
.toggle[aria-pressed=true]{background:var(--sage)}
.modal-actions{display:flex;
  gap:8px;
  margin-top:14px}
.modal-actions button{flex:1;
  font-size:12px}
.danger{background:#f2d6cd;
  color:#863f38}
.receipt{margin:14px 0}
.receipt>div{display:flex;
  justify-content:space-between;
  gap:12px;
  padding:7px 0;
  font-size:13px;
  border-bottom:1px dashed #e3cfb5}
.receipt>div.total{font-weight:800;
  font-size:18px;
  padding-top:12px}
.welcome-art{margin:4px auto 10px;
  display:block;
  width:115px;
  height:85px}
.import-box{width:100%;
  height:125px;
  resize:vertical;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fffdf8;
  color:var(--ink);
  padding:10px;
  margin-top:10px}
.lock-screen{position:absolute;
  inset:72px 0 0;
  background:#fff4e4ed;
  z-index:7;
  display:grid;
  place-content:center;
  padding:35px;
  text-align:center;
  backdrop-filter:blur(4px)}
.lock-screen[hidden]{display:none}
.lock-screen h2{font-size:23px}
.lock-screen p{font-size:13px;
  line-height:1.7;
  color:var(--muted)}
.empty-note{text-align:center;
  padding:12px;
  font-size:11px;
  color:var(--muted)}
.cat-target{touch-action:manipulation;
  cursor:pointer;
  outline:none}
.cat-target:focus-visible .hitbox{stroke:#936a45;
  stroke-width:3}
.cat-art .breath{transform-origin:0 12px;
  animation:breathe 3s ease-in-out infinite}
.cat-art .tail{transform-origin:28px 13px;
  animation:tail 8s ease-in-out infinite}
.cat-art .sleep-z{animation:zzz 3s ease-in-out infinite}
.steam{animation:steam 2s ease-in-out infinite}
.warm-highlight{animation:warm 1.2s ease-out}
.tilt{animation:tilt .35s ease-out}
.cat-art.stretch .breath{transform:scale(1.17,.78);
  animation:none}
.cat-art.nap .breath{animation-duration:3s}
.cat-art.wander .breath{animation:breathe .7s ease-in-out infinite}
.cat-art.swiping .swipe-paw{animation:swipe .25s ease-out}
.cat-art .swipe-paw{transform-origin:5px 10px}
.twinkle{animation:twinkle 3.5s ease-in-out infinite}
.reduced *{animation:none!important;
  transition:none!important}
.reduced .steam{opacity:.45}
.reduced .sleep-z{opacity:.8}
@keyframes breathe{50%{transform:scale(1.025)}
}
@keyframes tail{0%,89%,100%{transform:rotate(0)}
94%{transform:rotate(-12deg)}
}
@keyframes zzz{0%,100%{opacity:.3;
  transform:translateY(0)}
50%{opacity:.85;
  transform:translateY(-5px)}
}
@keyframes steam{0%{opacity:0;
  transform:translateY(3px)}
30%{opacity:.6}
100%{opacity:0;
  transform:translateY(-12px)}
}
@keyframes warm{0%,35%{filter:drop-shadow(0 0 12px #ffcc65)}
100%{filter:none}
}
@keyframes tilt{50%{transform:rotate(-8deg)}
}
@keyframes swipe{50%{transform:rotate(-65deg)}
}
@keyframes twinkle{50%{opacity:.5}
}
@media(min-width:600px){header{padding:10px 24px}
.brand h1{font-size:24px}
.brand small{font-size:10px}
#shop{padding:18px 24px 35px}
.cat-card{grid-template-columns:88px 1fr auto}
.cat-preview{width:86px;
  height:82px}
.cat-copy h3,.upgrade-copy h3{font-size:17px}
.cat-copy p,.upgrade-copy p{font-size:12px}
.status-strip{padding:0 25px;
  font-size:13px}
.tabs button{font-size:14px}
.shop-heading p{font-size:12px}
.room-selector button{font-size:12px}
.goal{font-size:11px}
.pet-hint{font-size:12px}
.scene-caption,.scene-time{font-size:11px}
}
@media(max-height:650px){.scene-wrap{height:31dvh;
  flex-basis:31dvh}
.pet-hint{top:57%}
header{height:64px;
  flex-basis:64px}
.shop-heading h2{font-size:21px}
}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-paw" viewBox="0 0 24 24"><path d="M7.3 14.4C5 16.4 5.5 20 8 20c1.5 0 2.3-1 4-1s2.5 1 4 1c2.5 0 3-3.6.7-5.6L14 11.7c-1.2-1.2-2.8-1.2-4 0Z"/><ellipse cx="4.5" cy="10" rx="2" ry="2.7"/><ellipse cx="9" cy="5.5" rx="2" ry="2.8"/><ellipse cx="15" cy="5.5" rx="2" ry="2.8"/><ellipse cx="19.5" cy="10" rx="2" ry="2.7"/></symbol>
<symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.7 8.8c-3.9-3-7 3-3.6 3.3 4.6.4 3.2 5.4-1.9 3.1M12 6.5v11"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.8 6.4.9-4.6 4.5 1.1 6.3-5.7-3-5.7 3 1.1-6.3-4.6-4.5 6.4-.9Z"/></symbol>
<symbol id="i-bowl" viewBox="0 0 24 24"><path d="M3 11h18l-2.6 8H5.6Z M6 8l1-2m5 2V4m5 4 1-2"/><path d="M7 14h10"/></symbol>
<symbol id="i-cup" viewBox="0 0 24 24"><path d="M4 8h12v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4Zm12 1h2a3 3 0 0 1 0 6h-2M7 3v2m5-2v2"/></symbol>
<symbol id="i-room" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M5 9v12h14V9M10 21v-7h4v7"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-.6 3-2.8 1-2.3 2 2 2v3l-2 2 2.3 2 2.8 0 1 3h5.2l1-3 2.8 0 2.3-2-2-2v-3l2-2-2.3-2-2.8-1-.6-3Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-leaf" viewBox="0 0 24 24"><path d="M19 3C3 2 2 13 8 16s13-4 11-13ZM5 21 16 7"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20 3.9 12A5.2 5.2 0 0 1 12 5.5 5.2 5.2 0 0 1 20.1 12Z"/></symbol>
<symbol id="i-sound" viewBox="0 0 24 24"><path d="m4 9 4 0 5-4v14l-5-4H4ZM17 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
</defs></svg>
<main id="app">

            html = `<div class="shop-heading"><div><h2>Room for more regulars.</h2><p>Every room keeps brewing, wherever you’re looking.</p></div><span class="pill">${s.tables} / ${s.rooms.secondFloor ? 8 : s.rooms.patio ? 5 : 2} tables</span></div>${goals()}<article class="card"><div class="shop-heading" style="margin-bottom:0"><div><h3 style="margin:0;font-size:17px">The original café</h3><p>Two sunny spots by the window. Where it all begins.</p></div><span class="pill green">Open</span></div></article>${upgradeCard('table')}<h3 class="section-label">A bigger little world</h3>${upgradeCard('patio')}${upgradeCard('secondFloor')}<article class="card"><h3 style="margin:0;font-size:15px">A seat, a sip, a slow afternoon.</h3><p class="body-copy">Each installed table seats one guest. Expansions include one table and room for two more. The owner serves automatically from your very first cup.</p></article>`;
        if (tab === 'fame') {
            const award = Math.floor(Math.sqrt(s.runGross / 25000)), next = 25000 * (award + 1) ** 2, ready = fameReady();
            html = `<div class="shop-heading"><div><h2>A neighborhood favorite.</h2><p>Some little places leave a very big impression.</p></div>${icon('star')}</div><div class="stat-grid"><div class="stat-box"><strong>${whole(s.fameStars)} ${icon('star')}</strong>Permanent Fame stars</div><div class="stat-box"><strong>${stylePoints()} ${icon('leaf')}</strong>Style points this run</div></div><article class="card"><h3 style="font-size:18px;margin:0">Cat Café Fame</h3><p class="body-copy">Start a new café and keep your reputation. Each permanent star gives +8% ticket value and +4% demand, capped at +40% demand.</p><p class="body-copy">Current bonus: <strong>+${s.fameStars * 8}% tickets · +${Math.min(40, s.fameStars * 4)}% demand</strong></p><div class="receipt"><div><span>Gross this run</span><strong id="runGross">${fmt(s.runGross)}</strong></div><div><span>Stars from this reset</span><strong id="fameAward">${award}</strong></div><div><span>Next award threshold</span><strong id="nextThreshold">${whole(next)}</strong></div></div><p class="body-copy" id="fameRequirements">${ready ? 'Your café is ready for its next chapter.' : 'Needs ' + [...(s.runGross < 25000 ? ['25,000 gross customer coins'] : []), ...(!s.rooms.secondFloor ? ['Second floor'] : []), ...(stylePoints() < 25 ? ['25 Style points'] : [])].join(' · ')}</p><button class="buy rose wide" id="fameButton" data-action="fame" ${ready ? '' : 'disabled'}>Begin a new chapter</button><p class="minor">A two-step confirmation explains exactly what resets. Discoveries, settings and all-time earnings stay.</p></article><h3 class="section-label">Dream a little bigger</h3><div class="goals">${[[`${s.cats.length}/12 cats`, s.cats.length === 12], [`${s.tables}/8 tables`, s.tables === 8], [`Espresso ${s.upgrades.espresso}/4`, s.upgrades.espresso === 4], [`${Math.min(5, s.fameStars)}/5 stars`, s.fameStars >= 5]].map(([text, done]) => `<div class="goal ${done ? 'done' : ''}">${text}</div>`).join('')}</div><p class="body-copy">All-time customer coins: <strong id="allGross">${fmt(s.allTimeGross)}</strong><br>Time at the café: <span id="activeTime">${duration(s.activeSeconds)}</span></p><button class="wide" data-action="gallery">${icon('paw')} Your discovery gallery · ${s.discoveries.length}/12</button>`;
        }
        const scroll = $('shop').scrollTop, focused = document.activeElement, focusKey = focused?.dataset.buy ? 'buy:' + focused.dataset.buy : focused?.dataset.find ? 'find:' + focused.dataset.find : null;
        $('shop').innerHTML = html;
        $('shop').scrollTop = scroll;
        if (focusKey) {
            const [kind, ...rest] = focusKey.split(':');
            $('shop').querySelector(`[data-${kind}="${rest.join(':')}"]`)?.focus({ preventScroll: true });
        }
        $('shop').setAttribute('aria-labelledby', 'tab-' + tab);
        document.querySelectorAll('[data-tab]').forEach(b => { b.setAttribute('aria-selected', b.dataset.tab === tab); b.tabIndex = b.dataset.tab === tab ? 0 : -1; });
        shopDirty = false;
    }
    function renderUI() {
        if (!s)
            return;
        $('coins').textContent = fmt(s.coins);
        $('estimate').textContent = '~' + fmt(estimate().net) + '/min';
        $('food').textContent = fmt(s.kibble) + ' kibble';
        $('capacity').textContent = s.cats.length + ' / ' + capacity();
        $('sceneCaption').textContent = (s.cats.some(c => c.grumpy) ? 'Hungry, still brewing' : 'Open & cozy') + ' · ' + fmt(charm()) + ' charm';
        $('sceneCaption').title = 'Serving automatically in every room';
        $('foodButton').setAttribute('aria-label', fmt(s.kibble) + ' kibble in stock. ' + fmt(upkeep()) + ' kibble per minute. Stock lasts ' + duration(s.kibble / upkeep() * 60) + '. Open feeding settings.');
        document.querySelectorAll('[data-room]').forEach(b => { const room = b.dataset.room, unlocked = roomIds().includes(room); b.disabled = !unlocked; b.textContent = ROOMNAMES[room] + (unlocked ? '' : ' · locked'); b.setAttribute('aria-pressed', room === s.settings.selectedRoom); });
        if (shopDirty)
            renderShop();
        document.querySelectorAll('[data-buy]').forEach(b => { const o = offer(b.dataset.buy); b.disabled = !o || o.max || o.req.length > 0 || s.coins + 1e-9 < o.cost; });
        document.querySelectorAll('[data-shortfall]').forEach(el => { const o = offer(el.dataset.shortfall); if (o)
            el.textContent = s.coins < o.cost ? 'Need ' + fmt(o.cost - s.coins) + ' more' : o.req.length ? 'Not quite yet' : 'Make it cozy'; });
        for (const c of s.cats) {
            document.querySelectorAll(`[data-h="${c.id}"]`).forEach(el => el.textContent = fmt(c.happiness));
            document.querySelectorAll(`[data-mood="${c.id}"]`).forEach(el => el.textContent = mood(c) + ' · H ' + fmt(c.happiness));
            document.querySelectorAll(`[data-happiness-bar="${c.id}"]`).forEach(el => el.style.width = c.happiness + '%');
        }
        if ($('bowlDetails'))
            $('bowlDetails').innerHTML = `${fmt(s.kibble)} / 100 kibble · ${fmt(upkeep())} kibble/min<br>Stock lasts ${duration(s.kibble / upkeep() * 60)} without refills.`;
        if ($('runGross')) {
            $('runGross').textContent = fmt(s.runGross);
            const award = Math.floor(Math.sqrt(s.runGross / 25000));
            $('fameAward').textContent = whole(award);
            $('nextThreshold').textContent = whole(25000 * (award + 1) ** 2);
            $('fameButton').disabled = !fameReady();
            $('allGross').textContent = fmt(s.allTimeGross);
            $('activeTime').textContent = duration(s.activeSeconds);
            if (fameReady())
                $('fameRequirements').textContent = 'Your café is ready for its next chapter.';
        }
    }
    function applySettings() { document.documentElement.classList.toggle('reduced', s.settings.reducedMotion); }
    function gallery() { showModal('Every cat, remembered.', `<p class="body-copy">Your discoveries stay through every new chapter. ${s.discoveries.length} of 12 friends found.</p><div class="gallery">${ROSTER.map(c => `<div class="${s.discoveries.includes(c.id) ? '' : 'undiscovered'}"><svg viewBox="-55 -50 110 100" aria-hidden="true">${catSVG(c)}</svg><small>${c.name}</small></div>`).join('')}</div>`, 'gallery'); }
    function action(name) { if (name === 'close')
        closeModal();
    else if (name === 'export')
        exportSave();
    else if (name === 'import')
        importDialog();
    else if (name === 'do-import')
        doImport();
    else if (name === 'gallery')
        gallery();
    else if (name === 'delete')
        deleteDialog();
    else if (name === 'delete-final')
        deleteDialog(2);
    else if (name === 'do-delete')
        deleteSave();
    else if (name === 'cancel-delete') {
        if (blocked)
            recovery(Error('Recover your saved café, or choose a fresh start.'));
        else
            settings();
    }
    else if (name === 'raw-export') {
        let data;
        try {
            data = { primary: localStorage.getItem(KEY), backup: localStorage.getItem(BACKUP) };
        }
        catch {
            data = corruptRaw;
        }
        download(JSON.stringify(data, null, 2), 'cat-cafe-recovery.json');
    }
    else if (name === 'retry-settlement') {
        blocked = false;
        modalKind = 'retry';
        closeModal();
        settleFromBoundary(retryBoundary ?? s.savedAtMs);
    }
    else if (name === 'fame')
        fameDialog();
    else if (name === 'fame-final')
        fameDialog(2);
    else if (name === 'do-fame')
        resetFame(); }
    document.addEventListener('click', e => { const el = e.target.closest('button,[data-pet]'); if (!el || el.disabled)
        return; if (el.id === 'retryOwnership') {
        acquire();
        return;
    } if (!active || !s)
        return; if (el.id === 'settingsButton' || el.id === 'foodButton' || el.id === 'saveNotice') {
        if (!blocked)
            settings();
        return;
    } if (el.id === 'closeModal') {
        closeModal();
        return;
    } if (el.dataset.action) {
        action(el.dataset.action);
        return;
    } if (blocked)
        return; if (el.dataset.buy) {
        pending.push({ type: 'buy', id: el.dataset.buy });
        return;
    } if (el.dataset.pet) {
        enableAudio();
        pending.push({ type: 'pet', id: el.dataset.pet });
        return;
    } if (el.dataset.find) {
        const cat = s.cats.find(c => c.id === el.dataset.find);
        s.settings.selectedRoom = cat.room;
        sceneSignature = '';
        toast(`${CAT[cat.id].name} is in the ${ROOMNAMES[cat.room].toLowerCase()}. Tap for a cuddle.`);
        return;
    } if (el.dataset.tab) {
        s.settings.shopTab = el.dataset.tab;
        $('shop').scrollTop = 0;
        shopDirty = true;
        renderUI();
        return;
    } if (el.dataset.room) {
        s.settings.selectedRoom = el.dataset.room;
        sceneSignature = '';
        renderUI();
        return;
    } if (el.dataset.setting) {
        const key = el.dataset.setting, value = el.getAttribute('aria-pressed') !== 'true';
        pending.push({ type: 'setting', key, value });
        el.setAttribute('aria-pressed', value);
        el.textContent = value ? 'On' : 'Off';
        if (key === 'sound' && value) {
            s.settings.sound = true;
            enableAudio();
        }
        return;
    } });
    document.addEventListener('keydown', e => { const el = e.target.closest('[data-pet]'); if (el?.tagName.toLowerCase() === 'g' && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        if (active && !blocked) {
            enableAudio();
            pending.push({ type: 'pet', id: el.dataset.pet });
        }
    } const tab = e.target.closest('[data-tab]'); if (tab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
        e.preventDefault();
        const tabs = [...document.querySelectorAll('[data-tab]')], i = tabs.indexOf(tab), next = e.key === 'Home' ? 0 : e.key === 'End' ? 3 : (i + (e.key === 'ArrowRight' ? 1 : 3)) % 4;
        tabs[next].click();
        tabs[next].focus();
    } });
    $('modal').addEventListener('cancel', e => { e.preventDefault(); closeModal(); });
    $('modal').addEventListener('click', e => { if (e.target === $('modal')) {
        const rect = $('modal').getBoundingClientRect();
        if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom)
            closeModal();
    } });
    function advanceFrame(now) { if (!lastFrame)
        lastFrame = now; const dt = Math.max(0, (now - lastFrame) / 1000); lastFrame = now; if (dt >= 5) {
        settleFromBoundary(wallBoundary);
        return;
    } accumulator += dt; wallBoundary = Math.max(wallBoundary, Date.now()); let ticks = 0; while (accumulator + 1e-9 >= STEP && ticks < 8) {
        accumulator = Math.max(0, accumulator - STEP);
        tick();
        ticks++;
    } if (saveTimer >= 10)
        save(); }
    function frame(now) { if (active && !blocked && !document.hidden) {
        if (!owns()) {
            loseOwnership();
        }
        else {
            advanceFrame(now);
            if (now - lastUI >= 250) {
                lastUI = now;
                renderUI();
            }
            renderScene(now, Math.min(1, accumulator / STEP));
        }
    } requestAnimationFrame(frame); }
    document.addEventListener('visibilitychange', () => { if (document.hidden) {
        if (active && !blocked) {
            advanceFrame(performance.now());
            save();
        }
        lastFrame = 0;
    }
    else if (active && !blocked) {
        settleFromBoundary(wallBoundary);
        lastFrame = performance.now();
    }
    else if (!active)
        acquire(); });
    window.addEventListener('pagehide', release);
    window.addEventListener('pageshow', e => { if (e.persisted) {
        active = false;
        initialized = false;
        acquire();
    } });
    s = fresh();
    renderUI();
    renderScene(performance.now(), 0);
    acquire();
    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
