<script>

/* ================= CLAW: lexer ================= */
function clawErr(msg, line) { const e = new Error("line " + line + ": " + msg); e.isClaw = true; return e; }

function lex(src) {
  const toks = []; let i = 0, line = 1;
  const isD = c => c >= "0" && c <= "9";
  const isA = c => (c >= "a" && c <= "z") || (c >= "A" && c <= "Z") || c === "_";
  const KW = { f: "F", if: "IF", else: "ELSE", while: "WHILE", p: "P", ret: "RET", true: "TRUE", false: "FALSE" };
  while (i < src.length) {
    const c = src[i];
    if (c === "\n") { toks.push({ t: "NL", line }); line++; i++; continue; }
    if (c === " " || c === "\t" || c === "\r") { i++; continue; }
    if (c === "#") { while (i < src.length && src[i] !== "\n") i++; continue; }
    if (isD(c)) {
      let j = i, dot = false;
      while (j < src.length && (isD(src[j]) || (!dot && src[j] === "."))) { if (src[j] === ".") dot = true; j++; }
      toks.push({ t: "NUM", v: parseFloat(src.slice(i, j)), line }); i = j; continue;
    }
    if (c === '"') {
      let j = i + 1, s = "";
      while (j < src.length && src[j] !== '"') {
        if (src[j] === "\\" && j + 1 < src.length) { const e = src[++j]; s += e === "n" ? "\n" : e === "t" ? "\t" : e; }
        else s += src[j];
        j++;
      }
      if (src[j] !== '"') throw clawErr("unterminated string", line);
      toks.push({ t: "STR", v: s, line }); i = j + 1; continue;
    }
    if (isA(c)) {
      let j = i;
      while (j < src.length && (isA(src[j]) || isD(src[j]))) j++;
      const w = src.slice(i, j);
      toks.push({ t: KW[w] || "ID", v: w, line }); i = j; continue;
    }
    const two = src.substr(i, 2);
    if (["<=", ">=", "==", "!="].includes(two)) { toks.push({ t: two, line }); i += 2; continue; }
    if ("+-*/%<>=!?:;,.(){}".includes(c)) { toks.push({ t: c, line }); i++; continue; }
    throw clawErr("bad character '" + c + "'", line);
  }
  toks.push({ t: "EOF", line });
  return toks;
}

/* ================= CLAW: parser ================= */
function parse(toks) {
  let pos = 0;
  const peek = () => toks[pos];
  const next = () => toks[pos++];
  const expect = t => {
    const k = next();
    if (k.t !== t) throw clawErr("expected " + t + ", got " + (k.v || k.t), k.line);
    return k;
  };
  const sep = () => { while (peek().t === "NL" || peek().t === ";") pos++; };

  function program() { sep(); const ss = []; while (peek().t !== "EOF") { ss.push(stmt()); sep(); } return { k: "prog", ss }; }
  function block() {
    expect("{"); sep(); const ss = [];
    while (peek().t !== "}") { ss.push(stmt()); sep(); }
    expect("}"); return ss;
  }
  function stmt() {
    const t = peek();
    if (t.t === "F") return fnDef();
    if (t.t === "P") { next(); return { k: "print", e: expr() }; }
    if (t.t === "IF") return ifStmt();
    if (t.t === "WHILE") return whileStmt();
    if (t.t === "RET") { next(); return { k: "ret", e: expr() }; }
    if (t.t === "ID" && (toks[pos + 1].t === "=" || toks[pos + 1].t === ":")) return assign();
    return { k: "expr", e: expr() };
  }
  function assign() {
    const name = expect("ID").v; let typ = null;
    if (peek().t === ":") { next(); typ = expect("ID").v; }
    expect("="); return { k: "assign", name, typ, e: expr() };
  }
  function fnDef() {
    expect("F"); const name = expect("ID").v; expect("(");
    const params = [];
    if (peek().t !== ")") {
      do {
        const pn = expect("ID").v; let pt = null;
        if (peek().t === ":") { next(); pt = expect("ID").v; }
        params.push({ n: pn, t: pt });
      } while (peek().t === "," && next());
    }
    expect(")"); let rt = null;
    if (peek().t === ":") { next(); rt = expect("ID").v; }
    let body;
    if (peek().t === "=") { next(); body = [{ k: "ret", e: expr() }]; }
    else body = block();
    return { k: "fn", name, params, rt, body };
  }
  function ifStmt() {
    expect("IF"); const c = expr(); const a = block(); let b = null;
    const save = pos; sep();
    if (peek().t === "ELSE") { next(); b = block(); } else pos = save;
    return { k: "if", c, a, b };
  }
  function whileStmt() { expect("WHILE"); const c = expr(); return { k: "while", c, body: block() }; }

  function expr() { return ternary(); }
  function ternary() {
    const c = logic();
    if (peek().t === "?") { next(); const a = expr(); expect(":"); const b = expr(); return { k: "tern", c, a, b }; }
    return c;
  }
  function logic() {
    let e = comp();
    while (peek().t === "==" || peek().t === "!=") { const op = next().t; e = { k: "bin", op, a: e, b: comp() }; }
    return e;
  }
  function comp() {
    let e = add();
    while (["<", ">", "<=", ">="].includes(peek().t)) { const op = next().t; e = { k: "bin", op, a: e, b: add() }; }
    return e;
  }
  function add() {
    let e = mul();
    while (peek().t === "+" || peek().t === "-") { const op = next().t; e = { k: "bin", op, a: e, b: mul() }; }
    return e;
  }
  function mul() {
    let e = unary();
    while (["*", "/", "%"].includes(peek().t)) { const op = next().t; e = { k: "bin", op, a: e, b: unary() }; }
    return e;
  }
  function unary() {
    if (peek().t === "-") { next(); return { k: "neg", e: unary() }; }
    return primary();
  }
  function primary() {
    const t = next();
    if (t.t === "NUM" || t.t === "STR") return { k: "lit", v: t.v };
    if (t.t === "TRUE") return { k: "lit", v: true };
    if (t.t === "FALSE") return { k: "lit", v: false };
    if (t.t === "ID") {
      if (peek().t === "(") {
        next(); const args = [];
        if (peek().t !== ")") { do { args.push(expr()); } while (peek().t === "," && next()); }
        expect(")"); return { k: "call", name: t.v, args };
      }
      return { k: "var", name: t.v };
    }
    if (t.t === "(") { const e = expr(); expect(")"); return e; }
    throw clawErr("unexpected " + (t.v || t.t), t.line);
  }
  return program();
}
/* ================= CLAW: compiler (AST -> bytecode) ================= */
function compile(prog) {
  const consts = [], cmap = new Map(), funcs = {};
  const ck = v => {
    const key = typeof v + ":" + String(v);
    if (!cmap.has(key)) { cmap.set(key, consts.length); consts.push(v); }
    return cmap.get(key);
  };
  const BIN = { "+": "ADD", "-": "SUB", "*": "MUL", "/": "DIV", "%": "MOD",
                "<": "LT", ">": "GT", "<=": "LTE", ">=": "GTE", "==": "EQ", "!=": "NEQ" };

  function compStmts(ss, ctx, code) { for (const s of ss) compStmt(s, ctx, code); }
  function compStmt(s, ctx, code) {
    switch (s.k) {
      case "fn": {
        const fcode = [], fctx = { slots: new Map(), next: 0 };
        for (const p of s.params) { fctx.slots.set(p.n, fctx.next++); }
        compStmts(s.body, fctx, fcode);
        fcode.push({ op: "CONST", a: ck(null) }, { op: "RET" });
        funcs[s.name] = { code: fcode, arity: s.params.length, rt: s.rt };
        break;
      }
      case "assign": {
        compExpr(s.e, ctx, code);
        if (!ctx.slots.has(s.name)) ctx.slots.set(s.name, ctx.next++);
        code.push({ op: "STORE", a: ctx.slots.get(s.name) });
        break;
      }
      case "print": compExpr(s.e, ctx, code); code.push({ op: "PRINT" }); break;
      case "expr": compExpr(s.e, ctx, code); code.push({ op: "POP" }); break;
      case "ret": compExpr(s.e, ctx, code); code.push({ op: "RET" }); break;
      case "if": {
        compExpr(s.c, ctx, code);
        const jf = { op: "JF", a: -1 }; code.push(jf);
        compStmts(s.a, ctx, code);
        if (s.b) {
          const jmp = { op: "JMP", a: -1 }; code.push(jmp);
          jf.a = code.length;
          compStmts(s.b, ctx, code);
          jmp.a = code.length;
        } else jf.a = code.length;
        break;
      }
      case "while": {
        const loop = code.length;
        compExpr(s.c, ctx, code);
        const jf = { op: "JF", a: -1 }; code.push(jf);
        compStmts(s.body, ctx, code);
        code.push({ op: "JMP", a: loop });
        jf.a = code.length;
        break;
      }
    }
  }
  function compExpr(e, ctx, code) {
    switch (e.k) {
      case "lit": code.push({ op: "CONST", a: ck(e.v) }); break;
      case "var": {
        if (!ctx.slots.has(e.name)) throw clawErr("unknown variable '" + e.name + "'", 0);
        code.push({ op: "LOAD", a: ctx.slots.get(e.name) }); break;
      }
      case "neg": compExpr(e.e, ctx, code); code.push({ op: "NEG" }); break;
      case "bin":
        compExpr(e.a, ctx, code); compExpr(e.b, ctx, code);
        code.push({ op: BIN[e.op] }); break;
      case "tern": {
        compExpr(e.c, ctx, code);
        const jf = { op: "JF", a: -1 }; code.push(jf);
        compExpr(e.a, ctx, code);
        const jmp = { op: "JMP", a: -1 }; code.push(jmp);
        jf.a = code.length;
        compExpr(e.b, ctx, code);
        jmp.a = code.length;
        break;
      }
      case "call": {
        for (const a of e.args) compExpr(a, ctx, code);
        code.push({ op: "CALL", name: e.name, argc: e.args.length });
        break;
      }
    }
  }
  const main = [], ctx = { slots: new Map(), next: 0 };
  compStmts(prog.ss, ctx, main);
  main.push({ op: "HALT" });
  return { main, funcs, consts };
}

/* ================= CLAW: VM ================= */
const NATIVES = {
  rand:  { arity: 0, fn: () => Math.random() },
  clock: { arity: 0, fn: () => performance.now() },
};
function runVM(unit) {
  const out = [];
  const { main, funcs, consts } = unit;
  const str = v => v === null || v === undefined ? "null" : typeof v === "string" ? v : String(v);
  let frame = { code: main, ip: 0, locals: [], stack: [] };
  const calls = [];
  let icount = 0;
  const LIMIT = 2e9;
  while (true) {
    if (++icount > LIMIT) throw clawErr("time limit exceeded", 0);
    const ins = frame.code[frame.ip++], S = frame.stack;
    switch (ins.op) {
      case "CONST": S.push(consts[ins.a]); break;
      case "LOAD": S.push(frame.locals[ins.a]); break;
      case "STORE": frame.locals[ins.a] = S.pop(); break;
      case "ADD": { const b = S.pop(), a = S.pop();
        S.push(typeof a === "string" || typeof b === "string" ? String(a) + String(b) : a + b); break; }
      case "SUB": { const b = S.pop(), a = S.pop(); S.push(a - b); break; }
      case "MUL": { const b = S.pop(), a = S.pop(); S.push(a * b); break; }
      case "DIV": { const b = S.pop(), a = S.pop(); S.push(a / b); break; }
      case "MOD": { const b = S.pop(), a = S.pop(); S.push(a % b); break; }
      case "NEG": S.push(-S.pop()); break;
      case "LT": { const b = S.pop(), a = S.pop(); S.push(a < b); break; }
      case "GT": { const b = S.pop(), a = S.pop(); S.push(a > b); break; }
      case "LTE": { const b = S.pop(), a = S.pop(); S.push(a <= b); break; }
      case "GTE": { const b = S.pop(), a = S.pop(); S.push(a >= b); break; }
      case "EQ": { const b = S.pop(), a = S.pop(); S.push(a === b); break; }
      case "NEQ": { const b = S.pop(), a = S.pop(); S.push(a !== b); break; }
      case "JMP": frame.ip = ins.a; break;
      case "JF": if (!S.pop()) frame.ip = ins.a; break;
      case "CALL": {
        const args = [];
        for (let i = 0; i < ins.argc; i++) args.unshift(S.pop());
        const nat = NATIVES[ins.name];
        if (nat) {
          if (args.length !== nat.arity) throw clawErr(ins.name + " wants " + nat.arity + " args, got " + args.length, 0);
          S.push(nat.fn(args));
          break;
        }
        const fn = funcs[ins.name];
        if (!fn) throw clawErr("unknown function '" + ins.name + "'", 0);
        if (args.length !== fn.arity) throw clawErr(ins.name + " wants " + fn.arity + " args, got " + args.length, 0);
        calls.push(frame);
        frame = { code: fn.code, ip: 0, locals: args, stack: [] };
        break;
      }
      case "RET": {
        const v = S.pop();
        frame = calls.pop();
        if (!frame) return { out, icount };
        frame.stack.push(v);
        break;
      }
      case "PRINT": out.push(str(S.pop())); break;
      case "POP": S.pop(); break;
      case "HALT": return { out, icount };
      default: throw clawErr("bad op " + ins.op, 0);
    }
  }
}

function disasm(unit) {
  const lines = [];
  const show = (name, code, consts) => {
    lines.push("== " + name + " ==");
    code.forEach((ins, i) => {
      let s = String(i).padStart(4, "0") + "  " + ins.op.padEnd(6);
      if (ins.op === "CONST") s += ins.a + "   ; " + JSON.stringify(consts[ins.a]);
      else if (ins.op === "CALL") s += ins.name + "/" + ins.argc;
      else if (ins.a !== undefined) s += ins.a;
      lines.push(s);
    });
  };
  show("main", unit.main, unit.consts);
  for (const n of Object.keys(unit.funcs)) show("fn " + n, unit.funcs[n].code, unit.consts);
  return lines.join("\n");
}

function clawRun(src) {
  const t0 = performance.now();
  const toks = lex(src);
  const ast = parse(toks);
  const unit = compile(ast);
  const t1 = performance.now();
  const res = runVM(unit);
  const t2 = performance.now();
  return { out: res.out, icount: res.icount, compileMs: t1 - t0, runMs: t2 - t1, unit };
}

const EXAMPLES = [{"title": "hello", "cat": "Basics", "desc": "The classic first program.", "code": "p \"hello, world\""}, {"title": "variables", "cat": "Basics", "desc": "Inferred vs annotated variables.", "code": "x = 10\ny:i = 20\np x + y"}, {"title": "arithmetic", "cat": "Basics", "desc": "Precedence and remainder.", "code": "p 2 + 3 * 4\np (2 + 3) * 4\np 17 % 5\np 7 / 2"}, {"title": "strings", "cat": "Basics", "desc": "Concatenation with +.", "code": "name:s = \"claw\"\np \"written in \" + name\np \"a\" + \"b\" + 3"}, {"title": "if-else", "cat": "Basics", "desc": "Branching.", "code": "x = 7\nif x > 10 { p \"big\" } else { p \"small\" }"}, {"title": "while", "cat": "Basics", "desc": "Counting loop.", "code": "i = 1\nwhile i <= 5 {\n  p i\n  i = i + 1\n}"}, {"title": "ternary", "cat": "Basics", "desc": "Inline if-else as an expression.", "code": "age = 20\np age >= 18 ? \"adult\" : \"minor\""}, {"title": "fibonacci", "cat": "Functions", "desc": "Recursion in one line.", "code": "f fib(n:i):i = n<2 ? n : fib(n-1)+fib(n-2)\np fib(20)"}, {"title": "factorial", "cat": "Functions", "desc": "Loop-based function with a block body.", "code": "f fact(n:i):i {\n  r = 1\n  i = 2\n  while i <= n {\n    r = r * i\n    i = i + 1\n  }\n  ret r\n}\np fact(10)"}, {"title": "gcd", "cat": "Functions", "desc": "Euclid's algorithm.", "code": "f gcd(a:i, b:i):i {\n  while b != 0 {\n    t = b\n    b = a % b\n    a = t\n  }\n  ret a\n}\np gcd(48, 18)"}, {"title": "is-prime", "cat": "Functions", "desc": "Trial division with early return.", "code": "f prime(n:i):b {\n  if n < 2 { ret false }\n  i = 2\n  while i*i <= n {\n    if n%i == 0 { ret false }\n    i = i+1\n  }\n  ret true\n}\np prime(97)\np prime(100)"}, {"title": "nested-calls", "cat": "Functions", "desc": "Functions calling functions.", "code": "f double(n) = n*2\nf quad(n) = double(double(n))\np quad(21)"}, {"title": "early-return", "cat": "Functions", "desc": "Guard clauses.", "code": "f abs(n:i):i {\n  if n < 0 { ret -n }\n  ret n\n}\np abs(-42)\np abs(7)"}, {"title": "primes-to-50", "cat": "Math", "desc": "Finding primes with nested loops.", "code": "n = 2\nwhile n <= 20 {\n  i = 2\n  is_p = true\n  while i*i <= n {\n    if n%i == 0 { is_p = false }\n    i = i+1\n  }\n  if is_p { p n }\n  n = n+1\n}"}, {"title": "power", "cat": "Math", "desc": "Exponentiation by loop.", "code": "f pow(b:i, e:i):i {\n  r = 1\n  while e > 0 { r = r*b  e = e-1 }\n  ret r\n}\np pow(2, 16)"}, {"title": "collatz", "cat": "Math", "desc": "The 3n+1 conjecture: steps from 27.", "code": "f collatz(n:i):i {\n  steps = 0\n  while n != 1 {\n    n = n%2==0 ? n/2 : 3*n+1\n    steps = steps+1\n  }\n  ret steps\n}\np collatz(27)"}, {"title": "gauss-sum", "cat": "Math", "desc": "Sum 1..1M the instant way.", "code": "n = 1000000\np n*(n+1)/2"}, {"title": "fizzbuzz", "cat": "Strings", "desc": "Ternary chains.", "code": "i = 1\nwhile i<=15 {\n  p i%15==0 ? \"fizzbuzz\" : i%3==0 ? \"fizz\" : i%5==0 ? \"buzz\" : i\n  i = i+1\n}"}, {"title": "triangle", "cat": "Strings", "desc": "Building strings in a loop.", "code": "i = 1\nwhile i <= 5 {\n  row = \"\"\n  j = 0\n  while j < i { row = row + \"*\"  j = j+1 }\n  p row\n  i = i+1\n}"}, {"title": "countdown", "cat": "Strings", "desc": "A rocket launch.", "code": "i = 5\nwhile i > 0 {\n  p i\n  i = i-1\n}\np \"liftoff\""}, {"title": "monte-carlo-pi", "cat": "Simulation", "desc": "Estimate pi with 200k random darts. Needs rand().", "code": "inside = 0\ni = 0\nn = 200000\nwhile i < n {\n  x = rand()*2-1\n  y = rand()*2-1\n  if x*x+y*y < 1 { inside = inside+1 }\n  i = i+1\n}\np 4*inside/n"}, {"title": "dice-stats", "cat": "Simulation", "desc": "Roll a die 60k times, count the sixes (~10k expected).", "code": "c6 = 0\ni = 0\nwhile i < 60000 {\n  if rand()*6 < 1 { c6 = c6+1 }\n  i = i+1\n}\np c6"}, {"title": "timed-fib", "cat": "Speed", "desc": "Time fib(22) with clock().", "code": "t = clock()\nf fib(n:i):i = n<2 ? n : fib(n-1)+fib(n-2)\np fib(22)\np clock()-t"}, {"title": "loop-10M", "cat": "Speed", "desc": "Ten million iterations. Watch the instr/sec.", "code": "s = 0\ni = 0\nwhile i<10000000 {\n  s = s+i\n  i = i+1\n}\np s"}];
const CATS = ["All"].concat(Array.from(new Set(EXAMPLES.map(function(e){ return e.cat; }))));
var activeCat = "All", query = "";
var grid = document.getElementById("grid"),
    chipsEl = document.getElementById("chips"),
    searchEl = document.getElementById("search");

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderChips(){
  chipsEl.innerHTML = "";
  CATS.forEach(function(c){
    var b = document.createElement("button");
    b.className = "chip" + (c === activeCat ? " on" : "");
    b.textContent = c;
    b.onclick = function(){ activeCat = c; renderChips(); renderGrid(); };
    chipsEl.appendChild(b);
  });
}
function renderGrid(){
  grid.innerHTML = "";
  var q = query.toLowerCase();
  var list = EXAMPLES.filter(function(e){
    return (activeCat === "All" || e.cat === activeCat) &&
      (!q || (e.title + " " + e.desc + " " + e.code).toLowerCase().indexOf(q) !== -1);
  });
  if (!list.length) { grid.innerHTML = '<div class="empty">No recipes match.</div>'; return; }
  list.forEach(function(e){
    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML = "<h3>" + esc(e.title) + "</h3>" +
      '<span class="tag">' + esc(e.cat) + "</span>" +
      "<p>" + esc(e.desc) + "</p>" +
      "<pre>" + esc(e.code) + "</pre>" +
      '<div class="row"><button>Run &#9656;</button><span class="ms"></span></div>' +
      '<div class="cout"></div>';
    var btn = card.querySelector("button"),
        cout = card.querySelector(".cout"),
        ms = card.querySelector(".ms");
    btn.onclick = function(){
      var t0 = performance.now();
      try {
        var r = clawRun(e.code);
        cout.className = "cout show";
        cout.textContent = r.out.join("\n") || "(no output)";
        ms.textContent = (performance.now() - t0).toFixed(1) + " ms";
      } catch (err) {
        cout.className = "cout show err";
        cout.textContent = "Error: " + err.message;
        ms.textContent = "";
      }
    };
    grid.appendChild(card);
  });
}
searchEl.addEventListener("input", function(){ query = searchEl.value; renderGrid(); });

var pad = document.getElementById("scratchpad"),
    sout = document.getElementById("sout"),
    sms = document.getElementById("sms");
document.getElementById("scratchrun").onclick = function(){
  var t0 = performance.now();
  try {
    var r = clawRun(pad.value);
    sout.className = "cout show";
    sout.textContent = r.out.join("\n") || "(no output)";
    sms.textContent = (performance.now() - t0).toFixed(1) + " ms · " +
      r.icount.toLocaleString() + " instr";
  } catch (e) {
    sout.className = "cout show err";
    sout.textContent = "Error: " + e.message;
    sms.textContent = "";
  }
};
pad.addEventListener("keydown", function(e){
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") document.getElementById("scratchrun").click();
});
renderChips(); renderGrid();
</script>
