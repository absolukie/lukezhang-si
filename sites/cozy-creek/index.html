<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cozy Creek — a real-time 3D creek</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#0b0e14; }
  body { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif; }
  #scene { position:fixed; inset:0; }
  #scene canvas { display:block; touch-action:none; }
  #loader {
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; gap:14px;
    align-items:center; justify-content:center; background:#0b0e14; color:#e8ded0;
    transition:opacity .8s ease; font-size:14px; letter-spacing:3px; text-transform:uppercase;
  }
  #loader.done { opacity:0; pointer-events:none; }
  #loader .ripple {
    width:54px; height:54px; border-radius:50%;
    border:2px solid rgba(232,222,208,.25); border-top-color:#e8ded0;
    animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  #logo {
    position:fixed; top:22px; left:26px; z-index:10; color:#fff8ec;
    font-family:"Snell Roundhand","Brush Script MT","Segoe Script",cursive;
    font-size:34px; text-shadow:0 2px 18px rgba(0,0,0,.45); user-select:none;
    pointer-events:none; opacity:.95;
  }
  #panel {
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:10;
    display:flex; flex-direction:column; gap:10px; align-items:center; user-select:none;
  }
  .row { display:flex; gap:8px; }
  .pill {
    border:1px solid rgba(255,255,255,.22); background:rgba(12,14,20,.55);
    color:#f2ead9; font-size:13px; letter-spacing:.4px; padding:9px 18px; border-radius:999px;
    cursor:pointer; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:all .25s ease; touch-action:manipulation; font-family:inherit;
  }
  .pill:hover { background:rgba(30,34,46,.7); }
  .pill.active { background:#f5b95e; border-color:#f5b95e; color:#241a08; font-weight:600; }
  body.user-cam #cinematicBtn { border-color:#f5b95e; color:#f5b95e; }
  #hint {
    position:fixed; bottom:26px; right:24px; z-index:10; color:rgba(255,248,236,.65);
    font-size:12px; letter-spacing:.5px; pointer-events:none; user-select:none;
  }
  @media (max-width:700px){
    #logo { font-size:26px; top:16px; left:18px; }
    #hint { display:none; }
    .pill { padding:8px 14px; font-size:12px; }
    #panel { bottom:18px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body>
<div id="scene"></div>
<div id="loader"><div class="ripple"></div><div>waking the creek</div></div>
<div id="logo">Cozy Creek</div>
<div id="panel">
  <div class="row" id="timeRow">
    <button class="pill active" data-t="morn">Morn</button>
    <button class="pill" data-t="noon">Noon</button>
    <button class="pill" data-t="night">Night</button>
  </div>
  <div class="row">
    <button class="pill active" id="bloomBtn">Bloom</button>
    <button class="pill" id="rainBtn">Rain</button>
    <button class="pill" id="musicBtn">Music</button>
    <button class="pill" id="cinematicBtn">Cinematic</button>
  </div>
</div>
<div id="hint">drag to explore</div>
<script type="module" src="./app.js"></script>
</body>
</html>
