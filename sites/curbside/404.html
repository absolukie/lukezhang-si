<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wrong turn: Curbside</title>
<meta name="description" content="That Curbside page does not exist. Head back to the food truck dashboard.">
<style>
:root{--cream:#FFF7EA;--paper:#FFFDF7;--ink:#23201B;--mut:#756C5E;--line:#EADFC8;--red:#D9402B}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:36px 32px;max-width:440px;text-align:center}
.mark{width:64px;height:64px;border-radius:18px;background:var(--red);display:inline-flex;align-items:center;justify-content:center;margin-bottom:18px}
.mark svg{width:40px;height:40px}
h1{font-size:30px;margin:0 0 10px;letter-spacing:-.02em}
p{color:var(--mut);margin:0 0 24px}
.btn{display:inline-block;background:var(--red);color:#fff;font-weight:700;font-size:16px;padding:13px 28px;border-radius:999px;text-decoration:none;touch-action:manipulation;margin:4px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button,.btn{touch-action:manipulation}
</style>
</head>
<body>
<div class="card">
<div class="mark" aria-hidden="true">
<svg viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="none"/>
<g fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
<path d="M60 200h260v150H60z"/><path d="M320 250h72l72 64v36h-144z"/>
<circle cx="150" cy="392" r="30"/><circle cx="372" cy="392" r="30"/></g></svg>
</div>
<h1>That page took a wrong turn</h1>
<p>We could not find the page you asked for. Your truck data is safe, it lives in the app, not here.</p>
<a class="btn" href="index.html">Back to Curbside</a>
<a class="btn ghost" href="app.html">Open the app</a>
</div>
</body>
</html>
