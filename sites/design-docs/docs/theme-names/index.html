<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: #070b1d; color: #e8edff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", sans-serif; }
  body { padding: 20px 16px 170px; max-width: 720px; margin: 0 auto; }
  body.notes-open { padding-bottom: 300px; }
  header h1 { font-size: 26px; font-weight: 800; }
  header h1 span { color: #46e0ff; }
  header p { color: #8b93b8; font-size: 14px; margin-top: 6px; line-height: 1.5; }
  .back { display: inline-block; color: #46e0ff; font-size: 14px; font-weight: 700; text-decoration: none; margin-bottom: 12px; touch-action: manipulation; }
  .notewrap { margin: 0; }
  .notetoggle { width: 100%; display: flex; align-items: center; gap: 10px; background: rgba(20,28,60,.55);
                border: 1px solid rgba(120,150,255,.25); border-radius: 14px; padding: 10px 12px;
                color: #e8edff; font-size: 14px; font-family: inherit; touch-action: manipulation; text-align: left; }
  .notelabel { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: #5a648c; flex: none; }
  .notepreview { flex: 1; color: #8b93b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .notepreview.has { color: #e8edff; }
  .notetoggle .go { color: #46e0ff; font-weight: 800; flex: none; }
  .notewrap.collapsed #docnotes { display: none; }
  .notewrap:not(.collapsed) .notetoggle { border-radius: 14px 14px 0 0; border-bottom: none; }
  .notewrap:not(.collapsed) #docnotes { border-radius: 0 0 14px 14px; }
  #docnotes { width: 100%; touch-action: manipulation; background: rgba(20,28,60,.55); border: 1px solid rgba(120,150,255,.25);
              border-radius: 14px; color: #e8edff; font-size: 16px; padding: 12px; font-family: inherit; resize: vertical; }
  #docnotes::placeholder { color: #5a648c; }
  #docnotes:focus { outline: none; border-color: #46e0ff; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; touch-action: manipulation; border: 1px solid rgba(120,150,255,.25); background: rgba(7,11,29,.5);
          color: #c4cdea; border-radius: 99px; padding: 9px 15px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .chip.sel { background: rgba(70,224,255,.16); border-color: #46e0ff; color: #fff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { touch-action: manipulation; position: relative; border: 1px solid rgba(120,150,255,.16);
          background: rgba(20,28,60,.55); border-radius: 14px; padding: 14px 12px; cursor: pointer;
          color: #e8edff; font-size: 15px; font-weight: 700; text-align: left; font-family: inherit; }
  .card:active { transform: scale(.96); }
  .card .star { position: absolute; top: 8px; right: 10px; font-size: 16px; color: rgba(120,150,255,.25); }
  .card.on { border-color: #ffc93d; background: rgba(255,201,61,.1); }
  .card.on .star { color: #ffc93d; }
  .card.hide { display: none; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: #0b1128;
           border-top: 1px solid rgba(120,150,255,.2); padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
           display: flex; flex-direction: column; gap: 8px; }
  footer .actions { display: flex; gap: 10px; align-items: center; }
  footer .prog { flex: 1; font-size: 13px; color: #8b93b8; }
  footer .prog b { color: #ffc93d; }
  footer button { touch-action: manipulation; border: none; border-radius: 12px; padding: 13px 16px;
                  font-size: 15px; font-weight: 800; cursor: pointer; }
  #copyBtn { background: linear-gradient(180deg, #3b82f6, #2563eb); color: #fff; }
  #clearBtn { background: rgba(120,150,255,.12); color: #8b93b8; }
  #copyBtn:active, #clearBtn:active { transform: scale(.96); }
  .toast { position: fixed; left: 50%; bottom: calc(158px + env(safe-area-inset-bottom));
           transform: translateX(-50%) translateY(12px) scale(.95);
           background: rgba(11,17,40,.96); color: #fff; border: 1px solid #3b82f6; border-radius: 99px;
           padding: 12px 22px; font-size: 14px; font-weight: 700; z-index: 100; opacity: 0;
           pointer-events: none; white-space: nowrap; transition: opacity .25s ease, transform .25s ease;
           box-shadow: 0 14px 36px rgba(0,0,0,.5); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  .toast .tick { color: #3b82f6; margin-right: 8px; font-weight: 800; }
</style>

<footer>
  <div class="notewrap collapsed" id="notewrap">
    <button class="notetoggle" id="notetoggle" aria-expanded="false">
      <span class="notelabel">NOTES</span>
      <span class="notepreview" id="notepreview">Tap to jot something down…</span>
      <span class="go" id="notego">Write</span>
    </button>
    <textarea id="docnotes" rows="3" placeholder="Anything on your mind about these names…"></textarea>
  </div>
  <div class="actions">
    <div class="prog" id="prog"><b>0</b> starred</div>
    <button id="clearBtn">Clear</button>
    <button id="copyBtn">Copy shortlist</button>
  </div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</footer>
<script>
const KEY = 'theme-name-sifter-v1';
let toastT = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = '<span class="tick">✓</span>' + msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2200);
}
let starred = [];
try { const raw = localStorage.getItem(KEY); if (raw) starred = JSON.parse(raw); } catch (e) {}
const grid = document.getElementById('grid');
const prog = document.getElementById('prog');
const NOTES_KEY = 'theme-name-sifter-v1-notes';
const docnotes = document.getElementById('docnotes');
try { const n = localStorage.getItem(NOTES_KEY); if (n) docnotes.value = n; } catch (e) {}
let noteT = null;
docnotes.addEventListener('input', () => {
  clearTimeout(noteT);
  noteT = setTimeout(() => { try { localStorage.setItem(NOTES_KEY, docnotes.value); } catch (e) {} }, 400);
  updatePreview();
});

// Collapsible notes: expanding focuses without scrolling the page away from the cards
const notewrap = document.getElementById('notewrap');
const notetoggle = document.getElementById('notetoggle');
const notepreview = document.getElementById('notepreview');
const notego = document.getElementById('notego');
let savedY = 0;
function updatePreview() {
  const t = docnotes.value.trim();
  notepreview.textContent = t ? t.split('\n')[0].slice(0, 60) : 'Tap to jot something down…';
  notepreview.classList.toggle('has', !!t);
}
function expandNotes() {
  if (!notewrap.classList.contains('collapsed')) return;
  savedY = window.scrollY;
  notewrap.classList.remove('collapsed');
  document.body.classList.add('notes-open');
  notetoggle.setAttribute('aria-expanded', 'true');
  notego.textContent = 'Done';
  try { docnotes.focus({ preventScroll: true }); } catch (e) { docnotes.focus(); }
}
function collapseNotes() {
  if (notewrap.classList.contains('collapsed')) return;
  notewrap.classList.add('collapsed');
  document.body.classList.remove('notes-open');
  notetoggle.setAttribute('aria-expanded', 'false');
  notego.textContent = 'Write';
  docnotes.blur();
  updatePreview();
  window.scrollTo(0, savedY);
}
notetoggle.addEventListener('click', () => {
  notewrap.classList.contains('collapsed') ? expandNotes() : collapseNotes();
});
// Direct taps: suppress iOS's native focus scroll (it scrolls to the footer's DOM
// position at the bottom of the page) and focus without scrolling instead.
// No scrollTo afterward — racing the keyboard animation breaks fixed positioning,
// and no scroll pinning — fighting iOS for the scroll locks the page.
docnotes.addEventListener('pointerdown', (e) => {
  if (document.activeElement === docnotes) return; // already focused: keep native caret placement
  e.preventDefault();
  savedY = window.scrollY;
  try { docnotes.focus({ preventScroll: true }); } catch (err) { docnotes.focus(); }
});
updatePreview();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(starred)); } catch (e) {}
  prog.innerHTML = '<b>' + starred.length + '</b> starred';
}
grid.querySelectorAll('.card').forEach(c => {
  const n = c.dataset.n;
  if (starred.includes(n)) c.classList.add('on');
  c.addEventListener('click', () => {
    const i = starred.indexOf(n);
    if (i >= 0) { starred.splice(i, 1); c.classList.remove('on'); }
    else { starred.push(n); c.classList.add('on'); }
    save();
  });
});
document.getElementById('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (!chip) return;
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('sel'));
  chip.classList.add('sel');
  const g = chip.dataset.g;
  grid.querySelectorAll('.card').forEach(c => {
    c.classList.toggle('hide', g !== 'all' && c.dataset.g !== g);
  });
});
document.getElementById('clearBtn').addEventListener('click', () => {
  if (!confirm('Clear all stars?')) return;
  starred = [];
  grid.querySelectorAll('.card.on').forEach(c => c.classList.remove('on'));
  save();
});
document.getElementById('copyBtn').addEventListener('click', async () => {
  let out = 'THEME NAME SHORTLIST\n\n' + starred.map((n, i) => (i + 1) + '. ' + n).join('\n');
  const notes = docnotes.value.trim();
  if (notes) out += '\n\nNOTES\n' + notes;
  try { await navigator.clipboard.writeText(out); showToast('Shortlist copied'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = out; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); showToast('Shortlist copied'); } catch (e2) { showToast('Copy failed'); }
    ta.remove();
  }
});
save();
</script>
