<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fall Foliage Simulator</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1220;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    touch-action: manipulation; overscroll-behavior: none; }
  #wrap { position: fixed; inset: 0; height: 100dvh; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; left: 0; right: 0; pointer-events: none; color: #fff;
    text-shadow: 0 1px 8px rgba(0,0,0,.45); }
  #top { top: 0; display: flex; justify-content: space-between; align-items: flex-start;
    padding: calc(10px + env(safe-area-inset-top)) 16px 0; }
  .title { font-size: 20px; font-weight: 800; letter-spacing: .5px; }
  .title small { display: block; font-size: 11px; font-weight: 500; opacity: .75; letter-spacing: 1.5px; text-transform: uppercase; }
  #phase { font-size: 13px; font-weight: 700; background: rgba(10,15,25,.45);
    border: 1px solid rgba(255,255,255,.18); padding: 6px 12px; border-radius: 999px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #hint { position: absolute; top: 76px; left: 0; right: 0; text-align: center;
    font-size: 14px; font-weight: 600; opacity: .9; transition: opacity .8s; }
  #hint.gone { opacity: 0; }
  #panel { bottom: 0; pointer-events: auto; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(8,12,22,.72), rgba(8,12,22,.28) 75%, transparent); }
  .card { background: rgba(12,18,30,.62); border: 1px solid rgba(255,255,255,.14);
    border-radius: 16px; padding: 10px 12px 12px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .daterow { display: flex; align-items: center; gap: 10px; }
  #dateLabel { font-size: 14px; font-weight: 800; min-width: 58px; color: #ffd98a; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 26px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px;
    background: linear-gradient(to right, #4a7c2f, #e8a020, #c23a1e, #6b5a4a); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px;
    border-radius: 50%; background: #fff; border: 2px solid #e8a020; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px;
    background: linear-gradient(to right, #4a7c2f, #e8a020, #c23a1e, #6b5a4a); }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%;
    background: #fff; border: 2px solid #e8a020; }
  #windRange::-webkit-slider-runnable-track { background: linear-gradient(to right, #3a5a8c, #7fb2e8); }
  #windRange::-moz-range-track { background: linear-gradient(to right, #3a5a8c, #7fb2e8); }
  .ctlrow { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .species { display: flex; gap: 6px; flex: 1; min-width: 200px; }
  .chip, #gust { border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08);
    color: #fff; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 8px 13px; }
  .chip.on { background: #e8a020; border-color: #e8a020; color: #201304; }
  .windctl { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 200px; }
  .windctl label { font-size: 12px; font-weight: 700; opacity: .8; }
  .windctl input { min-width: 80px; }
  #gust:active { transform: scale(.96); }
  #count { position: absolute; right: 16px; top: 120px; font-size: 12px; font-weight: 600;
    opacity: .8; background: rgba(10,15,25,.4); padding: 5px 10px; border-radius: 999px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="scene"></canvas>
  <div class="hud" id="top">
    <div class="title">🍂 Fall Foliage<small>simulator</small></div>
    <div id="phase">Peak Color</div>
  </div>
  <div class="hud" id="hint">Drag the date to travel through fall &rarr;</div>
  <div class="hud" id="count"></div>
  <div class="hud" id="panel">
    <div class="card">
      <div class="daterow">
        <div id="dateLabel">Oct 17</div>
        <input type="range" id="date" min="0" max="1000" value="420" aria-label="Date">
      </div>
      <div class="ctlrow">
        <div class="species" id="species">
          <button class="chip on" data-sp="maple">Sugar Maple</button>
          <button class="chip" data-sp="aspen">Aspen</button>
          <button class="chip" data-sp="oak">Oak</button>
        </div>
        <div class="windctl">
          <label for="windRange">Wind</label>
          <input type="range" id="windRange" min="0" max="100" value="25" aria-label="Wind">
          <button id="gust">🍃 Gust</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
/* ---------------- utils ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const lerpC=(c1,c2,t)=>[lerp(c1[0],c2[0],t)|0,lerp(c1[1],c2[1],t)|0,lerp(c1[2],c2[2],t)|0];
const css=(c,a)=>a===undefined?`rgb(${c[0]},${c[1]},${c[2]})`:`rgba(${c[0]},${c[1]},${c[2]},${a})`;
function sampleStops(stops,t){
  if(t<=stops[0][0])return stops[0][1];
  for(let i=1;i<stops.length;i++){
    if(t<=stops[i][0]){const p0=stops[i-1],p1=stops[i];const k=(t-p0[0])/(p1[0]-p0[0]);return lerpC(p0[1],p1[1],k);}
  }
  return stops[stops.length-1][1];
}

/* ---------------- species palettes ---------------- */
const SPECIES={
  maple:{leaf:1.0,turnShift:0,pal:[[0,[74,124,47]],[.35,[150,160,50]],[.55,[232,168,32]],[.7,[224,106,27]],[.85,[194,58,30]],[1,[122,63,26]]]},
  aspen:{leaf:.72,turnShift:-.06,pal:[[0,[86,140,60]],[.4,[200,190,70]],[.65,[242,202,62]],[.85,[236,182,52]],[1,[172,132,42]]]},
  oak:{leaf:1.28,turnShift:.09,pal:[[0,[70,110,45]],[.35,[140,130,55]],[.6,[172,92,42]],[.8,[142,56,32]],[1,[96,52,30]]]}
};
const SKY={
  top:[[0,[110,168,224]],[.5,[122,158,205]],[1,[138,150,168]]],
  bot:[[0,[205,232,246]],[.45,[245,214,160]],[.75,[232,200,160]],[1,[198,190,178]]]
};
const MEADOW={
  top:[[0,[104,148,72]],[.5,[150,150,80]],[1,[128,116,88]]],
  bot:[[0,[70,110,52]],[.5,[110,104,58]],[1,[86,78,60]]]
};

/* ---------------- state ---------------- */
const P={p:.42,wind:.25,species:'maple'};
let W=0,H=0,DPR=1,gy=0,horizon=0;
let tree=null,leaves=[],bgC=null,trunkC=null,litterC=null,vigC=null;
let particles=[],clouds=[],birds=[];
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);

function leafColor(leaf,p){
  const sp=SPECIES[P.species];
  const t=clamp((p-leaf.turn+.28)/.6,0,1);
  let c=sampleStops(sp.pal,t);
  if(leaf.j>0&&t>0)c=lerpC(c,[96,60,30],leaf.j*.3*t);
  return c;
}

/* ---------------- tree ---------------- */
function buildTree(rand){
  const gx=W*.5;
  const segs=[],anchors=[];
  (function branch(x,y,ang,len,w,depth){
    const x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len;
    segs.push({x1:x,y1:y,x2:x2,y2:y2,w:w});
    if(depth<=0||len<10){anchors.push({x:x2,y:y2,r:len*1.7+16});return;}
    const n=depth>3?3:(rand()<.65?2:3);
    for(let i=0;i<n;i++)branch(x2,y2,ang+(rand()-.5)*.95-.1,len*(.6+rand()*.2),w*.62,depth-1);
  })(gx,gy,-Math.PI/2,H*.30,Math.max(11,W*.017),6);
  return {segs:segs,anchors:anchors,gx:gx};
}
function buildLeaves(){
  const rand=mulberry32(987654);
  const sp=SPECIES[P.species];
  const N=clamp(Math.round(W*H/850),1400,3000);
  const per=N/tree.anchors.length;
  leaves=[];
  for(const a of tree.anchors){
    const n=Math.max(2,Math.round(per*(0.6+rand()*0.8)));
    for(let i=0;i<n;i++){
      const ox=(rand()+rand()+rand()-1.5)/1.5*a.r*1.15;
      const oy=(rand()+rand()+rand()-1.5)/1.5*a.r*.9;
      const turn=clamp(.10+rand()*.72+sp.turnShift,.02,.95);
      leaves.push({
        ax:a.x+ox,ay:a.y+oy,
        s:(2.2+rand()*2.6)*sp.leaf*(0.8+W/1400),
        r0:rand()*Math.PI,ph:rand()*Math.PI*2,
        turn:turn,land:turn+.05+rand()*.09,
        lx:tree.gx+(rand()-.5)*W*.55+ox*.4,
        ly:gy+rand()*(H-gy)*.92,
        j:rand()
      });
    }
  }
}

/* ---------------- static layers ---------------- */
function mkCanvas(){const c=document.createElement('canvas');c.width=W*DPR;c.height=H*DPR;const g=c.getContext('2d');g.scale(DPR,DPR);return[c,g];}
function renderTrunk(){
  const t=mkCanvas();trunkC=t[0];const g=t[1];
  g.lineCap='round';
  for(const s of tree.segs){
    const depthK=clamp(s.w/14,0,1);
    g.strokeStyle=css(lerpC([58,40,26],[112,80,50],depthK));
    g.lineWidth=Math.max(1,s.w);g.beginPath();g.moveTo(s.x1,s.y1);g.lineTo(s.x2,s.y2);g.stroke();
  }
  // bark strokes on the trunk
  const rand=mulberry32(4451);
  g.strokeStyle='rgba(30,20,12,.5)';g.lineWidth=1.5;
  for(const s of tree.segs){
    if(s.w<7)continue;
    for(let i=0;i<3;i++){
      const o=(rand()-.5)*s.w*.7;
      g.beginPath();g.moveTo(s.x1+o,s.y1);g.lineTo(s.x2+o*.6,s.y2);g.stroke();
    }
  }
}
function renderBg(){
  const t=mkCanvas();bgC=t[0];const g=t[1];const p=P.p;
  const rand=mulberry32(20260930);
  // sky
  const sky=g.createLinearGradient(0,0,0,horizon);
  sky.addColorStop(0,css(sampleStops(SKY.top,p)));sky.addColorStop(1,css(sampleStops(SKY.bot,p)));
  g.fillStyle=sky;g.fillRect(0,0,W,horizon+2);
  // sun
  const sx=W*.78,sy=H*.2;
  const glow=g.createRadialGradient(sx,sy,0,sx,sy,W*.22);
  glow.addColorStop(0,'rgba(255,240,200,.85)');glow.addColorStop(1,'rgba(255,240,200,0)');
  g.fillStyle=glow;g.fillRect(0,0,W,horizon);
  g.fillStyle='rgba(255,246,220,.95)';g.beginPath();g.arc(sx,sy,Math.max(18,W*.022),0,7);g.fill();
  // far hills
  g.fillStyle=css(lerpC([150,170,190],[170,160,150],p),.9);
  g.beginPath();g.ellipse(W*.25,horizon+6,W*.55,H*.16,0,Math.PI,0);g.fill();
  g.fillStyle=css(lerpC([130,155,175],[160,150,140],p),.95);
  g.beginPath();g.ellipse(W*.8,horizon+8,W*.5,H*.14,0,Math.PI,0);g.fill();
  // distant tree bands
  const sp=SPECIES[P.species];
  for(let band=0;band<2;band++){
    const by=horizon-6+band*H*.028,count=band?26:34;
    for(let i=0;i<count;i++){
      const x=rand()*W,y=by+rand()*H*.02,s=(band?7:5)+rand()*7;
      const tc=sampleStops(sp.pal,clamp((p-(.15+rand()*.55)+.28)/.6,0,1));
      const dark=lerpC(tc,band?[90,100,110]:[110,120,130],.45);
      g.fillStyle=css(dark,.95);
      for(let b=0;b<4;b++)g.beginPath(),g.ellipse(x+(rand()-.5)*s*1.6,y-s*.4-rand()*s*.5,s*.62,s*.5,0,0,7),g.fill();
    }
  }
  // meadow
  const mg=g.createLinearGradient(0,horizon,0,H);
  mg.addColorStop(0,css(sampleStops(MEADOW.top,p)));mg.addColorStop(1,css(sampleStops(MEADOW.bot,p)));
  g.fillStyle=mg;g.fillRect(0,horizon,W,H-horizon);
  // tree shadow
  const sh=g.createRadialGradient(tree.gx,gy+8,0,tree.gx,gy+8,W*.2);
  sh.addColorStop(0,'rgba(20,25,15,.35)');sh.addColorStop(1,'rgba(20,25,15,0)');
  g.fillStyle=sh;g.beginPath();g.ellipse(tree.gx,gy+10,W*.2,H*.035,0,0,7);g.fill();
}
function renderLitter(){
  const t=mkCanvas();litterC=t[0];const g=t[1];const p=P.p;
  let n=0;
  const order=[...leaves].sort((a,b)=>a.ly-b.ly);
  for(const leaf of order){
    if(leaf.land>p)continue;
    n++;
    const depth=clamp((leaf.ly-gy)/(H-gy),0,1);
    let c=leafColor(leaf,1);
    c=lerpC(c,[42,32,22],depth*.4);
    g.fillStyle=css(c,.92);
    g.beginPath();
    g.ellipse(leaf.lx,leaf.ly,leaf.s*(.7+depth*.7),leaf.s*(.5+depth*.5),leaf.r0,0,7);
    g.fill();
  }
  $('count').textContent=n>0?('🍂 '+n.toLocaleString()+' fallen'):'';
}
function renderVig(){
  const t=mkCanvas();vigC=t[0];const g=t[1];
  const v=g.createRadialGradient(W/2,H*.45,H*.35,W/2,H*.5,H*.95);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(8,8,16,.28)');
  g.fillStyle=v;g.fillRect(0,0,W,H);
}

/* ---------------- dynamic ---------------- */
function drawClouds(t){
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(const c of clouds){
    const x=((c.x+t*c.v*(0.4+P.wind*1.6))%(W+480))-240;
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.ellipse(x+c.ox[i],c.y+c.oy[i],c.s*(1-i*.16),c.s*.42*(1-i*.16),0,0,7);
      ctx.fill();
    }
  }
}
function drawBirds(t){
  ctx.strokeStyle='rgba(40,40,50,.55)';ctx.lineWidth=1.6;ctx.lineCap='round';
  for(const b of birds){
    const x=((b.x+t*b.v)%(W+200))-100,y=b.y+Math.sin(t*.8+b.ph)*8;
    ctx.beginPath();
    ctx.moveTo(x-7,y);ctx.quadraticCurveTo(x-2,y-4,x,y);
    ctx.quadraticCurveTo(x+2,y-4,x+7,y);ctx.stroke();
  }
}
function drawCanopy(t){
  const p=P.p,wind=P.wind;
  const swayA=.7+wind*2.6;
  for(const leaf of leaves){
    let x,y,rot;
    if(p<leaf.turn){
      x=leaf.ax+Math.sin(t*1.25+leaf.ph)*swayA;
      y=leaf.ay+Math.cos(t*.9+leaf.ph)*swayA*.5;
      rot=leaf.r0+Math.sin(t+leaf.ph)*.06;
    }else if(p<leaf.land){
      const k=(p-leaf.turn)/(leaf.land-leaf.turn),e=k*k;
      x=lerp(leaf.ax,leaf.lx,e)+Math.sin(e*10+leaf.ph)*10*(1-e*.4)+wind*36*e;
      y=lerp(leaf.ay,leaf.ly,e);
      rot=leaf.r0+e*5;
    }else continue;
    ctx.fillStyle=css(leafColor(leaf,p));
    ctx.beginPath();
    ctx.ellipse(x,y,leaf.s,leaf.s*.72,rot,0,7);
    ctx.fill();
  }
}
function spawnGust(){
  const attached=leaves.filter(l=>l.turn>P.p);
  const n=Math.min(110,attached.length);
  for(let i=0;i<n;i++){
    const l=attached[(Math.random()*attached.length)|0];
    particles.push({x:l.ax,y:l.ay,vx:(Math.random()-.3)*40,vy:-20-Math.random()*30,
      rot:l.r0,vr:(Math.random()-.5)*6,s:l.s,c:leafColor(l,P.p),landed:0,alpha:1});
  }
}
function updateParticles(dt){
  for(const q of particles){
    if(q.landed){q.alpha-=dt/2.2;continue;}
    q.vy=Math.min(q.vy+130*dt,46);
    q.vx+=Math.sin(q.y*.05+q.rot)*30*dt;
    q.x+=(q.vx+P.wind*90)*dt;q.y+=q.vy*dt;q.rot+=q.vr*dt;
    if(q.y>=gy+(q.x/W)*(H-gy)*.5&&q.y<=H){q.y=Math.min(q.y,H-4);q.landed=1;}
    if(q.x<-40||q.x>W+40)q.alpha=0;
  }
  particles=particles.filter(q=>q.alpha>0);
  for(const q of particles){
    ctx.fillStyle=css(q.c,clamp(q.alpha,0,1));
    ctx.beginPath();ctx.ellipse(q.x,q.y,q.s,q.s*.72,q.rot,0,7);ctx.fill();
  }
}
let ambientAcc=0;
function ambient(dt){
  ambientAcc+=dt;
  if(ambientAcc>.5){
    ambientAcc=0;
    if(Math.random()<P.wind*.55){
      const cand=leaves[(Math.random()*leaves.length)|0];
      if(cand&&cand.turn>P.p&&particles.length<160){
        particles.push({x:cand.ax,y:cand.ay,vx:(Math.random()-.5)*20,vy:0,
          rot:cand.r0,vr:(Math.random()-.5)*5,s:cand.s,c:leafColor(cand,P.p),landed:0,alpha:1});
      }
    }
  }
}

/* ---------------- main loop ---------------- */
let lastT=0;
function frame(now){
  const t=now/1000,dt=Math.min(.05,(now-lastT)/1000||.016);lastT=now;
  ctx.drawImage(bgC,0,0,W,H);
  drawClouds(t);drawBirds(t);
  ctx.drawImage(trunkC,0,0,W,H);
  ctx.drawImage(litterC,0,0,W,H);
  drawCanopy(t);
  updateParticles(dt);
  ambient(dt);
  ctx.drawImage(vigC,0,0,W,H);
  requestAnimationFrame(frame);
}

/* ---------------- build / resize ---------------- */
function buildAll(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  horizon=H*.62;gy=H*.82;
  const rand=mulberry32(777);
  tree=buildTree(rand);
  buildLeaves();
  clouds=[];for(let i=0;i<5;i++)clouds.push({x:rand()*W,y:H*(.08+rand()*.2),s:34+rand()*46,v:6+rand()*10,
    ox:[0,38,-36,18].map(v=>v*(0.7+rand()*.6)),oy:[0,-10,4,-16].map(v=>v*(0.7+rand()*.6))});
  birds=[];for(let i=0;i<3;i++)birds.push({x:rand()*W,y:H*(.12+rand()*.15),v:14+rand()*10,ph:rand()*7});
  renderTrunk();renderBg();renderLitter();renderVig();
  updateLabels();
}
let rsT=null;
window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(buildAll,200);});

/* ---------------- ui ---------------- */
function phaseName(p){
  if(p<.12)return 'Late Summer';if(p<.32)return 'Early Fall';
  if(p<.52)return 'Peak Color';if(p<.75)return 'Late Fall';return 'First Frost';
}
function updateLabels(){
  const d=new Date(new Date(2026,8,15).getTime()+P.p*76*864e5);
  $('dateLabel').textContent=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  $('phase').textContent=phaseName(P.p);
}
$('date').addEventListener('input',e=>{
  P.p=e.target.value/1000;
  $('hint').classList.add('gone');
  renderBg();renderLitter();updateLabels();
});
$('windRange').addEventListener('input',e=>{P.wind=e.target.value/100;});
$('gust').addEventListener('click',spawnGust);
$('species').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  document.querySelectorAll('#species .chip').forEach(c=>c.classList.remove('on'));
  b.classList.add('on');
  P.species=b.dataset.sp;
  buildLeaves();renderBg();renderLitter();
});

buildAll();
requestAnimationFrame(frame);
</script>
</body>
</html>
