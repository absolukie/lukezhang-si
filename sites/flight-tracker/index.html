<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Live Flight Map — watch real-time aircraft traffic around major US airports (SFO, LAX, JFK and more) on an interactive map. Free, no signup. Data: OpenSky Network." />
<meta name="theme-color" content="#0b1020" />
<meta property="og:title" content="Live Flight Map — real-time airport traffic" />
<meta property="og:description" content="Watch live aircraft around SFO, LAX, JFK and 27 more US airports on an interactive map. Free, no signup." />
<meta property="og:type" content="website" />
<title>Live Flight Map — real-time airport traffic</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header id="topbar">
  <div class="brand">
    <span class="brand-mark">&#9679;</span>
    <div>
      <h1>Live Flight Map</h1>
      <p class="subtitle">Real-time traffic around major US airports &middot; Data: <a href="https://opensky-network.org" target="_blank" rel="noopener">OpenSky Network</a></p>
    </div>
  </div>
  <div class="controls">
    <span id="conn-badge" class="badge" title="How flight data is being fetched">connecting&hellip;</span>
    <span id="updated" class="updated">never updated</span>
    <label class="toggle"><input type="checkbox" id="autorefresh" checked /> auto-refresh</label>
    <button id="refresh-btn" type="button">Refresh now</button>
  </div>
</header>

<div id="layout">
  <aside id="sidebar">
    <input id="airport-search" type="search" placeholder="Search airports (SFO, LAX, &hellip;)" autocomplete="off" />
    <h2>Airports</h2>
    <ul id="airport-list"></ul>
    <h2 id="flights-heading">Flights <span id="flight-count"></span></h2>
    <ul id="flight-list"><li class="muted">Select an airport to load live traffic.</li></ul>
  </aside>

  <main id="map-wrap">
    <div id="map"></div>
    <div id="stats" class="hidden">
      <div class="stat"><span class="stat-label">Airborne</span><span class="stat-value" id="stat-airborne">&ndash;</span></div>
      <div class="stat"><span class="stat-label">On ground</span><span class="stat-value" id="stat-ground">&ndash;</span></div>
      <div class="stat"><span class="stat-label">Avg altitude</span><span class="stat-value" id="stat-alt">&ndash;</span></div>
      <div class="stat"><span class="stat-label">Fastest</span><span class="stat-value" id="stat-speed">&ndash;</span></div>
    </div>
    <div id="banner" class="hidden"></div>
    <div id="legend">
      <span><i class="dot" style="background:#9aa0a6"></i>on ground</span>
      <span><i class="dot" style="background:#fbbc04"></i>&lt; 10k ft</span>
      <span><i class="dot" style="background:#34d399"></i>10&ndash;30k ft</span>
      <span><i class="dot" style="background:#38bdf8"></i>&gt; 30k ft</span>
    </div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
