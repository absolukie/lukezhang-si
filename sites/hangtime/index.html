<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Hangtime — Good friends. Great games.</title>
<meta name="description" content="Hangtime: three social party games in one app — Song Duel, How Well Do We Match?, and Random Side Quest.">
<meta name="theme-color" content="#0f0e17">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="brand-emoji">🎉</span><span class="brand-name">Hangtime</span></div>
    <button id="settings-btn" class="icon-btn" aria-label="Settings">⚙️</button>
  </header>

  <main id="views">
    <section class="view" id="view-home"></section>
    <section class="view" id="view-duel"></section>
    <section class="view" id="view-match"></section>
    <section class="view" id="view-quests"></section>
    <section class="view" id="view-settings"></section>
  </main>

  <nav id="tabbar">
    <button class="tab active" data-tab="home"><span class="tab-ico">🏠</span><span class="tab-label">Home</span></button>
    <button class="tab" data-tab="duel"><span class="tab-ico">🎵</span><span class="tab-label">Duel</span></button>
    <button class="tab" data-tab="match"><span class="tab-ico">💞</span><span class="tab-label">Match</span></button>
    <button class="tab" data-tab="quests"><span class="tab-ico">🗺️</span><span class="tab-label">Quests</span></button>
  </nav>
</div>

<canvas id="confetti-canvas"></canvas>
<div id="toast-root"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/songduel.js"></script>
<script src="js/match.js"></script>
<script src="js/sidequest.js"></script>
</body>
</html>
