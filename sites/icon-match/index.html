<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Icon Match</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#141311;color:#f2ede0;
  display:flex;flex-direction:column;align-items:center;padding:0 0 24px;}
header{width:100%;max-width:480px;display:flex;align-items:center;gap:10px;padding:14px 16px 6px;}
header h1{font-size:24px;margin:0;letter-spacing:.02em;}
header h1 span{color:#e8a33d;}
header .spacer{flex:1;}
.stat{background:#1d1b17;border:1px solid #3a362c;border-radius:12px;padding:6px 12px;text-align:center;}
.stat small{display:block;font-size:10px;color:#a39c88;letter-spacing:.08em;font-weight:600;}
.stat b{font-size:17px;font-variant-numeric:tabular-nums;}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid #3a362c;background:#1d1b17;
  display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;padding:0;}
.iconbtn:active{transform:scale(.93);}
.iconbtn svg{width:20px;height:20px;stroke:#f2ede0;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:380px;
  padding:14px 16px 6px;perspective:800px;}
.card{aspect-ratio:1;cursor:pointer;touch-action:manipulation;position:relative;
  transform-style:preserve-3d;transition:transform .38s cubic-bezier(.3,1.4,.5,1);}
.card.flipped{transform:rotateY(180deg);}
.card.matched{animation:pop .45s ease;}
@keyframes pop{0%{transform:rotateY(180deg) scale(1);}40%{transform:rotateY(180deg) scale(1.12);}100%{transform:rotateY(180deg) scale(1);}}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;border:1px solid #3a362c;}
.front{background:linear-gradient(145deg,#26231d,#1d1b17);}
.front svg{width:34%;height:34%;stroke:#6f695b;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.back{background:#26231d;transform:rotateY(180deg);}
.back img{width:62%;height:62%;pointer-events:none;filter:drop-shadow(0 0 6px rgba(232,163,61,.25));}
.card.matched .back{border-color:#e8a33d;box-shadow:0 0 16px rgba(232,163,61,.55);background:#2e2a1c;}
#hint{min-height:24px;font-size:14px;color:#a39c88;margin:6px 0 0;}
#hint b{color:#e8a33d;}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(20,19,17,.88);text-align:center;padding:24px;z-index:10;}
.overlay[hidden]{display:none;}
.overlay h2{font-size:34px;margin:0 0 8px;color:#e8a33d;}
.overlay p{color:#a39c88;margin:0 0 6px;font-size:15px;}
.overlay .big{font-size:20px;color:#f2ede0;font-weight:700;}
.startbtn{font-size:19px;font-weight:800;color:#141311;background:linear-gradient(180deg,#e8a33d,#c97f22);
  border:none;border-radius:16px;padding:15px 48px;cursor:pointer;touch-action:manipulation;margin-top:16px;
  box-shadow:0 4px 0 #8a5a17;}
.startbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #8a5a1e;}
footer{margin-top:auto;padding:18px 16px 0;font-size:12px;color:#6f695b;text-align:center;max-width:480px;}
</style>
</head>
<body>
<header>
  <h1>ICON<span> MATCH</span></h1>
  <div class="spacer"></div>
  <div class="stat"><small>MOVES</small><b id="moves">0</b></div>
  <div class="stat"><small>TIME</small><b id="time">0:00</b></div>
  <button class="iconbtn" id="mutebtn" aria-label="Mute sounds">
    <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="wav" d="M15.5 8.5a5 5 0 0 1 0 7"/><line class="mx" x1="4" y1="4" x2="20" y2="20" style="display:none"/></svg>
  </button>
  <button class="iconbtn" id="restartbtn" aria-label="Restart game">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
  </button>
</header>
<div id="board" role="grid" aria-label="Memory board"></div>
<p id="hint">Tap two cards. Matching pairs stay face up.</p>

<div class="overlay" id="title">
  <h2>ICON MATCH</h2>
  <p>16 cards, 8 pairs. Flip two at a time and clear the board in as few moves as you can.</p>
  <button class="startbtn" id="startbtn">PLAY</button>
</div>
<div class="overlay" id="win" hidden>
  <h2>CLEARED</h2>
  <p class="big"><span id="winmoves">0</span> moves · <span id="wintime">0:00</span></p>
  <p id="winquip">Not bad. The icons are judging you silently.</p>
  <button class="startbtn" id="againbtn">PLAY AGAIN</button>
</div>

<footer>Icons: Lorc &amp; Delapouite via game-icons.net, CC BY 3.0</footer>

<script>
(function(){
"use strict";
var ICONS=['broadsword','bordered-shield','skull-crack','potion-ball','crown','ghost','rocket','heart-beats'];
var board=document.getElementById('board'),movesEl=document.getElementById('moves'),timeEl=document.getElementById('time');
var hint=document.getElementById('hint');
var first=null,lock=false,moves=0,matched=0,started=false,timer=null,secs=0;
var muted=false,AC=null;
function beep(f,d){if(muted)return;try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function fmt(s){return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function build(){
  board.innerHTML='';var deck=shuffle(ICONS.concat(ICONS));
  deck.forEach(function(name){
    var c=document.createElement('div');c.className='card';c.setAttribute('role','gridcell');
    c.dataset.icon=name;
    c.innerHTML='<div class="face front"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg></div>'+
      '<div class="face back"><img src="assets/'+name+'.svg" alt="'+name+'"></div>';
    c.addEventListener('click',function(){flip(c);});
    board.appendChild(c);});
}
function start(){
  document.getElementById('title').hidden=true;
  document.getElementById('win').hidden=true;
  build();first=null;lock=false;moves=0;matched=0;secs=0;started=true;
  movesEl.textContent='0';timeEl.textContent='0:00';
  hint.innerHTML='Tap two cards. Matching pairs stay face up.';
  clearInterval(timer);timer=setInterval(function(){secs++;timeEl.textContent=fmt(secs);},1000);
}
function flip(c){
  if(lock||c.classList.contains('flipped')||!started)return;
  c.classList.add('flipped');beep(440,0.07);
  if(!first){first=c;return;}
  moves++;movesEl.textContent=moves;lock=true;
  var a=first,b=c;first=null;
  if(a.dataset.icon===b.dataset.icon){
    setTimeout(function(){
      a.classList.add('matched');b.classList.add('matched');
      beep(660,0.1);setTimeout(function(){beep(880,0.12);},90);
      matched+=2;lock=false;
      hint.innerHTML='Nice. <b>'+(8-matched/2)+'</b> pairs left.';
      if(matched===16)win();
    },320);
  }else{
    setTimeout(function(){
      a.classList.remove('flipped');b.classList.remove('flipped');lock=false;
    },750);
  }
}
var QUIPS=['Not bad. The icons are judging you silently.',
  'Clean sweep. Somewhere, a game designer nods.',
  'Done. Your memory is suspiciously good today.'];
function win(){
  clearInterval(timer);started=false;beep(523,0.12);
  setTimeout(function(){beep(659,0.12);},120);setTimeout(function(){beep(784,0.2);},240);
  document.getElementById('winmoves').textContent=moves;
  document.getElementById('wintime').textContent=fmt(secs);
  document.getElementById('winquip').textContent=QUIPS[Math.floor(Math.random()*QUIPS.length)];
  setTimeout(function(){document.getElementById('win').hidden=false;},450);
}
document.getElementById('startbtn').addEventListener('click',start);
document.getElementById('againbtn').addEventListener('click',start);
document.getElementById('restartbtn').addEventListener('click',function(){if(started||matched>0)start();});
document.getElementById('mutebtn').addEventListener('click',function(){
  muted=!muted;var b=this;
  b.querySelector('.wav').style.display=muted?'none':'';
  b.querySelector('.mx').style.display=muted?'':'none';
  b.setAttribute('aria-label',muted?'Unmute sounds':'Mute sounds');});
build();
})();
</script>
</body>
</html>
