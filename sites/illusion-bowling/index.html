<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Illusion Bowling</title>
<style>
  :root{
    --bg:#d9cfbc; --ink:#2b2620; --yellow:#f6c945; --red:#e23b3b;
    --card:#f4efe4; --muted:#8a7f6a;
  }
  *{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
  html,body{ height:100%; margin:0; overscroll-behavior:none; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; justify-content:center;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
  }
  #app{ position:relative; width:100%; max-width:560px; height:100dvh; overflow:hidden; }
  #stage{ position:absolute; inset:0; }
  #stage canvas{ display:block; width:100% !important; height:100% !important; }

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; top:0; left:0; right:0; z-index:5;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top)) 14px 0;
    pointer-events:none;
  }
  .hud-box{ background:rgba(244,239,228,.88); border-radius:14px; padding:8px 12px;
    box-shadow:0 2px 10px rgba(43,38,32,.08); backdrop-filter:blur(4px); }
  #levelName{ font-weight:800; font-size:16px; letter-spacing:.02em; }
  #levelSub{ font-size:12px; color:var(--muted); margin-top:1px; max-width:200px; }
  #scoreBox{ text-align:right; }
  #score{ font-weight:800; font-size:20px; font-variant-numeric:tabular-nums; }
  #best{ font-size:11px; color:var(--muted); font-weight:600; }
  #pips{ display:flex; gap:6px; margin-top:6px; justify-content:flex-end; }
  .pip{ width:14px; height:20px; border-radius:7px 7px 9px 9px; background:#fff;
    border:2px solid var(--ink); opacity:.9; transition:all .25s; }
  .pip.hit{ background:var(--red); border-color:var(--red); transform:scale(.92); opacity:.55; }
  .pip.next{ animation:pipPulse 1s ease-in-out infinite; }
  @keyframes pipPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.18);} }

  /* ---------- cards ---------- */
  .card{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.96);
    width:min(86%, 380px); background:var(--card); border-radius:22px; z-index:10;
    padding:26px 24px 22px; text-align:center;
    box-shadow:0 18px 50px rgba(43,38,32,.22);
    opacity:0; pointer-events:none; transition:opacity .28s, transform .28s;
  }
  .card.show{ opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
  .kicker{ font-size:12px; font-weight:800; letter-spacing:.18em; color:var(--muted); }
  .card h1{ margin:8px 0 4px; font-size:30px; font-weight:900; letter-spacing:-.01em; }
  .card p{ margin:6px 0; font-size:16px; line-height:1.45; }
  .twist{ display:inline-block; margin-top:10px; font-size:14px; font-weight:700;
    background:#fff3d6; border:2px dashed var(--yellow); border-radius:12px; padding:8px 12px; }
  .tap-hint{ margin-top:16px; font-size:13px; font-weight:800; letter-spacing:.12em; color:var(--muted);
    animation:pipPulse 1.4s ease-in-out infinite; }
  .btnrow{ display:flex; gap:10px; margin-top:18px; }
  .btn{
    flex:1; font-size:17px; font-weight:800; border:none; border-radius:14px;
    padding:14px 0; cursor:pointer; touch-action:manipulation; color:var(--ink);
    background:#e8e0cd;
  }
  .btn.primary{ background:var(--red); color:#fff; box-shadow:0 6px 18px rgba(226,59,59,.35); }
  .btn:active{ transform:scale(.97); }
  #perfectBadge{
    display:none; margin:10px auto 0; font-size:15px; font-weight:900; letter-spacing:.14em;
    color:#fff; background:var(--red); border-radius:999px; padding:8px 18px; width:fit-content;
    animation:pipPulse .9s ease-in-out infinite;
  }
  #newBestBadge{ display:none; margin:8px auto 0; font-size:13px; font-weight:800; color:#7a5b00;
    background:var(--yellow); border-radius:999px; padding:6px 14px; width:fit-content; }

  /* ---------- release button ---------- */
  #releaseBtn{
    position:absolute; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    z-index:6; font-size:18px; font-weight:900; letter-spacing:.1em; color:#fff;
    background:var(--red); border:none; border-radius:999px; padding:16px 44px; cursor:pointer;
    box-shadow:0 10px 26px rgba(226,59,59,.4); touch-action:manipulation;
    display:none;
  }
  #releaseBtn.show{ display:block; animation:pipPulse 1.6s ease-in-out infinite; }
  #releaseBtn:active{ transform:translateX(-50%) scale(.96); }

  /* ---------- connect pop ---------- */
  #connectPop{
    position:absolute; z-index:8; transform:translate(-50%,-50%) scale(.5);
    font-size:22px; font-weight:900; letter-spacing:.1em; color:var(--ink);
    background:var(--yellow); padding:8px 16px; border-radius:999px;
    box-shadow:0 6px 20px rgba(43,38,32,.25); opacity:0; pointer-events:none;
  }
  #connectPop.pop{ animation:cpop .8s ease-out forwards; }
  @keyframes cpop{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.5); }
    25%{ opacity:1; transform:translate(-50%,-60%) scale(1.12); }
    70%{ opacity:1; transform:translate(-50%,-75%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-95%) scale(.95); }
  }

  #version{
    position:absolute; bottom:calc(8px + env(safe-area-inset-bottom)); left:12px; z-index:5;
    font-size:10px; font-weight:700; letter-spacing:.08em; color:var(--muted); pointer-events:none;
  }
  #credit{
    position:absolute; bottom:calc(8px + env(safe-area-inset-bottom)); right:12px; z-index:5;
    font-size:10px; font-weight:600; color:var(--muted); pointer-events:none;
  }
  #devbar{
    position:absolute; top:calc(84px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    z-index:20; display:none; gap:6px; background:rgba(43,38,32,.85); padding:8px 10px; border-radius:12px;
  }
  #devbar.show{ display:flex; }
  #devbar button{
    font-size:14px; font-weight:800; border:none; border-radius:8px; padding:8px 10px;
    background:#f4efe4; color:var(--ink); cursor:pointer; touch-action:manipulation;
  }
  #devbar button.cur{ background:var(--yellow); }
</style>

<body>
<div id="app">
  <div id="stage"></div>

  <div id="hud">
    <div class="hud-box">
      <div id="levelName">—</div>

    </div>
    <div class="hud-box" id="scoreBox">

  </div>

  <div class="card" id="introCard">
    <div class="kicker" id="introKicker">LEVEL 1 / 5</div>

    </div>

<script type="module">
import * as THREE from 'three';
import {
  makeFrame, buildLevels, specPoint, pinHitPos, pinRest,
  BALL_R, PIN_H, HIT_R, PERFECT_BONUS, POINTS_PER_PIN,
} from './logic.mjs';

/* ================= audio (synthesized, no files) ================= */
let AC = null, _noise = null;
function ac() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function noiseBuf(c) {
  if (_noise) return _noise;
  const b = c.createBuffer(1, c.sampleRate * 0.5, c.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return (_noise = b);
}
function knock() {
  try {
    const c = ac(), t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(330, t);
    o.frequency.exponentialRampToValueAtTime(85, t + 0.13);
    g.gain.setValueAtTime(0.55, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.2);
    const ns = c.createBufferSource(); ns.buffer = noiseBuf(c);
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 1.1;
    const ng = c.createGain();
    ng.gain.setValueAtTime(0.4, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    ns.connect(bp); bp.connect(ng); ng.connect(c.destination);
    ns.start(t); ns.stop(t + 0.1);
  } catch (e) {}
}
function whoosh() {
  try {
    const c = ac(), t = c.currentTime;
    const ns = c.createBufferSource(); ns.buffer = noiseBuf(c); ns.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 2;
    lp.frequency.setValueAtTime(300, t);
    lp.frequency.exponentialRampToValueAtTime(2400, t + 0.35);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.12);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    ns.connect(lp); lp.connect(g); g.connect(c.destination);
    ns.start(t); ns.stop(t + 0.55);
  } catch (e) {}
}
function perfectJingle() {
  try {
    const c = ac(), t = c.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const st = t + i * 0.09;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.3, st + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.28);
      o.connect(g); g.connect(c.destination); o.start(st); o.stop(st + 0.3);
    });
  } catch (e) {}
}
function connectBlip() {
  try {
    const c = ac(), t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(1760, t + 0.09);
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.16);
  } catch (e) {}
}
function uiClick() {
  try {
    const c = ac(), t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'square'; o.frequency.value = 660;
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.07);
  } catch (e) {}
}

/* ================= three setup (locked orthographic camera) ================= */
const frame = makeFrame({ az: 32, el: 26, target: [0, 0.3, 0] });
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
stage.appendChild(renderer.domElement);

const VIEW_H = 8;
const camera = new THREE.OrthographicCamera(-1, 1, VIEW_H, -VIEW_H, 0.1, 100);
const camBase = new THREE.Vector3(
  frame.T[0] - frame.d[0] * 30,
  frame.T[1] - frame.d[1] * 30,
  frame.T[2] - frame.d[2] * 30
);
camera.position.copy(camBase);
camera.up.set(frame.u[0], frame.u[1], frame.u[2]);
camera.lookAt(frame.T[0], frame.T[1], frame.T[2]);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9cfbc);
scene.add(new THREE.HemisphereLight(0xfff6e8, 0xc9bda4, 1.05));
const sun = new THREE.DirectionalLight(0xffffff, 1.35);
sun.position.set(6, 12, 7);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.15));

const MAT = {
  track: new THREE.MeshStandardMaterial({ color: 0xf6c945, roughness: 0.85, metalness: 0 }),
  ball: new THREE.MeshStandardMaterial({ color: 0xe23b3b, roughness: 0.28, metalness: 0.05 }),
  pinWhite: new THREE.MeshStandardMaterial({ color: 0xf7f4ec, roughness: 0.5, metalness: 0 }),
  pinRed: new THREE.MeshStandardMaterial({ color: 0xe23b3b, roughness: 0.5, metalness: 0 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x2b2620, roughness: 0.9 }),
};

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  const a = w / h, halfW = VIEW_H * a;
  camera.left = -halfW; camera.right = halfW;
  camera.top = VIEW_H; camera.bottom = -VIEW_H;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

/* ================= mesh builders ================= */
const _v = (p) => new THREE.Vector3(p[0], p[1], p[2]);

function addBeamMesh(group, bm) {
  const A = _v(specPoint(frame, [bm.a[0], bm.a[1], bm.za, bm.ya]));
  const B = _v(specPoint(frame, [bm.b[0], bm.b[1], bm.zb, bm.yb]));
  const dir = B.clone().sub(A);
  const len = dir.length() + bm.w * 0.6;
  dir.normalize();
  const geo = new THREE.BoxGeometry(len, bm.h, bm.w);
  const m = new THREE.Mesh(geo, MAT.track);
  // basis: x=dir, y≈world-up ⊥ dir, z = x×y
  const up = new THREE.Vector3(0, 1, 0);
  let yA = up.clone().sub(dir.clone().multiplyScalar(up.dot(dir)));
  if (yA.lengthSq() < 1e-6) yA = new THREE.Vector3(frame.r[0], frame.r[1], frame.r[2]);
  yA.normalize();
  const zA = new THREE.Vector3().crossVectors(dir, yA).normalize();
  const mtx = new THREE.Matrix4().makeBasis(dir, yA, zA);
  m.quaternion.setFromRotationMatrix(mtx);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  group.add(m);
  return m;
}

function addBoxMesh(group, bx) {
  const c = _v(specPoint(frame, [bx.c[0], bx.c[1], bx.z, 0]));
  c.y = bx.y;
  const geo = new THREE.BoxGeometry(bx.size[0], bx.size[1], bx.size[2]);
  const m = new THREE.Mesh(geo, MAT.track);
  m.position.copy(c);
  group.add(m);
  return m;
}

function pinProfile() {
  const p = [
    [0.001, 0], [0.30, 0], [0.30, 0.06], [0.24, 0.18], [0.185, 0.38],
    [0.155, 0.55], [0.152, 0.60], [0.168, 0.68], [0.225, 0.80],
    [0.235, 0.88], [0.20, 0.97], [0.12, 1.03], [0.001, 1.05],
  ].map(([x, y]) => new THREE.Vector2(x, y));
  return new THREE.LatheGeometry(p, 28);
}
const PIN_GEO = pinProfile();

function makePinMesh(kind) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(PIN_GEO, MAT.pinWhite.clone());
  g.add(body);
  const s1 = new THREE.Mesh(new THREE.CylinderGeometry(0.163, 0.158, 0.055, 24), MAT.pinRed.clone());
  s1.position.y = 0.615; g.add(s1);
  const s2 = new THREE.Mesh(new THREE.CylinderGeometry(0.182, 0.176, 0.055, 24), MAT.pinRed.clone());
  s2.position.y = 0.70; g.add(s2);
  g.userData.parts = [body, s1, s2];
  return g;
}

/* ---- particles: red bursts ---- */
const bursts = [];
function burst(pos, n = 34, spread = 3.4) {
  const geo = new THREE.BufferGeometry();
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    arr[i * 3] = pos.x; arr[i * 3 + 1] = pos.y; arr[i * 3 + 2] = pos.z;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xe23b3b, size: 0.17, transparent: true, opacity: 1, depthWrite: false,
  });
  const pts = new THREE.Points(geo, mat);
  const vel = [];
  for (let i = 0; i < n; i++) {
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    const sp = spread * (0.35 + Math.random() * 0.65);
    vel.push(new THREE.Vector3(
      Math.sin(ph) * Math.cos(th) * sp,
      Math.abs(Math.cos(ph)) * sp * 0.9 + 1.2,
      Math.sin(ph) * Math.sin(th) * sp
    ));
  }
  scene.add(pts);
  bursts.push({ pts, vel, t: 0, life: 0.85 });
}
function updateBursts(dt) {
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    b.t += dt;
    const pos = b.pts.geometry.attributes.position;
    for (let j = 0; j < b.vel.length; j++) {
      b.vel[j].y -= 11 * dt;
      pos.array[j * 3] += b.vel[j].x * dt;
      pos.array[j * 3 + 1] += b.vel[j].y * dt;
      pos.array[j * 3 + 2] += b.vel[j].z * dt;
    }
    pos.needsUpdate = true;
    b.pts.material.opacity = Math.max(0, 1 - b.t / b.life);
    if (b.t >= b.life) {
      scene.remove(b.pts);
      b.pts.geometry.dispose(); b.pts.material.dispose();
      bursts.splice(i, 1);
    }
  }
}

/* ---- expanding ring pulses (impacts + CONNECT joints) ---- */
const pulses = [];
function pulse(worldPos, color = 0xe23b3b, maxR = 1.4, life = 0.55) {
  const geo = new THREE.RingGeometry(0.42, 0.55, 40);
  const mat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthWrite: false,
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(worldPos.x, worldPos.y, worldPos.z);
  // face the camera
  m.quaternion.copy(camera.quaternion);
  scene.add(m);
  pulses.push({ m, t: 0, life, maxR });
}
function updatePulses(dt) {
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.t += dt;
    const k = p.t / p.life;
    const s = 0.4 + k * p.maxR;
    p.m.scale.set(s, s, s);
    p.m.material.opacity = Math.max(0, 0.95 * (1 - k));
    if (k >= 1) {
      scene.remove(p.m);
      p.m.geometry.dispose(); p.m.material.dispose();
      pulses.splice(i, 1);
    }
  }
}

/* ================= game state ================= */
const DEV = new URLSearchParams(location.search).get('dev') === '1';
const levels = buildLevels(frame);
let li = 0;                       // level index
let levelGroup = null;
let ball = null, ballS = 0;
let state = 'intro';              // intro | rolling | done
let clock = 0, tRelease = 0;
let pins = [];                    // {spec, group, hit, fly, vel, angVel, age, restBase}
let hitSet = new Set();
let score = 0, runScore = 0;
let shake = 0;
let trailMeshes = [];
let trailHist = [];
let nextRing = null;
let connectsFired = new Set();
let totalScore = 0;

const $ = (id) => document.getElementById(id);
const store = {
  best() { return +(localStorage.getItem('ib_best') || 0); },
  levelBest(id) { return +(localStorage.getItem('ib_best_' + id) || 0); },
  save(total, id, sc) {
    if (total > this.best()) localStorage.setItem('ib_best', total);
    if (sc > this.levelBest(id)) { localStorage.setItem('ib_best_' + id, sc); return true; }
    return false;
  },
};

function clearLevel() {
  if (levelGroup) {
    scene.remove(levelGroup);
    levelGroup.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material && o.material !== MAT.track && o.material !== MAT.ball &&
          o.material !== MAT.pinWhite && o.material !== MAT.pinRed && o.material !== MAT.dark)
        o.material.dispose && o.material.dispose();
    });
  }
  for (const b of bursts) { scene.remove(b.pts); }
  bursts.length = 0;
  for (const p of pulses) { scene.remove(p.m); }
  pulses.length = 0;
  trailMeshes = []; trailHist = [];
  pins = []; hitSet = new Set(); connectsFired = new Set();
  nextRing = null; shake = 0;
}

function loadLevel(i) {
  clearLevel();
  li = ((i % levels.length) + levels.length) % levels.length;
  const L = levels[li];
  levelGroup = new THREE.Group();
  scene.add(levelGroup);

  for (const bm of L.beams) addBeamMesh(levelGroup, bm);
  for (const bx of L.boxes) addBoxMesh(levelGroup, bx);

  // ball
  ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 40, 28), MAT.ball);
  ballS = 0;
  placeBall(0);
  levelGroup.add(ball);

  // pins
  for (const spec of L.pins) {
    const g = makePinMesh(spec.kind);
    const rec = { spec, group: g, hit: false, fly: false, vel: new THREE.Vector3(), angVel: new THREE.Vector3(), age: 0 };
    if (spec.kind === 'pendulum') {
      // swing group at pivot; rod + hanging pin as children
      const sg = new THREE.Group();
      sg.position.set(spec.pivot[0], spec.pivot[1], spec.pivot[2]);
      const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, spec.len, 10), MAT.dark);
      rod.position.y = -spec.len / 2;
      sg.add(rod);
      g.position.y = -spec.len - PIN_H;
      sg.add(g);
      levelGroup.add(sg);
      rec.swing = sg;
      rec.base = new THREE.Vector3(spec.pivot[0], spec.pivot[1] - spec.len - PIN_H, spec.pivot[2]);
    } else {
      g.position.set(spec.base[0], spec.base[1], spec.base[2]);
      levelGroup.add(g);
      rec.base = new THREE.Vector3(spec.base[0], spec.base[1], spec.base[2]);
    }
    pins.push(rec);
  }

  // next-pin highlight ring
  const rg = new THREE.RingGeometry(0.5, 0.66, 40);
  nextRing = new THREE.Mesh(rg, new THREE.MeshBasicMaterial({
    color: 0xe23b3b, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false,
  }));
  nextRing.rotation.x = -Math.PI / 2;
  levelGroup.add(nextRing);

  // trail ghosts (gap level)
  if (L.trail) {
    for (let k = 0; k < 16; k++) {
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(BALL_R * (1 - k / 22), 14, 10),
        new THREE.MeshBasicMaterial({ color: 0xe23b3b, transparent: true, opacity: 0.32 * (1 - k / 16), depthWrite: false })
      );
      m.visible = false;
      scene.add(m);
      trailMeshes.push(m);
    }
  }

  // HUD
  $('levelName').textContent = `LEVEL ${li + 1} — ${L.name}`;
  $('levelSub').textContent = L.sub;
  renderPips();
  updateScore(0);
  $('best').textContent = 'BEST ' + store.best();

  // intro card
  $('introKicker').textContent = `LEVEL ${li + 1} / ${levels.length}`;
  $('introName').textContent = L.name;
  $('introSub').textContent = L.sub;
  $('introTwist').textContent = L.twist;
  $('introCard').classList.add('show');
  $('doneCard').classList.remove('show');
  $('releaseBtn').classList.add('show');
  state = 'intro';
  clock = 0;
  if (DEV) markDevCur();
}

function renderPips() {
  const L = levels[li];
  const el = $('pips');
  el.innerHTML = '';
  L.pins.forEach((p, idx) => {
    const d = document.createElement('div');
    d.className = 'pip' + (hitSet.has(p.id) ? ' hit' : (idx === nextPinIndex() ? ' next' : ''));
    el.appendChild(d);
  });
}
function nextPinIndex() {
  const L = levels[li];
  return L.pins.findIndex((p) => !hitSet.has(p.id));
}
function updateScore(sc) {
  runScore = sc;
  $('score').textContent = sc + totalScoreBefore();
}
function totalScoreBefore() {
  let t = 0;
  for (let i = 0; i < li; i++) t += +(localStorage.getItem('ib_run_' + levels[i].id) || 0);
  return t;
}

function placeBall(s) {
  const L = levels[li];
  const { pos } = L.path.at(Math.min(s, L.path.length));
  ball.position.set(pos[0], pos[1], pos[2]);
}

function release() {
  if (state !== 'intro') return;
  uiClick();
  ac(); // unlock audio on gesture
  state = 'rolling';
  tRelease = clock;
  ballS = 0;
  whoosh();
  $('introCard').classList.remove('show');
  $('releaseBtn').classList.remove('show');
}

function hitPin(rec) {
  rec.hit = true; rec.fly = true; rec.age = 0;
  hitSet.add(rec.spec.id);
  const bp = ball.position;
  const dir = new THREE.Vector3().subVectors(rec.group.getWorldPosition(new THREE.Vector3()), bp);
  dir.y = 0; dir.normalize();
  const L = levels[li];
  const tan = L.path.at(Math.min(ballS, L.path.length)).tan;
  rec.vel.set(tan[0] * 4.2 + dir.x * 2.2, 3.4 + Math.random() * 1.2, tan[2] * 4.2 + dir.z * 2.2);
  rec.angVel.set((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 14);
  const wp = rec.group.getWorldPosition(new THREE.Vector3());
  burst(wp, 36, 3.6);
  pulse(wp, 0xe23b3b, 1.5, 0.5);
  shake = Math.min(0.5, shake + 0.32);
  knock();
  updateScore(runScore + POINTS_PER_PIN);
  renderPips();
}

function finishRoll() {
  state = 'done';
  const L = levels[li];
  const cleared = hitSet.size === L.pins.length;
  let sc = runScore;
  const perfect = cleared && L.pins.length > 0;
  if (perfect) { sc += PERFECT_BONUS; perfectJingle(); }
  else uiClick();
  localStorage.setItem('ib_run_' + L.id, sc);
  const grand = totalScoreBefore() + sc;
  const isBest = store.save(grand, L.id, sc);

  $('doneKicker').textContent = cleared ? `LEVEL ${li + 1} CLEAR` : `LEVEL ${li + 1} — SO CLOSE`;
  $('doneTitle').textContent = cleared
    ? ['Smashed it.', 'Clean.', 'Buttery.', 'Impossible? Never heard of her.'][li % 4]
    : 'Missed a pin.';
  $('perfectBadge').style.display = perfect ? 'block' : 'none';
  $('newBestBadge').style.display = isBest ? 'block' : 'none';
  $('doneScore').textContent = `${hitSet.size}/${L.pins.length} pins · ${sc} pts`;
  $('nextBtn').textContent = li === levels.length - 1 ? (cleared ? 'PLAY AGAIN' : 'NEXT') : 'NEXT';
  $('nextBtn').style.display = cleared ? 'block' : 'none';
  $('doneCard').classList.add('show');
  $('releaseBtn').classList.remove('show');
  updateScore(sc);
  $('best').textContent = 'BEST ' + store.best();
}

/* ---- per-frame ---- */
const _axis = new THREE.Vector3(), _tan = new THREE.Vector3(), _up = new THREE.Vector3(0, 1, 0);
let lastT = performance.now();

function tick() {
  requestAnimationFrame(tick);
  const now = performance.now();
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  const L = levels[li];
  clock += dt;

  if (state === 'rolling') {
    ballS += L.speed * dt;
    if (ballS >= L.path.length) { placeBall(L.path.length); finishRoll(); }
    else {
      const { pos, tan } = L.path.at(ballS);
      ball.position.set(pos[0], pos[1], pos[2]);
      _tan.set(tan[0], tan[1], tan[2]);
      _axis.crossVectors(_up, _tan);
      if (_axis.lengthSq() > 1e-6) {
        _axis.normalize();
        ball.rotateOnWorldAxis(_axis, (L.speed * dt) / BALL_R);
      }
      // trail
      if (L.trail && ballS > L.trail.s0 && ballS < L.trail.s1) {
        trailHist.unshift(ball.position.clone());
        if (trailHist.length > 40) trailHist.pop();
      }
      // connect joints
      L.connects.forEach((cs, ci) => {
        if (!connectsFired.has(ci) && ballS >= cs) {
          connectsFired.add(ci);
          pulse(ball.position.clone(), 0xf6c945, 2.0, 0.6);
          connectBlip();
          if (L.connectText) showConnectPop();
        }
      });
      // pin collisions
      for (const rec of pins) {
        if (rec.hit) continue;
        const hp = pinHitPos(rec.spec, clock);
        const dx = ball.position.x - hp[0], dy = ball.position.y - hp[1], dz = ball.position.z - hp[2];
        if (dx * dx + dy * dy + dz * dz < HIT_R * HIT_R) hitPin(rec);
      }
    }
  }

  // pins: pendulum swing + knock physics
  for (const rec of pins) {
    if (rec.spec.kind === 'pendulum' && !rec.fly) {
      const sp = rec.spec;
      const ang = sp.amp * Math.sin(2 * Math.PI * sp.freq * clock + sp.phase);
      rec.swing.setRotationFromAxisAngle(new THREE.Vector3(sp.axis[0], sp.axis[1], sp.axis[2]), ang);
    }
    if (rec.fly) {
      rec.age += dt;
      const g = rec.group;
      // detach pendulum pins from swing group on first fly frame
      if (rec.swing && g.parent === rec.swing) {
        const wp = g.getWorldPosition(new THREE.Vector3());
        rec.swing.remove(g);
        levelGroup.add(g);
        g.position.copy(wp);
        rec.vel.y += 1.5;
      }
      rec.vel.y -= 12 * dt;
      g.position.addScaledVector(rec.vel, dt);
      g.rotateOnWorldAxis(_axis.set(rec.angVel.x, rec.angVel.y, rec.angVel.z).normalize(), rec.angVel.length() * dt);
      if (rec.age > 1.5) {
        const k = Math.min(1, (rec.age - 1.5) / 0.4);
        g.userData.parts.forEach((m) => { m.material.transparent = true; m.material.opacity = 1 - k; });
        if (k >= 1) { g.visible = false; rec.fly = false; }
      }
    }
  }

  // next-pin highlight ring
  const ni = nextPinIndex();
  if (nextRing) {
    if (ni >= 0 && state !== 'done') {
      const sp = L.pins[ni];
      const rp = pinRest(sp);
      nextRing.visible = true;
      nextRing.position.set(rp[0], rp[1] - PIN_H * 0.35 + 0.03, rp[2]);
      const p = 1 + 0.16 * Math.sin(clock * 6);
      nextRing.scale.set(p, p, p);
      nextRing.material.opacity = 0.55 + 0.3 * Math.sin(clock * 6);
    } else nextRing.visible = false;
  }

  // trail ghosts follow history
  for (let k = 0; k < trailMeshes.length; k++) {
    const m = trailMeshes[k];
    const h = trailHist[Math.min(k * 2, trailHist.length - 1)];
    if (h && state === 'rolling') { m.visible = true; m.position.copy(h); }
    else m.visible = false;
  }

  updateBursts(dt);
  updatePulses(dt);

  // camera micro-shake
  if (shake > 0.003) {
    camera.position.set(
      camBase.x + (Math.random() - 0.5) * shake * 0.5,
      camBase.y + (Math.random() - 0.5) * shake * 0.5,
      camBase.z
    );
    shake *= Math.exp(-5 * dt);
  } else camera.position.copy(camBase);

  renderer.render(scene, camera);
}

function showConnectPop() {
  const el = $('connectPop');
  const L = levels[li];
  const { pos } = L.path.at(Math.min(ballS, L.path.length));
  const s = frame.project([pos.x, pos.y, pos.z]);
  const w = stage.clientWidth, h = stage.clientHeight;
  const halfW = VIEW_H * (w / h);
  el.style.left = ((s[0] / halfW) * 0.5 + 0.5) * w + 'px';
  el.style.top = (0.5 - (s[1] / VIEW_H) * 0.5) * h + 'px';
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

/* ---- input ---- */
$('stage').addEventListener('pointerdown', (e) => { release(); });
$('introCard').addEventListener('pointerdown', (e) => { release(); });
$('releaseBtn').addEventListener('pointerdown', (e) => { e.stopPropagation(); release(); });
$('retryBtn').addEventListener('click', () => { uiClick(); loadLevel(li); });
$('nextBtn').addEventListener('click', () => {
  uiClick();
  if (li === levels.length - 1) {
    if (hitSet.size === levels[li].pins.length) {
      for (const L of levels) localStorage.removeItem('ib_run_' + L.id);
    }
    loadLevel(0);
  } else loadLevel(li + 1);
});
window.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') release();
  if (DEV && e.key >= '1' && e.key <= '5') loadLevel(+e.key - 1);
});

/* ---- dev bar ---- */
function markDevCur() {
  [...$('devbar').children].forEach((b, i) => b.classList.toggle('cur', i === li));
}
if (DEV) {
  const bar = $('devbar');
  bar.classList.add('show');
  levels.forEach((L, i) => {
    const b = document.createElement('button');
    b.textContent = `${i + 1}`;
    b.title = L.name;
    b.addEventListener('click', () => loadLevel(i));
    bar.appendChild(b);
  });
}

/* ---- boot ---- */
resize();
loadLevel(0);
tick();
</script>
</body>
</html>
