<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projects — lukezhang.si</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(circle at 50% 30%, #4a3226 0%, #2a1d18 45%, #100d0e 100%);
    background-attachment: fixed;
    color: #ece9e2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 48px 24px 80px;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
  .sub { opacity: .6; font-size: 16px; margin: 8px 0 24px; }
  .search { width: 100%; font-size: 16px; padding: 13px 16px; border-radius: 14px;
    border: 1px solid rgba(236,233,226,.2); background: rgba(255,255,255,.05);
    color: #ece9e2; font-family: inherit; margin-bottom: 14px; touch-action: manipulation; }
  .search::placeholder { color: rgba(236,233,226,.35); }
  .search:focus { outline: none; border-color: rgba(236,233,226,.5); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { touch-action: manipulation; border: 1px solid rgba(236,233,226,.2); background: transparent;
    color: #ece9e2; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; }
  .chip small { opacity: .5; font-weight: 400; margin-left: 4px; }
  .chip.on { background: #ece9e2; color: #1d1512; border-color: #ece9e2; }
  .chip.on small { opacity: .6; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 16px; }
  .count { font-size: 13px; opacity: .5; }
  .sort { display: flex; gap: 6px; }
  .sort button { touch-action: manipulation; border: 1px solid rgba(236,233,226,.2); background: transparent;
    color: #ece9e2; border-radius: 10px; padding: 7px 12px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; opacity: .65; }
  .sort button.on { opacity: 1; border-color: rgba(236,233,226,.55); background: rgba(255,255,255,.07); }
  a.card {
    display: block; color: inherit; text-decoration: none;
    border: 1px solid rgba(236,233,226,.16); border-radius: 16px;
    padding: 18px 20px; margin-bottom: 12px;
    background: rgba(255,255,255,.03);
    touch-action: manipulation;
    transition: border-color .2s, background .2s;
  }
  a.card:hover, a.card:active { border-color: rgba(236,233,226,.45); background: rgba(255,255,255,.06); }
  a.card h2 { font-size: 18px; font-weight: 600; margin-bottom: 5px; }
  a.card p { font-size: 14px; opacity: .6; line-height: 1.45; margin-bottom: 10px; }
  .meta { display: flex; gap: 8px; align-items: center; }
  .cat { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px; background: rgba(236,233,226,.12); color: #ece9e2; }
  .date { font-size: 12px; opacity: .4; }
  .empty { text-align: center; padding: 48px 0; opacity: .5; font-size: 15px; }
  .foot { margin-top: 36px; font-size: 14px; opacity: .45; }
  .foot a { color: inherit; }
</style>
</head>
<body>
  <main>
    <h1>Projects</h1>
    <p class="sub">Small things built for fun. Search, filter, pick one.</p>
    <input class="search" id="q" type="search" placeholder="Search projects…" autocomplete="off" aria-label="Search projects">
    <div class="chips" id="chips" role="group" aria-label="Categories"></div>
    <div class="row">
      <div class="count" id="count"></div>
      <div class="sort" role="group" aria-label="Sort">
        <button data-s="new" class="on">Newest</button>
        <button data-s="az">A–Z</button>
        <button data-s="cat">Category</button>
      </div>
    </div>
    <div id="list"></div>
    <p class="foot"><a href="https://lukezhang.si/">← lukezhang.si</a></p>
  </main>
<script>
"use strict";
/* slug, name, tagline, category, added (YYYY-MM-DD) */
const SITES = [
  ["ergosphere","Ergosphere","A black hole you can orbit — lensing, doppler beaming, time dilation.","Sims","2026-10-05"],
  ["illusion-bowling","Illusion Bowling","A red ball rolls impossible geometry and smashes the pins.","Games","2026-10-05"],
  ["shotgrep","Shotgrep","Ctrl+f for your screenshots — search text inside images.","Tools","2026-10-05"],
  ["ui-candy","UI Candy","Tasty little components for AI-native interfaces.","Design","2026-10-05"],
  ["takes","Takes","Post a take, get judged.","Fun","2026-10-05"],
  ["rust-vs-go","Rust vs Go","Why Rust wins — the comparison, visualized.","Explainers","2026-10-05"],
  ["toptext","TopText","Caption any clip like the meme.","Tools","2026-10-05"],
  ["america-gov-privacy","America.gov Privacy","PII detector — spot private data before you share.","Tools","2026-10-05"],
  ["ballz-recreation","Aboinga","The Ballz brick-breaker clone — drag, aim, smash.","Games","2026-10-05"],
  ["boygames-hub","Boy Games","Liverpool Rummy & Get Clocked — the game studio hub.","Games","2026-10-05"],
  ["cat-cafe-tycoon","Cat Café Tycoon","Run your own cat café.","Games","2026-10-05"],
  ["coffee-game","Pour Decisions","The coffee barista game.","Games","2026-10-05"],
  ["comeback-kit","Comeback Kit","Witty comebacks, on demand.","Tools","2026-10-05"],
  ["company-site","Pocketful","Small digital products, made with care.","Meta","2026-10-05"],
  ["comparison-lab","Comparison Lab","4 comparison visualizer patterns with copy-paste snippets.","Design","2026-10-05"],
  ["design-docs","Design Docs","Every open design decision, in one place.","Decision docs","2026-10-05"],
  ["desk-setup-showdown","Desk Setup Showdown","The ultimate MacBook battlestation, compared.","Explainers","2026-10-05"],
  ["emotion-engine","Emotion Engine","A node-workflow toy that dreams up generative art.","Explainers","2026-10-05"],
  ["fall-foliage-sim","Fall Foliage Sim","Watch the leaves turn.","Sims","2026-10-05"],
  ["foil-cards","Gilded","Foil greeting cards, recreated.","Explainers","2026-10-05"],
  ["grok-bot-recreation","Grok Bot","AI teammates that finish the work.","Explainers","2026-10-05"],
  ["leetcode-games-browser","100 Game Ideas","LeetCode as the hidden backbone of 100 game ideas.","Explainers","2026-10-05"],
  ["liquid-glass-demo","Liquid Glass","A real glassmorphism shader demo.","Explainers","2026-10-05"],
  ["make-100k","50 Ways to $100k","Fifty paths to a hundred grand — visualized.","Explainers","2026-10-05"],
  ["model-bench-site","Model Bench","Muse vs Codex vs Astra — model showdown.","Explainers","2026-10-05"],
  ["nicomachus-visual","Nicomachus's Theorem","A visual proof of a 2000-year-old theorem.","Explainers","2026-10-05"],
  ["oobleck-lab","Oobleck Lab","A non-Newtonian playground — stir, pour, smack.","Sims","2026-10-05"],
  ["reaction-studio","Reaction Studio","Record reaction-ready videos for X.","Tools","2026-10-05"],
  ["screenshot-ctrl-f","Screenshot Ctrl+F","Ctrl+f for your screenshots.","Tools","2026-10-05"],
  ["skill-tree","Skill Tree","RPG-style skill tree — design directions.","Explainers","2026-10-05"],
  ["ballz-1000-decisions","Ballz · 1000 Levels","Decision board for 1000 Ballz levels.","Decision docs","2026-10-04"],
  ["ballz-1000-levels","Ballz · 1000 Levels","Decision board: 10 themes × 10 block types.","Decision docs","2026-10-04"],
  ["theme-names","Theme Names","180 theme names to sift.","Decision docs","2026-10-04"],
  ["swipe-cards-yes-no","Swipe Cards","Yes/no triage decisions.","Decision docs","2026-10-04"],
  ["notes-triage-oct-5","Notes Triage","35 ideas from the notes dump, triaged.","Decision docs","2026-10-05"],
  ["china-trip-planning","China + Korea","Finish planning the December trip.","Decision docs","2026-10-05"],
  ["comparison-slider","Comparison Slider","Final spec: the thin-bar Notch slider.","Decision docs","2026-10-05"],
  ["ab-toggle","A/B Toggle","Final spec: the single-switch A/B toggle.","Decision docs","2026-10-05"],
  ["hairball","Hairball","Katamari-style sticky ball — grow from 12cm to 12m.","Games","2026-10-05"],
  ["peggie","Peggie","Peggle-inspired peg-popping.","Games","2026-10-05"],
  ["get-clocked","Get Clocked","The reaction-time game — how fast are you?","Games","2026-10-05"],
  ["wikimari","Wikimari","Roll a katamari across live encyclopedia articles.","Games","2026-10-05"],
  ["draw-guess","Draw & Guess","Draw it, guess it — multiplayer party game.","Games","2026-10-05"],
  ["liverpool-rummy","Liverpool Rummy","Contract rummy — pass-and-play or online.","Games","2026-10-05"],
];
const CATS = ["Games","Sims","Tools","Explainers","Design","Decision docs","Fun","Meta"];
let cat = "All", sort = "new", q = "";
const list = document.getElementById('list'),
      chips = document.getElementById('chips'),
      count = document.getElementById('count'),
      input = document.getElementById('q');
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function renderChips(){
  const counts = {};
  SITES.forEach(s => counts[s[3]] = (counts[s[3]]||0)+1);
  chips.innerHTML = "";
  ["All",...CATS].forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (cat===c ? ' on' : '');
    const n = c==="All" ? SITES.length : (counts[c]||0);
    b.innerHTML = esc(c) + '<small>'+n+'</small>';
    b.addEventListener('click', () => { cat = c; render(); });
    chips.appendChild(b);
  });
}
function render(){
  renderChips();
  let r = SITES.filter(s =>
    (cat==="All" || s[3]===cat) &&
    (!q || (s[1]+" "+s[2]+" "+s[3]).toLowerCase().includes(q))
  );
  if (sort==="new") r.sort((a,b) => b[4].localeCompare(a[4]) || a[1].localeCompare(b[1]));
  else if (sort==="az") r.sort((a,b) => a[1].localeCompare(b[1]));
  else r.sort((a,b) => a[3].localeCompare(b[3]) || a[1].localeCompare(b[1]));
  count.textContent = r.length + " of " + SITES.length;
  if (!r.length) { list.innerHTML = '<div class="empty">Nothing matches — try another search.</div>'; return; }
  list.innerHTML = r.map(s =>
    '<a class="card" href="'+(s[0].indexOf('http')===0?s[0]:"/"+s[0]+"/")+'><h2>'+esc(s[1])+'</h2><p>'+esc(s[2])+'</p>'+
    '<div class="meta"><span class="cat">'+esc(s[3])+'</span><span class="date">'+(s[0].indexOf('http')===0?'↗ external':s[4])+'</span></div></a>'
  ).join('');
}
document.querySelectorAll('.sort button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.sort button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); sort = b.dataset.s; render();
  });
});
input.addEventListener('input', () => { q = input.value.trim().toLowerCase(); render(); });
render();
</script>
</body>
</html>
