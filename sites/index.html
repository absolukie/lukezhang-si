const CATS = ["Games","Sims","Tools","Explainers","Design","Decision docs","Fun","Meta"];
let cat = "All", sort = "new", q = "";
const list = document.getElementById('list'),
      chips = document.getElementById('chips'),
      count = document.getElementById('count'),
      input = document.getElementById('q');
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function renderChips(){
  const counts = {};
  SITES.forEach(s => counts[s[3]] = (counts[s[3]]||0)+1);
  chips.innerHTML = "";
  ["All",...CATS].forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (cat===c ? ' on' : '');
    const n = c==="All" ? SITES.length : (counts[c]||0);
    b.innerHTML = esc(c) + '<small>'+n+'</small>';
    b.addEventListener('click', () => { cat = c; render(); });
    chips.appendChild(b);
  });
}
function render(){
  renderChips();
  let r = SITES.filter(s =>
    (cat==="All" || s[3]===cat) &&
    (!q || (s[1]+" "+s[2]+" "+s[3]).toLowerCase().includes(q))
  );
  if (sort==="new") r.sort((a,b) => b[4].localeCompare(a[4]) || a[1].localeCompare(b[1]));
  else if (sort==="az") r.sort((a,b) => a[1].localeCompare(b[1]));
  else r.sort((a,b) => a[3].localeCompare(b[3]) || a[1].localeCompare(b[1]));
  count.textContent = r.length + " of " + SITES.length;
  if (!r.length) { list.innerHTML = '<div class="empty">Nothing matches — try another search.</div>'; return; }
  list.innerHTML = r.map(s =>
    '<a class="card" href="'+(s[0].indexOf('http')===0?s[0]:"/"+s[0]+"/")+'"><h2>'+esc(s[1])+'</h2><p>'+esc(s[2])+'</p>'+
    '<div class="meta"><span class="cat">'+esc(s[3])+'</span>'+(s[5]?'<span class="badge '+esc(s[5])+'">'+esc(s[5])+'</span>':'')+'<span class="date">'+(s[0].indexOf('http')===0?'↗ external':s[4])+'</span></div></a>'
  ).join('');
}
document.querySelectorAll('.sort button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.sort button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); sort = b.dataset.s; render();
  });
});
input.addEventListener('input', () => { q = input.value.trim().toLowerCase(); render(); });
render();
