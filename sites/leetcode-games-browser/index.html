<h1>100 game ideas</h1>
<p class="sub">Games where a <b>LeetCode algorithm is the hidden backbone</b> — it verifies solvability, proves pars, and validates moves behind the scenes. The game itself is just fun. Each card explains <b>how the algorithm actually works</b>. Star your favorites.</p>

<script>
var IDEAS = [{"category": "dungeon", "pitch": "Flood a sinking dungeon to strand brutes, unite enemy islands for a lightning strike, or open a watery escape. Connected-region checks recalculate spell targets after every terrain change.", "problems": ["Number of Islands (200)"], "title": "Islefall", "how": ["Scan the grid. Every time you hit unvisited land, flood-fill the whole connected blob and count it as one island."], "label": "Dungeon crawlers"}, {"category": "dungeon", "pitch": "Steal a warden's speaking mask and change its name one letter at a time to impersonate different dungeon creatures, each opening different doors. A dictionary graph validates transformations and measures disguise distance; patrol timing remains a separate stealth challenge.", "problems": ["Word Ladder (127)"], "title": "Wordgate", "how": ["BFS over words where neighbors differ by one letter. The first time you reach the end word, that's the shortest ladder."], "label": "Dungeon crawlers"}, {"category": "dungeon", "pitch": "Carry the last lantern through a crypt while darkness advances one tile per turn. Shut doors and risk treasure detours; multi-source spread simulation drives the visible countdown, while a separate search over player position, time, and door states verifies each generated escape.", "problems": ["Rotting Oranges (994)"], "title": "Blacktide", "how": ["Multi-source BFS: start with all rotten oranges in the queue, spread level by level, and count the minutes until no fresh orange remains."], "label": "Dungeon crawlers"}, {"category": "dungeon", "pitch": "Pickpocket jailers for keys, free useful prisoners, and decide which locked wings to raid before extraction. Reachability checks ensure the initial key chain never locks its own essential key away; optional rescues remain risky.", "problems": ["Keys and Rooms (841)"], "title": "Keyring", "how": ["Start in room 0, collect keys, and search through every room your keys open. Rooms left unvisited are unreachable."], "label": "Dungeon crawlers"}, {"category": "dungeon", "pitch": "Race a rival to a vault through mud, bone bridges, and exhausting climbs, spending stamina on shortcuts or saving it for the escape. Weighted shortest paths set the minimum travel cost on the current map, giving the rival a credible route and the player a meaningful stamina budget.", "problems": ["Dijkstra's Algorithm"], "title": "Tollkeeper's Descent", "how": ["Always expand the cheapest unvisited node first via a priority queue. Once a node is expanded, its cheapest cost is final, because any other route would cost at least as much."], "label": "Dungeon crawlers"}, {"category": "dungeon", "pitch": "Hunt a court of immortal guardians whose stolen relics break one another's shields. Choose which newly vulnerable boss to confront; prerequisite ordering verifies that the dungeon has a complete unsealing sequence before it is generated.", "problems": ["Course Schedule II (210)"], "title": "The Sealed Court", "how": ["Peel off courses with no prerequisites first, appending each to the order, and repeat. Whatever can't be peeled is stuck in a cycle."], "label": "Dungeon crawlers"}, {"category": "dungeon", "pitch": "Pour your slime body through grates, engulf guards, and hold several pressure plates without tearing yourself apart. Flood fill and connectivity checks determine occupied chambers and whether a stretched body remains joined.", "problems": ["Flood Fill (733)", "DFS Traversal"], "title": "Slimebound", "how": ["Start at one cell and recursively recolor every connected cell of the same original color, spreading in four directions like spilled paint.", "Go as deep as possible down one path before backtracking: visit a node, then recursively visit each unvisited neighbor."], "label": "Dungeon crawlers"}, {"category": "dungeon", "pitch": "Throw your lantern down a crypt corridor and command its ghost to explore or retrace its footsteps, luring monsters toward ambushes. A depth-first traversal with a recorded return stack drives the ghost's route; the player controls bait, doors, and the moment to recall it.", "problems": ["DFS Traversal"], "title": "Lantern Echo", "how": ["Go as deep as possible down one path before backtracking: visit a node, then recursively visit each unvisited neighbor."], "label": "Dungeon crawlers"}, {"category": "dungeon", "pitch": "Hop a cursed knight between collapsing tiles, kicking skeletons into pits and chaining daring escapes. Search over position and the surviving floor tiles verifies solvability and the fewest legal hops; ordinary distance on an unchanged board is only a lower bound.", "problems": ["BFS Shortest Path"], "title": "Knight's Crypt", "how": ["Explore outward in rings: visit every neighbor first, then their neighbors. The first time you reach a node, you've found the shortest path to it."], "label": "Dungeon crawlers"}, {"category": "dungeon", "pitch": "Plant a plague seed inside a monster nest, then lure the warlord's parade through the bloom. Layered spread simulation forecasts arrival times; an explicit infection-age extension handles burnout, so the player can time a spectacular ambush.", "problems": ["Rotting Oranges (994)"], "title": "Plaguewright", "how": ["Multi-source BFS: start with all rotten oranges in the queue, spread level by level, and count the minutes until no fresh orange remains."], "label": "Dungeon crawlers"}, {"category": "tower-defense", "pitch": "Defend the goblin king's getaway by hiring lookout towers along a street; neighboring towers share a noisy alarm circuit and cannot both be active. Each wave changes the lanes under attack, and a nonadjacent-selection solver computes the best coverage reward for that wave.", "problems": ["House Robber (198)"], "title": "Robber's Row", "how": ["For each house, the best loot is max(rob it + best up to two houses back, skip it and keep best up to previous). One running decision per house."], "label": "Tower defense"}, {"category": "tower-defense", "pitch": "Defend a mint with cannons that punch differently shaped seals into armored enemies. Match the silhouette on each shield by combining shots; an unlimited-ammunition coin-change model checks that every shield has a solution and sets its fewest-shot medal.", "problems": ["Coin Change (322)"], "title": "Exact Change", "how": ["For every amount from 1 up to the target, try each coin and keep the fewest coins needed. Bigger answers are built from smaller ones already solved."], "label": "Tower defense"}, {"category": "tower-defense", "pitch": "Build a fortress on the back of a wandering stone giant, choosing between heavy siege towers and nimble support weapons before each assault. A weight-budget optimizer scores feasible loadouts for the forecast wave; positioning and firing remain the player's defense.", "problems": ["0/1 Knapsack"], "title": "Knapsack Keep", "how": ["Build a table where each cell answers: with this much capacity and these items considered, what's the best value? Each item is either taken or skipped, and bigger answers reuse smaller ones already solved."], "label": "Tower defense"}, {"category": "tower-defense", "pitch": "Delay invading warbands until their protective auras overlap, then burn the entire connected aura with one expensive barrage. Interval merging determines which auras fuse at the firing line, rewarding spectacular timing without exposing a timetable puzzle.", "problems": ["Merge Intervals (56)"], "title": "Merge Line", "how": ["Sort by start time, then walk through merging each interval into the current one whenever they overlap."], "label": "Tower defense"}, {"category": "tower-defense", "pitch": "Defend evacuation lanes by switching refugee convoys between fortified roads while raiders attack occupied lanes. Interval overlap computes the minimum lanes needed for the announced convoy schedule; the player spends barricades and escort fire to protect the dispatch.", "problems": ["Meeting Rooms II (253)"], "title": "Rush Hour", "how": ["Sort all start and end times. Sweep through, +1 room when a meeting starts and -1 when one ends. The peak count is the answer."], "label": "Tower defense"}, {"category": "tower-defense", "pitch": "Hunt enemy commanders with a few specialist towers whose trophies unlock stronger ammunition. The scout quietly summarizes the most common enemies in the next wave, but the player chooses between farming the horde and preparing for a dangerous elite.", "problems": ["Top K Frequent Elements (347)"], "title": "Most Wanted", "how": ["Count frequencies, bucket elements by count (or keep a heap of size k), and take the k fullest buckets."], "label": "Tower defense"}, {"category": "tower-defense", "pitch": "Defend an orchard of sleeping giants from sky-whales that cast long shadows across it. Plant a few vertical flare trees, then ignite them to pierce every whale overhead; interval stabbing computes the minimum trees needed for each stationary attack formation.", "problems": ["Minimum Number of Arrows to Burst Balloons (452)"], "title": "Fuse Orchard", "how": ["Sort balloons by where they end. Fire one arrow at the earliest end — it pops every balloon covering that point — then repeat for the rest."], "label": "Tower defense"}, {"category": "tower-defense", "pitch": "Your cemetery tower resurrects the strongest corpse in range as its champion. Kite giants into its graveyard, spend stored corpses on shields, and choose when to replace your champion; a priority queue maintains the best available corpse without weaker arrivals degrading it.", "problems": ["Heap / Priority Queue"], "title": "Heap of Bones", "how": ["A binary tree packed into an array where every parent beats its children. The min or max is always on top, and insert and remove cost log n."], "label": "Tower defense"}, {"category": "tower-defense", "pitch": "Defend a bell tower from creatures that climb one or two steps at a time. Ring decoy bells and arm collapsing steps; a stair-counting recurrence extended with blocked steps measures the routes still open after each trap, while enemies follow visible individual hop rhythms.", "problems": ["Climbing Stairs (70)"], "title": "Stairfall", "how": ["The ways to reach step n equal the ways to reach n-1 plus n-2, since you arrive from one or two steps below. Build up from the bottom instead of recursing."], "label": "Tower defense"}, {"category": "tower-defense", "pitch": "Hold a bridge with one firing crew and several ballista types that each need the same cooldown. Clear a visible batch of armored targets in any order before they breach; the scheduler sets the minimum firing duration under these exact rules.", "problems": ["Task Scheduler (621)"], "title": "Siege Engine", "how": ["The busiest task dictates the timeline: schedule around (max_count - 1) x (n + 1) slots plus the tasks tied for busiest, or just the task count if that's bigger."], "label": "Tower defense"}, {"category": "arcade", "pitch": "Pilot a neon serpent whose tail becomes its head whenever you hit a reversal orb. Thread tight tunnels and reverse out of traps; linked-list reversal preserves the exact body order, while collision checks enforce legal movement.", "problems": ["Reverse Linked List (206)"], "title": "REVERSNAKE", "how": ["Walk the list flipping each node's next pointer to point backward, carrying the previous node along."], "label": "Arcade"}, {"category": "arcade", "pitch": "Boost through a neon gate network that secretly returns you to earlier gates. Spot recurring landmarks and deploy a one-use exit beacon; cycle detection identifies looping track chains for generation and checkpoint recovery.", "problems": ["Linked List Cycle (141)"], "title": "CYCLE SPRINT", "how": ["Send a slow pointer one step and a fast pointer two steps. If there's a loop, the fast one laps the slow one and they meet."], "label": "Arcade"}, {"category": "arcade", "pitch": "Surf a side-scrolling battle in a ship that steals the weapon of the strongest drone inside its scanning beam. Keep dangerous donors close while dodging their shots; a sliding-window maximum selects the donor as the ordered drone stream passes.", "problems": ["Sliding Window Maximum (239)"], "title": "WINDOW WIPER", "how": ["A deque keeps candidate maximums in decreasing order as the window slides: drop smaller values from the back, drop out-of-window values from the front."], "label": "Arcade"}, {"category": "arcade", "pitch": "Parry alien volleys whose layered shields must be peeled in reverse arrival order using matching weapon colors. A stack validates each counter sequence behind the explosions; the player reads silhouettes and timing, never punctuation.", "problems": ["Valid Parentheses (20)"], "title": "BRACKET STORM", "how": ["Push opening brackets onto a stack. Each closing bracket must match the top of the stack, or the string is invalid."], "label": "Arcade"}, {"category": "arcade", "pitch": "Sprint between thermal vents as a glacier breaks beneath you; each vent launches you toward the next hotter plume downwind. Next-warmer queries silently determine destinations, while you steer aerial pickups and time each launch.", "problems": ["Daily Temperatures (739)"], "title": "HEATWAVE RUNNER", "how": ["Scan the days keeping a stack of days still waiting for a warmer one. When a hotter day arrives, it resolves everyone on the stack that it's warmer than."], "label": "Arcade"}, {"category": "arcade", "pitch": "Race a reversible hovertrain, attaching boosters or armor to either end and ejecting end cars as weapons. A bounded deque maintains legal attachment and ejection order; weight and cornering make every sacrifice matter.", "problems": ["Design Circular Deque (641)"], "title": "DEQUE DASH", "how": ["A fixed-size array with head and tail pointers that wrap around the end back to the start, so both ends insert and remove in constant time."], "label": "Arcade"}, {"category": "arcade", "pitch": "Conduct two percussion bands arriving on moving platforms, switching between them to catch the next beat while dodging stage hazards. Merging their already ordered beat schedules produces the unified timing track; the player performs rhythm and movement.", "problems": ["Merge Two Sorted Lists (21)"], "title": "MERGE MAYHEM", "how": ["Walk both lists with two pointers, always appending the smaller head and advancing that list."], "label": "Arcade"}, {"category": "arcade", "pitch": "Stack cargo on a swaying airship and peel crates off the top when turbulence strikes. A hidden minimum stack tells the captain when the most fragile remaining cargo needs protection; only top-crate removal is legal, and the player balances height against safety.", "problems": ["Min Stack (155)"], "title": "MIN TOWER", "how": ["A normal stack plus a second stack tracking the minimum so far. Every push and pop updates both, so getMin is instant."], "label": "Arcade"}, {"category": "arcade", "pitch": "Pilot a cleaning puck through an infected arcade floor, collecting scattered civilians before sweeping each room with a limited disinfectant bomb. Spread layers drive the enemy clock; direct dodging and rescue chains distinguish it from building quarantine walls.", "problems": ["Rotting Oranges (994)"], "title": "ROT BLOCK", "how": ["Multi-source BFS: start with all rotten oranges in the queue, spread level by level, and count the minutes until no fresh orange remains."], "label": "Arcade"}, {"category": "arcade", "pitch": "Drag a blazing comet-tail around an arena and bait a hunter into locking onto one glowing segment. Snip that segment at the last moment to leave a decoy blast; end-relative list removal updates the tail while the player handles aim and evasion.", "problems": ["Remove Nth Node From End of List (19)"], "title": "TAIL TRIMMER", "how": ["Two pointers spaced n apart: when the front hits the end, the back sits right before the node to remove."], "label": "Arcade"}, {"category": "puzzle", "pitch": "Reunite drifting spirit halves to hatch creatures with complementary powers, then use their abilities to reach stranded eggs. A hidden two-sum lookup checks each pair's compatibility against the nest's energy requirement; players match illustrated auras rather than calculate sums.", "problems": ["Two Sum (1)"], "title": "PAIR BOND", "how": ["One pass with a hash map: for each number, check whether its complement (target minus number) was already seen."], "label": "Puzzle"}, {"category": "puzzle", "pitch": "Choose two anchor pylons for a magical rectangular water tank, then launch a rescue boat across the resulting lake. Container-area evaluation sets the tank's capacity from width and its shorter pylon; the tallest pair is not necessarily best.", "problems": ["Container With Most Water (11)"], "title": "DAM BUILDER", "how": ["Start with the widest pair of lines, compute the area, then move the shorter line inward. Only a taller line can beat the current best."], "label": "Puzzle"}, {"category": "puzzle", "pitch": "Run a sushi train for a dragon who wants a tasting flight with no repeated dish. Choose where to start and stop serving along a fixed belt to keep the dragon happy; a unique-window scan measures the longest possible flight for the bonus target.", "problems": ["Longest Substring Without Repeating Characters (3)"], "title": "NO REPEATS EXPRESS", "how": ["Slide a window across the string: widen the right edge, shrink the left past any repeat, and track the max width."], "label": "Puzzle"}, {"category": "puzzle", "pitch": "Fit a giant festival screen beneath an uneven rooftop scaffold before tonight's concert. Rearrange a limited number of scaffold columns and watch the crowd grow with the screen; histogram-area checks score the largest supported rectangle after each move.", "problems": ["Largest Rectangle in Histogram (84)"], "title": "SKYLINE STACKER", "how": ["Track bars in increasing height on a stack. When a shorter bar arrives, every taller bar on the stack ends its rectangle there, so compute their areas."], "label": "Puzzle"}, {"category": "puzzle", "pitch": "Rock alien eggs into nested protective shells, opening and closing shell halves around mischievous hatchlings. Balanced-sequence generation supplies valid nesting layouts, and typed stack checks validate colored shells; the fun is choosing which creature to shelter first.", "problems": ["Generate Parentheses (22)", "Valid Parentheses (20)"], "title": "NEST EGG", "how": ["Build strings one bracket at a time: add '(' while you have some left, ')' while closes don't outnumber opens. Invalid branches are never explored.", "Push opening brackets onto a stack. Each closing bracket must match the top of the stack, or the string is invalid."], "label": "Puzzle"}, {"category": "puzzle", "pitch": "Rescue paper boats in a side-view landscape by spending a few earth-moving strokes before a single rainstorm. One-dimensional water-volume calculations show which basins fill; a separate enumeration of allowed terrain edits sets the rescue target.", "problems": ["Trapping Rain Water (42)"], "title": "RAIN TRAP", "how": ["For each position, water = min(tallest to the left, tallest to the right) minus height. Two pointers compute both maxima in one pass."], "label": "Puzzle"}, {"category": "puzzle", "pitch": "Blend three unstable gem colors into a neutral burst that frees buried crystal creatures. A hidden three-sum check identifies compatible charges, surfaced as color harmony previews; where you detonate controls the rescue chain.", "problems": ["3Sum (15)"], "title": "TRIPLE THREAT", "how": ["Sort the array, fix one number, then squeeze the other two toward each other with pointers from both ends until the three sum to the target."], "label": "Puzzle"}, {"category": "puzzle", "pitch": "Arrange a rooftop fireworks relay so each rocket seeks the next taller launch tower to its right. Next-greater queries determine the chain; the player chooses the starting fuse and limited tower swaps to illuminate the city's sleeping districts.", "problems": ["Next Greater Element I (496)"], "title": "NEXT LAUNCH", "how": ["Scan with a monotonic decreasing stack. When a bigger number arrives, it's the 'next greater' for everyone waiting on the stack."], "label": "Puzzle"}, {"category": "puzzle", "pitch": "Slide five tiny planetary districts around a flat 2-by-3 map with one empty socket, restoring a shattered astronaut village to its illustrated home layout. A sliding-puzzle search validates each generated arrangement and supplies the exact swap par, dressed as a miniature rescue diorama.", "problems": ["Sliding Puzzle (773)"], "title": "Pocket Planet", "how": ["BFS over board states: each state is a string, neighbors are boards one tile-swap away. Shortest path from start to solved wins."], "label": "Puzzle"}, {"category": "puzzle", "pitch": "Choose a single stretch of an enemy supply train to hook with your tunneling mole, balancing stolen fuel against cursed cargo. Prefix-sum counting finds contiguous hauls matching the mole's tank capacity and guarantees a valid ambush window; the player reads a fill preview.", "problems": ["Subarray Sum Equals K (560)"], "title": "SUBARRAY SIEGE", "how": ["Track running prefix sums in a hash map. If prefix[j] minus prefix[i] equals k, the subarray between them qualifies."], "label": "Puzzle"}, {"category": "multiplayer", "pitch": "Command a living border that captures watchtowers and cuts rival supply corridors across a shared map. Connectivity is recomputed after both captures and cuts to decide which provinces receive reinforcements; winning depends on coordinated raids, not graph terminology.", "problems": ["Number of Provinces (547)"], "title": "Province Wars", "how": ["Same connected-components idea on a friendship matrix: search outward from each unvisited city through its connections, counting each sweep as one province."], "label": "Multiplayer"}, {"category": "multiplayer", "pitch": "Race other crews to connect scattered island shrines, carrying planks across exposed spans while rivals bomb construction sites. Connectivity checks validate completion, and cycle detection flags optional backup bridges; deletion triggers fresh checks rather than ordinary union-find alone.", "problems": ["Number of Provinces (547)", "Redundant Connection (684)"], "title": "Bridge Rush", "how": ["Same connected-components idea on a friendship matrix: search outward from each unvisited city through its connections, counting each sweep as one province.", "Add edges one by one with Union-Find. The first edge connecting two already-connected nodes is the redundant one."], "label": "Multiplayer"}, {"category": "multiplayer", "pitch": "Capture an enemy drone nest with a mimic bomb, then deploy a temporary copy whose linked shields and weapon relays behave exactly like the original. Deep graph cloning preserves internal links without sharing damage state; players win through positioning, theft, and sabotage.", "problems": ["Clone Graph (133)"], "title": "Clone Wars Arena", "how": ["Walk the original graph while building a copy node by node, keeping a map from old nodes to their clones so shared neighbors don't get duplicated."], "label": "Multiplayer"}, {"category": "multiplayer", "pitch": "Duel with evolving familiars: hatch an imp, arm it, then transform it into a siege beast while opponents interrupt rituals. Prerequisite validation controls legal evolution chains and rejects accidental permanent deadlocks in generated decks; counters can still delay a combo.", "problems": ["Course Schedule (207)", "Course Schedule II (210)"], "title": "Prereq Draft", "how": ["Model courses as a graph of prerequisites and look for a cycle. If you can keep removing courses with no remaining prerequisites until none are left, the schedule works.", "Peel off courses with no prerequisites first, appending each to the order, and repeat. Whatever can't be peeled is stuck in a cycle."], "label": "Multiplayer"}, {"category": "multiplayer", "pitch": "Race luminous pulses through a maze, opening one gate each beat to steer your expanding color toward the finish. Multi-source grid search advances each pulse, and equal-rule shortest paths compare starting layouts; opponents can still outplay your gate choices.", "problems": ["Shortest Path in Binary Matrix (1091)"], "title": "Pulse Race", "how": ["BFS over the 8 neighboring cells starting from the corner. The first time you reach the far corner, that's the shortest clear path."], "label": "Multiplayer"}, {"category": "multiplayer", "pitch": "Infiltrate a masked gala where secret alliances control who will vouch for you at locked salons. Players trade introductions and bluff allegiances; connected-component checks resolve access through discovered social links, while the mole can belong to a plausible connected alliance.", "problems": ["Number of Provinces (547)"], "title": "Friend Circle Heist", "how": ["Same connected-components idea on a friendship matrix: search outward from each unvisited city through its connections, counting each sweep as one province."], "label": "Multiplayer"}, {"category": "multiplayer", "pitch": "One player commands an infection while three responders evacuate neighborhoods and cut streets before the next pulse. Spread simulation resolves exposure and grid connectivity identifies isolated districts; the confrontation is asymmetric timing and rescue, with no automatic victory from merely splitting the map.", "problems": ["Rotting Oranges (994)", "Number of Islands (200)"], "title": "Outbreak", "how": ["Multi-source BFS: start with all rotten oranges in the queue, spread level by level, and count the minutes until no fresh orange remains.", "Scan the grid. Every time you hit unvisited land, flood-fill the whole connected blob and count it as one island."], "label": "Multiplayer"}, {"category": "multiplayer", "pitch": "Play rooftop tag with a hunter whose shout travels across walkways one connection per beat. Runners slam gates, vault gaps, and bait echoes; multi-source graph distance resolves whether a shout reaches them on the current map.", "problems": ["BFS Shortest Path"], "title": "Graph Tag", "how": ["Explore outward in rings: visit every neighbor first, then their neighbors. The first time you reach a node, you've found the shortest path to it."], "label": "Multiplayer"}, {"category": "multiplayer", "pitch": "Two teams rob the same museum while each player can rewind once, leaving an echo that repeats their previous moves and distracts guards. Grid shortest paths guide guards around closed exhibits; a separate time-state check verifies generated patrol escapes, while teams improvise synchronized thefts.", "problems": ["Shortest Path in Binary Matrix (1091)"], "title": "Echo Thieves", "how": ["BFS over the 8 neighboring cells starting from the corner. The first time you reach the far corner, that's the shortest clear path."], "label": "Multiplayer"}, {"category": "multiplayer", "pitch": "Cooperate in a chaotic rocket workshop, hauling components between stations while fires interrupt the launch preparations. Prerequisite checks unlock valid assemblies and identify broken work orders; players repair machines and transport parts instead of voting on abstract dependency cycles.", "problems": ["Course Schedule (207)"], "title": "Dependency Derby", "how": ["Model courses as a graph of prerequisites and look for a cycle. If you can keep removing courses with no remaining prerequisites until none are left, the schedule works."], "label": "Multiplayer"}, {"category": "idle", "pitch": "Grow a toy factory where curious little machines transform stamped seed codes into collectible creatures. Happiness testing quietly classifies each seed's deterministic transformation chain; players build displays, choose production lines, and divert looping seeds into decorative kinetic sculptures.", "problems": ["Happy Number (202)"], "title": "Happy Number Factory", "how": ["Repeatedly replace the number with the sum of its squared digits. A set (or two pointers) detects when the sequence loops instead of reaching 1."], "label": "Idle"}, {"category": "idle", "pitch": "Run an idle heist syndicate by buying properties, staging distractions, and choosing which neighborhoods to develop. The crew automatically schedules nonadjacent burglaries on streets and circular blocks; your decisions change the available rewards and unlock elaborate hideouts.", "problems": ["House Robber (198)", "House Robber II (213)"], "title": "Robber Baron Inc.", "how": ["For each house, the best loot is max(rob it + best up to two houses back, skip it and keep best up to previous). One running decision per house.", "Same as House Robber, but the street is a circle. Run it twice — once excluding the first house, once excluding the last — and take the better."], "label": "Idle"}, {"category": "idle", "pitch": "Send autonomous miners into crystal caverns and return to spectacular gem reveals. Each prospecting batch contains paired mineral signatures and one anomaly, located by a hidden XOR scan; players choose excavation zones and equipment, while population counts price collected crystal traits.", "problems": ["Single Number (136)", "Counting Bits (338)"], "title": "Bit Mine", "how": ["XOR everything together. Pairs cancel out, leaving only the number that appears once.", "The number of 1-bits in n equals the count for n with its lowest set bit removed, plus one. Each answer reuses an earlier one."], "label": "Idle"}, {"category": "idle", "pitch": "Grow a vertical hotel for tiny acrobats, choosing one-floor ladders and two-floor springboards between themed landings. A stair-counting recurrence extended to the installed links measures available routes for an explicit route-variety rent bonus; tenant preferences determine which floors are worth building.", "problems": ["Climbing Stairs (70)"], "title": "Stairway Tycoon", "how": ["The ways to reach step n equal the ways to reach n-1 plus n-2, since you arrive from one or two steps below. Build up from the bottom instead of recursing."], "label": "Idle"}, {"category": "idle", "pitch": "Restore an island chain whose lighthouse keepers send magical dawn from beacon to beacon while you are away. Choose where to install costly relay upgrades; weighted signal travel computes when every island receives light, driving synchronized festivals and overnight production windows.", "problems": ["Network Delay Time (743)"], "title": "Lantern Archipelago", "how": ["Run Dijkstra's from the source. The time the signal reaches each node is its shortest-path distance; the answer is the slowest node."], "label": "Idle"}, {"category": "idle", "pitch": "Build a cozy overnight inn for migrating monsters, combining rooms with special beds and delightfully incompatible neighbors. Interval overlap computes room demand for booked stays and prevents overbooking; the idle payoff is returning to guest stories, tips, and newly decorated suites.", "problems": ["Meeting Rooms II (253)"], "title": "Hearth Hotel", "how": ["Sort all start and end times. Sweep through, +1 room when a meeting starts and -1 when one ends. The peak count is the answer."], "label": "Idle"}, {"category": "idle", "pitch": "Run an overnight kitchen staffed by ghosts, choosing the menu and collecting elaborate edible dioramas each morning. One cooking station prepares equal-duration dishes with a shared per-recipe cooldown; a scheduler computes batch completion times while you invest in recipes and presentation.", "problems": ["Task Scheduler (621)"], "title": "Moonlight Kitchen", "how": ["The busiest task dictates the timeline: schedule around (max_count - 1) x (n + 1) slots plus the tasks tied for busiest, or just the task count if that's bigger."], "label": "Idle"}, {"category": "idle", "pitch": "Raise a miniature botanical world where neighboring beds of the same soil share a watering circuit. Repaint soil patches to connect thirsty orchids or isolate invasive vines; flood fill validates each irrigated patch, and offline growth produces new plant forms and visiting wildlife.", "problems": ["Flood Fill (733)"], "title": "Glasshouse Seasons", "how": ["Start at one cell and recursively recolor every connected cell of the same original color, spreading in four directions like spilled paint."], "label": "Idle"}, {"category": "idle", "pitch": "Build a toy railway through whimsical towns, choosing which passengers to collect and which freight to compound through consecutive amplifier stations. Fast exponentiation calculates repeated identical multipliers exactly under the game's economy rules; track choices trade those freight bonuses against passenger destinations.", "problems": ["Pow(x, n) (50)"], "title": "Exponent Express", "how": ["Halve the exponent each step: x^n = (x^(n/2)) squared, with one extra multiply for odd n. Logarithmic instead of linear."], "label": "Idle"}, {"category": "idle", "pitch": "Curate a museum whose exhibits wake at night and explore galleries, returning with relics that open new wings. Key-reachability checks ensure each expansion's unlock chain is viable; players choose exhibits and expedition priorities, then return to watch the night's miniature adventures.", "problems": ["Keys and Rooms (841)"], "title": "Museum After Midnight", "how": ["Start in room 0, collect keys, and search through every room your keys open. Rooms left unvisited are unreachable."], "label": "Idle"}, {"category": "word", "pitch": "Slash a path through letter-bearing dungeon tiles to cast spells, choosing between quick healing words and dangerous long attacks. A trie validates prefixes and board search discovers legal words without reusing tiles; the player learns enemy tells and builds a spell style.", "problems": ["Implement Trie (Prefix Tree) (208)", "Word Search II (212)"], "title": "Lexicon Labyrinth", "how": ["A tree where each level is one character. Words sharing a prefix share nodes, so checking a word or listing completions only walks as deep as the word is long.", "Build a Trie of all words, then DFS the board following Trie paths. Branches matching no word prefix are pruned instantly."], "label": "Word games"}, {"category": "word", "pitch": "Deflect spells with a mirror wheel of letter runes, swapping adjacent runes to grow a symmetric shield before impact. Longest-palindromic-substring checks measure the strongest contiguous shield in the current straightened wheel segment; they do not reorder letters to invent a better one.", "problems": ["Longest Palindromic Substring (5)"], "title": "Palindromancer", "how": ["Treat every position (and gap between positions) as a potential palindrome center and expand outward while both sides match, keeping the longest."], "label": "Word games"}, {"category": "word", "pitch": "Ride a raft down a river of unspaced story fragments, cutting words free to build planks and rescue bobbing passengers. Dictionary segmentation verifies that each generated stretch can be fully read; rapid choices decide which branch of the story your raft follows.", "problems": ["Word Break (139)"], "title": "Word Break Rapids", "how": ["DP over positions: position i is reachable if some earlier reachable position j plus a dictionary word covers j through i."], "label": "Word games"}, {"category": "word", "pitch": "Brew potions by reshuffling ingredient letters into words: dusty makes smoke, study grants focus, and discoveries change your shop's clientele. Anagram grouping finds recipes sharing the same ingredients, while dictionary membership validates each brew.", "problems": ["Group Anagrams (49)", "Implement Trie (Prefix Tree) (208)"], "title": "Anagram Alchemist", "how": ["Sort each word's letters, or count them. Words producing the same key are anagrams and land in the same bucket.", "A tree where each level is one character. Words sharing a prefix share nodes, so checking a word or listing completions only walks as deep as the word is long."], "label": "Word games"}, {"category": "word", "pitch": "Drive a storybook train and choose a destination phrase to search for in passing signboards, then brake at the matching station to recruit its character. Substring matching locates the next exact phrase behind the scenes; switching tracks and choosing passengers shape the unfolding tale.", "problems": ["Find the Index of the First Occurrence in a String (28)"], "title": "Storyline Express", "how": ["Slide the needle along the haystack checking each position. The smarter version (KMP) skips ahead by reusing partial matches it already found."], "label": "Word games"}, {"category": "word", "pitch": "Compete on a collapsing shared letter island, tracing words to fuel a shove, shield, or escape leap. Board search validates non-repeating tile paths and a trie checks vocabulary; territory is temporary footing rather than a second word-dungeon campaign.", "problems": ["Word Search II (212)", "Implement Trie (Prefix Tree) (208)"], "title": "Boggle Royale", "how": ["Build a Trie of all words, then DFS the board following Trie paths. Branches matching no word prefix are pruned instantly.", "A tree where each level is one character. Words sharing a prefix share nodes, so checking a word or listing completions only walks as deep as the word is long."], "label": "Word games"}, {"category": "word", "pitch": "Defend a library from marching bookworms by equipping turrets with spell words that trigger when those words pass across the worms' letter-marked bodies. Pattern matching detects hits, including overlaps through repeated searches; players choose firing positions and spell synergies.", "problems": ["Find the Index of the First Occurrence in a String (28)"], "title": "Glyph Defense", "how": ["Slide the needle along the haystack checking each position. The smarter version (KMP) skips ahead by reusing partial matches it already found."], "label": "Word games"}, {"category": "word", "pitch": "Cross a mirror-lake by casting a movable lantern beam onto a fixed inscription: symmetric stretches become temporary bridges. Palindrome checks identify bridge spans, while the player times jumps, moves the beam, and escorts a fragile companion without typing midair.", "problems": ["Longest Palindromic Substring (5)"], "title": "Mirror Span", "how": ["Treat every position (and gap between positions) as a potential palindrome center and expand outward while both sides match, keeping the longest."], "label": "Word games"}, {"category": "word", "pitch": "Deliver haunted parcels by piecing together half-remembered names from ghostly customers, then flick each parcel into its destination chute. Prefix lookup narrows valid addresses as clues arrive; conversation choices and mischievous moving chutes make each shift a small comedy.", "problems": ["Implement Trie (Prefix Tree) (208)"], "title": "Dead Letter Office", "how": ["A tree where each level is one character. Words sharing a prefix share nodes, so checking a word or listing completions only walks as deep as the word is long."], "label": "Word games"}, {"category": "word", "pitch": "Load a catapult with letter-stones, form a valid word before release, and aim for enemy banners bearing anagrams of your ammunition. Dictionary checks validate the word and anagram groups determine which magical armor shatters; wind, ricochets, and siege positioning decide the shot.", "problems": ["Group Anagrams (49)", "Implement Trie (Prefix Tree) (208)"], "title": "Scramble Siege", "how": ["Sort each word's letters, or count them. Words producing the same key are anagrams and land in the same bucket.", "A tree where each level is one character. Words sharing a prefix share nodes, so checking a word or listing completions only walks as deep as the word is long."], "label": "Word games"}, {"category": "building", "pitch": "Build a theatrical city with one crane and building modules that each take one beat to install; repeating a module type requires the same curing delay. The hidden scheduler sets the fastest possible completion of an order, while players choose layouts, commissions, and skyline silhouettes.", "problems": ["Task Scheduler (621)"], "title": "Skyline Scheduler", "how": ["The busiest task dictates the timeline: schedule around (max_count - 1) x (n + 1) slots plus the tasks tied for busiest, or just the task count if that's bigger."], "label": "Builders"}, {"category": "building", "pitch": "Build a hillside village around a network of separate roof gutters, each represented as a one-dimensional channel. Adjust roof heights and cistern placements before seasonal rain; trapped-water calculations estimate each gutter's storage, while population and crop plans turn the water into a long-term building economy.", "problems": ["Trapping Rain Water (42)"], "title": "Raincatcher", "how": ["For each position, water = min(tallest to the left, tallest to the right) minus height. Two pointers compute both maxima in one pass."], "label": "Builders"}, {"category": "building", "pitch": "Build an animatronic theater by placing assembly stations and routing arriving costume parts to the right performers. Merging timestamp-ordered feeder streams drives the factory's event queue automatically; players design production flow and choreograph the finished show rather than sort parts by hand.", "problems": ["Merge k Sorted Lists (23)"], "title": "Merge Works", "how": ["Feed all list heads into a min-heap and repeatedly pop the smallest, pushing its next node in. The pops come out fully sorted."], "label": "Builders"}, {"category": "building", "pitch": "Assemble a modular rope crossing over a canyon, testing it with a parade of oddball travelers. Connectivity checks reject detached spans, while a separate load simulation judges structural safety; players balance cost, wobble, and spectacular collapses rather than treating connectivity as engineering proof.", "problems": ["Number of Connected Components in an Undirected Graph (323)"], "title": "Union Falls", "how": ["Union-Find: start with every node in its own set, merge sets for each edge, then count how many distinct sets remain."], "label": "Builders"}, {"category": "building", "pitch": "Build a monster-hunting guild hall, equipping trophy rooms and sending complementary adventurer teams on contracts. A top-k selector fills the prestigious board with the best-paying available jobs; players can accept any displayed bounty and judge its danger against its reward.", "problems": ["Kth Largest Element in an Array (215)"], "title": "Bounty Board", "how": ["Keep a min-heap of size k while scanning. It always holds the k biggest seen so far, so its top is the kth largest."], "label": "Builders"}, {"category": "building", "pitch": "Restore a dark city's districts by laying cable, then add backup loops to survive nightly storms. A minimum spanning tree over Manhattan cable costs supplies the cheapest baseline for the initial unobstructed layout; resilience and later hazards are separate construction goals.", "problems": ["Min Cost to Connect All Points (1584)"], "title": "Blackout Grid", "how": ["Kruskal's method: sort all possible edges by cost and connect points cheapest-first, skipping any edge that would form a cycle."], "label": "Builders"}, {"category": "building", "pitch": "Carve terraces to deliver gravity-fed water to two rival coastal cities, choosing where to place shared springs. Reverse flow reachability identifies sources able to reach both coasts under non-increasing elevation rules; a separate water-budget model determines how much each city receives.", "problems": ["Pacific Atlantic Water Flow (417)"], "title": "Aqueduct", "how": ["Instead of flowing downhill from each cell, run reverse flood-fills uphill from both oceans and keep the cells reachable from both."], "label": "Builders"}, {"category": "building", "pitch": "Construct a magnetic block sculpture around a crown, then take turns removing pieces to claim it. Grid connectivity identifies blocks detached from the foundation, and an explicit gravity rule drops them; the game promises stylized collapse, not realistic structural physics.", "problems": ["Number of Islands (200)"], "title": "Jenga Union", "how": ["Scan the grid. Every time you hit unvisited land, flood-fill the whole connected blob and count it as one island."], "label": "Builders"}, {"category": "building", "pitch": "Build docks for a colorful harbor, assigning berths to ships with announced arrival and departure times while leaving room for surprise festival boats. Interval overlap computes the minimum simultaneous berth requirement; players choose expansion sites and service specialties instead of merging sorted queues.", "problems": ["Meeting Rooms II (253)"], "title": "Harbor Master", "how": ["Sort all start and end times. Sweep through, +1 room when a meeting starts and -1 when one ends. The peak count is the answer."], "label": "Builders"}, {"category": "building", "pitch": "Build a ring of roadside fuel stops for a crew of getaway drivers, choosing which station becomes their safehouse and start point. Circular fuel-balance checks identify starts that complete the loop; players invest in supplies and watch cinematic escapes on the network they built.", "problems": ["Gas Station (134)"], "title": "Gas Station Getaway", "how": ["If total gas covers total cost, a valid start exists. Walk the stations tracking your tank; whenever it goes negative, the answer must lie after the station that broke you."], "label": "Builders"}, {"category": "racing", "pitch": "Race anti-gravity ribbons with boost, grip, and battery choices at each junction. A weighted search over track section, speed band, and battery finds a realizable medal route in the same discrete driving model; the player sees a ghost to chase, never the search.", "problems": ["Dijkstra's Algorithm"], "title": "Slipstream GP", "how": ["Always expand the cheapest unvisited node first via a priority queue. Once a node is expanded, its cheapest cost is final, because any other route would cost at least as much."], "label": "Racing"}, {"category": "racing", "pitch": "Race a four-driver relay where a clean moving handoff preserves speed and a botched one costs the team the lead. A search over runner assignments and explicit handoff states computes a feasible team benchmark; players coordinate racing lines and baton timing.", "problems": ["DFS Traversal"], "title": "Redline Relay", "how": ["Go as deep as possible down one path before backtracking: visit a node, then recursively visit each unvisited neighbor."], "label": "Racing"}, {"category": "racing", "pitch": "Drift through a neon debt-collection run where stylish corners earn cash but missed exits leave debts unpaid. A shortest-path search over discrete position, heading, speed, and drift state sets a reachable checkpoint par using legal actions; score rewards come from the separate style model.", "problems": ["BFS Shortest Path"], "title": "Drift Debt", "how": ["Explore outward in rings: visit every neighbor first, then their neighbors. The first time you reach a node, you've found the shortest path to it."], "label": "Racing"}, {"category": "racing", "pitch": "Race a rotating tunnel, snapping between lanes to catch boost rings as shutters sweep across them. A search over lane, tunnel phase, speed, and time verifies an escape through each generated segment before it spawns.", "problems": ["BFS Shortest Path"], "title": "Night Tunnel", "how": ["Explore outward in rings: visit every neighbor first, then their neighbors. The first time you reach a node, you've found the shortest path to it."], "label": "Racing"}, {"category": "racing", "pitch": "Call tire changes during a race where each tire's successive lap times grow by a fixed multiplier and every pit stop has the same cost. With unlimited replacement tires, stint dynamic programming computes the fastest legal race; you watch an AI driver execute your calls and chase that attainable benchmark.", "problems": ["Minimum Time to Finish the Race (2188)"], "title": "Pit Wall", "how": ["Precompute the cheapest time for every possible run of consecutive laps on fresh tires, then use DP over total laps to decide where each tire change happens."], "label": "Racing"}, {"category": "racing", "pitch": "Race your own ghost with instant rewind, collecting clean sector runs to improve tomorrow's rival. A weighted compatibility graph joins sectors only when boundary position, velocity, and control state match, then replays the full candidate to validate a drivable ghost.", "problems": ["Dijkstra's Algorithm"], "title": "Chrono Kart", "how": ["Always expand the cheapest unvisited node first via a priority queue. Once a node is expanded, its cheapest cost is final, because any other route would cost at least as much."], "label": "Racing"}, {"category": "racing", "pitch": "Race a snow bike down branching mountain trails, choosing sheltered detours or exposed shortcuts as a seeded blizzard rolls in. A time-expanded weighted search includes weather phase and movement state to compute a feasible route; changing weather outside that seed invalidates the old par.", "problems": ["Dijkstra's Algorithm"], "title": "Summit Storm", "how": ["Always expand the cheapest unvisited node first via a priority queue. Once a node is expanded, its cheapest cost is final, because any other route would cost at least as much."], "label": "Racing"}, {"category": "racing", "pitch": "Surf the draft behind a pack of futuristic cyclists, switching wheels before the leader tires and timing one final slingshot. A sliding-window maximum tracks each rival's recent pace to inform wind-shadow previews; movement simulation determines whether a pass succeeds.", "problems": ["Sliding Window Maximum (239)"], "title": "Aero Pack", "how": ["A deque keeps candidate maximums in decreasing order as the window slides: drop smaller values from the back, drop out-of-window values from the front."], "label": "Racing"}, {"category": "racing", "pitch": "Pilot a rocket dragster with two controls: accelerate moves at your current speed then doubles it, while reverse flips direction and resets speed magnitude to one. A state-space solver sets the fewest-command ghost for reaching each finish marker; the player feels the thrill of a huge overshoot and perfect return.", "problems": ["Race Car (818)"], "title": "Gear Ghost", "how": ["BFS over (position, speed) states. From each state you can accelerate or reverse; the shortest instruction sequence to the target wins."], "label": "Racing"}, {"category": "racing", "pitch": "Weave through highway traffic arriving from two on-ramps, choosing risky near-misses for boost. Merging arrival schedules orders spawns; a separate search over lane, speed, and time rejects waves without a collision-free escape under the same driving rules.", "problems": ["Merge Sorted Array (88)", "BFS Shortest Path"], "title": "Merge Lane", "how": ["Fill from the back: compare the largest remaining elements of both arrays and place the bigger one at the end, so nothing gets overwritten.", "Explore outward in rings: visit every neighbor first, then their neighbors. The first time you reach a node, you've found the shortest path to it."], "label": "Racing"}, {"category": "card-board", "pitch": "Crack vaults by playing tool cards that punch different depths into a mechanical lock, deciding whether to open one more safe before the alarm. Tool types are reusable with unlimited charges, so coin-change optimization verifies each lock and sets its minimum-use par; risk comes from the alarm, not a finite deck.", "problems": ["Coin Change (322)"], "title": "Coin Heist", "how": ["For every amount from 1 up to the target, try each coin and keep the fewest coins needed. Bigger answers are built from smaller ones already solved."], "label": "Card & board"}, {"category": "card-board", "pitch": "Place royal sentries on a chessboard courtyard so their sightlines never expose one another, protecting a masquerade from spies. Constrained N-Queens enumeration verifies each board's fixed obstacles and placements; no movement-count claim is attached to a placement solver.", "problems": ["N-Queens (51)"], "title": "Crown Tactics", "how": ["Place queens row by row with backtracking: try each column, and if it attacks an existing queen, undo and try the next. Only full valid boards survive."], "label": "Card & board"}, {"category": "card-board", "pitch": "Climb a storybook tower by choosing reusable one-step or two-step movement cards, stopping at tempting shops and dangerous treasure landings. The stair recurrence counts possible route sequences; an extended state check handles blocked landings and health before a challenge is offered.", "problems": ["Climbing Stairs (70)"], "title": "Tower Climb", "how": ["The ways to reach step n equal the ways to reach n-1 plus n-2, since you arrive from one or two steps below. Build up from the bottom instead of recursing."], "label": "Card & board"}, {"category": "card-board", "pitch": "Race rivals to build a rising parade of creatures from a face-up dealt row, recruiting from left to right and skipping creatures you cannot fit. Longest-increasing-subsequence optimization sets the best attainable parade length for that fixed order; players cannot freely sort the hand.", "problems": ["Longest Increasing Subsequence (300)"], "title": "Run Riot", "how": ["For each number, the longest increasing run ending there is 1 + the best run ending at any smaller earlier number. Take the max."], "label": "Card & board"}, {"category": "card-board", "pitch": "Race an opponent on private copies of the same Sudoku board, claiming a row trophy whenever you finish one first. Backtracking generates boards and counts solutions up to two to enforce uniqueness; placements are checked against the unique solution, and claimed rows never change the opponent's puzzle.", "problems": ["Sudoku Solver (37)"], "title": "Gridlock Versus", "how": ["Backtracking: try digits 1-9 in each empty cell, recurse, and undo on contradiction. Constraint checks prune dead branches early."], "label": "Card & board"}, {"category": "card-board", "pitch": "Bid for treasure from either end of a face-up cargo row, taking turns with theatrical pirate captains who taunt and feint about their next choice. Interval minimax evaluates the exact perfect-information end-picking game; the captains' banter is flavor rather than a claim to solve hidden-information bluffing.", "problems": ["Predict the Winner (486)"], "title": "Bluff Harbor", "how": ["Minimax DP: each player picks the left or right end maximizing their own eventual score difference, assuming the opponent does the same."], "label": "Card & board"}, {"category": "card-board", "pitch": "Flip tiles on a shared table, race to make words, and steal an opponent's word by adding a letter and rearranging it. Dictionary checks validate plays and rack generation plants at least one dictionary word; the backbone does not mistake arbitrary permutations for meaningful words.", "problems": ["Implement Trie (Prefix Tree) (208)"], "title": "Letter Storm", "how": ["A tree where each level is one character. Words sharing a prefix share nodes, so checking a word or listing completions only walks as deep as the word is long."], "label": "Card & board"}, {"category": "card-board", "pitch": "Guide a mountain expedition by choosing camps and spending ration tokens on shelter, scouting, or risky shortcuts. A finite-supply knapsack model evaluates each pack's useful gear under its carrying limit; a separate route-and-inventory search validates generated treks, leaving survival to the player's choices.", "problems": ["0/1 Knapsack"], "title": "Iron Rations", "how": ["Build a table where each cell answers: with this much capacity and these items considered, what's the best value? Each item is either taken or skipped, and bigger answers reuse smaller ones already solved."], "label": "Card & board"}, {"category": "card-board", "pitch": "Build a tiny traveling menagerie by drafting creatures that eat different amounts of sunfruit and moonberries, then unveil the largest fed collection at the festival. Two-budget 0/1 selection computes the best achievable creature count from each fixed market; illustrated diets and creature personalities carry the game.", "problems": ["Ones and Zeroes (474)"], "title": "Familiar Market", "how": ["Knapsack with two budgets (zeros and ones). A 2D table tracks the best string count achievable for every zeros-and-ones allowance."], "label": "Card & board"}, {"category": "card-board", "pitch": "Play a cooperative board game about helping sleepy cats cross a train before their station arrives, hopping between cushions with different spring strengths. Reachability checks validate the fixed cushion row, while players spend shared blankets to alter hops and rescue tempting optional kittens.", "problems": ["Jump Game (55)"], "title": "Catnap Carriages", "how": ["Walk the array tracking the farthest index reachable so far. If you ever stand beyond your reach it's impossible; otherwise you make it."], "label": "Card & board"}];
var CATS = [["all","All"],["dungeon","Dungeon crawlers"],["tower-defense","Tower defense"],["arcade","Arcade"],["puzzle","Puzzle"],["multiplayer","Multiplayer"],["idle","Idle"],["word","Word games"],["building","Builders"],["racing","Racing"],["card-board","Card & board"]];
var KEY = 'lc-games-stars-v1';
var stars = {};
try { stars = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) {}
var fCat = 'all', fQ = '', fStar = false;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(stars)); } catch(e) {} updateFoot(); }
function starCount(){ var n=0; for (var k in stars) if (stars[k]) n++; return n; }
function updateFoot(){ var n = starCount(); document.getElementById('nstar').textContent = n ? n + ' starred' : ''; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function boneHtml(it){
  var out = '<div class="bone">';
  for (var i = 0; i < it.problems.length; i++) {
    out += '<div class="brow"><div class="aname">' + esc(it.problems[i]) + '</div><div class="ahow">' + esc(it.how[i]) + '</div></div>';
  }
  return out + '</div>';
}
function render(){
  var chips = document.getElementById('chips'); chips.innerHTML = '';
  CATS.forEach(function(c){
    var b = document.createElement('button');
    b.className = 'chip' + (fCat === c[0] ? ' on' : '');
    b.textContent = c[1];
    b.onclick = function(){ fCat = c[0]; render(); };
    chips.appendChild(b);
  });
  document.getElementById('sf').className = 'starfilter' + (fStar ? ' on' : '');
  var q = fQ.trim().toLowerCase();
  var shown = 0, out = [];
  IDEAS.forEach(function(it, i){
    var id = 'g' + i;
    if (fStar && !stars[id]) return;
    if (fCat !== 'all' && it.category !== fCat) return;
    if (q) {
      var hay = (it.title + ' ' + it.pitch + ' ' + it.problems.join(' ') + ' ' + it.how.join(' ') + ' ' + it.label).toLowerCase();
      if (hay.indexOf(q) < 0) return;
    }
    shown++;
    var on = !!stars[id];
    out.push('<div class="card"><div class="num">#' + (i+1) + '</div><div class="body"><h3>' + esc(it.title) + '</h3><div class="cat">' + esc(it.label) + '</div><p>' + esc(it.pitch) + '</p>' + boneHtml(it) + '</div><button class="starbtn' + (on ? ' on' : '') + '" data-id="' + id + '" aria-label="star">' + (on ? '★' : '☆') + '</button></div>');
  });
  document.getElementById('list').innerHTML = out.join('') || '<div class="empty">Nothing matches. Try another search.</div>';
  document.getElementById('count').textContent = shown + ' of ' + IDEAS.length + ' ideas';
  var btns = document.querySelectorAll('.starbtn');
  for (var j = 0; j < btns.length; j++) {
    btns[j].onclick = function(){
      var id = this.getAttribute('data-id');
      stars[id] = !stars[id];
      this.className = 'starbtn' + (stars[id] ? ' on' : '');
      this.textContent = stars[id] ? '★' : '☆';
      save();
      if (fStar) render();
    };
  }
  updateFoot();
}
document.getElementById('q').addEventListener('input', function(){ fQ = this.value; render(); });
document.getElementById('sf').addEventListener('click', function(){ fStar = !fStar; render(); });
document.getElementById('copy').addEventListener('click', function(){
  var lines = ['My starred game ideas (LeetCode as hidden backbone):'];
  IDEAS.forEach(function(it, i){
    if (stars['g'+i]) {
      lines.push('', (i+1) + '. ' + it.title + ' [' + it.label + ']', '   ' + it.pitch);
      for (var k = 0; k < it.problems.length; k++) lines.push('   ' + it.problems[k] + ': ' + it.how[k]);
    }
  });
  if (lines.length === 1) lines.push('', '(none starred yet)');
  var txt = lines.join('\n');
  function done(){ var c = document.getElementById('copied'); c.style.display = 'inline'; setTimeout(function(){ c.style.display = 'none'; }, 1800); }
  function fb(){ var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e){} document.body.removeChild(ta); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(fb); else fb();
});
render();
</script>
</body>
</html>
