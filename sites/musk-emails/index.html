const list = document.getElementById("list"),
      search = document.getElementById("search"),
      count = document.getElementById("count");
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function render(q){
  list.innerHTML = "";
  q = q.toLowerCase();
  const items = EMAILS.filter(e => !q ||
    (e.subj + " " + e.date + " " + e.body.join(" ")).toLowerCase().includes(q));
  count.textContent = items.length + " of " + EMAILS.length + " emails";
  if (!items.length) { list.innerHTML = '<div class="empty">No emails match.</div>'; return; }
  items.forEach(e => {
    const d = document.createElement("div");
    d.className = "email";
    d.innerHTML =
      '<div class="head"><span class="chev">▾</span>' +
      '<div class="subj">' + esc(e.subj) + "</div>" +
      '<div class="meta"><span class="co">' + esc(e.from) + "</span> → " + esc(e.to) + " · " + esc(e.date) + "</div>" +
      (e.flag ? '<span class="flag">⚠ ' + esc(e.flag) + "</span>" : "") +
      "</div>" +
      '<div class="body"><div class="ctx">' + esc(e.ctx) + "</div>" +
      '<div class="letter">' + e.body.map(p => "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>").join("") + "</div>" +
      '<div class="src">Sources: ' + e.src.map(s => '<a href="' + s[1] + '" target="_blank" rel="noopener">' + esc(s[0]) + " ↗</a>").join("") + "</div>" +
      "</div>";
    d.querySelector(".head").addEventListener("click", () => d.classList.toggle("open"));
    list.appendChild(d);
  });
}
search.addEventListener("input", () => render(search.value));
