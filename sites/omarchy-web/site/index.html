<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>omarchy-web — unofficial concept</title>
<style>
:root {
  color-scheme: dark;
  --bg: #1a1b26; --bg2: #24283b; --fg: #c0caf5; --muted: #565f89;
  --accent: #7aa2f7; --accent2: #bb9af7;
  --bar-bg: #16161ed9; --bar-fg: #c0caf5;
  --win-bg: #1a1b26; --win-fg: #c0caf5; --titlebar-bg: #24283b;
  --border: #3b4261; --term-bg: #101018; --term-fg: #9eceff; --radius: 10px;
  --bar-height: 54px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--bg); color: var(--fg);
}
* { box-sizing: border-box; }
html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button, a, input, select, textarea, label, summary, [role="button"], [tabindex], .window {
  touch-action: manipulation;
}
button { cursor: pointer; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg2); padding: 9px 14px; }
button:hover { border-color: var(--accent); color: var(--accent); }
button:active { transform: translateY(1px); }
button:disabled { cursor: default; opacity: .5; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 3px;
}
input:not([type="range"]):not([type="checkbox"]), select, textarea {
  max-width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px; caret-color: var(--accent);
}
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
input[type="range"], input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }
a { color: var(--accent); }
svg { width: 20px; height: 20px; flex-shrink: 0; vertical-align: middle; }
[hidden] { display: none !important; }
::selection { background: var(--accent); color: var(--bg); }
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.muted { color: var(--muted); }
.eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: .2em; font-size: 11px; }
.icon-button { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; }
.primary-button { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
.primary-button:hover { background: var(--accent2); border-color: var(--accent2); color: var(--bg); }
#boot { position: fixed; inset: 0; z-index: 10000; background: var(--term-bg); color: var(--term-fg); padding: clamp(24px, 7vw, 90px); overflow: auto; transition: opacity .35s ease; }
#boot.leaving { opacity: 0; pointer-events: none; }
.boot-heading { color: var(--accent); margin: 0 0 30px; font-size: 14px; font-weight: 500; }
.boot-line { margin: 5px 0; font-size: clamp(11px, 2vw, 14px); white-space: pre-wrap; overflow-wrap: anywhere; }
.boot-ok { color: var(--accent2); }
.boot-cursor { display: inline-block; margin-top: 12px; color: var(--accent); animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { opacity: 0; } }
#login { position: fixed; inset: 0; z-index: 9000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px; overflow: auto; background: radial-gradient(ellipse at 50% 20%, var(--bg2), var(--bg) 75%); }
.login-card { width: min(100%, 360px); text-align: center; padding: 34px 30px; border: 1px solid var(--border); border-radius: calc(var(--radius) + 10px); background: var(--bar-bg); box-shadow: 0 24px 80px #0003; }
.avatar { width: 78px; height: 78px; border: 1px solid var(--accent); color: var(--accent); background: var(--bg2); border-radius: 50%; display: grid; place-items: center; margin: 0 auto 20px; }
.avatar svg { width: 38px; height: 38px; }
.login-card h1 { margin: 0; font-size: 25px; font-weight: 500; }
.login-caption { color: var(--muted); font-size: 12px; margin: 7px 0 25px; }
.login-card label { display: block; text-align: left; margin-bottom: 7px; font-size: 12px; }
.login-card input, .login-card button { width: 100%; min-height: 46px; }
.login-card button { margin-top: 12px; }
.login-hint { margin: 15px 0 0; color: var(--muted); font-size: 11px; }
.login-footer { text-align: center; max-width: 480px; font-size: 11px; color: var(--fg); opacity: .7; }
#desktop { position: absolute; inset: 0; isolation: isolate; background: var(--bg); overflow: hidden; }
#topbar { position: absolute; inset: 0 0 auto; height: var(--bar-height); z-index: 100; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 0 14px; color: var(--bar-fg); background: var(--bar-bg); border-bottom: 1px solid var(--border); backdrop-filter: blur(18px); }
.workspaces { display: flex; gap: 5px; align-items: center; min-width: 0; }
.workspace-pill { position: relative; min-width: 34px; height: 34px; padding: 0; border-color: transparent; background: transparent; font-size: 12px; }
.workspace-pill.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
.workspace-pill.occupied::after { content: ''; position: absolute; bottom: 3px; left: calc(50% - 2px); width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
#clock { font-size: 13px; font-variant-numeric: tabular-nums; letter-spacing: .06em; }
.tray { display: flex; justify-self: end; align-items: center; gap: 5px; }
.tray button { background: transparent; border-color: transparent; }
.tray button:hover, .tray button[aria-expanded="true"] { background: var(--bg2); color: var(--accent); }
.tray-status { display: inline-flex; gap: 12px; align-items: center; height: 40px; padding: 0 10px; }
.tray-status svg { width: 17px; height: 17px; }
.tray-status .offline { opacity: .35; }
#ws-area { position: absolute; top: var(--bar-height); bottom: 26px; left: 0; right: 0; margin: 12px; }
.desktop-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; padding: 24px; pointer-events: none; }
.desktop-empty .empty-mark { display: grid; grid-template-columns: repeat(3, 13px); gap: 7px; transform: rotate(-12deg); margin-bottom: 14px; }
.empty-mark span { width: 13px; height: 13px; border: 1px solid var(--accent); opacity: .6; }
.empty-mark span:nth-child(3n + 1) { background: var(--accent); opacity: .2; }
.desktop-empty h1 { font-size: clamp(22px, 3vw, 36px); font-weight: 400; margin: 0; letter-spacing: -.05em; }
.desktop-empty p { max-width: 400px; margin: 0; font-size: 12px; opacity: .7; }
.desktop-empty button { pointer-events: auto; margin-top: 9px; background: var(--bar-bg); }
.window { position: absolute; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; background: var(--win-bg); color: var(--win-fg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 12px 32px #0003; }
.window.focused { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 16px 44px #0003; }
.titlebar, .window-titlebar { flex: 0 0 42px; min-height: 42px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 5px 0 14px; background: var(--titlebar-bg); border-bottom: 1px solid var(--border); user-select: none; }
.window-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.window-close { flex: 0 0 34px; width: 34px; height: 34px; padding: 0; background: transparent; border-color: transparent; color: var(--muted); font-size: 23px; line-height: 1; }
.window-close:hover { background: var(--bg); color: var(--accent2); }
.window-body { flex: 1 1 0%; min-width: 0; min-height: 0; overflow: auto; position: relative; }
.app-error { padding: 24px; }
.overlay { position: fixed; inset: 0; z-index: 500; background: var(--bar-bg); backdrop-filter: blur(24px); overflow: auto; overscroll-behavior: contain; }
#launcher { display: flex; align-items: flex-start; justify-content: center; padding: clamp(32px, 12vh, 130px) 24px 45px; }
.launcher-content { width: min(100%, 750px); }
.overlay-heading { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 24px; }
.overlay-heading h2 { margin: 0; font-size: 20px; font-weight: 500; }
#launcher-search { width: 100%; font-size: clamp(18px, 3vw, 28px); padding: 20px 22px; background: var(--bg); box-shadow: 0 12px 40px #0002; }
.launcher-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-top: 26px; }
.launcher-app { min-height: 145px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; padding: 22px 12px; background: var(--win-bg); }
.launcher-app:first-child { border-color: var(--accent); }
.launcher-app:hover { background: var(--bg2); }
.app-icon { display: grid; place-items: center; font-size: 34px; min-height: 42px; color: var(--accent); }
.app-icon svg { width: 36px; height: 36px; }
.launcher-title { font-size: 13px; }
.launcher-help { margin-top: 24px; font-size: 11px; color: var(--fg); opacity: .65; }
.launcher-no-results { grid-column: 1 / -1; text-align: center; padding: 35px 10px; }
#shortcuts { display: grid; place-items: center; padding: 24px; }
.shortcuts-panel { width: min(100%, 490px); padding: 28px; background: var(--win-bg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 24px 70px #0004; }
.shortcut-list { margin: 0; }
.shortcut-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 14px 0; border-top: 1px solid var(--border); }
.shortcut-row dt { font-size: 12px; }
.shortcut-row dd { margin: 0; white-space: nowrap; }
kbd { font: inherit; font-size: 11px; display: inline-block; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 3px 7px; background: var(--bg2); }
.shortcuts-note { margin: 20px 0 0; font-size: 11px; color: var(--muted); }
#quicksettings { position: fixed; z-index: 500; top: calc(var(--bar-height) + 9px); right: 12px; width: min(330px, calc(100% - 24px)); max-height: calc(100% - var(--bar-height) - 30px); overflow: auto; padding: 20px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--win-bg); box-shadow: 0 18px 60px #0005; }
#quicksettings .overlay-heading { margin-bottom: 16px; }
#quicksettings h2 { font-size: 15px; }
.quick-toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
.quick-toggle { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; font-size: 12px; }
.quick-toggle[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.slider-control { display: block; margin-top: 15px; }
.slider-heading { display: flex; justify-content: space-between; font-size: 12px; }
.slider-control input { display: block; width: 100%; min-height: 34px; margin: 4px 0 0; }
.quick-note { border-top: 1px solid var(--border); margin: 16px 0 0; padding-top: 12px; font-size: 10px; color: var(--muted); }
#toast { position: fixed; z-index: 11000; left: 50%; bottom: 42px; transform: translateX(-50%); max-width: min(90vw, 520px); padding: 12px 20px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--win-bg); color: var(--win-fg); box-shadow: 0 8px 35px #0005; font-size: 12px; text-align: center; overflow-wrap: anywhere; pointer-events: none; opacity: 0; transition: opacity .18s ease; }
#toast.visible { opacity: 1; }
#ver { position: fixed; z-index: 9500; right: max(12px, env(safe-area-inset-right)); bottom: max(7px, env(safe-area-inset-bottom)); font-size: 10px; color: var(--fg); opacity: .55; pointer-events: none; }
/* Shared app primitives inherit the same theme as window chrome. */
.window-body h1, .window-body h2, .window-body h3 { color: var(--win-fg); }
.window-body pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.window-body table { width: 100%; border-collapse: collapse; }
.window-body th, .window-body td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); }
.app-content { min-width: 0; min-height: 100%; }
.app-toolbar { display: flex; align-items: center; gap: 8px; padding: 12px; background: var(--bg2); border-bottom: 1px solid var(--border); }
.app-toolbar button { min-height: 38px; white-space: nowrap; font-size: 12px; }
.files-app, .browser-app { display: flex; flex-direction: column; height: 100%; }
.files-toolbar { flex: 0 0 auto; }
.files-breadcrumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.files-breadcrumbs .breadcrumb { padding: 4px 6px; min-height: 32px; border-color: transparent; background: transparent; }
.breadcrumb-separator { color: var(--muted); }
.files-layout { display: flex; min-height: 0; flex: 1; }
.files-sidebar { display: flex; flex-direction: column; gap: 5px; width: 150px; flex: 0 0 150px; padding: 16px 10px; border-right: 1px solid var(--border); overflow: auto; }
.files-place { text-align: left; font-size: 12px; background: transparent; border-color: transparent; min-height: 42px; }
.files-place.active { background: var(--bg2); color: var(--accent); }
.files-main { min-width: 0; flex: 1; padding: 18px; overflow: auto; }
.files-summary { color: var(--muted); font-size: 11px; margin: 0 0 14px; }
.files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.file-item { display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 104px; padding: 14px 8px; background: transparent; border-color: transparent; }
.file-item:hover { background: var(--bg2); }
.file-icon { font-size: 28px; }
.file-name { font-size: 11px; overflow-wrap: anywhere; }
.files-viewer h2 { font-size: 17px; overflow-wrap: anywhere; }
.files-content { background: var(--term-bg); color: var(--term-fg); padding: 20px; border-radius: var(--radius); font-size: 12px; line-height: 1.8; }
.settings-app { padding: clamp(18px, 3vw, 34px); }
.settings-app h1 { font-size: 23px; font-weight: 500; margin: 0 0 10px; }
.settings-app p { font-size: 12px; line-height: 1.8; }
.settings-app h2 { margin: 27px 0 12px; font-size: 14px; font-weight: 500; }
.settings-grid, .browser-theme-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.theme-card, .wallpaper-card { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 14px; text-align: left; font-size: 12px; overflow: hidden; }
.theme-card svg, .browser-theme-card svg { width: 120px; max-width: 100%; height: 28px; }
.theme-card[aria-pressed="true"], .wallpaper-card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.wallpaper-preview { width: 100%; height: 70px; border-radius: calc(var(--radius) / 2); }
.settings-toggle { min-height: 44px; }
.settings-version { color: var(--muted); }
.browser-toolbar { flex: 0 0 auto; flex-wrap: wrap; }
.browser-address { flex: 1 1 130px; min-width: 0; width: 0; font-size: 12px; }
.browser-page { flex: 1; min-height: 0; padding: clamp(20px, 4vw, 48px); overflow: auto; line-height: 1.8; }
.browser-nav { font-size: 12px; display: flex; flex-wrap: wrap; gap: 10px; }
.browser-link { text-underline-offset: 5px; }
.browser-notice { font-size: 10px; color: var(--muted); margin-bottom: 36px; }
.browser-eyebrow { color: var(--accent); font-size: 11px; }
.browser-headline { max-width: 650px; font-size: clamp(28px, 4vw, 54px); font-weight: 500; line-height: 1.15; letter-spacing: -.05em; }
.browser-description { max-width: 650px; }
.browser-page p { font-size: 13px; }
.browser-page .browser-notice { font-size: 10px; }
.browser-page h2 { margin-top: 30px; font-size: 18px; font-weight: 500; }
.browser-theme-grid { margin: 24px 0; }
.browser-theme-card { padding: 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg2); }
.browser-theme-card h2 { font-size: 13px; margin: 12px 0 0; }
body.no-animations *, body.no-animations *::before, body.no-animations *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
@media (max-width: 720px) {
  :root { --bar-height: 54px; }
  #topbar { gap: 3px; padding: 0 5px; }
  .workspaces { gap: 0; }
  .workspace-pill { min-width: 27px; width: 27px; height: 42px; }
  #clock { font-size: 11px; letter-spacing: 0; }
  .tray { gap: 0; }
  .tray .icon-button { width: 32px; height: 44px; }
  .tray-status { padding: 0 5px; gap: 5px; height: 44px; }
  .tray-status svg { width: 14px; height: 14px; }
  #ws-area { margin: 0; bottom: 0; }
  .window { top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; border: 0; box-shadow: none !important; }
  .window:not(.focused) { display: none; }
  .titlebar, .window-titlebar { flex-basis: 46px; min-height: 46px; padding-left: 12px; }
  .window-close { height: 42px; width: 44px; flex-basis: 44px; }
  .window-body { padding-bottom: env(safe-area-inset-bottom); }
  #launcher { padding: 24px 18px 40px; }
  .launcher-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .launcher-app { min-height: 150px; }
  #launcher-search { font-size: 18px; padding: 16px; }
  .shortcuts-panel { padding: 22px 18px; }
  .shortcut-row { gap: 8px; }
  #quicksettings { right: 8px; }
  .login-card { padding: 28px 24px; }
  #ver { font-size: 9px; }
  .files-layout { flex-direction: column; }
  .files-sidebar { flex: 0 0 auto; width: 100%; flex-direction: row; padding: 6px; border-right: 0; border-bottom: 1px solid var(--border); }
  .files-place { flex-shrink: 0; padding: 8px 10px; }
  .files-main { padding: 14px; }
  .browser-toolbar { gap: 5px; padding: 8px; }
  .browser-toolbar button { padding: 8px; font-size: 11px; }
  .browser-address { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* omarchy-web data: themes, wallpapers, fake filesystem. Read-only for app workers. */
window.THEMES = {
  "tokyo-night": { label: "Tokyo Night", vars: {
    "--bg":"#1a1b26","--bg2":"#24283b","--fg":"#c0caf5","--muted":"#565f89",
    "--accent":"#7aa2f7","--accent2":"#bb9af7","--bar-bg":"#16161ed9","--bar-fg":"#c0caf5",
    "--win-bg":"#1a1b26","--win-fg":"#c0caf5","--titlebar-bg":"#24283b",
    "--border":"#3b4261","--term-bg":"#101018","--term-fg":"#9eceff","--radius":"10px" }},
  "catppuccin": { label: "Catppuccin Mocha", vars: {
    "--bg":"#1e1e2e","--bg2":"#313244","--fg":"#cdd6f4","--muted":"#6c7086",
    "--accent":"#cba6f7","--accent2":"#f5c2e7","--bar-bg":"#11111bd9","--bar-fg":"#cdd6f4",
    "--win-bg":"#1e1e2e","--win-fg":"#cdd6f4","--titlebar-bg":"#313244",
    "--border":"#45475a","--term-bg":"#11111b","--term-fg":"#a6e3a1","--radius":"12px" }},
  "gruvbox": { label: "Gruvbox Dark", vars: {
    "--bg":"#282828","--bg2":"#3c3836","--fg":"#ebdbb2","--muted":"#928374",
    "--accent":"#fabd2f","--accent2":"#fe8019","--bar-bg":"#1d2021d9","--bar-fg":"#ebdbb2",
    "--win-bg":"#282828","--win-fg":"#ebdbb2","--titlebar-bg":"#3c3836",
    "--border":"#504945","--term-bg":"#1d2021","--term-fg":"#b8bb26","--radius":"6px" }},
  "nord": { label: "Nord", vars: {
    "--bg":"#2e3440","--bg2":"#3b4252","--fg":"#eceff4","--muted":"#616e88",
    "--accent":"#88c0d0","--accent2":"#81a1c1","--bar-bg":"#242933d9","--bar-fg":"#eceff4",
    "--win-bg":"#2e3440","--win-fg":"#eceff4","--titlebar-bg":"#3b4252",
    "--border":"#4c566a","--term-bg":"#242933","--term-fg":"#8fbcbb","--radius":"8px" }},
  "dracula": { label: "Dracula", vars: {
    "--bg":"#282a36","--bg2":"#44475a","--fg":"#f8f8f2","--muted":"#6272a4",
    "--accent":"#bd93f9","--accent2":"#ff79c6","--bar-bg":"#21222cd9","--bar-fg":"#f8f8f2",
    "--win-bg":"#282a36","--win-fg":"#f8f8f2","--titlebar-bg":"#44475a",
    "--border":"#6272a4","--term-bg":"#21222c","--term-fg":"#50fa7b","--radius":"10px" }},
  "rose-pine": { label: "Rosé Pine", vars: {
    "--bg":"#191724","--bg2":"#1f1d2e","--fg":"#e0def4","--muted":"#6e6a86",
    "--accent":"#ebbcba","--accent2":"#c4a7e7","--bar-bg":"#12111ad9","--bar-fg":"#e0def4",
    "--win-bg":"#191724","--win-fg":"#e0def4","--titlebar-bg":"#1f1d2e",
    "--border":"#403d52","--term-bg":"#12111a","--term-fg":"#9ccfd8","--radius":"14px" }}
};

window.WALLPAPERS = [
  { name: "Aurora",   css: "radial-gradient(1200px 800px at 20% 10%, #3b2f6b 0%, transparent 60%), radial-gradient(1000px 700px at 85% 80%, #0f4c5c 0%, transparent 55%), linear-gradient(160deg, #141422, #1d1b2e)" },

          grid.append(item);
        });
        if (!entries.length) grid.append(el('p', 'empty-state', 'This folder is empty.'));
        main.append(grid);
      }
      open(HOME);
    }
  };

  O.Apps.settings = {
    title: 'Settings', icon: '⚙️',
    render(body, api) {
      const root = mount(body, 'settings');
      root.append(el('h1', '', 'Make room for your taste'),
        el('p', '', 'A different mood is one click away. Changes apply across the desktop.'));
      root.append(el('h2', '', 'Themes'));
      const themes = el('div', 'theme-grid settings-grid');
      Object.entries(window.THEMES).forEach(([name, theme]) => {
        const card = button('', () => {
          O.setTheme(name);
          themes.querySelectorAll('button').forEach(item => item.setAttribute('aria-pressed', String(item === card)));
          api.notify(theme.label + ' applied');
        }, 'theme-card');
        card.append(palette(theme), el('span', 'theme-name', theme.label));
        themes.append(card);
      });
      root.append(themes, el('h2', '', 'Wallpapers'));
      const wallpapers = el('div', 'wallpaper-grid settings-grid');
      window.WALLPAPERS.forEach(wallpaper => {
        const card = button('', () => {
          O.setWallpaper(wallpaper.name);
          wallpapers.querySelectorAll('button').forEach(item => item.setAttribute('aria-pressed', String(item === card)));
        }, 'wallpaper-card');
        const preview = el('div', 'wallpaper-preview', '\u00a0');
        preview.style.background = wallpaper.css;
        preview.setAttribute('aria-hidden', 'true');
        card.append(preview, el('span', '', wallpaper.name));
        wallpapers.append(card);
      });
      root.append(wallpapers, el('h2', '', 'Motion'));
      // Shared stylesheet hook: body.no-animations disables animations/transitions.
      const motion = button('', () => {
        document.body.classList.toggle('no-animations');
        updateMotion();
      }, 'settings-toggle');
      motion.setAttribute('role', 'switch');
      function updateMotion() {
        const enabled = !document.body.classList.contains('no-animations');
        motion.setAttribute('aria-checked', String(enabled));
        motion.textContent = 'Animations: ' + (enabled ? 'on' : 'off');
      }
      updateMotion();
      root.append(motion, el('h2', '', 'About'),
        el('p', '', 'omarchy-web — unofficial fan-made concept demo. Not affiliated with DHH or the Omarchy project.'),
        el('p', 'settings-version', VERSION));
    }
  };

  O.Apps.browser = {
    title: 'Browser', icon: '🌐',
    render(body, api) {
      const root = mount(body, 'browser');
      const toolbar = el('form', 'browser-toolbar app-toolbar');
      const history = [];
      let current = null;
      const back = button('← Back', () => {
        if (history.length) navigate(history.pop(), false);
      });
      const home = button('⌂ Home', () => navigate('home'));
      const address = el('input', 'browser-address');
      address.type = 'text';
      address.setAttribute('aria-label', 'Demo address');
      address.autocomplete = 'off';
      address.spellcheck = false;
      address.style.touchAction = 'manipulation';
      const go = button('Go', () => navigate(address.value));
      toolbar.append(back, home, address, go);
      toolbar.addEventListener('submit', event => { event.preventDefault(); navigate(address.value); });
      const page = el('article', 'browser-page');
      root.append(toolbar, page);
      function route(input) {
        const value = String(input).trim();
        if (['home', 'themes', 'download'].includes(value)) return value;
        try {
          const url = new URL(value.startsWith('/') ? 'https://omarchy.local' + value :
            (/^[a-z][a-z\d+.-]*:/i.test(value) ? value : 'https://' + value));
          if (!['http:', 'https:'].includes(url.protocol) || !['omarchy.local', 'omarchy.org', 'www.omarchy.org'].includes(url.hostname)) return 'missing';
          const pathname = url.pathname.replace(/^\/+|\/+$/g, '');
          return pathname === '' ? 'home' : ['home', 'themes', 'download'].includes(pathname) ? pathname : 'missing';
        } catch (_) { return 'missing'; }
      }
      function link(text, destination) {
        const anchor = el('a', 'browser-link', text);
        anchor.href = 'https://omarchy.local/' + (destination === 'home' ? '' : destination);
        anchor.style.touchAction = 'manipulation';
        anchor.addEventListener('click', event => { event.preventDefault(); navigate(destination); });
        return anchor;
      }
      function navigate(input, push = true) {
        const next = route(input);
        if (push && current !== null && current !== next) history.push(current);
        current = next;
        address.value = next === 'missing' ? String(input) : 'https://omarchy.local/' + (next === 'home' ? '' : next);
        back.disabled = !history.length;
        api.setTitle('Browser — ' + ({ home: 'A desktop of your own', themes: 'Themes', download: 'Download', missing: 'Page unavailable' }[next]));
        page.replaceChildren();
        const nav = el('nav', 'browser-nav');
        nav.setAttribute('aria-label', 'Demo website');
        nav.append(link('omarchy-web', 'home'), document.createTextNode(' · '), link('Themes', 'themes'), document.createTextNode(' · '), link('Download', 'download'));
        page.append(nav, el('p', 'browser-notice', 'Unofficial concept · simulated website · no external browsing'));
        if (next === 'home') {
          page.append(el('p', 'browser-eyebrow', 'A little order. A lot of possibility.'),
            el('h1', 'browser-headline', 'A desktop that leaves room for you.'),
            el('p', 'browser-description', 'Arrange a few windows. Find your favorite colors. Follow a thought from a blank terminal to something worth keeping. This browser-sized playground imagines a day on an Omarchy-inspired desktop.'),
            link('Find your colors →', 'themes'), el('h2', '', 'Small defaults, open possibilities'),
            el('p', '', 'Files you can explore, windows that fall into place, and a new atmosphere whenever you feel like it.'),
            link('Get the imaginary edition →', 'download'));
        } else if (next === 'themes') {
          page.append(el('h1', '', 'Six ways to set the mood'), el('p', '', 'Preview the collection here. Open Settings to dress the whole desktop in your favorite palette.'));
          const grid = el('div', 'browser-theme-grid theme-grid');
          Object.values(window.THEMES).forEach(theme => {
            const card = el('section', 'browser-theme-card');
            card.append(palette(theme), el('h2', '', theme.label));
            grid.append(card);
          });
          page.append(grid, button('Open Settings', () => O.WM.open('settings')));
        } else if (next === 'download') {
          page.append(el('h1', '', 'Your download is already here.'),
            el('p', '', 'The imaginary ISO weighs exactly zero bytes. We compressed it by leaving out the operating system.'),
            el('p', '', 'This is a web demo, so there is nothing to install. Your real disks can enjoy the afternoon off.'),
            button('Download 0 bytes of possibility', () => api.notify('Download complete: one fresh idea. No files were saved.')));
        } else {
          page.append(el('h1', '', 'That address is beyond this little world.'),
            el('p', '', 'Try omarchy.local, omarchy.local/themes, or omarchy.local/download.'), link('Return home', 'home'));
        }
        page.scrollTop = 0;
      }
      navigate('home');
    }
  };
})();

</script>
</body>
</html>
