<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F1">
<title>Provenance, Condition Documentation</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --paper:#FAF7F1; --paper2:#F2EDE1; --card:#FFFFFF; --ink:#1C1917; --ink2:#6B6459;
  --line:#E3DCCB; --line2:#D3C9B4;
  --accent:#8C2F1B; --accent-soft:#F5E4DC;
  --amber:#9A6B12; --olive:#5F6C3F; --red:#B3261E;
  --serif:Georgia,'Palatino Linotype','Book Antiqua','Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --rad:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
a,summary,[role="button"],.pinlist li{touch-action:manipulation}
button{touch-action:manipulation;font-family:var(--sans);font-size:16px}
input,select,textarea{font-size:16px;font-family:var(--sans);color:var(--ink)}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:500;letter-spacing:.01em}

/* ---------- chrome ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
.topbar .brand{font-family:var(--serif);font-size:22px;letter-spacing:.14em}
.topbar .sub{font-size:11px;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.topbar .spacer{flex:1}
.iconbtn{background:none;border:1px solid var(--line2);border-radius:999px;width:44px;height:44px;
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer}
.iconbtn:active{background:var(--paper2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper);padding:12px 20px;font-weight:600;cursor:pointer;min-height:56px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.small{min-height:44px;padding:8px 14px;font-size:14px}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.45}
main{max-width:760px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.hairline{border:0;border-top:1px solid var(--line);margin:20px 0}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px}

/* ---------- artwork cards ---------- */
.artcard{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);
  padding:12px;margin-bottom:12px;cursor:pointer;text-align:left;width:100%;color:inherit}
.artcard:active{background:var(--paper2)}
.artcard .thumb{width:76px;height:76px;border-radius:6px;object-fit:cover;background:var(--paper2);flex:none;border:1px solid var(--line)}
.artcard .thumb.mono{display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:28px;color:var(--ink2)}
.artcard .t{font-family:var(--serif);font-size:19px;margin:0 0 2px}
.artcard .a{font-size:14px;color:var(--ink2);margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;color:var(--ink2);background:var(--paper)}
.chip.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.warn{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

/* ---------- detail ---------- */
.backrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.detailhead h1{font-size:30px;margin:4px 0 2px;line-height:1.15}
.detailhead .artist{font-size:16px;color:var(--ink2);margin:0 0 10px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;margin:14px 0}
.specs div{background:var(--card);padding:10px 12px}
.specs .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.specs .v{font-size:15px;margin-top:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line2);
  display:flex;max-width:760px;margin:0 auto;padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;background:none;border:0;padding:8px 2px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;touch-action:manipulation}
.tab.on{color:var(--accent)}
.tab svg{width:22px;height:22px}

/* ---------- photos ---------- */
.photogrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photocard{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden}
.photocard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--paper2)}
.photocard .pbody{padding:10px 12px}
.photocard .cap{font-size:14px;margin:0 0 2px}
.photocard .when{font-size:12px;color:var(--ink2);margin:0 0 8px}
.prow{display:flex;gap:8px}
.prow .btn{flex:1}
.addphoto{border:1.5px dashed var(--line2);border-radius:var(--rad);background:transparent;min-height:120px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink2);cursor:pointer;width:100%}
.addphoto:active{background:var(--paper2)}

/* ---------- annotate ---------- */
.annwrap{position:relative;background:#111;border-radius:var(--rad);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.annwrap img{display:block;width:100%;height:auto;pointer-events:none}
.pin{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:grab;border:2px solid #fff;
  box-shadow:0 1px 6px rgba(0,0,0,.45);touch-action:none;z-index:5}
.pin.sev-moderate{background:var(--amber)}
.pin.sev-severe{background:var(--red)}
.pin.sel{outline:3px solid var(--accent);outline-offset:2px}
.crosshair{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid #fff;border-radius:50%;
  box-shadow:0 0 0 1px rgba(0,0,0,.4);pointer-events:none;display:none;z-index:4}
.annhint{font-size:13px;color:var(--ink2);margin:10px 0;display:flex;align-items:center;gap:8px}
.pinlist{margin:14px 0 0;padding:0;list-style:none}
.pinlist li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:var(--rad);padding:10px 12px;margin-bottom:8px;cursor:pointer}
.pinlist li:active{background:var(--paper2)}
.pinnum{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.pinnum.sev-moderate{background:var(--amber)}.pinnum.sev-severe{background:var(--red)}
.pinlist .pt{font-size:14px;font-weight:600}
.pinlist .pn{font-size:13px;color:var(--ink2)}

/* ---------- bottom sheet ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--line2);
  border-radius:18px 18px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;
  transform:translateY(105%);transition:transform .28s ease;max-height:86vh;overflow:auto}
.sheet.open{transform:translateY(0)}
.scrim{position:fixed;inset:0;background:rgba(28,25,23,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet h3{font-size:22px;margin:4px 0 12px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:12px;background:#fff}
.field textarea{min-height:80px;resize:vertical}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:12px 4px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper)}
.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.typegrid button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:12px 6px;font-size:14px;cursor:pointer}
.typegrid button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.sheet .actions{display:flex;gap:10px;margin-top:16px}
.sheet .actions .btn{flex:1}

/* ---------- custody / climate ---------- */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 18px 26px}
.tl li:before{content:"";position:absolute;left:7px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--ink)}
.tl li:after{content:"";position:absolute;left:11px;top:20px;bottom:-2px;width:1px;background:var(--line2)}
.tl li:last-child:after{display:none}
.tl .what{font-weight:700;font-size:15px}
.tl .det{font-size:13px;color:var(--ink2)}
.climrow{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:12px;margin-bottom:8px;align-items:center}
.climrow .big{font-family:var(--serif);font-size:22px}
.climrow .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}

/* ---------- dossier ---------- */
.dossier{background:#fff;border:1px solid var(--line2);border-radius:6px;padding:28px 24px;margin-top:8px}
.dossier h1{font-size:26px;margin:0 0 2px}
.dossier .rid{font-size:12px;letter-spacing:.1em;color:var(--ink2);text-transform:uppercase}
.dossier table{width:100%;border-collapse:collapse;font-size:14px;margin:14px 0}
.dossier td,.dossier th{border-bottom:1px solid var(--line);padding:8px 4px;text-align:left;vertical-align:top}
.dossier th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.dossier .photofig{margin:16px 0;break-inside:avoid}
.dossier .photofig .pwrap{position:relative}
.dossier .photofig img{width:100%;border:1px solid var(--line);border-radius:4px;display:block}
.photomiss{border:1px dashed var(--line);border-radius:4px;padding:28px 12px;text-align:center;font-size:13px;color:var(--ink2);background:rgba(0,0,0,.03)}
.dossier .photofig .pin{width:28px;height:28px;margin:-14px 0 0 -14px;font-size:12px;pointer-events:none}
.dossier .legend{font-size:13px;margin:8px 0 0;padding:0;list-style:none}
.dossier .legend li{margin-bottom:4px}
.dossier .sig{margin-top:28px;display:flex;gap:24px}
.dossier .sig div{flex:1;border-top:1px solid var(--ink);padding-top:6px;font-size:12px;color:var(--ink2)}
.signature-pad{display:block;width:100%;height:auto;aspect-ratio:3/1;background:#fff;border:1px solid var(--line2);border-radius:8px;touch-action:none}
.signature-image{display:block;max-width:260px;width:100%;height:auto}
.dossier .signature-block{margin-top:24px;break-inside:avoid}
.dossier .signature-block .sig{margin-top:0}
.dossier .disclaimer{font-size:11px;color:var(--ink2);margin-top:24px}
.hash{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all;color:var(--ink2);background:var(--paper2);padding:8px;border-radius:6px}

/* ---------- compare ---------- */
.cmpsel{display:flex;gap:8px;margin-bottom:12px}
.cmpsel select{flex:1;min-width:0;border:1px solid var(--line2);border-radius:8px;padding:12px;background:#fff}
.cmpwrap{position:relative;border-radius:var(--rad);overflow:hidden;background:#111}
.cmpwrap img{display:block;width:100%;height:auto}
.cmpwrap .top{position:absolute;inset:0;overflow:hidden}
.cmpwrap .top img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.cmplabel{position:absolute;top:10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:rgba(0,0,0,.65);color:#fff;padding:4px 10px;border-radius:999px;z-index:3}
.cmpwrap input[type=range]{position:absolute;inset:0;width:100%;opacity:0;z-index:4;touch-action:none;height:100%;margin:0}
.cmphandle{position:absolute;top:0;bottom:0;width:2px;background:#fff;z-index:2;pointer-events:none;box-shadow:0 0 8px rgba(0,0,0,.5)}

/* ---------- empty / misc ---------- */
.empty{text-align:center;padding:48px 20px;color:var(--ink2)}
.empty .big{font-family:var(--serif);font-size:26px;color:var(--ink);margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(28px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;font-size:14px;z-index:80;
  opacity:0;pointer-events:none;transition:all .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fabrow{display:flex;gap:10px;margin:16px 0}
.fabrow .btn{flex:1}
svg.ic{width:20px;height:20px;flex:none}
.hidden{display:none!important}
.verdict{background:var(--ink);color:var(--paper);border-radius:14px;padding:22px 20px;margin:0 0 18px;text-align:center}
.verdict .vbig{font-size:24px;margin-bottom:6px}
.verdict .vsub{font-size:13px;color:#CFC8B8;line-height:1.5}
.verdict .vrid{font-size:11px;letter-spacing:.1em;color:#9A917F;margin-top:10px;text-transform:uppercase}
.coach{position:fixed;inset:auto 12px 12px 12px;z-index:90;background:var(--ink);color:var(--paper);
  border-radius:16px;padding:20px;box-shadow:0 16px 50px rgba(0,0,0,.35);max-width:480px;margin:0 auto}
.coach h3{font-family:var(--serif);font-weight:500;font-size:19px;margin:0 0 10px}
.coach ol{margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.7;color:#EDE6D4}
.coach ol b{color:#fff}
.coach .btn{background:var(--paper);color:var(--ink);border-color:var(--paper);width:100%}

@media print{
  body{background:#fff}
  .topbar,.tabs,.backrow,.noprint,.toast,.sheet,.scrim,.fabrow{display:none!important}
  main{max-width:none;padding:0}
  .dossier{border:0;margin:0;padding:0}
}
/* Billing theme: match Provenance's paper-and-ink palette. */
:root{
  --bill-accent:var(--accent,#8C2F1B); --bill-bg:var(--card,#FFFFFF); --bill-text:var(--ink,#1C1917);
  --bill-muted:var(--ink2,#6B6459); --bill-line:var(--line,#E3DCCB);
}
/* ---- device sync (prototype) ---- */
.micro{font-size:12px;color:var(--ink2,#8A8071)}
#syncBox{margin-top:12px}
#syncBox h4{margin:0 0 8px}
#syncBox .set-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
#syncBox .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#EFE9DC;color:#8A8071}
#syncBox .pill.ok{background:#DFF0E2;color:#2C6E3F}
#syncBox .pill.warn{background:#FFF3D6;color:#8A6D1A}
#syncBox .pill.crit{background:#FBDEDE;color:#A33B3B}
#syncBox .link-btn{background:none;border:0;color:#2A6DF4;font-size:14px;font-weight:600;cursor:pointer;padding:4px 0;touch-action:manipulation}
#syncBox input{width:100%;box-sizing:border-box;font-size:16px;padding:8px;border:1px solid var(--line2,#D8D2C4);border-radius:8px;margin-top:4px;background:#fff}
/* ---- storage meter / zoom / banners / snapshot ---- */
.meter{margin:12px 0}
.meter .mrow{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:4px}
.meter .bar{height:8px;border-radius:99px;background:var(--paper2);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:var(--olive);border-radius:99px;transition:width .3s}
.meter.warn .bar i{background:var(--amber)}
.meter.crit .bar i{background:var(--red)}
.meter .mnote{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.5}
.annzoom{position:relative;transform-origin:0 0;will-change:transform}
.annzoom img{display:block;width:100%;height:auto;pointer-events:none}
.zoombadge{position:absolute;top:10px;right:10px;z-index:6;background:rgba(0,0,0,.65);color:#fff;border:0;
  border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;touch-action:manipulation;cursor:pointer}
.netbanner{background:var(--ink);color:var(--paper);text-align:center;font-size:13px;padding:8px 12px}
.installbanner{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:65;
  background:var(--ink);color:var(--paper);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;
  box-shadow:0 12px 40px rgba(0,0,0,.3);max-width:480px;margin:0 auto}
.installbanner .t{flex:1;font-size:14px}
.installbanner .t b{display:block;font-size:15px;margin-bottom:2px}
.snapcard{background:var(--card);border:1px solid var(--line2);border-radius:var(--rad);padding:18px;margin-top:14px}
.snapcard h3{font-size:20px;margin:0 0 4px}
.snapcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.snapcol{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper)}
.snapcol .cap{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.snapcol .n{font-family:var(--serif);font-size:26px;margin:2px 0}
.snapcol .sevline{font-size:12px;color:var(--ink2)}
.newpin{font-size:14px;padding:7px 0;border-top:1px solid var(--line)}
.field small{font-size:12px;color:var(--ink2);display:block;margin-top:4px}
#edMic.on{background:var(--accent);border-color:var(--accent);color:#fff}
.link-btn{background:none;border:0;color:#2A6DF4;font-size:14px;font-weight:600;cursor:pointer;padding:10px;touch-action:manipulation}
</style>
</head>
<body>
<div class="netbanner hidden" id="netBanner">Offline. Records stay on this device until you reconnect.</div>
<div class="topbar">
  <div><div class="brand">PROVENANCE</div><div class="sub">Condition Documentation</div></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="btnExport" title="Export backup" aria-label="Export backup"></button>
  <button class="iconbtn" id="btnImport" title="Import backup" aria-label="Import backup"></button>
  <button class="iconbtn" id="btnSync" title="Device sync" aria-label="Device sync"></button>
  <input type="file" id="importFile" accept="application/json" class="hidden">
</div>
<main id="app"></main>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ================= icons ================= */
const IC = {
  plus:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  camera:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>',
  back:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  doc:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg>',
  x:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  trash:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',

const EXAMKEY='provenance.examiner.v1';
function getExaminer(){ try{ return localStorage.getItem(EXAMKEY)||''; }catch(e){ return ''; } }
function setExaminer(n){ try{ if(n) localStorage.setItem(EXAMKEY,n); }catch(e){} }
const LSKEYS_ALL=[LSKEY,'provenance.device_key','provenance.syncmeta.v1','provenance.lastsync.v1','provenance.syncbase.v1','provenance.oversized.v1','provenance.skew.v1','provenance.coach',EXAMKEY];
let storageInfo={usage:0,quota:0,ratio:0,tight:false,estimated:true};
function measureLocalBytes(){
  let bytes=0;
  for(const k of LSKEYS_ALL){ try{ const v=localStorage.getItem(k); if(v) bytes+=v.length*2; }catch(_){} }
  return bytes;
}
async function refreshStorageInfo(){
  try{
    if(navigator.storage&&navigator.storage.estimate){
      const e=await navigator.storage.estimate();
      storageInfo.usage=e.usage||0; storageInfo.quota=e.quota||0; storageInfo.estimated=false;
    }else{
      storageInfo.usage=measureLocalBytes(); storageInfo.quota=5*1024*1024; storageInfo.estimated=true;
    }
  }catch(e){ storageInfo.usage=measureLocalBytes(); storageInfo.quota=5*1024*1024; storageInfo.estimated=true; }
  storageInfo.ratio=storageInfo.quota>0?storageInfo.usage/storageInfo.quota:0;
  storageInfo.tight=storageInfo.ratio>=0.7;
  paintStorageMeter();
  return storageInfo;
}
function fmtBytes(b){ if(b<1024) return Math.round(b)+' B'; if(b<1048576) return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function storageMeter(){
  return `<div class="meter" id="storageMeter"><div class="mrow"><span>On-device storage</span><span id="storageNums">measuring…</span></div>
    <div class="bar"><i id="storageBar"></i></div>
    <div class="mnote" id="storageNote"></div></div>`;
}
function paintStorageMeter(){
  const m=document.getElementById('storageMeter'); if(!m) return;
  const pct=Math.min(100,Math.round(storageInfo.ratio*100));
  m.classList.toggle('warn',storageInfo.ratio>=0.7&&storageInfo.ratio<0.9);
  m.classList.toggle('crit',storageInfo.ratio>=0.9);
  document.getElementById('storageBar').style.width=pct+'%';
  document.getElementById('storageNums').textContent=fmtBytes(storageInfo.usage)+' of ~'+fmtBytes(storageInfo.quota)+(storageInfo.estimated?' (estimated from saved records)':'');
  document.getElementById('storageNote').textContent=storageInfo.tight
    ? 'Storage is nearly full. New photos compress more aggressively, and older photos should be exported, then deleted.'
    : 'Photos are stored on this device only. Export a backup before deleting anything.';
}

/* Best-effort capture location: photos are transaction data (id + timestamp +
 * GPS + hash). Never blocks, never errors at the user: denied or unavailable
 * location simply means no coordinates on the record. */
function getGeoOnce(){
  return new Promise(resolve=>{
    if(!navigator.geolocation) return resolve(null);
    let done=false;
    const to=setTimeout(()=>{ if(!done){ done=true; resolve(null); } },4000);
    navigator.geolocation.getCurrentPosition(
      pos=>{ if(!done){ done=true; clearTimeout(to);
        resolve({lat:+pos.coords.latitude.toFixed(5), lon:+pos.coords.longitude.toFixed(5)}); } },
      ()=>{ if(!done){ done=true; clearTimeout(to); resolve(null); } },
      {timeout:4000, maximumAge:60000});
  });
}
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const tight=storageInfo.tight, MAX=tight?1000:1600, Q=tight?0.65:0.82;
      let w=img.width,h=img.height;
      const scale=Math.min(1, MAX/Math.max(w,h)); w=Math.round(w*scale); h=Math.round(h*scale);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg',Q));
    };
    img.onerror=reject;
    img.src=URL.createObjectURL(file);
  });
}

/* ================= sample artwork ================= */
function sampleImage(){
  const c=document.createElement('canvas'); c.width=1200; c.height=900; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,900); g.addColorStop(0,'#E8E0D0'); g.addColorStop(1,'#D8CDB6');
  x.fillStyle=g; x.fillRect(0,0,1200,900);
  x.fillStyle='#2A2320'; x.fillRect(180,120,840,660);            // frame
  x.fillStyle='#F4EFE4'; x.fillRect(220,160,760,580);            // mat
  x.fillStyle='#31456B'; x.fillRect(260,200,680,500);            // painting ground
  x.fillStyle='#C8A24A'; x.beginPath(); x.arc(600,380,110,0,7); x.fill();
  x.fillStyle='#8C2F1B'; x.fillRect(260,520,680,180);
  x.fillStyle='#31456B'; x.beginPath(); x.moveTo(260,520);
  for(let i=0;i<=680;i+=40) x.lineTo(260+i,520-60*Math.abs(Math.sin(i/90)));
  x.lineTo(940,520); x.closePath(); x.fill();
  x.fillStyle='rgba(0,0,0,.18)'; x.fillRect(180,780,840,26);
  return c.toDataURL('image/jpeg',0.85);
}

function artFlags(a){
  const f=[];
  if(!a.photos.length) f.push('No photos on file');
  else{ const miss=a.photos.filter(p=>!p.dataUrl).length;
        if(miss) f.push(miss+' photo'+(miss===1?'':'s')+' captured on another device'); }
  if(!a.custody.length) f.push('No custody events logged');
  if(!a.condition||a.condition==='Not assessed') f.push('Condition not assessed');
  if(!a.climate.length) f.push('No climate readings');
  else{ const last=[...a.climate].sort((x,y)=>new Date(x.at)-new Date(y.at)).pop();
        if(Date.now()-new Date(last.at).getTime()>90*864e5) f.push('Climate reading older than 90 days'); }
  return f;
}

function wirePhotos(art){
  const fi=document.getElementById('photoFile'); if(!fi) return;
  document.getElementById('btnAddPhoto').onclick=()=>fi.click();
  const bc=document.getElementById('btnCompare'); if(bc) bc.onclick=()=>nav('/art/'+art.id+'/compare');
  fi.onchange=async()=>{
    const files=[...fi.files]; if(!files.length) return;
    await refreshStorageInfo();
    toast('Processing '+files.length+' photo'+(files.length===1?'':'s')+'…');
    const geoP=getGeoOnce();
    let added=0;
    for(const f of files){
      try{ const [dataUrl,geo]=await Promise.all([compressImage(f),geoP]);
        art.photos.push({id:uid(),dataUrl,caption:'',takenAt:nowISO(),pins:[],geo:geo||null}); added++; }
      catch(e){ /* skip bad file */ }
    }
    fi.value='';
    if(!added){ toast('Could not read those images'); return; }
    save(); render(); toast(added+' photo'+(added===1?'':'s')+' added, tap Annotate to mark condition');
  };
  app.querySelectorAll('[data-act]').forEach(el=>{
    const pid=el.dataset.pid, act=el.dataset.act;
    el.onclick=(e)=>{ e.stopPropagation();
      if(act==='annotate'){
        const ap=getPhoto(art,pid);
        if(ap&&!ap.dataUrl){ toast('Photo bytes are on the capturing device; annotation needs the original.'); return; }
        nav('/art/'+art.id+'/photo/'+pid);
      }
      else if(act==='check'){
        const p=getPhoto(art,pid);
        quickCheck(art,p);
      }
      else if(act==='cap'){
        const p=getPhoto(art,pid);
        openSheet(`<h3>Photo details</h3><div class="field"><label>Caption</label>
          <input id="c_cap" value="${esc(p.caption||'')}" placeholder="Front, receiving inspection"></div>
          <div class="field"><label>Shipment stage</label><select id="c_stage">
            ${['','Receiving','In transit','Delivery','Storage','Exhibition'].map(s=>`<option value="${s}" ${p.stage===s?'selected':''}>${s||'Not recorded'}</option>`).join('')}
          </select></div>
          ${p.geo?`<p class="micro">Captured at ${p.geo.lat}, ${p.geo.lon}.</p>`:''}
          <div class="actions"><button class="btn ghost" id="c_no">Cancel</button><button class="btn" id="c_yes">Save</button></div>`);
        document.getElementById('c_no').onclick=closeSheet;
        document.getElementById('c_yes').onclick=()=>{ p.caption=document.getElementById('c_cap').value.trim();

      }
      else if(act==='delphoto'){
        art.photos=art.photos.filter(p=>p.id!==pid); save(); render(); toast('Photo deleted');
      }
    };
  });
  showCoach(art);
  wireConditionHistory(art);
}

function drawPins(art,p){
  const wrap=document.getElementById('annwrap'); if(!wrap) return;
  const layer=document.getElementById('annzoom')||wrap;
  layer.querySelectorAll('.pin').forEach(e=>e.remove());
  p.pins.forEach((pin,i)=>{
    const d=document.createElement('div');
    d.className='pin sev-'+pin.severity+(draftPin&&draftPin.id===pin.id?' sel':'');
    d.style.left=pin.x+'%'; d.style.top=pin.y+'%'; d.textContent=i+1; d.dataset.pid=pin.id;
    layer.appendChild(d);
    d.addEventListener('pointerdown',e=>startPinDrag(e,art,p,pin,d));
  });
  const ul=document.getElementById('pinlist'); if(!ul) return;
  ul.innerHTML=p.pins.map((pin,i)=>`<li data-pid="${pin.id}" tabindex="0" role="button" aria-label="Edit finding ${i+1}: ${esc(pin.type)}, ${SEV_LABEL[pin.severity]||''}">
    <span class="pinnum sev-${pin.severity}">${i+1}</span>
    <span style="flex:1"><span class="pt">${esc(pin.type)}</span> · <span class="chip" style="margin-left:4px">${SEV_LABEL[pin.severity]}</span>
    <div class="pn">${esc(pin.note||'No note')}</div></span>${IC.edit}</li>`).join('')
    || '<li style="cursor:default;color:var(--ink2)">No pins yet, tap the photo above.</li>';
  ul.querySelectorAll('li[data-pid]').forEach(li=>{

      const pin=p.pins.find(x=>x.id===li.dataset.pid); if(pin) pinEditor(art,p,pin);

    li.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); }
    });
  });
}
function wireAnnotate(art,p){
  const wrap=document.getElementById('annwrap'), xhair=document.getElementById('xhair'),
        badge=document.getElementById('zoomBadge');
  drawPins(art,p);
  const z={s:1,tx:0,ty:0};
  function apply(){
    document.getElementById('annzoom').style.transform=`translate(${z.tx}px,${z.ty}px) scale(${z.s})`;
    wrap._zoomS=z.s;
    badge.hidden=z.s<=1.01;
    badge.textContent=z.s.toFixed(1)+'x';
  }
  function clampZ(){
    const r=wrap.getBoundingClientRect();
    z.tx=Math.min(0,Math.max(r.width-r.width*z.s,z.tx));
    z.ty=Math.min(0,Math.max(r.height-r.height*z.s,z.ty));
  }
  function toPhoto(clientX,clientY){
    const r=wrap.getBoundingClientRect();
    const cx=(clientX-r.left-z.tx)/z.s, cy=(clientY-r.top-z.ty)/z.s;
    return {x:Math.min(99,Math.max(1,cx/r.width*100)), y:Math.min(99,Math.max(1,cy/r.height*100))};
  }
  function zoomAt(clientX,clientY,ns){
    const r=wrap.getBoundingClientRect();
    ns=Math.min(4,Math.max(1,ns));
    const cx=(clientX-r.left-z.tx)/z.s, cy=(clientY-r.top-z.ty)/z.s;
    z.s=ns; z.tx=clientX-r.left-cx*ns; z.ty=clientY-r.top-cy*ns;
    clampZ(); apply();
  }
  badge.onclick=()=>{ z.s=1; z.tx=0; z.ty=0; apply(); };
  const pts=new Map();
  let pinch=null, pan=null, downTap=null, pendingTap=null, tapTimer=null;
  function clearPending(){ if(tapTimer){ clearTimeout(tapTimer); tapTimer=null; } pendingTap=null; }
  function dropPinAt(clientX,clientY){
    const pt=toPhoto(clientX,clientY);
    const pin={id:uid(),x:+pt.x.toFixed(1),y:+pt.y.toFixed(1),type:'Scratch',severity:'minor',note:''};
    p.pins.push(pin); draftPin=pin; save(); drawPins(art,p);
    pinEditor(art,p,pin,true);
  }
  wrap.addEventListener('pointerdown',e=>{
    if(e.target.classList.contains('pin')||e.target.closest('.zoombadge')) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){
      clearPending(); pan=null; downTap=null;
      const vs=[...pts.values()];
      pinch={d0:Math.hypot(vs[0].x-vs[1].x,vs[0].y-vs[1].y),s0:z.s,tx0:z.tx,ty0:z.ty,
             mx0:(vs[0].x+vs[1].x)/2,my0:(vs[0].y+vs[1].y)/2};
    }else if(pts.size===1){
      pan={sx:e.clientX,sy:e.clientY,tx0:z.tx,ty0:z.ty,moved:false};
      downTap={x:e.clientX,y:e.clientY,t:Date.now()};
    }
  });
  wrap.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size>=2){
      const vs=[...pts.values()];
      const d=Math.hypot(vs[0].x-vs[1].x,vs[0].y-vs[1].y), mx=(vs[0].x+vs[1].x)/2, my=(vs[0].y+vs[1].y)/2;
      if(pinch.d0>10){
        const r=wrap.getBoundingClientRect();
        const ns=Math.min(4,Math.max(1,pinch.s0*d/pinch.d0));
        const cx=(pinch.mx0-r.left-pinch.tx0)/pinch.s0, cy=(pinch.my0-r.top-pinch.ty0)/pinch.s0;
        z.s=ns; z.tx=mx-r.left-cx*ns; z.ty=my-r.top-cy*ns;
        clampZ(); apply();
      }
      return;
    }
    if(pan&&downTap){
      if(Math.hypot(e.clientX-downTap.x,e.clientY-downTap.y)>8) pan.moved=true;
      if(z.s>1.01){ z.tx=pan.tx0+(e.clientX-pan.sx); z.ty=pan.ty0+(e.clientY-pan.sy); clampZ(); apply(); }
    }
  });
  function endPointer(e){
    pts.delete(e.pointerId);
    if(pts.size<2) pinch=null;
    if(pts.size===0){
      const wasTap=pan&&downTap&&!pan.moved&&!(e.target&&e.target.closest&&e.target.closest('.zoombadge'));
      const tx=downTap?downTap.x:e.clientX, ty=downTap?downTap.y:e.clientY;
      pan=null; downTap=null;
      if(!wasTap) return;
      const now=Date.now();
      if(pendingTap&&(now-pendingTap.t)<350&&Math.hypot(tx-pendingTap.x,ty-pendingTap.y)<24){
        clearPending();
        zoomAt(tx,ty,z.s>1.5?1:2.5);
      }else{
        pendingTap={x:tx,y:ty,t:now};
        clearTimeout(tapTimer);
        tapTimer=setTimeout(()=>{ tapTimer=null; pendingTap=null; dropPinAt(tx,ty); },320);
      }
    }
  }
  wrap.addEventListener('pointerup',endPointer);
  wrap.addEventListener('pointercancel',endPointer);
  wrap.addEventListener('pointerleave',()=>{ xhair.style.display='none'; });
}
function startPinDrag(e,art,p,pin,el){
  e.preventDefault(); e.stopPropagation();
  const wrap=document.getElementById('annwrap'), r=wrap.getBoundingClientRect(), zs=wrap._zoomS||1;
  const sx=e.clientX, sy=e.clientY, ox=pin.x, oy=pin.y; let dragged=false;
  el.setPointerCapture(e.pointerId);
  const move=ev=>{
    const dx=(ev.clientX-sx)/r.width*100/zs, dy=(ev.clientY-sy)/r.height*100/zs;
    if(Math.abs(dx)+Math.abs(dy)>0.6) dragged=true;
    pin.x=+Math.min(99,Math.max(1,ox+dx)).toFixed(1);
    pin.y=+Math.min(99,Math.max(1,oy+dy)).toFixed(1);
    el.style.left=pin.x+'%'; el.style.top=pin.y+'%';
  };
  const up=()=>{ el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up);
    if(dragged){ save(); } else { pinEditor(art,p,pin); } };
  el.addEventListener('pointermove',move); el.addEventListener('pointerup',up);
}
let edType='Scratch', edSev='minor';
const pinDraftKey=id=>'provenance.pindraft.'+id;
function clearPinDraft(id){ try{ localStorage.removeItem(pinDraftKey(id)); }catch(e){} }
function pinEditor(art,p,pin,isNew){
  edType=pin.type; edSev=pin.severity;
  /* restart-safe draft: a killed tab loses nothing already typed */
  try{
    const d=JSON.parse(localStorage.getItem(pinDraftKey(pin.id))||'null');
    if(d){ if(d.type) edType=d.type; if(d.sev) edSev=d.sev; pin._draftNote=d.note||''; }
    else delete pin._draftNote;
  }catch(e){}
  openSheet(`
    <h3>Condition pin ${p.pins.indexOf(pin)+1}</h3>
    <div class="field"><label>Damage type</label><div class="typegrid" id="edTypes">
      ${DAMAGE_TYPES.map(t=>`<button data-t="${t}" class="${t===edType?'on':''}">${t}</button>`).join('')}
    </div></div>
    <div class="field"><label>Severity</label><div class="seg" id="edSev">
      ${SEV.map(s=>`<button data-s="${s}" class="${s===edSev?'on':''}">${SEV_LABEL[s]}</button>`).join('')}
    </div></div>
    <div class="field"><label style="display:flex;align-items:center;justify-content:space-between">Note
      <button class="iconbtn" id="edMic" title="Dictate note" aria-label="Dictate note" style="width:34px;height:34px">${IC.mic}</button></label>
      <textarea id="edNote" placeholder="Describe the damage precisely: size, depth, location…">${esc(pin._draftNote!=null?pin._draftNote:(pin.note||''))}</textarea></div>
    <div class="actions">
      ${isNew?'':`<button class="btn danger" id="edDel">${IC.trash}</button>`}
      <button class="btn ghost" id="edCancel">Cancel</button>
      <button class="btn" id="edSave">${IC.check} Save pin</button>
    </div>`);
  document.querySelectorAll('#edTypes button').forEach(b=>b.onclick=()=>{ edType=b.dataset.t;
    document.querySelectorAll('#edTypes button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); stash(); });
  document.querySelectorAll('#edSev button').forEach(b=>b.onclick=()=>{ edSev=b.dataset.s;
    document.querySelectorAll('#edSev button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); stash(); });
  document.getElementById('edCancel').onclick=()=>{ if(isNew){ p.pins=p.pins.filter(x=>x.id!==pin.id); save(); } clearPinDraft(pin.id); closeSheet(); drawPins(art,p); };
  const del=document.getElementById('edDel'); if(del) del.onclick=()=>{ p.pins=p.pins.filter(x=>x.id!==pin.id); save(); clearPinDraft(pin.id); closeSheet(); drawPins(art,p); toast('Pin removed'); };
  document.getElementById('edSave').onclick=()=>{
    pin.type=edType; pin.severity=edSev; pin.note=document.getElementById('edNote').value.trim();
    delete pin._draftNote;
    save(); clearPinDraft(pin.id); closeSheet(); draftPin=null; drawPins(art,p); toast('Pin saved');
  };
  /* stash every keystroke so an interrupted session loses nothing */
  const stash=()=>{ try{ localStorage.setItem(pinDraftKey(pin.id), JSON.stringify({type:edType,sev:edSev,note:document.getElementById('edNote').value})); }catch(e){} };
  document.getElementById('edNote').addEventListener('input', stash);
  /* voice-to-text for the note (competitive parity: Articheck dictation) */
  (function(){
    const mic=document.getElementById('edMic'), ta=document.getElementById('edNote');
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR||!mic){ if(mic) mic.style.display='none'; return; }
    let rec=null, listening=false;
    mic.onclick=()=>{
      if(listening){ try{ rec.stop(); }catch(e){} return; }
      rec=new SR(); rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=1;
      rec.onresult=e=>{
        const t=e.results[0][0].transcript;
        ta.value=(ta.value?ta.value.replace(/\s+$/,'')+' ':'')+t;
      };
      const stop=()=>{ listening=false; mic.classList.remove('on'); };
      rec.onerror=stop; rec.onend=stop;
      try{ rec.start(); listening=true; mic.classList.add('on'); }
      catch(e){ toast('Voice input is not available here'); }
    };
  })();
}

  if(recv) A.value=recv.id;
  if(deliv && deliv.id!==A.value) B.value=deliv.id; else B.selectedIndex=Math.min(1,art.photos.length-1);
  const upd=()=>{
    const pa=getPhoto(art,A.value), pb=getPhoto(art,B.value);
    for(const [id,ph] of [['cmpImgA',pa],['cmpImgB',pb]]){
      const el=document.getElementById(id);

      note.textContent='One of these photos was captured on another device; its image bytes are not on this device.';
      document.getElementById('cmpwrap').after(note); }

  A.onchange=upd; B.onchange=upd; upd();
  const range=document.getElementById('cmpRange'), top=document.getElementById('cmpTop'), handle=document.getElementById('cmpHandle');
  range.addEventListener('input',()=>{ top.style.clipPath=`inset(0 ${100-range.value}% 0 0)`; handle.style.left=range.value+'%'; });
  top.style.clipPath='inset(0 50% 0 0)';
  document.getElementById('btnSnap').onclick=()=>buildSnapshot(art);
}

/* ---------- before/after dispute snapshot (Item 11) ---------- */
function sevCounts(p){ const s={minor:0,moderate:0,severe:0}; (p.pins||[]).forEach(pin=>{ if(s[pin.severity]!=null) s[pin.severity]++; }); return s; }
function pinKey(pin){ return (pin.type||'').toLowerCase()+'|'+(pin.severity||'')+'|'+(pin.note||'').trim().toLowerCase(); }
function buildSnapshot(art){
  const pa=getPhoto(art,document.getElementById('cmpA').value),
        pb=getPhoto(art,document.getElementById('cmpB').value);
  const out=document.getElementById('snapOut'); if(!out) return;
  if(!pa||!pb||pa.id===pb.id){
    out.innerHTML=`<div class="snapcard"><p style="color:var(--ink2);margin:0">Select two different photos to build the snapshot.</p></div>`; return;
  }
  const sa=sevCounts(pa), sb=sevCounts(pb);
  const ta=sa.minor+sa.moderate+sa.severe, tb=sb.minor+sb.moderate+sb.severe;
  const keysA=new Set(pa.pins.map(pinKey));
  const fresh=pb.pins.filter(pin=>!keysA.has(pinKey(pin)));
  const beforeAfter=pa.stage==='Receiving'&&pb.stage==='Delivery';
  const labA=beforeAfter?'Before':'Photo A', labB=beforeAfter?'After':'Photo B';
  const cap=p=>(p.caption||'Untitled photo')+' · '+fmtDateShort(p.takenAt)+(p.stage?' · '+p.stage:'');
  const sevLine=s=>`${s.severe} severe · ${s.moderate} moderate · ${s.minor} minor`;
  out.innerHTML=`<div class="snapcard">
    <h3 class="serif">Condition snapshot</h3>
    <p style="font-size:13px;color:var(--ink2);margin:0">${esc(art.title)||'Untitled'}${art.artist?' · '+esc(art.artist):''}</p>
    <div class="snapcols">
      <div class="snapcol"><div class="cap">${labA}</div><div class="n">${ta}</div>
        <div class="sevline">${sevLine(sa)}</div><div class="sevline" style="margin-top:6px">${esc(cap(pa))}</div></div>
      <div class="snapcol"><div class="cap">${labB}</div><div class="n">${tb}</div>
        <div class="sevline">${sevLine(sb)}</div><div class="sevline" style="margin-top:6px">${esc(cap(pb))}</div></div>
    </div>
    <h4 class="serif" style="margin:6px 0 4px;font-size:17px">New since ${labA.toLowerCase()} (${fresh.length})</h4>
    <p class="micro">Matched by type, severity, and note text, not by pin position.</p>
    ${fresh.length?fresh.map(pin=>`<div class="newpin"><b>${esc(pin.type)}</b> · ${SEV_LABEL[pin.severity]||esc(pin.severity)}${pin.note?'<br><span style="color:var(--ink2)">'+esc(pin.note)+'</span>':''}</div>`).join('')
      :'<p style="font-size:14px;color:var(--ink2)">No new findings. The later photo shows the same documented condition.</p>'}
    <div class="fabrow noprint" style="margin-bottom:0"><button class="btn ghost small" id="btnCopySnap">Copy summary</button></div>
  </div>`;
  const textLines=[
    'Condition snapshot: '+(art.title||'Untitled')+(art.artist?' by '+art.artist:''),
    labA+': '+cap(pa)+', '+ta+' findings ('+sevLine(sa)+')',
    labB+': '+cap(pb)+', '+tb+' findings ('+sevLine(sb)+')',
    'New since '+labA.toLowerCase()+': '+fresh.length,
    ...fresh.map(pin=>'- '+pin.type+' ('+(SEV_LABEL[pin.severity]||pin.severity)+')'+(pin.note?': '+pin.note:''))
  ];
  document.getElementById('btnCopySnap').onclick=async()=>{
    const text=textLines.join('\n');
    try{ await navigator.clipboard.writeText(text); toast('Summary copied'); }
    catch(e){
      const ta2=document.createElement('textarea'); ta2.value=text; ta2.style.position='fixed'; ta2.style.opacity='0';
      document.body.appendChild(ta2); ta2.select();
      try{ document.execCommand('copy'); toast('Summary copied'); }catch(_){ toast('Copy failed. Select the card text manually.'); }
      ta2.remove();
    }
  };
  out.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ---------- condition history: drift over time (storage operators) ---------- */
function conditionHistory(art){
  const photos=[...art.photos].sort((a,b)=>new Date(a.takenAt)-new Date(b.takenAt));
  if(!photos.length) return '';
  let prevKeys=new Set();
  const rows=photos.map((p,i)=>{
    const s=sevCounts(p), total=s.minor+s.moderate+s.severe;
    const curKeys=new Set(p.pins.map(pinKey));
    let fresh=0;
    if(i>0) fresh=[...curKeys].filter(k=>!prevKeys.has(k)).length;
    prevKeys=curKeys;
    const checks=(p.checks||[]).map(c=>`<div style="font-size:12px;color:var(--ink2);padding:3px 0">${IC.clock.replace('class="ic"','class="ic" style="width:12px;height:12px;vertical-align:-2px"')} Quick check ${fmtDate(c.at)}: <b>${esc(verdictLabel(c.verdict))}</b>${c.note?' · '+esc(c.note):''}</div>`).join('');
    return `<div class="newpin"><b>${fmtDate(p.takenAt)}</b> · ${esc(p.caption)||'Check-in '+(i+1)}${p.stage?' · '+esc(p.stage):''}<br>
      <span style="color:var(--ink2)">${total} finding${total===1?'':'s'} (${s.severe} severe · ${s.moderate} moderate · ${s.minor} minor)${i>0?(fresh?' · <b style="color:var(--red)">'+fresh+' new since previous check-in</b>':' · no new findings'):''}</span>${checks}</div>`;
  }).join('');
  return `<div class="snapcard noprint" id="histCard">
    <h3 class="serif">Condition history</h3>
    <p class="micro" style="margin:0 0 6px">Periodic check-ins over time. New findings are matched by type, severity, and note text, not by pin position. Matching ignores letter case and extra spaces.</p>
    ${rows}
    <div class="fabrow noprint" style="margin-bottom:0"><button class="btn ghost small" id="btnCopyHist">Copy history</button></div>
  </div>`;
}
function wireConditionHistory(art){
  const b=document.getElementById('btnCopyHist'); if(!b) return;
  b.onclick=async()=>{
    const photos=[...art.photos].sort((a,b)=>new Date(a.takenAt)-new Date(b.takenAt));
    let prevKeys=new Set();
    const lines=['Condition history: '+(art.title||'Untitled')+(art.artist?' by '+art.artist:'')];
    photos.forEach((p,i)=>{
      const s=sevCounts(p), total=s.minor+s.moderate+s.severe;
      const curKeys=new Set(p.pins.map(pinKey));
      const fresh=i>0?[...curKeys].filter(k=>!prevKeys.has(k)).length:0;
      prevKeys=curKeys;
      lines.push(fmtDate(p.takenAt)+' ('+(p.caption||'check-in')+(p.stage?', '+p.stage:'')+'): '+total+' findings, '+fresh+' new since previous');
      (p.checks||[]).forEach(c=>lines.push('  Quick check '+fmtDate(c.at)+': '+verdictLabel(c.verdict)+(c.note?'. '+c.note:'')));
    });
    lines.push('New findings matched by type, severity, and note text, not by pin position.');
    try{ await navigator.clipboard.writeText(lines.join('\n')); toast('History copied'); }
    catch(e){ toast('Copy not available in this browser'); }
  };
}

  const canvas=document.getElementById('sigPad'), ctx=canvas.getContext('2d');
  let activePointer=null, hasInk=false;
  function clear(){ctx.fillStyle='#fff';ctx.fillRect(0,0,900,300);hasInk=false;}
  function point(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*900/r.width,(e.clientY-r.top)*300/r.height];}
  clear();ctx.strokeStyle='#1C1917';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';
  canvas.onpointerdown=e=>{
    if(activePointer!==null || (e.pointerType==='mouse' && e.button!==0)) return;
    e.preventDefault();activePointer=e.pointerId;canvas.setPointerCapture(e.pointerId);
    const [x,y]=point(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y);ctx.stroke();hasInk=true;
  };

  canvas.onpointerup=canvas.onpointercancel=e=>{if(e.pointerId===activePointer){activePointer=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);}};
  canvas.onlostpointercapture=()=>{activePointer=null;};
  document.getElementById('sigClear').onclick=clear;
  document.getElementById('sigCancel').onclick=closeSheet;
  document.getElementById('sigSave').onclick=()=>{
    const printedName=document.getElementById('sigName').value.trim();
    if(!printedName){toast('Enter a printed name');return;}
    if(!hasInk){toast('Draw a signature before saving');return;}

  };

// Sort object keys recursively; preserve the order of evidence arrays.
function canonical(value){
  if(Array.isArray(value)) return '['+value.map(canonical).join(',')+']';
  if(value && typeof value==='object') return '{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+canonical(value[k])).join(',')+'}';
  return JSON.stringify(value);
}
async function evidencePayload(art){
  const details={};
  for(const key of ['id','title','artist','type','year','medium','dimensions','value','owner','examiner','condition','notes']) details[key]=art[key]??null;
  const photos=await Promise.all(art.photos.map(async p=>{
    const entry={id:p.id,caption:p.caption??'',takenAt:p.takenAt??null,pins:p.pins,checks:p.checks||[],geo:p.geo||null,stage:p.stage??null};
    if(p.dataUrl) entry.dataUrlDigest=await sha256(p.dataUrl);
    else entry.imageBytes='unavailable';
    return entry;
  }));
  const signature=art.signature?{name:art.signature.name,at:art.signature.at,digest:await sha256(canonical(art.signature))}:null;
  return {version:1,artwork:details,photos,custody:art.custody,climate:art.climate,signature};
}
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

    output.innerHTML=`
      <div class="verdict noprint">
        <div class="vbig serif">${nPins} finding${nPins===1?'':'s'} documented</div>
        <div class="vsub">${art.photos.length} photo${art.photos.length===1?'':'s'} · ${art.custody.length} custody event${art.custody.length===1?'':'s'} · ${art.climate.length} climate reading${art.climate.length===1?'':'s'} · tamper-evident hash recorded</div>
        <div class="vrid">Dossier ${rid}</div>
      </div>`+html+`
      <div class="fabrow noprint">
        <button class="btn" id="btnDoPrint">${IC.doc} Print / Save PDF</button>
        <button class="btn ghost" id="btnDoFile">${IC.download} Download file</button>
        <button class="btn ghost" id="btnEmail">${IC.mail} Email claim summary</button>
      </div>`;
    document.getElementById('btnDoPrint').onclick=()=>window.print();
    document.getElementById('btnDoFile').onclick=()=>{
      const blob=new Blob([file],{type:'text/html'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download='provenance-dossier-'+rid+'.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      toast('Dossier file downloaded, send it to the adjuster');
    };
    document.getElementById('btnEmail').onclick=()=>emailClaimSummary(art,rid,hash);
    document.getElementById('dossierDoc').scrollIntoView({behavior:'smooth'});
    toast('Dossier ready, print or save as PDF');
    }catch(err){toast('Could not seal dossier. Try again in a browser with secure hashing support.');}
    finally{b.disabled=false;b.innerHTML=IC.doc+' Generate dossier';}
  };
}
function wireTab(art,tab){
  if(tab==='photos') wirePhotos(art);
  else if(tab==='custody') wireCustody(art);
  else if(tab==='climate') wireClimate(art);
  else wireDossier(art);
}

/* ---------- claim-settlement email draft (Item 8) ---------- */
function emailClaimSummary(art,rid,hash){
  const sev={minor:0,moderate:0,severe:0};
  art.photos.forEach(p=>p.pins.forEach(pin=>{ if(sev[pin.severity]!=null) sev[pin.severity]++; }));
  const nPins=sev.minor+sev.moderate+sev.severe;
  const lines=[
    'Condition dossier for '+(art.title||'Untitled')+((art.artist?', '+art.artist:'')+(art.year?' ('+art.year+')':'')),
    'Declared value: '+fmtMoney(art.value),
    'Overall condition: '+(art.condition||'Not assessed'),
    'Examiner: '+(art.examiner||'Not recorded'),
    'Dossier ID: '+rid,
    'Generated: '+fmtDate(new Date().toISOString()),
    'Findings: '+nPins+' total ('+sev.severe+' severe, '+sev.moderate+' moderate, '+sev.minor+' minor)',
    'Evidence: '+art.photos.length+' photos, '+art.custody.length+' custody events, '+art.climate.length+' climate readings',
    'Integrity hash (SHA-256): '+hash,
    'This hash was computed on the examiner\u2019s device when the dossier was generated. It records the evidence used for this document at that moment.',
    '',
    'Print the dossier to PDF and attach it before sending. Reply to this email with questions.'
  ];
  const subject='Condition dossier '+rid+': '+(art.title||'Untitled');
  location.href='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(lines.join('\n'));
}

/* ================= export / import ================= */
function exportBackup(){
  try{
    const blob=new Blob([JSON.stringify(failedBackup||DB)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='provenance-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Backup downloaded'); return true;
  }catch(e){ toast('Could not export backup. Please try again.'); return false; }
}
document.getElementById('btnExport').onclick=()=>{ exportBackup(); };
document.getElementById('btnImport').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.artworks) throw 0;
      DB=d; save(); render(); toast('Backup imported'); }catch(_){ toast('Invalid backup file'); } };
  r.readAsText(f); e.target.value='';
};

/* ================= init ================= */
load();
render();
refreshStorageInfo();

/* ---------- PWA: offline banner, install prompt, service worker (Item 9) ---------- */
(function(){
  const netBanner=document.getElementById('netBanner');
  function paintNet(){ netBanner.classList.toggle('hidden',navigator.onLine); }
  window.addEventListener('online',paintNet);
  window.addEventListener('offline',paintNet);
  paintNet();
  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault(); deferredPrompt=e;
    try{ if(localStorage.getItem('provenance.install.dismissed')) return; }catch(_){}
    if(document.getElementById('installBanner')) return;
    const b=document.createElement('div'); b.className='installbanner'; b.id='installBanner';
    b.innerHTML=`<div class="t"><b>Install Provenance</b>Add it to the home screen for full-screen dock use.</div>
      <button class="btn small" id="instYes" style="background:var(--paper);color:var(--ink);border-color:var(--paper)">Install</button>
      <button class="btn small ghost" id="instNo" style="color:var(--paper);border-color:#6B6459">Not now</button>`;
    document.body.appendChild(b);
    document.getElementById('instYes').onclick=async()=>{
      b.remove();
      if(deferredPrompt){ deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(_){} deferredPrompt=null; }
    };
    document.getElementById('instNo').onclick=()=>{
      try{ localStorage.setItem('provenance.install.dismissed','1'); }catch(_){}
      b.remove();
    };
  });
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  }
})();

/* ---- sync bridge (consumed by sync.js; local-first, sync never blocks UI) ---- */
window.__provenance = {
  getS: () => DB,
  saveLocal: () => { try{ localStorage.setItem(LSKEY, JSON.stringify(DB)); }catch(e){} },
  refresh: () => render()
};

/* device sync entry point (topbar button) */
document.getElementById('btnSync').innerHTML = IC.layers;
document.getElementById('btnSync').onclick = () => {
  openSheet('<h3>Device sync</h3><p class="micro">Same key on phone + laptop = same records.</p>'+storageMeter());
  refreshStorageInfo();
  if (window.__provenanceSyncUI) window.__provenanceSyncUI();
};
</script>

<script>
/* Billing: shared module (see builds/shared/billing-ui.js). Trial = full
 * access, no card; the paywall overlay blocks the app but local data is
 * untouched. Fail open: if billing init fails, the app works normally. */
(function(){
  var PLANS = [
    { lookupKey: "price_provenance_solo", name: "Solo", price: "$80/mo",
      blurb: "1 handler: unlimited artworks, condition dossiers, chain of custody." },
    { lookupKey: "price_provenance_crew", name: "Crew", price: "$150/mo",
      blurb: "Up to 5 handlers: before/after views, client-facing dossier links." }
  ];
  function boot(){
    if (typeof initBilling !== "function") return;
    initBilling({ appSlug: "provenance", plans: PLANS }).then(function(b){
      window.__billing = b;
      b.ensurePaywall();
      // The trial banner is fixed at the viewport top; keep it from covering
      // the sticky topbar (real overlap on phone viewports).
      var offsetForBanner = function(){
        var bar = document.querySelector('.bill-banner');
        var h = bar ? bar.offsetHeight : 0;
        document.body.style.paddingTop = h ? h + 'px' : '';
        var tb = document.querySelector('.topbar');
        if (tb) tb.style.top = h ? h + 'px' : '';
      };
      try {
        new MutationObserver(offsetForBanner).observe(document.body, { childList: true });
        window.addEventListener('resize', offsetForBanner);
      } catch(e){}
      offsetForBanner();
      var syncBtn = document.getElementById("btnSync");
      if (syncBtn) syncBtn.addEventListener("click", function(){
        setTimeout(function(){ try { b.injectSettings(); } catch(e){} }, 0);
      });
    }).catch(function(e){
      // Billing must never break the app. Fail open, log loudly.
      try { console.error("[billing] init failed:", e); } catch(_){}
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
