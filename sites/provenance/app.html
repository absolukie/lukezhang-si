<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F1">
<title>Provenance — Condition Documentation</title>
<style>
:root{
  --paper:#FAF7F1; --paper2:#F2EDE1; --card:#FFFFFF; --ink:#1C1917; --ink2:#6B6459;
  --line:#E3DCCB; --line2:#D3C9B4;
  --accent:#8C2F1B; --accent-soft:#F5E4DC;
  --amber:#9A6B12; --olive:#5F6C3F; --red:#B3261E;
  --serif:Georgia,'Palatino Linotype','Book Antiqua','Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --rad:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
button{touch-action:manipulation;font-family:var(--sans);font-size:16px}
input,select,textarea{font-size:16px;font-family:var(--sans);color:var(--ink)}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:500;letter-spacing:.01em}

/* ---------- chrome ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
.topbar .brand{font-family:var(--serif);font-size:22px;letter-spacing:.14em}
.topbar .sub{font-size:11px;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.topbar .spacer{flex:1}
.iconbtn{background:none;border:1px solid var(--line2);border-radius:999px;width:40px;height:40px;
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer}
.iconbtn:active{background:var(--paper2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper);padding:12px 20px;font-weight:600;cursor:pointer;min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.small{min-height:40px;padding:8px 14px;font-size:14px}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.45}
main{max-width:760px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.hairline{border:0;border-top:1px solid var(--line);margin:20px 0}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px}

/* ---------- artwork cards ---------- */
.artcard{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);
  padding:12px;margin-bottom:12px;cursor:pointer;text-align:left;width:100%;color:inherit}
.artcard:active{background:var(--paper2)}
.artcard .thumb{width:76px;height:76px;border-radius:6px;object-fit:cover;background:var(--paper2);flex:none;border:1px solid var(--line)}
.artcard .thumb.mono{display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:28px;color:var(--ink2)}
.artcard .t{font-family:var(--serif);font-size:19px;margin:0 0 2px}
.artcard .a{font-size:14px;color:var(--ink2);margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;color:var(--ink2);background:var(--paper)}
.chip.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.warn{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

/* ---------- detail ---------- */
.backrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.detailhead h1{font-size:30px;margin:4px 0 2px;line-height:1.15}
.detailhead .artist{font-size:16px;color:var(--ink2);margin:0 0 10px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;margin:14px 0}
.specs div{background:var(--card);padding:10px 12px}
.specs .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.specs .v{font-size:15px;margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0;position:sticky;top:61px;background:var(--paper);z-index:30;padding-top:4px}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:12px 4px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}

/* ---------- photos ---------- */
.photogrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photocard{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden}
.photocard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--paper2)}
.photocard .pbody{padding:10px 12px}
.photocard .cap{font-size:14px;margin:0 0 2px}
.photocard .when{font-size:12px;color:var(--ink2);margin:0 0 8px}
.prow{display:flex;gap:8px}
.prow .btn{flex:1}
.addphoto{border:1.5px dashed var(--line2);border-radius:var(--rad);background:transparent;min-height:120px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink2);cursor:pointer;width:100%}
.addphoto:active{background:var(--paper2)}

/* ---------- annotate ---------- */
.annwrap{position:relative;background:#111;border-radius:var(--rad);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.annwrap img{display:block;width:100%;height:auto;pointer-events:none}
.pin{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:grab;border:2px solid #fff;
  box-shadow:0 1px 6px rgba(0,0,0,.45);touch-action:none;z-index:5}
.pin.sev-moderate{background:var(--amber)}
.pin.sev-severe{background:var(--red)}
.pin.sel{outline:3px solid var(--accent);outline-offset:2px}
.crosshair{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid #fff;border-radius:50%;
  box-shadow:0 0 0 1px rgba(0,0,0,.4);pointer-events:none;display:none;z-index:4}
.annhint{font-size:13px;color:var(--ink2);margin:10px 0;display:flex;align-items:center;gap:8px}
.pinlist{margin:14px 0 0;padding:0;list-style:none}
.pinlist li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:var(--rad);padding:10px 12px;margin-bottom:8px;cursor:pointer}
.pinlist li:active{background:var(--paper2)}
.pinnum{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.pinnum.sev-moderate{background:var(--amber)}.pinnum.sev-severe{background:var(--red)}
.pinlist .pt{font-size:14px;font-weight:600}
.pinlist .pn{font-size:13px;color:var(--ink2)}

/* ---------- bottom sheet ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--line2);
  border-radius:18px 18px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;
  transform:translateY(105%);transition:transform .28s ease;max-height:86vh;overflow:auto}
.sheet.open{transform:translateY(0)}
.scrim{position:fixed;inset:0;background:rgba(28,25,23,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet h3{font-size:22px;margin:4px 0 12px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:12px;background:#fff}
.field textarea{min-height:80px;resize:vertical}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:12px 4px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper)}
.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.typegrid button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:12px 6px;font-size:14px;cursor:pointer}
.typegrid button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.sheet .actions{display:flex;gap:10px;margin-top:16px}
.sheet .actions .btn{flex:1}

/* ---------- custody / climate ---------- */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 18px 26px}
.tl li:before{content:"";position:absolute;left:7px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--ink)}
.tl li:after{content:"";position:absolute;left:11px;top:20px;bottom:-2px;width:1px;background:var(--line2)}
.tl li:last-child:after{display:none}
.tl .what{font-weight:700;font-size:15px}
.tl .det{font-size:13px;color:var(--ink2)}
.climrow{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:12px;margin-bottom:8px;align-items:center}
.climrow .big{font-family:var(--serif);font-size:22px}
.climrow .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}

/* ---------- dossier ---------- */
.dossier{background:#fff;border:1px solid var(--line2);border-radius:6px;padding:28px 24px;margin-top:8px}
.dossier h1{font-size:26px;margin:0 0 2px}
.dossier .rid{font-size:12px;letter-spacing:.1em;color:var(--ink2);text-transform:uppercase}
.dossier table{width:100%;border-collapse:collapse;font-size:14px;margin:14px 0}
.dossier td,.dossier th{border-bottom:1px solid var(--line);padding:8px 4px;text-align:left;vertical-align:top}
.dossier th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.dossier .photofig{margin:16px 0;break-inside:avoid}
.dossier .photofig .pwrap{position:relative}
.dossier .photofig img{width:100%;border:1px solid var(--line);border-radius:4px;display:block}
.dossier .photofig .pin{width:28px;height:28px;margin:-14px 0 0 -14px;font-size:12px;pointer-events:none}
.dossier .legend{font-size:13px;margin:8px 0 0;padding:0;list-style:none}
.dossier .legend li{margin-bottom:4px}
.dossier .sig{margin-top:28px;display:flex;gap:24px}
.dossier .sig div{flex:1;border-top:1px solid var(--ink);padding-top:6px;font-size:12px;color:var(--ink2)}
.hash{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all;color:var(--ink2);background:var(--paper2);padding:8px;border-radius:6px}

/* ---------- compare ---------- */
.cmpsel{display:flex;gap:8px;margin-bottom:12px}
.cmpsel select{flex:1;min-width:0;border:1px solid var(--line2);border-radius:8px;padding:12px;background:#fff}
.cmpwrap{position:relative;border-radius:var(--rad);overflow:hidden;background:#111}
.cmpwrap img{display:block;width:100%;height:auto}
.cmpwrap .top{position:absolute;inset:0;overflow:hidden}
.cmpwrap .top img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.cmplabel{position:absolute;top:10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:rgba(0,0,0,.65);color:#fff;padding:4px 10px;border-radius:999px;z-index:3}
.cmpwrap input[type=range]{position:absolute;inset:0;width:100%;opacity:0;z-index:4;touch-action:none;height:100%;margin:0}
.cmphandle{position:absolute;top:0;bottom:0;width:2px;background:#fff;z-index:2;pointer-events:none;box-shadow:0 0 8px rgba(0,0,0,.5)}

/* ---------- empty / misc ---------- */
.empty{text-align:center;padding:48px 20px;color:var(--ink2)}
.empty .big{font-family:var(--serif);font-size:26px;color:var(--ink);margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(28px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;font-size:14px;z-index:80;
  opacity:0;pointer-events:none;transition:all .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fabrow{display:flex;gap:10px;margin:16px 0}
.fabrow .btn{flex:1}
svg.ic{width:20px;height:20px;flex:none}
.hidden{display:none!important}
.verdict{background:var(--ink);color:var(--paper);border-radius:14px;padding:22px 20px;margin:0 0 18px;text-align:center}
.verdict .vbig{font-size:24px;margin-bottom:6px}
.verdict .vsub{font-size:13px;color:#CFC8B8;line-height:1.5}
.verdict .vrid{font-size:11px;letter-spacing:.1em;color:#9A917F;margin-top:10px;text-transform:uppercase}
.coach{position:fixed;inset:auto 12px 12px 12px;z-index:90;background:var(--ink);color:var(--paper);
  border-radius:16px;padding:20px;box-shadow:0 16px 50px rgba(0,0,0,.35);max-width:480px;margin:0 auto}
.coach h3{font-family:var(--serif);font-weight:500;font-size:19px;margin:0 0 10px}
.coach ol{margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.7;color:#EDE6D4}
.coach ol b{color:#fff}
.coach .btn{background:var(--paper);color:var(--ink);border-color:var(--paper);width:100%}

@media print{
  body{background:#fff}
  .topbar,.tabs,.backrow,.noprint,.toast,.sheet,.scrim,.fabrow{display:none!important}
  main{max-width:none;padding:0}
  .dossier{border:0;margin:0;padding:0}
}
/* ---- device sync (prototype) ---- */
.micro{font-size:12px;color:var(--ink2,#8A8071)}
#syncBox{margin-top:12px}
#syncBox h4{margin:0 0 8px}
#syncBox .set-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
#syncBox .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#EFE9DC;color:#8A8071}
#syncBox .pill.ok{background:#DFF0E2;color:#2C6E3F}
#syncBox .pill.warn{background:#FFF3D6;color:#8A6D1A}
#syncBox .pill.crit{background:#FBDEDE;color:#A33B3B}
#syncBox .link-btn{background:none;border:0;color:#2A6DF4;font-size:14px;font-weight:600;cursor:pointer;padding:4px 0;touch-action:manipulation}
#syncBox input{width:100%;box-sizing:border-box;font-size:12px;padding:8px;border:1px solid var(--line2,#D8D2C4);border-radius:8px;margin-top:4px;background:#fff}
</style>
</head>
<body>
<div class="topbar">
  <div><div class="brand">PROVENANCE</div><div class="sub">Condition Documentation</div></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="btnExport" title="Export backup" aria-label="Export backup"></button>
  <button class="iconbtn" id="btnImport" title="Import backup" aria-label="Import backup"></button>
  <button class="iconbtn" id="btnSync" title="Device sync" aria-label="Device sync"></button>
  <input type="file" id="importFile" accept="application/json" class="hidden">
</div>
<main id="app"></main>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ================= icons ================= */
const IC = {
  plus:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  camera:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>',
  back:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  doc:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg>',
  x:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  trash:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  clock:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  thermo:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M10 4a2 2 0 0 1 4 0v9.3a4.5 4.5 0 1 1-4 0z"/><circle cx="12" cy="17.5" r="1.6" fill="currentColor"/></svg>',
  pin:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 21s-6.5-5.6-6.5-10.5A6.5 6.5 0 0 1 12 4a6.5 6.5 0 0 1 6.5 6.5C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.2"/></svg>',
  edit:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/></svg>',
  download:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M4 20h16"/></svg>',
  upload:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 8l5-5 5 5M4 20h16"/></svg>',
  layers:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>'
};
document.getElementById('btnExport').innerHTML = IC.download;
document.getElementById('btnImport').innerHTML = IC.upload;

/* ================= state ================= */
const LSKEY = 'provenance.v1';
let DB = { artworks: [] };
let draftPin = null; // pin being placed

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ try{ return new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}); }catch(e){ return iso; } }
function fmtDateShort(iso){ try{ return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }catch(e){ return iso; } }
function fmtMoney(v){ if(v==null||v==='') return '—'; const n=Number(v); return isFinite(n)? '$'+n.toLocaleString() : esc(v); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function save(){
  try{ localStorage.setItem(LSKEY, JSON.stringify(DB)); }
  catch(e){ toast('Storage full — oldest photos may need exporting'); }
  try{ if(window.__provenanceSync) window.__provenanceSync.onSave(); }catch(e){}
}
function load(){
  try{ const raw = localStorage.getItem(LSKEY); if(raw){ DB = JSON.parse(raw); } }catch(e){ DB = {artworks:[]}; }
  if(!DB.artworks) DB.artworks = [];
}
function getArt(id){ return DB.artworks.find(a=>a.id===id); }
function getPhoto(art, pid){ return art.photos.find(p=>p.id===pid); }

const DAMAGE_TYPES = ['Scratch','Dent','Crack','Discoloration','Abrasion','Tear','Stain','Previous repair','Other'];
const SEV = ['minor','moderate','severe'];
const SEV_LABEL = {minor:'Minor',moderate:'Moderate',severe:'Severe'};
const CUSTODY_ACTIONS = ['Received','Inspected','Photographed','Packed','Shipped','Delivered','Released','Flagged'];

/* ================= toast / sheet ================= */
let toastT=null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
function openSheet(html){ const s=document.getElementById('sheet'); s.innerHTML=html; s.classList.add('open');
  document.getElementById('scrim').classList.add('open'); }
function closeSheet(){ document.getElementById('sheet').classList.remove('open');
  document.getElementById('scrim').classList.remove('open'); draftPin=null; }
document.getElementById('scrim').addEventListener('click', closeSheet);

/* ================= image handling ================= */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const MAX=1600; let w=img.width,h=img.height;
      const scale=Math.min(1, MAX/Math.max(w,h)); w=Math.round(w*scale); h=Math.round(h*scale);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=reject;
    img.src=URL.createObjectURL(file);
  });
}

/* ================= sample artwork ================= */
function sampleImage(){
  const c=document.createElement('canvas'); c.width=1200; c.height=900; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,900); g.addColorStop(0,'#E8E0D0'); g.addColorStop(1,'#D8CDB6');
  x.fillStyle=g; x.fillRect(0,0,1200,900);
  x.fillStyle='#2A2320'; x.fillRect(180,120,840,660);            // frame
  x.fillStyle='#F4EFE4'; x.fillRect(220,160,760,580);            // mat
  x.fillStyle='#31456B'; x.fillRect(260,200,680,500);            // painting ground
  x.fillStyle='#C8A24A'; x.beginPath(); x.arc(600,380,110,0,7); x.fill();
  x.fillStyle='#8C2F1B'; x.fillRect(260,520,680,180);
  x.fillStyle='#31456B'; x.beginPath(); x.moveTo(260,520);
  for(let i=0;i<=680;i+=40) x.lineTo(260+i,520-60*Math.abs(Math.sin(i/90)));
  x.lineTo(940,520); x.closePath(); x.fill();
  x.fillStyle='rgba(0,0,0,.18)'; x.fillRect(180,780,840,26);
  return c.toDataURL('image/jpeg',0.85);
}
function seedSample(){
  const art={ id:uid(), title:'Harbor at Dusk', artist:'E. Marchetti', medium:'Oil on canvas',
    dimensions:'36 × 48 in (framed 44 × 56 in)', year:'1962', value:52000, owner:'Whitfield Gallery',
    type:'Painting', examiner:'', condition:'Good', notes:'', createdAt:nowISO(),
    photos:[], custody:[], climate:[] };
  const ph={ id:uid(), dataUrl:sampleImage(), caption:'Front — receiving inspection', takenAt:nowISO(), pins:[] };
  ph.pins.push({id:uid(),x:71,y:24,type:'Scratch',severity:'moderate',note:'3 in hairline scratch, upper right quadrant, through varnish layer.'});
  ph.pins.push({id:uid(),x:30,y:78,type:'Discoloration',severity:'minor',note:'Slight yellowing along lower edge, consistent with age.'});
  art.photos.push(ph);
  art.custody.push({id:uid(),at:nowISO(),handler:'M. Okafor',action:'Received',location:'Whitfield Gallery — receiving dock',note:'Crate intact, no external damage.'});
  art.custody.push({id:uid(),at:nowISO(),handler:'M. Okafor',action:'Photographed',location:'Whitfield Gallery — exam room',note:'Front, back, and frame detail captured.'});
  art.climate.push({id:uid(),at:nowISO(),temp:70,humidity:48,location:'Exam room',note:''});
  DB.artworks.unshift(art); save();
  return art.id;
}

/* ================= router ================= */
const app=document.getElementById('app');

function nav(h){ location.hash=h; }

function render(){
  const h=(location.hash||'#/').replace(/^#\//,'');
  const parts=h.split('/');
  closeSheet();
  if(parts[0]==='art'&&parts[1]){
    const art=getArt(parts[1]); if(!art){ nav('/'); return; }
    if(parts[2]==='photo'&&parts[3]){ renderAnnotate(art,parts[3]); return; }
    if(parts[2]==='compare'){ renderCompare(art); return; }
    renderDetail(art, parts[2]||'photos'); return;
  }
  renderList();
}

function drawPins(art,p){
  const wrap=document.getElementById('annwrap'); if(!wrap) return;
  wrap.querySelectorAll('.pin').forEach(e=>e.remove());
  p.pins.forEach((pin,i)=>{
    const d=document.createElement('div');
    d.className='pin sev-'+pin.severity+(draftPin&&draftPin.id===pin.id?' sel':'');
    d.style.left=pin.x+'%'; d.style.top=pin.y+'%'; d.textContent=i+1; d.dataset.pid=pin.id;
    wrap.appendChild(d);
    d.addEventListener('pointerdown',e=>startPinDrag(e,art,p,pin,d));
  });
  const ul=document.getElementById('pinlist'); if(!ul) return;
  ul.innerHTML=p.pins.map((pin,i)=>`<li data-pid="${pin.id}">
    <span class="pinnum sev-${pin.severity}">${i+1}</span>

    || '<li style="cursor:default;color:var(--ink2)">No pins yet — tap the photo above.</li>';
  ul.querySelectorAll('li[data-pid]').forEach(li=>li.onclick=()=>{
    const pin=p.pins.find(x=>x.id===li.dataset.pid); if(pin) pinEditor(art,p,pin);
  });

function wireAnnotate(art,p){
  const wrap=document.getElementById('annwrap'), xhair=document.getElementById('xhair');
  drawPins(art,p);
  let downPos=null, moved=false;
  wrap.addEventListener('pointerdown',e=>{ if(e.target.classList.contains('pin')) return;
    downPos={x:e.clientX,y:e.clientY}; moved=false; });
  wrap.addEventListener('pointermove',e=>{ if(downPos&&Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>8) moved=true; });
  wrap.addEventListener('pointerup',e=>{
    if(e.target.classList.contains('pin')||!downPos||moved){ downPos=null; return; }
    const r=wrap.getBoundingClientRect();
    const x=Math.min(99,Math.max(1,(e.clientX-r.left)/r.width*100));
    const y=Math.min(99,Math.max(1,(e.clientY-r.top)/r.height*100));
    downPos=null;
    const pin={id:uid(),x:+x.toFixed(1),y:+y.toFixed(1),type:'Scratch',severity:'minor',note:''};
    p.pins.push(pin); draftPin=pin; drawPins(art,p);
    pinEditor(art,p,pin,true);
  });
  wrap.addEventListener('pointerleave',()=>{ xhair.style.display='none'; });
}
function startPinDrag(e,art,p,pin,el){
  e.preventDefault(); e.stopPropagation();
  const wrap=document.getElementById('annwrap'), r=wrap.getBoundingClientRect();
  const sx=e.clientX, sy=e.clientY, ox=pin.x, oy=pin.y; let dragged=false;
  el.setPointerCapture(e.pointerId);
  const move=ev=>{
    const dx=(ev.clientX-sx)/r.width*100, dy=(ev.clientY-sy)/r.height*100;
    if(Math.abs(dx)+Math.abs(dy)>0.6) dragged=true;
    pin.x=+Math.min(99,Math.max(1,ox+dx)).toFixed(1);
    pin.y=+Math.min(99,Math.max(1,oy+dy)).toFixed(1);
    el.style.left=pin.x+'%'; el.style.top=pin.y+'%';
  };
  const up=()=>{ el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up);
    if(dragged){ save(); } else { pinEditor(art,p,pin); } };
  el.addEventListener('pointermove',move); el.addEventListener('pointerup',up);
}

    document.querySelectorAll('#edSev button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
  document.getElementById('edCancel').onclick=()=>{ if(isNew){ p.pins=p.pins.filter(x=>x.id!==pin.id); } closeSheet(); drawPins(art,p); };
  const del=document.getElementById('edDel'); if(del) del.onclick=()=>{ p.pins=p.pins.filter(x=>x.id!==pin.id); save(); closeSheet(); drawPins(art,p); toast('Pin removed'); };
  document.getElementById('edSave').onclick=()=>{
    pin.type=edType; pin.severity=edSev; pin.note=document.getElementById('edNote').value.trim();
    save(); closeSheet(); draftPin=null; drawPins(art,p); toast('Pin saved');
  };
}

/* ================= compare view ================= */
function renderCompare(art){
  if(art.photos.length<2){ nav('/art/'+art.id); return; }
  const opts=art.photos.map((p,i)=>`<option value="${p.id}">${esc(p.caption||('Photo '+(i+1)))} — ${fmtDateShort(p.takenAt)}</option>`).join('');
  app.innerHTML=`
    <div class="backrow noprint">
      <button class="iconbtn" id="btnBack" aria-label="Back">${IC.back}</button>
      <div style="flex:1"><b>Before / After</b><div style="font-size:12px;color:var(--ink2)">Drag across the image to wipe between captures</div></div>
    </div>
    <div class="cmpsel noprint">
      <select id="cmpA">${opts}</select><select id="cmpB">${opts}</select>
    </div>
    <div class="cmpwrap" id="cmpwrap">
      <img id="cmpImgB" alt="After">
      <div class="top" id="cmpTop"><img id="cmpImgA" alt="Before"></div>
      <span class="cmplabel" style="left:10px">Before</span>
      <span class="cmplabel" style="right:10px">After</span>
      <div class="cmphandle" id="cmpHandle" style="left:50%"></div>
      <input type="range" id="cmpRange" min="0" max="100" value="50" aria-label="Comparison slider">
    </div>
    <p class="annhint noprint">${IC.layers} Use this at receiving vs. delivery to show condition change to an insurer.</p>`;
  document.getElementById('btnBack').onclick=()=>nav('/art/'+art.id+'/photos');
  const A=document.getElementById('cmpA'), B=document.getElementById('cmpB');
  const recv=art.photos.find(p=>p.stage==='Receiving'), deliv=[...art.photos].reverse().find(p=>p.stage==='Delivery');
  if(recv) A.value=recv.id;
  if(deliv && deliv.id!==A.value) B.value=deliv.id; else B.selectedIndex=Math.min(1,art.photos.length-1);
  const upd=()=>{
    const pa=getPhoto(art,A.value), pb=getPhoto(art,B.value);
    document.getElementById('cmpImgA').src=pa.dataUrl;
    document.getElementById('cmpImgB').src=pb.dataUrl;
  };
  A.onchange=upd; B.onchange=upd; upd();
  const range=document.getElementById('cmpRange'), top=document.getElementById('cmpTop'), handle=document.getElementById('cmpHandle');
  range.addEventListener('input',()=>{ top.style.clipPath=`inset(0 ${100-range.value}% 0 0)`; handle.style.left=range.value+'%'; });
  top.style.clipPath='inset(0 50% 0 0)';
}

/* ================= custody tab ================= */
function custodyTab(art){
  const items=[...art.custody].reverse().map(c=>`<li>
    <div class="what">${esc(c.action)}</div>
    <div class="det">${fmtDate(c.at)}${c.handler?' · '+esc(c.handler):''}${c.location?'<br>'+esc(c.location):''}${c.note?'<br>'+esc(c.note):''}</div>
  </li>`).join('');
  return `<div class="fabrow noprint"><button class="btn" id="btnCust">${IC.plus} Log custody event</button></div>
    ${items?`<ul class="tl">${items}</ul>`:'<p style="color:var(--ink2)">No custody events yet. Every handoff should be logged — gaps in the chain are where claims die.</p>'}`;
}
function wireCustody(art){
  const b=document.getElementById('btnCust'); if(!b) return;
  const handlers=[...new Set(art.custody.map(c=>c.handler).filter(Boolean))];
  b.onclick=()=>{
    let act='Received';
    openSheet(`<h3>Log custody event</h3>
      <div class="field"><label>Action</label><div class="typegrid" id="cuActs">
        ${CUSTODY_ACTIONS.map(a=>`<button data-a="${a}" class="${a===act?'on':''}">${a}</button>`).join('')}
      </div></div>
      <div class="field"><label>Handler</label><input id="cu_h" list="handlers" placeholder="Name of person handling" value="${esc(handlers[0]||'')}">
        <datalist id="handlers">${handlers.map(h=>`<option value="${esc(h)}">`).join('')}</datalist></div>
      <div class="field"><label>Location</label><input id="cu_l" placeholder="Gallery — receiving dock"></div>
      <div class="field"><label>Note</label><textarea id="cu_n" placeholder="Crate condition, seal numbers…"></textarea></div>
      <div class="actions"><button class="btn ghost" id="cu_no">Cancel</button><button class="btn" id="cu_yes">${IC.check} Log event</button></div>`);
    document.querySelectorAll('#cuActs button').forEach(x=>x.onclick=()=>{ act=x.dataset.a;
      document.querySelectorAll('#cuActs button').forEach(y=>y.classList.remove('on')); x.classList.add('on'); });
    document.getElementById('cu_no').onclick=closeSheet;
    document.getElementById('cu_yes').onclick=()=>{
      art.custody.push({id:uid(),at:nowISO(),handler:document.getElementById('cu_h').value.trim(),
        action:act,location:document.getElementById('cu_l').value.trim(),note:document.getElementById('cu_n').value.trim()});
      save(); closeSheet(); render(); toast('Custody event logged');
    };
  };
}

/* ================= climate tab ================= */
function climateTab(art){
  const rows=[...art.climate].reverse().map(c=>`<div class="climrow">
    <div style="flex:1"><span class="big">${c.temp}°F</span> <span class="big" style="color:var(--ink2)">· ${c.humidity}%</span>
    <div class="lab">Temp · RH — ${fmtDate(c.at)}${c.location?' · '+esc(c.location):''}${c.note?' — '+esc(c.note):''}</div></div>
    <button class="iconbtn" data-climdel="${c.id}" aria-label="Delete reading">${IC.trash}</button></div>`).join('');
  return `<div class="fabrow noprint"><button class="btn" id="btnClim">${IC.thermo} Log reading</button></div>
    ${rows||'<p style="color:var(--ink2)">No climate readings yet. Insurers ask for temperature and humidity history on high-value claims.</p>'}`;
}
function wireClimate(art){
  const b=document.getElementById('btnClim'); if(!b) return;
  b.onclick=()=>{
    openSheet(`<h3>Climate reading</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="field"><label>Temp (°F)</label><input id="cl_t" inputmode="decimal" placeholder="70"></div>
      <div class="field"><label>Humidity (% RH)</label><input id="cl_h" inputmode="decimal" placeholder="48"></div></div>
      <div class="field"><label>Location</label><input id="cl_l" placeholder="Storage vault B"></div>
      <div class="field"><label>Note</label><input id="cl_n" placeholder=""></div>
      <div class="actions"><button class="btn ghost" id="cl_no">Cancel</button><button class="btn" id="cl_yes">${IC.check} Save</button></div>`);
    document.getElementById('cl_no').onclick=closeSheet;
    document.getElementById('cl_yes').onclick=()=>{
      const t=parseFloat(document.getElementById('cl_t').value), h=parseFloat(document.getElementById('cl_h').value);
      if(!isFinite(t)||!isFinite(h)){ toast('Enter temperature and humidity'); return; }
      const warn=(t<60||t>78||h<40||h>60);
      art.climate.push({id:uid(),at:nowISO(),temp:t,humidity:h,
        location:document.getElementById('cl_l').value.trim(),note:document.getElementById('cl_n').value.trim()});
      save(); closeSheet(); render();
      toast(warn?'Saved — outside museum range (65–75°F, 40–60% RH)':'Reading saved');
    };
  };
  app.querySelectorAll('[data-climdel]').forEach(x=>x.onclick=()=>{
    art.climate=art.climate.filter(c=>c.id!==x.dataset.climdel); save(); render();
  });
}

/* ================= dossier tab ================= */
function dossierTab(art){
  return `<div class="fabrow noprint">
      <button class="btn" id="btnPrint">${IC.doc} Generate dossier</button>
    </div>
    <div class="field noprint" style="max-width:320px"><label>Overall condition</label>
      <select id="condSel">${['Not assessed','Excellent','Good','Fair','Poor'].map(c=>`<option ${art.condition===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="field noprint" style="max-width:320px"><label>Examiner</label>
      <input id="examInp" value="${esc(art.examiner||'')}" placeholder="Your name"></div>
    <div id="dossierOut"></div>`;
}
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function buildDossier(art){
  const rid='PRV-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
  const at=new Date().toISOString();
  const sevCount={minor:0,moderate:0,severe:0};
  art.photos.forEach(p=>p.pins.forEach(pin=>sevCount[pin.severity]++));
  const photoFigs=art.photos.map((p,pi)=>{
    const legend=p.pins.map((pin,i)=>`<li><b>${i+1}.</b> ${esc(pin.type)} — ${SEV_LABEL[pin.severity]}${pin.note?': '+esc(pin.note):''}</li>`).join('');
    const overlay=p.pins.map((pin,i)=>`<span class="pin sev-${pin.severity}" style="left:${pin.x}%;top:${pin.y}%">${i+1}</span>`).join('');
    return `<div class="photofig"><div class="pwrap"><img src="${p.dataUrl}" alt="">${overlay}</div>
      <p style="font-size:13px;color:var(--ink2);margin:6px 0">${esc(p.caption)||('Photo '+(pi+1))} · ${fmtDate(p.takenAt)}</p>
      ${legend?`<ul class="legend">${legend}</ul>`:'<p style="font-size:13px;color:var(--ink2)">No condition pins on this photo.</p>'}</div>`;
  }).join('');
  const custRows=art.custody.map(c=>`<tr><td>${fmtDate(c.at)}</td><td><b>${esc(c.action)}</b></td><td>${esc(c.handler||'—')}</td><td>${esc(c.location||'—')}${c.note?'<br>'+esc(c.note):''}</td></tr>`).join('');
  const climRows=art.climate.map(c=>`<tr><td>${fmtDate(c.at)}</td><td>${c.temp}°F</td><td>${c.humidity}% RH</td><td>${esc(c.location||'—')}</td></tr>`).join('');
  const body=`${rid}|${at}|${art.id}|${JSON.stringify(art.photos.map(p=>p.pins))}|${JSON.stringify(art.custody)}`;
  const hash=await sha256(body);
  return {html:`
    <div class="dossier" id="dossierDoc">
      <p class="rid">Condition Dossier · ${rid}</p>
      <h1>${esc(art.title)||'Untitled'}</h1>
      <p style="color:var(--ink2);margin:0 0 4px">${esc(art.artist)||'Unknown artist'}${art.year?' · '+esc(art.year):''}</p>
      <table>
        <tr><th>Field</th><th>Detail</th></tr>
        <tr><td>Object type</td><td>${esc(art.type||'—')}</td></tr>
        <tr><td>Medium</td><td>${esc(art.medium||'—')}</td></tr>
        <tr><td>Dimensions</td><td>${esc(art.dimensions||'—')}</td></tr>
        <tr><td>Declared value</td><td>${fmtMoney(art.value)}</td></tr>
        <tr><td>Owner</td><td>${esc(art.owner||'—')}</td></tr>
        <tr><td>Overall condition</td><td><b>${esc(art.condition||'Not assessed')}</b></td></tr>
        <tr><td>Findings</td><td>${sevCount.severe} severe · ${sevCount.moderate} moderate · ${sevCount.minor} minor</td></tr>
        <tr><td>Examiner</td><td>${esc(art.examiner||'—')}</td></tr>
        <tr><td>Generated</td><td>${fmtDate(at)}</td></tr>
      </table>
      <h3 class="serif">Photographic evidence</h3>
      ${photoFigs||'<p>No photographs on file.</p>'}
      <h3 class="serif">Chain of custody</h3>
      ${custRows?`<table><tr><th>When</th><th>Action</th><th>Handler</th><th>Location</th></tr>${custRows}</table>`:'<p>No custody events logged.</p>'}
      <h3 class="serif">Climate history</h3>
      ${climRows?`<table><tr><th>When</th><th>Temp</th><th>RH</th><th>Location</th></tr>${climRows}</table>`:'<p>No climate readings logged.</p>'}
      <h3 class="serif">Integrity</h3>
      <p style="font-size:13px;color:var(--ink2)">SHA-256 of this report's evidence payload. Any alteration to pins, custody or climate entries changes this hash.</p>
      <div class="hash">${hash}</div>
      <div class="sig"><div>Examiner signature</div><div>Date</div></div>
    </div>`, rid};
}
function wireDossier(art){
  const cs=document.getElementById('condSel'); if(cs) cs.onchange=()=>{ art.condition=cs.value; save(); };
  const ex=document.getElementById('examInp'); if(ex) ex.onchange=()=>{ art.examiner=ex.value.trim(); save(); };
  const b=document.getElementById('btnPrint'); if(!b) return;
  b.onclick=async()=>{
    art.examiner=(document.getElementById('examInp').value||'').trim(); save();
    b.disabled=true; b.textContent='Generating…';
    const {html, rid}=await buildDossier(art);
    const nPins=art.photos.reduce((s,p)=>s+p.pins.length,0);
    document.getElementById('dossierOut').innerHTML=`
      <div class="verdict noprint">
        <div class="vbig serif">${nPins} finding${nPins===1?'':'s'} documented</div>
        <div class="vsub">${art.photos.length} photo${art.photos.length===1?'':'s'} · ${art.custody.length} custody event${art.custody.length===1?'':'s'} · ${art.climate.length} climate reading${art.climate.length===1?'':'s'} · tamper-evident hash sealed</div>
        <div class="vrid">Dossier ${rid}</div>
      </div>`+html+`
      <div class="fabrow noprint"><button class="btn" id="btnDoPrint">${IC.doc} Print / Save PDF</button></div>`;
    document.getElementById('btnDoPrint').onclick=()=>window.print();
    document.getElementById('dossierDoc').scrollIntoView({behavior:'smooth'});
    b.disabled=false; b.innerHTML=IC.doc+' Regenerate dossier';
    toast('Dossier ready — print or save as PDF');
  };
}
function wireTab(art,tab){
  if(tab==='photos') wirePhotos(art);
  else if(tab==='custody') wireCustody(art);
  else if(tab==='climate') wireClimate(art);
  else wireDossier(art);
}

/* ================= export / import ================= */
document.getElementById('btnExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(DB)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='provenance-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('Backup downloaded');
};
document.getElementById('btnImport').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.artworks) throw 0;
      DB=d; save(); render(); toast('Backup imported'); }catch(_){ toast('Invalid backup file'); } };
  r.readAsText(f); e.target.value='';
};

load();
render();

  refresh: () => render()
};
