<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoadWrench: Mobile RV Repair</title>
<meta name="description" content="Job tracking, parts, labor, photos, and warranty claim packets for mobile RV repair techs.">
<meta name="theme-color" content="#1e3d2b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231e3d2b'/%3E%3Cpath d='M14.5 6.5a3.5 3.5 0 0 0-4.6 4.6L5 16l3 3 4.9-4.9a3.5 3.5 0 0 0 4.6-4.6l-2.3 2.3-2.4-2.4z' fill='%23f7f2e3'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span id="brandIcon"></span>
      <h1>RoadWrench<small>Mobile RV Repair</small></h1>
    </div>
  </header>
  <div id="offlineBanner" class="offline-banner" hidden>You're offline. Everything keeps working, and changes save on this device.</div>
  <div id="storageBanner" class="storage-banner" hidden></div>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Main navigation"></nav>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script src="sync.js"></script>
<script src="auth-ui.js"></script>
<script src="billing-ui.js"></script>
<style>
/* Billing theme: pine green + rust to match RoadWrench */
:root{
  --bill-accent:#1e3d2b; --bill-bg:#fffdf6; --bill-text:#22281f;
  --bill-muted:#6d7263; --bill-line:#d9d0b8;
}
</style>
<script>
/* Billing: shared module (see builds/shared/billing-ui.js). Trial = full
 * access; the paywall overlay blocks the app but local data is untouched.
 * If the billing backend is unreachable, the app works normally (fail open). */
(function(){
  var PLANS = [
    { lookupKey: "price_roadwrench_solo", name: "Solo", price: "$50/mo",
      blurb: "1 tech: unlimited jobs, warranty packets, photo docs, signatures." },
    { lookupKey: "price_roadwrench_shop", name: "Shop", price: "$100/mo",
      blurb: "Up to 5 techs: per-tech job and revenue views, priority support." }
  ];
  // Attaches the billing Subscription card into the Setup view (if rendered).
  // If billing is not configured, the card header is hidden so nothing shows.
  window.__attachBillSettings = function(){
    try {
      var slot = document.getElementById("billSettingsSlot");
      var b = window.__billing;
      if (!slot || !b || slot.querySelector("[data-bill-settings]")) return;
      var html = b.settingsHTML();
      var card = slot.closest(".card");
      if (!html) { if (card) card.style.display = "none"; return; }
      var div = document.createElement("div");
      div.innerHTML = html;
      slot.appendChild(div.firstChild);
      b.bindSettings(slot);
    } catch(e){}
  };
  function boot(){
    if (typeof initBilling !== "function") return;
    initBilling({ appSlug: "roadwrench", plans: PLANS }).then(function(b){
      window.__billing = b;
      b.ensurePaywall();
      window.__attachBillSettings();
      // Log billing milestones on every state refresh, not just at boot
      // (startTrial refreshes internally; without this, trial_started is missed).
      try {
        var origRefresh = b.refresh.bind(b);
        b.refresh = function(){
          return origRefresh().then(function(r){ logBillingEvents(b); return r; });
        };
      } catch(e){}
      logBillingEvents(b);
    }).catch(function(e){
      // Billing must never break the app. Fail open, log loudly.
      try { console.error("[billing] init failed:", e); } catch(_){}
    });
  }
  // Local-only billing milestones for the usage event log (PRD R-45).
  function logBillingEvents(b){
    try {
      var st = (b && b.status) || {};
      var key = "roadwrench.billinglog.v1", prev = null;
      try { prev = JSON.parse(localStorage.getItem(key)); } catch(e){}
      var cur = { state: st.state || "unknown", trial_ends_at: st.trial_ends_at || 0 };
      if (!prev || prev.state !== cur.state || prev.trial_ends_at !== cur.trial_ends_at) {
        if (cur.state === "trialing" && (!prev || prev.state !== "trialing" || prev.trial_ends_at !== cur.trial_ends_at)) {
          if (typeof logEvent === "function") logEvent("trial_started", { trial_ends_at: cur.trial_ends_at });
        } else if (prev && typeof logEvent === "function") {
          logEvent("subscription_changed", { from: prev.state, to: cur.state });
        }
        try { localStorage.setItem(key, JSON.stringify(cur)); } catch(e){}
      }
    } catch(e){}
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
<style>
/* device sync (prototype) */
.sync-pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid #c9c2b2;color:#8a8474;vertical-align:middle}
.sync-pill.ok{color:#2e7d4f;border-color:#9fd3b4}
.sync-pill.warn{color:#a07d1c;border-color:#e3c878}
.sync-pill.crit{color:#b3402e;border-color:#e5a496}
#syncBox{margin-top:12px}
</style>
</body>
</html>
