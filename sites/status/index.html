<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build Status</title>
<style>
:root{
  --bg:#0b0e14; --card:#131926; --card2:#0f1520; --line:#232c3f;
  --txt:#e8ecf4; --mut:#8b94a7; --grn:#3ddc84; --red:#ff5d5d; --amb:#ffb020; --blu:#5aa9ff;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
  font-size:16px; line-height:1.45;}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
header{position:sticky;top:0;z-index:5;background:rgba(11,14,20,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:12px 16px;}
h1{font-size:18px;margin:0 0 2px;}
.sub{color:var(--mut);font-size:13px;}
nav{display:flex;gap:8px;margin-top:10px;overflow-x:auto;}
nav button{flex:1;min-width:0;background:var(--card);color:var(--mut);border:1px solid var(--line);
  border-radius:10px;padding:10px 6px;font-size:15px;touch-action:manipulation;cursor:pointer;white-space:nowrap;}
nav button.on{background:#1b2740;color:var(--txt);border-color:#35507e;}
main{padding:14px 16px 80px;max-width:860px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.card h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
.num{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.num .v{font-size:22px;font-weight:700;}
.num .l{font-size:12px;color:var(--mut);margin-top:2px;}
.v.ok{color:var(--grn);} .v.bad{color:var(--red);} .v.warn{color:var(--amb);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.app{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.app .n{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;}
.dot{width:10px;height:10px;border-radius:50%;flex:none;}
.dot.g{background:var(--grn);} .dot.r{background:var(--red);} .dot.a{background:var(--amb);} .dot.u{background:var(--mut);}
.bars{display:flex;gap:2px;margin-top:8px;height:18px;align-items:flex-end;}
.bars i{flex:1;border-radius:2px;min-height:3px;}
.bars i.g{background:#2b7a4d;} .bars i.r{background:var(--red);} .bars i.m{background:#3a4356;}
.app .u{font-size:12px;color:var(--mut);margin-top:6px;}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);}
.row:first-of-type{border-top:none;}
.row .m{flex:1;min-width:0;}
.row .t{font-size:13px;color:var(--mut);}
pre{white-space:pre-wrap;word-break:break-word;font-size:13px;color:var(--mut);margin:6px 0 0;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;max-height:120px;overflow:auto;}
button.act{background:#1b2740;color:var(--txt);border:1px solid #35507e;border-radius:10px;
  padding:9px 14px;font-size:15px;touch-action:manipulation;cursor:pointer;}
button.act:disabled{opacity:.5;}
button.danger{background:#3a1620;border-color:#7e2f3a;}
input[type=search]{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:12px;font-size:16px;margin-bottom:10px;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;
  letter-spacing:.05em;padding:8px 6px;border-bottom:1px solid var(--line);}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
tr.tap{cursor:pointer;}
tr.tap:active{background:#1a2233;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--mut);}
.pill.r{color:var(--red);border-color:#7e2f3a;} .pill.g{color:var(--grn);border-color:#2b7a4d;}
#drawer{position:fixed;inset:0;z-index:20;display:none;}
#drawer.on{display:block;}
#drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);}
#drawer .panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;
  background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px 40px;}
#drawer h2{font-size:17px;margin:0 0 4px;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:10px 0;}
.kv dt{color:var(--mut);} .kv dd{margin:0;}
.sec{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px;font-weight:600;}
#banner{display:none;background:#3a2a10;border:1px solid #7e5f2f;color:var(--amb);
  border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;}
.refresh{font-size:13px;color:var(--mut);text-align:center;margin-top:8px;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--blu);
  border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<header>
  <h1>Build Status</h1>
  <div class="sub">10 apps + sync backend. Prototype monitoring.</div>
  <nav>
    <button data-tab="overview" class="on">Overview</button>
    <button data-tab="users">Users</button>
    <button data-tab="errors">Errors</button>
    <button data-tab="alerts">Alerts</button>
  </nav>
</header>
<main>
  <div id="banner"></div>
  <section id="tab-overview"></section>
  <section id="tab-users" hidden></section>
  <section id="tab-errors" hidden></section>
  <section id="tab-alerts" hidden></section>
  <div class="refresh" id="refresh-note"></div>
</main>
<div id="drawer"><div class="scrim"></div><div class="panel" id="drawer-panel"></div></div>
<script>
"use strict";
const APPS = ["aftermath","curbside","provenance","nextchapter","roadwrench","abate","staylegal","buyback","backfill","fineprint"];
let activeTab = "overview", timer = null, lastOk = 0;

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function ago(t){
  if (!t) return "never";
  const s = Math.max(0, Math.floor((Date.now() - t) / 1000));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
}
function kb(n){ if (n >= 1048576) return (n/1048576).toFixed(1)+" MB"; if (n >= 1024) return (n/1024).toFixed(0)+" KB"; return n+" B"; }

async function api(path, opts){
  const res = await fetch("/status/api/" + path, Object.assign({ cache: "no-store" }, opts || {}));
  const txt = await res.text();
  let data = null;
  try { data = JSON.parse(txt); } catch(e) {}
  if (!res.ok || !data) throw new Error("api " + path + " -> http " + res.status);
  return data;
}
function showBanner(msg){
  const b = document.getElementById("banner");
  b.style.display = msg ? "block" : "none";
  b.textContent = msg || "";
}

/* ---------------- Overview ---------------- */
async function renderOverview(){
  const el = document.getElementById("tab-overview");
  el.innerHTML = '<div class="card"><span class="spin"></span> Loading…</div>';
  try {
    const [m, up, health] = await Promise.all([
      api("metrics"), api("uptime"), api("health").catch(() => null)
    ]);
    lastOk = Date.now(); showBanner("");
    const rpm = m.requests_per_min_est;
    const er = m.error_rate_10min;
    const p95 = m.latency_ms.p95;
    const ob = m.outbox_depth.total || 0;
    const ce = m.unacked_client_errors_1h;
    const erCls = er == null ? "" : er > 5 ? "bad" : er > 1 ? "warn" : "ok";
    const obCls = ob > 500 ? "bad" : ob > 100 ? "warn" : "ok";
    const hOk = health && health.ok;

    let cards = '<div class="card"><h2>Right now</h2><div class="nums">';
    cards += num(rpm, "req/min (est)", "");
    cards += num(er == null ? "n/a" : er + "%", "error rate 10m", erCls);
    cards += num(p95 == null ? "n/a" : p95 + "ms", "latency p95", p95 != null && p95 > 2000 ? "warn" : "");
    cards += num(ob, "outbox depth", obCls);
    cards += num(ce, "unacked errors 1h", ce > 0 ? "warn" : "ok");
    cards += num(hOk == null ? "?" : hOk ? "ok" : "DOWN", "backend", hOk == null ? "" : hOk ? "ok" : "bad");
    cards += "</div>";
    if (health && health.components) {
      cards += '<div class="t" style="margin-top:10px;font-size:13px;color:var(--mut)">D1: ' + esc(health.components.d1) +
        " · R2: " + esc(health.components.r2) + " · outbox: " + esc(health.components.outbox) + "</div>";
    }
    cards += '<div style="margin-top:12px"><button class="act" id="run-checks">Run checks now</button> ' +
      '<button class="act" id="test-alert">Send test alert</button></div></div>';

    cards += '<div class="card"><h2>Apps, last 24h</h2><div class="grid">';
    for (const slug of APPS) {
      const key = "url:" + slug;
      const bars = (up.bars && up.bars[key]) || [];
      const recent = bars.slice(-24);
      const frac = recent.length ? recent.reduce((a,b) => a + b.healthy_frac, 0) / recent.length : null;
      const cls = frac == null ? "u" : frac >= 0.99 ? "g" : frac >= 0.9 ? "a" : "r";
      const label = frac == null ? "no data" : Math.round(frac*100) + "%";
      let barHtml = '<div class="bars">';
      for (const b of recent) {
        const c = b.healthy_frac >= 1 ? "g" : b.healthy_frac <= 0 ? "r" : "m";
        barHtml += '<i class="' + c + '" title="' + new Date(b.hour).toLocaleString() + '"></i>';
      }
      barHtml += "</div>";
      cards += '<div class="app"><div class="n"><span class="dot ' + cls + '"></span>' + esc(slug) + "</div>" +
        barHtml + '<div class="u">' + label + " uptime</div></div>";
    }
    cards += "</div></div>";

    const alerts = m.recent_alerts || [];
    cards += '<div class="card"><h2>Recent alerts</h2>';
    if (!alerts.length) cards += '<div class="t" style="color:var(--mut);font-size:14px">None. Quiet is good.</div>';
    for (const a of alerts) {
      const sevCls = a.severity === "page" ? "r" : a.severity === "recovered" ? "g" : "";
      cards += '<div class="row"><div class="m"><span class="pill ' + sevCls + '">' + esc(a.severity) + '</span> ' +
        esc(a.check_key) + '<div class="t">' + esc(a.message).slice(0, 160) + "</div></div>" +
        '<div class="t">' + ago(a.created_at) + "</div></div>";
    }
    cards += "</div>";
    el.innerHTML = cards;
    document.getElementById("run-checks").addEventListener("click", async (e) => {
      e.target.disabled = true; e.target.innerHTML = '<span class="spin"></span> Running…';
      try {
        const r = await api("selfcheck", { method: "POST", headers: {"content-type":"application/json"}, body: "{}" });
        const bad = (r.summary.checks || []).filter(c => c.status !== "ok");
        showBanner(bad.length ? bad.length + " check(s) failing: " + bad.map(c => c.key).join(", ") : "All checks passed.");
      } catch(err) { showBanner("Self-check failed: " + err.message); }
      renderOverview();
    });
    document.getElementById("test-alert").addEventListener("click", async (e) => {
      e.target.disabled = true; e.target.textContent = "Sending…";
      try {
        const r = await api("test-alert", { method: "POST" });
        showBanner(r.ntfy && r.ntfy.ok ? "Test alert sent. Check your phone." : "Test alert failed to post: " + JSON.stringify(r.ntfy).slice(0, 120));
      } catch(err) { showBanner("Test alert failed: " + err.message); }
      e.target.disabled = false; e.target.textContent = "Send test alert";
      renderOverview();
    });
  } catch(e) {
    el.innerHTML = '<div class="card">Failed to load: ' + esc(e.message) + '. The Access session may have expired; reload the page.</div>';
    showBanner("Cannot reach the status API. If you just logged in via Cloudflare Access, reload this page.");
  }
  function num(v, l, cls){ return '<div class="num"><div class="v ' + cls + '">' + esc(v) + '</div><div class="l">' + esc(l) + "</div></div>"; }
}

/* ---------------- Users ---------------- */
async function renderUsers(){
  const el = document.getElementById("tab-users");
  el.innerHTML = '<div class="card"><h2>Devices</h2>' +
    '<input type="search" id="user-search" placeholder="Search by device id prefix…" autocomplete="off">' +
    '<div id="user-list"><span class="spin"></span> Loading…</div>' +
    '<div class="t" style="font-size:13px;color:var(--mut);margin-top:8px">Device ids are pseudonymous: the first 16 chars of the device key. No real-world identity exists in this system.</div></div>';
  const input = document.getElementById("user-search");
  let deb = null;
  input.addEventListener("input", () => { clearTimeout(deb); deb = setTimeout(loadUsers, 400); });
  await loadUsers();
  async function loadUsers(){
    const list = document.getElementById("user-list");
    try {
      const q = input.value.trim().toLowerCase().replace(/[^0-9a-f]/g,"").slice(0,32);
      const d = await api("users" + (q ? "?search=" + encodeURIComponent(q) : "?limit=50"));
      lastOk = Date.now(); showBanner("");
      if (!d.users.length) { list.innerHTML = '<div style="color:var(--mut)">No devices found.</div>'; return; }
      let h = '<table><thead><tr><th>Device</th><th>App</th><th>Last seen</th><th>Sync</th><th>Err</th><th>Files</th></tr></thead><tbody>';
      for (const u of d.users) {
        const errPill = u.unacked_errors > 0 ? ' <span class="pill r">' + u.unacked_errors + "</span>" : "";
        h += '<tr class="tap" data-id="' + esc(u.device_id) + '"><td class="mono">' + esc(u.device_id) + "</td>" +
          "<td>" + esc(u.app_slug) + "</td><td>" + ago(u.last_seen) + "</td>" +
          "<td>" + u.pushes + "/" + u.pulls + "</td>" +
          "<td>" + u.errors + errPill + "</td>" +
          "<td>" + kb(u.blob_bytes) + "</td></tr>";
      }
      list.innerHTML = h + "</tbody></table>";
      list.querySelectorAll("tr.tap").forEach(tr =>
        tr.addEventListener("click", () => openDrawer(tr.getAttribute("data-id"))));
    } catch(e) { list.innerHTML = '<div style="color:var(--red)">Failed: ' + esc(e.message) + "</div>"; }
  }
}

async function openDrawer(prefix){
  const drawer = document.getElementById("drawer"), panel = document.getElementById("drawer-panel");
  drawer.classList.add("on");
  panel.innerHTML = '<h2 class="mono">' + esc(prefix) + '</h2><div class="t" style="color:var(--mut);font-size:14px"><span class="spin"></span> Loading…</div>';
  try {
    const d = await api("users/" + encodeURIComponent(prefix));
    let h = '<h2 class="mono">' + esc(d.device.device_id) + '</h2>' +
      '<div class="t" style="color:var(--mut);font-size:14px">' + esc(d.device.app_slug) +
      " · first seen " + ago(d.device.first_seen) + " · last seen " + ago(d.device.last_seen) + "</div>";
    h += '<div class="sec">Recent requests</div>';
    h += d.recent_requests.length ? '<table><tbody>' + d.recent_requests.map(r =>
      "<tr><td class='mono'>" + esc(r.route) + "</td><td>" + r.status + "</td><td>" + r.latency_ms + "ms</td><td class='t'>" + ago(r.created_at) + "</td></tr>").join("") + "</tbody></table>"
      : '<div class="t" style="color:var(--mut)">None in the sampled log.</div>';
    h += '<div class="sec">Recent errors</div>';
    h += d.recent_errors.length ? d.recent_errors.map(e =>
      '<div class="row"><div class="m"><span class="pill' + (e.acked ? "" : " r") + '">' + (e.acked ? "acked" : "open") + "</span> " +
      esc(e.message).slice(0,180) + '<div class="t">' + esc(e.page_url || "") + " · " + ago(e.created_at) + "</div></div></div>").join("")
      : '<div class="t" style="color:var(--mut)">None.</div>';
    h += '<div class="sec">Recent notifications</div>';
    h += d.recent_notifications.length ? '<table><tbody>' + d.recent_notifications.map(n =>
      "<tr><td class='mono'>" + esc(n.template_key) + "</td><td>" + esc(n.to_phone) + "</td><td>" + esc(n.status) + "</td><td class='t'>" + ago(n.created_at) + "</td></tr>").join("") + "</tbody></table>"
      : '<div class="t" style="color:var(--mut)">None.</div>';
    h += '<div class="sec">Storage objects</div>';
    h += d.storage_objects.length ? '<table><tbody>' + d.storage_objects.map(b =>
      "<tr><td class='mono'>" + esc(b.id) + "</td><td>" + esc(b.content_type) + "</td><td>" + kb(b.size_bytes) + "</td><td class='t'>" + ago(b.created_at) + "</td></tr>").join("") + "</tbody></table>"
      : '<div class="t" style="color:var(--mut)">None.</div>';
    h += '<div style="margin-top:20px"><button class="act" id="drawer-close">Close</button></div>';
    panel.innerHTML = h;
    document.getElementById("drawer-close").addEventListener("click", closeDrawer);
  } catch(e) {
    panel.innerHTML = '<h2>Error</h2><div>' + esc(e.message) + '</div><div style="margin-top:20px"><button class="act" id="drawer-close">Close</button></div>';
    document.getElementById("drawer-close").addEventListener("click", closeDrawer);
  }
}
function closeDrawer(){ document.getElementById("drawer").classList.remove("on"); }
document.querySelector("#drawer .scrim").addEventListener("click", closeDrawer);

/* ---------------- Errors ---------------- */
async function renderErrors(){
  const el = document.getElementById("tab-errors");
  el.innerHTML = '<div class="card"><h2>Client errors</h2><div id="err-list"><span class="spin"></span> Loading…</div></div>';
  const list = document.getElementById("err-list");
  try {
    const d = await api("client-errors?limit=50");
    lastOk = Date.now(); showBanner("");
    if (!d.errors.length) { list.innerHTML = '<div style="color:var(--mut)">No errors reported. Quiet is good.</div>'; return; }
    list.innerHTML = d.errors.map(e =>
      '<div class="row" data-id="' + e.id + '"><div class="m">' +
      '<span class="pill' + (e.acked ? "" : " r") + '">' + (e.acked ? "acked" : "open") + "</span> " +
      "<b>" + esc(e.app_slug) + "</b> " + esc(e.message).slice(0,200) +
      (e.stack ? "<pre>" + esc(e.stack).slice(0,600) + "</pre>" : "") +
      '<div class="t">' + esc(e.page_url || "") + " · " + esc(e.user_agent || "").slice(0,60) + " · " + ago(e.created_at) + "</div></div>" +
      (e.acked ? "" : '<div><button class="act" data-ack="' + e.id + '">Ack</button></div>') + "</div>").join("");
    list.querySelectorAll("[data-ack]").forEach(b => b.addEventListener("click", async () => {
      b.disabled = true;
      await api("ack", { method: "POST", headers: {"content-type":"application/json"},
        body: JSON.stringify({ type: "error", id: +b.getAttribute("data-ack") }) }).catch(()=>{});
      renderErrors();
    }));
  } catch(e) { list.innerHTML = '<div style="color:var(--red)">Failed: ' + esc(e.message) + "</div>"; }
}

/* ---------------- Alerts ---------------- */
async function renderAlerts(){
  const el = document.getElementById("tab-alerts");
  el.innerHTML = '<div class="card"><h2>Alert history</h2><div id="alert-list"><span class="spin"></span> Loading…</div></div>';
  const list = document.getElementById("alert-list");
  try {
    const d = await api("alerts?limit=50");
    lastOk = Date.now(); showBanner("");
    if (!d.alerts.length) { list.innerHTML = '<div style="color:var(--mut)">No alerts yet.</div>'; return; }
    list.innerHTML = d.alerts.map(a => {
      const sevCls = a.severity === "page" ? "r" : a.severity === "recovered" ? "g" : "";
      return '<div class="row"><div class="m"><span class="pill ' + sevCls + '">' + esc(a.severity) + "</span> " +
        "<b>" + esc(a.check_key) + "</b>" + '<div class="t">' + esc(a.message).slice(0,200) + " · " + ago(a.created_at) + "</div></div>" +
        (a.acked ? "" : '<div><button class="act" data-ack="' + a.id + '">Ack</button></div>') + "</div>";
    }).join("");
    list.querySelectorAll("[data-ack]").forEach(b => b.addEventListener("click", async () => {
      b.disabled = true;
      await api("ack", { method: "POST", headers: {"content-type":"application/json"},
        body: JSON.stringify({ type: "alert", id: +b.getAttribute("data-ack") }) }).catch(()=>{});
      renderAlerts();
    }));
  } catch(e) { list.innerHTML = '<div style="color:var(--red)">Failed: ' + esc(e.message) + "</div>"; }
}

/* ---------------- Tabs + polling ---------------- */
const RENDER = { overview: renderOverview, users: renderUsers, errors: renderErrors, alerts: renderAlerts };
function switchTab(name){
  activeTab = name;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  for (const t of Object.keys(RENDER)) document.getElementById("tab-" + t).hidden = t !== name;
  RENDER[name]();
}
document.querySelectorAll("nav button").forEach(b =>
  b.addEventListener("click", () => switchTab(b.dataset.tab)));
function tick(){
  const n = document.getElementById("refresh-note");
  n.textContent = lastOk ? "Last updated " + ago(lastOk) + " · refreshes every 30s" : "";
  RENDER[activeTab]();
}
switchTab("overview");
timer = setInterval(tick, 30000);
</script>
</script>
</body>
</html>
