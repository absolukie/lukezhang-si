li .n{color:var(--dim);font-size:12px;min-width:34px;padding-top:2px;font-variant-numeric:tabular-nums}

</style>

const KEY = "todo1000-done-v1";
let done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let secFilter = "all", query = "";
const main = document.getElementById("main");
const chipsEl = document.getElementById("chips");

function buildChips(){
  const all = [["all","All"]].concat(DATA.map((s,i)=>[i,s.title]));
  chipsEl.innerHTML = "";
  all.forEach(([v,label])=>{
    const b = document.createElement("button");
    b.className = "chip" + (String(secFilter)===String(v)?" on":"");
    b.textContent = label;
    b.onclick = ()=>{secFilter=v;buildChips();render();};
    chipsEl.appendChild(b);
  });
}
function match(t){
  return t.toLowerCase().includes(query);
}
function render(){
  main.innerHTML = "";
  let shown = 0;
  DATA.forEach((sec,si)=>{
    if(secFilter!=="all" && si!==secFilter) return;
    const items = sec.items.filter(it=>!query || match(it.t));
    if(!items.length) return;
    shown++;
    const det = document.createElement("details");
    det.className = "sec"; det.open = true;
    const sum = document.createElement("summary");
    const dcount = items.filter(it=>done.has(it.n)).length;
    sum.innerHTML = "";
    const t1 = document.createElement("span"); t1.textContent = sec.title;
    const t2 = document.createElement("span"); t2.className="cnt"; t2.textContent = dcount+" / "+items.length+" done";
    sum.appendChild(t1); sum.appendChild(t2);
    det.appendChild(sum);
    const ul = document.createElement("ul");
    items.forEach(it=>{
      const li = document.createElement("li");
      if(done.has(it.n)) li.className="done";
      const cb = document.createElement("input");
      cb.type="checkbox"; cb.checked=done.has(it.n);
      cb.onchange=()=>{cb.checked?done.add(it.n):done.delete(it.n);save();li.classList.toggle("done",cb.checked);progress();};
      const nn = document.createElement("span"); nn.className="n"; nn.textContent="#"+it.n;
      const tx = document.createElement("span"); tx.textContent=it.t;
      li.appendChild(cb); li.appendChild(nn); li.appendChild(tx);
      ul.appendChild(li);
    });
    det.appendChild(ul);
    main.appendChild(det);
  });
  if(!shown){const d=document.createElement("div");d.className="empty";d.textContent="No matches — try another search.";main.appendChild(d);}
  progress();
}
function progress(){
  const pct = Math.round(done.size/1000*100);
  document.getElementById("fill").style.width = pct+"%";
  document.getElementById("prog").textContent = done.size+" / 1000 done ("+pct+"%)";
  document.querySelectorAll("summary .cnt").forEach(()=>{});
}
function save(){localStorage.setItem(KEY, JSON.stringify([...done]));}
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render();});
document.getElementById("surprise").onclick=()=>{
  const pool=[];
  DATA.forEach(sec=>sec.items.forEach(it=>{if(!done.has(it.n))pool.push(it);}));
  if(!pool.length){alert("All 1000 done. Touch grass.");return;}
  const pick=pool[Math.floor(Math.random()*pool.length)];
  query="";document.getElementById("q").value="";secFilter="all";buildChips();render();
  const el=[...document.querySelectorAll("li")].find(li=>li.querySelector(".n").textContent==="#"+pick.n);
  if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.style.background="#243044";setTimeout(()=>el.style.background="",1600);}
};
buildChips();render();
</script>
