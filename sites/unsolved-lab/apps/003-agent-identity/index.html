<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Identity</title>
<link rel="stylesheet" href="../../shared/kit.css">
<style>
:root{
  --bg:#071210; --panel:#0c1a17; --panel2:#10231e; --ink:#eaf6f1; --muted:#8fa89e;
  --line:#1d332c; --accent:#2dd4a8; --accent2:#7cc4ff; --good:#2dd4a8; --warn:#ffb224; --bad:#ff5d5d;
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Inter,Roboto,sans-serif;margin:0}
.k-nav{background:#081310;border-bottom:1px solid var(--line)}
.k-nav-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.k-nav-title{font-weight:800;font-size:19px}.k-nav-title .dot{color:var(--accent)}
.k-nav-sub{color:var(--muted);font-size:12.5px}
.k-btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13.5px}
.k-btn:hover{border-color:var(--accent)}
.k-btn.k-primary{background:var(--accent);border-color:var(--accent);color:#04110c;font-weight:700}
.k-btn.k-danger{background:#2a1416;border-color:var(--bad);color:#ffb3b3}
.k-wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.k-hero{border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:18px;background:radial-gradient(600px 200px at 20% 0%,#0e2a22,#0a1512)}
.k-hero h1{margin:0 0 6px;font-size:26px}
.k-hero p{margin:0;color:var(--muted);max-width:640px}
.k-grid{display:grid;gap:14px}
.k-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.k-card h3{margin:0 0 8px;font-size:15px}
.k-muted{color:var(--muted)}
.cols{display:grid;grid-template-columns:.95fr 1.05fr;gap:14px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.k-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid var(--line)}
.k-badge.ok{background:#0a2a1e;color:var(--good);border-color:#1d5c40}
.k-badge.bad{background:#2c1415;color:var(--bad);border-color:#5c2226}
.k-badge.warn{background:#2c2210;color:var(--warn);border-color:#5a4517}
.k-badge.info{background:#12263a;color:#7cc4ff;border-color:#274a6b}
label.fl{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.k-input,.k-select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 12px;font-size:14px}
.scopes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.scope{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:12px;cursor:pointer}
.scope input{accent-color:var(--accent)}
.tokenbox{font-family:var(--mono);font-size:13px;background:#050d0b;border:1px dashed var(--accent);border-radius:8px;padding:12px;word-break:break-all;margin:10px 0}
.use{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
.use .t{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;width:64px;padding-top:2px}
.use.fresh{animation:drillin 1s ease-out}
@keyframes drillin{0%{background:#3a1013;transform:translateX(8px)}100%{background:transparent;transform:none}}
.feed{max-height:300px;overflow:auto}
.expbar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:8px 0}
.expbar i{display:block;height:100%;background:var(--accent)}
pre.json{background:#050d0b;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12px;overflow:auto;white-space:pre-wrap}
.k-toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
.k-toast{background:#10231e;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px}
.k-toast.out{opacity:0;transition:opacity .3s}
.k-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100}
.k-modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:560px;width:92%}
.k-modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.k-modal-t{font-weight:700}.k-modal-b{padding:16px 18px}.k-modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.k-empty{padding:24px;text-align:center;color:var(--muted)}

</style>
</head>
<body>
<script src="../../shared/kit.js"></script>
<script>
/* Kit fallback: implements the shared kit.js contract when ../../shared/kit.js is unavailable. */
(function(){
if(window.Kit && window.Kit.rng && window.Kit.toast && window.Kit.modal) return;
const K={};
K.rng=function(seed){seed=String(seed==null?'':seed);let h=2166136261;for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619);}return function(){h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);h^=h>>>16;return(h>>>0)/4294967296;};}
K.pick=function(f,a){return a[Math.floor(f()*a.length)];};
K.int=function(f,a,b){return a+Math.floor(f()*(b-a+1));};
K.shuffle=function(f,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
K.uid=function(p){return (p||'id')+'_'+Math.random().toString(36).slice(2,9);};
K.esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
K.el=function(html){const t=document.createElement('template');t.innerHTML=String(html).trim();return t.content.firstElementChild;};
K.store=function(ns){try{return{get:function(k,d){const v=localStorage.getItem(ns+':'+k);return v==null?d:JSON.parse(v);},set:function(k,v){localStorage.setItem(ns+':'+k,JSON.stringify(v));},del:function(k){localStorage.removeItem(ns+':'+k);}};}catch(e){const m={};return{get:function(k,d){return(k in m)?m[k]:d;},set:function(k,v){m[k]=v;},del:function(k){delete m[k];}};}};
K.nav=function(o){o=o||{};const h=K.el('<header class="k-nav"><div class="k-nav-in"><div><div class="k-nav-title">'+K.esc(o.title||'')+'</div>'+(o.sub?'<div class="k-nav-sub">'+K.esc(o.sub)+'</div>':'')+'</div><div class="k-nav-actions"></div></div></header>');const box=h.querySelector('.k-nav-actions');(o.actions||[]).forEach(function(a){const b=document.createElement('button');b.className='k-btn '+(a.kind||'');b.textContent=a.label;if(a.onclick)b.addEventListener('click',a.onclick);box.appendChild(b);});document.body.insertBefore(h,document.body.firstChild);return h;};
function toastHost(){let h=document.querySelector('.k-toasts');if(!h){h=document.createElement('div');h.className='k-toasts';document.body.appendChild(h);}return h;}
K.toast=function(msg,kind){const t=K.el('<div class="k-toast '+(kind||'')+'">'+K.esc(msg)+'</div>');toastHost().appendChild(t);setTimeout(function(){t.classList.add('out');setTimeout(function(){t.remove();},300);},3200);return t;};
K.modal=function(o){o=o||{};const ov=K.el('<div class="k-overlay"><div class="k-modal"><div class="k-modal-h"><div class="k-modal-t">'+K.esc(o.title||'')+'</div><button class="k-btn k-x" aria-label="close">✕</button></div><div class="k-modal-b"></div><div class="k-modal-f"></div></div></div>');const b=ov.querySelector('.k-modal-b');if(typeof o.body==='string')b.innerHTML=o.body;else if(o.body)b.appendChild(o.body);const f=ov.querySelector('.k-modal-f');function close(){ov.remove();document.removeEventListener('keydown',onKey);}function onKey(e){if(e.key==='Escape')close();}document.addEventListener('keydown',onKey);ov.querySelector('.k-x').addEventListener('click',close);ov.addEventListener('mousedown',function(e){if(e.target===ov)close();});(o.actions||[]).forEach(function(a){const btn=document.createElement('button');btn.className='k-btn '+(a.kind||'');btn.textContent=a.label;btn.addEventListener('click',function(){if(a.onclick)a.onclick(close);else close();});f.appendChild(btn);});if(!(o.actions||[]).length)f.style.display='none';document.body.appendChild(ov);return close;};
K.tabs=function(host,tabs){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';const bar=K.el('<div class="k-tabs"></div>');const pane=K.el('<div class="k-tabpane"></div>');host.appendChild(bar);host.appendChild(pane);let active=null;function sel(t){active=t.id;Array.prototype.forEach.call(bar.children,function(x){x.classList.toggle('on',x.dataset.id===t.id);});pane.innerHTML='';t.render(pane);}tabs.forEach(function(t){const b=document.createElement('button');b.className='k-tab';b.dataset.id=t.id;b.textContent=t.label;b.addEventListener('click',function(){sel(t);});bar.appendChild(b);});if(tabs.length)sel(tabs[0]);return{select:function(id){const t=tabs.find(function(x){return x.id===id;});if(t)sel(t);},active:function(){return active;}};};
K.table=function(host,cols,rows,opt){opt=opt||{};host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';let q='',page=0;const ps=opt.pageSize||8;const wrap=K.el('<div class="k-tablew"></div>');if(opt.search){const s=K.el('<input class="k-input k-tsearch" placeholder="Search…">');s.addEventListener('input',function(){q=s.value.toLowerCase();page=0;draw();});wrap.appendChild(s);}const tw=K.el('<div></div>');const pg=K.el('<div class="k-pager"></div>');wrap.appendChild(tw);wrap.appendChild(pg);host.appendChild(wrap);function filtered(){if(!q)return rows;return rows.filter(function(r){return cols.some(function(c){const v=r[c.key];return v!=null&&String(v).toLowerCase().indexOf(q)>-1;});});}function fmt(c,v,r){if(c.fmt)return c.fmt(v,r);if(v==null)return'';return String(v);}function draw(){const fr=filtered();const pages=Math.max(1,Math.ceil(fr.length/ps));page=Math.min(page,pages-1);const slice=fr.slice(page*ps,page*ps+ps);let h='<table class="k-table"><thead><tr>';cols.forEach(function(c){h+='<th class="'+(c.num?'num':'')+'">'+K.esc(c.label)+'</th>';});h+='</tr></thead><tbody>';if(!slice.length)h+='<tr><td colspan="'+cols.length+'" class="k-muted">No rows.</td></tr>';slice.forEach(function(r){h+='<tr>';cols.forEach(function(c){h+='<td class="'+(c.num?'num':'')+'">'+fmt(c,r[c.key],r)+'</td>';});h+='</tr>';});h+='</tbody></table>';tw.innerHTML=h;pg.innerHTML='';if(pages>1){for(let i=0;i<pages;i++){const b=document.createElement('button');b.className='k-btn k-pg'+(i===page?' on':'');b.textContent=String(i+1);(function(i){b.addEventListener('click',function(){page=i;draw();});})(i);pg.appendChild(b);}}}draw();return{redraw:draw};};
K.bars=function(host,items){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';const mx=Math.max.apply(null,items.map(function(i){return i.value;}).concat([1]));items.forEach(function(i){const r=K.el('<div class="k-bar-r"><div class="k-bar-l">'+K.esc(i.label)+'</div><div class="k-bar-t"><div class="k-bar-f" style="width:'+(100*i.value/mx).toFixed(1)+'%;'+(i.color?'background:'+i.color:'')+'"></div></div><div class="k-bar-v">'+K.esc(String(i.display!=null?i.display:i.value))+'</div></div>');host.appendChild(r);});};
K.line=function(host,series){host=typeof host==='string'?document.querySelector(host):host;const W=560,H=200,P=28;host.innerHTML='';const all=[];series.forEach(function(s){s.points.forEach(function(p){all.push(p);});});const mn=Math.min.apply(null,all.concat([0])),mx=Math.max.apply(null,all.concat([1]));const X=function(i,n){return P+i*(W-2*P)/Math.max(1,n-1);},Y=function(v){return H-P-(v-mn)*(H-2*P)/Math.max(1e-9,mx-mn);};let s='<svg viewBox="0 0 '+W+' '+H+'" class="k-svg">';const steps=4;for(let g=0;g<=steps;g++){const y=P+g*(H-2*P)/steps;s+='<line x1="'+P+'" y1="'+y+'" x2="'+(W-P)+'" y2="'+y+'" class="k-grid-ln"/>';}series.forEach(function(sr){const n=sr.points.length;let d='';sr.points.forEach(function(p,i){d+=(i?'L':'M')+X(i,n).toFixed(1)+','+Y(p).toFixed(1)+' ';});s+='<path d="'+d+'" fill="none" stroke="'+(sr.color||'#888')+'" stroke-width="2"/>';sr.points.forEach(function(p,i){s+='<circle cx="'+X(i,n).toFixed(1)+'" cy="'+Y(p).toFixed(1)+'" r="3" fill="'+(sr.color||'#888')+'"><title>'+K.esc(sr.name+': '+p)+'</title></circle>';});});s+='</svg><div class="k-legend">'+series.map(function(sr){return '<span class="k-leg"><i style="background:'+(sr.color||'#888')+'"></i>'+K.esc(sr.name)+'</span>';}).join('')+'</div>';host.innerHTML=s;};
K.donut=function(host,items){host=typeof host==='string'?document.querySelector(host):host;const R=70,C=2*Math.PI*R;const tot=items.reduce(function(a,i){return a+i.value;},0)||1;let off=0;let arcs='';items.forEach(function(i,ix){const frac=i.value/tot;arcs+='<circle r="'+R+'" cx="90" cy="90" fill="none" stroke="'+(i.color||['#5b8def','#34c77b','#f0a44b','#e05d5d','#9a6ff0'][ix%5])+'" stroke-width="26" stroke-dasharray="'+(frac*C).toFixed(2)+' '+C.toFixed(2)+'" stroke-dashoffset="'+(-off*C).toFixed(2)+'" transform="rotate(-90 90 90)"><title>'+K.esc(i.label+': '+i.value)+'</title></circle>';off+=frac;});host.innerHTML='<div class="k-donutw"><svg viewBox="0 0 180 180" class="k-svg">'+arcs+'<text x="90" y="96" text-anchor="middle" class="k-donut-t">'+K.esc(String(tot))+'</text></svg><div class="k-legend">'+items.map(function(i,ix){return '<span class="k-leg"><i style="background:'+(i.color||['#5b8def','#34c77b','#f0a44b','#e05d5d','#9a6ff0'][ix%5])+'"></i>'+K.esc(i.label)+'</span>';}).join('')+'</div></div>';};
K.timeline=function(host,events){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';const w=K.el('<div class="k-tl"></div>');events.forEach(function(e){const it=K.el('<div class="k-tl-it '+(e.kind||'')+'"><div class="k-tl-dot"></div><div class="k-tl-c"><div class="k-tl-h"><span class="k-tl-t">'+K.esc(e.t||'')+'</span><span class="k-tl-title">'+K.esc(e.title||'')+'</span></div>'+(e.body?'<div class="k-tl-b">'+e.body+'</div>':'')+'</div></div>');if(e.onclick)it.style.cursor='pointer',it.addEventListener('click',function(){e.onclick(e);});w.appendChild(it);});host.appendChild(w);};
K.graph=function(host,g){host=typeof host==='string'?document.querySelector(host):host;const W=600,H=340;host.innerHTML='';const n=g.nodes.length;const pos={};g.nodes.forEach(function(nd,i){const a=2*Math.PI*i/Math.max(1,n)-Math.PI/2;pos[nd.id]={x:W/2+Math.cos(a)*(W/2-90),y:H/2+Math.sin(a)*(H/2-70)};});let s='<svg viewBox="0 0 '+W+' '+H+'" class="k-svg">';(g.edges||[]).forEach(function(e){const a=pos[e.a],b=pos[e.b];if(!a||!b)return;const mx=(a.x+b.x)/2,my=(a.y+b.y)/2-24;s+='<path d="M'+a.x+','+a.y+' Q'+mx+','+my+' '+b.x+','+b.y+'" class="k-edge"/>';if(e.label)s+='<text x="'+mx+'" y="'+(my-4)+'" text-anchor="middle" class="k-edge-l">'+K.esc(e.label)+'</text>';});g.nodes.forEach(function(nd){const p=pos[nd.id];s+='<g><circle cx="'+p.x+'" cy="'+p.y+'" r="30" fill="'+(nd.color||'#2c3a4a')+'" stroke="#888" stroke-width="1"/><text x="'+p.x+'" y="'+(p.y+4)+'" text-anchor="middle" class="k-node-l">'+K.esc(nd.label)+'</text>'+(nd.sub?'<text x="'+p.x+'" y="'+(p.y+48)+'" text-anchor="middle" class="k-node-s">'+K.esc(nd.sub)+'</text>':'')+'</g>';});s+='</svg>';host.innerHTML=s;};
K.badge=function(txt,kind){return '<span class="k-badge '+(kind||'')+'">'+K.esc(txt)+'</span>';};
K.kpi=function(host,o){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';const e=K.el('<div class="k-kpi"><div class="k-kpi-v">'+K.esc(String(o.value))+'</div><div class="k-kpi-l">'+K.esc(o.label)+'</div>'+(o.delta?'<div class="k-kpi-d">'+K.esc(o.delta)+'</div>':'')+'</div>');host.appendChild(e);return e;};
K.empty=function(host,title,sub,al,af){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';const e=K.el('<div class="k-empty"><div class="k-empty-t">'+K.esc(title)+'</div>'+(sub?'<div class="k-muted">'+K.esc(sub)+'</div>':'')+'</div>');if(al){const b=document.createElement('button');b.className='k-btn k-primary';b.textContent=al;b.addEventListener('click',function(){if(af)af();});e.appendChild(b);}host.appendChild(e);return e;};
K.money=function(n){return '$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0});};
K.num=function(n){return Number(n).toLocaleString('en-US');};
K.pct=function(x){return (Number(x)*100).toFixed(1)+'%';};
K.when=function(d){const t=d instanceof Date?d:new Date(d);return t.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});};
K.initials=function(name){return String(name||'').split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();};
K.copy=function(txt){function done(){K.toast('Copied to clipboard','ok');}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(String(txt)).then(done,function(){K.toast('Copy failed','bad');});}else{const ta=document.createElement('textarea');ta.value=String(txt);document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){K.toast('Copy failed','bad');}ta.remove();}};
window.Kit=K;
})();

</script>
<script>
/* Scopekey — Agent Identity. Delegated, scoped, expiring credentials for agents. */
(function(){
"use strict";
const K = window.Kit;
const R = K.rng("scopekey-v1");
function navBtn(label,fn){const box=document.querySelector('.k-nav-actions');if(!box||typeof fn!=='function')return;const b=document.createElement('button');b.className='k-btn';b.type='button';b.textContent=label;b.addEventListener('click',fn);box.appendChild(b);}

const store = K.store("scopekey");

const SCOPES=[
 {id:"repo.read",label:"repo.read",desc:"Read code & issues",risk:"low"},
 {id:"repo.write",label:"repo.write",desc:"Push branches, open PRs",risk:"medium"},
 {id:"repo.admin",label:"repo.admin",desc:"Change settings, merge to main",risk:"high"},
 {id:"ci.trigger",label:"ci.trigger",desc:"Run CI pipelines",risk:"low"},
 {id:"deploy.staging",label:"deploy.staging",desc:"Deploy to staging",risk:"medium"},
 {id:"deploy.prod",label:"deploy.prod",desc:"Deploy to production",risk:"critical"},
 {id:"secrets.read",label:"secrets.read",desc:"Read secret values",risk:"critical"},
 {id:"billing.read",label:"billing.read",desc:"Read invoices & usage",risk:"low"},
];
function tokenFor(name){const a="abcdefghijklmnopqrstuvwxyz0123456789";let s="sk_agent_";const r=K.rng(name+Date.now()%9973);for(let i=0;i<24;i++)s+=a[Math.floor(r()*a.length)];return s;}
function scopeAllowed(cred,scope){
  // credential grants listed scopes, optionally bound to a repo
  if(cred.scopes.indexOf(scope)<0)return{ok:false,why:"scope '"+scope+"' not granted"};
  return{ok:true};
}

K.nav({title:"Scopekey — Agent Identity",
  sub:"Delegated identities with least-privilege scopes and short expiries"});
navBtn("How it works",howItWorks);

const wrap=K.el('<div class="k-wrap"></div>');document.body.appendChild(wrap);
wrap.innerHTML=
 '<div class="k-hero"><div><h1>Agents get keys, not your keys.</h1>'+
 '<p>Issue a credential scoped to exactly what an agent needs — one repo, read-only, expiring in hours. Every use is logged; anything outside the scope is denied and recorded.</p>'+
 '<div style="margin-top:12px"><button class="k-btn k-danger" id="attackDrill" data-core>▶ Watch the attack drill</button></div></div>'+
 '<div class="k-grid" style="grid-template-columns:repeat(3,1fr);min-width:280px" id="kpis"></div></div>'+
 '<div class="cols"><div class="k-card"><h3>Issue a credential</h3>'+
 '<label class="fl">Agent name</label><input class="k-input" id="fName" value="ci-helper" maxlength="40">'+
 '<label class="fl">Repository binding</label><input class="k-input" id="fRepo" value="acme/web" maxlength="60">'+
 '<label class="fl">Scopes</label><div class="scopes" id="fScopes"></div>'+
 '<label class="fl">Expires in</label><select class="k-select" id="fExp"><option value="3600">1 hour</option><option value="28800" selected>8 hours</option><option value="86400">24 hours</option><option value="604800">7 days</option></select>'+
 '<div style="margin-top:14px;display:flex;gap:8px"><button class="k-btn k-primary" id="issue">Issue credential</button></div>'+
 '<div id="issued"></div></div>'+
 '<div class="k-card"><h3>Active credentials</h3><div id="creds"></div></div></div>'+
 '<div class="k-card" style="margin-top:14px"><h3>Usage log — allowed vs denied</h3><div class="k-muted" style="font-size:12.5px;margin-bottom:8px">Watch the demo credential try to touch production.</div><div class="feed" id="uselog"></div></div>';

const scopeHost=document.getElementById("fScopes");
SCOPES.forEach(s=>{
  const l=K.el('<label class="scope"><input type="checkbox" value="'+s.id+'"'+(s.id==="repo.read"||s.id==="ci.trigger"?" checked":"")+'><span>'+s.label+'<br><span style="color:var(--muted);font-family:inherit">'+K.esc(s.desc)+'</span></span></label>');
  scopeHost.appendChild(l);
});

let creds=store.get("creds",null);
if(!creds){
  // ---- DEMO credential, preloaded ----
  creds=[{
    id:"cred_demo1", name:"deploy-bot", repo:"acme/web", scopes:["repo.read","ci.trigger"],
    token:"sk_agent_demo9f2k7qxa41mz8h3d0pt6", issued:"2026-10-03 22:41",
    expiresAt:Date.now()+6.4*3600*1000, revoked:false, demo:true,
    uses:[
      {t:"22:41:03",scope:"repo.read",target:"acme/web · PR #412 diff",ok:true},
      {t:"22:44:19",scope:"repo.read",target:"acme/web · main branch",ok:true},
      {t:"22:47:55",scope:"ci.trigger",target:"pipeline #8812 (staging)",ok:true},
      {t:"22:52:10",scope:"deploy.prod",target:"acme/web → production",ok:false,why:"scope 'deploy.prod' not granted"},
      {t:"22:52:11",scope:"secrets.read",target:"STRIPE_LIVE_KEY",ok:false,why:"scope 'secrets.read' not granted"},
    ]
  }];
  store.set("creds",creds);
}
let selected=creds[0].id;

function riskBadge(r){return r==="critical"?K.badge("CRITICAL","bad"):r==="high"?K.badge("HIGH","warn"):r==="medium"?K.badge("MED","info"):K.badge("LOW","ok");}
function renderKPIs(){
  const h=document.getElementById("kpis");h.innerHTML="";
  const active=creds.filter(c=>!c.revoked).length;
  const denied=creds.reduce((a,c)=>a+c.uses.filter(u=>!u.ok).length,0);
  [["Active credentials",active],["Denied attempts",denied],["Default expiry","8h"]].forEach(p=>{
    const d=document.createElement("div");h.appendChild(d);K.kpi(d,{label:p[0],value:p[1]});
  });
}
function renderCreds(){
  const host=document.getElementById("creds");host.innerHTML="";
  creds.forEach(c=>{
    const left=Math.max(0,c.expiresAt-Date.now());
    const hrs=(left/3600000);
    const pctLeft=Math.min(100,100*left/(8*3600*1000));
    const card=K.el('<div class="k-card" style="margin-bottom:10px;'+(c.id===selected?'border-color:var(--accent)':'')+'">'+
      '<div style="display:flex;justify-content:space-between;align-items:center"><b>'+K.esc(c.name)+'</b>'+
      (c.revoked?K.badge("REVOKED","bad"):left<=0?K.badge("EXPIRED","warn"):K.badge("ACTIVE","ok"))+'</div>'+
      '<div class="k-muted" style="font-family:var(--mono);font-size:12px;margin:4px 0">repo: '+K.esc(c.repo)+'</div>'+
      '<div style="margin:4px 0">'+c.scopes.map(s=>'<span class="k-badge info" style="margin:0 4px 4px 0">'+K.esc(s)+'</span>').join('')+'</div>'+
      (c.revoked||left<=0?'':'<div class="k-muted" style="font-size:12px">expires in '+hrs.toFixed(1)+'h</div><div class="expbar"><i style="width:'+pctLeft.toFixed(0)+'%"></i></div>')+
      '<div style="display:flex;gap:8px;margin-top:8px"><button class="k-btn" data-a="view">Inspect</button>'+(c.revoked?'':'<button class="k-btn k-danger" data-a="revoke">Revoke</button>')+'</div></div>');
    card.querySelector('[data-a=view]').addEventListener("click",()=>{selected=c.id;renderCreds();renderLog();});
    const rv=card.querySelector('[data-a=revoke]');
    if(rv)rv.addEventListener("click",()=>{c.revoked=true;store.set("creds",creds);renderAll();K.toast("Credential revoked for "+c.name,"bad");});
    host.appendChild(card);
  });
}
function renderLog(){
  const host=document.getElementById("uselog");host.innerHTML="";
  const c=creds.find(x=>x.id===selected);if(!c){K.empty(host,"No credential selected","");return;}
  const uses=c.uses.slice().reverse();
  if(!uses.length){K.empty(host,"No usage yet","Simulate a call to see allow/deny in action.");return;}
  uses.forEach(u=>{
    host.appendChild(K.el('<div class="use'+(u.fresh?' fresh':'')+'"><span class="t">'+K.esc(u.t)+'</span><span style="flex:1"><span style="font-family:var(--mono);font-size:12px">'+K.esc(u.scope)+'</span> → '+K.esc(u.target)+(u.ok?'':'<br><span style="color:var(--bad);font-size:12px">'+K.esc(u.why)+'</span>')+'</span>'+(u.ok?K.badge("ALLOWED","ok"):K.badge("DENIED","bad"))+'</div>'));
  });
  creds.forEach(c=>c.uses.forEach(u=>{delete u.fresh;}));
  const sim=K.el('<div style="padding:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="k-btn" id="simOk">Simulate allowed call</button><button class="k-btn k-danger" id="simNo">Simulate prod deploy attempt</button></div>');
  host.appendChild(sim);
  sim.querySelector("#simOk").addEventListener("click",()=>{
    const s=c.scopes[0]||"repo.read";
    c.uses.push({t:new Date().toTimeString().slice(0,8),scope:s,target:c.repo+" · routine call",ok:true});
    store.set("creds",creds);renderLog();renderKPIs();K.toast("Allowed: scope '"+s+"' is granted","ok");
  });
  sim.querySelector("#simNo").addEventListener("click",()=>{
    const chk=scopeAllowed(c,"deploy.prod");
    c.uses.push({t:new Date().toTimeString().slice(0,8),scope:"deploy.prod",target:c.repo+" → production",ok:chk.ok,why:chk.why});
    store.set("creds",creds);renderLog();renderKPIs();K.toast("Denied: "+chk.why,"bad");
  });
}
function renderAll(){renderKPIs();renderCreds();renderLog();}
const ATTACKS=[
 {scope:"deploy.prod",target:"acme/web → production"},
 {scope:"secrets.read",target:"STRIPE_LIVE_KEY"},
 {scope:"repo.admin",target:"acme/web · branch protection rules"},
];
function attackDrill(){
  const demo=creds.find(c=>c.demo)||creds[0];
  selected=demo.id;renderCreds();
  document.getElementById("uselog").scrollIntoView({behavior:"smooth",block:"start"});
  ATTACKS.forEach((a,i)=>{
    setTimeout(()=>{
      const chk=scopeAllowed(demo,a.scope);
      demo.uses.push({t:new Date().toTimeString().slice(0,8),scope:a.scope,target:a.target,ok:chk.ok,why:chk.why,fresh:true});
      store.set("creds",creds);renderLog();renderKPIs();
      if(i===ATTACKS.length-1)K.toast("Attack drill done — "+ATTACKS.length+" blocked, 0 got through","ok");
    },450*(i+1));
  });
}
document.getElementById("attackDrill").addEventListener("click",attackDrill);
document.getElementById("issue").addEventListener("click",()=>{
  const name=document.getElementById("fName").value.trim()||"agent";
  const repo=document.getElementById("fRepo").value.trim()||"acme/web";
  const scopes=Array.prototype.map.call(scopeHost.querySelectorAll("input:checked"),i=>i.value);
  if(!scopes.length){K.toast("Select at least one scope","warn");return;}
  const secs=+document.getElementById("fExp").value;
  const c={id:K.uid("cred"),name:name,repo:repo,scopes:scopes,token:tokenFor(name),
    issued:new Date().toISOString().slice(0,16).replace("T"," "),expiresAt:Date.now()+secs*1000,revoked:false,uses:[]};
  creds.unshift(c);selected=c.id;store.set("creds",creds);renderAll();
  document.getElementById("issued").innerHTML='<div class="tokenbox">'+K.esc(c.token)+'</div><button class="k-btn" id="copyTok">Copy token</button>';
  document.getElementById("copyTok").addEventListener("click",()=>K.copy(c.token));
  K.toast("Credential issued for "+name,"ok");
});
function howItWorks(){
  K.modal({title:"How Scopekey works",body:'<ol style="margin:0;padding-left:20px;font-size:14px">'+
   '<li>Each agent gets its own identity — never a shared service account.</li>'+
   '<li>Credentials carry an explicit scope list and an optional repo binding.</li>'+
   '<li>Every tool call is checked against the scope; misses are denied and logged.</li>'+
   '<li>Short expiries (hours, not months) bound the blast radius of a leak.</li></ol>',
   actions:[{label:"Got it",primary:true}]});
}
renderAll();
K.toast("Hit “Watch the attack drill” — deploy-bot tries prod and gets denied on screen","info");
})();

</script>
