<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permission Diff</title>
<link rel="stylesheet" href="../../shared/kit.css">
<style>
:root{
  --bg:#f7f4ec; --panel:#fffdf8; --panel2:#f1ecdd; --ink:#23211a; --muted:#8a8474;
  --line:#e2dccb; --accent:#1d6f42; --accent2:#b3392f; --good:#1d6f42; --warn:#b97f1f; --bad:#b3392f;
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Inter,Roboto,serif;margin:0}
.k-nav{background:#fffdf8;border-bottom:1px solid var(--line)}
.k-nav-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.k-nav-title{font-weight:800;font-size:19px}.k-nav-title .dot{color:var(--accent)}
.k-nav-sub{color:var(--muted);font-size:12.5px}
.k-btn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13.5px}
.k-btn:hover{border-color:var(--accent)}
.k-btn.k-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.k-btn.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(29,111,66,.2)}
.k-wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.k-hero{border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:18px;background:var(--panel);display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.k-hero h1{margin:0 0 6px;font-size:26px}
.k-hero p{margin:0;color:var(--muted);max-width:620px}
.k-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.k-card h3{margin:0 0 8px;font-size:15px}
.k-muted{color:var(--muted)}
.k-grid{display:grid;gap:14px}
.k-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid var(--line)}
.k-badge.ok{background:#e3f2e9;color:var(--good);border-color:#bfe0cc}
.k-badge.warn{background:#fdf3df;color:var(--warn);border-color:#f0dfb5}
.k-badge.bad{background:#fbe7e5;color:var(--bad);border-color:#f0c4c0}
.k-badge.info{background:#e5eefb;color:#2b5cb8;border-color:#c4d6f2}
.diffrow{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.diffrow .dh{display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;background:var(--panel)}
.diffrow .dh:hover{background:var(--panel2)}
.diffrow.added .dh{border-left:5px solid var(--bad)}
.diffrow.removed .dh{border-left:5px solid var(--muted)}
.diffrow.changed .dh{border-left:5px solid var(--warn)}
.diffrow.same .dh{border-left:5px solid var(--good)}
.diffrow .db{display:none;padding:12px 14px;border-top:1px solid var(--line);background:#fffefa;font-size:13.5px}
.diffrow.open .db{display:block}
.perm{font-family:var(--mono);font-size:13px;font-weight:700}
.riskbar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}
.riskbar i{display:block;height:100%}
select.k-select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--ink)}
pre.json{background:#fbf8ef;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12px;overflow:auto;white-space:pre-wrap}
.k-toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
.k-toast{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.k-toast.out{opacity:0;transition:opacity .3s}
.k-overlay{position:fixed;inset:0;background:rgba(35,33,26,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.k-modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:560px;width:92%}
.k-modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.k-modal-t{font-weight:700}.k-modal-b{padding:16px 18px}.k-modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

</style>
</head>
<body>
<script src="../../shared/kit.js"></script>
<script>

(function(){
if(window.Kit && window.Kit.rng && window.Kit.toast && window.Kit.modal) return;

K.el=function(html){const t=document.createElement('template');t.innerHTML=String(html).trim();return t.content.firstElementChild;};

K.nav=function(o){o=o||{};const h=K.el('<header class="k-nav"><div class="k-nav-in"><div><div class="k-nav-title">'+K.esc(o.title||'')+'</div>'+(o.sub?'<div class="k-nav-sub">'+K.esc(o.sub)+'</div>':'')+'</div><div class="k-nav-actions"></div></div></header>');const box=h.querySelector('.k-nav-actions');(o.actions||[]).forEach(function(a){const b=document.createElement('button');b.className='k-btn '+(a.kind||'');b.textContent=a.label;if(a.onclick)b.addEventListener('click',a.onclick);box.appendChild(b);});document.body.insertBefore(h,document.body.firstChild);return h;};

K.tabs=function(host,tabs){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';const bar=K.el('<div class="k-tabs"></div>');const pane=K.el('<div class="k-tabpane"></div>');host.appendChild(bar);host.appendChild(pane);let active=null;function sel(t){active=t.id;Array.prototype.forEach.call(bar.children,function(x){x.classList.toggle('on',x.dataset.id===t.id);});pane.innerHTML='';t.render(pane);}tabs.forEach(function(t){const b=document.createElement('button');b.className='k-tab';b.dataset.id=t.id;b.textContent=t.label;b.addEventListener('click',function(){sel(t);});bar.appendChild(b);});if(tabs.length)sel(tabs[0]);return{select:function(id){const t=tabs.find(function(x){return x.id===id;});if(t)sel(t);},active:function(){return active;}};};
K.table=function(host,cols,rows,opt){opt=opt||{};host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';let q='',page=0;const ps=opt.pageSize||8;const wrap=K.el('<div class="k-tablew"></div>');if(opt.search){const s=K.el('<input class="k-input k-tsearch" placeholder="Search…">');s.addEventListener('input',function(){q=s.value.toLowerCase();page=0;draw();});wrap.appendChild(s);}const tw=K.el('<div></div>');const pg=K.el('<div class="k-pager"></div>');wrap.appendChild(tw);wrap.appendChild(pg);host.appendChild(wrap);function filtered(){if(!q)return rows;return rows.filter(function(r){return cols.some(function(c){const v=r[c.key];return v!=null&&String(v).toLowerCase().indexOf(q)>-1;});});}function fmt(c,v,r){if(c.fmt)return c.fmt(v,r);if(v==null)return'';return String(v);}function draw(){const fr=filtered();const pages=Math.max(1,Math.ceil(fr.length/ps));page=Math.min(page,pages-1);const slice=fr.slice(page*ps,page*ps+ps);let h='<table class="k-table"><thead><tr>';cols.forEach(function(c){h+='<th class="'+(c.num?'num':'')+'">'+K.esc(c.label)+'</th>';});h+='</tr></thead><tbody>';if(!slice.length)h+='<tr><td colspan="'+cols.length+'" class="k-muted">No rows.</td></tr>';slice.forEach(function(r){h+='<tr>';cols.forEach(function(c){h+='<td class="'+(c.num?'num':'')+'">'+fmt(c,r[c.key],r)+'</td>';});h+='</tr>';});h+='</tbody></table>';tw.innerHTML=h;pg.innerHTML='';if(pages>1){for(let i=0;i<pages;i++){const b=document.createElement('button');b.className='k-btn k-pg'+(i===page?' on':'');b.textContent=String(i+1);(function(i){b.addEventListener('click',function(){page=i;draw();});})(i);pg.appendChild(b);}}}draw();return{redraw:draw};};
K.bars=function(host,items){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';const mx=Math.max.apply(null,items.map(function(i){return i.value;}).concat([1]));items.forEach(function(i){const r=K.el('<div class="k-bar-r"><div class="k-bar-l">'+K.esc(i.label)+'</div><div class="k-bar-t"><div class="k-bar-f" style="width:'+(100*i.value/mx).toFixed(1)+'%;'+(i.color?'background:'+i.color:'')+'"></div></div><div class="k-bar-v">'+K.esc(String(i.display!=null?i.display:i.value))+'</div></div>');host.appendChild(r);});};
K.line=function(host,series){host=typeof host==='string'?document.querySelector(host):host;const W=560,H=200,P=28;host.innerHTML='';const all=[];series.forEach(function(s){s.points.forEach(function(p){all.push(p);});});const mn=Math.min.apply(null,all.concat([0])),mx=Math.max.apply(null,all.concat([1]));const X=function(i,n){return P+i*(W-2*P)/Math.max(1,n-1);},Y=function(v){return H-P-(v-mn)*(H-2*P)/Math.max(1e-9,mx-mn);};let s='<svg viewBox="0 0 '+W+' '+H+'" class="k-svg">';const steps=4;for(let g=0;g<=steps;g++){const y=P+g*(H-2*P)/steps;s+='<line x1="'+P+'" y1="'+y+'" x2="'+(W-P)+'" y2="'+y+'" class="k-grid-ln"/>';}series.forEach(function(sr){const n=sr.points.length;let d='';sr.points.forEach(function(p,i){d+=(i?'L':'M')+X(i,n).toFixed(1)+','+Y(p).toFixed(1)+' ';});s+='<path d="'+d+'" fill="none" stroke="'+(sr.color||'#888')+'" stroke-width="2"/>';sr.points.forEach(function(p,i){s+='<circle cx="'+X(i,n).toFixed(1)+'" cy="'+Y(p).toFixed(1)+'" r="3" fill="'+(sr.color||'#888')+'"><title>'+K.esc(sr.name+': '+p)+'</title></circle>';});});s+='</svg><div class="k-legend">'+series.map(function(sr){return '<span class="k-leg"><i style="background:'+(sr.color||'#888')+'"></i>'+K.esc(sr.name)+'</span>';}).join('')+'</div>';host.innerHTML=s;};
K.donut=function(host,items){host=typeof host==='string'?document.querySelector(host):host;const R=70,C=2*Math.PI*R;const tot=items.reduce(function(a,i){return a+i.value;},0)||1;let off=0;let arcs='';items.forEach(function(i,ix){const frac=i.value/tot;arcs+='<circle r="'+R+'" cx="90" cy="90" fill="none" stroke="'+(i.color||['#5b8def','#34c77b','#f0a44b','#e05d5d','#9a6ff0'][ix%5])+'" stroke-width="26" stroke-dasharray="'+(frac*C).toFixed(2)+' '+C.toFixed(2)+'" stroke-dashoffset="'+(-off*C).toFixed(2)+'" transform="rotate(-90 90 90)"><title>'+K.esc(i.label+': '+i.value)+'</title></circle>';off+=frac;});host.innerHTML='<div class="k-donutw"><svg viewBox="0 0 180 180" class="k-svg">'+arcs+'<text x="90" y="96" text-anchor="middle" class="k-donut-t">'+K.esc(String(tot))+'</text></svg><div class="k-legend">'+items.map(function(i,ix){return '<span class="k-leg"><i style="background:'+(i.color||['#5b8def','#34c77b','#f0a44b','#e05d5d','#9a6ff0'][ix%5])+'"></i>'+K.esc(i.label)+'</span>';}).join('')+'</div></div>';};
K.timeline=function(host,events){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';const w=K.el('<div class="k-tl"></div>');events.forEach(function(e){const it=K.el('<div class="k-tl-it '+(e.kind||'')+'"><div class="k-tl-dot"></div><div class="k-tl-c"><div class="k-tl-h"><span class="k-tl-t">'+K.esc(e.t||'')+'</span><span class="k-tl-title">'+K.esc(e.title||'')+'</span></div>'+(e.body?'<div class="k-tl-b">'+e.body+'</div>':'')+'</div></div>');if(e.onclick)it.style.cursor='pointer',it.addEventListener('click',function(){e.onclick(e);});w.appendChild(it);});host.appendChild(w);};
K.graph=function(host,g){host=typeof host==='string'?document.querySelector(host):host;const W=600,H=340;host.innerHTML='';const n=g.nodes.length;const pos={};g.nodes.forEach(function(nd,i){const a=2*Math.PI*i/Math.max(1,n)-Math.PI/2;pos[nd.id]={x:W/2+Math.cos(a)*(W/2-90),y:H/2+Math.sin(a)*(H/2-70)};});let s='<svg viewBox="0 0 '+W+' '+H+'" class="k-svg">';(g.edges||[]).forEach(function(e){const a=pos[e.a],b=pos[e.b];if(!a||!b)return;const mx=(a.x+b.x)/2,my=(a.y+b.y)/2-24;s+='<path d="M'+a.x+','+a.y+' Q'+mx+','+my+' '+b.x+','+b.y+'" class="k-edge"/>';if(e.label)s+='<text x="'+mx+'" y="'+(my-4)+'" text-anchor="middle" class="k-edge-l">'+K.esc(e.label)+'</text>';});g.nodes.forEach(function(nd){const p=pos[nd.id];s+='<g><circle cx="'+p.x+'" cy="'+p.y+'" r="30" fill="'+(nd.color||'#2c3a4a')+'" stroke="#888" stroke-width="1"/><text x="'+p.x+'" y="'+(p.y+4)+'" text-anchor="middle" class="k-node-l">'+K.esc(nd.label)+'</text>'+(nd.sub?'<text x="'+p.x+'" y="'+(p.y+48)+'" text-anchor="middle" class="k-node-s">'+K.esc(nd.sub)+'</text>':'')+'</g>';});s+='</svg>';host.innerHTML=s;};
K.badge=function(txt,kind){return '<span class="k-badge '+(kind||'')+'">'+K.esc(txt)+'</span>';};
K.kpi=function(host,o){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';const e=K.el('<div class="k-kpi"><div class="k-kpi-v">'+K.esc(String(o.value))+'</div><div class="k-kpi-l">'+K.esc(o.label)+'</div>'+(o.delta?'<div class="k-kpi-d">'+K.esc(o.delta)+'</div>':'')+'</div>');host.appendChild(e);return e;};
K.empty=function(host,title,sub,al,af){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';const e=K.el('<div class="k-empty"><div class="k-empty-t">'+K.esc(title)+'</div>'+(sub?'<div class="k-muted">'+K.esc(sub)+'</div>':'')+'</div>');if(al){const b=document.createElement('button');b.className='k-btn k-primary';b.textContent=al;b.addEventListener('click',function(){if(af)af();});e.appendChild(b);}host.appendChild(e);return e;};
K.money=function(n){return '$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0});};
K.num=function(n){return Number(n).toLocaleString('en-US');};
K.pct=function(x){return (Number(x)*100).toFixed(1)+'%';};
K.when=function(d){const t=d instanceof Date?d:new Date(d);return t.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});};
K.initials=function(name){return String(name||'').split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();};
K.copy=function(txt){function done(){K.toast('Copied to clipboard','ok');}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(String(txt)).then(done,function(){K.toast('Copy failed','bad');});}else{const ta=document.createElement('textarea');ta.value=String(txt);document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){K.toast('Copy failed','bad');}ta.remove();}};
window.Kit=K;
})();

<script>
/* DeltaScope — Permission Diff. See exactly what an agent update changes. */
(function(){
"use strict";
const K = window.Kit;
function navBtn(label,fn){const box=document.querySelector('.k-nav-actions');if(!box||typeof fn!=='function')return;const b=document.createElement('button');b.className='k-btn';b.type='button';b.textContent=label;b.addEventListener('click',fn);box.appendChild(b);}


const MANIFESTS={
 "2.2":["files.read","files.write","web.fetch","calendar.read","email.send","db.read.staging"],
 "2.3":["files.read","files.write","web.fetch","calendar.read","calendar.write","email.send","db.read.staging","shell.exec.sandbox"],
 "2.4":["files.read","files.write","web.fetch","calendar.read","calendar.write","email.send","db.read.staging","shell.exec.sandbox",
        "secrets.read","db.write.prod","billing.refund"]
};
const META={
 "files.read":{risk:1,desc:"Read files in the project workspace."},
 "files.write":{risk:2,desc:"Write files in the project workspace."},
 "web.fetch":{risk:2,desc:"Fetch public URLs."},
 "calendar.read":{risk:2,desc:"Read calendar events."},
 "calendar.write":{risk:3,desc:"Create and modify calendar events."},
 "email.send":{risk:3,desc:"Send email as the user."},
 "db.read.staging":{risk:2,desc:"Read staging database."},
 "shell.exec.sandbox":{risk:3,desc:"Run shell commands inside the sandbox."},
 "secrets.read":{risk:5,desc:"Read plaintext secrets and API keys.",why:"Changelog says 'for deployment automation', but the agent previously used Scopekey-scoped credentials for this. Direct secret access removes the audit boundary."},
 "db.write.prod":{risk:5,desc:"Write to the production database.",why:"Justified as 'fixing data issues faster'. No guardrails described — the agent could UPDATE or DELETE arbitrary production rows."},
 "billing.refund":{risk:4,desc:"Issue refunds via the billing provider.",why:"Tied to the new refund-handling skill. Refunds move real money; the old version required human approval for anything over $50."},
};
const RISKY=["secrets.read","db.write.prod","billing.refund"];

K.nav({title:"DeltaScope — Permission Diff",
  sub:"Approve agent updates with your eyes open"});
navBtn("Export diff",exportDiff);

const wrap=K.el('<div class="k-wrap"></div>');document.body.appendChild(wrap);
wrap.innerHTML=
 '<div class="k-hero"><div><h1>v2.3 → v2.4: three new permissions want your attention.</h1>'+
 '<p>DeltaScope diffs the agent manifest before you approve an update. New, removed and changed permissions are shown with a risk score and the vendor\'s own justification — so "just a minor update" can\'t smuggle in production write access.</p></div>'+
 '<div><label class="k-muted" style="font-size:12px">COMPARE</label><br><select class="k-select" id="cmp"><option value="2.3>2.4" selected>v2.3 → v2.4</option><option value="2.2>2.3">v2.2 → v2.3</option><option value="2.2>2.4">v2.2 → v2.4</option></select></div></div>'+
 '<div class="k-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px" id="kpis"></div>'+
 '<div class="k-card"><h3>Permission diff <span id="dh"></span></h3><div class="k-muted" style="font-size:12.5px;margin-bottom:10px">Click any row for the full justification and risk analysis.</div><div id="diff"></div></div>';

let curA="2.3",curB="2.4";
const store=K.store("deltascope");
function getDec(){return store.get("dec",{})||{};}
function decMap(){const all=getDec();const k=curA+">"+curB;return all[k]||{};}
function setDec(perm,val){
  const all=getDec();const k=curA+">"+curB;const m=all[k]||{};
  m[perm]=val;all[k]=m;store.set("dec",all);render();
}
function diff(a,b){
  const A=MANIFESTS[a],B=MANIFESTS[b];
  const rows=[];
  B.forEach(p=>{if(A.indexOf(p)<0)rows.push({perm:p,kind:"added"});});
  A.forEach(p=>{if(B.indexOf(p)<0)rows.push({perm:p,kind:"removed"});});
  A.forEach(p=>{if(B.indexOf(p)>-1)rows.push({perm:p,kind:"same"});});
  const ord={added:0,removed:1,changed:2,same:3};
  rows.sort((x,y)=>ord[x.kind]-ord[y.kind]||x.perm.localeCompare(y.perm));
  return rows;
}
function riskBadge(r){return r>=5?K.badge("CRITICAL","bad"):r>=4?K.badge("HIGH","warn"):r>=3?K.badge("MEDIUM","info"):K.badge("LOW","ok");}
function render(){
  document.getElementById("dh").textContent="("+curA+" → "+curB+")";
  const rows=diff(curA,curB);
  const added=rows.filter(r=>r.kind==="added"),removed=rows.filter(r=>r.kind==="removed");
  const riskyAdded=added.filter(r=>RISKY.indexOf(r.perm)>-1&&curB==="2.4");
  const riskScore=added.reduce((a,r)=>a+(META[r.perm]?META[r.perm].risk:3),0);
  const k=document.getElementById("kpis");k.innerHTML="";
  [["New permissions",added.length],["Removed",removed.length],["Risky additions",riskyAdded.length],["Added risk score",riskScore+" / 25"]].forEach(p=>{
    const d=document.createElement("div");k.appendChild(d);K.kpi(d,{label:p[0],value:p[1]});
  });
  const host=document.getElementById("diff");host.innerHTML="";
  // ---- Deploy gate: real per-permission decisions, persisted per version pair ----
  const dmap=decMap();
  const unrev=added.filter(r=>!dmap[r.perm]);
  const blk=added.filter(r=>dmap[r.perm]==="block");
  const rst=added.filter(r=>dmap[r.perm]==="restrict");
  let gate,gc;
  if(!added.length){gate='<b style="color:var(--good)">✓ No new permissions</b><div class="k-muted" style="font-size:13px">This update adds nothing — safe to approve.</div>';gc='var(--good)';}
  else if(blk.length){gate='<b style="color:var(--bad)">⛔ DEPLOY BLOCKED</b><div style="font-size:13px">'+blk.length+' permission'+(blk.length>1?'s':'')+' blocked ('+blk.map(r=>K.esc(r.perm)).join(', ')+'). This update cannot ship until you resolve them.</div>';gc='var(--bad)';}
  else if(unrev.length){gate='<b style="color:var(--warn)">⏳ PENDING REVIEW</b><div style="font-size:13px">'+unrev.length+' of '+added.length+' new permissions still unreviewed. Click each row and choose approve, approve-with-restriction, or block.</div>';gc='var(--warn)';}
  else if(rst.length){gate='<b style="color:var(--good)">✓ PASS WITH RESTRICTIONS</b><div style="font-size:13px">All '+added.length+' new permissions reviewed — '+rst.length+' approved with restrictions, none blocked. This update can ship guarded.</div>';gc='var(--good)';}
  else{gate='<b style="color:var(--good)">✓ READY TO APPROVE</b><div style="font-size:13px">All '+added.length+' new permissions reviewed and approved. This update is cleared for deploy.</div>';gc='var(--good)';}
  const gw=K.el('<div class="k-card" style="border-color:'+gc+';border-left-width:5px;margin-bottom:12px">'+gate+'</div>');
  host.appendChild(gw);
  if(riskyAdded.length){
    const w=K.el('<div class="k-card" style="border-color:var(--bad);background:#fdf0ee;margin-bottom:12px"><b style="color:var(--bad)">⚠ '+riskyAdded.length+' high-risk additions in this update.</b><div class="k-muted" style="font-size:13px">These permissions were not present in v'+curA+'. Review the justification before approving.</div></div>');
    host.appendChild(w);
  }
  rows.forEach(r=>{
    const m=META[r.perm]||{risk:3,desc:"No description provided."};
    const isRisky=r.kind==="added"&&RISKY.indexOf(r.perm)>-1;
    const dec=dmap[r.perm];
    const decBadge=dec==="block"?K.badge("⛔ BLOCKED","bad"):dec==="restrict"?K.badge("RESTRICTED","warn"):dec==="approve"?K.badge("APPROVED","ok"):"";
    const tag=r.kind==="added"?K.badge("+ ADDED","bad"):r.kind==="removed"?K.badge("− REMOVED","info"):K.badge("UNCHANGED","ok");
    const d=K.el('<div class="diffrow '+r.kind+'"><div class="dh"><span class="perm">'+K.esc(r.perm)+'</span>'+tag+(isRisky?K.badge("⚠ RISKY","bad"):"")+decBadge+'<span style="flex:1"></span>'+riskBadge(m.risk)+'</div>'+
      '<div class="db"><div class="k-muted" style="font-size:12px;margin-bottom:4px">RISK</div><div class="riskbar"><i style="width:'+(m.risk*20)+'%;background:'+(m.risk>=5?'var(--bad)':m.risk>=4?'var(--warn)':'var(--good)')+'"></i></div>'+
      '<p>'+K.esc(m.desc)+'</p>'+
      (m.why?'<div class="k-muted" style="font-size:12px">VENDOR JUSTIFICATION — REVIEW</div><p>'+K.esc(m.why)+'</p>':'<p class="k-muted">No justification provided by the vendor.</p>')+
      (r.kind==="added"?'<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="k-btn k-primary" data-a="appr">Approve</button><button class="k-btn" data-a="rest">Approve with restriction</button><button class="k-btn" data-a="blk">Block this permission</button></div>':'')+
      '</div></div>');
    d.querySelector(".dh").addEventListener("click",()=>d.classList.toggle("open"));
    const ap=d.querySelector('[data-a=appr]'),rs=d.querySelector('[data-a=rest]'),bl=d.querySelector('[data-a=blk]');
    if(ap)ap.addEventListener("click",e=>{e.stopPropagation();setDec(r.perm,"approve");K.toast("Approved: "+r.perm,"ok");});
    if(rs)rs.addEventListener("click",e=>{e.stopPropagation();setDec(r.perm,"restrict");K.toast("Approved with restriction: "+r.perm,"warn");});
    if(bl)bl.addEventListener("click",e=>{e.stopPropagation();setDec(r.perm,"block");K.toast("Blocked: "+r.perm+" will not be granted","bad");});
    host.appendChild(d);
  });
  if(curB==="2.4"){
    // auto-open the risky rows so the demo scenario lands immediately
    setTimeout(()=>{Array.prototype.forEach.call(host.querySelectorAll(".diffrow"),el=>{
      if(el.querySelector(".k-badge.bad")&&el.textContent.indexOf("RISKY")>-1)el.classList.add("open");
    });},60);
  }
}
document.getElementById("cmp").addEventListener("change",e=>{const v=e.target.value.split(">");curA=v[0];curB=v[1];render();});
function exportDiff(){
  const rows=diff(curA,curB).map(r=>({permission:r.perm,change:r.kind,risk:(META[r.perm]||{}).risk||null}));
  K.copy(JSON.stringify({from:curA,to:curB,diff:rows},null,2));
}
render();
K.toast("v2.4 adds secrets.read, db.write.prod and billing.refund","warn");
})();

</script>
</body>
</html>
