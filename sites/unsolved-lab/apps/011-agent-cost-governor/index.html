<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gatekeep — Cost Governor</title>
<link rel="stylesheet" href="../../shared/kit.css">
<style>

:root{--bg:#0c0e12;--panel:#141821;--panel2:#1a2030;--ink:#eef1f6;--muted:#8b93a7;
--line:#242b3d;--accent:#ffb020;--accent2:#38e1c6;--good:#3ddc84;--warn:#ffb020;--bad:#ff5d5d;--info:#4aa8ff}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent2)}
.k-wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.k-nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.k-nav .k-wrap{padding-top:14px;padding-bottom:14px;display:flex;align-items:center;gap:16px}
.k-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#0c0e12;flex:none}
.k-title{font-size:19px;font-weight:750;letter-spacing:.2px}
.k-sub{color:var(--muted);font-size:13px;margin-top:1px}
.k-nav .sp{flex:1}
.k-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.k-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.k-card h3{margin:0 0 10px;font-size:15px}
.k-hero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:16px;position:relative;overflow:hidden}
.k-hero h1{margin:0 0 6px;font-size:26px;letter-spacing:.2px}
.k-hero p{margin:0;color:var(--muted);max-width:640px}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.k-split{grid-template-columns:1fr}}
.k-btn{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer;transition:transform .06s,filter .15s}
.k-btn:hover{filter:brightness(1.18)}
.k-btn:active{transform:scale(.97)}
.k-btn.k-primary{background:var(--accent);border-color:transparent;color:#10131a}
.k-btn.k-danger{background:var(--bad);border-color:transparent;color:#141015}
.k-btn:disabled{opacity:.45;cursor:not-allowed}
.k-input,.k-select{background:#0e1219;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:14px;width:100%}
.k-input:focus,.k-select:focus{outline:2px solid var(--accent);outline-offset:0}
label.k-lbl{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.6px}
table.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
.k-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.k-table tr:last-child td{border-bottom:none}
.k-table tbody tr:hover{background:rgba(255,255,255,.025)}
.k-badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.3px;white-space:nowrap}
.k-badge.ok{background:rgba(61,220,132,.14);color:var(--good)}
.k-badge.warn{background:rgba(255,176,32,.14);color:var(--warn)}
.k-badge.bad{background:rgba(255,93,93,.16);color:var(--bad)}
.k-badge.info{background:rgba(74,168,255,.14);color:var(--info)}
.k-badge.neu{background:rgba(139,147,167,.16);color:var(--muted)}
.k-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.k-tabs button{background:none;border:none;color:var(--muted);font-size:14px;font-weight:650;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.k-tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.k-kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.k-kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.k-kpi .v{font-size:30px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.k-kpi .d{font-size:13px}
.k-toast{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.k-toast div{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--info);padding:11px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:tin .25s}
.k-toast div.ok{border-left-color:var(--good)}.k-toast div.warn{border-left-color:var(--warn)}.k-toast div.bad{border-left-color:var(--bad)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.k-modal-ov{position:fixed;inset:0;background:rgba(4,6,10,.66);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px}
.k-modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:22px;animation:tin .2s}
.k-modal h2{margin:0 0 10px;font-size:19px}
.k-modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.k-empty{text-align:center;padding:48px 20px;color:var(--muted)}
.k-empty .big{font-size:40px;margin-bottom:10px}
.k-empty h3{color:var(--ink);margin:0 0 6px}
.k-muted{color:var(--muted)}
.k-bars .row{display:grid;grid-template-columns:170px 1fr 64px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.k-bars .tr{height:10px;background:#0e1219;border-radius:99px;overflow:hidden}
.k-bars .fl{height:100%;border-radius:99px;background:var(--accent);transition:width .5s}
.k-tl{position:relative;padding-left:26px}
.k-tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.k-tl .ev{position:relative;margin:0 0 16px}
.k-tl .ev:before{content:"";position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--muted)}
.k-tl .ev.ok:before{background:var(--good)}.k-tl .ev.warn:before{background:var(--warn)}
.k-tl .ev.bad:before{background:var(--bad)}.k-tl .ev.info:before{background:var(--info)}
.k-tl .t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.k-tl .ti{font-weight:700;font-size:14px}
.k-tl .b{font-size:13px;color:var(--muted)}
.k-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.k-code{background:#0a0d12;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto}
.k-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:13px}
.k-search{max-width:280px;margin-bottom:10px}
.k-prog{height:10px;background:#0e1219;border-radius:99px;overflow:hidden}
.k-prog>div{height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.k-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}
.pulse{animation:pl 1.4s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}


:root{--bg:#0a0e16;--panel:#111724;--panel2:#182032;--ink:#f2f4f8;--muted:#8f99ad;
--line:#232c42;--accent:#ffb020;--accent2:#38e1c6;--good:#3ddc84;--warn:#ffb020;--bad:#ff5d5d;--info:#4aa8ff}
body{font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,sans-serif}
.burnbar{height:12px;background:#0a0e14;border-radius:99px;overflow:hidden;margin-top:8px}
.burnbar>div{height:100%;border-radius:99px;transition:width .5s}
.throttle-banner{display:none;background:rgba(255,93,93,.1);border:1px solid var(--bad);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.throttle-banner.show{display:flex;gap:14px;align-items:center;animation:tin .3s}
.runline{font-variant-numeric:tabular-nums}

</style></head><body>

def('tabs',function(host,tabs){host=typeof host==='string'?document.querySelector(host):host;var bar=K.el('<div class="k-tabs"></div>');var panel=K.el('<div></div>');host.appendChild(bar);host.appendChild(panel);var cur=null;tabs.forEach(function(t,i){var b=K.el('<button class="'+(i===0?'on':'')+'">'+K.esc(t.label)+'</button>');b.onclick=function(){bar.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');panel.innerHTML='';cur=t.id;if(t.render)t.render(panel)};bar.appendChild(b)});if(tabs[0]&&tabs[0].render)tabs[0].render(panel);return{select:function(id){var b=Array.prototype.find.call(bar.children,function(x,i){return tabs[i].id===id});if(b)b.click()}}});

def('timeline',function(host,events){host=typeof host==='string'?document.querySelector(host):host;var w=K.el('<div class="k-tl"></div>');events.forEach(function(e){var inner='<div class="t">'+K.esc(e.t||'')+'</div><div class="ti">'+K.esc(e.title)+'</div>';if(e.body)inner+='<div class="b">'+e.body+'</div>';w.appendChild(K.el('<div class="ev '+(e.kind||'')+'">'+inner+'</div>'))});host.appendChild(w);return w});
def('graph',function(host,data,opts){host=typeof host==='string'?document.querySelector(host):host;opts=opts||{};var W=760,H=440,cx=W/2,cy=H/2,R=Math.min(W,H)/2-70;var pos={};data.nodes.forEach(function(nd,i){var a=-Math.PI/2+i*2*Math.PI/data.nodes.length;pos[nd.id]={x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)}});var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';svg+='<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8b93a7" stroke-width="1.5"/></marker></defs>';data.edges.forEach(function(e){var a=pos[e.a],b=pos[e.b];if(!a||!b)return;svg+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="#3a4358" stroke-width="1.6" marker-end="url(#ah)"/>';if(e.label)svg+='<text x="'+((a.x+b.x)/2)+'" y="'+((a.y+b.y)/2-6)+'" fill="#8b93a7" font-size="10" text-anchor="middle">'+K.esc(e.label)+'</text>'});data.nodes.forEach(function(nd){var p=pos[nd.id];var c=nd.color||'#4aa8ff';svg+='<g class="gn" data-id="'+K.esc(nd.id)+'" style="cursor:pointer"><circle cx="'+p.x+'" cy="'+p.y+'" r="26" fill="#141821" stroke="'+c+'" stroke-width="2.5"/><text x="'+p.x+'" y="'+(p.y+5)+'" text-anchor="middle" fill="'+c+'" font-size="13" font-weight="800">'+K.esc(nd.label.slice(0,4))+'</text><text x="'+p.x+'" y="'+(p.y+44)+'" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="700">'+K.esc(nd.label)+'</text>'+(nd.sub?'<text x="'+p.x+'" y="'+(p.y+58)+'" text-anchor="middle" fill="#8b93a7" font-size="10">'+K.esc(nd.sub)+'</text>':'')+'</g>'});svg+='</svg>';var d=K.el('<div>'+svg+'</div>');host.appendChild(d);if(opts.onNode){d.querySelectorAll('.gn').forEach(function(g){g.addEventListener('click',function(){var nd=null;data.nodes.forEach(function(x){if(x.id===g.getAttribute('data-id'))nd=x});opts.onNode(nd)})})}return d});
def('table',function(host,cols,rows,opts){host=typeof host==='string'?document.querySelector(host):host;opts=opts||{};var q='',page=0,ps=opts.pageSize||8;var wrap=K.el('<div></div>');host.appendChild(wrap);function render(){wrap.innerHTML='';var frows=rows.filter(function(r){if(!q)return true;return cols.some(function(c){var v=r[c.key];return String(v==null?'':v).toLowerCase().indexOf(q)>=0})});var pages=Math.max(1,Math.ceil(frows.length/ps));if(page>=pages)page=pages-1;var slice=frows.slice(page*ps,page*ps+ps);var h='<table class="k-table"><thead><tr>'+cols.map(function(c){return '<th'+(c.num?' style="text-align:right"':'')+'>'+K.esc(c.label)+'</th>'}).join('')+'</tr></thead><tbody>';slice.forEach(function(r){h+='<tr>'+cols.map(function(c){var v=r[c.key];var s=c.fmt?c.fmt(v,r):K.esc(v==null?'':v);return '<td'+(c.num?' style="text-align:right"':'')+'>'+s+'</td>'}).join('')+'</tr>'});h+='</tbody></table>';if(!slice.length)h+='<div class="k-empty"><h3>No rows match</h3><p>Try a different search.</p></div>';wrap.innerHTML=h;var ft=K.el('<div class="k-foot"><span>'+frows.length+' row(s) · page '+(page+1)+' of '+pages+'</span><span></span></div>');var pv=ft.children[1];if(pages>1){var b1=K.el('<button class="k-btn" style="padding:5px 12px;margin-right:6px">← Prev</button>');var b2=K.el('<button class="k-btn" style="padding:5px 12px">Next →</button>');b1.disabled=page===0;b2.disabled=page===pages-1;b1.onclick=function(){page--;render()};b2.onclick=function(){page++;render()};pv.appendChild(b1);pv.appendChild(b2)}wrap.appendChild(ft)}if(opts.search){var si=K.el('<input class="k-input k-search" placeholder="Search…">');si.oninput=function(){q=si.value.toLowerCase();page=0;render()};host.insertBefore(si,wrap)}render();return{refresh:function(nr){rows=nr;render()}}});
})();
</script>
<div id="app"></div>
<script>

const K = window.Kit;
const R = K.rng('gatekeep-11');
K.nav({title:'Gatekeep', sub:'Agent Cost Governor · Acme Robotics', logo:'GK', actions:[]});

const state = {
  budgets:[
    {id:'tokens', label:'Token budget', cap:50, used:46.9, unit:'M tok', color:'#ffb020', rate:0.55},
    {id:'usd', label:'Spend budget', cap:2500, used:2284, unit:'$', color:'#38e1c6', rate:26, money:true},
    {id:'tools', label:'Tool-call budget', cap:100000, used:91200, unit:'', color:'#4aa8ff', rate:900},
    {id:'hours', label:'GPU-hour budget', cap:400, used:371, unit:' h', color:'#ff5d5d', rate:3.2},
  ],
  running:false, throttled:null, tickN:0
};
const AGENTS=['support-copilot','deploy-bot','research-agent','data-pipeline','qa-runner'];
const runs=[];
for(let i=0;i<14;i++){
  const tok=K.int(R,12000,480000), calls=K.int(R,8,340);
  runs.push({id:'run-'+K.int(R,1000,9999), agent:K.pick(R,AGENTS),
    tokens:K.num(tok), cost:'$'+(tok/1000*0.004+calls*0.001).toFixed(2), calls:K.num(calls),
    dur:K.int(R,2,58)+'m', status: R()<0.88?'completed':'throttled',
    when:K.when(Date.now()-K.int(R,5,6000)*60000)});
}
const policies=[
  {name:'Monthly token cap', metric:'tokens', limit:'50M / mo', action:'Throttle new runs', on:true},
  {name:'Per-run spend ceiling', metric:'usd', limit:'$40 / run', action:'Kill run', on:true},
  {name:'Tool-call rate limit', metric:'tools', limit:'2,000 / hr / agent', action:'Queue calls', on:true},
  {name:'Off-hours GPU ban', metric:'hours', limit:'0 h 00:00–06:00', action:'Deny', on:false},
];

const app=document.getElementById('app');
app.innerHTML='<div class="k-wrap">'
 +'<div class="throttle-banner" id="tbanner"><div style="flex:none;width:44px;height:44px"><svg viewBox="0 0 44 44" width="44" height="44"><path d="M14 4h16l10 10v16l-10 10H14L4 30V14z" fill="none" stroke="#ff5d5d" stroke-width="3.5"/><rect x="13" y="19" width="18" height="6" rx="3" fill="#ff5d5d"/></svg></div><div style="flex:1"><b>Budget cap hit — agent throttled.</b><div class="k-muted" id="tbanner-sub"></div></div><button class="k-btn k-danger" id="tb-view">View enforcement</button></div>'
 +'<div class="k-hero"><h1>Every agent run has a meter.</h1><p>Gatekeep enforces token, money, tool-call, time, and action budgets across your fleet — live. When a run crosses a cap, it gets throttled mid-flight, not at invoice time.</p>'
 +'<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap"><button class="k-btn k-primary" id="btn-run">▶ Start demo agent run</button><button class="k-btn" id="btn-pause" disabled>⏸ Pause</button><button class="k-btn" id="btn-policy">+ New policy</button><span class="k-muted" id="run-state" style="align-self:center"></span></div></div>'
 +'<div id="tabs"></div></div>';

function fmtB(b){ return b.money? K.money(b.used)+' / '+K.money(b.cap) : K.num(Math.round(b.used))+' / '+K.num(b.cap)+b.unit; }
function pctB(b){ return Math.min(100, b.used/b.cap*100); }

K.tabs(document.getElementById('tabs'),[
 {id:'ov', label:'Overview', render:function(p){
   const g=K.el('<div class="k-grid" id="kpis"></div>'); p.appendChild(g);
   state.budgets.forEach(function(b){
     const k=K.el('<div class="k-kpi"><div class="l">'+K.esc(b.label)+'</div><div class="v runline" id="kpi-'+b.id+'">'+fmtB(b)+'</div><div class="d k-muted" id="kpip-'+b.id+'">'+pctB(b).toFixed(1)+'% of cap</div><div class="burnbar"><div id="bar-'+b.id+'" style="width:'+pctB(b)+'%;background:'+b.color+'"></div></div></div>');
     g.appendChild(k);
   });
   const c=K.el('<div class="k-card" style="margin-top:14px"><h3>Spend burn-down · this month</h3><div id="burnline"></div></div>'); p.appendChild(c);
   const pts=[]; let v=state.budgets[1].used-900;
   for(let i=0;i<30;i++){ v+=K.int(R,18,52); pts.push(Math.round(v)); }
   state.burnPts=pts;
   K.line(c.querySelector('#burnline'),[{name:'Cumulative spend ($)', color:'#38e1c6', points:pts}]);
 }},
 {id:'runs', label:'Agent runs', render:function(p){
   const c=K.el('<div class="k-card"><h3>Recent runs</h3><div id="rt"></div></div>'); p.appendChild(c);
   K.table(c.querySelector('#rt'),[
     {key:'id',label:'Run'},{key:'agent',label:'Agent'},{key:'tokens',label:'Tokens',num:true},
     {key:'calls',label:'Tool calls',num:true},{key:'cost',label:'Cost',num:true},
     {key:'dur',label:'Duration'},{key:'when',label:'Finished'},
     {key:'status',label:'Status',fmt:function(v){return K.badge(v, v==='completed'?'ok':'bad')}}
   ], runs, {search:true, pageSize:8});
 }},
 {id:'pol', label:'Policies', render:function(p){
   const c=K.el('<div class="k-card"><h3>Enforcement policies</h3><div id="pt"></div></div>'); p.appendChild(c);
   drawPolicies(c.querySelector('#pt'));
 }}
]);

function drawPolicies(host){
  host.innerHTML='';
  K.table(host,[
    {key:'name',label:'Policy'},{key:'metric',label:'Metric'},{key:'limit',label:'Limit'},
    {key:'action',label:'On breach'},{key:'on',label:'Enabled',fmt:function(v,r){
      return '<button class="k-btn" style="padding:4px 12px" data-p="'+K.esc(r.name)+'">'+(v?'On':'Off')+'</button>'}}
  ], policies, {pageSize:10});
  host.querySelectorAll('button[data-p]').forEach(function(b){
    b.onclick=function(){ const pl=policies.find(function(x){return x.name===b.getAttribute('data-p')}); pl.on=!pl.on; K.toast('Policy "'+pl.name+'" '+(pl.on?'enabled':'disabled'), pl.on?'ok':'warn'); drawPolicies(host); };
  });
}
function openPolicy(){
  const html='<div><label class="k-lbl">Policy name</label><input class="k-input" id="pn" value="Per-agent daily token cap"><div style="height:10px"></div><label class="k-lbl">Metric</label><select class="k-select" id="pm"><option value="tokens">tokens</option><option value="usd">usd</option><option value="tools">tools</option><option value="hours">hours</option></select><div style="height:10px"></div><label class="k-lbl">Limit</label><input class="k-input" id="pl" value="5M / day"><div style="height:10px"></div><label class="k-lbl">Action on breach</label><select class="k-select" id="pa"><option>Throttle new runs</option><option>Kill run</option><option>Queue calls</option><option>Page on-call</option></select></div>';
  K.modal({title:'New budget policy', body:html, actions:[
    {label:'Cancel'},
    {label:'Create policy', primary:true, fn:function(){
      const gv=function(id){var e=document.getElementById(id);return e?e.value:''};
      policies.push({name:gv('pn')||'Untitled', metric:gv('pm')||'tokens', limit:gv('pl'), action:gv('pa'), on:true});
      K.toast('Policy created and enforcing now','ok');
    }}]});
}

function dollarsPerUnit(b){
  if(b.id==='usd')return 1;
  if(b.id==='tokens')return 0.004/1000; /* same rate the Runs table uses */
  if(b.id==='tools')return 0.001;
  if(b.id==='hours')return 2.50; /* illustrative GPU-hour price */
  return 0;
}
function avertedTotal(){
  /* spend burned since this run started, projected over the run's remaining 79/120 steps */
  return state.budgets.reduce(function(s,b){
    return s+Math.max(0,b.used-(b.usedAtStart||b.used))*dollarsPerUnit(b)*(79/41);
  },0);
}
function tick(){
  state.tickN++;
  if(state.running && !state.throttled){
    state.budgets.forEach(function(b){
      if(!state.throttled){ b.used += b.rate*(0.7+R()*0.6);
        const e1=document.getElementById('kpi-'+b.id), e2=document.getElementById('kpip-'+b.id), e3=document.getElementById('bar-'+b.id);
        if(e1)e1.textContent=fmtB(b); if(e2)e2.textContent=pctB(b).toFixed(1)+'% of cap';
        if(e3){e3.style.width=Math.min(100,pctB(b))+'%'; if(pctB(b)>92)e3.style.background='var(--bad)';}
        if(b.used>=b.cap && !state.throttled){
          state.throttled=b; state.running=false;
          document.getElementById('btn-pause').disabled=true;
          document.getElementById('btn-run').disabled=false;
          document.getElementById('run-state').textContent='⛔ throttled';
          const t=document.getElementById('tbanner'); t.classList.add('show');
          const stopped=avertedTotal();
          document.getElementById('tbanner-sub').textContent='demo-run-07 crossed the '+b.label.toLowerCase()+' cap ('+fmtB(b)+'). Policy: Throttle new runs. Run paused at step 41/120 — ≈ '+K.money(stopped)+' in further spend stopped.';
          K.toast('Cap hit: '+b.label+' — run throttled','bad');
          document.getElementById('tb-view').onclick=function(){
            K.modal({title:'Enforcement record', body:'<div class="k-tl">'
              +'<div class="ev bad"><div class="t">just now</div><div class="ti">Cap breached</div><div class="b">demo-run-07 crossed <b>'+K.esc(b.label)+'</b> ('+fmtB(b)+')</div></div>'
              +'<div class="ev warn"><div class="t">just now</div><div class="ti">Policy matched: "'+K.esc(policies[0].name)+'"</div><div class="b">Action: throttle new runs · scope: agent support-copilot</div></div>'
              +'<div class="ev ok"><div class="t">just now</div><div class="ti">Run paused, state checkpointed</div><div class="b">Resume any time from the Runs tab. No further spend accrues.</div></div>'
              +'<div class="ev info"><div class="t">impact</div><div class="ti">≈ '+K.money(stopped)+' in further spend stopped</div><div class="b">Burned since run start, projected over the remaining 79/120 steps across all four meters.</div></div></div>',
              actions:[{label:'Resume run',primary:true,fn:function(){dismissThrottle();startRun();}},{label:'Close'}]});
          };
        }
      }
    });
  }
}
function dismissThrottle(){ state.throttled=null; state.budgets.forEach(function(b){ b.used=Math.min(b.used, b.cap*0.985); }); document.getElementById('tbanner').classList.remove('show'); }
function startRun(){
  if(state.throttled) dismissThrottle();
  state.running=true;
  state.budgets.forEach(function(b){ b.usedAtStart=b.used; });
  document.getElementById('btn-run').disabled=true;
  document.getElementById('btn-pause').disabled=false;
  document.getElementById('run-state').textContent='● live — demo-run-07 burning budget';
  K.toast('demo-run-07 started — watch the meters','info');
}
document.getElementById('btn-run').onclick=startRun;
document.getElementById('btn-policy').onclick=openPolicy;
document.getElementById('btn-pause').onclick=function(){ state.running=false; document.getElementById('btn-run').disabled=false; this.disabled=true; document.getElementById('run-state').textContent='paused'; };
setInterval(tick, 900);
setTimeout(startRun, 1200); /* magic moment: auto demo run, hits cap mid-run */

</script>
</body></html>
