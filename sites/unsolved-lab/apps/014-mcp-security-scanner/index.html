<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCPatrol — MCP Scanner</title>
<link rel="stylesheet" href="../../shared/kit.css">
<style>

:root{--bg:#0c0e12;--panel:#141821;--panel2:#1a2030;--ink:#eef1f6;--muted:#8b93a7;
--line:#242b3d;--accent:#ffb020;--accent2:#38e1c6;--good:#3ddc84;--warn:#ffb020;--bad:#ff5d5d;--info:#4aa8ff}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent2)}
.k-wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.k-nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.k-nav .k-wrap{padding-top:14px;padding-bottom:14px;display:flex;align-items:center;gap:16px}
.k-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#0c0e12;flex:none}
.k-title{font-size:19px;font-weight:750;letter-spacing:.2px}
.k-sub{color:var(--muted);font-size:13px;margin-top:1px}
.k-nav .sp{flex:1}
.k-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.k-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.k-card h3{margin:0 0 10px;font-size:15px}
.k-hero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:16px;position:relative;overflow:hidden}
.k-hero h1{margin:0 0 6px;font-size:26px;letter-spacing:.2px}
.k-hero p{margin:0;color:var(--muted);max-width:640px}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.k-split{grid-template-columns:1fr}}
.k-btn{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer;transition:transform .06s,filter .15s}
.k-btn:hover{filter:brightness(1.18)}
.k-btn:active{transform:scale(.97)}
.k-btn.k-primary{background:var(--accent);border-color:transparent;color:#10131a}
.k-btn.k-danger{background:var(--bad);border-color:transparent;color:#141015}
.k-btn:disabled{opacity:.45;cursor:not-allowed}
.k-input,.k-select{background:#0e1219;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:14px;width:100%}
.k-input:focus,.k-select:focus{outline:2px solid var(--accent);outline-offset:0}
label.k-lbl{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.6px}
table.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
.k-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.k-table tr:last-child td{border-bottom:none}
.k-table tbody tr:hover{background:rgba(255,255,255,.025)}
.k-badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.3px;white-space:nowrap}
.k-badge.ok{background:rgba(61,220,132,.14);color:var(--good)}
.k-badge.warn{background:rgba(255,176,32,.14);color:var(--warn)}
.k-badge.bad{background:rgba(255,93,93,.16);color:var(--bad)}
.k-badge.info{background:rgba(74,168,255,.14);color:var(--info)}
.k-badge.neu{background:rgba(139,147,167,.16);color:var(--muted)}
.k-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.k-tabs button{background:none;border:none;color:var(--muted);font-size:14px;font-weight:650;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.k-tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.k-kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.k-kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.k-kpi .v{font-size:30px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.k-kpi .d{font-size:13px}
.k-toast{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.k-toast div{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--info);padding:11px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:tin .25s}
.k-toast div.ok{border-left-color:var(--good)}.k-toast div.warn{border-left-color:var(--warn)}.k-toast div.bad{border-left-color:var(--bad)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.k-modal-ov{position:fixed;inset:0;background:rgba(4,6,10,.66);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px}
.k-modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:22px;animation:tin .2s}
.k-modal h2{margin:0 0 10px;font-size:19px}
.k-modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.k-empty{text-align:center;padding:48px 20px;color:var(--muted)}
.k-empty .big{font-size:40px;margin-bottom:10px}
.k-empty h3{color:var(--ink);margin:0 0 6px}
.k-muted{color:var(--muted)}
.k-bars .row{display:grid;grid-template-columns:170px 1fr 64px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.k-bars .tr{height:10px;background:#0e1219;border-radius:99px;overflow:hidden}
.k-bars .fl{height:100%;border-radius:99px;background:var(--accent);transition:width .5s}
.k-tl{position:relative;padding-left:26px}
.k-tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.k-tl .ev{position:relative;margin:0 0 16px}
.k-tl .ev:before{content:"";position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--muted)}
.k-tl .ev.ok:before{background:var(--good)}.k-tl .ev.warn:before{background:var(--warn)}
.k-tl .ev.bad:before{background:var(--bad)}.k-tl .ev.info:before{background:var(--info)}
.k-tl .t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.k-tl .ti{font-weight:700;font-size:14px}
.k-tl .b{font-size:13px;color:var(--muted)}
.k-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.k-code{background:#0a0d12;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto}
.k-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:13px}
.k-search{max-width:280px;margin-bottom:10px}
.k-prog{height:10px;background:#0e1219;border-radius:99px;overflow:hidden}
.k-prog>div{height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.k-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}
.pulse{animation:pl 1.4s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}


:root{--bg:#0d0a0c;--panel:#151114;--panel2:#1d171b;--ink:#f6efef;--muted:#a89a9a;
--line:#2c2226;--accent:#ff5d5d;--accent2:#ffb020;--good:#3ddc84;--warn:#ffb020;--bad:#ff5d5d;--info:#4aa8ff}
textarea.k-input{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;min-height:300px;resize:vertical}
.sev{font-weight:800}
.finding{border-left:4px solid var(--muted);padding:12px 14px;margin-bottom:10px;background:var(--panel);border-radius:0 10px 10px 0}
.finding.critical{border-color:var(--bad)} .finding.high{border-color:var(--warn)} .finding.medium{border-color:var(--info)}

</style></head><body>

def('tabs',function(host,tabs){host=typeof host==='string'?document.querySelector(host):host;var bar=K.el('<div class="k-tabs"></div>');var panel=K.el('<div></div>');host.appendChild(bar);host.appendChild(panel);var cur=null;tabs.forEach(function(t,i){var b=K.el('<button class="'+(i===0?'on':'')+'">'+K.esc(t.label)+'</button>');b.onclick=function(){bar.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');panel.innerHTML='';cur=t.id;if(t.render)t.render(panel)};bar.appendChild(b)});if(tabs[0]&&tabs[0].render)tabs[0].render(panel);return{select:function(id){var b=Array.prototype.find.call(bar.children,function(x,i){return tabs[i].id===id});if(b)b.click()}}});

def('timeline',function(host,events){host=typeof host==='string'?document.querySelector(host):host;var w=K.el('<div class="k-tl"></div>');events.forEach(function(e){var inner='<div class="t">'+K.esc(e.t||'')+'</div><div class="ti">'+K.esc(e.title)+'</div>';if(e.body)inner+='<div class="b">'+e.body+'</div>';w.appendChild(K.el('<div class="ev '+(e.kind||'')+'">'+inner+'</div>'))});host.appendChild(w);return w});
def('graph',function(host,data,opts){host=typeof host==='string'?document.querySelector(host):host;opts=opts||{};var W=760,H=440,cx=W/2,cy=H/2,R=Math.min(W,H)/2-70;var pos={};data.nodes.forEach(function(nd,i){var a=-Math.PI/2+i*2*Math.PI/data.nodes.length;pos[nd.id]={x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)}});var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';svg+='<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8b93a7" stroke-width="1.5"/></marker></defs>';data.edges.forEach(function(e){var a=pos[e.a],b=pos[e.b];if(!a||!b)return;svg+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="#3a4358" stroke-width="1.6" marker-end="url(#ah)"/>';if(e.label)svg+='<text x="'+((a.x+b.x)/2)+'" y="'+((a.y+b.y)/2-6)+'" fill="#8b93a7" font-size="10" text-anchor="middle">'+K.esc(e.label)+'</text>'});data.nodes.forEach(function(nd){var p=pos[nd.id];var c=nd.color||'#4aa8ff';svg+='<g class="gn" data-id="'+K.esc(nd.id)+'" style="cursor:pointer"><circle cx="'+p.x+'" cy="'+p.y+'" r="26" fill="#141821" stroke="'+c+'" stroke-width="2.5"/><text x="'+p.x+'" y="'+(p.y+5)+'" text-anchor="middle" fill="'+c+'" font-size="13" font-weight="800">'+K.esc(nd.label.slice(0,4))+'</text><text x="'+p.x+'" y="'+(p.y+44)+'" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="700">'+K.esc(nd.label)+'</text>'+(nd.sub?'<text x="'+p.x+'" y="'+(p.y+58)+'" text-anchor="middle" fill="#8b93a7" font-size="10">'+K.esc(nd.sub)+'</text>':'')+'</g>'});svg+='</svg>';var d=K.el('<div>'+svg+'</div>');host.appendChild(d);if(opts.onNode){d.querySelectorAll('.gn').forEach(function(g){g.addEventListener('click',function(){var nd=null;data.nodes.forEach(function(x){if(x.id===g.getAttribute('data-id'))nd=x});opts.onNode(nd)})})}return d});
def('table',function(host,cols,rows,opts){host=typeof host==='string'?document.querySelector(host):host;opts=opts||{};var q='',page=0,ps=opts.pageSize||8;var wrap=K.el('<div></div>');host.appendChild(wrap);function render(){wrap.innerHTML='';var frows=rows.filter(function(r){if(!q)return true;return cols.some(function(c){var v=r[c.key];return String(v==null?'':v).toLowerCase().indexOf(q)>=0})});var pages=Math.max(1,Math.ceil(frows.length/ps));if(page>=pages)page=pages-1;var slice=frows.slice(page*ps,page*ps+ps);var h='<table class="k-table"><thead><tr>'+cols.map(function(c){return '<th'+(c.num?' style="text-align:right"':'')+'>'+K.esc(c.label)+'</th>'}).join('')+'</tr></thead><tbody>';slice.forEach(function(r){h+='<tr>'+cols.map(function(c){var v=r[c.key];var s=c.fmt?c.fmt(v,r):K.esc(v==null?'':v);return '<td'+(c.num?' style="text-align:right"':'')+'>'+s+'</td>'}).join('')+'</tr>'});h+='</tbody></table>';if(!slice.length)h+='<div class="k-empty"><h3>No rows match</h3><p>Try a different search.</p></div>';wrap.innerHTML=h;var ft=K.el('<div class="k-foot"><span>'+frows.length+' row(s) · page '+(page+1)+' of '+pages+'</span><span></span></div>');var pv=ft.children[1];if(pages>1){var b1=K.el('<button class="k-btn" style="padding:5px 12px;margin-right:6px">← Prev</button>');var b2=K.el('<button class="k-btn" style="padding:5px 12px">Next →</button>');b1.disabled=page===0;b2.disabled=page===pages-1;b1.onclick=function(){page--;render()};b2.onclick=function(){page++;render()};pv.appendChild(b1);pv.appendChild(b2)}wrap.appendChild(ft)}if(opts.search){var si=K.el('<input class="k-input k-search" placeholder="Search…">');si.oninput=function(){q=si.value.toLowerCase();page=0;render()};host.insertBefore(si,wrap)}render();return{refresh:function(nr){rows=nr;render()}}});
})();
</script>
<div id="app"></div>
<script>

const K = window.Kit;
K.nav({title:'MCPatrol', sub:'MCP Security Scanner · audit any MCP server in seconds', logo:'MP', actions:[]});

const RULES=[
 {id:'destructive', sev:'critical', title:'Destructive capability', test:function(t){return /delete|remove|rm\b|destroy|wipe|format/i.test(t.name+' '+t.description)&&/recurs|rf|tree|force/i.test(t.name+' '+t.description+' '+JSON.stringify(t.inputSchema||{}))}, fix:'Scope to an allowlisted directory, require human confirmation, and drop the force flag.'},
 {id:'exec', sev:'critical', title:'Arbitrary code execution', test:function(t){return /arbitrary|shell|command|exec|eval|script/i.test(t.name+' '+t.description)}, fix:'Replace with a constrained allowlist of commands, or sandbox in a container with no network.'},
 {id:'exfil-net', sev:'high', title:'Network egress (exfiltration path)', test:function(t){return /fetch|http|url|request|webhook|post/i.test(t.name+' '+t.description)}, fix:'Restrict to an allowlisted domain set; log every outbound body.'},
 {id:'secret-read', sev:'high', title:'Credential / secret access', test:function(t){return /env|secret|credential|token|api[_-]?key|password/i.test(t.name+' '+t.description)}, fix:'Expose only prefixed vars (e.g. PUBLIC_) or route through a secrets broker.'},
 {id:'write', sev:'medium', title:'Unscoped write', test:function(t){return /write|create|put|save/i.test(t.name+' '+t.description)}, fix:'Constrain writes to a sandbox directory; validate paths against traversal (../).'},
 {id:'traversal', sev:'high', title:'Path traversal risk', test:function(t){var s=JSON.stringify(t.inputSchema||{});return /path|file|dir/i.test(t.name)&&!/allowlist|root|base/i.test(t.description)}, fix:'Resolve all paths against a root and reject escapes.'},
];

const app=document.getElementById('app');
app.innerHTML='<div class="k-wrap">'
 +'<div class="k-hero"><h1>Point it at an MCP server. Get a threat model.</h1><p>MCPatrol statically analyzes MCP tool manifests for destructive capabilities, exfiltration paths, and excessive scopes — before you hand the server to an agent.</p></div>'
 +'<div class="k-split"><div class="k-card"><h3>Server manifest <span class="k-muted" style="font-weight:400">— preloaded demo: filesystem-plus</span></h3><textarea class="k-input" id="manifest"></textarea><div style="margin-top:12px;display:flex;gap:10px"><button class="k-btn k-primary" id="btn-scan">🔍 Run security scan</button><button class="k-btn" id="btn-sample">Load risky sample</button></div></div>'
 +'<div><div class="k-card"><h3>Risk score</h3><div id="risk"><div class="k-empty"><h3>Not scanned</h3><p>Run a scan to score this server.</p></div></div></div>'
 +'<div class="k-card" style="margin-top:14px"><h3>Capability inventory</h3><div id="caps"></div></div></div></div>'
 +'<div class="k-card" style="margin-top:14px"><h3>Findings</h3><div id="findings"><div class="k-empty"><h3>—</h3><p>Findings appear here after a scan.</p></div></div></div>'
 +'<div class="k-card" style="margin-top:14px"><h3>Least-privilege wrapper <span class="k-muted" style="font-weight:normal">— paste-ready config</span></h3><div id="wrapper"><div class="k-empty"><h3>—</h3><p>Run a scan to generate a deny-by-default wrapper for this server.</p></div></div></div>'
 +'</div>';

document.getElementById('manifest').value = "{\n  \"name\": \"filesystem-plus\",\n  \"version\": \"2.4.1\",\n  \"description\": \"Filesystem tools with extras\",\n  \"tools\": [\n    {\"name\": \"read_file\", \"description\": \"Read a file from disk\",\n     \"inputSchema\": {\"path\": \"string\"}},\n    {\"name\": \"list_dir\", \"description\": \"List directory contents\",\n     \"inputSchema\": {\"path\": \"string\"}},\n    {\"name\": \"write_file\", \"description\": \"Write content to a file\",\n     \"inputSchema\": {\"path\": \"string\", \"content\": \"string\"}},\n    {\"name\": \"delete_recursive\", \"description\": \"Recursively delete a directory tree, like rm -rf. Use with care.\",\n     \"inputSchema\": {\"path\": \"string\", \"force\": \"boolean\"}},\n    {\"name\": \"exec\", \"description\": \"Run an arbitrary shell command and return stdout\",\n     \"inputSchema\": {\"command\": \"string\", \"timeout\": \"number\"}},\n    {\"name\": \"fetch_url\", \"description\": \"Fetch a URL and return the body. Follows redirects.\",\n     \"inputSchema\": {\"url\": \"string\"}},\n    {\"name\": \"env_get\", \"description\": \"Read an environment variable by name\",\n     \"inputSchema\": {\"name\": \"string\"}}\n  ]\n}";
document.getElementById('btn-sample').onclick=function(){ document.getElementById('manifest').value="{\n  \"name\": \"filesystem-plus\",\n  \"version\": \"2.4.1\",\n  \"description\": \"Filesystem tools with extras\",\n  \"tools\": [\n    {\"name\": \"read_file\", \"description\": \"Read a file from disk\",\n     \"inputSchema\": {\"path\": \"string\"}},\n    {\"name\": \"list_dir\", \"description\": \"List directory contents\",\n     \"inputSchema\": {\"path\": \"string\"}},\n    {\"name\": \"write_file\", \"description\": \"Write content to a file\",\n     \"inputSchema\": {\"path\": \"string\", \"content\": \"string\"}},\n    {\"name\": \"delete_recursive\", \"description\": \"Recursively delete a directory tree, like rm -rf. Use with care.\",\n     \"inputSchema\": {\"path\": \"string\", \"force\": \"boolean\"}},\n    {\"name\": \"exec\", \"description\": \"Run an arbitrary shell command and return stdout\",\n     \"inputSchema\": {\"command\": \"string\", \"timeout\": \"number\"}},\n    {\"name\": \"fetch_url\", \"description\": \"Fetch a URL and return the body. Follows redirects.\",\n     \"inputSchema\": {\"url\": \"string\"}},\n    {\"name\": \"env_get\", \"description\": \"Read an environment variable by name\",\n     \"inputSchema\": {\"name\": \"string\"}}\n  ]\n}"; K.toast('Risky sample loaded','info'); };

function scan(){
  let m; const raw=document.getElementById('manifest').value;
  try{ m=JSON.parse(raw); }catch(e){ K.toast('Invalid JSON: '+e.message,'bad'); return; }
  const tools=m.tools||[];
  const findings=[];
  tools.forEach(function(t){
    RULES.forEach(function(r){
      try{ if(r.test(t)) findings.push({tool:t.name, sev:r.sev, id:r.id, title:r.title, fix:r.fix}); }catch(e){}
    });
  });
  const weights={critical:25, high:12, medium:5};
  let score=Math.min(100, findings.reduce(function(a,f){return a+weights[f.sev]},0));
  const rk=document.getElementById('risk'); rk.innerHTML='';
  const col=score>=70?'#ff5d5d':score>=35?'#ffb020':'#3ddc84';
  const d=K.el('<div style="display:flex;gap:18px;align-items:center"><div class="score" style="font-size:44px;font-weight:800;color:'+col+'">'+score+'<span style="font-size:16px;color:var(--muted)">/100</span></div><div><div>'+K.badge(score>=70?'DANGEROUS':score>=35?'RISKY':'LOW RISK', score>=70?'bad':score>=35?'warn':'ok')+'</div><div class="k-muted" style="font-size:13px;margin-top:6px">'+findings.length+' findings across '+tools.length+' tools</div></div></div>');
  rk.appendChild(d);
  const caps=document.getElementById('caps'); caps.innerHTML='';
  const capCount={destructive:0, network:0, secrets:0, write:0, read:0};
  tools.forEach(function(t){ const s=(t.name+' '+t.description).toLowerCase();
    if(/delete|exec|destroy|rm/.test(s))capCount.destructive++;
    if(/fetch|http|url/.test(s))capCount.network++;
    if(/env|secret|token/.test(s))capCount.secrets++;
    if(/write|create/.test(s))capCount.write++;
    if(/read|list|get/.test(s))capCount.read++;
  });
  K.bars(caps,[
    {label:'Destructive', value:capCount.destructive, color:'#ff5d5d'},
    {label:'Network egress', value:capCount.network, color:'#ffb020'},
    {label:'Secret access', value:capCount.secrets, color:'#ffb020'},
    {label:'Write', value:capCount.write, color:'#4aa8ff'},
    {label:'Read', value:capCount.read, color:'#3ddc84'}]);
  const f=document.getElementById('findings'); f.innerHTML='';
  if(!findings.length){ K.empty(f,'Clean','No risky capabilities detected in this manifest.','',null); renderWrapper(m,tools,[]); return; }
  const order={critical:0,high:1,medium:2};
  findings.sort(function(a,b){return order[a.sev]-order[b.sev]});
  findings.forEach(function(fn){
    const el=K.el('<div class="finding '+fn.sev+'"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+K.badge(fn.sev.toUpperCase(), fn.sev==='critical'?'bad':fn.sev==='high'?'warn':'info')+'<b>'+K.esc(fn.title)+'</b><span class="k-mono k-muted">'+K.esc(fn.tool)+'</span></div><div class="k-muted" style="font-size:13px;margin-top:6px">Fix: '+K.esc(fn.fix)+'</div></div>');
    f.appendChild(el);
  });
  K.toast('Scan complete: '+findings.length+' findings, risk '+score+'/100', score>=70?'bad':'warn');
  renderWrapper(m,tools,findings);
}
function renderWrapper(m, tools, findings){
  var w=document.getElementById('wrapper');
  function sevOf(tool){ var s='low'; findings.forEach(function(f){ if(f.tool===tool){ if(f.sev==='critical')s='critical'; else if(s!=='critical'&&f.sev==='high')s='high'; else if(s==='low'&&f.sev==='medium')s='medium'; } }); return s; }
  var MITIGATE={ 'exfil-net':'    allow_domains: ["<EDIT-ME>"]  # TODO: set your allowlist\n    log_bodies: true', 'secret-read':'    allow_prefix: "PUBLIC_"  # TODO: confirm prefix', 'write':'    root: "/srv/agent-workspace"  # TODO: set the sandbox root\n    reject_traversal: true', 'traversal':'    root: "/srv/agent-workspace"  # TODO: set the sandbox root\n    reject_traversal: true' };
  var lines=['# MCPatrol least-privilege wrapper — generated '+new Date().toISOString().slice(0,10),
    '# Deny-by-default: only the tools below may run, each inside its constraint.',
    'server: "'+String(m.name||'unknown').replace(/"/g,'')+'"',
    'version: "'+String(m.version||'?').replace(/"/g,'')+'"','mode: deny-by-default','allowed:'];
  var denied=[], constrained=[];
  tools.forEach(function(t){
    var sev=sevOf(t.name);
    if(sev==='critical'){ denied.push({tool:t.name,reason:findings.filter(function(f){return f.tool===t.name&&f.sev==='critical'}).map(function(f){return f.title}).join('; ')}); }
    else if(sev==='low'){ lines.push('  - tool: '+t.name+'   # read-only, low risk'); }
    else {
      var rules=findings.filter(function(f){return f.tool===t.name&&f.sev!=='low'});
      var mit=rules.map(function(r){return MITIGATE[r.id]}).filter(Boolean).join('\n');
      constrained.push({tool:t.name,sev:sev,mit:mit||'    review: true  # no automatic mitigation — review manually',reason:rules.map(function(r){return r.title}).join('; ')});
    }
  });
  if(denied.length){ lines.push('denied:'); denied.forEach(function(d){ lines.push('  - tool: '+d.tool); lines.push('    reason: "'+d.reason.replace(/"/g,"'")+'"'); }); }
  if(constrained.length){ lines.push('constrained:'); constrained.forEach(function(c){ lines.push('  - tool: '+c.tool+'  # '+c.sev+' — '+c.reason.replace(/"/g,"'")); lines.push(c.mit); }); }
  if(!denied.length&&!constrained.length){ lines.push('  # (no risky tools — full allowlist is safe)'); }
  lines.push('audit: true  # log every allowed call with args + timestamp');
  var yaml=lines.join('\n');
  w.innerHTML='<pre class="k-mono" id="wrap-yaml" style="white-space:pre-wrap;font-size:12.5px;line-height:1.55;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:380px;overflow:auto">'+K.esc(yaml)+'</pre>'
    +'<div style="margin-top:10px;display:flex;gap:10px;align-items:center"><button class="k-btn k-primary" id="btn-copy-wrap">⧉ Copy YAML</button><span class="k-muted" id="wrap-stat" style="font-size:13px">'+denied.length+' denied · '+constrained.length+' constrained · drop into your MCP gateway config</span></div>';
  document.getElementById('btn-copy-wrap').onclick=function(){
    function done(){ K.toast('Wrapper YAML copied to clipboard','ok'); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(yaml).then(done,function(){ fallback(); }); }
    else fallback();
    function fallback(){ var ta=document.createElement('textarea'); ta.value=yaml; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done();}catch(e){K.toast('Copy failed — select the text manually','bad');} document.body.removeChild(ta); }
  };
}
document.getElementById('btn-scan').onclick=scan;
setTimeout(scan, 1000); /* magic moment: auto-scan flags the rm-rf-shaped tool */

</script>
</body></html>
