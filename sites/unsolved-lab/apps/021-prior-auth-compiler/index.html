<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AuthAssemble — Unsolved Lab</title>
<link rel="stylesheet" href="../../shared/kit.css">
<style>
/* Minimal base styles — only matters if ../../shared/kit.css hasn't loaded yet. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#eef1f5; --ink:#16202e; --muted:#67727f;
  --line:#e2e6ec; --accent:#2563eb; --accent2:#7c3aed; --good:#16a34a; --warn:#d97706; --bad:#dc2626;
  font-size:15px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
.k-wrap{max-width:1120px;margin:0 auto;padding:16px}
.k-nav{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.k-nav-in{display:flex;justify-content:space-between;align-items:center;gap:12px}
.k-nav-title{font-weight:700;font-size:18px}
.k-nav-sub{color:var(--muted);font-size:13px}
.k-nav-actions{display:flex;gap:8px;align-items:center}
.k-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:14px 0}
.k-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.k-card h3{margin:0 0 8px;font-size:15px}
.k-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
.k-btn:hover{background:var(--panel2)}
.k-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.k-primary:hover{filter:brightness(.95)}
.k-input,.k-select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;background:var(--panel);color:var(--ink);width:100%}
.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th,.k-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.k-table th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.k-table td.num,.k-table th.num{text-align:right}
.k-badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.k-badge.ok{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.k-badge.warn{background:#fef3c7;color:#92400e;border-color:#fde68a}
.k-badge.bad{background:#fee2e2;color:#991b1b;border-color:#fecaca}
.k-badge.info{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}
.k-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.k-tab{border:none;background:none;padding:10px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.k-tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.k-kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.k-kpi-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.k-kpi-val{font-size:26px;font-weight:700;margin-top:4px}
.k-kpi-delta{font-size:13px;color:var(--muted);margin-top:2px}
.k-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:all .3s;z-index:999;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.k-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.k-toast.ok{background:#166534}.k-toast.bad{background:#991b1b}.k-toast.warn{background:#92400e}
.k-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.k-modal{background:var(--panel);border-radius:14px;max-width:520px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.k-modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.k-modal-b{padding:18px}.k-modal-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.k-modal-x{border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.k-empty{text-align:center;padding:48px 20px;color:var(--muted)}
.k-empty-t{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:6px}
.k-empty-s{font-size:14px;margin-bottom:14px}
.k-hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin:14px 0}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.k-muted{color:var(--muted)}
.k-timeline{position:relative;padding-left:26px}
.k-tl-item{position:relative;margin-bottom:14px}
.k-tl-dot{position:absolute;left:-21px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.k-tl-item.warn .k-tl-dot{background:var(--warn)}
.k-tl-item.bad .k-tl-dot{background:var(--bad)}
.k-tl-item.ok .k-tl-dot{background:var(--good)}
.k-tl-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.k-tl-t{font-size:12px;color:var(--muted)}
.k-tl-title{font-weight:600;font-size:14px}
.k-tl-body{font-size:13px;color:var(--muted)}
.k-bar-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.k-bar-label{width:170px;font-size:13px}
.k-bar-track{flex:1;background:var(--panel2);border-radius:6px;height:12px;overflow:hidden}
.k-bar-fill{height:100%;border-radius:6px}
.k-bar-val{width:70px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.k-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.k-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.k-donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
@media(max-width:720px){.k-split{grid-template-columns:1fr}.k-bar-label{width:110px}}
.demo-note{display:inline-block;font-size:12px;background:#fef9c3;color:#854d0e;border:1px solid #fde68a;border-radius:6px;padding:3px 10px;margin:8px 0}

</style>
</head>
<body>
<style>
:root{--accent:#0f766e;--accent2:#b45309;--bg:#f7f4ec;--panel:#fffdf8;--panel2:#efe9d8;--ink:#1c2420;--line:#e3dac4;--good:#15803d;--warn:#b45309;--bad:#b91c1c}
.auth-wrap{max-width:1080px;margin:0 auto;padding:0 16px 40px}
.step-pills{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.step-pill{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.step-pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.step-pill.done{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.doc-row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff}
.doc-row.missing{border-color:#fca5a5;background:#fef2f2}
.doc-row .st{margin-left:auto}
.checkline{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.packet{background:#fffdf8;border:2px dashed var(--accent);border-radius:12px;padding:18px;margin-top:14px;font-size:14px}
.score-ring{font-size:34px;font-weight:800;color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
</style>
<div class="auth-wrap">
  <div class="demo-note">DEMO — all patients, payers, and documents are fictional seeded data.</div>
  <div class="step-pills" id="pills"></div>
  <div class="k-hero">
    <h2 style="margin:0 0 4px">Prior-Auth Compiler</h2>
    <p class="k-muted" style="margin:0 0 12px">Pick a procedure and payer. AuthAssemble pulls the payer's requirement set, matches it against the patient's chart, and compiles a submission packet — flagging exactly what's missing.</p>
    <div class="grid2">
      <div><label class="k-muted" style="font-size:12px">PROCEDURE</label><select id="proc" class="k-select"></select></div>
      <div><label class="k-muted" style="font-size:12px">PAYER</label><select id="payer" class="k-select"></select></div>
    </div>
    <div class="checkline" style="margin-top:10px"><input type="checkbox" id="demoPatient" checked> <label for="demoPatient">Use demo patient <b>Maya R. (DOB 1989-04-12)</b> — chart auto-attached</label></div>
    <div class="checkline"><input type="checkbox" id="appealMode"> <label for="appealMode"><b>Denial received</b> — compile an appeal packet instead</label></div>
    <div id="denialRow" style="display:none;margin-top:8px"><label class="k-muted" style="font-size:12px">DENIAL REASON CODE</label><select id="denialCode" class="k-select"><option value="CO-50">CO-50 — Non-covered service (not medically necessary)</option><option value="CO-96">CO-96 — Non-covered charges</option><option value="CO-197">CO-197 — Precertification/authorization absent</option><option value="CO-22">CO-22 — May be covered by another payer (COB)</option></select></div>
    <div style="margin-top:10px"><button class="k-btn k-primary" id="compileBtn">⚙ Compile packet</button>
    <button class="k-btn" id="resetBtn">Reset chart</button></div>
  </div>
  <div id="out"></div>
</div>
<script src="../../shared/kit.js"></script>
<script>
/* Unsolved Lab Kit fallback — fills window.Kit if ../../shared/kit.js is absent.
   Implements the exact contract from the sprint brief. If the real kit loads,
   this block is a no-op. All functions dependency-free. */
(function(){
if (window.Kit && window.Kit.__real) return;
var K = window.Kit || {};
if (K.__real) return;
function xmur3(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return (h^=h>>>16)>>>0;};}
function mulberry32(a){return function(){var t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;};}
K.rng=function(seedStr){var f=xmur3(String(seedStr));return mulberry32(f());};
K.pick=function(fn,arr){return arr[Math.floor(fn()*arr.length)];};
K.int=function(fn,a,b){return a+Math.floor(fn()*(b-a+1));};
K.shuffle=function(fn,arr){arr=arr.slice();for(var i=arr.length-1;i>0;i--){var j=Math.floor(fn()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;};
var _uid=0;K.uid=function(p){return (p||'id')+'-'+(++_uid)+'-'+Math.floor(Math.random()*1e6).toString(36);};
K.esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
K.el=function(html){var d=document.createElement('div');d.innerHTML=html;return d.firstElementChild||d;};
K.store=function(ns){var p='ulab:'+ns+':';return{get:function(k,fb){try{var v=localStorage.getItem(p+k);return v==null?fb:JSON.parse(v);}catch(e){return fb;}},set:function(k,v){try{localStorage.setItem(p+k,JSON.stringify(v));}catch(e){}},del:function(k){localStorage.removeItem(p+k);}};};
K.nav=function(o){var bar=document.querySelector('[data-kit-nav]');if(!bar){bar=document.createElement('header');bar.setAttribute('data-kit-nav','');bar.className='k-nav';document.body.insertBefore(bar,document.body.firstChild);}bar.innerHTML='<div class="k-wrap k-nav-in"><div><div class="k-nav-title">'+K.esc(o.title||'')+'</div>'+(o.sub?'<div class="k-nav-sub">'+K.esc(o.sub)+'</div>':'')+'</div><div class="k-nav-actions">'+(o.actions||'')+'</div></div>';};
K.toast=function(msg,kind){var t=document.createElement('div');t.className='k-toast '+(kind||'');t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.classList.add('show');},10);setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove();},400);},2600);};
K.modal=function(o){var ov=document.createElement('div');ov.className='k-modal-ov';ov.innerHTML='<div class="k-modal" role="dialog"><div class="k-modal-h">'+K.esc(o.title||'')+'<button class="k-btn k-modal-x" aria-label="Close">&times;</button></div><div class="k-modal-b"></div>'+(o.actions?'<div class="k-modal-f"></div>':'')+'</div>';ov.querySelector('.k-modal-b').appendChild(typeof o.body==='string'?K.el('<div>'+o.body+'</div>'):o.body);if(o.actions){var f=ov.querySelector('.k-modal-f');o.actions.forEach(function(a){var b=K.el('<button class="k-btn '+(a.kind||'')+'">'+K.esc(a.label)+'</button>');b.onclick=function(){if(a.onClick)a.onClick();if(!a.keep)ov.remove();};f.appendChild(b);});}ov.querySelector('.k-modal-x').onclick=function(){ov.remove();};ov.onclick=function(e){if(e.target===ov)ov.remove();};document.body.appendChild(ov);return ov;};
K.tabs=function(host,defs){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';var bar=document.createElement('div');bar.className='k-tabs';var body=document.createElement('div');defs.forEach(function(d,i){var b=document.createElement('button');b.className='k-tab'+(i===0?' active':'');b.textContent=d.label;b.onclick=function(){bar.querySelectorAll('.k-tab').forEach(function(x){x.classList.remove('active');});b.classList.add('active');body.innerHTML='';d.render(body);};bar.appendChild(b);});host.appendChild(bar);host.appendChild(body);if(defs[0])defs[0].render(body);};
K.table=function(host,cols,rows,opts){host=typeof host==='string'?document.querySelector(host):host;opts=opts||{};host.innerHTML='';var wrap=document.createElement('div');var q='';if(opts.search){var inp=document.createElement('input');inp.className='k-input';inp.placeholder='Search…';inp.style.marginBottom='8px';inp.oninput=function(){q=inp.value.toLowerCase();draw();};wrap.appendChild(inp);}var tdiv=document.createElement('div');wrap.appendChild(tdiv);host.appendChild(wrap);function draw(){var rr=rows.filter(function(r){return !q||JSON.stringify(r).toLowerCase().indexOf(q)>=0;});var ps=opts.pageSize||rr.length;var h='<table class="k-table"><thead><tr>'+cols.map(function(c){return '<th class="'+(c.num?'num':'')+'">'+K.esc(c.label)+'</th>';}).join('')+'</tr></thead><tbody>';rr.slice(0,ps).forEach(function(r){h+='<tr>'+cols.map(function(c){var v=r[c.key];if(c.fmt)v=c.fmt(v,r);return '<td class="'+(c.num?'num':'')+'">'+(v==null?'':v)+'</td>';}).join('')+'</tr>';});h+='</tbody></table>';if(rr.length>ps)h+='<div class="k-muted" style="font-size:12px;margin-top:6px">Showing '+ps+' of '+rr.length+'</div>';tdiv.innerHTML=h;}draw();};
function svgEl(tag,attrs){var e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(var k in attrs)e.setAttribute(k,attrs[k]);return e;}
K.bars=function(host,items){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';var mx=Math.max.apply(null,items.map(function(i){return i.value;}))||1;items.forEach(function(it){var row=document.createElement('div');row.className='k-bar-row';row.innerHTML='<div class="k-bar-label">'+K.esc(it.label)+'</div><div class="k-bar-track"><div class="k-bar-fill" style="width:'+Math.round(it.value/mx*100)+'%;background:'+(it.color||'var(--accent)')+'"></div></div><div class="k-bar-val">'+K.num(it.value)+'</div>';host.appendChild(row);});};
K.line=function(host,series){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';var W=560,H=180,P=28;var all=[];series.forEach(function(s){s.points.forEach(function(p){all.push(p);});});var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);if(mx===mn)mx=mn+1;var svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,width:'100%'});series.forEach(function(s,si){var n=s.points.length;var d=s.points.map(function(p,i){var x=P+i*(W-2*P)/(n-1||1);var y=H-P-(p-mn)/(mx-mn)*(H-2*P);return (i?'L':'M')+x.toFixed(1)+','+y.toFixed(1);}).join(' ');var path=svgEl('path',{d:d,fill:'none',stroke:s.color||['#3b82f6','#10b981','#f59e0b','#ef4444'][si%4],'stroke-width':2});svg.appendChild(path);});var lg=document.createElement('div');lg.className='k-legend';series.forEach(function(s,si){lg.innerHTML+='<span><i style="background:'+(s.color||['#3b82f6','#10b981','#f59e0b','#ef4444'][si%4])+'"></i>'+K.esc(s.name)+'</span>';});host.appendChild(svg);host.appendChild(lg);};
K.donut=function(host,items){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';var tot=items.reduce(function(a,i){return a+i.value;},0)||1;var cols=['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4'];var off=25;var svg=svgEl('svg',{viewBox:'0 0 120 120',width:'140',height:'140'});items.forEach(function(it,i){var frac=it.value/tot;var c=svgEl('circle',{cx:60,cy:60,r:44,fill:'none',stroke:it.color||cols[i%cols.length],'stroke-width':16,'stroke-dasharray':(frac*276.46).toFixed(1)+' 276.46','stroke-dashoffset':(-off).toFixed(1),transform:'rotate(-90 60 60)'});svg.appendChild(c);off-=frac*100;});var wrap=document.createElement('div');wrap.className='k-donut-wrap';wrap.appendChild(svg);var lg=document.createElement('div');lg.className='k-legend';items.forEach(function(it,i){lg.innerHTML+='<span><i style="background:'+(it.color||cols[i%cols.length])+'"></i>'+K.esc(it.label)+' — '+K.num(it.value)+'</span>';});wrap.appendChild(lg);host.appendChild(wrap);};
K.timeline=function(host,events){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';var tl=document.createElement('div');tl.className='k-timeline';events.forEach(function(e){var it=document.createElement('div');it.className='k-tl-item '+(e.kind||'');it.innerHTML='<div class="k-tl-dot"></div><div class="k-tl-card"><div class="k-tl-t">'+K.esc(e.t||'')+'</div><div class="k-tl-title">'+K.esc(e.title||'')+'</div>'+(e.body?'<div class="k-tl-body">'+e.body+'</div>':'')+'</div>';tl.appendChild(it);});host.appendChild(tl);};
K.graph=function(host,g){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';var W=560,H=300;var nodes=g.nodes,edges=g.edges||[];var cx=W/2,cy=H/2,R=Math.min(W,H)/2-50;nodes.forEach(function(n,i){var a=i/nodes.length*Math.PI*2-Math.PI/2;n.x=cx+R*Math.cos(a);n.y=cy+R*Math.sin(a);});var svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,width:'100%'});edges.forEach(function(e){var a=nodes.find(function(n){return n.id===e.a;}),b=nodes.find(function(n){return n.id===e.b;});if(!a||!b)return;svg.appendChild(svgEl('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#9ca3af','stroke-width':1.5}));if(e.label){var t=svgEl('text',{x:(a.x+b.x)/2,y:(a.y+b.y)/2-4,'text-anchor':'middle','font-size':9,fill:'#6b7280'});t.textContent=e.label;svg.appendChild(t);}});nodes.forEach(function(n){svg.appendChild(svgEl('circle',{cx:n.x,cy:n.y,r:24,fill:n.color||'#3b82f6',stroke:'#fff','stroke-width':2}));var t=svgEl('text',{x:n.x,y:n.y-30,'text-anchor':'middle','font-size':11,fill:'currentColor','font-weight':600});t.textContent=n.label;svg.appendChild(t);if(n.sub){var s2=svgEl('text',{x:n.x,y:n.y+34,'text-anchor':'middle','font-size':9,fill:'#6b7280'});s2.textContent=n.sub;svg.appendChild(s2);}});host.appendChild(svg);};
K.badge=function(txt,kind){return '<span class="k-badge '+(kind||'')+'">'+K.esc(txt)+'</span>';};
K.kpi=function(host,o){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='<div class="k-kpi"><div class="k-kpi-label">'+K.esc(o.label)+'</div><div class="k-kpi-val">'+o.value+'</div>'+(o.delta?'<div class="k-kpi-delta">'+K.esc(o.delta)+'</div>':'')+'</div>';};
K.empty=function(host,title,sub,al,afn){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='<div class="k-empty"><div class="k-empty-t">'+K.esc(title)+'</div>'+(sub?'<div class="k-empty-s">'+K.esc(sub)+'</div>':'')+(al?'<button class="k-btn k-primary">'+K.esc(al)+'</button>':'')+'</div>';if(al&&afn)host.querySelector('button').onclick=afn;};
K.money=function(n){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
K.num=function(n){return Number(n).toLocaleString('en-US');};
K.pct=function(x){return (x*100).toFixed(1)+'%';};
K.when=function(d){var dt=new Date(d);return isNaN(dt)?String(d):dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});};
K.initials=function(name){return String(name).split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();};
K.copy=function(txt){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){K.toast('Copied','ok');},function(){K.toast('Copy failed','bad');});}else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');K.toast('Copied','ok');}catch(e){K.toast('Copy failed','bad');}ta.remove();}};
K.__fallback=true;
window.Kit=K;
})();

</script>

<script>

(function(){
var R=Kit.rng('authassemble-21');
var PROCEDURES=[
 {id:'mri-knee',code:'73721',name:'MRI knee w/o contrast',reqs:['Recent office note (within 90 days)','Conservative therapy failure (6 wks PT)','X-ray of knee (within 12 months)','BMI and vitals on file','Prior imaging comparison']},
 {id:'spine',code:'72148',name:'MRI lumbar spine w/o contrast',reqs:['Neurological exam note','Conservative therapy failure (6 wks)','Red-flag screening documented','X-ray lumbar spine','Pain scale >= 6 documented']},
 {id:'sleep',code:'95810',name:'Polysomnography (sleep study)',reqs:['Sleep questionnaire (Epworth)','BMI documented','Witnessed apnea note','Cardiopulmonary clearance','Prior home sleep test if any']}
];
var PAYERS=[
 {id:'meridian',name:'Meridian Health PPO',quirks:['Requires fax cover sheet with NPI','Turnaround 3–5 business days','Peer-to-peer window 9am–5pm ET']},
 {id:'summit',name:'Summit Care HMO',quirks:['Referral from PCP required first','Portal upload only — no fax','Turnaround 7–10 business days']},
 {id:'liberty',name:'Liberty Shield EPO',quirks:['Pre-cert via phone for MRI codes','48-hr urgent track available','Requires facility NPI on form']}
];
// Demo patient chart: for MRI knee, 2 docs missing by design
var CHART={
 'mri-knee':[
   {doc:'Recent office note (within 90 days)',have:true,src:'Dr. Alvarez — 2026-08-30'},
   {doc:'Conservative therapy failure (6 wks PT)',have:false,src:'Missing — only 3 weeks of PT on file'},
   {doc:'X-ray of knee (within 12 months)',have:true,src:'Radiology — 2026-05-14'},
   {doc:'BMI and vitals on file',have:true,src:'Vitals — 2026-08-30'},
   {doc:'Prior imaging comparison',have:false,src:'Missing — no prior knee MRI found'}
 ],
 'spine':[
   {doc:'Neurological exam note',have:true,src:'Dr. Okafor — 2026-09-02'},
   {doc:'Conservative therapy failure (6 wks)',have:true,src:'PT notes — 2026-07-20'},
   {doc:'Red-flag screening documented',have:false,src:'Missing'},
   {doc:'X-ray lumbar spine',have:true,src:'Radiology — 2026-06-11'},
   {doc:'Pain scale >= 6 documented',have:true,src:'Intake — 8/10'}
 ],
 'sleep':[
   {doc:'Sleep questionnaire (Epworth)',have:true,src:'Intake — score 14'},
   {doc:'BMI documented',have:true,src:'Vitals — 31.2'},
   {doc:'Witnessed apnea note',have:false,src:'Missing — partner statement needed'},
   {doc:'Cardiopulmonary clearance',have:false,src:'Missing'},
   {doc:'Prior home sleep test if any',have:true,src:'N/A — none ordered'}
 ]
};
var chartState=JSON.parse(JSON.stringify(CHART));
var procSel=document.getElementById('proc'),payerSel=document.getElementById('payer');
PROCEDURES.forEach(function(p){var o=document.createElement('option');o.value=p.id;o.textContent=p.code+' — '+p.name;procSel.appendChild(o);});
PAYERS.forEach(function(p){var o=document.createElement('option');o.value=p.id;o.textContent=p.name;payerSel.appendChild(o);});
var pills=document.getElementById('pills');
function setPills(stage){var s=['Select','Compile','Review gaps','Packet'];pills.innerHTML=s.map(function(x,i){var cls=i<stage?'done':(i===stage?'on':'');return '<span class="step-pill '+cls+'">'+(i+1)+'. '+x+'</span>';}).join('');}
setPills(0);
document.getElementById('resetBtn').onclick=function(){chartState=JSON.parse(JSON.stringify(CHART));document.getElementById('out').innerHTML='';setPills(0);Kit.toast('Chart reset to demo state');};
var APPEALS={
 'CO-50':{why:'The payer says the service was not medically necessary.',counter:['Physician medical-necessity letter (template below)','2 peer-reviewed citations supporting the procedure','Failed conservative-therapy notes','Pain / function scores before and after']},
 'CO-96':{why:'The payer classified the charges as non-covered.',counter:['Itemized statement for the date of service','Benefit booklet excerpt showing the covered category','Explanation of benefits (EOB) with the denial code']},
 'CO-197':{why:'No precertification or authorization was on file.',counter:['Retro-authorization request form','Clinical notes from the date of service','PCP referral on file (if HMO)']},
 'CO-22':{why:'Another payer may be primary (coordination of benefits).',counter:['Other-insurance denial letter or EOB','Completed COB questionnaire','Proof of primary-payer determination']}
};
document.getElementById('appealMode').onchange=function(e){
  var on=e.target.checked;
  document.getElementById('denialRow').style.display=on?'block':'none';
  document.getElementById('compileBtn').textContent=on?'\u2696 Compile appeal packet':'\u2699 Compile packet';
};
function compileAppeal(proc,payer){
  var code=document.getElementById('denialCode').value;
  var a=APPEALS[code];var ref='APL-'+Math.floor(100000+R()*900000);
  setPills(3);
  var out=document.getElementById('out');
  out.innerHTML='<div class="k-card"><div class="k-kpi-label">APPEAL PACKET</div><h3 style="margin:4px 0">Denial '+Kit.esc(code)+' — '+Kit.esc(proc.name)+'</h3>'
   +'<div class="k-muted" style="font-size:13.5px">'+Kit.esc(a.why)+'</div>'
   +'<div style="margin:8px 0">'+Kit.badge(payer.name,'info')+' <span class="k-muted" style="font-size:12.5px">Reference '+ref+'</span></div></div>'
   +'<div class="k-card"><h3>Counter-evidence checklist</h3><div id="applist"></div></div>'
   +'<div class="k-card"><h3>Draft appeal letter</h3><textarea id="appealLetter" rows="12" style="width:100%;font:13px/1.5 ui-monospace,monospace;padding:10px;border:1px solid var(--line);border-radius:8px" readonly></textarea>'
   +'<div style="margin-top:8px;display:flex;gap:8px"><button class="k-btn k-primary" id="copyAppeal">Copy letter</button><button class="k-btn" id="appealDone">Mark appeal filed</button></div></div>';
  var dl=out.querySelector('#applist');
  a.counter.forEach(function(c){
    var row=document.createElement('div');row.className='doc-row';
    row.innerHTML='<input type="checkbox" aria-label="gathered"> <div><b>'+Kit.esc(c)+'</b></div>';
    dl.appendChild(row);
  });
  out.querySelector('#appealLetter').value=
   'Re: Appeal of denial '+code+' — '+proc.name+'\n'
   +'Patient: Maya R. (DOB 1989-04-12, MRN MR-884210 — fictional)\n'
   +'Payer: '+payer.name+'   Appeal ref: '+ref+'\n\n'
   +'To the Medical Review Department:\n\n'
   +'I am writing to appeal the denial ('+code+') of '+proc.name+' ('+proc.code+').\n'
   +a.why+'\n\n'
   +'Enclosed counter-evidence:\n'+a.counter.map(function(c,i){return (i+1)+'. '+c;}).join('\n')+'\n\n'
   +'The procedure meets medical-necessity criteria per the enclosed documentation.\n'
   +'Please reconsider and issue a revised determination within your appeal window.\n\n'
   +'Sincerely,\nDr. Alvarez, NPI 1845567290 (fictional)';
  out.querySelector('#copyAppeal').onclick=function(){Kit.copy(out.querySelector('#appealLetter').value);};
  out.querySelector('#appealDone').onclick=function(){Kit.toast('Appeal '+ref+' marked filed','ok');};
  out.scrollIntoView({behavior:'smooth',block:'start'});
}
document.getElementById('compileBtn').onclick=function(){
  if(document.getElementById('appealMode').checked){
    var proc0=PROCEDURES.find(function(p){return p.id===procSel.value;});
    var payer0=PAYERS.find(function(p){return p.id===payerSel.value;});
    compileAppeal(proc0,payer0);return;
  }
  var proc=PROCEDURES.find(function(p){return p.id===procSel.value;});
  var payer=PAYERS.find(function(p){return p.id===payerSel.value;});
  var docs=chartState[proc.id];
  var have=docs.filter(function(d){return d.have;}).length;
  var score=Math.round(have/docs.length*100);
  setPills(score===100?3:2);
  var out=document.getElementById('out');
  out.innerHTML=
   '<div class="k-grid">'
   +'<div class="k-card"><div class="k-kpi-label">READINESS SCORE</div><div class="score-ring">'+score+'%</div><div class="k-muted" style="font-size:13px">'+have+' of '+docs.length+' requirements met</div></div>'
   +'<div class="k-card"><h3>'+Kit.esc(payer.name)+' quirks</h3><ul style="margin:0;padding-left:18px;font-size:14px">'+payer.quirks.map(function(q){return '<li>'+Kit.esc(q)+'</li>';}).join('')+'</ul></div>'
   +'<div class="k-card"><h3>Patient</h3><div style="font-size:14px">Maya R. · DOB 1989-04-12<br><span class="k-muted">MRN MR-884210 (fictional)</span><br>'+Kit.badge('Chart attached','ok')+'</div></div>'
   +'</div>'
   +'<div class="k-card"><h3>Requirement checklist — '+Kit.esc(proc.name)+'</h3><div id="doclist"></div>'
   +'<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="k-btn k-primary" id="genBtn" '+(score<100?'disabled title="Resolve missing items first"':'')+'>Generate submission packet</button>'
   +(score<100?'<span class="k-muted" style="font-size:13px;align-self:center">'+Kit.badge((docs.length-have)+' missing','bad')+' Toggle items as you obtain them, then re-compile.</span>':'<span class="k-muted" style="font-size:13px;align-self:center">All requirements met — packet is submittable.</span>')
   +'</div></div><div id="packetOut"></div>';
  var dl=out.querySelector('#doclist');
  docs.forEach(function(d,i){
    var row=document.createElement('div');row.className='doc-row'+(d.have?'':' missing');
    row.innerHTML='<input type="checkbox" '+(d.have?'checked':'')+' aria-label="obtained"> <div><b>'+Kit.esc(d.doc)+'</b><div class="k-muted" style="font-size:13px">'+Kit.esc(d.src)+'</div></div><span class="st">'+Kit.badge(d.have?'On file':'MISSING',d.have?'ok':'bad')+'</span>';
    row.querySelector('input').onchange=function(e){d.have=e.target.checked;document.getElementById('compileBtn').click();};
    dl.appendChild(row);
  });
  var gb=out.querySelector('#genBtn');
  if(gb&&!gb.disabled){gb.onclick=function(){genPacket(proc,payer,docs);};}
};
function genPacket(proc,payer,docs){
  var ref='PA-'+Math.floor(100000+R()*900000);
  var h='<div class="packet"><h3 style="margin-top:0">Submission packet — '+Kit.esc(proc.name)+'</h3>'
   +'<div class="k-muted" style="font-size:13px;margin-bottom:8px">Reference '+ref+' · '+Kit.esc(payer.name)+' · Generated '+new Date().toLocaleDateString()+'</div>'
   +'<ol style="font-size:14px;padding-left:20px">'
   +'<li>Cover sheet with member + provider NPI</li>'
   +docs.map(function(d){return '<li>'+Kit.esc(d.doc)+' — attached ('+Kit.esc(d.src)+')</li>';}).join('')
   +'<li>Clinical notes bundle (PDF)</li></ol>'
   +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="k-btn" id="copyRef">Copy reference #</button><button class="k-btn k-primary" id="doneBtn">Mark as submitted</button></div></div>';
  document.getElementById('packetOut').innerHTML=h;setPills(3);
  document.getElementById('copyRef').onclick=function(){Kit.copy(ref);};
  document.getElementById('doneBtn').onclick=function(){Kit.toast('Packet '+ref+' marked submitted','ok');Kit.modal({title:'Submitted',body:'<p>Your prior-auth packet <b>'+ref+'</b> was logged as submitted to '+Kit.esc(payer.name)+'.</p><p class="k-muted">Expected decision: 3–5 business days. This demo does not transmit anything.</p>',actions:[{label:'Done',primary:true}]});};
  document.getElementById('packetOut').scrollIntoView({behavior:'smooth',block:'start'});
}
// Magic moment: auto-compile on load with the demo scenario
setTimeout(function(){document.getElementById('compileBtn').click();},300);
})();

</script>
</body>
</html>
