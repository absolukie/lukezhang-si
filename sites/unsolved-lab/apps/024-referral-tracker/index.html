<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReferralRadar — Unsolved Lab</title>
<link rel="stylesheet" href="../../shared/kit.css">
<style>
/* Minimal base styles — only matters if ../../shared/kit.css hasn't loaded yet. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#eef1f5; --ink:#16202e; --muted:#67727f;
  --line:#e2e6ec; --accent:#2563eb; --accent2:#7c3aed; --good:#16a34a; --warn:#d97706; --bad:#dc2626;
  font-size:15px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
.k-wrap{max-width:1120px;margin:0 auto;padding:16px}
.k-nav{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.k-nav-in{display:flex;justify-content:space-between;align-items:center;gap:12px}
.k-nav-title{font-weight:700;font-size:18px}
.k-nav-sub{color:var(--muted);font-size:13px}
.k-nav-actions{display:flex;gap:8px;align-items:center}
.k-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:14px 0}
.k-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.k-card h3{margin:0 0 8px;font-size:15px}
.k-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
.k-btn:hover{background:var(--panel2)}
.k-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.k-primary:hover{filter:brightness(.95)}
.k-input,.k-select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;background:var(--panel);color:var(--ink);width:100%}
.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th,.k-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.k-table th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.k-table td.num,.k-table th.num{text-align:right}
.k-badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.k-badge.ok{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.k-badge.warn{background:#fef3c7;color:#92400e;border-color:#fde68a}
.k-badge.bad{background:#fee2e2;color:#991b1b;border-color:#fecaca}
.k-badge.info{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}
.k-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.k-tab{border:none;background:none;padding:10px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.k-tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.k-kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.k-kpi-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.k-kpi-val{font-size:26px;font-weight:700;margin-top:4px}
.k-kpi-delta{font-size:13px;color:var(--muted);margin-top:2px}
.k-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:all .3s;z-index:999;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.k-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.k-toast.ok{background:#166534}.k-toast.bad{background:#991b1b}.k-toast.warn{background:#92400e}
.k-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.k-modal{background:var(--panel);border-radius:14px;max-width:520px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.k-modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.k-modal-b{padding:18px}.k-modal-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.k-modal-x{border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.k-empty{text-align:center;padding:48px 20px;color:var(--muted)}
.k-empty-t{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:6px}
.k-empty-s{font-size:14px;margin-bottom:14px}
.k-hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin:14px 0}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.k-muted{color:var(--muted)}
.k-timeline{position:relative;padding-left:26px}
.k-tl-item{position:relative;margin-bottom:14px}
.k-tl-dot{position:absolute;left:-21px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.k-tl-item.warn .k-tl-dot{background:var(--warn)}
.k-tl-item.bad .k-tl-dot{background:var(--bad)}
.k-tl-item.ok .k-tl-dot{background:var(--good)}
.k-tl-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.k-tl-t{font-size:12px;color:var(--muted)}
.k-tl-title{font-weight:600;font-size:14px}
.k-tl-body{font-size:13px;color:var(--muted)}
.k-bar-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.k-bar-label{width:170px;font-size:13px}
.k-bar-track{flex:1;background:var(--panel2);border-radius:6px;height:12px;overflow:hidden}
.k-bar-fill{height:100%;border-radius:6px}
.k-bar-val{width:70px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.k-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.k-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.k-donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
@media(max-width:720px){.k-split{grid-template-columns:1fr}.k-bar-label{width:110px}}
.demo-note{display:inline-block;font-size:12px;background:#fef9c3;color:#854d0e;border:1px solid #fde68a;border-radius:6px;padding:3px 10px;margin:8px 0}

</style>
</head>

<style>
:root{--accent:#0e7490;--accent2:#b45309;--bg:#f2f5f7;--panel:#ffffff;--panel2:#e6edf2;--ink:#17222b;--line:#d9e2ea;--good:#15803d;--warn:#b45309;--bad:#b91c1c}
.rr-wrap{max-width:1100px;margin:0 auto;padding:0 16px 40px}
.pipe{display:flex;gap:0;margin:14px 0;overflow-x:auto}
.pstage{flex:1;min-width:130px;padding:10px 8px;text-align:center;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--muted);position:relative}

.pstage.cur{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,116,144,.2)}

.ref-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;background:var(--panel)}
.ref-card.stuck{border-color:#fca5a5;border-left:5px solid var(--bad)}
.log{font-size:13px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.log div{margin:3px 0}
.nudge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.nudge{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fffdf5;font-size:13px}

K.tabs=function(host,defs){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';var bar=document.createElement('div');bar.className='k-tabs';var body=document.createElement('div');defs.forEach(function(d,i){var b=document.createElement('button');b.className='k-tab'+(i===0?' active':'');b.textContent=d.label;b.onclick=function(){bar.querySelectorAll('.k-tab').forEach(function(x){x.classList.remove('active');});b.classList.add('active');body.innerHTML='';d.render(body);};bar.appendChild(b);});host.appendChild(bar);host.appendChild(body);if(defs[0])defs[0].render(body);};
K.table=function(host,cols,rows,opts){host=typeof host==='string'?document.querySelector(host):host;opts=opts||{};host.innerHTML='';var wrap=document.createElement('div');var q='';if(opts.search){var inp=document.createElement('input');inp.className='k-input';inp.placeholder='Search…';inp.style.marginBottom='8px';inp.oninput=function(){q=inp.value.toLowerCase();draw();};wrap.appendChild(inp);}var tdiv=document.createElement('div');wrap.appendChild(tdiv);host.appendChild(wrap);function draw(){var rr=rows.filter(function(r){return !q||JSON.stringify(r).toLowerCase().indexOf(q)>=0;});var ps=opts.pageSize||rr.length;var h='<table class="k-table"><thead><tr>'+cols.map(function(c){return '<th class="'+(c.num?'num':'')+'">'+K.esc(c.label)+'</th>';}).join('')+'</tr></thead><tbody>';rr.slice(0,ps).forEach(function(r){h+='<tr>'+cols.map(function(c){var v=r[c.key];if(c.fmt)v=c.fmt(v,r);return '<td class="'+(c.num?'num':'')+'">'+(v==null?'':v)+'</td>';}).join('')+'</tr>';});h+='</tbody></table>';if(rr.length>ps)h+='<div class="k-muted" style="font-size:12px;margin-top:6px">Showing '+ps+' of '+rr.length+'</div>';tdiv.innerHTML=h;}draw();};

K.bars=function(host,items){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';var mx=Math.max.apply(null,items.map(function(i){return i.value;}))||1;items.forEach(function(it){var row=document.createElement('div');row.className='k-bar-row';row.innerHTML='<div class="k-bar-label">'+K.esc(it.label)+'</div><div class="k-bar-track"><div class="k-bar-fill" style="width:'+Math.round(it.value/mx*100)+'%;background:'+(it.color||'var(--accent)')+'"></div></div><div class="k-bar-val">'+K.num(it.value)+'</div>';host.appendChild(row);});};
K.line=function(host,series){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='';var W=560,H=180,P=28;var all=[];series.forEach(function(s){s.points.forEach(function(p){all.push(p);});});var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);if(mx===mn)mx=mn+1;var svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,width:'100%'});series.forEach(function(s,si){var n=s.points.length;var d=s.points.map(function(p,i){var x=P+i*(W-2*P)/(n-1||1);var y=H-P-(p-mn)/(mx-mn)*(H-2*P);return (i?'L':'M')+x.toFixed(1)+','+y.toFixed(1);}).join(' ');var path=svgEl('path',{d:d,fill:'none',stroke:s.color||['#3b82f6','#10b981','#f59e0b','#ef4444'][si%4],'stroke-width':2});svg.appendChild(path);});var lg=document.createElement('div');lg.className='k-legend';series.forEach(function(s,si){lg.innerHTML+='<span><i style="background:'+(s.color||['#3b82f6','#10b981','#f59e0b','#ef4444'][si%4])+'"></i>'+K.esc(s.name)+'</span>';});host.appendChild(svg);host.appendChild(lg);};

K.kpi=function(host,o){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='<div class="k-kpi"><div class="k-kpi-label">'+K.esc(o.label)+'</div><div class="k-kpi-val">'+o.value+'</div>'+(o.delta?'<div class="k-kpi-delta">'+K.esc(o.delta)+'</div>':'')+'</div>';};
K.empty=function(host,title,sub,al,afn){host=typeof host==='string'?document.querySelector(host):host;host.innerHTML='<div class="k-empty"><div class="k-empty-t">'+K.esc(title)+'</div>'+(sub?'<div class="k-empty-s">'+K.esc(sub)+'</div>':'')+(al?'<button class="k-btn k-primary">'+K.esc(al)+'</button>':'')+'</div>';if(al&&afn)host.querySelector('button').onclick=afn;};

 {id:'R-1042',to:'Dr. Okafor — Cardiology, Lakeside',from:'Dr. Alvarez (PCP)',ordered:'2026-09-14',stage:1,stageDays:19,rev:480,

  log:[['2026-09-14','Ordered by Dr. Alvarez'],['2026-09-15','Sent to Meridian Health — auth requested'],['2026-09-22','Payer requested additional notes — faxed'],['2026-10-01','No response — 17 days elapsed']]},
 {id:'R-1057',to:'Dr. Patel — Dermatology, Mercy',from:'Dr. Alvarez (PCP)',ordered:'2026-09-28',stage:2,stageDays:5,rev:220,reason:'Mole check — changing lesion, left shoulder',stuck:false,
  log:[['2026-09-28','Ordered by Dr. Alvarez'],['2026-09-29','Insurance approved (ref AUTH-55231)'],['2026-10-02','Appointment scheduled Oct 21, 10:30am']]},
 {id:'R-1031',to:'Dr. Nguyen — Orthopedics, Summit Sports',from:'Dr. Alvarez (PCP)',ordered:'2026-08-20',stage:5,stageDays:2,rev:0,reason:'Right knee OA — surgical consult',stuck:false,
  log:[['2026-08-20','Ordered'],['2026-08-22','Insurance approved'],['2026-09-09','Visit completed'],['2026-09-12','MRI results received'],['2026-10-01','Follow-up scheduled Oct 28']]}
];
var kpis=document.getElementById('kpis');
kpis.innerHTML=
 '<div class="k-kpi"><div class="k-kpi-label">Active referrals</div><div class="k-kpi-val">3</div></div>'
 +'<div class="k-kpi"><div class="k-kpi-label">Stuck &gt; 14 days</div><div class="k-kpi-val" style="color:var(--bad)">1</div><div class="k-kpi-delta">R-1042 · 19 days at Insurance</div></div>'
 +'<div class="k-kpi"><div class="k-kpi-label">Revenue at risk</div><div class="k-kpi-val" style="color:var(--bad)">$480</div><div class="k-kpi-delta">stuck referrals leak visits</div></div>';
function stageLabel(i){return STAGES[i];}
function draw(){
  var box=document.getElementById('refs');box.innerHTML='';
  REFS.slice().sort(function(a,b){return (b.stuck?1:0)-(a.stuck?1:0);}).forEach(function(r){
    var card=document.createElement('div');card.className='ref-card'+(r.stuck?' stuck':'');
    var pipe='<div class="pipe">'+STAGES.map(function(s,i){
      var cls=i<r.stage?'done':(i===r.stage?(r.stuck?'stuck':'cur'):'');
      return '<div class="pstage '+cls+'">'+s+(i===r.stage?'<br><span style="font-weight:400">'+r.stageDays+'d</span>':'')+'</div>';
    }).join('')+'</div>';
    card.innerHTML='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>'+r.id+'</b> → '+Kit.esc(r.to)
     +(r.stuck?Kit.badge('STUCK — 19 days at Insurance · $'+r.rev+' at risk','bad'):Kit.badge(stageLabel(r.stage),'info'))
     +'<span class="k-muted" style="font-size:13px;margin-left:auto">ordered '+Kit.when(r.ordered)+' by '+Kit.esc(r.from)+'</span></div>'
     +'<div style="font-size:14px;margin:6px 0"><span class="k-muted">Reason:</span> '+Kit.esc(r.reason)+'</div>'
     +pipe
     +'<div class="log">'+r.log.map(function(l){return '<div>· <b>'+Kit.when(l[0])+'</b> — '+Kit.esc(l[1])+'</div>';}).join('')+'</div>'
     +'<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'
     +(r.stage<STAGES.length-1?'<button class="k-btn k-primary" data-a="adv">Advance to '+STAGES[r.stage+1]+'</button>':'<span>'+Kit.badge('Complete','ok')+'</span>')
     +(r.stuck?'<button class="k-btn k-primary" data-core data-a="nudge">⚡ Nudge actions</button>':'')
     +'<button class="k-btn" data-a="note">Log note</button></div><div class="nudgebox"></div>';
    card.querySelectorAll('button').forEach(function(b){b.onclick=function(){act(r,b.dataset.a,card);};});
    box.appendChild(card);
  });
}
function act(r,a,card){
  if(a==='adv'){
    r.log.push([new Date().toISOString().slice(0,10),'Advanced to '+STAGES[r.stage+1]]);
    r.stage++;r.stageDays=0;r.stuck=false;
    Kit.toast(r.id+' → '+STAGES[r.stage],'ok');draw();
  }else if(a==='note'){
    Kit.modal({title:'Log note — '+r.id,body:'<textarea id="nn" class="k-input" rows="3" placeholder="e.g. Called payer, spoke with Dana, auth pending supervisor review"></textarea>',
      actions:[{label:'Cancel'},{label:'Save note',kind:'k-primary',onClick:function(){var v=document.getElementById('nn').value.trim();if(v){r.log.push([new Date().toISOString().slice(0,10),v]);draw();Kit.toast('Note logged','ok');}}}]});
  }else if(a==='nudge'){
    var nb=card.querySelector('.nudgebox');
    nb.innerHTML='<div class="nudge-grid">'
     +'<div class="nudge"><b>📞 Call payer script</b><br><span class="k-muted">"Hi, checking auth status for '+r.id+', ordered 9/14, member Maya R. Reference AUTH-pending. It\'s day 19 — can you escalate?"</span><br><button class="k-btn" style="margin-top:6px" id="n1">Copy script</button></div>'
     +'<div class="nudge"><b>✉️ Message the ordering doctor</b><br><span class="k-muted">Draft: "My cardiology referral has been stuck at insurance 19 days. Can your office do a peer-to-peer?"</span><br><button class="k-btn" style="margin-top:6px" id="n2">Copy draft</button></div>'
     +'<div class="nudge"><b>⚡ Escalate</b><br><span class="k-muted">File a complaint with your state DOI if the payer misses its deadline (CA: 5 business days routine).</span><br><button class="k-btn" style="margin-top:6px" id="n3">Log escalation</button></div></div>'
    +'<div style="margin-top:10px"><button class="k-btn k-primary" id="nall">📋 Copy full nudge pack (all three)</button></div>';
    nb.querySelector('#n1').onclick=function(){Kit.copy('Hi, checking auth status for '+r.id+', ordered 2026-09-14, member Maya R. It is day 19 — please escalate.');};
    nb.querySelector('#n2').onclick=function(){Kit.copy('Hi Dr. Alvarez, my cardiology referral ('+r.id+') has been stuck at insurance for 19 days. Could your office do a peer-to-peer review? Thanks!');};
    nb.querySelector('#n3').onclick=function(){r.log.push([new Date().toISOString().slice(0,10),'Escalation logged — DOI complaint drafted']);Kit.toast('Escalation logged','warn');draw();};
    nb.querySelector('#nall').onclick=function(){Kit.copy('NUDGE PACK — '+r.id+' (stuck 19 days at Insurance)\n\n1) CALL PAYER:\nHi, checking auth status for '+r.id+', ordered 2026-09-14, member Maya R. It is day 19 — please escalate.\n\n2) MESSAGE DOCTOR:\nHi Dr. Alvarez, my cardiology referral ('+r.id+') has been stuck at insurance for 19 days. Could your office do a peer-to-peer review? Thanks!\n\n3) ESCALATE:\nIf no movement in 48h, file a state DOI complaint (CA: 5 business days routine).');};
  }
}
draw();
})();

</script>
