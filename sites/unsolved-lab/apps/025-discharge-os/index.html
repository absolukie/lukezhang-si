<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Homeward — Unsolved Lab</title>
<link rel="stylesheet" href="../../shared/kit.css">
<style>
/* Minimal base styles — only matters if ../../shared/kit.css hasn't loaded yet. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#eef1f5; --ink:#16202e; --muted:#67727f;
  --line:#e2e6ec; --accent:#2563eb; --accent2:#7c3aed; --good:#16a34a; --warn:#d97706; --bad:#dc2626;
  font-size:15px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
.k-wrap{max-width:1120px;margin:0 auto;padding:16px}
.k-nav{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.k-nav-in{display:flex;justify-content:space-between;align-items:center;gap:12px}
.k-nav-title{font-weight:700;font-size:18px}
.k-nav-sub{color:var(--muted);font-size:13px}
.k-nav-actions{display:flex;gap:8px;align-items:center}
.k-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:14px 0}
.k-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.k-card h3{margin:0 0 8px;font-size:15px}
.k-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
.k-btn:hover{background:var(--panel2)}
.k-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.k-primary:hover{filter:brightness(.95)}
.k-input,.k-select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;background:var(--panel);color:var(--ink);width:100%}
.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th,.k-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.k-table th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.k-table td.num,.k-table th.num{text-align:right}
.k-badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.k-badge.ok{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.k-badge.warn{background:#fef3c7;color:#92400e;border-color:#fde68a}
.k-badge.bad{background:#fee2e2;color:#991b1b;border-color:#fecaca}
.k-badge.info{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}
.k-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.k-tab{border:none;background:none;padding:10px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.k-tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.k-kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.k-kpi-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.k-kpi-val{font-size:26px;font-weight:700;margin-top:4px}
.k-kpi-delta{font-size:13px;color:var(--muted);margin-top:2px}
.k-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:all .3s;z-index:999;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.k-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.k-toast.ok{background:#166534}.k-toast.bad{background:#991b1b}.k-toast.warn{background:#92400e}
.k-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.k-modal{background:var(--panel);border-radius:14px;max-width:520px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.k-modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.k-modal-b{padding:18px}.k-modal-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.k-modal-x{border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.k-empty{text-align:center;padding:48px 20px;color:var(--muted)}
.k-empty-t{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:6px}
.k-empty-s{font-size:14px;margin-bottom:14px}
.k-hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin:14px 0}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.k-muted{color:var(--muted)}
.k-timeline{position:relative;padding-left:26px}
.k-tl-item{position:relative;margin-bottom:14px}
.k-tl-dot{position:absolute;left:-21px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.k-tl-item.warn .k-tl-dot{background:var(--warn)}
.k-tl-item.bad .k-tl-dot{background:var(--bad)}
.k-tl-item.ok .k-tl-dot{background:var(--good)}
.k-tl-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.k-tl-t{font-size:12px;color:var(--muted)}
.k-tl-title{font-weight:600;font-size:14px}
.k-tl-body{font-size:13px;color:var(--muted)}
.k-bar-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.k-bar-label{width:170px;font-size:13px}
.k-bar-track{flex:1;background:var(--panel2);border-radius:6px;height:12px;overflow:hidden}
.k-bar-fill{height:100%;border-radius:6px}
.k-bar-val{width:70px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.k-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.k-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.k-donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
@media(max-width:720px){.k-split{grid-template-columns:1fr}.k-bar-label{width:110px}}
.demo-note{display:inline-block;font-size:12px;background:#fef9c3;color:#854d0e;border:1px solid #fde68a;border-radius:6px;padding:3px 10px;margin:8px 0}

</style>
</head>

:root{--accent:#166534;--accent2:#b45309;--bg:#f3f6f1;--panel:#ffffff;--panel2:#e7efe6;--ink:#1a241c;--line:#d8e2d5;--good:#15803d;--warn:#b45309;--bad:#b91c1c}

K.table=function(host,cols,rows,opts){host=typeof host==='string'?document.querySelector(host):host;opts=opts||{};host.innerHTML='';var wrap=document.createElement('div');var q='';if(opts.search){var inp=document.createElement('input');inp.className='k-input';inp.placeholder='Search…';inp.style.marginBottom='8px';inp.oninput=function(){q=inp.value.toLowerCase();draw();};wrap.appendChild(inp);}var tdiv=document.createElement('div');wrap.appendChild(tdiv);host.appendChild(wrap);function draw(){var rr=rows.filter(function(r){return !q||JSON.stringify(r).toLowerCase().indexOf(q)>=0;});var ps=opts.pageSize||rr.length;var h='<table class="k-table"><thead><tr>'+cols.map(function(c){return '<th class="'+(c.num?'num':'')+'">'+K.esc(c.label)+'</th>';}).join('')+'</tr></thead><tbody>';rr.slice(0,ps).forEach(function(r){h+='<tr>'+cols.map(function(c){var v=r[c.key];if(c.fmt)v=c.fmt(v,r);return '<td class="'+(c.num?'num':'')+'">'+(v==null?'':v)+'</td>';}).join('')+'</tr>';});h+='</tbody></table>';if(rr.length>ps)h+='<div class="k-muted" style="font-size:12px;margin-top:6px">Showing '+ps+' of '+rr.length+'</div>';tdiv.innerHTML=h;}draw();};

'- Stress echocardiogram: scheduled 10/09/2026 09:00',
'',
'ACTIVITY/DIET: No lifting >10 lbs for 1 week. Low-sodium diet (<2g/day).',
'',
'RETURN PRECAUTIONS — seek care immediately for:',
'- Chest pain not relieved by 1 nitroglycerin',
'- Shortness of breath at rest, fainting',
'- Heart rate >120 or <50 with symptoms',
'',
'Questions? Call the discharge nurse line 555-0199.'
].join('\n');
var ta=document.getElementById('discharge');ta.value=DEMO;
document.getElementById('loadDemo').onclick=function(){ta.value=DEMO;Kit.toast('Demo papers loaded');};
var FLAG_KW=['chest pain','shortness of breath','fainting','bleeding','fever over 101','heart rate','not relieved','numbness','swelling'];
function parseMeds(t){
  var meds=[];var lines=t.split('\n');
  lines.forEach(function(ln){
    var m=ln.match(/^[-•]\s*([A-Z][a-zA-Z\-]+)\s+([\d.]+\s*mg)[^—\-]*?—\s*(.+)$/)||ln.match(/^[-•]\s*([A-Z][a-zA-Z\-]+)\s+([\d.]+\s*mg)\s+(PO|SL)[^—]*?—\s*(.+)$/);
    if(m&&/lisinopril|aspirin|atorvastatin|nitroglycerin|metformin|amlodipine/i.test(ln)){
      var parts=ln.replace(/^[-•]\s*/,'').split('—');
      var when=/nightly|bedtime|qhs|evening/i.test(ln)?'Evening':(/PRN|as needed/i.test(ln)?'As needed':'Morning');
      meds.push({raw:ln.replace(/^[-•]\s*/,'').trim(),name:(parts[0]||'').trim(),why:(parts[1]||'take as directed').trim(),when:when});
    }
  });
  return meds;
}
function parseAppts(t){
  var a=[];t.split('\n').forEach(function(ln){
    var m=ln.match(/^[-•]\s*(.+?):\s*(.+)$/);
    if(m&&/follow|pcp|cardiology|stress|echo|schedule|appointment|dr\./i.test(ln)){a.push({what:m[1].trim(),detail:m[2].trim()});}
  });
  return a;
}
function parseFlags(t){
  var f=[];t.split('\n').forEach(function(ln){
    var low=ln.toLowerCase();
    FLAG_KW.forEach(function(k){if(low.indexOf(k)>=0&&/^[-•]/.test(ln.trim())){var s=ln.replace(/^[-•]\s*/,'').trim();if(f.indexOf(s)<0)f.push(s);}});
  });
  return f;
}
var store=Kit.store('homeward');
document.getElementById('parseBtn').onclick=function(){
  var t=ta.value;
  if(t.trim().length<50){Kit.toast('Paste the discharge text first','warn');return;}
  var meds=parseMeds(t),appts=parseAppts(t),flags=parseFlags(t);
  var today=new Date().toISOString().slice(0,10);
  var taken=store.get('taken_'+today,{});
  var plan=document.getElementById('plan');
  var html='<div class="k-card" style="border-left:5px solid var(--accent);margin-top:14px"><h3 style="margin-top:0">2 · Your recovery plan <span class="k-muted" style="font-weight:400;font-size:13px">— in plain English</span></h3>'
   +'<p style="font-size:14px"><b>What happened:</b> You were seen for chest pain. The heart tests came back <b>normal</b> — no heart attack. You\'re going home with new medicines and follow-up appointments to keep it that way.</p></div>'
   +'<div class="k-split" style="margin-top:14px"><div class="k-card"><h3>🚩 Red flags — go to ER if:</h3>'
   +(flags.length?flags.map(function(f){return '<div class="flag" data-f="'+Kit.esc(f)+'">⚠ '+Kit.esc(f)+'</div>';}).join(''):'<p class="k-muted">None detected in the text.</p>')
   +'</div><div class="k-card"><h3>📅 Follow-ups</h3>'
   +(appts.length?appts.map(function(a){return '<div class="appt"><b>'+Kit.esc(a.what)+'</b><br><span class="k-muted">'+Kit.esc(a.detail)+'</span></div>';}).join(''):'<p class="k-muted">None detected.</p>')
   +'</div></div>'
   +'<div class="k-card" style="margin-top:14px"><h3>💊 Medicine schedule <span class="k-muted" style="font-weight:400;font-size:13px">— tap when taken</span></h3><div id="meds">'
   +(meds.length?['Morning','Evening','As needed'].map(function(g){
       var rows=meds.map(function(m,i){return {m:m,i:i};}).filter(function(x){return x.m.when===g;});
       if(!rows.length)return '';
       return '<div class="k-muted" style="font-size:12px;font-weight:700;margin:10px 0 4px">'+g.toUpperCase()+'</div>'
        +rows.map(function(x){var tk=taken[x.m.raw];return '<div class="med-row'+(tk?' taken':'')+'" data-i="'+x.i+'"><input type="checkbox" '+(tk?'checked':'')+'><div><div class="mname"><b>'+Kit.esc(x.m.name)+'</b></div><div class="k-muted" style="font-size:13px">'+Kit.esc(x.m.why)+'</div></div></div>';}).join('');
     }).join(''):'<p class="k-muted">No medications detected.</p>')
   +'</div><div style="margin-top:10px"><button class="k-btn" id="copyPlan">Copy plan as text</button></div></div>';
  plan.innerHTML=html;
  plan.querySelectorAll('.med-row').forEach(function(row){
    var i=+row.dataset.i;var m=meds[i];
    row.querySelector('input').onchange=function(e){taken[m.raw]=e.target.checked;store.set('taken_'+today,taken);row.classList.toggle('taken',e.target.checked);if(e.target.checked)Kit.toast('Logged: '+m.name,'ok');};
  });
  plan.querySelectorAll('.flag').forEach(function(f){f.onclick=function(){
    Kit.modal({title:'Why this matters',body:'<p><b>'+Kit.esc(f.dataset.f)+'</b></p><p>Your discharge papers list this as a <b>return precaution</b> — a sign the care team wants you to come back immediately for, rather than waiting for your follow-up.</p><p class="k-muted">When in doubt, call the discharge nurse line or go to urgent care. This app does not give medical advice.</p>',actions:[{label:'Got it',primary:true}]});
  };});
  plan.querySelector('#copyPlan').onclick=function(){
    var txt='RECOVERY PLAN (from discharge papers, fictional demo)\n\nMEDS:\n'+meds.map(function(m){return '- '+m.raw+(taken[m.raw]?' [taken]':'');}).join('\n')
     +'\n\nRED FLAGS — seek care:\n'+flags.map(function(f){return '- '+f;}).join('\n')
     +'\n\nFOLLOW-UPS:\n'+appts.map(function(a){return '- '+a.what+': '+a.detail;}).join('\n');
    Kit.copy(txt);
  };
  plan.scrollIntoView({behavior:'smooth'});
  Kit.toast('Recovery plan built','ok');
};
// Magic moment: build the plan on load
setTimeout(function(){document.getElementById('parseBtn').click();},400);
})();

</script>
</body>
</html>
