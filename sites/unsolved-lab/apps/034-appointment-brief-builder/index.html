<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VisitReady — Brief Builder</title>
<link rel="stylesheet" href="../../shared/kit.css">
<script src="../../shared/kit.js"></script>
<style>

:root{--bg:#f5f6f8;--panel:#ffffff;--panel2:#eef0f4;--ink:#1c2430;--muted:#6b7686;--line:#dfe4ec;--accent:#2563eb;--accent2:#7c3aed;--good:#1a9e5c;--warn:#b97a1a;--bad:#cf3d3d;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5}
.k-wrap{max-width:1180px;margin:0 auto;padding:20px}
.k-nav{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.k-nav-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.k-nav-t{font-weight:800;font-size:18px;letter-spacing:-.01em}.k-nav-s{color:var(--muted);font-size:13px}
.k-nav-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.k-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.k-btn:hover{filter:brightness(.96)}.k-btn:active{transform:translateY(1px)}
.k-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.k-input,.k-select,textarea.k-input{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;background:var(--panel);color:var(--ink);width:100%;font-family:inherit}
.k-input:focus,.k-select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.k-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.k-grid{display:grid;gap:14px}.k-g2{grid-template-columns:repeat(2,1fr)}.k-g3{grid-template-columns:repeat(3,1fr)}.k-g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.k-g2,.k-g3,.k-g4{grid-template-columns:1fr}}
.k-muted{color:var(--muted)}.k-small{font-size:13px}
.k-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.k-badge.ok{background:#e3f6ea;color:#12784a;border-color:#bde6cd}.k-badge.warn{background:#fdf2df;color:#96600f;border-color:#f0d9ab}
.k-badge.bad{background:#fdeaea;color:#b02727;border-color:#f3c1c1}.k-badge.info{background:#e7f0fd;color:#1c59b8;border-color:#c2d9f6}
.k-tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
.k-tab{border:none;background:none;padding:10px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:600;white-space:nowrap}
.k-tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th,.k-table td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.k-table th{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.k-table td.num,.k-table th.num{text-align:right;font-variant-numeric:tabular-nums}
.k-twrap{overflow-x:auto}
.k-kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.k-kpi-l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.k-kpi-v{font-size:30px;font-weight:800;letter-spacing:-.02em}.k-kpi-d{font-size:13px;color:var(--good);font-weight:600}
.k-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:#1f2937;color:#fff;padding:11px 20px;border-radius:11px;opacity:0;transition:.28s;z-index:400;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.k-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.k-toast.warn{background:#92600f}.k-toast.bad{background:#a12828}
.k-modal-ov{position:fixed;inset:0;background:rgba(15,20,30,.5);display:flex;align-items:center;justify-content:center;z-index:300;padding:18px}
.k-modal{background:var(--panel);border-radius:16px;max-width:580px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.k-modal-h{font-weight:800;font-size:18px;padding:18px 20px 0}
.k-modal-b{padding:14px 20px}.k-modal-f{padding:4px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.k-empty{text-align:center;padding:44px 20px;color:var(--muted)}
.k-empty-t{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:6px}.k-empty-s{margin-bottom:14px}
.k-hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
.k-hero h1{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}.k-hero p{margin:0;color:var(--muted)}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.k-split{grid-template-columns:1fr}}
.k-bar-row{display:flex;align-items:center;gap:10px;margin:7px 0}
.k-bar-l{width:150px;flex:none;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-bar-t{flex:1;background:var(--panel2);border-radius:6px;height:14px;overflow:hidden}
.k-bar-f{height:100%;background:var(--accent);border-radius:6px;transition:width .5s}
.k-bar-v{width:64px;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.k-donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.k-donut{width:130px;height:130px;border-radius:50%;position:relative;flex:none}
.k-donut-c{position:absolute;inset:26px;background:var(--panel);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.k-dl{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.k-dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.k-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.k-lg{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.k-tl{display:flex;gap:12px;margin:0 0 4px}.k-tl-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none;margin-top:5px}
.k-tl-dot.ok{background:var(--good)}.k-tl-dot.warn{background:var(--warn)}.k-tl-dot.bad{background:var(--bad)}.k-tl-dot.info{background:var(--accent)}
.k-tl-t{font-size:12px;color:var(--muted);font-weight:600}.k-tl-ti{font-weight:700}.k-tl-b{font-size:13.5px;color:var(--muted)}
.k-graph .k-node{fill:var(--panel);stroke:var(--accent);stroke-width:2.5}
.k-graph .k-node-s{font-size:13px;font-weight:800;fill:var(--ink)}
.k-graph .k-node-l{font-size:11.5px;fill:var(--muted);font-weight:600}
.k-graph .k-edge{stroke:var(--line);stroke-width:2}
.k-graph .k-edge-l{font-size:10.5px;fill:var(--muted)}
.k-line polyline{stroke-linejoin:round;stroke-linecap:round}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex:none}


:root{--accent:#1d6b41;--accent2:#2f9e63;--bg:#edf3ee;--panel:#ffffff;}
@media print{.k-nav,.noprint{display:none!important}.k-wrap{max-width:100%}}
.brief{background:#fff;border:2px solid var(--accent);border-radius:12px;padding:26px 30px}
.brief h2{margin:0 0 2px}.sec-t{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin:16px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.qitem{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.logdot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}

</style>
</head>
<body>
<script>
(function(){
if(window.Kit) return;
function hash(s){s=String(s);var h=1779033703^s.length;for(var i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}

var pick=function(r,arr){return arr[Math.floor(r()*arr.length)];};
var int=function(r,a,b){return a+Math.floor(r()*(b-a+1));};

var _uid=0;var uid=function(p){_uid++;return (p||'id')+'-'+_uid+'-'+Math.floor(Math.random()*46656).toString(36);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};

function nav(o){var h=el('<header class="k-nav"><div class="k-nav-in"><div><div class="k-nav-t">'+esc(o.title)+'</div>'+(o.sub?'<div class="k-nav-s">'+esc(o.sub)+'</div>':'')+'</div><div class="k-nav-a"></div></div></header>');var a=h.querySelector('.k-nav-a');(o.actions||[]).forEach(function(x){if(typeof x==='string'){a.appendChild(el('<span class="k-muted">'+esc(x)+'</span>'));}else{var b=el('<button class="k-btn'+(x.primary?' k-primary':'')+'">'+esc(x.label)+'</button>');if(x.onClick)b.onclick=x.onClick;a.appendChild(b);}});document.body.prepend(h);return h;}
function toast(msg,kind){var t=el('<div class="k-toast '+(kind||'')+'">'+esc(msg)+'</div>');document.body.appendChild(t);setTimeout(function(){t.classList.add('show');},30);setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove();},400);},2600);}
function modal(o){var m=el('<div class="k-modal-ov"><div class="k-modal"><div class="k-modal-h">'+esc(o.title)+'</div><div class="k-modal-b"></div><div class="k-modal-f"></div></div></div>');var b=m.querySelector('.k-modal-b');if(typeof o.body==='string')b.innerHTML=o.body;else if(o.body)b.appendChild(o.body);var f=m.querySelector('.k-modal-f');(o.actions||[{label:'Close'}]).forEach(function(x){var btn=el('<button class="k-btn'+(x.primary?' k-primary':'')+'">'+esc(x.label)+'</button>');btn.onclick=function(){if(x.onClick)x.onClick();if(x.keep!==true)m.remove();};f.appendChild(btn);});m.addEventListener('click',function(e){if(e.target===m)m.remove();});document.body.appendChild(m);return m;}
function tabs(host,defs){host.innerHTML='';var bar=el('<div class="k-tabs"></div>');var body=el('<div class="k-tabs-b"></div>');defs.forEach(function(d,i){var b=el('<button class="k-tab'+(i===0?' on':'')+'">'+esc(d.label)+'</button>');b.onclick=function(){var bs=bar.querySelectorAll('.k-tab');for(var k=0;k<bs.length;k++)bs[k].classList.remove('on');b.classList.add('on');body.innerHTML='';d.render(body);};bar.appendChild(b);});host.appendChild(bar);host.appendChild(body);defs[0].render(body);}
function table(host,cols,rows,opt){opt=opt||{};host.innerHTML='';var wrap=el('<div></div>');function draw(q){var rs=rows;if(q)rs=rows.filter(function(r){return cols.some(function(c){return String(r[c.key]==null?'':r[c.key]).toLowerCase().indexOf(q)>=0;});});var ps=opt.pageSize||rs.length;var tw=el('<div class="k-twrap"><table class="k-table"><thead><tr></tr></thead><tbody></tbody></table></div>');var thead=tw.querySelector('thead tr'),tbody=tw.querySelector('tbody');cols.forEach(function(c){thead.appendChild(el('<th class="'+(c.num?'num':'')+'">'+esc(c.label)+'</th>'));});rs.slice(0,ps).forEach(function(r){var tr=el('<tr></tr>');cols.forEach(function(c){var v=r[c.key];if(c.fmt)v=c.fmt(v,r);var td=el('<td class="'+(c.num?'num':'')+'"></td>');if(typeof v==='string'&&/<[a-z][\s\S]*>/i.test(v))td.innerHTML=v;else td.textContent=(v==null?'':v);tr.appendChild(td);});tbody.appendChild(tr);});var old=wrap.querySelector('.k-twrap');if(old)old.remove();var note=wrap.querySelector('.k-tnote');if(note)note.remove();wrap.appendChild(tw);if(rs.length>ps)wrap.appendChild(el('<div class="k-muted k-tnote" style="padding:8px 2px;font-size:13px">Showing '+ps+' of '+rs.length+'</div>'));}if(opt.search){var inp=el('<input class="k-input" style="max-width:260px;margin-bottom:10px" placeholder="Search\u2026">');wrap.appendChild(inp);inp.oninput=function(){draw(inp.value.toLowerCase());};}host.appendChild(wrap);draw('');}
function bars(host,items){host.innerHTML='';var mx=1;items.forEach(function(i){if(i.value>mx)mx=i.value;});items.forEach(function(i){var row=el('<div class="k-bar-row"><div class="k-bar-l">'+esc(i.label)+'</div><div class="k-bar-t"><div class="k-bar-f" style="width:'+(100*i.value/mx).toFixed(1)+'%;'+(i.color?'background:'+i.color:'')+'"></div></div><div class="k-bar-v">'+esc(String(i.value))+'</div></div>');host.appendChild(row);});}
function donut(host,items){host.innerHTML='';var tot=0;items.forEach(function(i){tot+=i.value;});if(!tot)tot=1;var acc=0;var pal=['#3b82f6','#22a06b','#e8a13d','#d9534f','#8b6fd8','#38b6c9'];var segs=items.map(function(i,ix){var a0=(acc/tot*360).toFixed(1);acc+=i.value;var a1=(acc/tot*360).toFixed(1);var col=i.color||pal[ix%pal.length];return col+' '+a0+'deg '+a1+'deg';});var d=el('<div class="k-donut-wrap"><div class="k-donut" style="background:conic-gradient('+segs.join(',')+')"><div class="k-donut-c">'+esc(String(tot))+'</div></div><div class="k-donut-l"></div></div>');var lg=d.querySelector('.k-donut-l');items.forEach(function(i,ix){lg.appendChild(el('<div class="k-dl"><span class="k-dot" style="background:'+(i.color||pal[ix%pal.length])+'"></span><span>'+esc(i.label)+' <b>'+esc(String(i.value))+'</b></span></div>'));});host.appendChild(d);}
function badge(txt,kind){return '<span class="k-badge '+(kind||'')+'">'+esc(txt)+'</span>';}
function kpi(host,o){host.innerHTML='';host.appendChild(el('<div class="k-kpi"><div class="k-kpi-l">'+esc(o.label)+'</div><div class="k-kpi-v">'+esc(String(o.value))+'</div>'+(o.delta?'<div class="k-kpi-d">'+esc(o.delta)+'</div>':'')+'</div>'));}
function empty(host,title,sub,al,af){host.innerHTML='';var e=el('<div class="k-empty"><div class="k-empty-t">'+esc(title)+'</div>'+(sub?'<div class="k-empty-s">'+esc(sub)+'</div>':'')+'</div>');if(al){var b=el('<button class="k-btn k-primary">'+esc(al)+'</button>');b.onclick=af;e.appendChild(b);}host.appendChild(e);}
var money=function(n){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
var num=function(n){return Number(n).toLocaleString('en-US');};
var pct=function(x){return (x*100).toFixed(1)+'%';};
var when=function(d){return new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});};
var initials=function(n){return String(n).split(/\s+/).map(function(w){return w[0];}).filter(Boolean).slice(0,2).join('').toUpperCase();};
function copy(txt){function done(){toast('Copied to clipboard');}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){fallback();});}else fallback();function fallback(){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('Copy failed','warn');}ta.remove();}}
function timeline(host,events){host.innerHTML='';events.forEach(function(e){host.appendChild(el('<div class="k-tl"><div class="k-tl-dot '+(e.kind||'')+'"></div><div><div class="k-tl-t">'+esc(e.t)+'</div><div class="k-tl-ti">'+esc(e.title)+'</div>'+(e.body?'<div class="k-tl-b">'+esc(e.body)+'</div>':'')+'</div></div>'));});}
function graph(host,g){host.innerHTML='';var n=g.nodes,W=560,H=300;var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('class','k-graph');svg.style.width='100%';n.forEach(function(nd,i){var a=(i/n.length)*Math.PI*2-Math.PI/2;nd._x=W/2+Math.cos(a)*(W/2-80);nd._y=H/2+Math.sin(a)*(H/2-55);});(g.edges||[]).forEach(function(e){var A=null,B=null;n.forEach(function(x){if(x.id===e.a)A=x;if(x.id===e.b)B=x;});if(!A||!B)return;var l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',A._x);l.setAttribute('y1',A._y);l.setAttribute('x2',B._x);l.setAttribute('y2',B._y);l.setAttribute('class','k-edge');svg.appendChild(l);if(e.label){var t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',(A._x+B._x)/2);t.setAttribute('y',(A._y+B._y)/2-5);t.setAttribute('class','k-edge-l');t.setAttribute('text-anchor','middle');t.textContent=e.label;svg.appendChild(t);}});n.forEach(function(nd){var gr=document.createElementNS('http://www.w3.org/2000/svg','g');var c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',nd._x);c.setAttribute('cy',nd._y);c.setAttribute('r','26');if(nd.color)c.setAttribute('fill',nd.color);c.setAttribute('class','k-node');gr.appendChild(c);var s=document.createElementNS('http://www.w3.org/2000/svg','text');s.setAttribute('x',nd._x);s.setAttribute('y',nd._y+5);s.setAttribute('text-anchor','middle');s.setAttribute('class','k-node-s');s.textContent=initials(nd.label);gr.appendChild(s);var t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',nd._x);t.setAttribute('y',nd._y+46);t.setAttribute('text-anchor','middle');t.setAttribute('class','k-node-l');t.textContent=nd.label;gr.appendChild(t);svg.appendChild(gr);});host.appendChild(svg);}
function line(host,series){host.innerHTML='';var W=560,H=220,P=34;var all=[];series.forEach(function(s){s.points.forEach(function(v){all.push(v);});});var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);var npts=0;series.forEach(function(s){if(s.points.length>npts)npts=s.points.length;});function X(i){return P+i*(W-2*P)/Math.max(1,(npts-1));}function Y(v){return H-P-((v-mn)/((mx-mn)||1))*(H-2*P);}var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('class','k-line');svg.style.width='100%';series.forEach(function(s){var p=document.createElementNS('http://www.w3.org/2000/svg','polyline');p.setAttribute('points',s.points.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);}).join(' '));p.setAttribute('fill','none');p.setAttribute('stroke',s.color||'#3b82f6');p.setAttribute('stroke-width','2.5');svg.appendChild(p);});host.appendChild(svg);var lg=el('<div class="k-legend"></div>');series.forEach(function(s){lg.appendChild(el('<span class="k-lg"><span class="k-dot" style="background:'+(s.color||'#3b82f6')+'"></span>'+esc(s.name)+'</span>'));});host.appendChild(lg);}

<script>

var K=window.Kit;
K.nav({title:'VisitReady',sub:'Brief builder \u00b7 Dr. Alvarez \u00b7 Oct 6, 2026'});
(function(){var box=document.querySelector('.k-nav-actions');if(!box)return;var b=document.createElement('button');b.className='k-btn';b.textContent='About this demo';b.onclick=function(){K.modal({title:'About VisitReady',body:'<p style="font-size:14px">VisitReady turns two weeks of symptom logs into the one-page brief your doctor actually reads. All patients, logs and doctors here are fictional demo data \u2014 nothing leaves this browser.</p>',actions:[{label:'Got it',primary:true}]});};box.appendChild(b);})();
var vrStore=K.store('visitready34');
var anno=vrStore.get('anno',{}); // question idx -> 'addressed' | 'followup'
var r=K.rng('visitready34');
function daysAgo(n){var d=new Date(2026,9,3);d.setDate(d.getDate()-n);return d;}
var symptoms=['Morning stiffness','Dizziness on standing','Nighttime heartburn','Ankle swelling','Shortness of breath \u2013 stairs','Nausea after metformin'];
var logs=[];
for(var d=13;d>=0;d--){
 var n=K.int(r,0,3);
 for(var i=0;i<n;i++){
  var s=K.pick(r,symptoms);
  logs.push({d:daysAgo(d),s:s,sev:K.int(r,1,10),note:K.pick(r,['After climbing stairs','Worse in the evening','Better after sitting','Lasted ~20 min','Needed to rest',''])});
 }
}
logs.push({d:daysAgo(1),s:'Blood pressure spike',sev:8,note:'168/104 at home cuff, rested and rechecked 152/96'});
logs.sort(function(a,b){return a.d-b.d;});
var questions=[
 'Is the metformin increase causing the nausea, or is it the reflux?',
 'Do I need a cardiology referral for the stair shortness of breath?',
 'Can I switch lisinopril to mornings \u2014 I keep forgetting the evening dose?',
 'Is my home BP cuff accurate? Readings run higher than clinic.'
];
var wrap=K.el('<div class="k-wrap"></div>');document.body.appendChild(wrap);
wrap.appendChild(K.el('<div class="k-hero noprint"><h1>Walk in with a one-page brief</h1><p>Two weeks of symptom logs, med changes and your questions \u2014 distilled into the one page your doctor actually reads. Demo data is fictional.</p></div>'));
var host=K.el('<div></div>');wrap.appendChild(host);
K.tabs(host,[
 {id:'logs',label:'Symptom log (14 days)',render:function(h){
   h.innerHTML='<div class="k-card"><div id="lt"></div><div style="margin-top:12px" class="noprint"><button class="k-btn" id="addlog">+ Log today\u2019s symptom</button></div></div>';
   function drawLog(){
     var rows=logs.map(function(l){return{t:K.when(l.d),title:l.s,body:'Severity '+l.sev+'/10'+(l.note?' \u00b7 '+l.note:''),kind:l.sev>=7?'bad':(l.sev>=4?'warn':'ok')};});
     K.timeline(h.querySelector('#lt'),rows);
   }
   drawLog();
   h.querySelector('#addlog').onclick=function(){
    K.modal({title:'Log a symptom',body:'<div class="field"><label>Symptom</label><input class="k-input" id="ls"></div><div class="field"><label>Severity (1-10)</label><input class="k-input" id="lv" type="number" min="1" max="10" value="5"></div>',
     actions:[{label:'Cancel'},{label:'Add to log',primary:true,fn:function(){
      var s=document.getElementById('ls').value.trim()||'Unnamed symptom';
      logs.push({d:new Date(),s:s,sev:+document.getElementById('lv').value||5,note:''});
      drawLog();K.toast('Logged');}}]});
   };
 }},
 {id:'q',label:'My questions',render:function(h){
   h.innerHTML='<div class="k-card"><h3 style="margin-top:0">Questions for Dr. Alvarez</h3><div id="ql"></div><div style="margin-top:10px" class="noprint"><input class="k-input" id="nq" placeholder="Add your own question\u2026" style="margin-bottom:8px"><button class="k-btn" id="aq">Add question</button></div></div>';
   var ql=h.querySelector('#ql');
   function draw(){ql.innerHTML='';questions.forEach(function(q,i){
    var d=K.el('<div class="qitem"><input type="checkbox" checked data-i="'+i+'"><span>'+K.esc(q)+'</span></div>');ql.appendChild(d);});}
   draw();
   h.querySelector('#aq').onclick=function(){var v=h.querySelector('#nq').value.trim();if(!v)return;questions.push(v);draw();h.querySelector('#nq').value='';};
 }},
 {id:'brief',label:'Generated brief',render:function(h){
   h.innerHTML='<div class="brief" id="brief"></div><div class="noprint" style="margin-top:12px;display:flex;gap:8px"><button class="k-btn k-primary" data-core id="gen">\u26a1 Generate brief</button><button class="k-btn" id="prt">Print / PDF</button></div><div class="k-card noprint" style="margin-top:12px"><h4 style="margin:0 0 8px">Symptom trend (avg severity / day)</h4><div id="trend"></div></div>';
   h.querySelector('#prt').onclick=function(){window.print();};
   function gen(silent){renderBrief(h.querySelector('#brief'));drawTrend(h.querySelector('#trend'));if(!silent)K.toast('Brief generated \u2014 ready to print');}
   h.querySelector('#gen').onclick=function(){gen(false);};
   gen(true);
   function drawTrend(elx){
    var per={};for(var d=13;d>=0;d--)per[d]=[];
    logs.forEach(function(l){var diff=Math.round((new Date(2026,9,3)-l.d)/864e5);if(per[diff])per[diff].push(l.sev);});
    var pts=[];for(var d=13;d>=0;d--){var a=per[d];pts.push(a.length?a.reduce(function(x,y){return x+y;})/a.length:0);}
    K.line(elx,[{name:'Avg severity',color:'#1d6b41',points:pts}]);
   }
   function renderBrief(b){
    var top={};logs.forEach(function(l){top[l.s]=(top[l.s]||0)+1;});
    var tops=Object.keys(top).sort(function(a,c){return top[c]-top[a];}).slice(0,4);
    var worst=logs.slice().sort(function(a,c){return c.sev-a.sev;})[0];
    var qs=[];h.parentElement.querySelectorAll('#ql input:checked');
    var checked=[];document.querySelectorAll('.qitem input:checked').forEach(function(c){checked.push(questions[+c.getAttribute('data-i')]);});
    if(!document.querySelectorAll('.qitem input').length)checked=questions.slice();
    b.innerHTML='<h2>Visit brief \u00b7 Eleanor Vance</h2><div class="k-muted k-small">PCP visit \u00b7 Oct 6, 2026 \u00b7 Dr. Priya Alvarez \u00b7 Generated by VisitReady (demo)</div>'
    +'<div class="sec-t">Top concerns (14 days)</div><ul>'+tops.map(function(t){return '<li><b>'+K.esc(t)+'</b> \u2014 '+top[t]+' episodes</li>';}).join('')+'</ul>'
    +'<div class="sec-t">Worst episode</div><div>'+K.esc(worst.s)+' \u2014 severity '+worst.sev+'/10 on '+K.when(worst.d)+(worst.note?' ('+K.esc(worst.note)+')':'')+'</div>'
    +'<div class="sec-t">Medication changes since last visit</div><div>Metformin 500mg \u2192 750mg nightly (titrating to 1000mg); Lisinopril 10mg \u2192 20mg proposed; Omeprazole 20mg started for GERD.</div>'
    +'<div class="sec-t">Questions for the doctor ('+checked.length+')</div><ol>'
    +checked.map(function(q){var qi=questions.indexOf(q);var an=anno[qi];
       return '<li>'+K.esc(q)
       +(an==='addressed'?' '+K.badge('ADDRESSED','ok'):an==='followup'?' '+K.badge('FOLLOW UP','warn'):'')
       +'<span class="noprint" style="margin-left:8px;white-space:nowrap"><button class="k-btn ann" data-q="'+qi+'" data-a="addressed" style="font-size:11px;padding:3px 8px">Addressed</button> <button class="k-btn ann" data-q="'+qi+'" data-a="followup" style="font-size:11px;padding:3px 8px">Follow up</button></span></li>';}).join('')+'</ol>'
    +'<div class="sec-t">Patient goal</div><div>\u201cI want to climb the stairs without stopping.\u201d</div>';
    b.querySelectorAll('.ann').forEach(function(btn){btn.onclick=function(){var q=+btn.getAttribute('data-q');anno[q]=btn.getAttribute('data-a');vrStore.set('anno',anno);renderBrief(b);K.toast('Annotation saved','ok');};});
   }
 }}
]);

</script>
</body>
</html>
