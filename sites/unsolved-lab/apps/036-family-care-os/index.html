<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kinship — Family Care OS</title>
<link rel="stylesheet" href="../../shared/kit.css">
<script src="../../shared/kit.js"></script>
<style>

:root{--bg:#f5f6f8;--panel:#ffffff;--panel2:#eef0f4;--ink:#1c2430;--muted:#6b7686;--line:#dfe4ec;--accent:#2563eb;--accent2:#7c3aed;--good:#1a9e5c;--warn:#b97a1a;--bad:#cf3d3d;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5}
.k-wrap{max-width:1180px;margin:0 auto;padding:20px}
.k-nav{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.k-nav-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.k-nav-t{font-weight:800;font-size:18px;letter-spacing:-.01em}.k-nav-s{color:var(--muted);font-size:13px}
.k-nav-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.k-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.k-btn:hover{filter:brightness(.96)}.k-btn:active{transform:translateY(1px)}
.k-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.k-input,.k-select,textarea.k-input{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;background:var(--panel);color:var(--ink);width:100%;font-family:inherit}
.k-input:focus,.k-select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.k-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.k-grid{display:grid;gap:14px}.k-g2{grid-template-columns:repeat(2,1fr)}.k-g3{grid-template-columns:repeat(3,1fr)}.k-g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.k-g2,.k-g3,.k-g4{grid-template-columns:1fr}}
.k-muted{color:var(--muted)}.k-small{font-size:13px}
.k-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.k-badge.ok{background:#e3f6ea;color:#12784a;border-color:#bde6cd}.k-badge.warn{background:#fdf2df;color:#96600f;border-color:#f0d9ab}
.k-badge.bad{background:#fdeaea;color:#b02727;border-color:#f3c1c1}.k-badge.info{background:#e7f0fd;color:#1c59b8;border-color:#c2d9f6}
.k-tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
.k-tab{border:none;background:none;padding:10px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:600;white-space:nowrap}
.k-tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th,.k-table td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.k-table th{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.k-table td.num,.k-table th.num{text-align:right;font-variant-numeric:tabular-nums}
.k-twrap{overflow-x:auto}
.k-kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.k-kpi-l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.k-kpi-v{font-size:30px;font-weight:800;letter-spacing:-.02em}.k-kpi-d{font-size:13px;color:var(--good);font-weight:600}
.k-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:#1f2937;color:#fff;padding:11px 20px;border-radius:11px;opacity:0;transition:.28s;z-index:400;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.k-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.k-toast.warn{background:#92600f}.k-toast.bad{background:#a12828}
.k-modal-ov{position:fixed;inset:0;background:rgba(15,20,30,.5);display:flex;align-items:center;justify-content:center;z-index:300;padding:18px}
.k-modal{background:var(--panel);border-radius:16px;max-width:580px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.k-modal-h{font-weight:800;font-size:18px;padding:18px 20px 0}
.k-modal-b{padding:14px 20px}.k-modal-f{padding:4px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.k-empty{text-align:center;padding:44px 20px;color:var(--muted)}
.k-empty-t{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:6px}.k-empty-s{margin-bottom:14px}
.k-hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
.k-hero h1{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}.k-hero p{margin:0;color:var(--muted)}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.k-split{grid-template-columns:1fr}}
.k-bar-row{display:flex;align-items:center;gap:10px;margin:7px 0}
.k-bar-l{width:150px;flex:none;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-bar-t{flex:1;background:var(--panel2);border-radius:6px;height:14px;overflow:hidden}
.k-bar-f{height:100%;background:var(--accent);border-radius:6px;transition:width .5s}
.k-bar-v{width:64px;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.k-donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.k-donut{width:130px;height:130px;border-radius:50%;position:relative;flex:none}
.k-donut-c{position:absolute;inset:26px;background:var(--panel);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.k-dl{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.k-dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.k-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.k-lg{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.k-tl{display:flex;gap:12px;margin:0 0 4px}.k-tl-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none;margin-top:5px}
.k-tl-dot.ok{background:var(--good)}.k-tl-dot.warn{background:var(--warn)}.k-tl-dot.bad{background:var(--bad)}.k-tl-dot.info{background:var(--accent)}
.k-tl-t{font-size:12px;color:var(--muted);font-weight:600}.k-tl-ti{font-weight:700}.k-tl-b{font-size:13.5px;color:var(--muted)}
.k-graph .k-node{fill:var(--panel);stroke:var(--accent);stroke-width:2.5}
.k-graph .k-node-s{font-size:13px;font-weight:800;fill:var(--ink)}
.k-graph .k-node-l{font-size:11.5px;fill:var(--muted);font-weight:600}
.k-graph .k-edge{stroke:var(--line);stroke-width:2}
.k-graph .k-edge-l{font-size:10.5px;fill:var(--muted)}
.k-line polyline{stroke-linejoin:round;stroke-linecap:round}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex:none}


:root{--accent:#b84a2e;--accent2:#e07b4f;--bg:#f7f1e8;--panel:#fffdf8;--panel2:#f3e9d8;--ink:#33261c;}
body{font-family:'Avenir Next','Segoe UI',sans-serif}
.big{font-size:15px;font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.check.done span.tx{color:var(--muted);text-decoration:line-through}
.cover{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.pbar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:6px}
.pbar>div{height:100%;background:var(--accent);transition:width .4s}

</style>
</head>

<script>
(function(){

function hash(s){s=String(s);var h=1779033703^s.length;for(var i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}

function tabs(host,defs){host.innerHTML='';var bar=el('<div class="k-tabs"></div>');var body=el('<div class="k-tabs-b"></div>');defs.forEach(function(d,i){var b=el('<button class="k-tab'+(i===0?' on':'')+'">'+esc(d.label)+'</button>');b.onclick=function(){var bs=bar.querySelectorAll('.k-tab');for(var k=0;k<bs.length;k++)bs[k].classList.remove('on');b.classList.add('on');body.innerHTML='';d.render(body);};bar.appendChild(b);});host.appendChild(bar);host.appendChild(body);defs[0].render(body);}

var pct=function(x){return (x*100).toFixed(1)+'%';};

function graph(host,g){host.innerHTML='';var n=g.nodes,W=560,H=300;var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('class','k-graph');svg.style.width='100%';n.forEach(function(nd,i){var a=(i/n.length)*Math.PI*2-Math.PI/2;nd._x=W/2+Math.cos(a)*(W/2-80);nd._y=H/2+Math.sin(a)*(H/2-55);});(g.edges||[]).forEach(function(e){var A=null,B=null;n.forEach(function(x){if(x.id===e.a)A=x;if(x.id===e.b)B=x;});if(!A||!B)return;var l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',A._x);l.setAttribute('y1',A._y);l.setAttribute('x2',B._x);l.setAttribute('y2',B._y);l.setAttribute('class','k-edge');svg.appendChild(l);if(e.label){var t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',(A._x+B._x)/2);t.setAttribute('y',(A._y+B._y)/2-5);t.setAttribute('class','k-edge-l');t.setAttribute('text-anchor','middle');t.textContent=e.label;svg.appendChild(t);}});n.forEach(function(nd){var gr=document.createElementNS('http://www.w3.org/2000/svg','g');var c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',nd._x);c.setAttribute('cy',nd._y);c.setAttribute('r','26');if(nd.color)c.setAttribute('fill',nd.color);c.setAttribute('class','k-node');gr.appendChild(c);var s=document.createElementNS('http://www.w3.org/2000/svg','text');s.setAttribute('x',nd._x);s.setAttribute('y',nd._y+5);s.setAttribute('text-anchor','middle');s.setAttribute('class','k-node-s');s.textContent=initials(nd.label);gr.appendChild(s);var t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',nd._x);t.setAttribute('y',nd._y+46);t.setAttribute('text-anchor','middle');t.setAttribute('class','k-node-l');t.textContent=nd.label;gr.appendChild(t);svg.appendChild(gr);});host.appendChild(svg);}
function line(host,series){host.innerHTML='';var W=560,H=220,P=34;var all=[];series.forEach(function(s){s.points.forEach(function(v){all.push(v);});});var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);var npts=0;series.forEach(function(s){if(s.points.length>npts)npts=s.points.length;});function X(i){return P+i*(W-2*P)/Math.max(1,(npts-1));}function Y(v){return H-P-((v-mn)/((mx-mn)||1))*(H-2*P);}var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('class','k-line');svg.style.width='100%';series.forEach(function(s){var p=document.createElementNS('http://www.w3.org/2000/svg','polyline');p.setAttribute('points',s.points.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);}).join(' '));p.setAttribute('fill','none');p.setAttribute('stroke',s.color||'#3b82f6');p.setAttribute('stroke-width','2.5');svg.appendChild(p);});host.appendChild(svg);var lg=el('<div class="k-legend"></div>');series.forEach(function(s){lg.appendChild(el('<span class="k-lg"><span class="k-dot" style="background:'+(s.color||'#3b82f6')+'"></span>'+esc(s.name)+'</span>'));});host.appendChild(lg);}

];
var cover=[
 {who:'Maya Vance',rel:'Daughter',color:'#b84a2e',doing:'Meds + appointments today',till:'6:00 PM'},
 {who:'James Vance',rel:'Son',color:'#2b6cb0',doing:'Bills + handyman Sat',till:'Sun'},
 {who:'Rosa M.',rel:'Home aide',color:'#1a9e5c',doing:'Mon/Wed/Fri 9\u201312',till:'Ongoing'}
];
var agenda=[
 {t:'8:00 AM',title:'Morning meds + BP check',body:'Lisinopril, omeprazole. Log BP in VisitReady.',kind:'ok'},
 {t:'10:30 AM',title:'Rosa arrives \u2014 light housekeeping',body:'Laundry + bathroom. Mom prefers the blue towels.',kind:'info'},
 {t:'12:30 PM',title:'Lunch together',body:'Low-sodium soup in freezer (labeled Tue).',kind:''},
 {t:'3:00 PM',title:'Walk \u2014 15 min, flat route',body:'Bring walker. No hills after the dizzy spell Thursday.',kind:'warn'},
 {t:'6:00 PM',title:'Maya hands off to James',body:'Evening meds: metformin with dinner, atorvastatin at bedtime.',kind:''}
];
function save(){store.set('meds',meds);store.set('tasks',tasks);store.set('feed',feed);}
var feed=store.get('feed')||[{who:'Rosa M.',what:'Checked in for her shift',t:'9:02 AM'},{who:'Maya',what:'Completed Metformin 750mg + Lisinopril 10mg',t:'8:15 AM'}];
function feedAdd(who,what){var d=new Date();var t=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});feed.unshift({who:who,what:what,t:t});feed=feed.slice(0,12);save();renderFeed();}
var wrap=K.el('<div class="k-wrap"></div>');document.body.appendChild(wrap);
wrap.appendChild(K.el('<div class="k-hero"><h1>Today\u2019s command center</h1><p>One glance: what\u2019s happening, who\u2019s covering what, and what still needs doing. Demo family is fictional.</p></div>'));
var kpis=K.el('<div class="k-grid k-g4" style="margin-bottom:16px"></div>');wrap.appendChild(kpis);
function renderKpis(){
 kpis.innerHTML='';
 var md=meds.filter(function(m){return m.done;}).length;
 var tk=tasks.filter(function(t){return t.done;}).length;
 K.kpi(kpis.appendChild(K.el('<div></div>')),{label:'Meds today',value:md+'/'+meds.length,delta:md===meds.length?'All done \u2713':'Still due'});
 K.kpi(kpis.appendChild(K.el('<div></div>')),{label:'Tasks done',value:tk+'/'+tasks.length});
 K.kpi(kpis.appendChild(K.el('<div></div>')),{label:'Covering today',value:'3',delta:'Maya \u00b7 James \u00b7 Rosa'});
 K.kpi(kpis.appendChild(K.el('<div></div>')),{label:'Next appointment',value:'Thu 10a',delta:'PT eval \u00b7 Bay PT'});
}
var grid=K.el('<div class="k-grid k-g2"></div>');wrap.appendChild(grid);
var c1=K.el('<div class="k-card"><h3 style="margin-top:0">\ud83d\udcc5 Today\u2019s agenda</h3><div id="ag"></div></div>');
var c2=K.el('<div class="k-card"><h3 style="margin-top:0">\ud83d\udc65 Who\u2019s covering what</h3><div id="cv"></div></div>');
var c3=K.el('<div class="k-card"><h3 style="margin-top:0">\ud83d\udc8a Medications today</h3><div id="md"></div><div class="pbar"><div id="mpb"></div></div></div>');
var c4=K.el('<div class="k-card"><h3 style="margin-top:0">\u2705 Tasks & bills</h3><div id="tk"></div><div class="noprint" style="margin-top:10px;display:flex;gap:8px"><input class="k-input" id="nt" placeholder="Add a task\u2026"><button class="k-btn k-primary" data-core id="at">Add</button></div></div>');
var c5=K.el('<div class="k-card"><h3 style="margin-top:0">\ud83d\udce3 Family feed</h3><div id="fd" class="k-small"></div></div>');
grid.appendChild(c1);grid.appendChild(c2);grid.appendChild(c3);grid.appendChild(c4);grid.appendChild(c5);
function renderFeed(){var box=c5.querySelector('#fd');box.innerHTML=feed.length?feed.map(function(f){return '<div style="padding:7px 0;border-bottom:1px dashed var(--line)"><b>'+K.esc(f.who)+'</b> \u00b7 <span class="k-muted">'+K.esc(f.t)+'</span><br>'+K.esc(f.what)+'</div>';}).join(''):'<span class="k-muted">Nothing yet today.</span>';}
renderFeed();
K.timeline(c1.querySelector('#ag'),agenda);
cover.forEach(function(c){
 c2.querySelector('#cv').appendChild(K.el('<div class="cover"><span class="av" style="background:'+c.color+'">'+K.initials(c.who)+'</span><div><div class="big">'+K.esc(c.who)+' <span class="k-muted k-small">'+K.esc(c.rel)+'</span></div><div class="k-small">'+K.esc(c.doing)+' \u00b7 until '+K.esc(c.till)+'</div></div></div>'));
});
function renderMeds(){
 var box=c3.querySelector('#md');box.innerHTML='';
 meds.forEach(function(m,i){
  var d=K.el('<div class="check'+(m.done?' done':'')+'"><input type="checkbox" '+(m.done?'checked':'')+'><span class="tx"><b>'+K.esc(m.n)+'</b><br><span class="k-muted k-small">'+K.esc(m.w)+'</span></span></div>');
  d.querySelector('input').onchange=function(e){m.done=e.target.checked;feedAdd('Maya',(m.done?'Completed ':'Reopened ')+m.n);save();renderMeds();renderKpis();
  if(meds.every(function(x){return x.done;}))K.modal({title:'\ud83c\udf89 All meds done',body:'<p>Eleanor took every dose today. Everyone in the family circle can see it \u2014 no more \u201ci thought you were handling that\u201d.</p>',actions:[{label:'Nice',primary:true}]});};
  box.appendChild(d);
 });
 var pctm=meds.filter(function(m){return m.done;}).length/meds.length*100;
 c3.querySelector('#mpb').style.width=pctm+'%';
}
function renderTasks(){
 var box=c4.querySelector('#tk');box.innerHTML='';
 tasks.forEach(function(t,i){
  var d=K.el('<div class="check'+(t.done?' done':'')+'"><input type="checkbox" '+(t.done?'checked':'')+'><span class="tx">'+K.esc(t.t)+'<br><span class="k-badge info">'+K.esc(t.who)+'</span></span></div>');
  d.querySelector('input').onchange=function(e){t.done=e.target.checked;feedAdd(t.who,(t.done?'Finished: ':'Reopened: ')+t.t);save();renderTasks();renderKpis();};
  box.appendChild(d);
 });
}
c4.querySelector('#at').onclick=function(){
 var v=c4.querySelector('#nt').value.trim();if(!v){K.toast('Type a task first','warn');return;}
 tasks.push({t:v,who:'Maya',done:false});c4.querySelector('#nt').value='';save();renderTasks();renderKpis();K.toast('Task added');
};
renderMeds();renderTasks();renderKpis();

</script>
</body>
</html>
