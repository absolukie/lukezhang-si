<style>

.k-wrap{max-width:1180px;margin:0 auto;padding:20px}
.k-nav{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}

.k-nav-t{font-weight:800;font-size:18px;letter-spacing:-.01em}.k-nav-s{color:var(--muted);font-size:13px}
.k-nav-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.k-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.k-btn:hover{filter:brightness(.96)}.k-btn:active{transform:translateY(1px)}
.k-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.k-input,.k-select,textarea.k-input{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;background:var(--panel);color:var(--ink);width:100%;font-family:inherit}
.k-input:focus,.k-select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.k-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.k-grid{display:grid;gap:14px}.k-g2{grid-template-columns:repeat(2,1fr)}.k-g3{grid-template-columns:repeat(3,1fr)}.k-g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.k-g2,.k-g3,.k-g4{grid-template-columns:1fr}}
.k-muted{color:var(--muted)}.k-small{font-size:13px}
.k-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.k-badge.ok{background:#e3f6ea;color:#12784a;border-color:#bde6cd}.k-badge.warn{background:#fdf2df;color:#96600f;border-color:#f0d9ab}
.k-badge.bad{background:#fdeaea;color:#b02727;border-color:#f3c1c1}.k-badge.info{background:#e7f0fd;color:#1c59b8;border-color:#c2d9f6}
.k-tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
.k-tab{border:none;background:none;padding:10px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:600;white-space:nowrap}
.k-tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th,.k-table td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.k-table th{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.k-table td.num,.k-table th.num{text-align:right;font-variant-numeric:tabular-nums}
.k-twrap{overflow-x:auto}
.k-kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.k-kpi-l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

.k-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.k-toast.warn{background:#92600f}.k-toast.bad{background:#a12828}
.k-modal-ov{position:fixed;inset:0;background:rgba(15,20,30,.5);display:flex;align-items:center;justify-content:center;z-index:300;padding:18px}
.k-modal{background:var(--panel);border-radius:16px;max-width:580px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.k-modal-h{font-weight:800;font-size:18px;padding:18px 20px 0}
.k-modal-b{padding:14px 20px}.k-modal-f{padding:4px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.k-empty{text-align:center;padding:44px 20px;color:var(--muted)}
.k-empty-t{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:6px}.k-empty-s{margin-bottom:14px}

.k-hero h1{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}.k-hero p{margin:0;color:var(--muted)}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.k-split{grid-template-columns:1fr}}
.k-bar-row{display:flex;align-items:center;gap:10px;margin:7px 0}
.k-bar-l{width:150px;flex:none;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-bar-t{flex:1;background:var(--panel2);border-radius:6px;height:14px;overflow:hidden}
.k-bar-f{height:100%;background:var(--accent);border-radius:6px;transition:width .5s}
.k-bar-v{width:64px;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.k-donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.k-donut{width:130px;height:130px;border-radius:50%;position:relative;flex:none}
.k-donut-c{position:absolute;inset:26px;background:var(--panel);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.k-dl{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.k-dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.k-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.k-lg{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.k-tl{display:flex;gap:12px;margin:0 0 4px}.k-tl-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none;margin-top:5px}
.k-tl-dot.ok{background:var(--good)}.k-tl-dot.warn{background:var(--warn)}.k-tl-dot.bad{background:var(--bad)}.k-tl-dot.info{background:var(--accent)}
.k-tl-t{font-size:12px;color:var(--muted);font-weight:600}.k-tl-ti{font-weight:700}.k-tl-b{font-size:13.5px;color:var(--muted)}
.k-graph .k-node{fill:var(--panel);stroke:var(--accent);stroke-width:2.5}
.k-graph .k-node-s{font-size:13px;font-weight:800;fill:var(--ink)}
.k-graph .k-node-l{font-size:11.5px;fill:var(--muted);font-weight:600}
.k-graph .k-edge{stroke:var(--line);stroke-width:2}
.k-graph .k-edge-l{font-size:10.5px;fill:var(--muted)}
.k-line polyline{stroke-linejoin:round;stroke-linecap:round}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex:none}


:root{--accent:#8b9cf0;--accent2:#b7a6f5;--bg:#141827;--panel:#1c2236;--panel2:#262e48;--ink:#eef1f8;--muted:#98a1b8;--line:#2e3752;}
.k-primary{background:var(--accent);border-color:var(--accent);color:#141827}
.hocard{background:linear-gradient(160deg,#232b47,#1a2036);border:1px solid var(--line);border-radius:16px;padding:22px}
.pat{background:#3a2a10;border:1px solid #8a6a1f;border-radius:10px;padding:10px 12px;font-size:13.5px;color:#ffd88a;margin-bottom:12px}
.hosec{margin-bottom:14px}.hosec h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.moodrow{display:flex;gap:8px;flex-wrap:wrap}
.mood{border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;background:var(--panel2)}
.mood.on{border-color:var(--accent);background:#2c3a63;font-weight:700}
.hist{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;background:var(--panel)}
.hist:hover{border-color:var(--accent)}
textarea.k-input{min-height:90px;resize:vertical}

</style>

var histLog=store.get('hist')||[
 {when:'Oct 2 \u00b7 11:04 PM',from:'Rosa M. \u2192 James',mood:'Calm',meds:'All evening meds taken with dinner. No issues.',inc:'Brief dizzy spell at 4 PM \u2014 sat down, resolved in 2 min. BP 136/84.',open:'PT eval Thu \u2014 bring walker.'},
 {when:'Oct 1 \u00b7 11:12 PM',from:'James \u2192 Rosa M.',mood:'Restless',meds:'Metformin taken; atorvastatin refused \u2014 said it upsets stomach.',inc:'Dizzy spell on the stairs \u2014 sat down, resolved in 3 min. BP 140/90. Called nurse line; advised to monitor.',open:'Confirm atorvastatin AM. Watch for dizziness.'}
];
var MOODS=['\ud83d\ude0a Calm','\ud83d\ude10 Okay','\ud83d\ude1f Restless','\ud83d\ude22 Sad','\ud83d\ude21 Agitated','\ud83d\ude34 Sleepy'];
var mood='\ud83d\ude0a Calm';
var wrap=K.el('<div class="k-wrap"></div>');document.body.appendChild(wrap);
wrap.appendChild(K.el('<div class="k-hero"><h1>Tonight\u2019s handoff, in 60 seconds</h1><p>The outgoing caregiver taps through meds, mood, incidents and open tasks \u2014 the next shift gets one clear card. Demo content is fictional.</p></div>'));
var split=K.el('<div class="k-split"></div>');wrap.appendChild(split);
var form=K.el('<div class="k-card"><h3 style="margin-top:0">Outgoing: Rosa M. \u2192 James</h3>'
 +'<div class="field"><label>Medications given this shift</label><textarea class="k-input" id="hmeds">All evening meds taken with dinner (metformin 750mg, atorvastatin 20mg). Morning lisinopril + omeprazole taken at 8 AM.</textarea></div>'
 +'<div class="field"><label>Overall mood</label><div class="moodrow" id="hmood"></div></div>'
 +'<div class="field"><label>Appetite / meals</label><input class="k-input" id="hfood" value="Good appetite \u2014 finished lunch, half of dinner."></div>'
 +'<div class="field"><label>Incidents / concerns</label><textarea class="k-input" id="hinc" style="min-height:60px">Brief dizzy spell at 3 PM on the walk \u2014 sat down, resolved in 2 min. BP after: 138/88.</textarea></div>'
 +'<div class="field"><label>Open tasks for next shift</label><textarea class="k-input" id="hopen" style="min-height:60px">- PT eval Thursday 10 AM \u2014 bring walker\n- CVS refill pickup (metformin)\n- Watch stairs after today\u2019s dizzy spell</textarea></div>'
 +'<button class="k-btn k-primary" data-core id="gen" style="width:100%;padding:12px;font-size:16px">\u26a1 Generate handoff card</button></div>');
var out=K.el('<div><div class="hocard" id="ocard"><div class="k-muted">Your generated handoff card appears here.</div></div><h3 style="margin:18px 0 10px">Recent handoffs</h3><div id="hist"></div></div>');
split.appendChild(form);split.appendChild(out);
var mr=form.querySelector('#hmood');
MOODS.forEach(function(m){
 var b=K.el('<div class="mood'+(m===mood?' on':'')+'">'+m+'</div>');
 b.onclick=function(){mood=m;mr.querySelectorAll('.mood').forEach(function(x){x.classList.remove('on');});b.classList.add('on');};
 mr.appendChild(b);
});
function renderHist(){
 var hh=out.querySelector('#hist');hh.innerHTML='';
 histLog.forEach(function(hx){
  var d=K.el('<div class="hist"><div style="font-weight:800;font-size:14px">'+K.esc(hx.when)+' \u00b7 '+K.esc(hx.from)+'</div><div class="k-muted k-small">Mood: '+K.esc(hx.mood)+' \u00b7 '+K.esc(hx.inc==='None.'?'No incidents':'1 incident')+'</div></div>');
  d.onclick=function(){K.modal({title:'Handoff \u00b7 '+hx.when,body:cardHTML(hx),actions:[{label:'Close'}]});};
  hh.appendChild(d);
 });
}
function cardHTML(hx){
 return '<div class="hosec"><h4>Medications</h4><div>'+K.esc(hx.meds).replace(/\n/g,'<br>')+'</div></div>'
 +'<div class="hosec"><h4>Mood</h4><div>'+K.esc(hx.mood)+'</div></div>'
 +'<div class="hosec"><h4>Incidents</h4><div>'+K.esc(hx.inc).replace(/\n/g,'<br>')+'</div></div>'
 +'<div class="hosec"><h4>Open tasks</h4><div>'+K.esc(hx.open).replace(/\n/g,'<br>')+'</div></div>';
}
form.querySelector('#gen').onclick=function(){
 var hx={when:'Oct 3 \u00b7 11:00 PM',from:'Rosa M. \u2192 James',mood:mood,
  meds:form.querySelector('#hmeds').value,inc:form.querySelector('#hinc').value||'None.',
  open:form.querySelector('#hopen').value,
  food:form.querySelector('#hfood').value};
 hx.inc+=' Meals: '+hx.food;
 /* Incident-pattern detection: recurring incidents across recent handoffs. */
 var dizzy=histLog.filter(function(h){return /dizz/i.test(h.inc);}).length+(/dizz/i.test(hx.inc)?1:0);
 var pat=dizzy>=2?'<div class="pat">\u26a0 <b>Pattern detected:</b> '+dizzy+' dizzy spells across recent handoffs. Flag this trend for the nurse or doctor \u2014 don\u2019t let it hide in the log.</div>':'';
 var oc=out.querySelector('#ocard');
 oc.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h3 style="margin:0">\ud83c\udf19 Shift handoff</h3>'+K.badge('TONIGHT','info')+'</div><div class="k-muted k-small" style="margin-bottom:12px">'+K.esc(hx.when)+' \u00b7 '+K.esc(hx.from)+'</div>'
  +pat
  +cardHTML(hx)
  +'<div style="display:flex;gap:8px;margin-top:10px"><button class="k-btn k-primary" id="cp">Copy handoff</button><button class="k-btn" id="sv">Save to log</button></div>';
 oc.querySelector('#cp').onclick=function(){
  K.copy('SHIFT HANDOFF \u2014 '+hx.when+' ('+hx.from+')\nMood: '+hx.mood+'\nMeds: '+hx.meds+'\nIncidents: '+hx.inc+'\nOpen: '+hx.open);
 };
 oc.querySelector('#sv').onclick=function(){
  histLog.unshift(hx);store.set('hist',histLog);renderHist();K.toast('Handoff saved to log');
 };
 K.toast('Handoff card generated');
};
renderHist();
// Re-stage: the form ships pre-filled, so generate the card on load — the
// magic moment (crisp card + dizzy-spell pattern alert) lands immediately.
setTimeout(function(){form.querySelector('#gen').click();},700);

</script>
</body>
</html>
