 {t:"Sep 26",title:"Dr. Chen's assessment",body:"Geriatrician recommends 24/7 supervision. Written note filed.",kind:"warn"},
 {t:"Oct 2",title:"Mom's wishes recorded",body:"Mom prefers staying home but consents to family deciding if safety requires it.",kind:"info"}
]});
function save(){store.set("state",state);}
function weighted(opt){
 let tot=0,wsum=0;
 CRIT.forEach(c=>{const w=state.weights[c.id]||0;tot+=opt.scores[c.id]*w;wsum+=w;});
 return wsum?tot/wsum:0;
}
const wrap=K.el('<div class="k-wrap"></div>');document.body.appendChild(wrap);
wrap.appendChild(K.el('<div class="k-hero"><h1>Should Mom move to assisted living?</h1><p>The biggest family decision, written down properly: options scored against what matters, every decider\'s stance recorded, and the reasoning preserved — so nobody re-litigates it at Thanksgiving.</p><div style="margin-top:12px" id="status"></div><div style="margin-top:12px"><button class="k-btn" id="cpsum">Copy summary</button></div></div>'));
const tabs=K.el('<div></div>');wrap.appendChild(tabs);
K.tabs(tabs,[
 {id:"weigh",label:"1 · Weigh options",render:renderWeigh},
 {id:"deciders",label:"2 · Deciders",render:renderDeciders},
 {id:"timeline",label:"3 · Discussion log",render:renderLog}
]);
function refreshStatus(){
 const s=wrap.querySelector("#status");
 const w=OPTIONS.slice().sort((a,b)=>weighted(b)-weighted(a))[0];
 const signed=state.votes.filter(v=>v.signed).length;
 s.innerHTML=state.decided?(K.badge("Decision recorded: "+w.name,"ok")+" "+K.badge(signed+" of "+state.votes.length+" signed",signed===state.votes.length?"ok":"warn")):("Current leader: <b>"+K.esc(w.name)+"</b> ("+weighted(w).toFixed(0)+"/100) — "+K.badge("Undecided","warn"));
}
function renderWeigh(h){
 h.innerHTML='';
 const c=K.el('<div class="k-card"><h3>What matters most? <span class="k-muted" style="font-weight:400;font-size:13px">Drag to set importance</span></h3><div id="cr"></div><p class="k-muted" style="font-size:13px">Weights always total 100.</p></div>');
 h.appendChild(c);const cr=c.querySelector("#cr");
 CRIT.forEach(ct=>{
   const d=K.el('<div class="crit"><div class="row"><span>'+ct.label+'</span><span id="v-'+ct.id+'">'+state.weights[ct.id]+'</span></div><input type="range" min="0" max="60" value="'+state.weights[ct.id]+'" id="r-'+ct.id+'"></div>');
   d.querySelector("#r-"+ct.id).oninput=e=>{
     state.weights[ct.id]=+e.target.value;
     const sum=Object.values(state.weights).reduce((a,b)=>a+b,0);
     if(sum!==100){const diff=100-sum;const others=CRIT.filter(x=>x.id!==ct.id);const per=Math.round(diff/others.length);others.forEach(o=>{state.weights[o.id]=Math.max(0,state.weights[o.id]+per);});
       const s2=Object.values(state.weights).reduce((a,b)=>a+b,0);state.weights[others[0].id]+=100-s2;}
     save();CRIT.forEach(x=>{const rr=h.querySelector("#r-"+x.id);if(rr&&x.id!==ct.id)rr.value=state.weights[x.id];const vv=h.querySelector("#v-"+x.id);if(vv)vv.textContent=state.weights[x.id];});
     h.querySelector("#v-"+ct.id).textContent=state.weights[ct.id];
     paintScores();refreshStatus();
   };
   cr.appendChild(d);
 });
 const sc=K.el('<div id="scores" style="margin-top:8px"></div>');h.appendChild(sc);
 const fin=K.el('<div class="k-card" style="margin-top:14px"><h3>Record the decision</h3><p class="k-muted">When the family agrees, lock it in. The ledger keeps the reasoning forever.</p><button class="k-btn k-primary" id="lock">'+(state.decided?"Reopen decision":"Record decision")+'</button></div>');
 h.appendChild(fin);
 fin.querySelector("#lock").onclick=()=>{state.decided=!state.decided;save();renderWeigh(h);refreshStatus();K.toast(state.decided?"Decision locked into the ledger":"Decision reopened",state.decided?"ok":"warn");};
 function paintScores(){
   sc.innerHTML='';
   const ranked=OPTIONS.slice().sort((a,b)=>weighted(b)-weighted(a));
   ranked.forEach((o,i)=>{
     const w=weighted(o);
     const d=K.el('<div class="opt'+(i===0?" winner":"")+'">'+(i===0?K.badge("Leading option","ok"):"")+'<h3>'+K.esc(o.name)+'</h3><div class="k-muted">'+K.esc(o.cost)+'</div><div class="scorebar"><i style="width:'+w.toFixed(0)+'%"></i></div><b>'+w.toFixed(0)+' / 100</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:13px"><div><b style="color:var(--good)">Pros</b><ul style="margin:4px 0;padding-left:18px">'+o.pros.map(p=>"<li>"+K.esc(p)+"</li>").join("")+'</ul></div><div><b style="color:var(--bad)">Cons</b><ul style="margin:4px 0;padding-left:18px">'+o.cons.map(p=>"<li>"+K.esc(p)+"</li>").join("")+'</ul></div></div><div style="margin-top:8px" class="k-muted">Criterion scores: '+CRIT.map(cc=>cc.label+" "+o.scores[cc.id]).join(" · ")+'</div></div>');
     sc.appendChild(d);
   });
 }
 paintScores();refreshStatus();
}
function renderDeciders(h){
 h.innerHTML='';
 const tally={support:0,lean:0,oppose:0};
 state.votes.forEach(v=>tally[v.stance]++);
 const k=K.el('<div class="k-kpis"></div>');h.appendChild(k);
 K.kpi(k,{label:"Support",value:String(tally.support)});K.kpi(k,{label:"Leaning",value:String(tally.lean)});K.kpi(k,{label:"Oppose",value:String(tally.oppose)});
 state.votes.forEach((v,i)=>{
   const opt=OPTIONS.find(o=>o.id===v.pick);
    const d=K.el("<div class='vote "+v.stance+"'><b>"+K.esc(v.name)+"</b> <span class='k-muted'>&middot; "+K.esc(DECIDERS[i]?DECIDERS[i].role:"")+"</span><div style='margin:6px 0'>"+(v.stance==="support"?K.badge("Supports","ok"):v.stance==="lean"?K.badge("Leaning","warn"):K.badge("Opposes","bad"))+" favors: <b>"+K.esc(opt?opt.name:"-")+"</b></div><div class='k-muted' style='font-style:italic'>&ldquo;"+K.esc(v.note)+"&rdquo;</div><div style='margin-top:8px'><select class='k-select' style='max-width:220px' id='st'><option value='support'>Supports</option><option value='lean'>Leaning</option><option value='oppose'>Opposes</option></select></div></div>");
   const sel=d.querySelector("#st");sel.value=v.stance;
   sel.onchange=()=>{v.stance=sel.value;save();renderDeciders(h);K.toast("Stance updated","ok");};
   const sa=K.el("<div style='margin-top:8px'></div>");d.appendChild(sa);
   if(state.decided){
     if(v.signed){sa.innerHTML=K.badge("Signed "+K.esc(v.signed),"ok");}
     else{const sb=K.el("<button class='k-btn'>Sign decision</button>");sb.onclick=()=>{v.signed="Oct 4, 2026";state.log.push({t:"Oct 4",title:v.name+" signed the decision",body:"Recorded sign-off on the locked ledger entry.",kind:"ok"});save();renderDeciders(h);refreshStatus();K.toast("Signed — recorded in the ledger","ok");};sa.appendChild(sb);}
   }
   h.appendChild(d);
 });
 const add=K.el('<div class="k-card" style="margin-top:14px"><h3>Add a decider</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><input class="k-input" id="nm" placeholder="Name" style="max-width:220px"><select class="k-select" id="pk" style="max-width:240px">'+OPTIONS.map(o=>'<option value="'+o.id+'">'+K.esc(o.name)+'</option>').join("")+'</select><button class="k-btn k-primary" id="go">Add</button></div></div>');
 h.appendChild(add);
 add.querySelector("#go").onclick=()=>{
   const nm=add.querySelector("#nm").value.trim();if(!nm){K.toast("Enter a name","bad");return;}
   state.votes.push({name:nm,stance:"lean",pick:add.querySelector("#pk").value,note:""});save();renderDeciders(h);K.toast(nm+" added as decider","ok");
 };
}
function renderLog(h){
 h.innerHTML='';
 const t=K.el('<div></div>');h.appendChild(t);
 K.timeline(t,state.log.map(e=>({t:e.t,title:e.title,body:e.body,kind:e.kind})));
 const add=K.el('<div class="k-card" style="margin-top:14px"><h3>Log a discussion</h3><input class="k-input" id="ti" placeholder="Title" style="margin-bottom:8px"><textarea class="k-input" id="bo" rows="2" placeholder="What was said or decided?"></textarea><div style="margin-top:8px"><button class="k-btn k-primary" id="go">Add to log</button></div></div>');
 h.appendChild(add);
 add.querySelector("#go").onclick=()=>{
   const ti=add.querySelector("#ti").value.trim();if(!ti){K.toast("Enter a title","bad");return;}
   state.log.push({t:"Oct 3",title:ti,body:add.querySelector("#bo").value.trim(),kind:"info"});save();renderLog(h);K.toast("Logged","ok");
 };
}
function copySummary(){
 const w=OPTIONS.slice().sort((a,b)=>weighted(b)-weighted(a))[0];
 const lines=["FAMILY DECISION LEDGER — Move to assisted living?",state.decided?"STATUS: DECIDED":"STATUS: UNDECIDED","",
  "WEIGHTS: "+CRIT.map(c=>c.label+" "+state.weights[c.id]).join(", "),"",
  ...OPTIONS.slice().sort((a,b)=>weighted(b)-weighted(a)).map(o=>o.name+": "+weighted(o).toFixed(0)+"/100 ("+o.cost+")"),"",
  "DECIDERS:",...state.votes.map(v=>"- "+v.name+": "+v.stance+" → "+(OPTIONS.find(o=>o.id===v.pick)||{}).name+(v.signed?" (signed "+v.signed+")":""))];
 K.copy(lines.join("\n"));
}
wrap.querySelector("#cpsum").onclick=copySummary;
refreshStatus();
</script></body></html>
