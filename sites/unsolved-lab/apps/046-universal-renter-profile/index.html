 if(state.apps[id]!=="none"){K.toast("Already applied to this listing","warn");return;}
 state.apps[id]="applied";save();
 setTimeout(()=>{if(state.apps[id]==="applied"){state.apps[id]="under review";save();buildTabs();K.toast("Update: application under review","info");}},4000);
 K.toast("Application sent with your Passport ✓","ok");
 buildTabs();
}
function statusBadge(s){
 return s==="none"?K.badge("Not applied",""):s==="applied"?K.badge("Applied ✓","info"):s==="under review"?K.badge("Under review","warn"):s==="approved"?K.badge("Approved 🎉","ok"):s==="declined"?K.badge("Declined","bad"):K.badge(s,"bad");
}
function renderApply(h){
 h.innerHTML='<p class="k-muted">One verified profile, sent everywhere. No more re-typing your life story per landlord.</p>';
 LISTINGS.forEach(l=>{
   const st=state.apps[l.id];
   const d=K.el('<div class="listing"><div style=\"width:120px;height:90px;border-radius:10px;background:#0e7c5b;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;flex-shrink:0\">&#8962;</div><div style="flex:1;min-width:200px"><b style="font-size:17px">'+K.esc(l.name)+'</b><div class="k-muted" style="font-size:13px">'+K.esc(l.unit)+' · '+K.esc(l.tag)+'</div><div style="font-size:20px;font-weight:800;margin-top:4px">'+K.money(l.rent)+'<span class="k-muted" style="font-size:13px;font-weight:400">/mo</span></div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">'+statusBadge(st)+'<button class="k-btn '+(st==="none"?"k-primary":"")+'" '+(st!=="none"?"disabled style=\'opacity:.5\'":"")+' id="ap"> '+(st==="none"?"Apply with Passport":"Applied")+'</button></div></div>');
   if(st==="none")d.querySelector("#ap").onclick=()=>applyNow(l.id);
   h.appendChild(d);
 });
}
function renderLandlord(h){
 h.innerHTML='<p class="k-muted">The other side of the marketplace: what a landlord sees when a Passport application lands. Approve or decline — the renter is notified in Track.</p>';
 const ids=Object.keys(state.apps).filter(id=>state.apps[id]==="applied"||state.apps[id]==="under review");
 if(!ids.length){K.empty(h,"No pending applications","When a renter applies with their Passport, it lands here for review.");return;}
 ids.forEach(id=>{
  const l=LISTINGS.find(x=>x.id===id);
  const d=K.el('<div class="k-card" style="margin-bottom:12px"><b style="font-size:16px">'+K.esc(l.name)+'</b><div class="k-muted" style="font-size:13px;margin-bottom:6px">Applicant: Jordan Ellis · Passport score 92 · '+statusBadge(state.apps[id])+'</div><div id="f"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="k-btn k-primary" data-ap="'+id+'">Approve</button><button class="k-btn" data-dc="'+id+'">Decline</button></div></div>');
  const f=d.querySelector("#f");
  PROFILE.slice(3,8).forEach(p=>f.appendChild(K.el('<div class="field"><span class="k-muted">'+K.esc(p[0])+'</span><b>'+K.esc(p[1])+'</b></div>')));
  h.appendChild(d);
 });
 h.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{state.apps[b.getAttribute('data-ap')]="approved";save();buildTabs();K.toast("Application approved — renter notified","ok");});
 h.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>{state.apps[b.getAttribute('data-dc')]="declined";save();buildTabs();K.toast("Application declined — renter notified","warn");});
}
function renderProfile(h){
 h.innerHTML='';
 const c=K.el('<div class="k-card"><h3>Renter profile — demo verification</h3><div id="f"></div><p class="k-muted" style="font-size:13px;margin-top:12px">Landlords see this — nothing else. Your SSN and bank logins are never shared; income is verified via tokenized payroll proof.</p></div>');
 h.appendChild(c);
 PROFILE.forEach(p=>c.querySelector("#f").appendChild(K.el('<div class="field"><span class="k-muted">'+K.esc(p[0])+'</span><b>'+K.esc(p[1])+'</b></div>')));
}
function renderTrack(h){
 h.innerHTML='';
 const ids=Object.keys(state.apps).filter(id=>state.apps[id]!=="none");
 if(!ids.length){K.empty(h,"No applications yet","Apply to a listing and it will be tracked here automatically.");return;}
 const ev={applied:[["Just now","Application sent with Passport","ok"]],"under review":[["Just now","Application sent with Passport","ok"],["2 min later","Landlord opened your Passport","info"]],"approved":[["Just now","Application sent with Passport","ok"],["2 min later","Landlord opened your Passport","info"],["Today","Landlord approved your application","ok"]],"declined":[["Just now","Application sent with Passport","ok"],["2 min later","Landlord opened your Passport","info"],["Today","Landlord declined — Passport stays reusable","bad"]]};
 ids.forEach(id=>{
   const l=LISTINGS.find(x=>x.id===id);const st=state.apps[id];
   const d=K.el('<div class="apt" style="border-color:var(--accent)"><b style="font-size:16px">'+K.esc(l.name)+'</b> <span class="k-muted">· '+K.money(l.rent)+'/mo</span><div style="margin:6px 0">'+statusBadge(st)+'</div><div id="tl"></div></div>');
   h.appendChild(d);
   K.timeline(d.querySelector("#tl"),(ev[st]||ev.applied).map(e=>({t:e[0],title:e[1],kind:e[2]})));
 });
 const done=Object.values(state.apps).filter(s=>s!=="none").length;
 if(done)host2note(h,done);
}
function host2note(h,done){h.appendChild(K.el('<p class="k-muted" style="font-size:13px">'+done+' application'+(done>1?"s":"")+' sent · average landlord response: 2.3 days · Passport viewed '+done+'×</p>'));}
</script></body></html>
