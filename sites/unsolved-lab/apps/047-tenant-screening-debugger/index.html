function rng(seed){let h=1779033703^String(seed).length;const s=String(seed);for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296;};}
const pick=(f,a)=>a[Math.floor(f()*a.length)];
const int=(f,a,b)=>a+Math.floor(f()*(b-a+1));

function toast(msg,kind){let c=document.querySelector('.k-toast-c');if(!c){c=el('<div class="k-toast-c"></div>');document.body.appendChild(c);}const t=el('<div class="k-toast '+(kind||'')+'">'+esc(msg)+'</div>');c.appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300);},2600);}
function nav(o){o=o||{};const h=el('<header class="k-nav"><div class="k-nav-in"><div><div class="k-nav-t">'+esc(o.title||'')+'</div>'+(o.sub?'<div class="k-nav-s">'+esc(o.sub)+'</div>':'')+'</div><div class="k-nav-a"></div></div></header>');const a=h.querySelector('.k-nav-a');(o.actions||[]).forEach(x=>{const b=el('<button class="k-btn'+(x.primary?' k-primary':'')+'">'+esc(x.label)+'</button>');b.onclick=x.onClick;a.appendChild(b);});document.body.prepend(h);return h;}
function modal(o){o=o||{};const ov=el('<div class="k-mov"><div class="k-modal"><div class="k-m-t">'+esc(o.title||'')+'</div><div class="k-m-b"></div><div class="k-m-a"></div></div></div>');const b=ov.querySelector('.k-m-b');if(typeof o.body==='string')b.innerHTML=o.body;else if(o.body)b.appendChild(o.body);const a=ov.querySelector('.k-m-a');(o.actions||[{label:'Close'}]).forEach(x=>{const btn=el('<button class="k-btn'+(x.primary?' k-primary':'')+'">'+esc(x.label)+'</button>');btn.onclick=()=>{if(x.onClick)x.onClick();if(x.keepOpen!==true)ov.remove();};a.appendChild(btn);});ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});document.body.appendChild(ov);return ov;}
function tabs(host,list){host.innerHTML='';const bar=el('<div class="k-tabs"></div>');const pane=el('<div class="k-tabpane"></div>');host.appendChild(bar);host.appendChild(pane);list.forEach((t,i)=>{const b=el('<button class="k-tab'+(i===0?' on':'')+'">'+esc(t.label)+'</button>');b.onclick=()=>{bar.querySelectorAll('.k-tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');pane.innerHTML='';t.render(pane);};bar.appendChild(b);});if(list[0])list[0].render(pane);}
function table(host,cols,rows,opt){opt=opt||{};host.innerHTML='';if(!rows||!rows.length){empty(host,'No rows yet','Nothing to show here.');return;}let data=rows.slice();const wrap=el('<div></div>');const mk=()=>{let html='<table class="k-table"><thead><tr>';cols.forEach(c=>{html+='<th class="'+(c.num?'r':'')+'">'+esc(c.label)+'</th>';});html+='</tr></thead><tbody>';data.forEach(r=>{html+='<tr>';cols.forEach(c=>{let v=r[c.key];if(c.fmt)v=c.fmt(v,r);else v=esc(v==null?'—':v);html+='<td class="'+(c.num?'r':'')+'">'+v+'</td>';});html+='</tr>';});html+='</tbody></table>';wrap.innerHTML=html;};if(opt.search){const inp=el('<input class="k-input" placeholder="Search…" style="max-width:280px;margin-bottom:10px">');inp.oninput=()=>{const q=inp.value.toLowerCase();data=rows.filter(r=>cols.some(c=>String(r[c.key]).toLowerCase().includes(q)));mk();};host.appendChild(inp);}mk();host.appendChild(wrap);}
function bars(host,items){host.innerHTML='';const max=Math.max.apply(null,items.map(i=>i.value).concat([1]));items.forEach(i=>{const r=el('<div class="k-bar-r"><div class="k-bar-l">'+esc(i.label)+'</div><div class="k-bar-t"><div class="k-bar-f" style="width:'+(100*i.value/max).toFixed(1)+'%;'+(i.color?'background:'+i.color:'')+'"></div></div><div class="k-bar-v">'+esc(i.vtext!=null?i.vtext:String(Math.round(i.value)))+'</div></div>');host.appendChild(r);});}
function line(host,series){host.innerHTML='';const W=560,H=240,P=34;let all=[];series.forEach(s=>s.points.forEach(p=>all.push(p.y)));const mn=Math.min.apply(null,all.concat([0])),mx=Math.max.apply(null,all.concat([1]));const X=i=>P+i*(W-2*P)/(series[0].points.length-1);const Y=v=>H-P-(v-mn)/(mx-mn||1)*(H-2*P);let s='<svg class="k-chart" viewBox="0 0 '+W+' '+H+'">';for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4;s+='<line x1="'+P+'" y1="'+Y(v)+'" x2="'+(W-P)+'" y2="'+Y(v)+'" class="k-gl"/><text x="'+(P-6)+'" y="'+(Y(v)+4)+'" class="k-gl-t" text-anchor="end">'+Math.round(v)+'</text>';}series[0].points.forEach((p,i)=>{if(i%Math.ceil(series[0].points.length/8)===0)s+='<text x="'+X(i)+'" y="'+(H-8)+'" class="k-gl-t" text-anchor="middle">'+esc(p.x)+'</text>';});series.forEach((sr,si)=>{const pts=sr.points.map((p,i)=>X(i).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ');s+='<polyline points="'+pts+'" fill="none" stroke="'+(sr.color||'#2563eb')+'" stroke-width="2.5"/>';sr.points.forEach((p,i)=>{s+='<circle cx="'+X(i)+'" cy="'+Y(p.y)+'" r="3" fill="'+(sr.color||'#2563eb')+'"><title>'+esc(sr.name+': '+p.x+' = '+p.y)+'</title></circle>';});});s+='</svg><div class="k-legend">';series.forEach(sr=>{s+='<span class="k-lg"><i style="background:'+(sr.color||'#2563eb')+'"></i>'+esc(sr.name)+'</span>';});s+='</div>';host.innerHTML=s;}
function donut(host,items){host.innerHTML='';const S=170,R=64,C=2*Math.PI*R;const tot=items.reduce((a,i)=>a+i.value,0)||1;let off=0,arcs='';items.forEach(i=>{const frac=i.value/tot;arcs+='<circle cx="85" cy="85" r="'+R+'" fill="none" stroke="'+(i.color||'#888')+'" stroke-width="26" stroke-dasharray="'+(frac*C).toFixed(1)+' '+C.toFixed(1)+'" stroke-dashoffset="'+(-off*C).toFixed(1)+'" transform="rotate(-90 85 85)"/>';off+=frac;});let leg='<div class="k-legend">';items.forEach(i=>{leg+='<span class="k-lg"><i style="background:'+(i.color||'#888')+'"></i>'+esc(i.label)+' '+esc(i.vtext!=null?i.vtext:money(i.value))+'</span>';});leg+='</div>';host.innerHTML='<div class="k-donut-w"><svg class="k-chart" viewBox="0 0 170 170" style="max-width:220px">'+arcs+'<text x="85" y="80" text-anchor="middle" class="k-donut-t">'+esc(items._center||money(tot))+'</text><text x="85" y="100" text-anchor="middle" class="k-donut-s">'+esc(items._centerSub||'total')+'</text></svg>'+leg+'</div>';}

const css='.k-wrap{max-width:1120px;margin:0 auto;padding:20px 16px 64px}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg,#f7f6f3);color:var(--ink,#1c1a17)}.k-nav{position:sticky;top:0;z-index:20;background:var(--panel,#fff);border-bottom:1px solid var(--line,#e5e0d8)}.k-nav-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.k-nav-t{font-weight:800;font-size:20px;letter-spacing:-.02em}.k-nav-s{color:var(--muted,#6b655c);font-size:13px}.k-nav-a{display:flex;gap:8px;flex-wrap:wrap}.k-hero{background:var(--panel,#fff);border:1px solid var(--line,#e5e0d8);border-radius:16px;padding:28px;margin:20px 0}.k-hero h1{margin:0 0 8px;font-size:32px;letter-spacing:-.02em}.k-hero p{margin:0;color:var(--muted,#6b655c);max-width:640px;line-height:1.5}.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.k-card{background:var(--panel,#fff);border:1px solid var(--line,#e5e0d8);border-radius:14px;padding:18px}.k-card h3{margin:0 0 6px;font-size:16px}.k-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.k-split{grid-template-columns:1fr}}.k-btn{border:1px solid var(--line,#e5e0d8);background:var(--panel,#fff);color:var(--ink,#1c1a17);border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}.k-btn:hover{border-color:var(--accent,#2563eb)}.k-primary{background:var(--accent,#2563eb);border-color:var(--accent,#2563eb);color:#fff}.k-primary:hover{filter:brightness(1.08)}.k-input,.k-select{border:1px solid var(--line,#e5e0d8);border-radius:10px;padding:10px 12px;font-size:14px;width:100%;box-sizing:border-box;background:#fff;color:var(--ink,#1c1a17)}label.k-lab{display:block;font-size:12px;font-weight:700;color:var(--muted,#6b655c);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em}.k-table{width:100%;border-collapse:collapse;font-size:14px}. to;padding:24px}.k-m-t{font-size:20px;font-weight:800;margin-bottom:12px}.k-m-a{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.k-empty{text-align:center;padding:48px 20px;color:var(--muted,#6b655c)}.k-empty-t{font-size:18px;font-weight:700;color:var(--ink,#1c1a17);margin-bottom:6px}.k-empty-s{font-size:14px;margin-bottom:14px}.k-muted{color:var(--muted,#6b655c)}.k-chart{width:100%;height:auto;display:block}.k-gl{stroke:#e5e0d8;stroke-width:1}.k-gl-t{font-size:11px;fill:#8a8478}.k-mut{font-size:11px;fill:#8a8478}.k-nd-t{font-size:12px;font-weight:800;fill:#fff}.k-edge{stroke:#b9b2a4;stroke-width:1.5}.k-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px}.k-lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px}.k-bar-r{display:flex;align-items:center;gap:10px;margin:8px 0}.k-bar-l{width:150px;font-size:13px;font-weight:600;flex-shrink:0}.k-bar-t{flex:1;background:#efece5;border-radius:8px;height:22px;overflow:hidden}.k-bar-f{height:100%;background:var(--accent,#2563eb);border-radius:8px;transition:width .4s}.k-bar-v{width:90px;font-size:13px;font-weight:700;text-align:right;flex-shrink:0}.k-tl-r{display:flex;gap:14px;margin:0 0 4px}.k-tl-t{width:120px;flex-shrink:0;font-size:12px;font-weight:700;color:var(--muted,#6b655c);padding-top:14px;text-align:right}.k-tl-d{flex:1;border-left:3px solid #dbeafe;background:var(--panel,#fff);border-radius:0 10px 10px 0;padding:10px 14px;margin-bottom:10px}.k-tl-ok{border-left-color:var(--good,#16a34a)}.k-tl-warn{border-left-color:var(--warn,#d97706)}.k-tl-bad{border-left-color:var(--bad,#dc2626)}.k-tl-h{font-weight:700;font-size:14px}.k-tl-b{font-size:13px;color:var(--muted,#6b655c);margin-top:2px}.k-donut-w{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.k-donut-t{font-size:22px;font-weight:800;fill:var(--ink,#1c1a17)}.k-donut-s{font-size:11px;fill:var(--muted,#6b655c)}input[type=range]{width:100%;accent-color:var(--accent,#2563eb)}';

<style>

<script>
"use strict";
const K=window.Kit;
K.nav({title:"🔍 ClearName",sub:"Tenant screening debugger"});
const store=K.store("clearname");
let state=store.get("state",{analyzed:false});
function save(){store.set("state",state);}
const FINDINGS=[
 {item:"Eviction filing — Maricopa County, 2021",detail:"Filed against “Jonathon Reyes”, DOB 1984, Phoenix AZ. You are Jonah Reyes, DOB 1998, Riverton CA. Different person, similar name — a classic mixed-file error.",verdict:"err",label:"Likely wrong person",fix:"Dispute with all three bureaus + screening company. Furnisher must verify within 30 days (FCRA §611)."},
 {item:"Collection — $412, “Bay Medical Group”",detail:"Listed as unpaid since 2022. Under current rules, paid medical collections under $500 should not appear — and this one shows no payment history at all.",verdict:"warnx",label:"Disputable",fix:"Request debt validation. If the collector can't produce the original bill, it must be removed."},
 {item:"Late payment — auto loan, 30 days, 2023",detail:"One 30-day late on a Capital One auto loan, since brought current. Accurate, but 3 years old and isolated.",verdict:"ok",label:"Accurate — explain it",fix:"Add a 100-word consumer statement: job change during the period, 36 on-time payments since."},
 {item:"Credit inquiries — 4 in 60 days",detail:"All from apartment applications (rate-shopping window). Screening models should treat these as one, but some landlord scores count each.",verdict:"warnx",label:"Scoring quirk",fix:"Ask the landlord which score they use; offer your Passport with the inquiry explanation attached."}
];
const wrap=K.el('<div class="k-wrap"></div>');document.body.appendChild(wrap);
wrap.appendChild(K.el('<div class="k-hero"><h1>Rejected? Let\'s read the fine print.</h1><p>ClearName decodes your screening report line by line, flags what\'s wrong vs. what\'s merely ugly, and drafts the dispute letter for you. An estimated <b>1 in 5</b> screening reports contains a material error.</p><div id="cta" style="margin-top:14px"></div></div>'));
const cta=wrap.querySelector("#cta");
const host=K.el('<div></div>');wrap.appendChild(host);
function parseReport(text){
  const out=[],seen={};
  function add(key,item,detail,verdict,fix){if(seen[key])return;seen[key]=1;out.push({item,detail,verdict,fix});}
  if(/evict/i.test(text))add("evict","Eviction filing (found in pasted text)","Eviction records are the #1 source of mixed-file errors \u2014 a filing against a similar name in another county often lands on the wrong report.","err","Compare the full name, DOB, and county on the filing against yours. Any mismatch: dispute as wrong-person with all three bureaus + the screening company (FCRA \u00a7611).");
  if(/collect/i.test(text))add("coll","Collection account (found in pasted text)","Collections under $500 \u2014 especially medical \u2014 often should not appear, and the collector must prove the debt is yours.","warnx","Request debt validation in writing. No validation within 30 days means deletion.");
  if(/late|delinq/i.test(text))add("late","Late payment (found in pasted text)","A late payment hurts, but an isolated old one can be explained to a landlord.","ok","Add a 100-word consumer statement: what happened, and your on-time record since.");
  if(/inquir/i.test(text))add("inq","Credit inquiries (found in pasted text)","Multiple inquiries from apartment hunting in a short window should count as one rate-shopping event.","warnx","Ask the landlord which score they use; note the rate-shopping window on your application.");
  return out;
}
function letterFor(items){
  const lines=items.map((f,i)=>(i+1)+". "+f.item.toUpperCase()+" \u2014 "+f.fix).join("\n\n");
  return "DISPUTE LETTER (generated by ClearName \u2014 demo, not legal advice)\n\nTo the screening company and the three credit bureaus:\n\nI am writing to dispute the following items in my tenant screening report:\n\n"+lines+"\n\nUnder FCRA \u00a7611, please investigate and respond within 30 days.\n\nSincerely,\n(Your name)\n(Your email) \u00b7 (Your phone)";
}
function findingCard(f){
  return '<div class="finding '+f.verdict+'"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-size:16px">'+K.esc(f.item)+'</b>'+(f.verdict==="err"?K.badge("\u2716 Needs dispute","bad"):f.verdict==="warnx"?K.badge("\u26a0 Disputable","warn"):K.badge("\u2713 Accurate","ok"))+'</div><p style="font-size:14px;margin:10px 0">'+K.esc(f.detail)+'</p><div style="background:var(--panel2);border-radius:8px;padding:10px 12px;font-size:13px"><b>What to do:</b> '+K.esc(f.fix)+'</div></div>';
}
function render(){
 host.innerHTML='';
 cta.innerHTML='';
 if(state.analyzed==="custom"){
   const items=state.custom||[];
   host.appendChild(K.el('<div class="k-kpis"></div>'));
   const k=host.querySelector(".k-kpis");
   K.kpi(k,{label:"Report lines decoded",value:String(items.length)});
   K.kpi(k,{label:"Flagged",value:String(items.filter(f=>f.verdict!=="ok").length),delta:"error or disputable"});
   K.kpi(k,{label:"Source",value:"Pasted text",delta:"keyword scan"});
   host.appendChild(K.el('<h2>Findings</h2>'));
   items.forEach(f=>host.appendChild(K.el(findingCard(f))));
   const lw=K.el('<div class="k-card" style="margin-top:16px"><h3>\u2709\ufe0f Dispute letter \u2014 drafted from your report</h3><div class="letter" id="ltr"></div><div style="margin-top:12px;display:flex;gap:8px"><button class="k-btn k-primary" id="cp">Copy letter</button><button class="k-btn" id="rst">Start over</button></div></div>');
   host.appendChild(lw);
   const letter=letterFor(items);
   lw.querySelector("#ltr").textContent=letter;
   lw.querySelector("#cp").onclick=()=>K.copy(letter);
   lw.querySelector("#rst").onclick=()=>{state.analyzed=false;state.custom=null;save();render();};
   return;
 }
 if(!state.analyzed){
   const r=K.el('<div class="k-card"><h3>The rejection notice</h3><div class="rej">“Thank you for your interest in <b>Depot Lofts</b>. After reviewing your tenant screening report (provided by SafeRent Solutions), we are unable to approve your application at this time. Adverse action reasons: <b>eviction history</b>, <b>collection account</b>, <b>insufficient credit history</b>.”<div class="k-muted" style="margin-top:8px;font-size:12px">Received Oct 1, 2026 · Report #SR-88412</div></div><p class="k-muted">Paste your own report above — or run the demo analysis on this one.</p></div>');
   host.appendChild(r);
   const b=K.el('<button class="k-btn k-primary" data-core="1" style="font-size:17px;padding:14px 26px">🔍 Analyze this report</button>');
   b.onclick=analyze;cta.appendChild(b);
   const pc=K.el('<div class="k-card" style="margin-top:14px"><h3>Paste your own report</h3><textarea id="paste" class="k-input" rows="6" style="width:100%" placeholder="Paste the adverse-action notice or screening report text here\u2026"></textarea><div style="margin-top:8px"><button class="k-btn" id="analyzeMine">Analyze pasted report</button></div><div class="k-muted" style="font-size:12.5px;margin-top:6px">Keyword scan: eviction · collection · late payment · inquiries. Demo-grade heuristics, not legal advice.</div></div>');
   host.appendChild(pc);
   pc.querySelector("#analyzeMine").onclick=function(){
     const items=parseReport(pc.querySelector("#paste").value);
     if(!items.length){K.toast("No recognizable lines \u2014 paste the adverse-action section","warn");return;}
     state.analyzed="custom";state.custom=items;save();render();
     K.toast("Analysis complete \u2014 "+items.length+" line"+(items.length>1?"s":"")+" decoded","ok");
     document.querySelector(".k-wrap").scrollIntoView();
   };
   return;
 }
 const k=K.el('<div class="k-kpis"></div>');host.appendChild(k);
 K.kpi(k,{label:"Report lines checked",value:"4"});
 K.kpi(k,{label:"Likely errors",value:"1",delta:"Wrong-person eviction"});
 K.kpi(k,{label:"Disputable",value:"2"});
 K.kpi(k,{label:"Win probability",value:"High",delta:"if eviction is removed"});
 host.appendChild(K.el('<h2>Findings</h2>'));
 FINDINGS.forEach(f=>{
   host.appendChild(K.el('<div class="finding '+f.verdict+'"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-size:16px">'+K.esc(f.item)+'</b>'+(f.verdict==="err"?K.badge("✖ Likely wrong person","bad"):f.verdict==="warnx"?K.badge("⚠ Disputable","warn"):K.badge("✓ Accurate","ok"))+'</div><p style="font-size:14px;margin:10px 0">'+K.esc(f.detail)+'</p><div style="background:var(--panel2);border-radius:8px;padding:10px 12px;font-size:13px"><b>What to do:</b> '+K.esc(f.fix)+'</div></div>'));
 });
 const lw=K.el('<div class="k-card" style="margin-top:16px"><h3>✉️ Dispute letter — ready to send</h3><p class="k-muted" style="font-size:13px">Generated from the findings above. Send to SafeRent Solutions + Equifax, Experian, TransUnion.</p><div class="letter" id="ltr"></div><div style="margin-top:12px;display:flex;gap:8px"><button class="k-btn k-primary" id="cp">Copy letter</button><button class="k-btn" id="rst">Start over</button></div></div>');
 host.appendChild(lw);
 const letter="October 3, 2026\n\nSafeRent Solutions — Dispute Department\nRe: Screening Report #SR-88412 — Jonah Reyes, DOB 06/14/1998\n\nTo whom it may concern:\n\nI am writing to dispute inaccurate information in the tenant screening report referenced above, which caused an adverse rental decision on October 1, 2026.\n\n1. EVICTION FILING (Maricopa County, 2021) — This record belongs to “Jonathon Reyes,” DOB 1984, of Phoenix, AZ. I am Jonah Reyes, DOB 1998, of Riverton, CA. This is a mixed-file error involving a different individual. Please remove it immediately.\n\n2. COLLECTION — Bay Medical Group, $412 — I request validation of this debt under the FDCPA, including the original bill and proof of assignment. Absent validation, please delete.\n\nUnder FCRA §611, please investigate and respond within 30 days. Enclosed: copy of government ID and proof of address.\n\nSincerely,\nJonah Reyes\njordan.ellis@example.com · (555) 014-8820";
 lw.querySelector("#ltr").textContent=letter;
 lw.querySelector("#cp").onclick=()=>K.copy(letter);
 lw.querySelector("#rst").onclick=()=>{state.analyzed=false;save();render();};
 host.appendChild(K.el('<div class="k-card" style="margin-top:14px"><h3>After the dispute</h3><div id="tl"></div></div>'));
 const tl=host.querySelector("#tl");
 K.timeline(tl,[
  {t:"Day 0",title:"Disputes filed",body:"Sent to screening company + 3 bureaus (certified mail, return receipt).",kind:"info"},
  {t:"Day 30",title:"Investigation deadline",body:"Furnisher must verify or the item is deleted by law.",kind:"warn"},
  {t:"Day 35",title:"Re-apply with clean report",body:"Re-send your Renter Passport to Depot Lofts with the corrected report.",kind:"ok"}
 ]);
}
function analyze(){state.analyzed=true;save();render();K.toast("Analysis complete — 1 likely error found","ok");document.querySelector(".k-wrap").scrollIntoView();}
render();
</script></body></html>
