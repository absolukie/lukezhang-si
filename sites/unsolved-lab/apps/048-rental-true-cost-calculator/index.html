const right=K.el('<div class="k-card" style="text-align:center"><h3 style="text-align:left">True monthly cost</h3><div class="big" id="big"></div><div class="k-muted" id="ann"></div><div id="donut" style="margin-top:8px"></div></div>');
topRow.appendChild(left);topRow.appendChild(right);
const cmp=K.el('<div class="k-card" style="margin-top:14px"><h3>Head-to-head: which apartment is actually cheaper?</h3><div class="vs"><div><b>Maple Court</b> <span class="k-muted" id="br1"></span><div id="d1"></div></div><div><b>Depot Lofts</b> <span class="k-muted" id="br2"></span><div id="d2"></div></div></div><p id="verdict" style="font-size:16px"></p><details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600;font-size:14px">Edit Depot Lofts numbers</summary><div id="bedit" style="max-width:440px"></div></details></div>');
wrap.appendChild(cmp);
function paint(){
 left.querySelector("#rv").textContent=K.money(state.rent);
 left.querySelector("#rr").value=state.rent;
 const box=left.querySelector("#items");box.innerHTML='';
 state.items.forEach(it=>{
   const d=K.el('<div class="slider"><div class="row"><span><input type="checkbox" id="c-'+it.id+'" '+(it.on?"checked":"")+' style="width:18px;height:18px;accent-color:var(--accent);vertical-align:-3px"> '+K.esc(it.label)+'</span><b id="v-'+it.id+'">'+K.money(it.v)+'</b></div><input type="range" id="r-'+it.id+'" min="0" max="500" step="5" value="'+it.v+'" '+(it.on?"":"disabled style='opacity:.35'")+'>');
   d.querySelector("#c-"+it.id).onchange=e=>{it.on=e.target.checked;save();paint();};
   d.querySelector("#r-"+it.id).oninput=e=>{it.v=+e.target.value;d.querySelector("#v-"+it.id).textContent=K.money(it.v);save();paintNums();};
   box.appendChild(d);
 });
 paintNums();
}
function paintNums(){
 const t=total();
 right.querySelector("#big").textContent=K.money(t);
 right.querySelector("#ann").textContent=K.money(t*12)+" / year · "+K.money(t*12*3)+" over a 3-yr stay";
 const items=[{label:"Base rent",value:state.rent,color:COLORS[0],vtext:K.money(state.rent)}]
   .concat(state.items.filter(i=>i.on).map((i,x)=>({label:i.label,value:i.v,color:COLORS[(x+1)%COLORS.length],vtext:K.money(i.v)})));
 const dn=right.querySelector("#donut");dn.innerHTML='';
 K.donut(dn,items);

 // comparison: Maple Court uses your sliders; Depot Lofts is editable below
 const a=t;
 const b=state.b.rent+Object.values(state.b.items).reduce(function(x,y){return x+y;},0);
 cmp.querySelector("#br1").textContent='· '+K.money(state.rent)+' rent';
 cmp.querySelector("#br2").textContent='· '+K.money(state.b.rent)+' rent';
 cmp.querySelector("#d1").innerHTML='<div class="big" style="font-size:36px">'+K.money(a)+'</div><div class="k-muted">true / mo</div>';
 cmp.querySelector("#d2").innerHTML='<div class="big" style="font-size:36px">'+K.money(b)+'</div><div class="k-muted">true / mo</div>';
 const win=a<b?"Maple Court":"Depot Lofts";
 cmp.querySelector("#verdict").innerHTML=K.badge("Verdict: "+win+" is cheaper by "+K.money(Math.abs(a-b))+"/mo","ok")+' <span class="k-muted" style="font-size:13px">Despite the $'+Math.abs(state.rent-state.b.rent).toLocaleString()+' headline rent gap '+(a<b?"in Maple Court's favor":"against Maple Court")+'.</span>';
}
left.querySelector("#rr").oninput=e=>{state.rent=+e.target.value;left.querySelector("#rv").textContent=K.money(state.rent);save();paintNums();};
left.addEventListener("click",function(e){if(e.target&&e.target.id==="resetbtn"){state=def();state.b=bdef();save();paint();buildB();K.toast("Reset to defaults","info");}});
function buildB(){
 const host=cmp.querySelector("#bedit");host.innerHTML='';
 const bd=state.b;
 const mk=function(label,min,max,step,get,set){
  const d=K.el('<div class="slider"><div class="row"><span>'+label+'</span><b></b></div><input type="range" min="'+min+'" max="'+max+'" step="'+step+'"></div>');
  const r=d.querySelector('input'),v=d.querySelector('b');
  r.value=get();
  const up=function(){v.textContent=K.money(+r.value);set(+r.value);save();paintNums();};
  r.oninput=up;up();
  host.appendChild(d);
 };
 mk('Base rent',800,6000,50,function(){return bd.rent;},function(v){bd.rent=v;});
 [['parking','Parking'],['util','Utilities'],['ins','Renter insurance'],['pet','Pet rent'],['commute','Commute'],['fees','Fees']].forEach(function(p){
  mk(p[1],0,500,5,function(){return bd.items[p[0]];},function(v){bd.items[p[0]]=v;});
 });
}
buildB();
paint();
</script></body></html>
