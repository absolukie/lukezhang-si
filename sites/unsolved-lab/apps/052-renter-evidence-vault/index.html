<!DOCTYPE html>

<style>
/* ===== W6 Kit fallback CSS (only matters if shared/kit.css missing) ===== */
:root{--bg:#ffffff;--panel:#f6f6f4;--panel2:#ffffff;--ink:#1b1b1b;--muted:#6f6f6f;--line:#e4e4df;--accent:#1d4ed8;--accent2:#0d9488;--good:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}

.k-wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.k-grid{display:grid;gap:16px}
.k-card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.k-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
.k-btn:hover{border-color:var(--accent)}
.k-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.k-primary:hover{filter:brightness(1.08)}
.k-input,.k-select,textarea.k-input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--panel2);color:var(--ink);font-family:inherit}
.k-input:focus,.k-select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.k-table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.k-table tr:last-child td{border-bottom:none}
.k-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.k-badge.ok{background:#dcfce7;color:#166534}.k-badge.warn{background:#fef3c7;color:#92400e}.k-badge.bad{background:#fee2e2;color:#991b1b}.k-badge.info{background:#dbeafe;color:#1e40af}
.k-tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.k-tabs button{border:none;background:none;padding:10px 14px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.k-tabs button.active{color:var(--ink);border-bottom-color:var(--accent)}
.k-kpi{display:flex;flex-direction:column;gap:2px}
.k-kpi .k-kpi-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.k-kpi .k-kpi-value{font-size:28px;font-weight:800}
.k-kpi .k-kpi-delta{font-size:13px}
.k-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;z-index:9999;pointer-events:none;max-width:90vw}
.k-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.k-toast.ok{background:#166534}.k-toast.warn{background:#92400e}.k-toast.bad{background:#991b1b}
.k-modal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9998;padding:20px}
.k-modal{background:var(--panel2);border-radius:16px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:24px}
.k-modal h2{margin:0 0 12px}
.k-modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.k-empty{text-align:center;padding:48px 20px;color:var(--muted)}
.k-empty h3{color:var(--ink);margin:0 0 8px}
.k-hero{border-radius:18px;padding:32px;background:var(--panel);border:1px solid var(--line);margin-bottom:20px}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.k-split{grid-template-columns:1fr}}
.k-muted{color:var(--muted)}
.k-nav{padding:16px 0}
.k-chart-bar{height:10px;border-radius:6px;background:var(--accent);min-width:4px}
.k-timeline{position:relative;padding-left:26px}
.k-timeline:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.k-timeline-ev{position:relative;padding:0 0 18px}
.k-timeline-ev:before{content:"";position:absolute;left:-24px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--panel2)}
.k-timeline-ev.warn:before{background:var(--warn)}.k-timeline-ev.bad:before{background:var(--bad)}.k-timeline-ev.ok:before{background:var(--good)}
.k-timeline-ev .t{font-size:12px;color:var(--muted);font-weight:600}
</style>
<script>

Kit.tabs=function(host,tabs){host.innerHTML='';var bar=Kit.el('<div class="k-tabs" role="tablist"></div>');var pane=Kit.el('<div></div>');host.appendChild(bar);host.appendChild(pane);tabs.forEach(function(t,i){var b=Kit.el('<button role="tab">'+Kit.esc(t.label)+'</button>');if(i===0)b.classList.add('active');b.onclick=function(){bar.querySelectorAll('button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');pane.innerHTML='';t.render(pane)};bar.appendChild(b)});if(tabs[0])tabs[0].render(pane)};
Kit.table=function(host,cols,rows,opt){opt=opt||{};host.innerHTML='';var wrap=Kit.el('<div></div>');if(opt.search){var s=Kit.el('<input class="k-input" placeholder="Search…" style="max-width:280px;margin-bottom:10px">');s.oninput=function(){draw(s.value.toLowerCase())};wrap.appendChild(s)}var tw=Kit.el('<div style="overflow-x:auto"></div>');wrap.appendChild(tw);host.appendChild(wrap);var page=0;var ps=opt.pageSize||0;function filtered(q){if(!q)return rows;return rows.filter(function(r){return cols.some(function(c){var v=r[c.key];return v!=null&&String(v).toLowerCase().indexOf(q)>=0})})}function draw(q){var fr=filtered(q||'');var total=fr.length;var view=fr;if(ps&&total>ps){view=fr.slice(page*ps,page*ps+ps)}var h='<table class="k-table"><thead><tr>'+cols.map(function(c){return '<th'+(c.num?' style="text-align:right"':'')+'>'+Kit.esc(c.label)+'</th>'}).join('')+'</tr></thead><tbody>';view.forEach(function(r){h+='<tr>'+cols.map(function(c){var v=r[c.key];if(c.fmt)v=c.fmt(v,r);else v=Kit.esc(v==null?'':v);return '<td'+(c.num?' style="text-align:right"':'')+'>'+v+'</td>'}).join('')+'</tr>'});h+='</tbody></table>';if(!view.length)h='<div class="k-empty"><h3>No results</h3><div>Nothing matches.</div></div>';tw.innerHTML=h;var pg=wrap.querySelector('.k-pg');if(pg)pg.remove();if(ps&&total>ps){var pgn=Kit.el('<div class="k-pg" style="display:flex;gap:8px;align-items:center;margin-top:10px"><button class="k-btn">← Prev</button><span class="k-muted" style="font-size:13px">Page '+(page+1)+' of '+Math.ceil(total/ps)+'</span><button class="k-btn">Next →</button></div>');var btns=pgn.querySelectorAll('button');btns[0].onclick=function(){if(page>0){page--;draw(q||'')}};btns[1].onclick=function(){if((page+1)*ps<total){page++;draw(q||'')}};wrap.appendChild(pgn)}}draw('')};
Kit.bars=function(host,items){host.innerHTML='';var max=Math.max.apply(null,items.map(function(i){return i.value}).concat([1]));items.forEach(function(i){var row=Kit.el('<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="font-weight:600">'+Kit.esc(i.label)+'</span><span class="k-muted">'+Kit.esc(i.display!=null?i.display:i.value)+'</span></div><div style="background:var(--panel);border-radius:6px;height:12px"><div class="k-chart-bar" style="width:'+(100*i.value/max)+'%;background:'+(i.color||'var(--accent)')+'"></div></div></div>');host.appendChild(row)})};
Kit.line=function(host,series){var W=560,H=220,P=34;var all=[];series.forEach(function(s){s.points.forEach(function(p){all.push(p)})});var mn=Math.min.apply(null,all.concat([0])),mx=Math.max.apply(null,all.concat([1]));function X(i,n){return P+i*(W-2*P)/Math.max(n-1,1)}function Y(v){return H-P-(v-mn)*(H-2*P)/Math.max(mx-mn,1e-9)}var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;background:var(--panel);border-radius:12px">';series.forEach(function(s){var pts=s.points.map(function(p,i){return X(i,s.points.length)+','+Y(p)}).join(' ');svg+='<polyline points="'+pts+'" fill="none" stroke="'+(s.color||'var(--accent)')+'" stroke-width="2.5"/>'});svg+='</svg><div style="display:flex;gap:14px;margin-top:6px;flex-wrap:wrap">'+series.map(function(s){return '<span style="font-size:12px" class="k-muted"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+(s.color||'var(--accent)')+'"></span> '+Kit.esc(s.name)+'</span>'}).join('')+'</div>';host.innerHTML=svg};
Kit.donut=function(host,items){var tot=items.reduce(function(a,i){return a+i.value},0)||1;var R=54,C=2*Math.PI*R,off=0,segs='';var cols=['#1d4ed8','#0d9488','#b45309','#b91c1c','#6d28d9','#0e7490'];items.forEach(function(it,i){var frac=it.value/tot;segs+='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+(it.color||cols[i%cols.length])+'" stroke-width="18" stroke-dasharray="'+(frac*C)+' '+C+'" stroke-dashoffset="'+(-off*C)+'" transform="rotate(-90 70 70)"/>';off+=frac});host.innerHTML='<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg width="140" height="140" viewBox="0 0 140 140">'+segs+'<text x="70" y="76" text-anchor="middle" font-size="20" font-weight="800" fill="var(--ink)">'+Kit.esc(items._center||'')+'</text></svg><div>'+items.map(function(it,i){return '<div style="font-size:13px;margin-bottom:6px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+(it.color||cols[i%cols.length])+'"></span> <b>'+Kit.esc(it.label)+'</b> <span class="k-muted">'+Kit.pct(it.value/tot)+'</span></div>'}).join('')+'</div></div>'};
Kit.timeline=function(host,events){host.innerHTML='<div class="k-timeline">'+events.map(function(e){return '<div class="k-timeline-ev '+(e.kind||'')+'"><div class="t">'+Kit.esc(e.t)+'</div><div style="font-weight:700">'+Kit.esc(e.title)+'</div>'+(e.body?'<div class="k-muted" style="font-size:13px">'+Kit.esc(e.body)+'</div>':'')+'</div>'}).join('')+'</div>'};
Kit.graph=function(host,g){var n=g.nodes.length,W=560,H=300;var pos={};g.nodes.forEach(function(nd,i){var a=2*Math.PI*i/Math.max(n,1);pos[nd.id]=[W/2+Math.cos(a)*(W/2-70),H/2+Math.sin(a)*(H/2-60)]});var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;background:var(--panel);border-radius:12px">';g.edges.forEach(function(e){var a=pos[e.a],b=pos[e.b];if(!a||!b)return;svg+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="var(--line)" stroke-width="2"/>'+(e.label?'<text x="'+((a[0]+b[0])/2)+'" y="'+((a[1]+b[1])/2-6)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+Kit.esc(e.label)+'</text>':'')});g.nodes.forEach(function(nd){var p=pos[nd.id];svg+='<g><circle cx="'+p[0]+'" cy="'+p[1]+'" r="26" fill="'+(nd.color||'var(--accent)')+'"/><text x="'+p[0]+'" y="'+(p[1]+4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">'+Kit.esc(Kit.initials(nd.label))+'</text><text x="'+p[0]+'" y="'+(p[1]+42)+'" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">'+Kit.esc(nd.label)+'</text>'+(nd.sub?'<text x="'+p[0]+'" y="'+(p[1]+55)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+Kit.esc(nd.sub)+'</text>':'')+'</g>'});svg+='</svg>';host.innerHTML=svg};
Kit.badge=function(t,k){return '<span class="k-badge k-badge-'+Kit.esc(k||'info')+'">'+Kit.esc(t)+'</span>'};

<script>

<body>
<style>body{padding-top:104px}/* qa-c: clear fixed .k-nav header */
:root{--bg:#0e1420;--panel:#16202f;--panel2:#1b2940;--ink:#f1f5f9;--muted:#8ea0b8;--line:#26344d;--accent:#f59e0b;--accent2:#38bdf8;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444}
body{background:var(--bg)}
.sans{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.ev-card{cursor:pointer;transition:transform .15s,border-color .15s}

.ev-card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}

<div class="k-wrap sans" style="padding-bottom:60px">
<div class="k-hero" style="background:linear-gradient(135deg,#16202f,#1b2940);border-color:var(--line)">
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
<div style="flex:1;min-width:240px">
<h2 style="margin:0 0 6px">Deposit dispute package</h2>
<div class="k-muted">Landlord withheld $2,850 deposit citing "excessive wear". Your vault holds the rebuttal.</div>
</div>
<button class="k-btn k-primary" id="assemble" style="font-size:16px;padding:12px 22px">⚡ Auto-assemble dispute package</button>

</div>

</div>

<script>
(function(){
const K=window.Kit;
K.nav({title:'Evidence Vault',sub:'Move-in condition, repairs, payments & landlord comms — dispute-ready.'});
const F=Kit.rng('vault-52');
function svgThumb(label,hue,icon){return `<svg viewBox="0 0 200 150" style="width:100%;height:100%"><defs><linearGradient id="g${hue}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hue},45%,26%)"/><stop offset="1" stop-color="hsl(${hue},50%,14%)"/></linearGradient></defs><rect width="200" height="150" fill="url(#g${hue})"/><text x="100" y="66" text-anchor="middle" font-size="40">${icon}</text><text x="100" y="112" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="sans-serif">${K.esc(label)}</text></svg>`}
const CATS=['move-in','repairs','payments','comms'];
const CATL={'move-in':'Move-in condition','repairs':'Repair requests','payments':'Rent payments','comms':'Landlord comms'};
const ICONS={'move-in':'🏠','repairs':'🔧','payments':'🧾','comms':'💬'};
const items=[
{id:'m1',cat:'move-in',title:'Kitchen — move-in day',t:'2024-11-01T10:14:00',note:'Spotless. No chips, stains, or damage on counters or cabinets.',hash:'a3f9c1',deposit:true},
{id:'m2',cat:'move-in',title:'Bathroom grout — move-in day',t:'2024-11-01T10:31:00',note:'Grout already discolored behind toilet. Pre-existing.',hash:'b71e04',deposit:true},
{id:'m3',cat:'move-in',title:'Carpet living room — move-in day',t:'2024-11-01T10:42:00',note:'Light wear path from door to kitchen, pre-existing.',hash:'c90d22',deposit:true},
{id:'m4',cat:'move-in',title:'Walls — nail holes noted',t:'2024-11-01T11:05:00',note:'Landlord noted "6 small nail holes, normal wear" on checklist.',hash:'d44a17',deposit:true},
{id:'r1',cat:'repairs',title:'Leak under kitchen sink',t:'2025-03-12T09:20:00',note:'Reported via portal #REQ-118. Fixed Mar 19 — 7 days.',hash:'e512b8',deposit:false},
{id:'r2',cat:'repairs',title:'Dishwasher not draining',t:'2025-07-02T14:00:00',note:'Reported #REQ-204. Tech visit Jul 9. No tenant fault found.',hash:'f603d1',deposit:true},
{id:'r3',cat:'repairs',title:'Move-out walkthrough',t:'2025-10-31T15:30:00',note:'Landlord: "unit looks great". No damage noted on walkthrough form.',hash:'07aa49',deposit:true},
{id:'p1',cat:'payments',title:'Rent — Nov 2024 → Oct 2025',t:'2025-10-01T08:00:00',note:'12/12 on-time payments, $2,850 each. Zero late fees.',hash:'18bc72',deposit:true},
{id:'p2',cat:'payments',title:'Deposit receipt',t:'2024-10-28T12:00:00',note:'$2,850 security deposit paid via cashier\'s check #8841.',hash:'29cd83',deposit:true},
{id:'c1',cat:'comms',title:'"Excessive wear" claim',t:'2025-11-12T16:44:00',note:'Landlord email: withholding full deposit for "excessive wear to carpet and walls".',hash:'3ade94',deposit:true},
{id:'c2',cat:'comms',title:'Your itemized-statement request',t:'2025-11-13T09:02:00',note:'You requested the CA §1950.5 itemized statement within 21 days. No reply yet.',hash:'4bef05',deposit:true},
{id:'c3',cat:'comms',title:'Lease renewal offer',t:'2025-09-20T11:15:00',note:'Renewal offered at $3,000 — declined, moved out Oct 31.',hash:'5cf016',deposit:false}];
items.forEach((it,i)=>{it.hue=K.int(F,150,230);it.ts=new Date(it.t).getTime()});
const store=K.store('vault52');
const custom=store.get('custom',[]);
custom.forEach(c=>{if(!items.find(i=>i.id===c.id)){c.ts=new Date(c.t).getTime();items.push(c);}});
let selected=store.get('sel', items.filter(i=>i.deposit).map(i=>i.id));
function formModal(title,formHTML,onSave){
  K.modal({title:title,body:formHTML,actions:[{label:'Cancel'}]});
  var boxes=document.querySelectorAll('.k-modal');var box=boxes[boxes.length-1];
  box.querySelector('[data-save]').onclick=function(){onSave(box);};
  return box;
}
function closeModalBox(box){var ov=box.parentElement;if(ov)ov.remove();}
function addEvidence(){
  formModal('Add evidence',
   '<label class="k-lab">Title</label><input class="k-input" id="ae-title" placeholder="e.g. Kitchen — move-out day">'
   +'<label class="k-lab">Category</label><select class="k-select" id="ae-cat"><option value="move-in">Move-in condition</option><option value="repairs">Repair requests</option><option value="payments">Rent payments</option><option value="comms">Landlord comms</option></select>'
   +'<label class="k-lab">Notes</label><textarea class="k-input" id="ae-note" rows="3" placeholder="What does this prove?"></textarea>'
   +'<label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px"><input type="checkbox" id="ae-dep" checked> Include in dispute package</label>'
   +'<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="k-btn k-primary" data-save>Save evidence</button></div>',
   function(box){
    const title=box.querySelector('#ae-title').value.trim();
    if(!title){K.toast('Give the evidence a title','warn');return;}
    const now=new Date();
    const it={id:'u'+now.getTime(),cat:box.querySelector('#ae-cat').value,title:title,t:now.toISOString(),note:box.querySelector('#ae-note').value.trim()||'No notes.',hash:Math.random().toString(16).slice(2,8),deposit:box.querySelector('#ae-dep').checked,hue:K.int(F,150,230),ts:now.getTime()};
    items.push(it);custom.push(it);store.set('custom',custom);
    if(it.deposit){selected.push(it.id);store.set('sel',selected);updateKpi();}
    draw();closeModalBox(box);
    K.toast('Evidence saved to vault','ok');
  });
}
function exportPackage(){
  const pkg=items.filter(i=>selected.includes(i.id)).sort((a,b)=>a.ts-b.ts);
  if(!pkg.length){K.toast('Package is empty — add evidence first','warn');return;}
  const L=[];
  L.push('SECURITY DEPOSIT DISPUTE PACKAGE');
  L.push('Assembled '+K.when(new Date())+' · Evidence Vault (demo)');
  L.push('');
  L.push('DEMAND LETTER');
  L.push('Dear Property Manager,');
  L.push('Per California Civil Code 1950.5, I dispute your November 12 withholding of my $2,850 security deposit for "excessive wear."');
  L.push('The enclosed '+pkg.length+' timestamped evidence items establish:');
  L.push('- Move-in photos show the carpet wear and grout discoloration pre-existed (Nov 1, 2024).');
  L.push('- Your own walkthrough form (Oct 31, 2025) notes no damage.');
  L.push('- 12/12 rent payments on time; all repairs reported promptly and resolved without tenant fault.');
  L.push('Please return the full $2,850 within 21 days of your withholding notice, with an itemized statement as the law requires.');
  L.push('Bad-faith withholding exposes you to up to 2x damages under 1950.5(l).');
  L.push('Sincerely, Tenant, Unit #12');
  L.push('');
  L.push('EVIDENCE TIMELINE ('+pkg.length+' items)');
  pkg.forEach(i=>{L.push(K.when(i.t)+' — '+i.title+' ['+CATL[i.cat]+'] sha256:'+i.hash+'…');L.push('   '+i.note);});
  const blob=new Blob([L.join('\n')],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='deposit-dispute-package.txt';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  K.toast('Package downloaded as .txt ('+pkg.length+' items)','ok');
}
const kh=document.getElementById('kpis');
K.kpi(kh.appendChild(document.createElement('div')),{label:'Evidence items',value:String(items.length)});
K.kpi(kh.appendChild(document.createElement('div')),{label:'Deposit at stake',value:'$2,850',delta:'withheld Nov 12'});
K.kpi(kh.appendChild(document.createElement('div')),{label:'On-time rent',value:'12/12',delta:'zero late payments'});
K.kpi(kh.appendChild(document.createElement('div')),{label:'In package',value:String(selected.length),delta:'tap to toggle'});
let curCat='all';
function renderTabs(){
const host=document.getElementById('tabs');host.innerHTML='';
K.tabs(host,[{id:'all',label:'All',render:()=>{}},{id:'move-in',label:'Move-in',render:()=>{}},{id:'repairs',label:'Repairs',render:()=>{}},{id:'payments',label:'Payments',render:()=>{}},{id:'comms',label:'Comms',render:()=>{}}].map(t=>({...t,render:()=>{curCat=t.id;draw()}})));
host.querySelectorAll('.k-tabs button')[0].classList.add('active');
}
function draw(){
const v=document.getElementById('vault');v.innerHTML='';
const list=items.filter(i=>curCat==='all'||i.cat===curCat);
if(!list.length){K.empty(v,'No evidence here','Nothing filed under this category yet.','Add evidence',addEvidence);return}
list.forEach(it=>{
const card=K.el(`<div class="k-card ev-card ${selected.includes(it.id)?'sel':''}" style="padding:12px">
<div class="thumb">${svgThumb(CATL[it.cat],it.hue,ICONS[it.cat])}</div>
<div style="margin-top:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">${K.badge(CATL[it.cat],'info')}${it.deposit?K.badge('deposit case','warn'):''}</div>
<div style="font-weight:700;margin-top:6px">${K.esc(it.title)}</div>
<div class="k-muted" style="font-size:12px">${K.when(it.t)} · <span class="custody">sha ${it.hash}</span></div>
<div style="margin-top:8px"><button class="k-btn" style="font-size:12px;padding:6px 10px">${selected.includes(it.id)?'✓ In package':'＋ Add to package'}</button></div></div>`);
card.querySelector('button').onclick=e=>{e.stopPropagation();const i=selected.indexOf(it.id);if(i>=0)selected.splice(i,1);else selected.push(it.id);store.set('sel',selected);draw();updateKpi()};
card.onclick=()=>K.modal({title:it.title,body:`<div class="thumb" style="margin-bottom:12px">${svgThumb(CATL[it.cat],it.hue,ICONS[it.cat])}</div><p>${K.esc(it.note)}</p><div class="k-muted" style="font-size:13px">Captured ${K.when(it.t)}<br>Category: ${CATL[it.cat]}</div><div class="k-card" style="margin-top:12px;background:var(--panel)"><b style="font-size:13px">Chain of custody</b><div class="custody">sha256:${it.hash}… · device iPhone 13 Pro · GPS on · uploaded same day</div></div>`,actions:[{label:'Close',primary:true}]});
v.appendChild(card)});
}
function updateKpi(){kh.children[3].querySelector('.k-kpi-value').textContent=selected.length}
renderTabs();draw();
document.getElementById('ev-add').onclick=addEvidence;
document.getElementById('ev-export').onclick=exportPackage;
document.getElementById('assemble').onclick=()=>{
const pv=document.getElementById('package-view');pv.style.display='block';
const bar=document.getElementById('pkg-progress');bar.style.display='block';
const fill=document.getElementById('pkg-fill'),lab=document.getElementById('pkg-label');
const steps=['Collecting deposit-relevant evidence…','Verifying timestamps & hashes…','Building timeline…','Drafting demand letter…'];
let s=0;fill.style.width='0%';
const pkg=items.filter(i=>selected.includes(i.id)).sort((a,b)=>a.ts-b.ts);
const timer=setInterval(()=>{if(s<steps.length){lab.textContent=steps[s];fill.style.width=((s+1)/steps.length*100)+'%';s++}else{clearInterval(timer);setTimeout(()=>{bar.style.display='none';showPackage(pkg);pv.scrollIntoView({behavior:'smooth'})},400)}},550);
};
function showPackage(pkg){
const pv=document.getElementById('package-view');
const total=pkg.length;
pv.innerHTML=`<div class="k-card" style="border-top:4px solid var(--accent)">
<div style="display:flex;gap:12px;align-items:center;margin-bottom:6px;flex-wrap:wrap"><h2 style="margin:0">Dispute package ready</h2>${K.badge(total+' items','ok')}${K.badge('$2,850 claimed','warn')}</div>
<div class="k-muted" style="margin-bottom:16px">Auto-assembled ${K.when(new Date())} · every item timestamped & hash-verified</div>
<div class="k-split"><div><h3 style="margin-top:0">Evidence timeline</h3><div id="pkg-tl"></div></div>
<div><h3 style="margin-top:0">Demand letter (auto-drafted)</h3><div class="letter">
<p>Dear Property Manager,</p>
<p>Per California Civil Code §1950.5, I dispute your November 12 withholding of my $2,850 security deposit for "excessive wear." The enclosed ${total} timestamped evidence items establish:</p>
<ul><li>Move-in photos show the carpet wear and grout discoloration <b>pre-existed</b> (Nov 1, 2024).</li><li>Your own walkthrough form (Oct 31, 2025) notes <b>no damage</b>.</li><li>12/12 rent payments on time; all repairs were reported promptly and resolved without tenant fault.</li></ul>
<p>Please return the full $2,850 within 21 days of your withholding notice, with an itemized statement as the law requires. Bad-faith withholding exposes you to up to <b>2× damages</b> under §1950.5(l).</p>
<p>Sincerely,<br>Tenant, Unit #12</p></div>
<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="k-btn k-primary" id="send-pkg">Send via certified mail</button><button class="k-btn" id="copy-pkg">Copy letter</button></div></div></div></div>`;
K.timeline(pv.querySelector('#pkg-tl'),pkg.map(i=>({t:K.when(i.t),title:i.title,body:i.note,kind:i.cat==='comms'?'warn':''})));
pv.querySelector('#send-pkg').onclick=()=>K.toast('Sent via certified mail — tracking #9405 5000 0000 (demo)','ok');
pv.querySelector('#copy-pkg').onclick=()=>K.copy(pv.querySelector('.letter').innerText);
K.toast('Package assembled: '+total+' items, demand letter drafted','ok');
}
})();
</script>

</body>
</html>
