<style>

.k-btn:hover{border-color:var(--accent)}
.k-primary{background:var(--accent);border-color:var(--accent);color:#fff}

.k-input,.k-select,textarea.k-input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--panel2);color:var(--ink);font-family:inherit}
.k-input:focus,.k-select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.k-table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.k-table tr:last-child td{border-bottom:none}

.k-tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.k-tabs button{border:none;background:none;padding:10px 14px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.k-tabs button.active{color:var(--ink);border-bottom-color:var(--accent)}
.k-kpi{display:flex;flex-direction:column;gap:2px}
.k-kpi .k-kpi-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.k-kpi .k-kpi-value{font-size:28px;font-weight:800}
.k-kpi .k-kpi-delta{font-size:13px}
.k-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;z-index:9999;pointer-events:none;max-width:90vw}
.k-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.k-toast.ok{background:#166534}.k-toast.warn{background:#92400e}.k-toast.bad{background:#991b1b}
.k-modal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9998;padding:20px}
.k-modal{background:var(--panel2);border-radius:16px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:24px}
.k-modal h2{margin:0 0 12px}
.k-modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.k-empty{text-align:center;padding:48px 20px;color:var(--muted)}
.k-empty h3{color:var(--ink);margin:0 0 8px}
.k-hero{border-radius:18px;padding:32px;background:var(--panel);border:1px solid var(--line);margin-bottom:20px}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.k-split{grid-template-columns:1fr}}
.k-muted{color:var(--muted)}
.k-nav{padding:16px 0}
.k-chart-bar{height:10px;border-radius:6px;background:var(--accent);min-width:4px}
.k-timeline{position:relative;padding-left:26px}
.k-timeline:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.k-timeline-ev{position:relative;padding:0 0 18px}
.k-timeline-ev:before{content:"";position:absolute;left:-24px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--panel2)}
.k-timeline-ev.warn:before{background:var(--warn)}.k-timeline-ev.bad:before{background:var(--bad)}.k-timeline-ev.ok:before{background:var(--good)}
.k-timeline-ev .t{font-size:12px;color:var(--muted);font-weight:600}
</style>

Kit.table=function(host,cols,rows,opt){opt=opt||{};host.innerHTML='';var wrap=Kit.el('<div></div>');if(opt.search){var s=Kit.el('<input class="k-input" placeholder="Search…" style="max-width:280px;margin-bottom:10px">');s.oninput=function(){draw(s.value.toLowerCase())};wrap.appendChild(s)}var tw=Kit.el('<div style="overflow-x:auto"></div>');wrap.appendChild(tw);host.appendChild(wrap);var page=0;var ps=opt.pageSize||0;function filtered(q){if(!q)return rows;return rows.filter(function(r){return cols.some(function(c){var v=r[c.key];return v!=null&&String(v).toLowerCase().indexOf(q)>=0})})}function draw(q){var fr=filtered(q||'');var total=fr.length;var view=fr;if(ps&&total>ps){view=fr.slice(page*ps,page*ps+ps)}var h='<table class="k-table"><thead><tr>'+cols.map(function(c){return '<th'+(c.num?' style="text-align:right"':'')+'>'+Kit.esc(c.label)+'</th>'}).join('')+'</tr></thead><tbody>';view.forEach(function(r){h+='<tr>'+cols.map(function(c){var v=r[c.key];if(c.fmt)v=c.fmt(v,r);else v=Kit.esc(v==null?'':v);return '<td'+(c.num?' style="text-align:right"':'')+'>'+v+'</td>'}).join('')+'</tr>'});h+='</tbody></table>';if(!view.length)h='<div class="k-empty"><h3>No results</h3><div>Nothing matches.</div></div>';tw.innerHTML=h;var pg=wrap.querySelector('.k-pg');if(pg)pg.remove();if(ps&&total>ps){var pgn=Kit.el('<div class="k-pg" style="display:flex;gap:8px;align-items:center;margin-top:10px"><button class="k-btn">← Prev</button><span class="k-muted" style="font-size:13px">Page '+(page+1)+' of '+Math.ceil(total/ps)+'</span><button class="k-btn">Next →</button></div>');var btns=pgn.querySelectorAll('button');btns[0].onclick=function(){if(page>0){page--;draw(q||'')}};btns[1].onclick=function(){if((page+1)*ps<total){page++;draw(q||'')}};wrap.appendChild(pgn)}}draw('')};
Kit.bars=function(host,items){host.innerHTML='';var max=Math.max.apply(null,items.map(function(i){return i.value}).concat([1]));items.forEach(function(i){var row=Kit.el('<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="font-weight:600">'+Kit.esc(i.label)+'</span><span class="k-muted">'+Kit.esc(i.display!=null?i.display:i.value)+'</span></div><div style="background:var(--panel);border-radius:6px;height:12px"><div class="k-chart-bar" style="width:'+(100*i.value/max)+'%;background:'+(i.color||'var(--accent)')+'"></div></div></div>');host.appendChild(row)})};

<body>
<style>body{padding-top:104px}/* qa-c: clear fixed .k-nav header */
:root{--bg:#f2efe4;--panel:#e9e4d2;--panel2:#fffdf4;--ink:#23211a;--muted:#8a8467;--line:#ddd5b8;--accent:#2f7d32;--accent2:#b45309;--good:#2f7d32;--warn:#b45309;--bad:#b91c1c}

<script>

const T=(id,name,cat,before,deps)=>({id,name,cat,before,deps,owner:K.pick(F,OWNERS)});
const TASKS=[
T('quotes','Get 3 mover quotes','Movers',35,[]),T('book-movers','Book moving company','Movers',28,[]),
T('measure','Measure new place for furniture','Movers',21,['book-movers']),
T('declutter','Declutter & donate','Packing',30,[]),T('pack-noness','Pack non-essentials','Packing',21,['declutter']),
T('pack-kitchen','Pack kitchen','Packing',10,['pack-noness']),T('label','Label & photograph boxes','Packing',9,['pack-noness']),
T('disassemble','Disassemble furniture','Packing',3,['pack-kitchen']),T('essentials','Pack essentials box','Packing',2,['pack-kitchen']),
T('movkit','Prep moving-day kit (snacks, tools)','Packing',1,[]),
T('notify','Give notice to landlord','Admin',32,[]),T('usps','USPS mail forwarding','Admin',14,[]),
T('addr','Update address: bank, DMV, voter reg','Admin',7,['usps']),T('ins','Update renter\u2019s insurance','Admin',7,['notify']),
T('return-keys','Return keys','Admin',1,['walk']),
T('elec-off','Schedule power shutoff (old place)','Utilities',10,[]),T('elec-on','Schedule power start (new place)','Utilities',10,[]),
T('net','Transfer internet service','Utilities',14,[]),T('water','Transfer water & gas','Utilities',10,[]),
T('clean','Deep clean old place','Cleaning',3,['disassemble']),T('walk','Final walkthrough + photos','Cleaning',2,['clean']),
T('pet','Arrange pet transport / boarding','Family',14,[]),T('school','Transfer school records','Family',21,[])];
const byId={};TASKS.forEach(t=>byId[t.id]=t);
// schedule: days-before-move, respecting prerequisites (process farthest-first)
function schedule(){const day={};[...TASKS].sort((a,b)=>b.before-a.before).forEach(t=>{let d=t.before;t.deps.forEach(p=>{d=Math.min(d,day[p]-1)});day[t.id]=Math.max(d,0)});return day}
function criticalPath(){let best=[];function chain(t,acc){acc=[t,...acc];if(!t.deps.length){if(acc.length>best.length)best=acc;return}t.deps.forEach(p=>chain(byId[p],acc))}TASKS.forEach(t=>chain(t,[]));return new Set(best.map(t=>t.id))}
const CRIT=criticalPath();
const store=K.store('moveos54');let done=store.get('done',[]);
let moveDate=new Date(document.getElementById('move-date').value+'T12:00:00');
const DAYMS=864e5;
const fmtD=d=>new Date(d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
function drawKPIs(sched){
const kh=document.getElementById('kpis');kh.innerHTML='';
const dates=Object.values(sched).map(d=>moveDate.getTime()-d*DAYMS);
const first=new Date(Math.min(...dates));
K.kpi(kh.appendChild(document.createElement('div')),{label:'Tasks',value:'23'});
K.kpi(kh.appendChild(document.createElement('div')),{label:'Start packing',value:fmtD(first),delta:'first task'});
K.kpi(kh.appendChild(document.createElement('div')),{label:'Critical path',value:CRIT.size+' tasks',delta:'longest chain'});
K.kpi(kh.appendChild(document.createElement('div')),{label:'Done',value:done.length+' / 23',delta:K.pct(done.length/23)});
document.getElementById('prog-label').textContent=done.length+' of 23 done';
document.getElementById('prog-fill').style.width=(done.length/23*100)+'%';
}
function taskCard(t,sched,flash){
const d=sched[t.id],dt=new Date(moveDate.getTime()-d*DAYMS);
const isDone=done.includes(t.id);
const card=K.el(`<div class="k-card task ${isDone?'done':''} ${CRIT.has(t.id)?'crit':''} ${flash?'flash':''}" style="padding:12px 14px">
<div style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" ${isDone?'checked':''} style="width:20px;height:20px;margin-top:2px;accent-color:var(--accent)">
<div style="flex:1"><div class="t-name" style="font-weight:700">${K.esc(t.name)}</div>
<div class="k-muted" style="font-size:12px">${K.badge(t.cat,'info')} due <b style="color:var(--ink)">${fmtD(dt)}</b> · ${d===0?'moving day':d+'d before'} · ${K.esc(t.owner)}${t.deps.length?` · needs: ${t.deps.map(p=>K.esc(byId[p].name)).join(', ')}`:''}</div></div></div></div>`);
card.querySelector('input').onchange=e=>{const i=done.indexOf(t.id);if(e.target.checked&&i<0)done.push(t.id);if(!e.target.checked&&i>=0)done.splice(i,1);store.set('done',done);card.classList.toggle('done',e.target.checked);drawKPIs(sched);if(done.length===23)K.toast('All packed. You beautiful machine. 🎉','ok')};
return card;
}
function renderTimeline(host,sched,flash){
host.innerHTML='';const weeks={};
TASKS.forEach(t=>{const w=Math.floor(sched[t.id]/7);(weeks[w]=weeks[w]||[]).push(t)});
Object.keys(weeks).sort((a,b)=>b-a).forEach(w=>{
const ws=new Date(moveDate.getTime()-(+w*7+6)*DAYMS),we=new Date(moveDate.getTime()-(+w*7)*DAYMS);
const h=K.el(`<div class="week-h">${+w===0?'Moving week':+w+' week'+(+w>1?'s':'')+' out'} <span style="font-weight:400;opacity:.85">· ${fmtD(ws)} – ${fmtD(we)}</span></div>`);
host.appendChild(h);
weeks[w].sort((a,b)=>sched[b.id]-sched[a.id]).forEach(t=>host.appendChild(taskCard(t,sched,flash)));
});
}
function renderGraph(host){
const nodes=TASKS.map(t=>({id:t.id,label:t.name.length>18?t.name.slice(0,17)+'…':t.name,sub:t.cat,color:CRIT.has(t.id)?'#b45309':'#2f7d32'}));
const edges=[];TASKS.forEach(t=>t.deps.forEach(p=>edges.push({a:p,b:t.id})));
K.graph(host,{nodes,edges});
const l=K.el('<div class="k-muted" style="font-size:13px;margin-top:8px">Arrows run prerequisite → dependent. <b style="color:#b45309">Orange</b> = critical path ('+CRIT.size+' tasks). Move the date and every node re-dates.</div>');
host.appendChild(l);
}
function renderWeek(host,sched){
  host.innerHTML='';
  const now=new Date(); now.setHours(0,0,0,0);
  const open=TASKS.map(t=>({t:t,due:new Date(moveDate.getTime()-sched[t.id]*DAYMS)})).filter(x=>!done.includes(x.t.id));
  const overdue=open.filter(x=>x.due<now).sort((a,b)=>a.due-b.due);
  const soon=open.filter(x=>x.due>=now&&(x.due-now)<=7*DAYMS).sort((a,b)=>a.due-b.due);
  if(!overdue.length&&!soon.length){
    host.innerHTML='<div class="k-card" style="padding:22px;text-align:center"><div style="font-size:32px">🎉</div><b>Nothing due this week.</b><div class="k-muted" style="font-size:13px;margin-top:6px">You are ahead of the move. Go touch grass.</div></div>';
    return;
  }
  if(overdue.length){
    host.appendChild(K.el('<div class="week-h" style="color:var(--bad)">⚠ Overdue · '+overdue.length+'</div>'));
    overdue.forEach(x=>host.appendChild(taskCard(x.t,sched,false)));
  }
  if(soon.length){
    host.appendChild(K.el('<div class="week-h">📅 Due in the next 7 days · '+soon.length+'</div>'));
    soon.forEach(x=>host.appendChild(taskCard(x.t,sched,false)));
  }
  host.appendChild(K.el('<div class="k-muted" style="font-size:13px;margin-top:10px">'+(open.length-overdue.length-soon.length)+' more task(s) later — see the Timeline tab.</div>'));
}
function renderAll(flash){
const sched=schedule();drawKPIs(sched);
const host=document.getElementById('tabs');
K.tabs(host,[{id:'w',label:'🎯 This week',render:h=>renderWeek(h,sched)},{id:'tl',label:'📅 Timeline',render:h=>renderTimeline(h,sched,flash)},{id:'g',label:'🕸 Dependencies',render:renderGraph},{id:'c',label:'☑ Checklist',render:h=>{h.innerHTML='<div class="k-grid" id="ck"></div>';const ck=h.querySelector('#ck');[...TASKS].sort((a,b)=>sched[a.id]-sched[b.id]).forEach(t=>ck.appendChild(taskCard(t,sched,false)))}}]);
}
document.getElementById('move-date').onchange=e=>{
moveDate=new Date(e.target.value+'T12:00:00');
if(isNaN(moveDate))return;
renderAll(true);
K.toast('Moved to '+fmtD(moveDate)+' — 23 tasks reshuffled','ok');
};
renderAll(false);
K.toast('Demo loaded: 23 tasks scheduled back from Oct 31','ok');
})();
</script>
