<style>

.k-wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.k-grid{display:grid;gap:16px}
.k-card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.k-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
.k-btn:hover{border-color:var(--accent)}
.k-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.k-primary:hover{filter:brightness(1.08)}
.k-input,.k-select,textarea.k-input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--panel2);color:var(--ink);font-family:inherit}
.k-input:focus,.k-select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.k-table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.k-table tr:last-child td{border-bottom:none}
.k-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.k-badge.ok{background:#dcfce7;color:#166534}.k-badge.warn{background:#fef3c7;color:#92400e}.k-badge.bad{background:#fee2e2;color:#991b1b}.k-badge.info{background:#dbeafe;color:#1e40af}
.k-tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.k-tabs button{border:none;background:none;padding:10px 14px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.k-tabs button.active{color:var(--ink);border-bottom-color:var(--accent)}
.k-kpi{display:flex;flex-direction:column;gap:2px}
.k-kpi .k-kpi-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.k-kpi .k-kpi-value{font-size:28px;font-weight:800}
.k-kpi .k-kpi-delta{font-size:13px}
.k-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;z-index:9999;pointer-events:none;max-width:90vw}
.k-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.k-toast.ok{background:#166534}.k-toast.warn{background:#92400e}.k-toast.bad{background:#991b1b}
.k-modal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9998;padding:20px}
.k-modal{background:var(--panel2);border-radius:16px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:24px}
.k-modal h2{margin:0 0 12px}
.k-modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.k-empty{text-align:center;padding:48px 20px;color:var(--muted)}
.k-empty h3{color:var(--ink);margin:0 0 8px}
.k-hero{border-radius:18px;padding:32px;background:var(--panel);border:1px solid var(--line);margin-bottom:20px}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.k-split{grid-template-columns:1fr}}
.k-muted{color:var(--muted)}
.k-nav{padding:16px 0}
.k-chart-bar{height:10px;border-radius:6px;background:var(--accent);min-width:4px}
.k-timeline{position:relative;padding-left:26px}
.k-timeline:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.k-timeline-ev{position:relative;padding:0 0 18px}
.k-timeline-ev:before{content:"";position:absolute;left:-24px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--panel2)}
.k-timeline-ev.warn:before{background:var(--warn)}.k-timeline-ev.bad:before{background:var(--bad)}.k-timeline-ev.ok:before{background:var(--good)}
.k-timeline-ev .t{font-size:12px;color:var(--muted);font-weight:600}
</style>

Kit.tabs=function(host,tabs){host.innerHTML='';var bar=Kit.el('<div class="k-tabs" role="tablist"></div>');var pane=Kit.el('<div></div>');host.appendChild(bar);host.appendChild(pane);tabs.forEach(function(t,i){var b=Kit.el('<button role="tab">'+Kit.esc(t.label)+'</button>');if(i===0)b.classList.add('active');b.onclick=function(){bar.querySelectorAll('button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');pane.innerHTML='';t.render(pane)};bar.appendChild(b)});if(tabs[0])tabs[0].render(pane)};
Kit.table=function(host,cols,rows,opt){opt=opt||{};host.innerHTML='';var wrap=Kit.el('<div></div>');if(opt.search){var s=Kit.el('<input class="k-input" placeholder="Search…" style="max-width:280px;margin-bottom:10px">');s.oninput=function(){draw(s.value.toLowerCase())};wrap.appendChild(s)}var tw=Kit.el('<div style="overflow-x:auto"></div>');wrap.appendChild(tw);host.appendChild(wrap);var page=0;var ps=opt.pageSize||0;function filtered(q){if(!q)return rows;return rows.filter(function(r){return cols.some(function(c){var v=r[c.key];return v!=null&&String(v).toLowerCase().indexOf(q)>=0})})}function draw(q){var fr=filtered(q||'');var total=fr.length;var view=fr;if(ps&&total>ps){view=fr.slice(page*ps,page*ps+ps)}var h='<table class="k-table"><thead><tr>'+cols.map(function(c){return '<th'+(c.num?' style="text-align:right"':'')+'>'+Kit.esc(c.label)+'</th>'}).join('')+'</tr></thead><tbody>';view.forEach(function(r){h+='<tr>'+cols.map(function(c){var v=r[c.key];if(c.fmt)v=c.fmt(v,r);else v=Kit.esc(v==null?'':v);return '<td'+(c.num?' style="text-align:right"':'')+'>'+v+'</td>'}).join('')+'</tr>'});h+='</tbody></table>';if(!view.length)h='<div class="k-empty"><h3>No results</h3><div>Nothing matches.</div></div>';tw.innerHTML=h;var pg=wrap.querySelector('.k-pg');if(pg)pg.remove();if(ps&&total>ps){var pgn=Kit.el('<div class="k-pg" style="display:flex;gap:8px;align-items:center;margin-top:10px"><button class="k-btn">← Prev</button><span class="k-muted" style="font-size:13px">Page '+(page+1)+' of '+Math.ceil(total/ps)+'</span><button class="k-btn">Next →</button></div>');var btns=pgn.querySelectorAll('button');btns[0].onclick=function(){if(page>0){page--;draw(q||'')}};btns[1].onclick=function(){if((page+1)*ps<total){page++;draw(q||'')}};wrap.appendChild(pgn)}}draw('')};
Kit.bars=function(host,items){host.innerHTML='';var max=Math.max.apply(null,items.map(function(i){return i.value}).concat([1]));items.forEach(function(i){var row=Kit.el('<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="font-weight:600">'+Kit.esc(i.label)+'</span><span class="k-muted">'+Kit.esc(i.display!=null?i.display:i.value)+'</span></div><div style="background:var(--panel);border-radius:6px;height:12px"><div class="k-chart-bar" style="width:'+(100*i.value/max)+'%;background:'+(i.color||'var(--accent)')+'"></div></div></div>');host.appendChild(row)})};

<style>body{padding-top:104px}/* qa-c: clear fixed .k-nav header */

<div class="k-wrap sans" style="padding-bottom:60px">

<script>

// ---------- natural-language parser ----------
function parse(q){
const s=q.toLowerCase(),reqs=[];
let m;
if(m=s.match(/(?:under|below|max|<=?)\s*\$?\s?(\d[\d,]*)/)){reqs.push({k:'budget',v:+m[1].replace(/,/g,''),label:'under '+K.money(+m[1].replace(/,/g,''))})}
if(m=s.match(/(\d)\s?(?:br|bed|bedroom)/)){reqs.push({k:'beds',v:+m[1],label:m[1]+'+ beds'})}
if(m=s.match(/under\s*(\d+)\s*min/)){reqs.push({k:'commute',v:+m[1],label:'under '+m[1]+' min to downtown'})}
if(/dog/.test(s))reqs.push({k:'dogs',v:1,label:'dog-friendly'});
if(/cat(?!ch)/.test(s)&&!/dog/.test(s))reqs.push({k:'cats',v:1,label:'cat-friendly'});
if(/pet/.test(s)&&!/dog|cat/.test(s))reqs.push({k:'pets',v:1,label:'pets allowed'});
if(/quiet|peaceful|low noise/.test(s))reqs.push({k:'quiet',v:1,label:'quiet'});
if(/yard|garden|outdoor/.test(s))reqs.push({k:'yard',v:1,label:'yard'});
if(/parking|garage/.test(s))reqs.push({k:'parking',v:1,label:'parking'});
if(/transit|caltrain|bart/.test(s))reqs.push({k:'transit',v:1,label:'near transit'});
if(/laundry|washer/.test(s))reqs.push({k:'laundry',v:1,label:'in-unit laundry'});
if(/pool/.test(s))reqs.push({k:'pool',v:1,label:'pool'});
return reqs;
}
function score(l,reqs){
let pts=0,max=0;const reasons=[];
reqs.forEach(r=>{max+=10;let ok=false,why='';
if(r.k==='budget'){ok=l.price<=r.v;why=K.money(l.price)+(ok?' fits budget':' over budget by '+K.money(l.price-r.v))}
if(r.k==='beds'){ok=l.beds>=r.v;why=l.beds+' bed'+(l.beds===1?'':'s')+(ok?' ✓':' — needs '+r.v)}
if(r.k==='commute'){ok=l.commute<=r.v;why=l.commute+' min to downtown'+(ok?' ✓':' — '+ (l.commute-r.v) +' min over')}
if(r.k==='dogs'){ok=l.pets==='dogs';why=ok?'dogs welcome ✓':(l.pets==='cats'?'cats only — no dogs':'no pets allowed')}
if(r.k==='cats'){ok=l.pets==='dogs'||l.pets==='cats';why=ok?'pets OK ✓':'no pets allowed'}
if(r.k==='pets'){ok=l.pets!=='none';why=ok?'pets allowed ✓':'no pets allowed'}
if(r.k==='quiet'){ok=l.noise>=4;why=ok?'very quiet (top floor / no shared walls) ✓':'noise level '+l.noise+'/5 — '+['','','lively','moderate','calm'][l.noise]}
if(r.k==='yard'){ok=!!l.yard;why=ok?'private yard ✓':'no yard'}
if(r.k==='parking'){ok=l.parking>0;why=ok?l.parking+' parking spot'+(l.parking>1?'s':'')+' ✓':'street parking only'}
if(r.k==='transit'){ok=l.transit>=7;why=ok?'transit score '+l.transit+'/10 ✓':'transit score '+l.transit+'/10'}
if(r.k==='laundry'){ok=!!l.laundry;why=ok?'in-unit laundry ✓':'shared laundry'}
if(r.k==='pool'){ok=false;why='no pool listed'}
if(ok)pts+=10;else if(r.k==='budget'||r.k==='commute')pts+=Math.max(0,10-Math.round((r.k==='budget'?(l.price-r.v)/500:(l.commute-r.v)/5)));
reasons.push({ok,why})});
return{score:max?Math.round(pts/max*100):50,reasons};
}
function go(){
const q=document.getElementById('q').value.trim();
const reqs=parse(q);
const ph=document.getElementById('parsed');
ph.innerHTML=reqs.length?'<div class="k-muted" style="font-size:13px;margin-bottom:4px">Understood as:</div>'+reqs.map(r=>'<span class="req-chip">'+K.esc(r.label)+'</span>').join(' '):'<div class="k-muted">Couldn\'t pick out requirements — showing everything, try words like <i>quiet, dog-friendly, under 40 min, 2br, under $3000</i>.</div>';

<p class="k-muted" style="font-size:13px;margin:10px 0">${K.esc(l.blurb)}</p>
<div>${l.reasons.slice(0,3).map(r=>`<div class="reason">${r.ok?'✅':'⚠️'} ${K.esc(r.why)}</div>`).join('')}${l.reasons.length>3?`<div class="reason k-muted">+ ${l.reasons.length-3} more…</div>`:''}</div></div>`);
card.onclick=()=>K.modal({title:l.n+' — '+l.score+'% match',body:`<div class="photo">${l.emoji}</div><p>${K.esc(l.blurb)}</p><div class="k-muted" style="font-size:13px;margin-bottom:10px">${K.esc(l.hood)} · ${l.beds}bd/${l.baths}ba · ${K.money(l.price)}/mo · ${l.commute} min to downtown</div><h4>Why this score</h4>${l.reasons.map(r=>`<div class="reason">${r.ok?'✅':'⚠️'} ${K.esc(r.why)}</div>`).join('')}<div class="k-card" style="background:var(--panel);margin-top:12px;font-size:13px"><b>Pet policy:</b> ${l.pets==='dogs'?'dogs & cats welcome':l.pets==='cats'?'cats only':'no pets'} · <b>Noise:</b> ${l.noise}/5 · <b>Transit:</b> ${l.transit}/10</div>`,actions:[{label:'Copy tour request',primary:true,onClick:c=>{c();var wants=l.reasons.filter(function(r){return r.ok}).map(function(r){return r.why.replace(/ ✓/g,'')}).slice(0,3).join('; ');
K.copy('Hi — I\'d like to tour '+l.n+' ('+l.hood+') listed at '+K.money(l.price)+'/mo ('+l.beds+'bd/'+l.baths+'ba).'+(wants?'\n\nWhat matters to me: '+wants+'.':'')+'\n\nAre you available for a tour this weekend?\n\nThanks!');}},{label:'Close'}]});
grid.appendChild(card)});
host.appendChild(grid);
}
document.getElementById('go').onclick=go;
document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')go()};
go();
})();
