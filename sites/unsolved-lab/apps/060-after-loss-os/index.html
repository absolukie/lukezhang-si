<!DOCTYPE html>

<style>
/* ===== W6 Kit fallback CSS (only matters if shared/kit.css missing) ===== */
:root{--bg:#ffffff;--panel:#f6f6f4;--panel2:#ffffff;--ink:#1b1b1b;--muted:#6f6f6f;--line:#e4e4df;--accent:#1d4ed8;--accent2:#0d9488;--good:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);margin:0;line-height:1.5}
.k-wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.k-grid{display:grid;gap:16px}
.k-card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.k-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
.k-btn:hover{border-color:var(--accent)}
.k-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.k-primary:hover{filter:brightness(1.08)}
.k-input,.k-select,textarea.k-input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--panel2);color:var(--ink);font-family:inherit}
.k-input:focus,.k-select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.k-table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.k-table tr:last-child td{border-bottom:none}
.k-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.k-badge.ok{background:#dcfce7;color:#166534}.k-badge.warn{background:#fef3c7;color:#92400e}.k-badge.bad{background:#fee2e2;color:#991b1b}.k-badge.info{background:#dbeafe;color:#1e40af}
.k-tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.k-tabs button{border:none;background:none;padding:10px 14px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.k-tabs button.active{color:var(--ink);border-bottom-color:var(--accent)}
.k-kpi{display:flex;flex-direction:column;gap:2px}
.k-kpi .k-kpi-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.k-kpi .k-kpi-value{font-size:28px;font-weight:800}
.k-kpi .k-kpi-delta{font-size:13px}
.k-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;z-index:9999;pointer-events:none;max-width:90vw}
.k-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.k-toast.ok{background:#166534}.k-toast.warn{background:#92400e}.k-toast.bad{background:#991b1b}
.k-modal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9998;padding:20px}
.k-modal{background:var(--panel2);border-radius:16px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:24px}
.k-modal h2{margin:0 0 12px}
.k-modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.k-empty{text-align:center;padding:48px 20px;color:var(--muted)}
.k-empty h3{color:var(--ink);margin:0 0 8px}
.k-hero{border-radius:18px;padding:32px;background:var(--panel);border:1px solid var(--line);margin-bottom:20px}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.k-split{grid-template-columns:1fr}}
.k-muted{color:var(--muted)}
.k-nav{padding:16px 0}
.k-chart-bar{height:10px;border-radius:6px;background:var(--accent);min-width:4px}
.k-timeline{position:relative;padding-left:26px}
.k-timeline:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.k-timeline-ev{position:relative;padding:0 0 18px}
.k-timeline-ev:before{content:"";position:absolute;left:-24px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--panel2)}
.k-timeline-ev.warn:before{background:var(--warn)}.k-timeline-ev.bad:before{background:var(--bad)}.k-timeline-ev.ok:before{background:var(--good)}
.k-timeline-ev .t{font-size:12px;color:var(--muted);font-weight:600}
</style>
<script>
/* ===== W6 Kit fallback JS: implements window.Kit contract if shared/kit.js missing ===== */
(function(){

Kit.toast=function(msg,kind){var t=document.querySelector('.k-toast');if(t)t.remove();t=Kit.el('<div class="k-toast '+(kind||'')+'">'+Kit.esc(msg)+'</div>');document.body.appendChild(t);requestAnimationFrame(function(){t.classList.add('show')});setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove()},300)},2600)};
Kit.modal=function(o){var back=Kit.el('<div class="k-modal-back"><div class="k-modal" role="dialog"><h2>'+Kit.esc(o.title)+'</h2><div class="k-modal-body"></div><div class="k-modal-actions"></div></div></div>');var body=back.querySelector('.k-modal-body');if(typeof o.body==='string')body.innerHTML=o.body;else if(o.body)body.appendChild(o.body);var acts=back.querySelector('.k-modal-actions');function close(){back.remove()}(o.actions||[{label:'Close'}]).forEach(function(a){var b=Kit.el('<button class="k-btn'+(a.primary?' k-primary':'')+'">'+Kit.esc(a.label)+'</button>');b.onclick=function(){if(a.onClick)a.onClick(close);else close()};acts.appendChild(b)});back.addEventListener('click',function(e){if(e.target===back)close()});document.body.appendChild(back);return close};
Kit.tabs=function(host,tabs){host.innerHTML='';var bar=Kit.el('<div class="k-tabs" role="tablist"></div>');var pane=Kit.el('<div></div>');host.appendChild(bar);host.appendChild(pane);tabs.forEach(function(t,i){var b=Kit.el('<button role="tab">'+Kit.esc(t.label)+'</button>');if(i===0)b.classList.add('active');b.onclick=function(){bar.querySelectorAll('button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');pane.innerHTML='';t.render(pane)};bar.appendChild(b)});if(tabs[0])tabs[0].render(pane)};
Kit.table=function(host,cols,rows,opt){opt=opt||{};host.innerHTML='';var wrap=Kit.el('<div></div>');if(opt.search){var s=Kit.el('<input class="k-input" placeholder="Search…" style="max-width:280px;margin-bottom:10px">');s.oninput=function(){draw(s.value.toLowerCase())};wrap.appendChild(s)}var tw=Kit.el('<div style="overflow-x:auto"></div>');wrap.appendChild(tw);host.appendChild(wrap);var page=0;var ps=opt.pageSize||0;function filtered(q){if(!q)return rows;return rows.filter(function(r){return cols.some(function(c){var v=r[c.key];return v!=null&&String(v).toLowerCase().indexOf(q)>=0})})}function draw(q){var fr=filtered(q||'');var total=fr.length;var view=fr;if(ps&&total>ps){view=fr.slice(page*ps,page*ps+ps)}var h='<table class="k-table"><thead><tr>'+cols.map(function(c){return '<th'+(c.num?' style="text-align:right"':'')+'>'+Kit.esc(c.label)+'</th>'}).join('')+'</tr></thead><tbody>';view.forEach(function(r){h+='<tr>'+cols.map(function(c){var v=r[c.key];if(c.fmt)v=c.fmt(v,r);else v=Kit.esc(v==null?'':v);return '<td'+(c.num?' style="text-align:right"':'')+'>'+v+'</td>'}).join('')+'</tr>'});h+='</tbody></table>';if(!view.length)h='<div class="k-empty"><h3>No results</h3><div>Nothing matches.</div></div>';tw.innerHTML=h;var pg=wrap.querySelector('.k-pg');if(pg)pg.remove();if(ps&&total>ps){var pgn=Kit.el('<div class="k-pg" style="display:flex;gap:8px;align-items:center;margin-top:10px"><button class="k-btn">← Prev</button><span class="k-muted" style="font-size:13px">Page '+(page+1)+' of '+Math.ceil(total/ps)+'</span><button class="k-btn">Next →</button></div>');var btns=pgn.querySelectorAll('button');btns[0].onclick=function(){if(page>0){page--;draw(q||'')}};btns[1].onclick=function(){if((page+1)*ps<total){page++;draw(q||'')}};wrap.appendChild(pgn)}}draw('')};
Kit.bars=function(host,items){host.innerHTML='';var max=Math.max.apply(null,items.map(function(i){return i.value}).concat([1]));items.forEach(function(i){var row=Kit.el('<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="font-weight:600">'+Kit.esc(i.label)+'</span><span class="k-muted">'+Kit.esc(i.display!=null?i.display:i.value)+'</span></div><div style="background:var(--panel);border-radius:6px;height:12px"><div class="k-chart-bar" style="width:'+(100*i.value/max)+'%;background:'+(i.color||'var(--accent)')+'"></div></div></div>');host.appendChild(row)})};
Kit.line=function(host,series){var W=560,H=220,P=34;var all=[];series.forEach(function(s){s.points.forEach(function(p){all.push(p)})});var mn=Math.min.apply(null,all.concat([0])),mx=Math.max.apply(null,all.concat([1]));function X(i,n){return P+i*(W-2*P)/Math.max(n-1,1)}function Y(v){return H-P-(v-mn)*(H-2*P)/Math.max(mx-mn,1e-9)}var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;background:var(--panel);border-radius:12px">';series.forEach(function(s){var pts=s.points.map(function(p,i){return X(i,s.points.length)+','+Y(p)}).join(' ');svg+='<polyline points="'+pts+'" fill="none" stroke="'+(s.color||'var(--accent)')+'" stroke-width="2.5"/>'});svg+='</svg><div style="display:flex;gap:14px;margin-top:6px;flex-wrap:wrap">'+series.map(function(s){return '<span style="font-size:12px" class="k-muted"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+(s.color||'var(--accent)')+'"></span> '+Kit.esc(s.name)+'</span>'}).join('')+'</div>';host.innerHTML=svg};
Kit.donut=function(host,items){var tot=items.reduce(function(a,i){return a+i.value},0)||1;var R=54,C=2*Math.PI*R,off=0,segs='';var cols=['#1d4ed8','#0d9488','#b45309','#b91c1c','#6d28d9','#0e7490'];items.forEach(function(it,i){var frac=it.value/tot;segs+='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+(it.color||cols[i%cols.length])+'" stroke-width="18" stroke-dasharray="'+(frac*C)+' '+C+'" stroke-dashoffset="'+(-off*C)+'" transform="rotate(-90 70 70)"/>';off+=frac});host.innerHTML='<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg width="140" height="140" viewBox="0 0 140 140">'+segs+'<text x="70" y="76" text-anchor="middle" font-size="20" font-weight="800" fill="var(--ink)">'+Kit.esc(items._center||'')+'</text></svg><div>'+items.map(function(it,i){return '<div style="font-size:13px;margin-bottom:6px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+(it.color||cols[i%cols.length])+'"></span> <b>'+Kit.esc(it.label)+'</b> <span class="k-muted">'+Kit.pct(it.value/tot)+'</span></div>'}).join('')+'</div></div>'};
Kit.timeline=function(host,events){host.innerHTML='<div class="k-timeline">'+events.map(function(e){return '<div class="k-timeline-ev '+(e.kind||'')+'"><div class="t">'+Kit.esc(e.t)+'</div><div style="font-weight:700">'+Kit.esc(e.title)+'</div>'+(e.body?'<div class="k-muted" style="font-size:13px">'+Kit.esc(e.body)+'</div>':'')+'</div>'}).join('')+'</div>'};
Kit.graph=function(host,g){var n=g.nodes.length,W=560,H=300;var pos={};g.nodes.forEach(function(nd,i){var a=2*Math.PI*i/Math.max(n,1);pos[nd.id]=[W/2+Math.cos(a)*(W/2-70),H/2+Math.sin(a)*(H/2-60)]});var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;background:var(--panel);border-radius:12px">';g.edges.forEach(function(e){var a=pos[e.a],b=pos[e.b];if(!a||!b)return;svg+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="var(--line)" stroke-width="2"/>'+(e.label?'<text x="'+((a[0]+b[0])/2)+'" y="'+((a[1]+b[1])/2-6)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+Kit.esc(e.label)+'</text>':'')});g.nodes.forEach(function(nd){var p=pos[nd.id];svg+='<g><circle cx="'+p[0]+'" cy="'+p[1]+'" r="26" fill="'+(nd.color||'var(--accent)')+'"/><text x="'+p[0]+'" y="'+(p[1]+4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">'+Kit.esc(Kit.initials(nd.label))+'</text><text x="'+p[0]+'" y="'+(p[1]+42)+'" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">'+Kit.esc(nd.label)+'</text>'+(nd.sub?'<text x="'+p[0]+'" y="'+(p[1]+55)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+Kit.esc(nd.sub)+'</text>':'')+'</g>'});svg+='</svg>';host.innerHTML=svg};
Kit.badge=function(t,k){return '<span class="k-badge k-badge-'+Kit.esc(k||'info')+'">'+Kit.esc(t)+'</span>'};
Kit.kpi=function(host,o){host.innerHTML='<div class="k-kpi"><div class="k-kpi-label">'+Kit.esc(o.label)+'</div><div class="k-kpi-value">'+Kit.esc(o.value)+'</div>'+(o.delta?'<div class="k-kpi-delta">'+Kit.esc(o.delta)+'</div>':'')+'</div>'};
Kit.empty=function(host,title,sub,al,af){host.innerHTML='<div class="k-empty"><h3>'+Kit.esc(title)+'</h3><div style="margin-bottom:14px">'+Kit.esc(sub||'')+'</div>'+(al?'<button class="k-btn k-primary">'+Kit.esc(al)+'</button>':'')+'</div>';if(al){var b=host.querySelector('button');if(b&&af)b.onclick=af}};

<script>
/* W6 compat: normalize action-handler conventions across kit implementations.
   The contract we coded against: nav actions support {label,primary,onClick},
   modal actions support {label,primary,onClick(close)}. If the loaded kit uses
   a different convention (href links / fn), adapt it here — never break apps. */
(function(){
var K=window.Kit;if(!K||K.__w6compat)return;K.__w6compat=true;
try{
if(typeof K.nav==='function'&&K.nav.toString().indexOf('onClick')<0){
var _nav=K.nav;
K.nav=function(o){o=o||{};var bar=_nav(o);var links=bar.querySelectorAll('.k-nav-actions a');
(o.actions||[]).forEach(function(d,i){var a=links[i];if(!a)return;
if(d.primary)a.classList.add('k-primary');
a.addEventListener('click',function(e){e.preventDefault();if(typeof d.onClick==='function')d.onClick();});});
return bar;};}
if(typeof K.modal==='function'&&K.modal.toString().indexOf('onClick')<0){

K.modal=function(o){o=o||{};(o.actions||[]).forEach(function(a){

return _modal(o);};}
}catch(e){/* compat must never break the app */}
})();

<body>
<style>body{padding-top:104px}/* qa-c: clear fixed .k-nav header */
:root{--bg:#f3f4f6;--panel:#e8eaee;--panel2:#ffffff;--ink:#2b3340;--muted:#8b93a3;--line:#dde1e8;--accent:#475569;--accent2:#0d9488;--good:#15803d;--warn:#b45309;--bad:#b91c1c}

<script>
(function(){
const K=window.Kit;
K.nav({title:'After-Loss OS',sub:'Accounts, benefits, property, and paperwork — handled in order.'});
function formModal(title,formHTML,onSave){
  K.modal({title:title,body:formHTML,actions:[{label:'Cancel'}]});
  var boxes=document.querySelectorAll('.k-modal');var box=boxes[boxes.length-1];
  box.querySelector('[data-save]').onclick=function(){onSave(box);};
  return box;
}
function closeModalBox(box){var ov=box.parentElement;if(ov)ov.remove();}
function shareFamily(){
  const critLeft=TASKS.filter((t,i)=>t.crit&&!done.includes('t'+i)).length;
  K.copy('After-Loss OS — Estate of Eleanor Zhang: '+done.length+' of '+TASKS.length+' checklist steps done, '+critLeft+' critical steps still open, '+DOCS.filter(d=>docStatus(d)==='have').length+' of '+DOCS.length+' documents in the vault. One step at a time.');
  K.toast('Progress summary copied — send it to family','ok');
}
function addDoc(){
  formModal('Add document',
   '<label class="k-lab">Document name</label><input class="k-input" id="ad-name" placeholder="e.g. Pension statement — CalPERS">'
   +'<label class="k-lab">Notes</label><input class="k-input" id="ad-meta" placeholder="Where is it? What is it for?">'
   +'<label class="k-lab">Status</label><select class="k-select" id="ad-st"><option value="need">Need</option><option value="ordered">Ordered</option><option value="partial">Partial</option><option value="have">Have</option></select>'
   +'<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="k-btn k-primary" data-save>Add to vault</button></div>',
   function(box){
    const n=box.querySelector('#ad-name').value.trim();if(!n){K.toast('Name the document','warn');return;}
    const d={n:n,st:box.querySelector('#ad-st').value,meta:box.querySelector('#ad-meta').value.trim()||'Added manually'};
    DOCS.push(d);const cds=store.get('docs',[]);cds.push(d);store.set('docs',cds);
    closeModalBox(box);
    drawKPIs();K.toast('Document added to vault','ok');
  });
}
const TASKS=[
{ph:0,t:'Order 12 certified copies of the death certificate',cat:'Documents',crit:1,why:'Banks, insurers, and agencies each want an original. Order once, avoid weeks of delay.'},
{ph:0,t:'Locate the will and trust documents',cat:'Documents',crit:1,why:'Everything else follows from these — executor, beneficiaries, property instructions.'},
{ph:0,t:'Secure the home: locks, mail, valuables',cat:'Property',crit:1,why:'Forward mail, collect keys, photograph valuables. Vacant homes attract attention.'},
{ph:0,t:'Notify Social Security (call 1-800-772-1213)',cat:'Benefits',crit:1,why:'Stops payments and triggers the $255 lump-sum death benefit. Report promptly to avoid overpayment clawbacks.'},
{ph:0,t:'Arrange notifications: employer, close family, friends',cat:'Notifications',crit:0,why:'One call tree now prevents painful repeat conversations later.'},
{ph:0,t:'Pause subscriptions & autopays you control',cat:'Accounts',crit:0,why:'Streaming, memberships, and non-essential autopays — keep utilities and insurance running.'},
{ph:0,t:'Meet with the estate attorney',cat:'Documents',crit:1,why:'Confirm executor authority and whether probate is required in California.'},
{ph:0,t:'Get an EIN for the estate from IRS.gov',cat:'Accounts',crit:0,why:'Free, 10 minutes online. Needed to open the estate bank account.'},
{ph:1,t:'Open an estate bank account',cat:'Accounts',crit:1,why:'All estate money flows through here — never mix with personal accounts.'},
{ph:1,t:'File life insurance claims',cat:'Benefits',crit:1,why:'2 policies found: $250k term + $50k whole life. Each needs a certified death certificate.'},
{ph:1,t:'Notify banks & retitle joint accounts',cat:'Accounts',crit:1,why:'Joint accounts pass to the survivor; solely-owned accounts freeze pending probate.'},
{ph:1,t:'File for pension / 401(k) survivor benefits',cat:'Benefits',crit:0,why:'Contact each plan administrator — spousal rollover rules differ by plan.'},
{ph:1,t:'Notify credit bureaus & request credit freeze',cat:'Accounts',crit:0,why:'Prevents identity theft using the deceased\u2019s SSN. Notify all three bureaus.'},
{ph:1,t:'Inventory safe-deposit box with a witness',cat:'Property',crit:0,why:'CA requires an inventory before removal. Bring the will and ID.'},
{ph:1,t:'Redirect pensions, dividends, rental income to estate account',cat:'Accounts',crit:0,why:'Keeps income flowing while title transfers process.'},
{ph:1,t:'Cancel driver\u2019s license & voter registration',cat:'Notifications',crit:0,why:'DMV and county registrar — also blocks fraudulent ID use.'},
{ph:2,t:'Transfer the house deed / retitle property',cat:'Property',crit:1,why:'Per the trust, the home passes to the children. Record the affidavit of survivorship with the county.'},
{ph:2,t:'Sell or transfer vehicles (DMV REG 5)',cat:'Property',crit:0,why:'CA DMV transfer-without-probate form for vehicles under the threshold.'},
{ph:2,t:'File final income tax return (IRS 1040)',cat:'Accounts',crit:1,why:'Due April 15 of next year. Mark "DECEASED" across the top with date of death.'},
{ph:2,t:'Close or consolidate remaining accounts',cat:'Accounts',crit:0,why:'Only after all automatic deposits and debits have moved.'},
{ph:2,t:'Distribute personal effects per the will',cat:'Property',crit:0,why:'Photograph everything first; get signed receipts for items of value.'},
{ph:2,t:'Keep estate records 7 years, then close the EIN',cat:'Documents',crit:0,why:'The IRS can audit the final return. Then close the estate account and EIN.'},
{ph:2,t:'Write the thank-you notes you\u2019ll be glad you wrote',cat:'Notifications',crit:0,why:'No deadline. But future-you will be grateful.'}];
const PHASES=[{n:'Days 0–14',s:'First steps',d:'Secure, notify, and locate the core documents.'},{n:'Days 15–45',s:'Claims & accounts',d:'Money movement: insurance, banks, benefits.'},{n:'Days 46–90',s:'Property & closeout',d:'Deeds, taxes, and the final distributions.'}];
const DOCS=[
{n:'Death certificate (certified ×12)',st:'ordered',meta:'Ordered Oct 1 · arrives ~Oct 10'},
{n:'Last will & testament',st:'have',meta:'Original in safe-deposit box · copy in vault'},
{n:'Revocable living trust',st:'have',meta:'Executed 2019 · attorney holds original'},
{n:'Life insurance — $250k term policy',st:'have',meta:'Policy #LT-88412 · claim filed Oct 2'},
{n:'Life insurance — $50k whole life',st:'need',meta:'Policy number unknown — check desk drawer / email'},
{n:'House deed — 456 Oak Ave',st:'have',meta:'County recorder copy in vault'},
{n:'Vehicle titles (2)',st:'need',meta:'Not in files — check glove boxes'},
{n:'Bank & brokerage statements',st:'partial',meta:'Chase + Schwab located · Wells Fargo missing'},
{n:'Marriage certificate',st:'have',meta:'Needed for survivor benefits'}];
const store=K.store('afterloss60');let done=store.get('done',['t0','t1','t4']);
let docSt=store.get('docst',{});
store.get('docs',[]).forEach(cd=>{if(!DOCS.find(d=>d.n===cd.n))DOCS.push(cd);});
function docStatus(d){return docSt[d.n]||d.st;}
const kh=document.getElementById('kpis');
function drawKPIs(){
kh.innerHTML='';
K.kpi(kh.appendChild(document.createElement('div')),{label:'Checklist',value:done.length+' / '+TASKS.length});
K.kpi(kh.appendChild(document.createElement('div')),{label:'Critical steps left',value:String(TASKS.filter((t,i)=>t.crit&&!done.includes('t'+i)).length),delta:'do these first'});
K.kpi(kh.appendChild(document.createElement('div')),{label:'Documents',value:DOCS.filter(d=>docStatus(d)==='have').length+' / '+DOCS.length,delta:'in vault — tap to update'});
K.kpi(kh.appendChild(document.createElement('div')),{label:'Benefits identified',value:'$300k+',delta:'2 life policies + pension'});
document.getElementById('ov-label').textContent=done.length+' of '+TASKS.length+' complete';
document.getElementById('ov-fill').style.width=(done.length/TASKS.length*100)+'%';
renderUpNext();
}
function nextTask(){const undone=TASKS.map((t,i)=>({t:t,i:i})).filter(x=>done.indexOf('t'+x.i)<0);return undone.find(x=>x.t.crit)||undone[0]||null;}
function renderUpNext(){
  const box=document.getElementById('upnext');const nx=nextTask();
  if(!nx){box.innerHTML='<div class="k-card" style="border-left:5px solid var(--good)"><b>Every step is complete.</b><div class="k-muted" style="font-size:13px">Take a breath — you did right by her.</div></div>';return;}
  box.innerHTML='<div class="k-card" style="border-left:5px solid var(--warn);display:flex;gap:14px;align-items:center;flex-wrap:wrap">'
   +'<div style="font-size:28px">👉</div><div style="flex:1;min-width:220px">'
   +'<div class="k-muted" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">Up next'+(nx.t.crit?' · do first':'')+'</div>'
   +'<div style="font-weight:800;font-size:17px;margin:4px 0">'+K.esc(nx.t.t)+'</div>'
   +'<div class="k-muted" style="font-size:13px">'+K.esc(nx.t.why)+'</div></div>'
   +'<button class="k-btn k-primary" id="un-done">Mark done</button></div>';
  box.querySelector('#un-done').onclick=()=>{done.push('t'+nx.i);store.set('done',done);drawKPIs();K.toast('Done. One less thing to carry.','ok');};
}
const stB={have:'ok',ordered:'info',partial:'warn',need:'bad'};
function taskEl(t,i){
const id='t'+i,isDone=done.includes(id);
const elc=K.el(`<div class="task ${isDone?'done':''} ${t.crit&&!isDone?'critical':''}"><input type="checkbox" ${isDone?'checked':''}><div style="flex:1"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="t-name" style="font-weight:700">${K.esc(t.t)}</span>${t.crit&&!isDone?K.badge('DO FIRST','warn'):''}</div><div style="margin-top:4px">${K.badge(t.cat,'info')}</div><div class="k-muted" style="font-size:13px;margin-top:4px">${K.esc(t.why)}</div></div></div>`);
elc.querySelector('input').onchange=e=>{const ix=done.indexOf(id);if(e.target.checked&&ix<0)done.push(id);if(!e.target.checked&&ix>=0)done.splice(ix,1);store.set('done',done);drawKPIs();elc.classList.toggle('done',e.target.checked);if(done.length===TASKS.length)K.toast('Every step complete. Take a breath — you did right by her.','ok')};
return elc;
}
function renderPhase(host,ph){
host.innerHTML='';
const P=PHASES[ph];const list=TASKS.map((t,i)=>({...t,i})).filter(t=>t.ph===ph);
const pdone=list.filter(t=>done.includes('t'+t.i)).length;
host.appendChild(K.el(`<div class="k-card" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div><b style="font-size:18px">${P.n} — ${P.s}</b><div class="k-muted">${P.d}</div></div><b>${pdone}/${list.length}</b></div><div class="prog"><div style="width:${pdone/list.length*100}%"></div></div></div>`));
list.forEach(t=>host.appendChild(taskEl(t.t,t.i)));
}
function renderDocs(host){
host.innerHTML='<div class="k-muted" style="font-size:13px;margin-bottom:12px">Every document the checklist needs, with its status. Missing items block their checklist step.</div>';
DOCS.forEach(d=>{
const s=docStatus(d);
const elc=K.el(`<div class="doc" style="cursor:pointer" title="Tap to update status"><div style="font-size:26px">${s==='have'?'📄':s==='need'?'❓':'📑'}</div><div style="flex:1"><div style="font-weight:700">${K.esc(d.n)}</div><div class="k-muted" style="font-size:13px">${K.esc(d.meta)}</div></div>${K.badge(s.toUpperCase(),stB[s])}</div>`);
elc.onclick=()=>{const order=['have','ordered','partial','need'];docSt[d.n]=order[(order.indexOf(s)+1)%order.length];store.set('docst',docSt);renderDocs(host);drawKPIs();K.toast(d.n+': '+docSt[d.n].toUpperCase(),'ok');};
host.appendChild(elc)});
}
function renderContacts(host){
host.innerHTML='';
K.table(host,[{key:'who',label:'Contact'},{key:'role',label:'Role'},{key:'n',label:'Number'}],
[{who:'Estate attorney — Priya Nair',role:'Probate & trust',n:'(650) 555-0142'},{who:'CPA — Robert Chen',role:'Final tax return',n:'(650) 555-0188'},{who:'Social Security',role:'Benefits',n:'1-800-772-1213'},{who:'Chase estate services',role:'Bank accounts',n:'1-800-555-0391'},{who:'County recorder — San Mateo',role:'Deed transfer',n:'(650) 555-0120'}],{pageSize:8});
}
document.getElementById('al-add-doc').onclick=addDoc;
document.getElementById('al-share').onclick=shareFamily;
K.tabs(document.getElementById('tabs'),[
{id:'p0',label:'Days 0–14',render:h=>renderPhase(h,0)},
{id:'p1',label:'Days 15–45',render:h=>renderPhase(h,1)},
{id:'p2',label:'Days 46–90',render:h=>renderPhase(h,2)},
{id:'docs',label:'📁 Document vault',render:renderDocs},
{id:'contacts',label:'📞 Key contacts',render:renderContacts}]);
drawKPIs();
})();
</script>
