<script>
/* Kit fallback JS — minimal stand-ins for the shared/kit.js contract.
   Only installed if window.Kit is absent (or lacks rng). */
(function(){
if(window.Kit && window.Kit.rng) return;
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return (h^=h>>>16)>>>0;};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=s=>mulberry32(xmur3(String(s))());
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const int=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const shuffle=(r,a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
let _uid=0; const uid=p=>(p||'id')+'-'+(++_uid)+'-'+Math.floor(Math.random()*46656).toString(36);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function H(host,html){ if(!host) return html; const el=typeof host==='string'?document.querySelector(host):host; if(el) el.innerHTML=html; return html; }
function store(ns){const k='unsolvedlab.'+ns;function read(){try{const v=localStorage.getItem(k);return v==null?undefined:JSON.parse(v);}catch(e){return undefined;}}
  return{get:function(d){const v=read();return v===undefined?(d===undefined?{}:d):v;},set:function(v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del:function(){try{localStorage.removeItem(k);}catch(e){}}};}
function nav(o){o=o||{};const acts=(o.actions||[]).map(a=>'<button class="k-btn'+(a.primary?' k-primary':'')+'" data-act="'+esc(a.id||'')+'">'+esc(a.label||'')+'</button>').join('');
  const html='<div class="k-head"><div><h1>'+esc(o.title||'')+'</h1>'+(o.sub?'<div class="sub">'+esc(o.sub)+'</div>':'')+'</div><div style="display:flex;gap:8px;flex-wrap:wrap">'+acts+'</div></div>';
  if(o.host) H(o.host,html); return html;}
function toast(msg,kind){let t=document.querySelector('.k-toast');if(!t){t=document.createElement('div');t.className='k-toast';document.body.appendChild(t);}
  t.textContent=msg;t.className='k-toast show '+(kind||'');clearTimeout(t._h);t._h=setTimeout(()=>{t.className='k-toast';},2600);}
function modal(o){const veil=document.createElement('div');veil.className='k-modal-veil';
  const acts=(o.actions||[]).map((a,i)=>'<button class="k-btn'+(a.primary?' k-primary':'')+'" data-ma="'+i+'">'+esc(a.label)+'</button>').join('');
  veil.innerHTML='<div class="k-modal"><h3>'+esc(o.title||'')+'</h3><div>'+(o.body||'')+'</div><div class="k-modal-actions">'+acts+'</div></div>';
  const close=()=>{veil.remove();document.removeEventListener('keydown',onkey);};
  const onkey=e=>{if(e.key==='Escape')close();};document.addEventListener('keydown',onkey);
  veil.addEventListener('click',e=>{if(e.target===veil)close();const b=e.target.closest('[data-ma]');if(b){const a=(o.actions||[])[+b.dataset.ma];if(a&&a.fn)a.fn(close);else close();}});
  document.body.appendChild(veil);return close;}
function tabs(host,tablist){const el=typeof host==='string'?document.querySelector(host):host;if(!el)return;
  let cur=tablist[0]&&tablist[0].id;
  function draw(){el.innerHTML='<div class="k-tabs">'+tablist.map(t=>'<button class="k-tab'+(t.id===cur?' active':'')+'" data-tab="'+esc(t.id)+'">'+esc(t.label)+'</button>').join('')+'</div><div class="k-tab-body"></div>';
    const body=el.querySelector('.k-tab-body');const t=tablist.find(x=>x.id===cur);if(t&&t.render)t.render(body);
    el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{cur=b.dataset.tab;draw();});}
  draw();}
function table(host,cols,rows,opts){opts=opts||{};const el=typeof host==='string'?document.querySelector(host):host;
  let q='',page=0,sortK=null,sortD=1;const ps=opts.pageSize||10;
  function filtered(){let r=rows;if(q){const l=q.toLowerCase();r=r.filter(row=>cols.some(c=>String(row[c.key]??'').toLowerCase().includes(l)));}
    if(sortK){const c=cols.find(x=>x.key===sortK);r=r.slice().sort((a,b)=>{const va=a[sortK],vb=b[sortK];const n=(c&&c.num);let d=n?(+va-+vb):String(va).localeCompare(String(vb));return d*sortD;});}return r;}
  function cell(c,row){let v=row[c.key];if(c.fmt)v=c.fmt(v,row);return '<td'+(c.num?' style="text-align:right;font-variant-numeric:tabular-nums"':'')+'>'+(v==null?'':v)+'</td>';}
  function draw(){if(!el)return;const fr=filtered();const pages=Math.max(1,Math.ceil(fr.length/ps));page=Math.min(page,pages-1);
    const slice=fr.slice(page*ps,page*ps+ps);
    let html='';if(opts.search!==false)html+='<div style="margin-bottom:10px;max-width:320px"><input class="k-input k-search" placeholder="Search…" value="'+esc(q)+'"></div>';
    html+='<div style="overflow-x:auto"><table class="k-table"><thead><tr>'+cols.map(c=>'<th data-sk="'+esc(c.key)+'" style="'+(c.num?'text-align:right':'')+'">'+esc(c.label)+(sortK===c.key?(sortD>0?' ▲':' ▼'):'')+'</th>').join('')+'</tr></thead><tbody>';
    html+=slice.length?slice.map(r=>'<tr>'+cols.map(c=>cell(c,r)).join('')+'</tr>').join(''):'<tr><td colspan="'+cols.length+'" style="text-align:center;color:var(--muted);padding:24px">No rows</td></tr>';
    html+='</tbody></table></div>';
    if(pages>1)html+='<div style="display:flex;gap:8px;align-items:center;margin-top:10px"><button class="k-btn" data-pg="-1">‹ Prev</button><span class="k-muted" style="font-size:13px">Page '+(page+1)+' of '+pages+'</span><button class="k-btn" data-pg="1">Next ›</button></div>';
    el.innerHTML=html;
    const si=el.querySelector('.k-search');if(si){si.oninput=()=>{q=si.value;page=0;draw();const n=el.querySelector('.k-search');n.focus();n.setSelectionRange(n.value.length,n.value.length);};}
    el.querySelectorAll('th[data-sk]').forEach(th=>th.onclick=()=>{const k=th.dataset.sk;if(sortK===k)sortD*=-1;else{sortK=k;sortD=1;}draw();});
    el.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{page+=+b.dataset.pg;draw();});}
  draw();}
function bars(host,items){const max=Math.max.apply(null,[1].concat(items.map(i=>i.value)));
  const html=items.map(i=>'<div class="k-bar-row"><span class="k-muted">'+esc(i.label)+'</span><div class="k-bar-track"><div class="k-bar-fill" style="width:'+Math.round(100*i.value/max)+'%;'+(i.color?'background:'+esc(i.color):'')+'"></div></div><strong>'+esc(String(i.disp!=null?i.disp:i.value))+'</strong></div>').join('');
  return H(host,html);}
function line(host,series){const W=640,Hh=240,pad=34;let all=[];series.forEach(s=>s.points.forEach(p=>all.push(p)));
  const mn=Math.min.apply(null,all.concat([0])),mx=Math.max.apply(null,all.concat([1]));
  const X=i=>pad+i*(W-2*pad)/Math.max(1,series[0].points.length-1),Y=v=>Hh-pad-(v-mn)*(Hh-2*pad)/((mx-mn)||1);
  const colors=['#2456e0','#0ea5a5','#c93a3a','#b97f0f','#7c3aed','#1c8a4c'];
  let svg='<svg viewBox="0 0 '+W+' '+Hh+'" style="width:100%;height:auto;display:block" role="img">';
  for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4;svg+='<line x1="'+pad+'" y1="'+Y(v)+'" x2="'+(W-pad)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="4" y="'+(Y(v)+4)+'" font-size="10" fill="var(--muted)">'+esc(String(Math.round(v*100)/100))+'</text>';}
  series.forEach((s,si)=>{const c=s.color||colors[si%colors.length];const pts=s.points.map((p,i)=>X(i).toFixed(1)+','+Y(p).toFixed(1)).join(' ');
    svg+='<polyline points="'+pts+'" fill="none" stroke="'+esc(c)+'" stroke-width="2.5" stroke-linejoin="round"/>';
    s.points.forEach((p,i)=>{svg+='<circle cx="'+X(i)+'" cy="'+Y(p)+'" r="3.5" fill="'+esc(c)+'"><title>'+esc(s.name+': '+p)+'</title></circle>';});});
  svg+='</svg><div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:6px">'+series.map((s,si)=>'<span style="font-size:12px"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:'+esc(s.color||colors[si%colors.length])+';margin-right:5px"></span>'+esc(s.name)+'</span>').join('')+'</div>';
  return H(host,svg);}
function donut(host,items){const tot=items.reduce((a,i)=>a+i.value,0)||1;const colors=['#2456e0','#0ea5a5','#c93a3a','#b97f0f','#7c3aed','#1c8a4c','#5b6b7c'];
  let a0=-Math.PI/2;const R=80,r=52,cx=100,cy=100;let svg='<svg viewBox="0 0 200 200" style="width:200px;height:200px" role="img">';
  items.forEach((it,i)=>{const frac=it.value/tot,a1=a0+frac*2*Math.PI;const big=frac>0.5?1:0;
    const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    const xi1=cx+r*Math.cos(a1),yi1=cy+r*Math.sin(a1),xi0=cx+r*Math.cos(a0),yi0=cy+r*Math.sin(a0);
    const c=it.color||colors[i%colors.length];
    if(frac>0)svg+='<path d="M'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+R+' '+R+' 0 '+big+' 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+' L'+xi1.toFixed(1)+' '+yi1.toFixed(1)+' A'+r+' '+r+' 0 '+big+' 0 '+xi0.toFixed(1)+' '+yi0.toFixed(1)+' Z" fill="'+esc(c)+'"><title>'+esc(it.label+': '+it.value)+'</title></path>';
    a0=a1;});
  svg+='<text x="100" y="96" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)">'+esc(String(items._total!=null?items._total:tot))+'</text><text x="100" y="116" text-anchor="middle" font-size="11" fill="var(--muted)">total</text></svg>';
  const legend='<div style="display:grid;gap:6px;margin-top:4px">'+items.map((it,i)=>'<div style="display:flex;gap:8px;align-items:center;font-size:13px"><span style="width:11px;height:11px;border-radius:3px;background:'+esc(it.color||colors[i%colors.length])+'"></span><span class="k-muted">'+esc(it.label)+'</span><strong style="margin-left:auto">'+esc(String(it.disp!=null?it.disp:it.value))+'</strong></div>').join('')+'</div>';
  return H(host,'<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">'+svg+legend+'</div>');}
function timeline(host,events){const html='<div class="k-tl">'+events.map(e=>'<div class="k-tl-ev '+(e.kind||'')+'"><div class="k-tl-t">'+esc(e.t||'')+'</div><div style="font-weight:700">'+esc(e.title||'')+'</div>'+(e.body?'<div class="k-muted" style="font-size:13px">'+esc(e.body)+'</div>':'')+'</div>').join('')+'</div>';return H(host,html);}
function graph(host,g){const nodes=g.nodes||[],edges=g.edges||[];
  const incoming={};nodes.forEach(n=>incoming[n.id]=0);edges.forEach(e=>{if(incoming[e.b]!=null)incoming[e.b]++;});
  const depth={},queue=[];nodes.forEach(n=>{if(!incoming[n.id]){depth[n.id]=0;queue.push(n.id);}});
  const adj={};edges.forEach(e=>{(adj[e.a]=adj[e.a]||[]).push(e.b);});
  while(queue.length){const id=queue.shift();(adj[id]||[]).forEach(b=>{const nd=(depth[id]||0)+1;if(depth[b]==null||nd>depth[b])depth[b]=nd;incoming[b]--;if(incoming[b]<=0)queue.push(b);});}
  nodes.forEach(n=>{if(depth[n.id]==null)depth[n.id]=0;});
  const layers={};nodes.forEach(n=>{const d=depth[n.id];(layers[d]=layers[d]||[]).push(n);});
  const maxD=Math.max.apply(null,Object.keys(layers).map(Number).concat([0]));
  const maxL=Math.max.apply(null,Object.values(layers).map(l=>l.length).concat([1]));
  const W=Math.max(560,(maxD+1)*230),Hh=Math.max(280,maxL*96+60);
  const pos={};Object.keys(layers).forEach(d=>{layers[d].forEach((n,i)=>{pos[n.id]={x:+d*230+115,y:i*96+70};});});
  let svg='<svg viewBox="0 0 '+W+' '+Hh+'" style="width:100%;height:auto;display:block" role="img"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="var(--muted)" stroke-width="1.5"/></marker></defs>';
  edges.forEach(e=>{const a=pos[e.a],b=pos[e.b];if(!a||!b)return;
    svg+='<line x1="'+(a.x+62)+'" y1="'+a.y+'" x2="'+(b.x-66)+'" y2="'+b.y+'" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>';
    if(e.label)svg+='<text x="'+((a.x+b.x)/2)+'" y="'+((a.y+b.y)/2-6)+'" font-size="10" fill="var(--muted)" text-anchor="middle">'+esc(e.label)+'</text>';});
  nodes.forEach(n=>{const p=pos[n.id];const c=n.color||'#2456e0';
    svg+='<g data-node="'+esc(n.id)+'" style="cursor:pointer"><rect x="'+(p.x-62)+'" y="'+(p.y-30)+'" width="124" height="60" rx="10" fill="var(--panel)" stroke="'+esc(c)+'" stroke-width="2"/>'+
    '<text x="'+p.x+'" y="'+(p.y-4)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">'+esc(n.label)+'</text>'+
    (n.sub?'<text x="'+p.x+'" y="'+(p.y+14)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+esc(n.sub)+'</text>':'')+'</g>';});
  svg+='</svg>';return H(host,svg);}
function badge(txt,kind){return '<span class="k-badge '+(kind||'')+'">'+esc(txt)+'</span>';}
function kpi(host,o){const d=o.delta!=null?'<div class="k-kpi-d" style="color:'+(String(o.delta).charAt(0)==='-'?'var(--bad)':'var(--good)')+'">'+esc(o.delta)+'</div>':'';
  const html='<div class="k-kpi"><div class="k-kpi-l">'+esc(o.label||'')+'</div><div class="k-kpi-v">'+esc(o.value||'')+'</div>'+d+'</div>';return H(host,html);}
function empty(host,title,sub,actionLabel,actionFn){const id=uid('e');
  const html='<div class="k-empty"><h3>'+esc(title||'Nothing here yet')+'</h3><p>'+esc(sub||'')+'</p>'+(actionLabel?'<button class="k-btn k-primary" id="'+id+'">'+esc(actionLabel)+'</button>':'')+'</div>';
  if(host){H(host,html);const b=document.getElementById(id);if(b&&actionFn)b.onclick=actionFn;}return html;}
function money(n){const v=Number(n)||0;return '$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function num(n){return (Number(n)||0).toLocaleString('en-US');}
function pct(x){return (Math.round(Number(x)*1000)/10)+'%';}
function when(d){try{const dt=d instanceof Date?d:new Date(d);if(isNaN(dt))return esc(String(d));
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){return esc(String(d));}}
function initials(name){return String(name||'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');}
function copy(txt){const done=()=>toast('Copied to clipboard','ok');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fallback());}else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('Copy failed','bad');}ta.remove();}}
window.Kit={rng:rng,pick:pick,int:int,shuffle:shuffle,uid:uid,esc:esc,el:function(h){const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;},store:store,nav:nav,toast:toast,modal:modal,tabs:tabs,table:table,bars:bars,line:line,donut:donut,timeline:timeline,graph:graph,badge:badge,kpi:kpi,empty:empty,money:money,num:num,pct:pct,when:when,initials:initials,copy:copy,_fallback:true};
})();

 {id:'t5',agency:'TransUnion',title:'Place security freeze + fraud alert (TransUnion)',why:'Completes the bureau trifecta — no gaps.',time:'10 min',sev:'bad'},
 {id:'t6',agency:'IRS',title:'Request an Identity Protection PIN (IRS)',why:'Stops anyone filing a tax return in your name next season.',time:'25 min',sev:'warn'},
 {id:'t7',agency:'DMV',title:'Replace driver\u2019s license + flag record (CA DMV)',why:'Prevents license-based identity fraud and synthetic IDs.',time:'30 min',sev:'warn'},
 {id:'t8',agency:'SSA',title:'Create my Social Security account + review earnings',why:'Locks your SSN record and reveals misuse.',time:'15 min',sev:'info'},
 {id:'t9',agency:'Banks',title:'Dispute the 3 fraudulent card charges',why:'$1,284.17 in charges you did not make — 60-day dispute window.',time:'20 min',sev:'bad'},
 {id:'t10',agency:'ChexSystems',title:'Freeze ChexSystems (bank-account bureau)',why:'Stops thieves opening bank accounts in your name.',time:'10 min',sev:'info'},
];
let done=st.get('done',{});
function save(){st.set('done',done);}
function score(){const d=Object.keys(done).filter(k=>done[k]).length;return Math.round(100*d/TASKS.length);}
function renderScore(){const s=score(),n=Object.keys(done).filter(k=>done[k]).length;
 document.getElementById('score-bar').style.width=s+'%';
 document.getElementById('score-txt').textContent=s+'%';
 document.getElementById('score-sub').textContent=n+' of '+TASKS.length+' steps complete — '+(s===100?'case ready to close 🎉':nextUp());}
function nextUp(){const t=TASKS.find(t=>!done[t.id]);return t?('next: '+t.title):'done';}
const navbar=K.nav({title:'\u{1F6E1} Shieldline Recovery',sub:'ID Recovery OS · your personalized recovery workflow',actions:[{label:'Export case file',href:'#export'}]});
navbar.querySelector('.k-nav-actions .k-btn').addEventListener('click',e=>{e.preventDefault();const lines=TASKS.map(t=>(done[t.id]?'[x] ':'[ ] ')+t.agency+' — '+t.title);
 K.modal({title:'Case file — #ID-2026-8841',body:'<textarea class="k-input" style="min-height:220px" readonly>'+K.esc(lines.join('\n')+'\n\nRecovery score: '+score()+'%')+'</textarea>',actions:[{label:'Copy',primary:true,fn:()=>{K.copy(lines.join('\n'));}},{label:'Close'}]});});
const fraudBlocked=K.int(r,3,7);
const REPORT_N=K.int(r,100000,999999), SSN4=K.int(r,1000,9999); /* pinned: official case numbers must not change between regenerations */
const kh=document.getElementById('kpis');kh.innerHTML='';
K.kpi(kh,{label:'Recovery score',value:score()+'%',delta:'live'});
K.kpi(kh,{label:'Steps complete',value:Object.keys(done).filter(k=>done[k]).length+' / '+TASKS.length});
K.kpi(kh,{label:'Days since incident',value:'5'});
K.kpi(kh,{label:'Fraud attempts blocked',value:String(fraudBlocked),delta:'+'+fraudBlocked+' this week'});
function taskHtml(t,i){const d=done[t.id];
 return '<label class="k-check'+(d?' done':'')+'"><input type="checkbox" data-task="'+t.id+'" id="demo-check-'+i+'" '+(d?'checked':'')+'><span class="step-n" style="'+(d?'background:var(--good);border-color:var(--good);color:#0e1830':'')+'">'+(d?'✓':(i+1))+'</span><span><span class="k-check-t" style="font-weight:700">'+K.esc(t.title)+'</span><br><span class="k-muted" style="font-size:13px">'+K.esc(t.why)+'</span><br>'+K.badge(t.agency,'info')+' <span class="k-muted" style="font-size:12px">⏱ '+t.time+'</span> '+K.badge(t.sev==='bad'?'urgent':'recommended',t.sev)+'</span></label>';}
function renderPlan(host){const groups={};TASKS.forEach(t=>{(groups[t.agency]=groups[t.agency]||[]).push(t);});
 host.innerHTML=Object.keys(groups).map(g=>'<h3 style="margin:18px 0 6px">'+K.esc(g)+'</h3>'+groups[g].map(t=>taskHtml(t,TASKS.indexOf(t))).join('')).join('');
 host.querySelectorAll('[data-task]').forEach(cb=>cb.onchange=()=>{const id=cb.dataset.task;done[id]=cb.checked;if(!cb.checked)delete done[id];save();renderScore();updateKpis();renderPlan(host);K.toast(cb.checked?'Step complete — score updated':'Step reopened',cb.checked?'ok':'warn');});}
function updateKpis(){const vs=document.querySelectorAll('#kpis .k-kpi-value');const n=Object.keys(done).filter(k=>done[k]).length;if(vs[0])vs[0].textContent=score()+'%';if(vs[1])vs[1].textContent=n+' / '+TASKS.length;}
const EVENTS=[
 {t:'Sep 28 · 6:42 PM',title:'Wallet stolen — SFO Terminal 2',body:'Reported to airport police on the spot. Case opened in Shieldline.',kind:'bad'},
 {t:'Sep 29 · 9:15 AM',title:'First fraud alert fired',body:'$412.90 charge at an electronics store in Daly City — card frozen.',kind:'warn'},
 {t:'Sep 30',title:'Credit monitoring armed',body:'All three bureaus now watched daily for new inquiries.',kind:'info'},
 {t:'Oct 1',title:'FTC Identity Theft Report filed',body:'Report #'+REPORT_N+' generated — dispute letters unlocked.',kind:'ok'},
 {t:'Oct 3 · today',title:'2 more fraud attempts blocked',body:'Freeze requests in progress are already stopping new-account fraud.',kind:'ok'},
];
const AGENCIES=[
 {agency:'FTC (IdentityTheft.gov)',contact:'IdentityTheft.gov · 1-877-438-4338',status:done.t1?'Filed':'Not started',sk:done.t1?'ok':'bad'},
 {agency:'Equifax',contact:'1-800-685-1111 · equifax.com',status:done.t3?'Frozen':'Not started',sk:done.t3?'ok':'bad'},
 {agency:'Experian',contact:'1-888-397-3742 · experian.com',status:done.t4?'Frozen':'Not started',sk:done.t4?'ok':'bad'},
 {agency:'TransUnion',contact:'1-888-909-8872 · transunion.com',status:done.t5?'Frozen':'Not started',sk:done.t5?'ok':'bad'},
 {agency:'IRS',contact:'irs.gov/identity-protection · IP PIN',status:done.t6?'PIN issued':'Not started',sk:done.t6?'ok':'warn'},
 {agency:'CA DMV',contact:'dmv.ca.gov · appointment',status:done.t7?'Replaced':'Not started',sk:done.t7?'ok':'warn'},
 {agency:'Social Security',contact:'ssa.gov/myaccount',status:done.t8?'Secured':'Not started',sk:done.t8?'ok':'info'},
];
function renderAgencies(host){K.table(host,[{key:'agency',label:'Agency'},{key:'contact',label:'Contact'},{key:'status',label:'Status',fmt:v=>K.badge(v,v==='Filed'||v==='Frozen'||v==='PIN issued'||v==='Replaced'||v==='Secured'?'ok':(v==='Not started'?'bad':'warn'))}],AGENCIES,{search:true,pageSize:10});}
function letterHtml(){return 'VIA CERTIFIED MAIL\n\nEquifax Information Services LLC\nP.O. Box 740256, Atlanta, GA 30374\n\nRe: Identity theft dispute — SSN ending '+SSN4+'\nFTC Identity Theft Report #'+REPORT_N+'\n\nTo whom it may concern:\n\nI am a victim of identity theft (police report filed Sep 28, 2026, SFO). Under the Fair Credit Reporting Act \u00a7 605B, I am requesting that you block the following fraudulent accounts and inquiries from my file:\n\n1. Fraudulent inquiry — Sep 29, 2026 — electronics retailer, Daly City CA\n2. Fraudulent inquiry — Oct 1, 2026 — online lender\n\nEnclosed: FTC Identity Theft Report, police report, copy of replacement ID.\n\nPlease confirm the block in writing within 30 days.\n\nSincerely,\nCase #ID-2026-8841';}
function renderLetters(host){host.innerHTML='<div class="k-card"><h3 style="margin-top:0">Bureau dispute letter</h3><p class="k-muted">Auto-filled from your case. Mail certified, return receipt requested — the paper trail matters.</p><textarea class="k-input" id="letter-txt" style="min-height:260px;font-family:monospace;font-size:12.5px" readonly>'+K.esc(letterHtml())+'</textarea><div style="margin-top:10px;display:flex;gap:8px"><button class="k-btn k-primary" id="copy-letter">Copy letter</button><button class="k-btn" id="regen">Regenerate with latest progress</button></div></div>';
 host.querySelector('#copy-letter').onclick=()=>K.copy(host.querySelector('#letter-txt').value);
 host.querySelector('#regen').onclick=()=>{host.querySelector('#letter-txt').value=letterHtml();K.toast('Letter regenerated','ok');};}
K.tabs('#main-tabs',[
 {id:'plan',label:'🗺 Recovery plan',render:renderPlan},
 {id:'timeline',label:'⏱ Timeline',render:h=>K.timeline(h,EVENTS)},
 {id:'agencies',label:'🏛 Agencies',render:renderAgencies},
 {id:'letters',label:'✉️ Letters',render:renderLetters},
]);
renderScore();
})();

</script>
