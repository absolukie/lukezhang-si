<script>
/* Kit fallback JS — minimal stand-ins for the shared/kit.js contract.
   Only installed if window.Kit is absent (or lacks rng). */
(function(){
if(window.Kit && window.Kit.rng) return;
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return (h^=h>>>16)>>>0;};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=s=>mulberry32(xmur3(String(s))());
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const int=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const shuffle=(r,a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
let _uid=0; const uid=p=>(p||'id')+'-'+(++_uid)+'-'+Math.floor(Math.random()*46656).toString(36);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function H(host,html){ if(!host) return html; const el=typeof host==='string'?document.querySelector(host):host; if(el) el.innerHTML=html; return html; }
function store(ns){const k='unsolvedlab.'+ns;function read(){try{const v=localStorage.getItem(k);return v==null?undefined:JSON.parse(v);}catch(e){return undefined;}}
  return{get:function(d){const v=read();return v===undefined?(d===undefined?{}:d):v;},set:function(v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del:function(){try{localStorage.removeItem(k);}catch(e){}}};}
function nav(o){o=o||{};const acts=(o.actions||[]).map(a=>'<button class="k-btn'+(a.primary?' k-primary':'')+'" data-act="'+esc(a.id||'')+'">'+esc(a.label||'')+'</button>').join('');
  const html='<div class="k-head"><div><h1>'+esc(o.title||'')+'</h1>'+(o.sub?'<div class="sub">'+esc(o.sub)+'</div>':'')+'</div><div style="display:flex;gap:8px;flex-wrap:wrap">'+acts+'</div></div>';
  if(o.host) H(o.host,html); return html;}
function toast(msg,kind){let t=document.querySelector('.k-toast');if(!t){t=document.createElement('div');t.className='k-toast';document.body.appendChild(t);}
  t.textContent=msg;t.className='k-toast show '+(kind||'');clearTimeout(t._h);t._h=setTimeout(()=>{t.className='k-toast';},2600);}
function modal(o){const veil=document.createElement('div');veil.className='k-modal-veil';
  const acts=(o.actions||[]).map((a,i)=>'<button class="k-btn'+(a.primary?' k-primary':'')+'" data-ma="'+i+'">'+esc(a.label)+'</button>').join('');
  veil.innerHTML='<div class="k-modal"><h3>'+esc(o.title||'')+'</h3><div>'+(o.body||'')+'</div><div class="k-modal-actions">'+acts+'</div></div>';
  const close=()=>{veil.remove();document.removeEventListener('keydown',onkey);};
  const onkey=e=>{if(e.key==='Escape')close();};document.addEventListener('keydown',onkey);
  veil.addEventListener('click',e=>{if(e.target===veil)close();const b=e.target.closest('[data-ma]');if(b){const a=(o.actions||[])[+b.dataset.ma];if(a&&a.fn)a.fn(close);else close();}});
  document.body.appendChild(veil);return close;}
function tabs(host,tablist){const el=typeof host==='string'?document.querySelector(host):host;if(!el)return;
  let cur=tablist[0]&&tablist[0].id;
  function draw(){el.innerHTML='<div class="k-tabs">'+tablist.map(t=>'<button class="k-tab'+(t.id===cur?' active':'')+'" data-tab="'+esc(t.id)+'">'+esc(t.label)+'</button>').join('')+'</div><div class="k-tab-body"></div>';
    const body=el.querySelector('.k-tab-body');const t=tablist.find(x=>x.id===cur);if(t&&t.render)t.render(body);
    el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{cur=b.dataset.tab;draw();});}
  draw();}
function table(host,cols,rows,opts){opts=opts||{};const el=typeof host==='string'?document.querySelector(host):host;
  let q='',page=0,sortK=null,sortD=1;const ps=opts.pageSize||10;
  function filtered(){let r=rows;if(q){const l=q.toLowerCase();r=r.filter(row=>cols.some(c=>String(row[c.key]??'').toLowerCase().includes(l)));}
    if(sortK){const c=cols.find(x=>x.key===sortK);r=r.slice().sort((a,b)=>{const va=a[sortK],vb=b[sortK];const n=(c&&c.num);let d=n?(+va-+vb):String(va).localeCompare(String(vb));return d*sortD;});}return r;}
  function cell(c,row){let v=row[c.key];if(c.fmt)v=c.fmt(v,row);return '<td'+(c.num?' style="text-align:right;font-variant-numeric:tabular-nums"':'')+'>'+(v==null?'':v)+'</td>';}
  function draw(){if(!el)return;const fr=filtered();const pages=Math.max(1,Math.ceil(fr.length/ps));page=Math.min(page,pages-1);
    const slice=fr.slice(page*ps,page*ps+ps);
    let html='';if(opts.search!==false)html+='<div style="margin-bottom:10px;max-width:320px"><input class="k-input k-search" placeholder="Search…" value="'+esc(q)+'"></div>';
    html+='<div style="overflow-x:auto"><table class="k-table"><thead><tr>'+cols.map(c=>'<th data-sk="'+esc(c.key)+'" style="'+(c.num?'text-align:right':'')+'">'+esc(c.label)+(sortK===c.key?(sortD>0?' ▲':' ▼'):'')+'</th>').join('')+'</tr></thead><tbody>';
    html+=slice.length?slice.map(r=>'<tr>'+cols.map(c=>cell(c,r)).join('')+'</tr>').join(''):'<tr><td colspan="'+cols.length+'" style="text-align:center;color:var(--muted);padding:24px">No rows</td></tr>';
    html+='</tbody></table></div>';
    if(pages>1)html+='<div style="display:flex;gap:8px;align-items:center;margin-top:10px"><button class="k-btn" data-pg="-1">‹ Prev</button><span class="k-muted" style="font-size:13px">Page '+(page+1)+' of '+pages+'</span><button class="k-btn" data-pg="1">Next ›</button></div>';
    el.innerHTML=html;
    const si=el.querySelector('.k-search');if(si){si.oninput=()=>{q=si.value;page=0;draw();const n=el.querySelector('.k-search');n.focus();n.setSelectionRange(n.value.length,n.value.length);};}
    el.querySelectorAll('th[data-sk]').forEach(th=>th.onclick=()=>{const k=th.dataset.sk;if(sortK===k)sortD*=-1;else{sortK=k;sortD=1;}draw();});
    el.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{page+=+b.dataset.pg;draw();});}
  draw();}
function bars(host,items){const max=Math.max.apply(null,[1].concat(items.map(i=>i.value)));
  const html=items.map(i=>'<div class="k-bar-row"><span class="k-muted">'+esc(i.label)+'</span><div class="k-bar-track"><div class="k-bar-fill" style="width:'+Math.round(100*i.value/max)+'%;'+(i.color?'background:'+esc(i.color):'')+'"></div></div><strong>'+esc(String(i.disp!=null?i.disp:i.value))+'</strong></div>').join('');
  return H(host,html);}
function line(host,series){const W=640,Hh=240,pad=34;let all=[];series.forEach(s=>s.points.forEach(p=>all.push(p)));
  const mn=Math.min.apply(null,all.concat([0])),mx=Math.max.apply(null,all.concat([1]));
  const X=i=>pad+i*(W-2*pad)/Math.max(1,series[0].points.length-1),Y=v=>Hh-pad-(v-mn)*(Hh-2*pad)/((mx-mn)||1);
  const colors=['#2456e0','#0ea5a5','#c93a3a','#b97f0f','#7c3aed','#1c8a4c'];
  let svg='<svg viewBox="0 0 '+W+' '+Hh+'" style="width:100%;height:auto;display:block" role="img">';
  for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4;svg+='<line x1="'+pad+'" y1="'+Y(v)+'" x2="'+(W-pad)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="4" y="'+(Y(v)+4)+'" font-size="10" fill="var(--muted)">'+esc(String(Math.round(v*100)/100))+'</text>';}
  series.forEach((s,si)=>{const c=s.color||colors[si%colors.length];const pts=s.points.map((p,i)=>X(i).toFixed(1)+','+Y(p).toFixed(1)).join(' ');
    svg+='<polyline points="'+pts+'" fill="none" stroke="'+esc(c)+'" stroke-width="2.5" stroke-linejoin="round"/>';
    s.points.forEach((p,i)=>{svg+='<circle cx="'+X(i)+'" cy="'+Y(p)+'" r="3.5" fill="'+esc(c)+'"><title>'+esc(s.name+': '+p)+'</title></circle>';});});
  svg+='</svg><div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:6px">'+series.map((s,si)=>'<span style="font-size:12px"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:'+esc(s.color||colors[si%colors.length])+';margin-right:5px"></span>'+esc(s.name)+'</span>').join('')+'</div>';
  return H(host,svg);}
function donut(host,items){const tot=items.reduce((a,i)=>a+i.value,0)||1;const colors=['#2456e0','#0ea5a5','#c93a3a','#b97f0f','#7c3aed','#1c8a4c','#5b6b7c'];
  let a0=-Math.PI/2;const R=80,r=52,cx=100,cy=100;let svg='<svg viewBox="0 0 200 200" style="width:200px;height:200px" role="img">';
  items.forEach((it,i)=>{const frac=it.value/tot,a1=a0+frac*2*Math.PI;const big=frac>0.5?1:0;
    const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    const xi1=cx+r*Math.cos(a1),yi1=cy+r*Math.sin(a1),xi0=cx+r*Math.cos(a0),yi0=cy+r*Math.sin(a0);
    const c=it.color||colors[i%colors.length];
    if(frac>0)svg+='<path d="M'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+R+' '+R+' 0 '+big+' 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+' L'+xi1.toFixed(1)+' '+yi1.toFixed(1)+' A'+r+' '+r+' 0 '+big+' 0 '+xi0.toFixed(1)+' '+yi0.toFixed(1)+' Z" fill="'+esc(c)+'"><title>'+esc(it.label+': '+it.value)+'</title></path>';
    a0=a1;});
  svg+='<text x="100" y="96" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)">'+esc(String(items._total!=null?items._total:tot))+'</text><text x="100" y="116" text-anchor="middle" font-size="11" fill="var(--muted)">total</text></svg>';
  const legend='<div style="display:grid;gap:6px;margin-top:4px">'+items.map((it,i)=>'<div style="display:flex;gap:8px;align-items:center;font-size:13px"><span style="width:11px;height:11px;border-radius:3px;background:'+esc(it.color||colors[i%colors.length])+'"></span><span class="k-muted">'+esc(it.label)+'</span><strong style="margin-left:auto">'+esc(String(it.disp!=null?it.disp:it.value))+'</strong></div>').join('')+'</div>';
  return H(host,'<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">'+svg+legend+'</div>');}
function timeline(host,events){const html='<div class="k-tl">'+events.map(e=>'<div class="k-tl-ev '+(e.kind||'')+'"><div class="k-tl-t">'+esc(e.t||'')+'</div><div style="font-weight:700">'+esc(e.title||'')+'</div>'+(e.body?'<div class="k-muted" style="font-size:13px">'+esc(e.body)+'</div>':'')+'</div>').join('')+'</div>';return H(host,html);}
function graph(host,g){const nodes=g.nodes||[],edges=g.edges||[];
  const incoming={};nodes.forEach(n=>incoming[n.id]=0);edges.forEach(e=>{if(incoming[e.b]!=null)incoming[e.b]++;});
  const depth={},queue=[];nodes.forEach(n=>{if(!incoming[n.id]){depth[n.id]=0;queue.push(n.id);}});
  const adj={};edges.forEach(e=>{(adj[e.a]=adj[e.a]||[]).push(e.b);});
  while(queue.length){const id=queue.shift();(adj[id]||[]).forEach(b=>{const nd=(depth[id]||0)+1;if(depth[b]==null||nd>depth[b])depth[b]=nd;incoming[b]--;if(incoming[b]<=0)queue.push(b);});}
  nodes.forEach(n=>{if(depth[n.id]==null)depth[n.id]=0;});
  const layers={};nodes.forEach(n=>{const d=depth[n.id];(layers[d]=layers[d]||[]).push(n);});
  const maxD=Math.max.apply(null,Object.keys(layers).map(Number).concat([0]));
  const maxL=Math.max.apply(null,Object.values(layers).map(l=>l.length).concat([1]));
  const W=Math.max(560,(maxD+1)*230),Hh=Math.max(280,maxL*96+60);
  const pos={};Object.keys(layers).forEach(d=>{layers[d].forEach((n,i)=>{pos[n.id]={x:+d*230+115,y:i*96+70};});});
  let svg='<svg viewBox="0 0 '+W+' '+Hh+'" style="width:100%;height:auto;display:block" role="img"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="var(--muted)" stroke-width="1.5"/></marker></defs>';
  edges.forEach(e=>{const a=pos[e.a],b=pos[e.b];if(!a||!b)return;
    svg+='<line x1="'+(a.x+62)+'" y1="'+a.y+'" x2="'+(b.x-66)+'" y2="'+b.y+'" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>';
    if(e.label)svg+='<text x="'+((a.x+b.x)/2)+'" y="'+((a.y+b.y)/2-6)+'" font-size="10" fill="var(--muted)" text-anchor="middle">'+esc(e.label)+'</text>';});
  nodes.forEach(n=>{const p=pos[n.id];const c=n.color||'#2456e0';
    svg+='<g data-node="'+esc(n.id)+'" style="cursor:pointer"><rect x="'+(p.x-62)+'" y="'+(p.y-30)+'" width="124" height="60" rx="10" fill="var(--panel)" stroke="'+esc(c)+'" stroke-width="2"/>'+
    '<text x="'+p.x+'" y="'+(p.y-4)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">'+esc(n.label)+'</text>'+
    (n.sub?'<text x="'+p.x+'" y="'+(p.y+14)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+esc(n.sub)+'</text>':'')+'</g>';});
  svg+='</svg>';return H(host,svg);}
function badge(txt,kind){return '<span class="k-badge '+(kind||'')+'">'+esc(txt)+'</span>';}
function kpi(host,o){const d=o.delta!=null?'<div class="k-kpi-d" style="color:'+(String(o.delta).charAt(0)==='-'?'var(--bad)':'var(--good)')+'">'+esc(o.delta)+'</div>':'';
  const html='<div class="k-kpi"><div class="k-kpi-l">'+esc(o.label||'')+'</div><div class="k-kpi-v">'+esc(o.value||'')+'</div>'+d+'</div>';return H(host,html);}
function empty(host,title,sub,actionLabel,actionFn){const id=uid('e');
  const html='<div class="k-empty"><h3>'+esc(title||'Nothing here yet')+'</h3><p>'+esc(sub||'')+'</p>'+(actionLabel?'<button class="k-btn k-primary" id="'+id+'">'+esc(actionLabel)+'</button>':'')+'</div>';
  if(host){H(host,html);const b=document.getElementById(id);if(b&&actionFn)b.onclick=actionFn;}return html;}
function money(n){const v=Number(n)||0;return '$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function num(n){return (Number(n)||0).toLocaleString('en-US');}
function pct(x){return (Math.round(Number(x)*1000)/10)+'%';}
function when(d){try{const dt=d instanceof Date?d:new Date(d);if(isNaN(dt))return esc(String(d));
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){return esc(String(d));}}
function initials(name){return String(name||'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');}
function copy(txt){const done=()=>toast('Copied to clipboard','ok');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fallback());}else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('Copy failed','bad');}ta.remove();}}
window.Kit={rng:rng,pick:pick,int:int,shuffle:shuffle,uid:uid,esc:esc,el:function(h){const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;},store:store,nav:nav,toast:toast,modal:modal,tabs:tabs,table:table,bars:bars,line:line,donut:donut,timeline:timeline,graph:graph,badge:badge,kpi:kpi,empty:empty,money:money,num:num,pct:pct,when:when,initials:initials,copy:copy,_fallback:true};
})();

</script>
<script>

(function(){
const K=window.Kit;
const st=K.store('wordroot69');
const WORDS=[
 {w:'triage',pos:'noun / verb',def:'Sorting patients by urgency — who needs care first.',ex:'"During the night shift, triage starts at the ambulance bay, not the waiting room."',life:'job',due:'today'},
 {w:'dosage',pos:'noun',def:'The measured amount of a medicine to take at one time.',ex:'"Double-check the dosage before you hand over the meds — it\u2019s the last line of defense."',life:'job',due:'today'},
 {w:'palpate',pos:'verb',def:'To examine by touch, feeling for lumps or swelling.',ex:'"Palpate the abdomen gently; the patient will tell you where it hurts."',life:'job',due:'today'},
 {w:'prognosis',pos:'noun',def:'The likely course and outcome of an illness.',ex:'"The prognosis improved once the infection responded to antibiotics."',life:'job',due:'tomorrow'},
 {w:'sterile',pos:'adjective',def:'Free of bacteria — safe for wounds and procedures.',ex:'"Keep the field sterile: once the drape is down, don\u2019t reach over it."',life:'job',due:'tomorrow'},
 {w:'monitor',pos:'verb',def:'To watch closely over time for changes.',ex:'"Monitor vitals every 15 minutes until she stabilizes."',life:'job',due:'in 3 days'},
 {w:'perennial',pos:'noun / adjective',def:'A plant that lives and blooms for 3+ years.',ex:'"I planted lavender as a perennial — it comes back every spring without replanting."',life:'hobby',due:'today'},
 {w:'germinate',pos:'verb',def:'When a seed sprouts and begins to grow.',ex:'"Tomato seeds germinate fastest on a warm windowsill, about 7 days."',life:'hobby',due:'today'},
 {w:'mulch',pos:'noun / verb',def:'A protective layer spread over soil to hold moisture.',ex:'"Mulch the beds before the heat wave — it cuts watering in half."',life:'hobby',due:'tomorrow'},
 {w:'compost',pos:'noun / verb',def:'Decayed organic matter that feeds soil.',ex:'"The compost bin turns coffee grounds into next spring\u2019s tomatoes."',life:'hobby',due:'tomorrow'},
 {w:'prune',pos:'verb',def:'To trim a plant to shape it or boost growth.',ex:'"Prune the roses in late winter and they\u2019ll explode in May."',life:'hobby',due:'in 3 days'},
 {w:'loam',pos:'noun',def:'The ideal garden soil — balanced sand, silt, and clay.',ex:'"This bed finally has real loam — dark, crumbly, smells like rain."',life:'hobby',due:'in 3 days'},
];
let S=st.get('s',null)||{idx:0,flipped:false,results:{},round:1};
const custom=st.get('custom',[]);
function ALLCARDS(){return WORDS.concat(custom);}
function save(){st.set('s',S);}
function saveCustom(){st.set('custom',custom);}
const navbar=K.nav({title:'\u{1F331} WordRoot',sub:'MyWords · vocabulary grown from your actual life',actions:[{label:'Reset progress',href:'#reset'}]});
navbar.querySelector('.k-nav-actions .k-btn').addEventListener('click',e=>{e.preventDefault();S={idx:0,flipped:false,results:{},round:1};save();renderAll();K.toast('Progress reset','warn');});
function dueWords(){return ALLCARDS().map((w,i)=>({w:w,i:i})).filter(x=>S.results[x.i]==null||S.results[x.i]==='again');}
function renderKPIs(){const W=ALLCARDS();const mastered=Object.values(S.results).filter(v=>v==='easy'||v==='good').length;
 const kh=document.getElementById('kpis');kh.innerHTML='';
 K.kpi(kh,{label:'Deck size',value:W.length+' words'});
 K.kpi(kh,{label:'Mastered',value:mastered+' / '+W.length});
 K.kpi(kh,{label:'Due now',value:String(dueWords().length)});
 K.kpi(kh,{label:'Quiz round',value:'Round '+S.round});}
function renderDeck(host){
 const W=ALLCARDS();
 host.innerHTML='<div class="k-grid" style="grid-template-columns:repeat(3,1fr)">'+W.map((w,i)=>{const r=S.results[i];
  return '<div class="seed-packet"><div style="display:flex;justify-content:space-between;align-items:center"><span class="life-tag'+(w.life==='hobby'?' hobby':'')+'">'+(w.life==='job'?'⚕️ NURSE':'🪴 GARDEN')+'</span>'+(r?K.badge(r==='again'?'retry':'learned',r==='again'?'warn':'ok'):'')+'</div><h3 style="margin:8px 0 2px;font-size:22px">'+K.esc(w.w)+'</h3><div class="k-muted" style="font-size:12px;font-style:italic">'+K.esc(w.pos)+'</div><div style="font-size:14px;margin:6px 0">'+K.esc(w.def)+'</div><div class="k-muted" style="font-size:13px">💬 '+K.esc(w.ex)+'</div><div style="font-size:12px;margin-top:6px" class="k-muted">⏰ due '+w.due+'</div></div>';}).join('')+'</div>';
 if(window.innerWidth<900)host.querySelector('.k-grid').style.gridTemplateColumns='1fr';}
const NEXT={again:'in 10 minutes',hard:'tomorrow',good:'in 3 days',easy:'in 7 days'};
function renderQuiz(host){
 const due=dueWords();
 if(!due.length){K.empty(host,'Deck clear! \u{1F389}','Every word is scheduled. Come back tomorrow — the SM-2 scheduler will have more ready.','Review full deck',()=>{const tb=document.querySelectorAll('#main-tabs .k-tab')[0];if(tb)tb.click();});return;}
 const item=due[S.idx%due.length];const w=item.w;
 host.innerHTML='<div class="flash"><div class="k-muted" style="font-size:12px;font-weight:700;letter-spacing:.06em;margin-bottom:8px">CARD '+(S.idx%due.length+1)+' OF '+due.length+' · DUE NOW</div><div class="flash-inner" id="card"><div style="font-size:13px" class="k-muted">'+(S.flipped?'DEFINITION':'WORD')+'</div><div style="font-size:'+(S.flipped?'19px':'40px')+';font-weight:800;margin:10px 0">'+(S.flipped?K.esc(w.def):K.esc(w.w))+'</div>'+(S.flipped?'<div class="k-muted" style="font-size:14px;max-width:420px">💬 '+K.esc(w.ex)+'</div><div style="margin-top:8px"><span class="life-tag'+(w.life==='hobby'?' hobby':'')+'">'+(w.life==='job'?'⚕️ from your night shift':'🪴 from your garden')+'</span></div>':'<div class="k-muted" style="font-size:13px">tap to flip</div>')+'</div>'+
 (S.flipped?'<div class="rate-row"><button class="rate" data-rate="again" style="border-color:#b3402e;color:#b3402e">✗ Again</button><button class="rate" data-rate="hard" style="border-color:#b97f0f;color:#b97f0f">◐ Hard</button><button class="rate" data-rate="good" style="border-color:#3e7d32;color:#3e7d32">● Good</button><button class="rate" data-rate="easy" style="border-color:#3b6ea5;color:#3b6ea5">★★ Easy</button></div><div class="k-muted" style="font-size:12px;margin-top:8px">How well did you know it? The scheduler adapts.</div>':'')+'</div>';
 host.querySelector('#card').onclick=()=>{S.flipped=true;save();renderQuiz(host);};
 host.querySelectorAll('[data-rate]').forEach(b=>b.onclick=e=>{e.stopPropagation();const rv=b.dataset.rate;
  S.results[item.i]=rv;S.flipped=false;S.idx++;
  if(S.idx>=due.length){S.idx=0;S.round++;}
  save();renderQuiz(host);renderKPIs();
  K.toast('“'+w.w+'” → review '+NEXT[rv],rv==='again'?'warn':'ok');});}
function renderStats(host){
 const W=ALLCARDS();
 const job=W.map((w,i)=>({w:w,i:i})).filter(x=>x.w.life==='job'),hob=W.map((w,i)=>({w:w,i:i})).filter(x=>x.w.life==='hobby');
 const mJob=job.filter(x=>['good','easy'].includes(S.results[x.i])).length;
 const mHob=hob.filter(x=>['good','easy'].includes(S.results[x.i])).length;
 host.innerHTML='<div class="k-split"><div class="k-card"><h3 style="margin-top:0">Mastery by life</h3><div id="sbars"></div></div><div class="k-card"><h3 style="margin-top:0">How the scheduler thinks</h3><p class="k-muted" style="font-size:14px">Simplified SM-2: rate each card honestly and WordRoot spaces the next review at the edge of forgetting.</p><div class="k-grid" style="grid-template-columns:1fr 1fr;gap:8px;font-size:13px"><span>✗ Again</span><strong>10 minutes</strong><span>◐ Hard</span><strong>tomorrow</strong><span>● Good</span><strong>3 days</strong><span>★★ Easy</span><strong>7 days</strong></div><p class="k-muted" style="font-size:13px">Words from your nursing shifts and your garden get used the same day — that\u2019s what makes them stick.</p></div></div>';
 K.bars('#sbars',[{label:'⚕️ Nursing words',value:mJob,disp:mJob+'/'+job.length,color:'#3e7d32'},{label:'🪴 Gardening words',value:mHob,disp:mHob+'/'+hob.length,color:'#b3541e'}]);}
/* Grow from your life: extract vocabulary-worthy words from pasted text. */
const STOP=new Set(("a,about,above,after,again,against,all,almost,also,always,am,an,and,any,are,as,at,be,because,been,before,being,below,between,both,but,by,can,could,did,do,does,doing,down,during,each,every,few,for,from,further,had,has,have,having,he,her,here,hers,herself,him,himself,his,how,i,if,in,into,is,it,its,itself,just,like,me,more,most,my,myself,need,no,nor,not,now,of,off,on,once,only,or,other,ought,our,ours,ourselves,out,over,own,same,she,should,so,some,such,than,that,the,their,theirs,them,themselves,then,there,these,they,this,those,through,to,too,under,until,up,very,was,we,were,what,when,where,which,while,who,whom,why,with,would,you,your,yours,yourself,yourselves,will,shall,may,might,must,one,two,three,said,say,says,get,got,make,made,makes,take,took,come,came,know,knew,think,thought,look,looked,want,wanted,use,used,find,found,give,gave,tell,told,work,worked,call,called,try,tried,ask,asked,turn,turned,put,set,keep,kept,let,begin,began,help,helped,show,showed,hear,heard,play,played,run,ran,move,moved,live,lived,believe,hold,held,bring,brought,happen,happened,write,wrote,sit,sat,stand,stood,lose,lost,pay,paid,meet,met,include,continued,learn,change,seem,watch,mean,follow,followed,stop,stopped,create,created,speak,spoke,read,spend,spent,grow,grew,open,opened,walk,walked,win,won,teach,taught,offer,offered,remember,consider,appear,appeared,buy,bought,wait,waited,serve,served,die,died,send,sent,build,built,stay,stayed,fall,fell,cut,reach,reached,remain,remained,suggest,pull,pulled,another,around,between,while,those,these").split(","));
function extractCandidates(text){
 const sents=text.match(/[^.!?]+[.!?]+/g)||[text];
 const seen={};const cands=[];
 const existing=new Set(ALLCARDS().map(w=>w.w.toLowerCase()));
 (text.toLowerCase().match(/[a-z][a-z\-']{5,}/g)||[]).forEach(function(w){
  w=w.replace(/^['\-]+|['\-]+$/g,'');
  if(w.length<7||STOP.has(w)||existing.has(w)||seen[w])return;
  seen[w]=1;
  let ctx='';
  for(let si=0;si<sents.length;si++){if(sents[si].toLowerCase().indexOf(w)>=0){ctx=sents[si].trim().slice(0,150);break;}}
  cands.push({w:w,ctx:ctx});
 });
 cands.sort((a,b)=>b.w.length-a.w.length);
 return cands.slice(0,10);
}
function renderGrow(host){
 host.innerHTML='<div class="k-card"><h3 style="margin-top:0">Grow from your actual life</h3><p class="k-muted" style="font-size:14px">Paste a work email, a Kindle passage, a chat thread — WordRoot pulls out the words worth learning, with the sentence you found them in as context. You write the definition in your own words, so it sticks.</p><textarea class="k-input" id="imptext" style="min-height:110px" placeholder="Paste text from your life here…"></textarea><div style="margin-top:10px"><button class="k-btn k-primary" id="impext">Find my words</button></div><div id="cands" style="margin-top:12px"></div></div>';
 host.querySelector('#impext').onclick=function(){
  const t=host.querySelector('#imptext').value.trim();
  if(!t){K.toast('Paste some text first','warn');return;}
  const cands=extractCandidates(t);
  const ch=host.querySelector('#cands');
  if(!cands.length){ch.innerHTML='<p class="k-muted">No new vocabulary-worthy words found — try a longer or denser passage.</p>';return;}
  ch.innerHTML='<p class="k-muted" style="font-size:13px">Candidates — each lands in your deck with its source sentence:</p>'+cands.map((c,i)=>'<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" data-ci="'+i+'" checked> <b style="font-size:16px">'+K.esc(c.w)+'</b></label><div class="k-muted" style="font-size:12.5px;margin:4px 0">\u201c'+K.esc(c.ctx)+'\u201d</div><div style="display:flex;gap:8px;flex-wrap:wrap"><input class="k-input" data-def="'+i+'" placeholder="Your definition (in your own words)" style="flex:2;min-width:180px"><select class="k-input" data-life="'+i+'" style="flex:1;min-width:120px"><option value="job">Work</option><option value="hobby">Hobby</option></select></div></div>').join('')+'<button class="k-btn k-primary" id="impadd">Add selected to deck</button>';
  ch.querySelector('#impadd').onclick=function(){
   let added=0;
   cands.forEach((c,i)=>{
    const cb=ch.querySelector('[data-ci="'+i+'"]');
    if(cb&&cb.checked){
     const def=(ch.querySelector('[data-def="'+i+'"]').value.trim()||'(your definition — edit me)');
     const life=ch.querySelector('[data-life="'+i+'"]').value;
     custom.push({w:c.w,pos:'\u2014',def:def,ex:'\u201c'+c.ctx+'\u201d',life:life,due:'today'});
     added++;
    }
   });
   if(!added){K.toast('Nothing selected','warn');return;}
   saveCustom();K.toast(added+' word'+(added>1?'s':'')+' added to your deck');renderAll();
  };
 };
}
function renderAll(){renderKPIs();K.tabs('#main-tabs',[
 {id:'deck',label:'🌱 Deck ('+ALLCARDS().length+')',render:renderDeck},
 {id:'quiz',label:'🃏 Quiz'+(dueWords().length?' ('+dueWords().length+' due)':''),render:renderQuiz},
 {id:'stats',label:'📊 Stats',render:renderStats},
 {id:'grow',label:'➕ Grow from life',render:renderGrow}]);}
document.getElementById('quiz-start').onclick=()=>{const tb=document.querySelectorAll('#main-tabs .k-tab')[1];if(tb)tb.click();document.getElementById('main-tabs').scrollIntoView({behavior:'smooth'});};
renderAll();
})();

</script>
