<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Textbook</title>
<link rel="stylesheet" href="../../shared/kit.css">
<style>body{padding-top:104px}/* qa-c: clear fixed .k-nav header */
/* Common kit-fallback styles. Per-app palette vars are overridden in app.css. */
:root{
--bg:#f7f5f0;--panel:#ffffff;--panel2:#f1ede4;--ink:#23211c;--muted:#6f6a5e;
--line:#e2dccf;--accent:#b5542a;--accent2:#e8a020;--good:#2e7d4f;--warn:#b7791f;--bad:#b3382e;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
line-height:1.55}
.k-wrap{max-width:1120px;margin:0 auto;padding:20px 18px 64px}
.k-nav{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.k-nav-in{max-width:1120px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.k-nav-t{margin:0;font-size:22px;letter-spacing:.2px}
.k-nav-s{margin:2px 0 0;color:var(--muted);font-size:13px}
.k-nav-a{display:flex;gap:8px;flex-wrap:wrap}
.k-hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px;margin:18px 0}
.k-hero h2{margin:0 0 6px;font-size:26px}
.k-hero p{margin:0;color:var(--muted)}
.k-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}
.k-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.k-card h3{margin:0 0 8px;font-size:16px}
.k-muted{color:var(--muted)}.k-small{font-size:13px}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.k-split{grid-template-columns:1fr}}
.k-btn{display:inline-block;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
.k-btn:hover{filter:brightness(.97)}
.k-btn.k-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.k-input,.k-select,textarea.k-input{width:100%;border:1px solid var(--line);border-radius:9px;
padding:10px 12px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit}
textarea.k-input{min-height:88px;resize:vertical}
label.k-label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;
padding:8px 10px;border-bottom:2px solid var(--line)}
.k-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.k-table tr:hover td{background:var(--panel2)}
.k-badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;
background:var(--panel2);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.k-badge.ok{background:#e4f2e9;color:#1e6b3e;border-color:#bfe0c9}
.k-badge.warn{background:#fbf0da;color:#8a5a12;border-color:#ecd9ab}
.k-badge.bad{background:#fbe7e4;color:#a02c22;border-color:#f0c4bd}
.k-badge.info{background:#e3eefb;color:#2456a6;border-color:#c3d8f2}
.k-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.k-tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;
font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.k-tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.k-kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.k-kpi .k-kpi-l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.k-kpi .k-kpi-v{font-size:26px;font-weight:800;margin-top:2px}
.k-kpi .k-kpi-d{font-size:13px;color:var(--muted)}
.k-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);
padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:99;max-width:90vw}
.k-toast.show{opacity:1;transform:translate(-50%,0)}
.k-toast.good{background:var(--good)}.k-toast.bad{background:var(--bad)}
.k-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:90;padding:18px}
.k-modal{background:var(--panel);border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:22px}
.k-modal h3{margin:0 0 10px}
.k-modal-f{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.k-empty{text-align:center;padding:44px 20px;color:var(--muted)}
.k-empty h3{color:var(--ink);margin:0 0 6px}
.k-bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.k-bar-l{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-bar-t{flex:1;background:var(--panel2);border-radius:6px;height:14px;overflow:hidden}
.k-bar-f{height:100%;border-radius:6px;background:var(--accent)}
.k-bar-v{width:56px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.k-tl{position:relative;margin:14px 0;padding-left:26px}
.k-tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.k-tl-ev{position:relative;margin:0 0 16px}
.k-tl-ev:before{content:"";position:absolute;left:-24px;top:5px;width:12px;height:12px;border-radius:50%;
background:var(--accent);border:2px solid var(--panel)}
.k-tl-ev .k-tl-t{font-weight:700}
.k-tl-ev .k-tl-b{color:var(--muted);font-size:13px}
.k-graph{width:100%;overflow:auto}
.k-klist{list-style:none;margin:0;padding:0}
.k-klist li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.k-klist li:last-child{border-bottom:0}
.k-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.k-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.k-note{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);
border-radius:0 10px 10px 0;padding:12px 16px;margin:14px 0;font-size:14px}
.k-quiz-opt{display:block;width:100%;text-align:left;margin:8px 0}
.k-quiz-opt.picked{outline:2px solid var(--accent)}
.k-quiz-opt.right{outline:2px solid var(--good)}
.k-quiz-opt.wrong{outline:2px solid var(--bad)}
@media(max-width:640px){.k-bar-l{width:104px}.k-wrap{padding:14px 12px 48px}}

:root{
--bg:#f3f0e6;--panel:#fffdf6;--panel2:#e9e4d2;--ink:#22301f;--muted:#6d7a68;
--line:#d9d2ba;--accent:#1f6b4a;--accent2:#e8a020;--good:#2e7d4f;--warn:#b7791f;--bad:#b3382e;
}
body{font-family:"Charter","Bitstream Charter",Georgia,serif}
.k-nav-t,.k-hero h2,.k-card h3{font-family:"Charter",Georgia,serif}
.mode-tab.on{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important}
.prose{font-size:17px;line-height:1.75}
.prose p{margin:0 0 14px}
.formula{background:#22301f;color:#f3f0e6;border-radius:10px;padding:16px 20px;font-family:ui-monospace,Menlo,monospace;font-size:18px;text-align:center;margin:16px 0}
.eli5{background:#fdf6e3;border:2px dashed var(--accent2);border-radius:12px;padding:18px 20px;font-size:16px}
.slider-row{display:grid;grid-template-columns:170px 1fr 110px;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.slider-row input[type=range]{width:100%}
.quiz-opt{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;cursor:pointer;background:var(--panel)}
.quiz-opt.right{border-color:var(--good);background:#e4f2e9}
.quiz-opt.wrong{border-color:var(--bad);background:#fbe7e4}
.chapter-card{cursor:pointer}
.chapter-card:hover{border-color:var(--accent)}
.chapter-card.on{border:2px solid var(--accent)}

</style>
</head>
<body>
<div class="k-wrap" id="app"></div>

<script src="../../shared/kit.js"></script>
<script>
/* Fallback Kit (window.Kit). If ../../shared/kit.js loads later it replaces this. */
(function(){
if(window.Kit && window.Kit._real) return;
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
var uidc=0;
var Kit={
_rng:null,
rng:function(seed){return mulberry32(hashStr(String(seed)));},
pick:function(r,arr){return arr[Math.floor(r()*arr.length)];},
int:function(r,a,b){return a+Math.floor(r()*(b-a+1));},
shuffle:function(r,arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;},
uid:function(p){uidc++;return (p||"id")+"-"+uidc+"-"+Date.now().toString(36);},
esc:function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});},
el:function(html){var t=document.createElement("template");t.innerHTML=String(html).trim();return t.content.firstElementChild;},
store:function(ns){return{
get:function(k,d){try{var v=localStorage.getItem(ns+":"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
set:function(k,v){try{localStorage.setItem(ns+":"+k,JSON.stringify(v));}catch(e){}},
del:function(k){try{localStorage.removeItem(ns+":"+k);}catch(e){}}};},
nav:function(o){var n=this.el('<header class="k-nav"><div class="k-nav-in"><div><h1 class="k-nav-t"></h1><p class="k-nav-s"></p></div><div class="k-nav-a"></div></div></header>');
n.querySelector(".k-nav-t").textContent=o.title||"";n.querySelector(".k-nav-s").textContent=o.sub||"";
var a=n.querySelector(".k-nav-a");(o.actions||[]).forEach(function(x){a.appendChild(x);});
document.body.insertBefore(n,document.body.firstChild);return n;},
toast:function(msg,kind){var t=this.el('<div class="k-toast'+(kind?" "+kind:"")+'"></div>');t.textContent=msg;
document.body.appendChild(t);setTimeout(function(){t.classList.add("show");},10);
setTimeout(function(){t.classList.remove("show");setTimeout(function(){t.remove();},400);},2600);},
modal:function(o){var ov=this.el('<div class="k-modal-ov"><div class="k-modal" role="dialog"><h3></h3><div class="k-modal-b"></div><div class="k-modal-f"></div></div></div>');
ov.querySelector("h3").textContent=o.title||"";ov.querySelector(".k-modal-b").innerHTML=o.body||"";
var f=ov.querySelector(".k-modal-f");(o.actions||[{label:"Close",primary:true}]).forEach(function(x){
var b=document.createElement("button");b.className="k-btn"+(x.primary?" k-primary":"");b.textContent=x.label;
b.onclick=function(){if(x.onClick)x.onClick();if(!x.keep)ov.remove();};f.appendChild(b);});
ov.addEventListener("click",function(e){if(e.target===ov)ov.remove();});
document.body.appendChild(ov);return ov;},
tabs:function(host,list){host.innerHTML="";var self=this;
var bar=this.el('<div class="k-tabs"></div>');var pane=this.el('<div class="k-tabpane"></div>');
host.appendChild(bar);host.appendChild(pane);
function show(id){var it=null;list.forEach(function(x){if(x.id===id)it=x;});
bar.querySelectorAll(".k-tab").forEach(function(b){b.classList.toggle("on",b.dataset.id===id);});
pane.innerHTML="";if(it&&it.render)it.render(pane);}
list.forEach(function(x,i){var b=self.el('<button class="k-tab"></button>');b.textContent=x.label;b.dataset.id=x.id;
b.onclick=function(){show(x.id);};bar.appendChild(b);});
if(list.length)show(list[0].id);},
table:function(host,cols,rows,opt){opt=opt||{};host.innerHTML="";var self=this;var page=0;var q="";
var wrap=this.el('<div></div>');host.appendChild(wrap);
function draw(){var rs=rows.filter(function(r){if(!q)return true;
return cols.some(function(c){var v=r[c.key];return v!=null&&String(v).toLowerCase().indexOf(q)>=0;});});
var ps=opt.pageSize||rs.length;var np=Math.max(1,Math.ceil(rs.length/ps));page=Math.min(page,np-1);
var slice=rs.slice(page*ps,(page+1)*ps);
var h='<div class="k-flex" style="justify-content:space-between;margin-bottom:8px">';
if(opt.search)h+='<input class="k-input k-search" style="max-width:280px" placeholder="Search…">';
h+='<span class="k-muted k-small">'+rs.length+' rows</span></div>';
h+='<div style="overflow-x:auto"><table class="k-table"><thead><tr>';
cols.forEach(function(c){h+='<th'+(c.num?' style="text-align:right"':"")+'>'+self.esc(c.label)+'</th>';});
h+='</tr></thead><tbody>';
slice.forEach(function(r){h+='<tr>';cols.forEach(function(c){var v=r[c.key];if(c.fmt)v=c.fmt(v,r);
h+='<td'+(c.num?' style="text-align:right"':"")+'>'+(v==null?"":v)+'</td>';});h+='</tr>';});
h+='</tbody></table></div>';
if(np>1)h+='<div class="k-flex" style="margin-top:8px"><button class="k-btn k-prev">← Prev</button><span class="k-muted k-small">Page '+(page+1)+' of '+np+'</span><button class="k-btn k-next">Next →</button></div>';
wrap.innerHTML=h;
var si=wrap.querySelector(".k-search");if(si){si.value=q;si.oninput=function(){q=si.value.toLowerCase();page=0;draw();};}
var pv=wrap.querySelector(".k-prev");if(pv)pv.onclick=function(){if(page>0){page--;draw();}};
var nx=wrap.querySelector(".k-next");if(nx)nx.onclick=function(){if(page<np-1){page++;draw();}};
draw();}
},
bars:function(host,items){host.innerHTML="";var max=0;items.forEach(function(i){if(i.value>max)max=i.value;});
var self=this;items.forEach(function(i){var w=max?Math.round(i.value/max*100):0;
var row=self.el('<div class="k-bar-row"><span class="k-bar-l" title="'+self.esc(i.label)+'">'+self.esc(i.label)+'</span><span class="k-bar-t"><span class="k-bar-f" style="width:'+w+'%'+(i.color?';background:'+i.color:'')+'"></span></span><span class="k-bar-v">'+self.esc(i.disp!=null?i.disp:i.value)+'</span></div>');
host.appendChild(row);});},
line:function(host,series,opt){opt=opt||{};host.innerHTML="";var W=560,H=240,pad=34;
var cv=document.createElement("canvas");cv.width=W*2;cv.height=H*2;cv.style.width="100%";cv.style.maxWidth=W+"px";cv.style.height="auto";
var g=cv.getContext("2d");g.scale(2,2);host.appendChild(cv);
var all=[];series.forEach(function(s){s.points.forEach(function(p){all.push(p);});});
var mn=Math.min.apply(null,all.concat([0])),mx=Math.max.apply(null,all.concat([1]));if(mx===mn)mx=mn+1;
function X(i,n){return pad+(W-2*pad)*(n<=1?0:i/(n-1));}
function Y(v){return H-pad-(H-2*pad)*(v-mn)/(mx-mn);}
g.strokeStyle="rgba(0,0,0,.12)";g.fillStyle="rgba(0,0,0,.5)";g.font="10px sans-serif";
for(var k=0;k<=4;k++){var v=mn+(mx-mn)*k/4,yy=Y(v);g.beginPath();g.moveTo(pad,yy);g.lineTo(W-pad,yy);g.stroke();g.fillText(Math.round(v).toString(),4,yy+3);}
series.forEach(function(s,si){g.strokeStyle=s.color||["#b5542a","#0e7c7c","#2456a6"][si%3];g.lineWidth=2.5;g.beginPath();
s.points.forEach(function(p,i){var x=X(i,s.points.length),y=Y(p);if(i===0)g.moveTo(x,y);else g.lineTo(x,y);});g.stroke();});
var lgY=H-8;series.forEach(function(s,si){var x=pad+si*130;g.fillStyle=s.color||["#b5542a","#0e7c7c","#2456a6"][si%3];g.fillRect(x,lgY-8,18,8);g.fillStyle="rgba(0,0,0,.6)";g.fillText(s.name,x+22,lgY);});},
donut:function(host,items){host.innerHTML="";var R=70,r=46,cx=90,cy=90;var tot=0;items.forEach(function(i){tot+=i.value;});
var ns="http://www.w3.org/2000/svg";var svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox","0 0 180 180");svg.style.width="180px";svg.style.maxWidth="100%";
var a0=-Math.PI/2;var self=this;
items.forEach(function(i,idx){var frac=tot?i.value/tot:0;var a1=a0+frac*Math.PI*2;
var p=document.createElementNS(ns,"path");var large=frac>0.5?1:0;
var x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
var xi1=cx+r*Math.cos(a1),yi1=cy+r*Math.sin(a1),xi0=cx+r*Math.cos(a0),yi0=cy+r*Math.sin(a0);
p.setAttribute("d","M"+x0+","+y0+" A"+R+","+R+" 0 "+large+" 1 "+x1+","+y1+" L"+xi1+","+yi1+" A"+r+","+r+" 0 "+large+" 0 "+xi0+","+yi0+" Z");
p.setAttribute("fill",i.color||["#b5542a","#0e7c7c","#2456a6","#e8a020"][idx%4]);
var tt=document.createElementNS(ns,"title");tt.textContent=i.label+": "+i.value;p.appendChild(tt);svg.appendChild(p);a0=a1;});
host.appendChild(svg);
var ul=this.el('<ul class="k-klist"></ul>');items.forEach(function(i,idx){
var li=self.el('<li><span class="k-badge" style="background:'+(i.color||["#b5542a","#0e7c7c","#2456a6","#e8a020"][idx%4])+';color:#fff;border:0">'+self.esc(String(i.value))+'</span> '+self.esc(i.label)+'</li>');
ul.appendChild(li);});host.appendChild(ul);},
timeline:function(host,events){host.innerHTML="";var self=this;var tl=this.el('<div class="k-tl"></div>');
events.forEach(function(e){var d=self.el('<div class="k-tl-ev"><div class="k-small k-muted">'+self.esc(e.t||"")+'</div><div class="k-tl-t">'+self.esc(e.title||"")+'</div><div class="k-tl-b">'+self.esc(e.body||"")+'</div></div>');tl.appendChild(d);});
host.appendChild(tl);},
graph:function(host,o){host.innerHTML="";var nodes=o.nodes||[],edges=o.edges||[];
var W=620,rowH=64;var levels={};nodes.forEach(function(n){var l=n.level||0;levels[l]=levels[l]||[];levels[l].push(n);});
var maxL=Math.max.apply(null,Object.keys(levels).map(Number).concat([0]));
var H=(maxL+1)*rowH+30;var ns="http://www.w3.org/2000/svg";
var svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.style.width="100%";svg.style.maxWidth=W+"px";
var pos={};var self=this;
Object.keys(levels).forEach(function(l){var arr=levels[l];arr.forEach(function(n,i){pos[n.id]={x:W*(i+1)/(arr.length+1),y:30+Number(l)*rowH};});});
edges.forEach(function(e){var a=pos[e.a],b=pos[e.b];if(!a||!b)return;
var ln=document.createElementNS(ns,"line");ln.setAttribute("x1",a.x);ln.setAttribute("y1",a.y);ln.setAttribute("x2",b.x);ln.setAttribute("y2",b.y);
ln.setAttribute("stroke","rgba(0,0,0,.25)");ln.setAttribute("stroke-width","2");svg.appendChild(ln);
if(e.label){var tx=document.createElementNS(ns,"text");tx.setAttribute("x",(a.x+b.x)/2+6);tx.setAttribute("y",(a.y+b.y)/2-4);
tx.setAttribute("font-size","10");tx.setAttribute("fill","rgba(0,0,0,.55)");tx.textContent=e.label;svg.appendChild(tx);}});
nodes.forEach(function(n){var p=pos[n.id];var gEl=document.createElementNS(ns,"g");gEl.style.cursor=n.onClick?"pointer":"default";
var c=document.createElementNS(ns,"circle");c.setAttribute("cx",p.x);c.setAttribute("cy",p.y);c.setAttribute("r","20");
c.setAttribute("fill",n.color||"#0e7c7c");c.setAttribute("stroke","#fff");c.setAttribute("stroke-width","3");gEl.appendChild(c);
var t=document.createElementNS(ns,"text");t.setAttribute("x",p.x);t.setAttribute("y",p.y+38);t.setAttribute("text-anchor","middle");
t.setAttribute("font-size","11");t.setAttribute("font-weight","700");t.setAttribute("fill","currentColor");t.textContent=n.label;gEl.appendChild(t);
if(n.sub){var s=document.createElementNS(ns,"text");s.setAttribute("x",p.x);s.setAttribute("y",p.y+52);s.setAttribute("text-anchor","middle");
s.setAttribute("font-size","10");s.setAttribute("fill","rgba(0,0,0,.55)");s.textContent=n.sub;gEl.appendChild(s);}
if(n.onClick)gEl.addEventListener("click",function(){n.onClick(n);});
svg.appendChild(gEl);});
var wrap=this.el('<div class="k-graph"></div>');wrap.appendChild(svg);host.appendChild(wrap);},
badge:function(txt,kind){return '<span class="k-badge '+(kind||"")+'">'+this.esc(txt)+'</span>';},
kpi:function(host,o){var d=this.el('<div class="k-kpi"><div class="k-kpi-l"></div><div class="k-kpi-v"></div><div class="k-kpi-d"></div></div>');
d.querySelector(".k-kpi-l").textContent=o.label||"";d.querySelector(".k-kpi-v").innerHTML=o.value||"";
d.querySelector(".k-kpi-d").textContent=o.delta||"";host.appendChild(d);},
empty:function(host,title,sub,al,fn){var d=this.el('<div class="k-empty"><h3></h3><p></p></div>');
d.querySelector("h3").textContent=title||"";d.querySelector("p").textContent=sub||"";
if(al){var b=document.createElement("button");b.className="k-btn k-primary";b.textContent=al;b.onclick=fn;d.appendChild(b);}
host.appendChild(d);},
money:function(n){return "$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});},
num:function(n){return Number(n).toLocaleString("en-US");},
pct:function(x){return (x*100).toFixed(1)+"%";},
when:function(d){try{return new Date(d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}catch(e){return String(d);}},
initials:function(name){return String(name||"").split(/\s+/).map(function(w){return w[0];}).join("").slice(0,2).toUpperCase();},
copy:function(txt){var self=this;function done(){self.toast("Copied to clipboard","good");}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,done);}else{var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}ta.remove();done();}}
};
if(!window.Kit)window.Kit=Kit;else{for(var k in Kit){if(!window.Kit[k])window.Kit[k]=Kit[k];}}
})();

</script>
<script>
/* Living Textbook — every concept can expand, simplify, visualize, simulate, or quiz itself. */
(function(){
"use strict";
var K=window.Kit, app=document.getElementById("app");
var store=K.store("living-textbook-v1");

var CHAPTERS=[
 {id:"ci",title:"Compound interest",icon:"📈",mins:8},
 {id:"infl",title:"Inflation",icon:"🎈",mins:6},
 {id:"div",title:"Diversification",icon:"🧺",mins:7,soon:true}
];
var cur=store.get("chapter","ci");
if(cur!=="ci"&&cur!=="infl")cur="ci";
var mode=store.get("mode","explain");

var EXPLAIN='<div class="prose"><p><b>Compound interest</b> is interest earned on interest. When you invest money, you earn returns on your original deposit — and then you earn returns on those returns too. That second layer is what makes growth accelerate over time.</p><p>The formula is <b>A = P(1 + r)<sup>t</sup></b>: final amount equals principal times one-plus-rate, raised to the number of periods. The exponent is doing all the heavy lifting — time matters more than the rate, and far more than timing.</p><p>This is why starting ten years earlier beats investing twice as much ten years later. The curve doesn\'t just climb; it bends upward.</p></div>';
var EXPAND='<div class="prose"><p>Let\'s derive it. Year 0: you have P. Each year the balance multiplies by (1+r). Year 1: P(1+r). Year 2: P(1+r)(1+r) = P(1+r)². By induction, year t: <b>P(1+r)<sup>t</sup></b>.</p><div class="formula">A = P(1 + r)<sup>t</sup> &nbsp;·&nbsp; with contributions: A = P(1+r)<sup>t</sup> + C · [((1+r)<sup>t</sup> − 1) / r]</div><p>With regular contributions C, each deposit compounds for its remaining time — a geometric series. The closed form above sums it exactly.</p><p><b>The Rule of 72:</b> divide 72 by your rate to estimate doubling time. At 8%, money doubles roughly every 9 years. Three doublings turn $10k into $80k — no extra deposits needed.</p><p><b>Continuous compounding</b> is the limit as compounding frequency → ∞: A = Pe<sup>rt</sup>. Banks quote APY (effective annual rate) so you can compare frequencies honestly.</p></div>';
var SIMPLIFY='<div class="eli5"><b>🍦 The ice-cream shop version:</b> You open a magical ice-cream shop. Every scoop you own magically makes a tiny baby scoop each year — that\'s interest. Next year, the <i>baby scoops make baby scoops too</i>. After many years you don\'t have a few scoops — you have a mountain. The magic words are <b>"my scoops make scoops"</b>. Start early, because baby scoops need birthdays to multiply.</div>';
var QUIZ=[
 {q:"You invest $1,000 at 10% annual compound interest. What's it worth after 2 years?",opts:["$1,200","$1,210","$1,100","$1,300"],a:1,why:"Year 1: $1,100. Year 2: $1,100 × 1.10 = $1,210. The extra $10 is interest-on-interest."},
 {q:"At 8% annual return, about how long for money to double?",opts:["8 years","12 years","9 years","16 years"],a:2,why:"Rule of 72: 72 ÷ 8 = 9 years."},
 {q:"Why does starting 10 years earlier usually beat investing more later?",opts:["Fees are lower when you're young","The exponent: extra years of compounding dominate","Inflation helps early investors","Tax brackets favor the young"],a:1,why:"Time sits in the exponent of P(1+r)^t — it compounds, contributions only add."},
 {q:"With monthly $100 contributions at 7% for 30 years, roughly how much is from contributions vs growth?",opts:["Mostly contributions","About half and half","Mostly growth","Growth is negligible"],a:2,why:"$36k contributed grows to ~$122k — growth does ~70% of the work."}
];

var EXPLAIN_I='<div class="prose"><p><b>Inflation</b> is the slow shrinking of what your money buys. When prices rise 3% a year, a dollar next year buys what 97 cents buys today. It feels invisible year to year — over decades it halves fortunes.</p><p>The formula is the mirror of compound interest: <b>real value = P / (1 + i)<sup>t</sup></b>. Same exponent, running against you. At 3% inflation, $100,000 buys only about $41,000 worth of stuff after 30 years.</p><p>This is why cash that feels safe is not safe. A savings account earning 1% while inflation runs 3% loses 2% of purchasing power every year — the most predictable loss in finance.</p></div>';
var EXPAND_I='<div class="prose"><p>Derive it: if prices multiply by (1+i) each year, what costs P today costs P(1+i)<sup>t</sup> later. Your unchanged P therefore buys <b>(1+i)<sup>-t</sup></b> as much. The exponent that builds wealth in investing erodes it here.</p><div class="formula">Real value = P / (1 + i)<sup>t</sup> &nbsp;·&nbsp; halving time ~ 72 / i</div><p><b>The Rule of 72 in reverse:</b> 72 divided by the inflation rate is roughly the years for your money to lose half its purchasing power. At 3%, that is 24 years. At 8% (2022-style), under 9 years.</p><p><b>Nominal vs real returns:</b> if your portfolio earns 7% while inflation is 3%, your real return is about 4% (exact: (1.07/1.03)-1 = 3.9%). Inflation is the hurdle every investment must clear.</p><p><b>Why central banks target 2%:</b> a little inflation greases the economy — it punishes hoarding cash and nudges spending and investment. Deflation (prices falling) is worse: everyone waits to buy, and the economy seizes up.</p></div>';
var SIMPLIFY_I='<div class="eli5"><b>The ice-cream shop version:</b> Your money is an ice cream cone on a warm day. Inflation is the sun. You can stare at the cone and swear it looks the same — but every year a little melts off. After 24 years of 3% heat, half your cone is on the sidewalk. Investing is just putting the cone in a freezer that freezes <i>faster</i> than the sun melts.</div>';
var QUIZ_I=[
 {q:"Prices rise 3% a year. Roughly how long until your money buys half as much?",opts:["12 years","24 years","36 years","It never halves"],a:1,why:"Rule of 72 in reverse: 72 / 3 = 24 years to halve purchasing power."},
 {q:"Your savings account pays 1% and inflation is 3%. Your real return is…",opts:["+4%","-2%","0% — cash is safe","It depends on taxes"],a:1,why:"1% - 3% = -2% real. Cash quietly loses purchasing power."},
 {q:"Your portfolio earns 7% with 3% inflation. Roughly your real gain?",opts:["10%","7%","~4%","-4%"],a:2,why:"Subtract: 7 - 3 is about 4%. Inflation is the hurdle every investment must clear."}
];
var CONTENT={
 ci:{explain:EXPLAIN,expand:EXPAND,simplify:SIMPLIFY,quiz:QUIZ,owned:"Compound interest: owned. Try the simulator to feel the exponent."},
 infl:{explain:EXPLAIN_I,expand:EXPAND_I,simplify:SIMPLIFY_I,quiz:QUIZ_I,owned:"Inflation: owned. Now go check what your savings account actually pays."}
};
function liveChapters(){return CHAPTERS.filter(function(c){return !c.soon;});}
var sim=store.get("sim",{p:10000,r:7,years:30,c:200});
var quizState={i:0,score:0,done:false,answers:{}};
function loadQuiz(){quizState=store.get("quiz-"+cur,{i:0,score:0,done:false,answers:{}});}
function saveQuiz(){store.set("quiz-"+cur,quizState);}
loadQuiz();
var simI=store.get("sim-infl",{amt:100000,i:3,years:30});

function compound(p,r,years,c){
 var bal=p,pts=[Math.round(p)],contrib=p;
 for(var y=1;y<=years;y++){bal=bal*(1+r)+c*12;contrib+=c*12;pts.push(Math.round(bal));}
 var noC=p,ptsNo=[Math.round(p)];
 for(var y2=1;y2<=years;y2++){noC=noC*(1+r);ptsNo.push(Math.round(noC));}
 return {pts:pts,ptsNo:ptsNo,final:Math.round(bal),contrib:Math.round(contrib),growth:Math.round(bal-contrib)};
}

function render(){
 app.innerHTML="";
 K.nav({title:"Living Textbook",sub:"One concept. Five ways to own it — expand, simplify, visualize, simulate, quiz."});
 var hero=K.el('<div class="k-hero"><h2>📖 Chapter '+(liveChapters().findIndex(function(c){return c.id===cur;})+1)+': '+K.esc((CHAPTERS.filter(function(c){return c.id===cur;})[0]||{}).title||"")+'</h2><p>A living chapter adapts to you. Read it straight, go deeper, make it simple, see it, play with it, prove you know it.</p><div class="k-flex" id="chaps" style="margin-top:12px"></div></div>');
 app.appendChild(hero);
 var ch=hero.querySelector("#chaps");
 CHAPTERS.forEach(function(c){
  var d=K.el('<div class="k-card chapter-card'+(c.id===cur?" on":"")+'" style="padding:10px 14px"><b>'+c.icon+' '+K.esc(c.title)+'</b><div class="k-small k-muted">'+(c.soon?"coming soon":c.mins+" min")+'</div></div>');
  if(!c.soon)d.onclick=function(){cur=c.id;store.set("chapter",cur);loadQuiz();render();};
  ch.appendChild(d);
 });
 var tabs=K.el('<div class="k-tabs"></div>');app.appendChild(tabs);
 [["explain","📄 Explain"],["expand","🔬 Expand"],["simplify","🍦 Simplify"],["visual","📊 Visualize"],["simulate","🎛 Simulate"],["quiz","✏️ Quiz"]].forEach(function(m){
  var b=K.el('<button class="k-tab mode-tab'+(mode===m[0]?" on":"")+'">'+m[1]+'</button>');
  b.onclick=function(){mode=m[0];store.set("mode",mode);render();};tabs.appendChild(b);
 });
 var pane=K.el('<div class="k-card" id="pane" style="min-height:300px"></div>');app.appendChild(pane);
 ({explain:renderExplain,expand:renderExpand,simplify:renderSimplify,visual:renderVisual,simulate:renderSim,quiz:renderQuiz})[mode](pane);
}
function renderExplain(p){p.innerHTML=CONTENT[cur].explain;}
function renderExpand(p){p.innerHTML=CONTENT[cur].expand;}
function renderSimplify(p){p.innerHTML=CONTENT[cur].simplify;}
function realValue(amt,i,years){var pts=[],v;for(var t=0;t<=years;t++){v=amt/Math.pow(1+i,t);pts.push(Math.round(v));}return pts;}
function renderVisual(p){
 if(cur==="infl"){
  p.innerHTML='<h3>The melting ice cube</h3><p class="k-muted k-small">$100,000 held as cash at 3% inflation for 30 years — purchasing power vs. the halving line.</p><div id="ch"></div><div class="k-grid" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))" id="kpis"></div>';
  var pts=realValue(100000,0.03,30);
  K.line(p.querySelector("#ch"),[{name:"What $100k buys",color:"#b3382e",points:pts}]);
  K.kpi(p.querySelector("#kpis"),{label:"Buys today",value:K.money(100000)});
  K.kpi(p.querySelector("#kpis"),{label:"Buys in 30 years",value:K.money(pts[30])});
  K.kpi(p.querySelector("#kpis"),{label:"Melted away",value:K.money(100000-pts[30]),delta:K.pct((100000-pts[30])/100000)+" gone"});
  return;
 }
 p.innerHTML='<h3>The curve that bends upward</h3><p class="k-muted k-small">$10,000 at 7% for 30 years — with vs. without $200/month contributions.</p><div id="ch"></div><div class="k-grid" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))" id="kpis"></div>';
 var r=compound(10000,0.07,30,200);
 K.line(p.querySelector("#ch"),[{name:"With $200/mo",color:"#1f6b4a",points:r.pts},{name:"No contributions",color:"#b3382e",points:r.ptsNo}]);
 K.kpi(p.querySelector("#kpis"),{label:"Final value",value:K.money(r.final)});
 K.kpi(p.querySelector("#kpis"),{label:"You put in",value:K.money(r.contrib)});
 K.kpi(p.querySelector("#kpis"),{label:"Growth did",value:K.money(r.growth),delta:K.pct(r.growth/r.final)+" of the total"});
}
function renderSimI(p){
 p.innerHTML='<h3>🎛 Melt the money yourself</h3><p class="k-muted k-small">Drag the inflation rate and watch purchasing power decay. The exponent works against you here.</p><div id="sliders"></div><div class="k-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-top:8px" id="kpis"></div><div id="ch" style="margin-top:8px"></div>';
 var sh=p.querySelector("#sliders");
 function slider(label,key,min,max,step,fmt){
  var row=K.el('<div class="slider-row"><span><b>'+label+'</b></span><input type="range"><b class="val k-mono"></b></div>');
  var inp=row.querySelector("input");inp.min=min;inp.max=max;inp.step=step;inp.value=simI[key];
  function upd(){row.querySelector(".val").textContent=fmt(+inp.value);}
  inp.oninput=function(){simI[key]=+inp.value;store.set("sim-infl",simI);upd();draw();};upd();sh.appendChild(row);
 }
 slider("Cash held","amt",0,500000,5000,function(v){return K.money(v);});
 slider("Inflation rate","i",0.5,12,0.25,function(v){return v+"%";});
 slider("Years","years",1,50,1,function(v){return v+" yrs";});
 function draw(){
  var pts=realValue(simI.amt,simI.i/100,simI.years);
  var kh=p.querySelector("#kpis");kh.innerHTML="";
  K.kpi(kh,{label:"Buys today",value:K.money(simI.amt)});
  K.kpi(kh,{label:"Buys in "+simI.years+" yrs",value:K.money(pts[simI.years])});
  K.kpi(kh,{label:"Coffee then",value:"$"+(5*Math.pow(1+simI.i/100,simI.years)).toFixed(2),delta:"a $5 coffee costs this"});
  K.line(p.querySelector("#ch"),[{name:"Purchasing power",color:"#b3382e",points:pts}]);
 }
 draw();
}
function renderSim(p){
 if(cur==="infl"){renderSimI(p);return;}
 p.innerHTML='<h3>🎛 Play with the math — it\'s all real</h3><div id="sliders"></div><div class="k-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-top:8px" id="kpis"></div><div id="ch" style="margin-top:8px"></div><div id="tbl" style="margin-top:8px"></div>';
 var sh=p.querySelector("#sliders");
 function slider(label,key,min,max,step,fmt){
  var row=K.el('<div class="slider-row"><span><b>'+label+'</b></span><input type="range"><b class="val k-mono"></b></div>');
  var inp=row.querySelector("input");inp.min=min;inp.max=max;inp.step=step;inp.value=sim[key];
  function upd(){row.querySelector(".val").textContent=fmt(+inp.value);}
  inp.oninput=function(){sim[key]=+inp.value;store.set("sim",sim);upd();draw();};upd();sh.appendChild(row);
 }
 slider("Starting amount","p",0,100000,1000,function(v){return K.money(v);});
 slider("Annual return","r",1,15,0.5,function(v){return v+"%";});
 slider("Years","years",1,50,1,function(v){return v+" yrs";});
 slider("Monthly add","c",0,2000,50,function(v){return K.money(v);});
 function draw(){
  var r=compound(sim.p,sim.r/100,sim.years,sim.c);
  var kh=p.querySelector("#kpis");kh.innerHTML="";
  K.kpi(kh,{label:"Final value",value:K.money(r.final)});
  K.kpi(kh,{label:"Total contributed",value:K.money(r.contrib)});
  K.kpi(kh,{label:"Growth",value:K.money(r.growth),delta:K.pct(r.final?r.growth/r.final:0)+" of total"});
  K.line(p.querySelector("#ch"),[{name:"Balance",color:"#1f6b4a",points:r.pts},{name:"Contributions",color:"#e8a020",points:r.pts.map(function(_,i){return Math.round(sim.p+sim.c*12*i);})}]);
  var rows=[];for(var y=0;y<=sim.years;y+=Math.max(1,Math.round(sim.years/10)))rows.push({Year:y,Balance:K.money(r.pts[y])});
  if(rows[rows.length-1].Year!==sim.years)rows.push({Year:sim.years,Balance:K.money(r.pts[sim.years])});
  K.table(p.querySelector("#tbl"),[{key:"Year",label:"Year",num:true},{key:"Balance",label:"Balance",num:true}],rows);
 }
 draw();
}
function renderQuiz(p){
 var QZ=CONTENT[cur].quiz;
 if(quizState.done){
  p.innerHTML='<div style="text-align:center;padding:24px"><div style="font-size:44px">'+(quizState.score>=Math.ceil(QZ.length*0.7)?"🎓":"📖")+'</div><h2>'+quizState.score+' / '+QZ.length+'</h2><p class="k-muted">'+(quizState.score>=Math.ceil(QZ.length*0.7)?K.esc(CONTENT[cur].owned):"One more read of Expand mode and you'll have it.")+'</p><button class="k-btn" id="rq">Retake</button></div>';
  p.querySelector("#rq").onclick=function(){quizState={i:0,score:0,done:false,answers:{}};saveQuiz();render();};
  return;
 }
 var i=quizState.i,q=QZ[i];
 p.innerHTML='<div class="k-small k-muted">Question '+(i+1)+' of '+QZ.length+' · score '+quizState.score+'</div><h3>'+K.esc(q.q)+'</h3><div id="opts"></div><div id="fb"></div>';
 var oh=p.querySelector("#opts");
 q.opts.forEach(function(o,oi){
  var d=K.el('<div class="quiz-opt"></div>');d.textContent=o;
  d.onclick=function(){
   oh.querySelectorAll(".quiz-opt").forEach(function(x,xi){if(xi===q.a)x.classList.add("right");else if(xi===oi)x.classList.add("wrong");x.style.pointerEvents="none";});
   var ok=oi===q.a;if(ok)quizState.score++;
   p.querySelector("#fb").innerHTML='<div class="k-note" style="border-left-color:'+(ok?"var(--good)":"var(--bad)")+'"><b>'+(ok?"Correct. ":"Not quite. ")+'</b>'+q.why+'</div><div style="margin-top:10px"><button class="k-btn k-primary" id="nq">'+(i+1===QZ.length?"See results":"Next →")+'</button></div>';
   p.querySelector("#nq").onclick=function(){quizState.i++;if(quizState.i>=QZ.length)quizState.done=true;saveQuiz();render();};
  };
  oh.appendChild(d);
 });
}
render();
})();

</script>
