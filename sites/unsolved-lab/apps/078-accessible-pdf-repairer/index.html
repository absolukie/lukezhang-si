<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A11y Fixer</title>
<link rel="stylesheet" href="../../shared/kit.css">
<style>
/* Common kit-fallback styles. Per-app palette vars are overridden in app.css. */
:root{
--bg:#f7f5f0;--panel:#ffffff;--panel2:#f1ede4;--ink:#23211c;--muted:#6f6a5e;
--line:#e2dccf;--accent:#b5542a;--accent2:#e8a020;--good:#2e7d4f;--warn:#b7791f;--bad:#b3382e;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
line-height:1.55}
.k-wrap{max-width:1120px;margin:0 auto;padding:20px 18px 64px}
.k-nav{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.k-nav-in{max-width:1120px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.k-nav-t{margin:0;font-size:22px;letter-spacing:.2px}
.k-nav-s{margin:2px 0 0;color:var(--muted);font-size:13px}
.k-nav-a{display:flex;gap:8px;flex-wrap:wrap}
.k-hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px;margin:18px 0}
.k-hero h2{margin:0 0 6px;font-size:26px}
.k-hero p{margin:0;color:var(--muted)}
.k-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}
.k-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.k-card h3{margin:0 0 8px;font-size:16px}
.k-muted{color:var(--muted)}.k-small{font-size:13px}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.k-split{grid-template-columns:1fr}}
.k-btn{display:inline-block;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
.k-btn:hover{filter:brightness(.97)}
.k-btn.k-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.k-input,.k-select,textarea.k-input{width:100%;border:1px solid var(--line);border-radius:9px;
padding:10px 12px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit}
textarea.k-input{min-height:88px;resize:vertical}
label.k-label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;
padding:8px 10px;border-bottom:2px solid var(--line)}
.k-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.k-table tr:hover td{background:var(--panel2)}
.k-badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;
background:var(--panel2);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.k-badge.ok{background:#e4f2e9;color:#1e6b3e;border-color:#bfe0c9}
.k-badge.warn{background:#fbf0da;color:#8a5a12;border-color:#ecd9ab}
.k-badge.bad{background:#fbe7e4;color:#a02c22;border-color:#f0c4bd}
.k-badge.info{background:#e3eefb;color:#2456a6;border-color:#c3d8f2}
.k-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.k-tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;
font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.k-tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.k-kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.k-kpi .k-kpi-l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.k-kpi .k-kpi-v{font-size:26px;font-weight:800;margin-top:2px}
.k-kpi .k-kpi-d{font-size:13px;color:var(--muted)}
.k-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);
padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:99;max-width:90vw}
.k-toast.show{opacity:1;transform:translate(-50%,0)}
.k-toast.good{background:var(--good)}.k-toast.bad{background:var(--bad)}
.k-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:90;padding:18px}
.k-modal{background:var(--panel);border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:22px}
.k-modal h3{margin:0 0 10px}
.k-modal-f{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.k-empty{text-align:center;padding:44px 20px;color:var(--muted)}
.k-empty h3{color:var(--ink);margin:0 0 6px}
.k-bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.k-bar-l{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-bar-t{flex:1;background:var(--panel2);border-radius:6px;height:14px;overflow:hidden}
.k-bar-f{height:100%;border-radius:6px;background:var(--accent)}
.k-bar-v{width:56px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.k-tl{position:relative;margin:14px 0;padding-left:26px}
.k-tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.k-tl-ev{position:relative;margin:0 0 16px}
.k-tl-ev:before{content:"";position:absolute;left:-24px;top:5px;width:12px;height:12px;border-radius:50%;
background:var(--accent);border:2px solid var(--panel)}
.k-tl-ev .k-tl-t{font-weight:700}
.k-tl-ev .k-tl-b{color:var(--muted);font-size:13px}
.k-graph{width:100%;overflow:auto}
.k-klist{list-style:none;margin:0;padding:0}
.k-klist li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.k-klist li:last-child{border-bottom:0}
.k-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.k-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.k-note{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);
border-radius:0 10px 10px 0;padding:12px 16px;margin:14px 0;font-size:14px}
.k-quiz-opt{display:block;width:100%;text-align:left;margin:8px 0}
.k-quiz-opt.picked{outline:2px solid var(--accent)}
.k-quiz-opt.right{outline:2px solid var(--good)}
.k-quiz-opt.wrong{outline:2px solid var(--bad)}
@media(max-width:640px){.k-bar-l{width:104px}.k-wrap{padding:14px 12px 48px}}

:root{
--bg:#ffffff;--panel:#ffffff;--panel2:#f4f4f4;--ink:#111111;--muted:#555555;
--line:#111111;--accent:#0b5fff;--accent2:#ffd400;--good:#0a7d2c;--warn:#b7791f;--bad:#c81e1e;
}
body{font-size:16px}
.k-btn,.k-input{border-width:2px}
.scan{background:#fafafa;border:3px solid var(--ink);border-radius:6px;padding:18px;position:relative;min-height:420px}
.scan-block{border:2px dashed #999;border-radius:6px;padding:10px 12px;margin:10px 0;background:#fff;position:relative;font-size:14px}
.scan-block .ord{position:absolute;top:-13px;left:10px;background:var(--bad);color:#fff;font-weight:800;font-size:12px;border-radius:999px;padding:2px 10px}
.scan-block .ord.fixed{background:var(--good)}
.tag-tree{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.tag-row{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:6px;cursor:pointer}
.tag-row:hover{background:#eef4ff}
.tag-row.sel{background:#dbe9ff;outline:2px solid var(--accent)}
.tag-name{font-weight:800;color:var(--accent);min-width:64px}
.tag-ord{background:var(--ink);color:#fff;border-radius:6px;font-size:12px;font-weight:800;padding:1px 8px}
.step-log{background:#111;color:#e8e8e8;border-radius:10px;padding:16px 18px;font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:150px}
.step-log .ok{color:#5be37a}.step-log .run{color:var(--accent2)}
.hl{outline:4px solid var(--accent2)!important;background:#fffbe0!important}
.issue-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #ddd;font-size:14px}
.focus-ring-demo:focus{outline:4px solid var(--accent);outline-offset:2px}
.big-touch{min-height:48px;min-width:48px}
.sr-voice{background:#111;color:#e8e8e8;border-radius:10px;padding:14px 16px;font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:110px;margin-top:10px;line-height:1.7}
.sr-voice .spk{color:var(--accent2);font-weight:700}

</style>
</head>

c.setAttribute("fill",n.color||"#0e7c7c");c.setAttribute("stroke","#fff");c.setAttribute("stroke-width","3");gEl.appendChild(c);
var t=document.createElementNS(ns,"text");t.setAttribute("x",p.x);t.setAttribute("y",p.y+38);t.setAttribute("text-anchor","middle");
t.setAttribute("font-size","11");t.setAttribute("font-weight","700");t.setAttribute("fill","currentColor");t.textContent=n.label;gEl.appendChild(t);
if(n.sub){var s=document.createElementNS(ns,"text");s.setAttribute("x",p.x);s.setAttribute("y",p.y+52);s.setAttribute("text-anchor","middle");
s.setAttribute("font-size","10");s.setAttribute("fill","rgba(0,0,0,.55)");s.textContent=n.sub;gEl.appendChild(s);}
if(n.onClick)gEl.addEventListener("click",function(){n.onClick(n);});
svg.appendChild(gEl);});
var wrap=this.el('<div class="k-graph"></div>');wrap.appendChild(svg);host.appendChild(wrap);},
badge:function(txt,kind){return '<span class="k-badge '+(kind||"")+'">'+this.esc(txt)+'</span>';},
kpi:function(host,o){var d=this.el('<div class="k-kpi"><div class="k-kpi-l"></div><div class="k-kpi-v"></div><div class="k-kpi-d"></div></div>');
d.querySelector(".k-kpi-l").textContent=o.label||"";d.querySelector(".k-kpi-v").innerHTML=o.value||"";
d.querySelector(".k-kpi-d").textContent=o.delta||"";host.appendChild(d);},
empty:function(host,title,sub,al,fn){var d=this.el('<div class="k-empty"><h3></h3><p></p></div>');
d.querySelector("h3").textContent=title||"";d.querySelector("p").textContent=sub||"";
if(al){var b=document.createElement("button");b.className="k-btn k-primary";b.textContent=al;b.onclick=fn;d.appendChild(b);}
host.appendChild(d);},
money:function(n){return "$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});},
num:function(n){return Number(n).toLocaleString("en-US");},
pct:function(x){return (x*100).toFixed(1)+"%";},
when:function(d){try{return new Date(d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}catch(e){return String(d);}},
initials:function(name){return String(name||"").split(/\s+/).map(function(w){return w[0];}).join("").slice(0,2).toUpperCase();},
copy:function(txt){var self=this;function done(){self.toast("Copied to clipboard","good");}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,done);}else{var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}ta.remove();done();}}
};
if(!window.Kit)window.Kit=Kit;else{for(var k in Kit){if(!window.Kit[k])window.Kit[k]=Kit[k];}}
})();

</script>
<script>
/* A11y Fixer — turn inaccessible PDFs into properly structured accessible documents. */
(function(){
"use strict";
var K=window.Kit, app=document.getElementById("app");
var store=K.store("a11y-fixer-v1");

/* Simulated scanned doc: blocks in the WRONG detected order (column-major scramble). */
var BLOCKS=[
 {id:"b1",kind:"text",label:"Column 2, paragraph 2",text:"…continued from page 1. The committee voted 7–2 to approve the budget, with the dissent focused on travel costs."},
 {id:"b2",kind:"image",label:"Photo (no alt text)",text:"[ scanned photo: team at whiteboard ]"},
 {id:"b3",kind:"title",label:"Document title",text:"Q3 Community Garden Report"},
 {id:"b4",kind:"text",label:"Column 1, paragraph 1",text:"Harvest totals rose 34% this quarter. Tomatoes led at 412 lbs, followed by zucchini at 288 lbs."},
 {id:"b5",kind:"table",label:"Data table (no headers)",text:"Tomatoes | 412 · Zucchini | 288 · Peppers | 156"},
 {id:"b6",kind:"text",label:"Column 1, paragraph 2",text:"Volunteer hours held steady at 1,140. New compost bins arrive in November."},
 {id:"b7",kind:"text",label:"Column 2, paragraph 1",text:"The fall planting schedule is posted on the shed door. Sign up for watering shifts by Friday."}
];
/* Correct reading order by block id. */
var CORRECT=["b3","b4","b6","b7","b1","b5","b2"];
var TAGS={b3:"H1",b4:"P",b6:"P",b7:"P",b1:"P",b5:"Table",b2:"Figure"};
var FIXES={
 b3:"Promoted to <H1> — document title identified by size/position analysis.",
 b4:"Tagged <P> under H1. Hyphenation artifacts removed.",
 b6:"Tagged <P>. Merged split paragraph across column break.",
 b7:"Tagged <P>. Reading order corrected: column 1 completes before column 2.",
 b1:"Tagged <P>. Orphaned continuation re-attached to its paragraph.",
 b5:"Tagged <Table> with <TH> scope='col' headers; reading order row-major.",
 b2:"Tagged <Figure> with alt text: 'Six volunteers planning beds at a whiteboard, July.'"
};
var ISSUES=[
 {issue:"Document has no tag structure",sev:"Critical",fix:"Full tag tree generated: H1 → 5×P, Table, Figure."},
 {issue:"Reading order scrambled (column-major)",sev:"Critical",fix:"Re-sequenced to logical column reading order; verified against text flow."},
 {issue:"Image missing alternative text",sev:"Serious",fix:"Alt text authored from image content analysis."},
 {issue:"Data table has no header cells",sev:"Serious",fix:"First row promoted to <TH scope='col'>."},
 {issue:"No language declared",sev:"Moderate",fix:"Set lang='en-US' at document root."},
 {issue:"Scanned text has no Unicode mapping",sev:"Moderate",fix:"OCR re-run with Unicode output; ligatures normalized."}
];
var state=store.get("state",{repaired:false,log:[]});

function render(){
 app.innerHTML="";
 K.nav({title:"A11y Fixer",sub:"Upload an inaccessible PDF. Get back a properly tagged, screen-reader-ready document."});
 var hero=K.el('<div class="k-hero"><h2>♿ From flat scan to structured document</h2><p>This demo simulates a scanned two-column PDF — no tags, scrambled reading order, a table without headers, an image without alt text. Hit <b>Run repair</b> and watch each issue get fixed, in order.</p><div class="k-flex" style="margin-top:12px"><button class="k-btn k-primary big-touch" data-core id="run">🔧 Run repair</button><button class="k-btn big-touch" id="reset">Reset demo</button><span class="k-small k-muted" id="st"></span></div></div>');
 app.appendChild(hero);
 hero.querySelector("#run").onclick=runRepair;
 hero.querySelector("#reset").onclick=function(){state={repaired:false,log:[]};store.set("state",state);render();};
 var st=hero.querySelector("#st");
 st.textContent=state.repaired?"✅ Repair complete — "+ISSUES.length+" issues fixed":"⏳ Not repaired yet";

 var split=K.el('<div class="k-split" style="align-items:start"></div>');app.appendChild(split);
 var left=K.el('<div class="k-card"><h3>📄 Source scan <span class="k-small k-muted">— detected order (wrong)</span></h3><div class="scan" id="scan"></div></div>');
 split.appendChild(left);
 drawScan(left.querySelector("#scan"));
 var right=K.el('<div class="k-card"><h3>🏷 Repaired tag structure</h3><div id="tags"></div></div>');
 split.appendChild(right);
 drawTags(right.querySelector("#tags"));

 var bottom=K.el('<div class="k-split" style="margin-top:14px;align-items:start"></div>');app.appendChild(bottom);
 var logC=K.el('<div class="k-card"><h3>🔧 Repair log</h3><div class="step-log" id="log"></div></div>');
 bottom.appendChild(logC);
 drawLog(logC.querySelector("#log"));
 var issC=K.el('<div class="k-card"><h3>🚨 Issues found</h3><div id="iss"></div><div style="margin-top:10px"><button class="k-btn" id="copyrep">Copy accessibility report</button></div></div>');
 bottom.appendChild(issC);
 drawIssues(issC.querySelector("#iss"));
 issC.querySelector("#copyrep").onclick=function(){
  K.copy("A11Y REPAIR REPORT\nStatus: "+(state.repaired?"REPAIRED":"NOT REPAIRED")+"\n\nIssues:\n"+ISSUES.map(function(x){return "• ["+x.sev+"] "+x.issue+(state.repaired?" → "+x.fix:"");}).join("\n")+(state.repaired?"\n\nReading order: "+CORRECT.map(function(id,i){return (i+1)+". "+tagLabel(id);}).join(" | "):""));
 };
}
function tagLabel(id){var b=BLOCKS.filter(function(x){return x.id===id;})[0];return TAGS[id]+" — "+b.label;}
function drawScan(host){
 host.innerHTML="";
 BLOCKS.forEach(function(b,i){
  var d=K.el('<div class="scan-block" data-id="'+b.id+'"><span class="ord'+(state.repaired?" fixed":"")+'">'+(state.repaired?(CORRECT.indexOf(b.id)+1):(i+1))+'</span><div class="k-small k-muted">'+K.esc(b.label)+'</div><div>'+K.esc(b.text)+'</div></div>');
  host.appendChild(d);
 });
 if(!state.repaired)host.insertAdjacentHTML("afterbegin",'<div class="k-note" style="border-left-color:var(--bad)"><b>⚠️ Screen reader experience:</b> reads column 2\'s ending <i>before</i> the title — the document is gibberish.</div>');
 var ctl=K.el('<div style="margin-top:12px"><button class="k-btn big-touch" id="srbtn">'+(state.repaired?'\u25b6 Hear the screen reader (fixed)':'\u25b6 Hear what a screen reader says now')+'</button><div class="sr-voice" id="srvoice"><span style="color:#888">Press play to hear this document through a screen reader\u2019s voice.</span></div></div>');
 host.appendChild(ctl);
 var srRun=0;
 ctl.querySelector('#srbtn').onclick=function(){
  var my=++srRun;var box=ctl.querySelector('#srvoice');box.innerHTML='<span class="spk">Screen reader:</span> ';
  var order=state.repaired?CORRECT:BLOCKS.map(function(b){return b.id;});
  var bi=0;
  function nextBlock(){
   if(my!==srRun)return;
   if(bi>=order.length){box.innerHTML+='<br><span class="spk">\u2014 end of document</span>';return;}
   var b=BLOCKS.filter(function(x){return x.id===order[bi];})[0];
   var text=((state.repaired?(bi+1)+'. '+TAGS[b.id]+': ':'')+b.text+' ');bi++;var ci=0;
   function tick(){
    if(my!==srRun)return;
    if(ci<text.length){box.innerHTML+=K.esc(text[ci]);ci++;setTimeout(tick,22);}
    else{box.innerHTML+='<br>';setTimeout(nextBlock,350);}
   }
   tick();
  }
  nextBlock();
 };
}
function drawTags(host){
 host.innerHTML="";
 if(!state.repaired){K.empty(host,"Not repaired yet","Run the repair to generate the tag tree.");return;}
 host.innerHTML='<div class="k-small k-muted" style="margin-bottom:8px">Click a tag to highlight its region in the scan. Green numbers = verified reading order.</div>';
 var tree=K.el('<div class="tag-tree"></div>');host.appendChild(tree);
 var root=K.el('<div class="tag-row"><span class="tag-name">&lt;Document&gt;</span><span class="k-small k-muted">lang="en-US"</span></div>');
 tree.appendChild(root);
 CORRECT.forEach(function(id,i){
  var b=BLOCKS.filter(function(x){return x.id===id;})[0];
  var row=K.el('<div class="tag-row" style="padding-left:'+(id==="b3"?18:34)+'px"><span class="tag-ord">'+(i+1)+'</span><span class="tag-name">&lt;'+TAGS[id]+'&gt;</span><span class="k-small">'+K.esc(b.label)+'</span></div>');
  row.title=FIXES[id];
  row.onclick=function(){
   tree.querySelectorAll(".tag-row").forEach(function(x){x.classList.remove("sel");});
   row.classList.add("sel");
   document.querySelectorAll(".scan-block").forEach(function(x){x.classList.toggle("hl",x.dataset.id===id);});
   K.toast(FIXES[id],"good");
  };
  tree.appendChild(row);
 });
}
function drawLog(host){
 host.innerHTML="";
 if(!state.log.length){host.innerHTML='<span style="color:#888">Repair steps will appear here…</span>';return;}
 state.log.forEach(function(l){host.innerHTML+='<div class="'+(l.ok?"ok":"run")+'">'+K.esc(l.t)+'</div>';});
 host.scrollTop=host.scrollHeight;
}
function drawIssues(host){
 host.innerHTML="";
 ISSUES.forEach(function(x){
  var kind=x.sev==="Critical"?"bad":x.sev==="Serious"?"warn":"info";
  var fixed=state.repaired;
  host.innerHTML+='<div class="issue-row"><span style="font-size:18px">'+(fixed?"✅":"🚨")+'</span><span><b>'+K.esc(x.issue)+'</b> '+K.badge(x.sev,kind)+'<br><span class="k-small k-muted">'+(fixed?K.esc(x.fix):"not fixed yet")+'</span></span></div>';
 });
}
function runRepair(){
 if(state.repaired){K.toast("Already repaired — reset to run again");return;}
 state.log=[];store.set("state",state);render();
 var steps=[
  "▸ Analyzing page geometry… 2 columns detected",
  "✓ Column reading order mapped (left column completes first)",
  "▸ Running OCR with Unicode mapping… 1,204 glyphs recognized",
  "✓ Title identified (largest type, top of column 1) → <H1>",
  "✓ 5 text blocks tagged <P>; hyphenation artifacts cleaned",
  "▸ Table detected: 3 rows × 2 cols, no headers",
  "✓ First row promoted to <TH scope='col'>",
  "▸ Image region found without alt text",
  "✓ Alt text authored: 'Six volunteers planning beds at a whiteboard, July.'",
  "✓ lang='en-US' set; tag tree validated against PDF/UA",
  "✅ REPAIR COMPLETE — reading order verified, 6/6 issues fixed"
 ];
 var logEl=document.getElementById("log");
 var i=0;
 function next(){
  if(i>=steps.length){
   state.repaired=true;store.set("state",state);render();
   K.toast("Document repaired — tag structure ready","good");return;
  }
  var ok=steps[i].indexOf("✓")===0||steps[i].indexOf("✅")===0;
  state.log.push({t:steps[i],ok:ok});store.set("state",state);
  if(logEl){logEl.innerHTML+='<div class="'+(ok?"ok":"run")+'">'+K.esc(steps[i])+'</div>';logEl.scrollTop=logEl.scrollHeight;}
  i++;setTimeout(next,420);
 }
 next();
}
render();
})();

</script>
