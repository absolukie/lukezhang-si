<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calm Browser</title>
<link rel="stylesheet" href="../../shared/kit.css">
<style>
/* Common kit-fallback styles. Per-app palette vars are overridden in app.css. */
:root{
--bg:#f7f5f0;--panel:#ffffff;--panel2:#f1ede4;--ink:#23211c;--muted:#6f6a5e;
--line:#e2dccf;--accent:#b5542a;--accent2:#e8a020;--good:#2e7d4f;--warn:#b7791f;--bad:#b3382e;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
line-height:1.55}
.k-wrap{max-width:1120px;margin:0 auto;padding:20px 18px 64px}
.k-nav{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.k-nav-in{max-width:1120px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.k-nav-t{margin:0;font-size:22px;letter-spacing:.2px}
.k-nav-s{margin:2px 0 0;color:var(--muted);font-size:13px}
.k-nav-a{display:flex;gap:8px;flex-wrap:wrap}
.k-hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px;margin:18px 0}
.k-hero h2{margin:0 0 6px;font-size:26px}
.k-hero p{margin:0;color:var(--muted)}
.k-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}
.k-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.k-card h3{margin:0 0 8px;font-size:16px}
.k-muted{color:var(--muted)}.k-small{font-size:13px}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.k-split{grid-template-columns:1fr}}
.k-btn{display:inline-block;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
.k-btn:hover{filter:brightness(.97)}
.k-btn.k-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.k-input,.k-select,textarea.k-input{width:100%;border:1px solid var(--line);border-radius:9px;
padding:10px 12px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit}
textarea.k-input{min-height:88px;resize:vertical}
label.k-label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;
padding:8px 10px;border-bottom:2px solid var(--line)}
.k-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.k-table tr:hover td{background:var(--panel2)}
.k-badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;
background:var(--panel2);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.k-badge.ok{background:#e4f2e9;color:#1e6b3e;border-color:#bfe0c9}
.k-badge.warn{background:#fbf0da;color:#8a5a12;border-color:#ecd9ab}
.k-badge.bad{background:#fbe7e4;color:#a02c22;border-color:#f0c4bd}
.k-badge.info{background:#e3eefb;color:#2456a6;border-color:#c3d8f2}
.k-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.k-tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;
font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.k-tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.k-kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.k-kpi .k-kpi-l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.k-kpi .k-kpi-v{font-size:26px;font-weight:800;margin-top:2px}
.k-kpi .k-kpi-d{font-size:13px;color:var(--muted)}
.k-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);
padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:99;max-width:90vw}
.k-toast.show{opacity:1;transform:translate(-50%,0)}
.k-toast.good{background:var(--good)}.k-toast.bad{background:var(--bad)}
.k-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:90;padding:18px}
.k-modal{background:var(--panel);border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:22px}
.k-modal h3{margin:0 0 10px}
.k-modal-f{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.k-empty{text-align:center;padding:44px 20px;color:var(--muted)}
.k-empty h3{color:var(--ink);margin:0 0 6px}
.k-bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.k-bar-l{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-bar-t{flex:1;background:var(--panel2);border-radius:6px;height:14px;overflow:hidden}
.k-bar-f{height:100%;border-radius:6px;background:var(--accent)}
.k-bar-v{width:56px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.k-tl{position:relative;margin:14px 0;padding-left:26px}
.k-tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.k-tl-ev{position:relative;margin:0 0 16px}
.k-tl-ev:before{content:"";position:absolute;left:-24px;top:5px;width:12px;height:12px;border-radius:50%;
background:var(--accent);border:2px solid var(--panel)}
.k-tl-ev .k-tl-t{font-weight:700}
.k-tl-ev .k-tl-b{color:var(--muted);font-size:13px}
.k-graph{width:100%;overflow:auto}
.k-klist{list-style:none;margin:0;padding:0}
.k-klist li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.k-klist li:last-child{border-bottom:0}
.k-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.k-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.k-note{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);
border-radius:0 10px 10px 0;padding:12px 16px;margin:14px 0;font-size:14px}
.k-quiz-opt{display:block;width:100%;text-align:left;margin:8px 0}
.k-quiz-opt.picked{outline:2px solid var(--accent)}
.k-quiz-opt.right{outline:2px solid var(--good)}
.k-quiz-opt.wrong{outline:2px solid var(--bad)}
@media(max-width:640px){.k-bar-l{width:104px}.k-wrap{padding:14px 12px 48px}}

:root{
--bg:#f2f5f1;--panel:#ffffff;--panel2:#e7efe7;--ink:#233026;--muted:#6c7f70;
--line:#d4e0d4;--accent:#4a7c59;--accent2:#8fb996;--good:#2e7d4f;--warn:#b7791f;--bad:#b3382e;
}
.clutter{background:#fff;border:2px solid #ccc;border-radius:8px;padding:14px;position:relative;font-size:13px;max-height:560px;overflow:auto}
.clutter .popup{position:absolute;background:#fffbe6;border:2px solid #e8a020;border-radius:8px;padding:10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:5}
.clutter .banner{background:#b3382e;color:#fff;border-radius:6px;padding:8px 10px;margin:6px 0;font-weight:700}
.clutter .upsell{border:2px dashed #b5542a;border-radius:8px;padding:8px;margin:6px 0;background:#fdf6ec}
.clutter input{border:1px solid #bbb;border-radius:4px;padding:6px;font-size:13px;width:100%;margin:3px 0}
.strike{position:relative}
.strike:after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:3px;background:var(--bad);transform:rotate(-4deg)}
.step-dots{display:flex;gap:8px;margin:14px 0}
.step-dot{flex:1;height:8px;border-radius:5px;background:var(--line)}
.step-dot.on{background:var(--accent)}
.step-dot.done{background:var(--accent2)}
.calm-step h3{margin-top:0;font-size:20px}
.calm-field{margin:12px 0}
.field-err{color:var(--bad);font-size:13px;display:none}
.breath{text-align:center;padding:30px 10px;color:var(--muted)}
.breath .circle{width:90px;height:90px;border-radius:50%;background:var(--accent2);margin:0 auto 12px;animation:pulse 4s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.15);opacity:1}}
.distraction{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}

</style>
</head>
<body>
<div class="k-wrap" id="app"></div>

<script src="../../shared/kit.js"></script>

},
bars:function(host,items){host.innerHTML="";var max=0;items.forEach(function(i){if(i.value>max)max=i.value;});

line:function(host,series,opt){opt=opt||{};host.innerHTML="";var W=560,H=240,pad=34;

donut:function(host,items){host.innerHTML="";var R=70,r=46,cx=90,cy=90;var tot=0;items.forEach(function(i){tot+=i.value;});

var W=620,rowH=64;var levels={};nodes.forEach(function(n){var l=n.level||0;levels[l]=levels[l]||[];levels[l].push(n);});

var t=document.createElementNS(ns,"text");t.setAttribute("x",p.x);t.setAttribute("y",p.y+38);t.setAttribute("text-anchor","middle");
t.setAttribute("font-size","11");t.setAttribute("font-weight","700");t.setAttribute("fill","currentColor");t.textContent=n.label;gEl.appendChild(t);
if(n.sub){var s=document.createElementNS(ns,"text");s.setAttribute("x",p.x);s.setAttribute("y",p.y+52);s.setAttribute("text-anchor","middle");
s.setAttribute("font-size","10");s.setAttribute("fill","rgba(0,0,0,.55)");s.textContent=n.sub;gEl.appendChild(s);}
if(n.onClick)gEl.addEventListener("click",function(){n.onClick(n);});
svg.appendChild(gEl);});
var wrap=this.el('<div class="k-graph"></div>');wrap.appendChild(svg);host.appendChild(wrap);},
badge:function(txt,kind){return '<span class="k-badge '+(kind||"")+'">'+this.esc(txt)+'</span>';},
kpi:function(host,o){var d=this.el('<div class="k-kpi"><div class="k-kpi-l"></div><div class="k-kpi-v"></div><div class="k-kpi-d"></div></div>');
d.querySelector(".k-kpi-l").textContent=o.label||"";d.querySelector(".k-kpi-v").innerHTML=o.value||"";
d.querySelector(".k-kpi-d").textContent=o.delta||"";host.appendChild(d);},
empty:function(host,title,sub,al,fn){var d=this.el('<div class="k-empty"><h3></h3><p></p></div>');
d.querySelector("h3").textContent=title||"";d.querySelector("p").textContent=sub||"";
if(al){var b=document.createElement("button");b.className="k-btn k-primary";b.textContent=al;b.onclick=fn;d.appendChild(b);}
host.appendChild(d);},
money:function(n){return "$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});},
num:function(n){return Number(n).toLocaleString("en-US");},
pct:function(x){return (x*100).toFixed(1)+"%";},
when:function(d){try{return new Date(d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}catch(e){return String(d);}},
initials:function(name){return String(name||"").split(/\s+/).map(function(w){return w[0];}).join("").slice(0,2).toUpperCase();},
copy:function(txt){var self=this;function done(){self.toast("Copied to clipboard","good");}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,done);}else{var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}ta.remove();done();}}
};
if(!window.Kit)window.Kit=Kit;else{for(var k in Kit){if(!window.Kit[k])window.Kit[k]=Kit[k];}}
})();

</script>
<script>
/* Calm Browser — simplify complicated websites into focused workflows. */
(function(){
"use strict";
var K=window.Kit, app=document.getElementById("app");
var store=K.store("calm-browser-v1");

var CART=[
 {name:"Everyday Ceramic Mug — Sand",qty:2,price:24},
 {name:"Pour-Over Dripper Set",qty:1,price:38},
 {name:"Organic Coffee Beans 2lb",qty:1,price:29}
];
var DISTRACTIONS=[
 ["⏰ Fake urgency timer","'Only 2 left!' resets on every reload"],
 ["📧 Newsletter popup","Blocks the page 3 seconds after load"],
 ["💬 Chat widget","'Hi! Can I help?' ×3 per session"],
 ["🎁 Upsell carousel","'Frequently bought together' ×6 items"],
 ["⭐ Review nag","Rate us before you've bought anything"],
 ["📦 Shipping upsell","'Add $4.99 insurance?' pre-checked"],
 ["🏷 Coupon tease","'Psst… a code exists somewhere'"],
 ["📱 App banner","'Continue in our app instead'"],
 ["🎡 Spin-to-win wheel","Email for 10% off (spam forever)"],
 ["👥 Social proof ticker","'Maya from Ohio just bought…'"],
 ["➕ Warranty upsell","$12.99 protection on a $24 mug"],
 ["🔔 Push notification ask","Before you've even checked out"]
];
var calm=store.get("calm",false);
var step=store.get("step",0);
var form=store.get("form",{name:"Jordan Lee",addr:"456 Oak Ave #12",city:"Riverton",zip:"94025",card:"4242 4242 4242 4242",exp:"12/28",cvc:"123"});
var doneOrder=store.get("doneOrder",null);

function cartTotal(){return CART.reduce(function(a,i){return a+i.qty*i.price;},0);}

function render(){
 app.innerHTML="";
 var oldNav=document.querySelector("header.k-nav");if(oldNav)oldNav.remove();
 K.nav({title:"Calm Browser",sub:"The web, minus the noise. One task, one calm screen at a time."});
 var hero=K.el('<div class="k-hero"><h2>🍃 Checkout, without the chaos</h2><p>Left: a typical checkout — 12 distractions fighting for your attention. Hit <b>Simplify</b> and Calm Browser reduces it to 4 focused steps. Nothing to buy, nothing to dismiss, nothing shouting.</p><div class="k-flex" style="margin-top:12px"><button class="k-btn k-primary" id="toggle" data-core>'+(calm?"😵 Show me the chaos again":"✨ Simplify this page")+'</button>'+(calm?'<span class="k-badge ok">calm mode · 12 distractions removed</span>':"")+'</div></div>');
 app.appendChild(hero);
 hero.querySelector("#toggle").onclick=function(){calm=!calm;store.set("calm",calm);if(calm){step=0;store.set("step",0);}render();window.scrollTo(0,0);};
 if(!calm)renderClutter();else renderCalm();
}
function renderClutter(){
 var wrap=K.el('<div class="k-split" style="align-items:start"></div>');app.appendChild(wrap);
 var c=K.el('<div class="clutter" id="cl"></div>');wrap.appendChild(c);
 c.innerHTML=
  '<div class="banner">⏰ HURRY! Only <b>2 left</b> in stock! Sale ends in <span id="cd">04:59</span>!!</div>'+
  '<div class="popup" style="top:70px;right:14px;width:220px">📧 <b>WAIT!</b> Get 10% off — just give us your email!<br><input placeholder="email"><button class="k-btn" style="font-size:12px;margin-top:6px">No thanks, I hate savings</button></div>'+
  '<h3 style="margin:8px 0">Checkout <span class="k-small" style="color:#888">(MegaMart™)</span></h3>'+
  '<div class="upsell">🎡 <b>SPIN TO WIN!</b> Spin the wheel for a mystery discount!!</div>'+
  CART.map(function(i){return '<div style="border:1px solid #ddd;border-radius:6px;padding:8px;margin:6px 0"><b>'+K.esc(i.name)+'</b> × '+i.qty+' — '+K.money(i.qty*i.price)+'<br><span class="k-small" style="color:#b5542a">➕ Add $12.99 protection plan? <input type="checkbox" checked style="width:auto"> yes</span></div>';}).join("")+
  '<div class="upsell">🎁 <b>Frequently bought together:</b> +6 more items you didn\'t ask for <button class="k-btn" style="font-size:12px">Add all $84.00</button></div>'+
  '<div class="k-small" style="color:#888">👥 Maya from Ohio just bought this! · 👥 Tom from Texas just bought this!</div>'+
  '<h4>Shipping (12 fields)</h4><input placeholder="First name"><input placeholder="Last name"><input placeholder="Address"><input placeholder="Address 2 (optional)"><input placeholder="City"><input placeholder="State"><input placeholder="ZIP"><input placeholder="Phone (for SMS spam)">'+
  '<div class="upsell">📦 <input type="checkbox" checked style="width:auto"> Add shipping insurance $4.99 (recommended!!)</div>'+
  '<h4>Payment</h4><input placeholder="Card number"><input placeholder="Expiry"><input placeholder="CVC"><input placeholder="Name on card"><input placeholder="Billing ZIP">'+
  '<div class="upsell">🏷 Have a coupon? <i>Psst — try WELCOME10… or is it SAVE10? Good luck.</i></div>'+
  '<button class="k-btn k-primary" style="width:100%;margin-top:10px;font-size:16px">PLACE ORDER — '+K.money(cartTotal()+4.99)+'</button>'+
  '<div class="k-small" style="color:#888;margin-top:6px">⭐ Enjoying MegaMart? Rate us 5 stars before checkout!</div>'+
  '<div class="popup" style="bottom:14px;right:14px;width:200px">💬 Hi!! I\'m Chip! Can I help you buy more stuff??</div>'+
  '<div style="background:#20303a;color:#fff;border-radius:6px;padding:8px;margin-top:10px">📱 <b>Continue in our app instead?</b> <button class="k-btn" style="font-size:12px">Download</button></div>';
 var cd=c.querySelector("#cd"),s=299;
 var iv=setInterval(function(){if(!document.body.contains(cd)){clearInterval(iv);return;}s--;cd.textContent="0"+Math.floor(s/60)+":"+("0"+s%60).slice(-2);},1000);
 var side=K.el('<div class="k-card"><h3>🔍 What Calm Browser sees</h3><p class="k-small k-muted">12 attention-grabbers detected on this one page. Calm mode removes every one and keeps only the 4 steps that complete your actual goal: <b>buy the mug set</b>.</p><div id="dl"></div></div>');
 wrap.appendChild(side);
 var dl=side.querySelector("#dl");
 DISTRACTIONS.forEach(function(d){dl.innerHTML+='<div class="distraction"><span>'+K.esc(d[0])+'</span><span class="k-muted k-small strike">'+K.esc("removed")+'</span></div>';});
}
function renderCalm(){
 if(doneOrder){renderSuccess();return;}
 var wrap=K.el('<div class="k-card calm-step" style="max-width:640px;margin:0 auto"><div class="step-dots" id="dots"></div><div id="body"></div></div>');
 app.appendChild(wrap);
 var dots=wrap.querySelector("#dots");
 for(var i=0;i<4;i++)dots.innerHTML+='<div class="step-dot'+(i<step?" done":i===step?" on":"")+'"></div>';
 var body=wrap.querySelector("#body");
 var steps=[stepCart,stepShip,stepPay,stepConfirm];
 steps[step](body);
}
function navBtns(body,backOk,nextLabel,onNext){
 var d=K.el('<div class="k-flex" style="justify-content:space-between;margin-top:20px"></div>');
 if(backOk){var b=K.el('<button class="k-btn">← Back</button>');b.onclick=function(){step--;store.set("step",step);render();};d.appendChild(b);}
 else d.appendChild(K.el('<span></span>'));
 var n=K.el('<button class="k-btn k-primary">'+nextLabel+' →</button>');n.onclick=onNext;d.appendChild(n);
 body.appendChild(d);
}
function stepCart(body){
 body.innerHTML='<h3>Step 1 of 4 · Review your cart</h3><p class="k-muted k-small">Just the items. Nothing else exists right now.</p>';
 CART.forEach(function(i){body.innerHTML+='<div class="k-flex" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span><b>'+K.esc(i.name)+'</b><br><span class="k-small k-muted">Qty '+i.qty+'</span></span><b>'+K.money(i.qty*i.price)+'</b></div>';});
 body.innerHTML+='<div class="k-flex" style="justify-content:space-between;padding:12px 0"><b>Total</b><b style="font-size:20px">'+K.money(cartTotal())+'</b></div>';
 navBtns(body,false,"Continue to shipping",function(){step=1;store.set("step",step);render();});
}
function field(body,label,key,ph,validate){
 var w=K.el('<div class="calm-field"><label class="k-label"></label><input class="k-input"><div class="field-err"></div></div>');
 w.querySelector("label").textContent=label;
 var inp=w.querySelector("input");inp.value=form[key]||"";inp.placeholder=ph||"";
 inp.oninput=function(){form[key]=inp.value;store.set("form",form);w.querySelector(".field-err").style.display="none";};
 w._validate=function(){var v=inp.value.trim();var err=validate?validate(v):(v?"":"Required");if(err){w.querySelector(".field-err").textContent=err;w.querySelector(".field-err").style.display="block";return false;}return true;};
 body.appendChild(w);return w;
}
function stepShip(body){
 body.innerHTML='<h3>Step 2 of 4 · Where is it going?</h3><p class="k-muted k-small">Four fields. That\'s the whole step.</p><div class="breath"><div class="circle"></div><span class="k-small">One thing at a time.</span></div>';
 var fs=[
  field(body,"Full name","name","Jordan Lee"),
  field(body,"Street address","addr","456 Oak Ave #12"),
  field(body,"City","city","Riverton"),
  field(body,"ZIP code","zip","94025",function(v){return /^\d{5}(-\d{4})?$/.test(v)?"":"Enter a valid ZIP (e.g. 94025)";})
 ];
 navBtns(body,true,"Continue to payment",function(){if(fs.every(function(f){return f._validate();})){step=2;store.set("step",step);render();}});
}
function stepPay(body){
 body.innerHTML='<h3>Step 3 of 4 · Payment</h3><p class="k-muted k-small">Three fields. Your card never leaves this demo.</p>';
 var fs=[
  field(body,"Card number","card","4242 4242 4242 4242",function(v){return v.replace(/\D/g,"").length>=12?"":"Enter the card number";}),
  field(body,"Expiry","exp","MM/YY",function(v){return /^\d{2}\/\d{2}$/.test(v)?"":"Use MM/YY";}),
  field(body,"CVC","cvc","123",function(v){return /^\d{3,4}$/.test(v)?"":"3–4 digits";})
 ];
 navBtns(body,true,"Review order",function(){if(fs.every(function(f){return f._validate();})){step=3;store.set("step",step);render();}});
}
function stepConfirm(body){
 body.innerHTML='<h3>Step 4 of 4 · Confirm</h3><p class="k-muted k-small">Last look. Then you\'re done — no upsells, we promise.</p>';
 body.innerHTML+='<div class="k-card" style="background:var(--panel2)"><b>Ship to</b><br><span class="k-small">'+K.esc(form.name)+', '+K.esc(form.addr)+', '+K.esc(form.city)+' '+K.esc(form.zip)+'</span><br><br><b>Pay with</b><br><span class="k-small">Card ending '+K.esc(String(form.card).replace(/\D/g,"").slice(-4))+'</span><br><br><b>Total: '+K.money(cartTotal())+'</b> <span class="k-small k-muted">(no surprise fees — we removed them)</span></div>';
 var d=K.el('<div class="k-flex" style="justify-content:space-between;margin-top:20px"></div>');
 var b=K.el('<button class="k-btn">← Back</button>');b.onclick=function(){step=2;store.set("step",step);render();};
 var n=K.el('<button class="k-btn k-primary" style="font-size:16px;padding:12px 28px">Place order · '+K.money(cartTotal())+'</button>');
 n.onclick=function(){
  var r=K.rng("order-79");var num="CM-"+(100000+Math.floor(r()*899999));
  doneOrder={num:num,total:cartTotal(),date:new Date().toISOString()};store.set("doneOrder",doneOrder);
  render();K.toast("Order placed. That was calm.","good");
 };
 d.appendChild(b);d.appendChild(n);body.appendChild(d);
}
function renderSuccess(){
 var w=K.el('<div class="k-card" style="max-width:560px;margin:0 auto;text-align:center;padding:36px"><div style="font-size:52px">🍃</div><h2>Order '+K.esc(doneOrder.num)+'</h2><p class="k-muted">Placed for <b>'+K.money(doneOrder.total)+'</b>. No popups were harmed — 12 were quietly removed.</p><div class="k-grid" style="grid-template-columns:1fr 1fr;margin:18px 0"><div><div class="k-small k-muted">DISTRACTIONS</div><b style="font-size:24px">12 → 0</b></div><div><div class="k-small k-muted">STEPS</div><b style="font-size:24px">4</b></div></div><div class="k-flex" style="justify-content:center;gap:10px;flex-wrap:wrap"><button class="k-btn k-primary" id="copyRc">📋 Copy my receipt</button><button class="k-btn" id="again">Start over</button></div></div>');
 app.appendChild(w);
 w.querySelector("#copyRc").onclick=function(){
  K.copy("🍃 Calm Browser receipt\nOrder "+doneOrder.num+" — "+K.money(doneOrder.total)+"\nDistractions removed: 12 → 0\n4 calm steps · no upsells, timers, or popups\n— via Calm Browser");
 };
 w.querySelector("#again").onclick=function(){doneOrder=null;store.set("doneOrder",null);step=0;store.set("step",0);calm=false;store.set("calm",false);render();};
}
render();
})();

</script>
</body>
