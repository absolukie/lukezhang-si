<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A11y QA</title>
<link rel="stylesheet" href="../../shared/kit.css">
<style>
/* Common kit-fallback styles. Per-app palette vars are overridden in app.css. */
:root{
--bg:#f7f5f0;--panel:#ffffff;--panel2:#f1ede4;--ink:#23211c;--muted:#6f6a5e;
--line:#e2dccf;--accent:#b5542a;--accent2:#e8a020;--good:#2e7d4f;--warn:#b7791f;--bad:#b3382e;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
line-height:1.55}
.k-wrap{max-width:1120px;margin:0 auto;padding:20px 18px 64px}
.k-nav{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.k-nav-in{max-width:1120px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.k-nav-t{margin:0;font-size:22px;letter-spacing:.2px}
.k-nav-s{margin:2px 0 0;color:var(--muted);font-size:13px}
.k-nav-a{display:flex;gap:8px;flex-wrap:wrap}
.k-hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px;margin:18px 0}
.k-hero h2{margin:0 0 6px;font-size:26px}
.k-hero p{margin:0;color:var(--muted)}
.k-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}
.k-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.k-card h3{margin:0 0 8px;font-size:16px}
.k-muted{color:var(--muted)}.k-small{font-size:13px}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.k-split{grid-template-columns:1fr}}
.k-btn{display:inline-block;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
.k-btn:hover{filter:brightness(.97)}
.k-btn.k-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.k-input,.k-select,textarea.k-input{width:100%;border:1px solid var(--line);border-radius:9px;
padding:10px 12px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit}
textarea.k-input{min-height:88px;resize:vertical}
label.k-label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;
padding:8px 10px;border-bottom:2px solid var(--line)}
.k-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.k-table tr:hover td{background:var(--panel2)}
.k-badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;
background:var(--panel2);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.k-badge.ok{background:#e4f2e9;color:#1e6b3e;border-color:#bfe0c9}
.k-badge.warn{background:#fbf0da;color:#8a5a12;border-color:#ecd9ab}
.k-badge.bad{background:#fbe7e4;color:#a02c22;border-color:#f0c4bd}
.k-badge.info{background:#e3eefb;color:#2456a6;border-color:#c3d8f2}
.k-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.k-tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;
font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.k-tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.k-kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.k-kpi .k-kpi-l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.k-kpi .k-kpi-v{font-size:26px;font-weight:800;margin-top:2px}
.k-kpi .k-kpi-d{font-size:13px;color:var(--muted)}
.k-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);
padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:99;max-width:90vw}
.k-toast.show{opacity:1;transform:translate(-50%,0)}
.k-toast.good{background:var(--good)}.k-toast.bad{background:var(--bad)}
.k-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:90;padding:18px}
.k-modal{background:var(--panel);border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:22px}
.k-modal h3{margin:0 0 10px}
.k-modal-f{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.k-empty{text-align:center;padding:44px 20px;color:var(--muted)}
.k-empty h3{color:var(--ink);margin:0 0 6px}
.k-bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.k-bar-l{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-bar-t{flex:1;background:var(--panel2);border-radius:6px;height:14px;overflow:hidden}
.k-bar-f{height:100%;border-radius:6px;background:var(--accent)}
.k-bar-v{width:56px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.k-tl{position:relative;margin:14px 0;padding-left:26px}
.k-tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.k-tl-ev{position:relative;margin:0 0 16px}
.k-tl-ev:before{content:"";position:absolute;left:-24px;top:5px;width:12px;height:12px;border-radius:50%;
background:var(--accent);border:2px solid var(--panel)}
.k-tl-ev .k-tl-t{font-weight:700}
.k-tl-ev .k-tl-b{color:var(--muted);font-size:13px}
.k-graph{width:100%;overflow:auto}
.k-klist{list-style:none;margin:0;padding:0}
.k-klist li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.k-klist li:last-child{border-bottom:0}
.k-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.k-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.k-note{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);
border-radius:0 10px 10px 0;padding:12px 16px;margin:14px 0;font-size:14px}
.k-quiz-opt{display:block;width:100%;text-align:left;margin:8px 0}
.k-quiz-opt.picked{outline:2px solid var(--accent)}
.k-quiz-opt.right{outline:2px solid var(--good)}
.k-quiz-opt.wrong{outline:2px solid var(--bad)}
@media(max-width:640px){.k-bar-l{width:104px}.k-wrap{padding:14px 12px 48px}}

:root{
--bg:#0d1117;--panel:#161c25;--panel2:#0d1117;--ink:#e6edf3;--muted:#8b949e;
--line:#2d3642;--accent:#3fb950;--accent2:#58a6ff;--good:#3fb950;--warn:#d29922;--bad:#f85149;
}
body{background:var(--bg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.k-nav{background:#0d1117;border-bottom:1px solid var(--line)}
.k-nav-t{color:var(--ink)}.k-nav-s{color:var(--muted)}
.k-hero{background:#161c25;border:1px solid var(--line)}
.k-hero h2{color:var(--ink)}.k-hero p{color:var(--muted)}
.k-card{background:var(--panel);border-color:var(--line);color:var(--ink)}
.k-card h3{color:var(--ink)}
.k-table th{color:var(--muted);border-color:var(--line)}
.k-table td{border-color:var(--line);color:var(--ink)}
.k-table tr:hover td{background:#1c2530}
.k-btn{background:#212a36;border-color:#2d3642;color:var(--ink)}
.k-btn.k-primary{background:var(--accent);border-color:var(--accent);color:#04120a}
.k-badge{background:#212a36;border-color:#2d3642;color:var(--ink)}
.k-note{background:#1c2530;border-color:var(--line);color:var(--ink)}
.k-modal{background:var(--panel);border:1px solid var(--line)}
.k-input{background:#0d1117;border-color:var(--line);color:var(--ink)}
.k-tab{font-family:inherit}
.k-tab.on{background:var(--accent)!important;border-color:var(--accent)!important;color:#04120a!important}
/* The sample page under test — intentionally flawed, styled like a normal site */
.sample{background:#fff;color:#222;border-radius:8px;padding:20px;font-family:Arial,sans-serif;min-height:380px}
.sample h1{font-size:26px}.sample h3{font-size:18px}
.sample .low-contrast{color:#9a9a9a;font-size:13px}
.sample .icon-btn{background:#eee;border:1px solid #ccc;border-radius:6px;padding:6px 10px;cursor:pointer}
.sample .divbtn{background:#2456a6;color:#fff;padding:8px 14px;border-radius:6px;display:inline-block;cursor:pointer}
.sample label.lbl{font-size:13px}
.sample table{border-collapse:collapse;font-size:13px;margin:8px 0}
.sample table td,.sample table th{border:1px solid #ccc;padding:6px 10px}
.fix-code{background:#0d1117;color:#e6edf3;border-radius:8px;padding:14px 16px;font-size:13px;overflow-x:auto;white-space:pre;margin:10px 0}
.check-pass{color:var(--good);font-weight:800}.check-fail{color:var(--bad);font-weight:800}
.scan-line{color:var(--accent2)}
.cat-filter .k-tab{font-size:12px;padding:6px 12px}
tr.fail-row{cursor:pointer}
tr.fail-row:hover td{background:#2a1f1f!important}

</style>
</head>
<body>
<div class="k-wrap" id="app"></div>

<script src="../../shared/kit.js"></script>
<script>

nav:function(o){var n=this.el('<header class="k-nav"><div class="k-nav-in"><div><h1 class="k-nav-t"></h1><p class="k-nav-s"></p></div><div class="k-nav-a"></div></div></header>');
n.querySelector(".k-nav-t").textContent=o.title||"";n.querySelector(".k-nav-s").textContent=o.sub||"";
var a=n.querySelector(".k-nav-a");(o.actions||[]).forEach(function(x){a.appendChild(x);});

toast:function(msg,kind){var t=this.el('<div class="k-toast'+(kind?" "+kind:"")+'"></div>');t.textContent=msg;

modal:function(o){var ov=this.el('<div class="k-modal-ov"><div class="k-modal" role="dialog"><h3></h3><div class="k-modal-b"></div><div class="k-modal-f"></div></div></div>');
ov.querySelector("h3").textContent=o.title||"";ov.querySelector(".k-modal-b").innerHTML=o.body||"";
var f=ov.querySelector(".k-modal-f");(o.actions||[{label:"Close",primary:true}]).forEach(function(x){

b.onclick=function(){if(x.onClick)x.onClick();if(!x.keep)ov.remove();};f.appendChild(b);});

tabs:function(host,list){host.innerHTML="";var self=this;
var bar=this.el('<div class="k-tabs"></div>');var pane=this.el('<div class="k-tabpane"></div>');
host.appendChild(bar);host.appendChild(pane);
function show(id){var it=null;list.forEach(function(x){if(x.id===id)it=x;});

pane.innerHTML="";if(it&&it.render)it.render(pane);}
list.forEach(function(x,i){var b=self.el('<button class="k-tab"></button>');b.textContent=x.label;b.dataset.id=x.id;

table:function(host,cols,rows,opt){opt=opt||{};host.innerHTML="";var self=this;var page=0;var q="";

return cols.some(function(c){var v=r[c.key];return v!=null&&String(v).toLowerCase().indexOf(q)>=0;});});
var ps=opt.pageSize||rs.length;var np=Math.max(1,Math.ceil(rs.length/ps));page=Math.min(page,np-1);
var slice=rs.slice(page*ps,(page+1)*ps);
var h='<div class="k-flex" style="justify-content:space-between;margin-bottom:8px">';
if(opt.search)h+='<input class="k-input k-search" style="max-width:280px" placeholder="Search…">';
h+='<span class="k-muted k-small">'+rs.length+' rows</span></div>';
h+='<div style="overflow-x:auto"><table class="k-table"><thead><tr>';
cols.forEach(function(c){h+='<th'+(c.num?' style="text-align:right"':"")+'>'+self.esc(c.label)+'</th>';});
h+='</tr></thead><tbody>';
slice.forEach(function(r){h+='<tr>';cols.forEach(function(c){var v=r[c.key];if(c.fmt)v=c.fmt(v,r);

h+='</tbody></table></div>';
if(np>1)h+='<div class="k-flex" style="margin-top:8px"><button class="k-btn k-prev">← Prev</button><span class="k-muted k-small">Page '+(page+1)+' of '+np+'</span><button class="k-btn k-next">Next →</button></div>';

},
bars:function(host,items){host.innerHTML="";var max=0;items.forEach(function(i){if(i.value>max)max=i.value;});

host.appendChild(row);});},
line:function(host,series,opt){opt=opt||{};host.innerHTML="";var W=560,H=240,pad=34;
var cv=document.createElement("canvas");cv.width=W*2;cv.height=H*2;cv.style.width="100%";cv.style.maxWidth=W+"px";cv.style.height="auto";
var g=cv.getContext("2d");g.scale(2,2);host.appendChild(cv);
var all=[];series.forEach(function(s){s.points.forEach(function(p){all.push(p);});});
var mn=Math.min.apply(null,all.concat([0])),mx=Math.max.apply(null,all.concat([1]));if(mx===mn)mx=mn+1;
function X(i,n){return pad+(W-2*pad)*(n<=1?0:i/(n-1));}

g.strokeStyle="rgba(0,0,0,.12)";g.fillStyle="rgba(0,0,0,.5)";g.font="10px sans-serif";
for(var k=0;k<=4;k++){var v=mn+(mx-mn)*k/4,yy=Y(v);g.beginPath();g.moveTo(pad,yy);g.lineTo(W-pad,yy);g.stroke();g.fillText(Math.round(v).toString(),4,yy+3);}
series.forEach(function(s,si){g.strokeStyle=s.color||["#b5542a","#0e7c7c","#2456a6"][si%3];g.lineWidth=2.5;g.beginPath();
s.points.forEach(function(p,i){var x=X(i,s.points.length),y=Y(p);if(i===0)g.moveTo(x,y);else g.lineTo(x,y);});g.stroke();});
var lgY=H-8;series.forEach(function(s,si){var x=pad+si*130;g.fillStyle=s.color||["#b5542a","#0e7c7c","#2456a6"][si%3];g.fillRect(x,lgY-8,18,8);g.fillStyle="rgba(0,0,0,.6)";g.fillText(s.name,x+22,lgY);});},
donut:function(host,items){host.innerHTML="";var R=70,r=46,cx=90,cy=90;var tot=0;items.forEach(function(i){tot+=i.value;});
var ns="http://www.w3.org/2000/svg";var svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox","0 0 180 180");svg.style.width="180px";svg.style.maxWidth="100%";
var a0=-Math.PI/2;var self=this;
items.forEach(function(i,idx){var frac=tot?i.value/tot:0;var a1=a0+frac*Math.PI*2;
var p=document.createElementNS(ns,"path");var large=frac>0.5?1:0;
var x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
var xi1=cx+r*Math.cos(a1),yi1=cy+r*Math.sin(a1),xi0=cx+r*Math.cos(a0),yi0=cy+r*Math.sin(a0);
p.setAttribute("d","M"+x0+","+y0+" A"+R+","+R+" 0 "+large+" 1 "+x1+","+y1+" L"+xi1+","+yi1+" A"+r+","+r+" 0 "+large+" 0 "+xi0+","+yi0+" Z");
p.setAttribute("fill",i.color||["#b5542a","#0e7c7c","#2456a6","#e8a020"][idx%4]);
var tt=document.createElementNS(ns,"title");tt.textContent=i.label+": "+i.value;p.appendChild(tt);svg.appendChild(p);a0=a1;});
host.appendChild(svg);
var ul=this.el('<ul class="k-klist"></ul>');items.forEach(function(i,idx){
var li=self.el('<li><span class="k-badge" style="background:'+(i.color||["#b5542a","#0e7c7c","#2456a6","#e8a020"][idx%4])+';color:#fff;border:0">'+self.esc(String(i.value))+'</span> '+self.esc(i.label)+'</li>');
ul.appendChild(li);});host.appendChild(ul);},
timeline:function(host,events){host.innerHTML="";var self=this;var tl=this.el('<div class="k-tl"></div>');
events.forEach(function(e){var d=self.el('<div class="k-tl-ev"><div class="k-small k-muted">'+self.esc(e.t||"")+'</div><div class="k-tl-t">'+self.esc(e.title||"")+'</div><div class="k-tl-b">'+self.esc(e.body||"")+'</div></div>');tl.appendChild(d);});

graph:function(host,o){host.innerHTML="";var nodes=o.nodes||[],edges=o.edges||[];
var W=620,rowH=64;var levels={};nodes.forEach(function(n){var l=n.level||0;levels[l]=levels[l]||[];levels[l].push(n);});
var maxL=Math.max.apply(null,Object.keys(levels).map(Number).concat([0]));
var H=(maxL+1)*rowH+30;var ns="http://www.w3.org/2000/svg";
var svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.style.width="100%";svg.style.maxWidth=W+"px";
var pos={};var self=this;
Object.keys(levels).forEach(function(l){var arr=levels[l];arr.forEach(function(n,i){pos[n.id]={x:W*(i+1)/(arr.length+1),y:30+Number(l)*rowH};});});
edges.forEach(function(e){var a=pos[e.a],b=pos[e.b];if(!a||!b)return;
var ln=document.createElementNS(ns,"line");ln.setAttribute("x1",a.x);ln.setAttribute("y1",a.y);ln.setAttribute("x2",b.x);ln.setAttribute("y2",b.y);
ln.setAttribute("stroke","rgba(0,0,0,.25)");ln.setAttribute("stroke-width","2");svg.appendChild(ln);
if(e.label){var tx=document.createElementNS(ns,"text");tx.setAttribute("x",(a.x+b.x)/2+6);tx.setAttribute("y",(a.y+b.y)/2-4);
tx.setAttribute("font-size","10");tx.setAttribute("fill","rgba(0,0,0,.55)");tx.textContent=e.label;svg.appendChild(tx);}});
nodes.forEach(function(n){var p=pos[n.id];var gEl=document.createElementNS(ns,"g");gEl.style.cursor=n.onClick?"pointer":"default";
var c=document.createElementNS(ns,"circle");c.setAttribute("cx",p.x);c.setAttribute("cy",p.y);c.setAttribute("r","20");
c.setAttribute("fill",n.color||"#0e7c7c");c.setAttribute("stroke","#fff");c.setAttribute("stroke-width","3");gEl.appendChild(c);
var t=document.createElementNS(ns,"text");t.setAttribute("x",p.x);t.setAttribute("y",p.y+38);t.setAttribute("text-anchor","middle");
t.setAttribute("font-size","11");t.setAttribute("font-weight","700");t.setAttribute("fill","currentColor");t.textContent=n.label;gEl.appendChild(t);
if(n.sub){var s=document.createElementNS(ns,"text");s.setAttribute("x",p.x);s.setAttribute("y",p.y+52);s.setAttribute("text-anchor","middle");
s.setAttribute("font-size","10");s.setAttribute("fill","rgba(0,0,0,.55)");s.textContent=n.sub;gEl.appendChild(s);}
if(n.onClick)gEl.addEventListener("click",function(){n.onClick(n);});
svg.appendChild(gEl);});
var wrap=this.el('<div class="k-graph"></div>');wrap.appendChild(svg);host.appendChild(wrap);},
badge:function(txt,kind){return '<span class="k-badge '+(kind||"")+'">'+this.esc(txt)+'</span>';},
kpi:function(host,o){var d=this.el('<div class="k-kpi"><div class="k-kpi-l"></div><div class="k-kpi-v"></div><div class="k-kpi-d"></div></div>');
d.querySelector(".k-kpi-l").textContent=o.label||"";d.querySelector(".k-kpi-v").innerHTML=o.value||"";
d.querySelector(".k-kpi-d").textContent=o.delta||"";host.appendChild(d);},
empty:function(host,title,sub,al,fn){var d=this.el('<div class="k-empty"><h3></h3><p></p></div>');
d.querySelector("h3").textContent=title||"";d.querySelector("p").textContent=sub||"";
if(al){var b=document.createElement("button");b.className="k-btn k-primary";b.textContent=al;b.onclick=fn;d.appendChild(b);}
host.appendChild(d);},
money:function(n){return "$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});},
num:function(n){return Number(n).toLocaleString("en-US");},
pct:function(x){return (x*100).toFixed(1)+"%";},
when:function(d){try{return new Date(d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}catch(e){return String(d);}},
initials:function(name){return String(name||"").split(/\s+/).map(function(w){return w[0];}).join("").slice(0,2).toUpperCase();},
copy:function(txt){var self=this;function done(){self.toast("Copied to clipboard","good");}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,done);}else{var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}ta.remove();done();}}
};
if(!window.Kit)window.Kit=Kit;else{for(var k in Kit){if(!window.Kit[k])window.Kit[k]=Kit[k];}}
})();

</script>
<script>
/* A11y QA — automatically test websites from multiple accessibility perspectives. */
(function(){
"use strict";
var K=window.Kit, app=document.getElementById("app");
var store=K.store("a11y-qa-v1");

function lum(rgb){var c=rgb.match(/[\d.]+/g).map(Number).slice(0,3).map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];}
function contrast(fg,bg){var a=lum(fg),b=lum(bg);if(a<b){var t=a;a=b;b=t;}return (a+0.05)/(b+0.05);}
function accName(el){
 if(el.getAttribute("aria-label"))return el.getAttribute("aria-label").trim();
 if(el.getAttribute("aria-labelledby")){var r=el.getAttribute("aria-labelledby").split(/\s+/).map(function(id){var n=document.getElementById(id);return n?n.textContent:"";}).join(" ").trim();if(r)return r;}
 var t=(el.textContent||"").trim();if(t)return t;
 if(el.tagName==="INPUT"){var id=el.id;if(id){var l=document.querySelector('label[for="'+id+'"]');if(l&&l.textContent.trim())return l.textContent.trim();}}
 return "";
}

var CHECKS=[
 {id:"img-alt",cat:"Images",name:"All images have alt text",run:function(r){var bad=[];r.querySelectorAll("img").forEach(function(i){if(i.getAttribute("alt")==null||i.getAttribute("alt").trim()==="")bad.push(i.getAttribute("data-name")||"image");});return res(!bad.length,bad.length+" image(s) missing alt: "+bad.join(", "),"Add descriptive alt text:\n<img src=\"team.jpg\" alt=\"Six volunteers planning garden beds at a whiteboard\">");}},
 {id:"img-decor",cat:"Images",name:"Decorative images are hidden from AT",run:function(r){var bad=[];r.querySelectorAll("img.decorative").forEach(function(i){if(i.getAttribute("alt")!==""||i.getAttribute("aria-hidden")!=="true")bad.push("decorative img");});return res(!bad.length,bad.length?bad.length+" decorative image(s) exposed to screen readers":"Decorative images properly hidden","Hide decorative images:\n<img src=\"divider.png\" alt=\"\" aria-hidden=\"true\">");}},
 {id:"btn-name",cat:"Controls",name:"Buttons have accessible names",run:function(r){var bad=[];r.querySelectorAll("button").forEach(function(b){if(!accName(b))bad.push("button.icon-btn");});return res(!bad.length,bad.length+" button(s) with no name (icon-only, no aria-label)","Name icon buttons:\n<button aria-label=\"Close dialog\">✕</button>");}},
 {id:"div-button",cat:"Controls",name:"No div/span used as buttons",run:function(r){var bad=[];r.querySelectorAll("[data-fakebtn]").forEach(function(d){bad.push("<div> acting as button");});return res(!bad.length,bad.length+" fake button(s) found — not keyboard-focusable","Use a real button:\n<button class=\"divbtn\" type=\"button\">Sign up</button>");}},
 {id:"input-label",cat:"Forms",name:"Form inputs have labels",run:function(r){var bad=[];r.querySelectorAll("input,select,textarea").forEach(function(i){if(i.type==="hidden"||i.type==="checkbox")return;if(!accName(i))bad.push(i.placeholder||i.type||"input");});return res(!bad.length,bad.length+" input(s) without labels: "+bad.join(", "),"Associate a label:\n<label for=\"email\">Email</label>\n<input id=\"email\" type=\"email\">");}},
 {id:"contrast",cat:"Vision",name:"Text contrast ≥ 4.5:1",run:function(r){var bad=[];r.querySelectorAll(".low-contrast").forEach(function(el){var cs=getComputedStyle(el);var cr=contrast(cs.color,"rgb(255,255,255)");if(cr<4.5)bad.push("'.low-contrast' ("+cr.toFixed(1)+":1)");});return res(!bad.length,bad.length+" low-contrast text node(s): "+bad.join(", "),"Darken the text to reach 4.5:1:\n.low-contrast { color: #595959; } /* was #9a9a9a */");}},
 {id:"heading-order",cat:"Structure",name:"Headings don't skip levels",run:function(r){var hs=r.querySelectorAll("h1,h2,h3,h4,h5,h6"),prev=0,bad=[];hs.forEach(function(h){var lv=+h.tagName[1];if(prev&&lv>prev+1)bad.push(h.tagName+" after H"+prev);prev=lv;});return res(!bad.length,bad.length?"Skipped level(s): "+bad.join(", "):"Heading hierarchy is sequential","Don't skip levels:\n<h1>…</h1>\n<h2>…</h2>  <!-- not h3 -->\n<h3>…</h3>");}},
 {id:"h1-once",cat:"Structure",name:"Exactly one H1",run:function(r){var n=r.querySelectorAll("h1").length;return res(n===1,n===1?"Single H1 present":"Found "+n+" H1 elements","One H1 per page:\n<h1>Community Garden Report</h1>");}},
 {id:"lang",cat:"Structure",name:"Page declares a language",run:function(r){var l=r.getAttribute("data-lang");return res(!!l,l?"lang=\""+l+"\" declared":"No language declared on the page","<html lang=\"en\">");}},
 {id:"skip-link",cat:"Keyboard",name:"Skip-to-content link present",run:function(r){var s=r.querySelector("[data-skip]");return res(!!s,s?"Skip link found":"No skip link — keyboard users tab through the whole nav","<a class=\"skip\" href=\"#main\">Skip to content</a>");}},
 {id:"link-text",cat:"Controls",name:"Links have discernible text",run:function(r){var bad=[];r.querySelectorAll("a").forEach(function(a){if(!accName(a))bad.push("empty <a>");});return res(!bad.length,(bad.length?bad.length+" link(s) with no text":"All links have text"),"Avoid bare links:\n<a href=\"/report\">Read the full report</a> <!-- not 'click here' -->");}},
 {id:"dup-id",cat:"Code",name:"No duplicate IDs",run:function(r){var seen={},bad=[];r.querySelectorAll("[id]").forEach(function(el){if(seen[el.id])bad.push("#"+el.id);seen[el.id]=1;});return res(!bad.length,bad.length?"Duplicate ID(s): "+bad.join(", "):"All IDs unique","IDs must be unique — use classes for repeated styling.");}},
 {id:"table-headers",cat:"Structure",name:"Data tables have headers",run:function(r){var bad=[];r.querySelectorAll("table").forEach(function(t,i){if(!t.querySelector("th"))bad.push("table #"+(i+1));});return res(!bad.length,(bad.length?bad.length+" table(s) without <th>: "+bad.join(", "):"Tables use header cells"),"<table>\n  <tr><th scope=\"col\">Crop</th><th scope=\"col\">Lbs</th></tr>\n  …");}},
 {id:"landmarks",cat:"Structure",name:"Landmark regions present",run:function(r){var have=["header","main","footer"].filter(function(t){return r.querySelector(t);});return res(have.length>=2,have.length+"/3 landmarks ("+have.join(", ")+")","Use landmarks:\n<header>…</header>\n<main id=\"main\">…</main>\n<footer>…</footer>");}},
 {id:"font-size",cat:"Vision",name:"Body text ≥ 12px",run:function(r){var cs=getComputedStyle(r.querySelector(".bodycopy"));var px=parseFloat(cs.fontSize);return res(px>=12,"Body copy is "+px+"px",px>=12?"":"Raise body text:\n.bodycopy { font-size: 16px; }");}},
 {id:"touch-target",cat:"Controls",name:"Touch targets ≥ 24px",run:function(r){var bad=[];r.querySelectorAll("button,.icon-btn").forEach(function(b){var rc=b.getBoundingClientRect();if(rc.height>0&&(rc.height<24||rc.width<24))bad.push("small target "+Math.round(rc.width)+"×"+Math.round(rc.height));});return res(!bad.length,bad.length?"Undersized target(s): "+bad.join(", "):"All targets ≥ 24px","Enlarge small controls:\n.icon-btn { min-width: 44px; min-height: 44px; }");}},
 {id:"aria-hidden-focus",cat:"Code",name:"aria-hidden not on focusable elements",run:function(r){var bad=[];r.querySelectorAll("[aria-hidden='true']").forEach(function(el){if(el.matches("a,button,input,[tabindex]"))bad.push(el.tagName);});return res(!bad.length,bad.length?bad.length+" focusable element(s) hidden from AT":"No conflicts","Never put aria-hidden=\"true\" on links, buttons, or inputs.");}},
 {id:"video-captions",cat:"Media",name:"Video has captions track",run:function(r){var v=r.querySelector("video");if(!v)return res(true,"No video on page","");var ok=!!v.querySelector("track[kind='captions']");return res(ok,ok?"Captions track present":"Video missing captions track","<video controls>\n  <source src=\"tour.mp4\">\n  <track kind=\"captions\" src=\"tour.vtt\" srclang=\"en\" label=\"English\">\n</video>");}},
 {id:"form-errors",cat:"Forms",name:"Errors associated with inputs",run:function(r){var bad=[];r.querySelectorAll("[data-err-for]").forEach(function(e){var id=e.getAttribute("data-err-for");var inp=r.querySelector("#"+id);if(inp&&inp.getAttribute("aria-describedby")!==e.id)bad.push("#"+id);});return res(!bad.length,bad.length?"Error text not linked for: "+bad.join(", "):"Errors linked via aria-describedby","<input id=\"email\" aria-describedby=\"email-err\">\n<span id=\"email-err\" role=\"alert\">Enter a valid email.</span>");}},
 {id:"color-only",cat:"Vision",name:"Color isn't the only indicator",run:function(r){var bad=[];r.querySelectorAll(".color-only").forEach(function(){bad.push("status shown by color alone");});return res(!bad.length,(bad.length?bad.length+" instance(s): "+bad.join(", "):"Status always has text/icon too"),"Pair color with text:\n<span class=\"err\">● <b>Error:</b> invalid date</span>");}},
 {id:"focus-visible",cat:"Keyboard",name:"Visible focus indicator",run:function(r){var bad=[];r.querySelectorAll("button.a11y-ok").forEach(function(){/* styled ok */});var plain=r.querySelectorAll("button.plain-focus").length;return res(plain===0,plain?plain+" control(s) with outline:none and no replacement":"Focus styles present",":focus-visible { outline: 3px solid #0b5fff; outline-offset: 2px; }");}},
 {id:"title-attr",cat:"Code",name:"No redundant title attributes",run:function(r){var bad=[];r.querySelectorAll("[title]").forEach(function(el){if(el.textContent.trim()&&el.getAttribute("title")===el.textContent.trim())bad.push(el.tagName);});return res(!bad.length,bad.length?"Redundant title on "+bad.join(", "):"No redundant titles","Don't duplicate visible text in title attributes — screen readers read both.");}},
 {id:"alt-decor-ok",cat:"Images",name:"Informative images aren't empty-alt",run:function(r){var v=r.querySelector("img.informative");var ok=v&&v.getAttribute("alt")&&v.getAttribute("alt").trim().length>0;return res(!!ok,ok?"Informative image has meaningful alt":"Informative image missing meaningful alt","<img src=\"chart.png\" alt=\"Bar chart: tomato harvest up 34% year over year\">");}},
 {id:"autocomplete",cat:"Forms",name:"Inputs use autocomplete",run:function(r){var bad=[];r.querySelectorAll("input[data-should-autocomplete]").forEach(function(i){if(!i.getAttribute("autocomplete"))bad.push(i.name||"input");});return res(!bad.length,bad.length?"Missing autocomplete: "+bad.join(", "):"Autocomplete attributes present","<input name=\"email\" type=\"email\" autocomplete=\"email\">");}}
];
function res(pass,detail,fix){return {pass:pass,detail:detail,fix:fix};}
var results=store.get("results",null);
var filter=store.get("filter","All");
var running=false;

function sampleHTML(){
 return '<div class="sample" data-lang="en" id="samplePage">'+
 '<a href="#main" data-skip class="k-small" style="position:absolute;left:-9999px">Skip to content</a>'+
 '<header><h1>Community Garden — Q3 Report</h1><h3>Harvest highlights</h3></header>'+
 '<main id="main">'+
 '<p class="bodycopy" style="font-size:16px">Harvest totals rose <b>34%</b> this quarter. Tomatoes led at 412 lbs.</p>'+
 '<p class="low-contrast">Volunteer sign-ups close Friday — don\'t miss your shift.</p>'+
 '<img src="data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'160\' height=\'100\'><rect width=\'160\' height=\'100\' fill=\'%23b9c8d4\'/><circle cx=\'60\' cy=\'50\' r=\'22\' fill=\'%237a8a99\'/><circle cx=\'105\' cy=\'50\' r=\'22\' fill=\'%239aaab9\'/></svg>" data-name="team.jpg" alt="">'+
 '<img src="data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'12\'><rect width=\'200\' height=\'12\' fill=\'%23dddddd\'/></svg>" data-name="divider.png" class="decorative" alt="pretty divider">'+
 '<img src="data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'160\' height=\'100\'><rect width=\'160\' height=\'100\' fill=\'%23eef2f5\'/><rect x=\'20\' y=\'60\' width=\'24\' height=\'30\' fill=\'%231f6b4a\'/><rect x=\'54\' y=\'40\' width=\'24\' height=\'50\' fill=\'%231f6b4a\'/><rect x=\'88\' y=\'20\' width=\'24\' height=\'70\' fill=\'%231f6b4a\'/></svg>" data-name="chart.png" class="informative" alt="Bar chart: tomato harvest up 34% year over year">'+
 '<div><button class="icon-btn a11y-ok" aria-label="Search">🔍</button> <button class="icon-btn">✕</button></div>'+
 '<div class="divbtn" data-fakebtn tabindex="0">Sign up to volunteer</div> '+
 '<a href="/report">Read the full report</a> · <a href="/x"></a>'+
 '<h2 id="dup">Watering schedule</h2><h2 id="dup">Compost news</h2>'+
 '<form><label class="lbl" for="em">Email</label><input id="em" name="email" type="email" data-should-autocomplete autocomplete="email"><br>'+
 '<input id="nm" name="name" placeholder="Full name" data-should-autocomplete><br>'+
 '<span id="em-err" data-err-for="em" style="color:#b3382e">Enter a valid email.</span></form>'+
 '<table><tr><td>Tomatoes</td><td>412</td></tr><tr><td>Zucchini</td><td>288</td></tr></table>'+
 '<p class="color-only" style="color:#b3382e">● Overdue</p>'+
 '<button class="plain-focus" style="outline:none;background:#eee;border:1px solid #ccc;padding:6px 12px">Ghost button</button>'+
 '<span title="Read the full report">Read the full report</span>'+
 '<video controls width="220" data-name="tour.mp4"></video>'+
 '</main><footer class="k-small" style="color:#666">© 2026 Community Garden</footer></div>';
}

function render(){
 app.innerHTML="";
 K.nav({title:"A11y QA",sub:"24 automated checks across 7 accessibility perspectives — run against any page."});
 var hero=K.el('<div class="k-hero"><h2>🤖 Put your page through the gauntlet</h2><p>Below is a <b>real rendered sample page</b> with real flaws baked in. A11y QA runs <b>24 actual DOM checks</b> — contrast math, heading order, label association, touch targets — from 7 perspectives, and hands you a copy-paste fix for every failure.</p><div class="k-flex" style="margin-top:12px"><button class="k-btn k-primary" data-core id="run">▶ Run all 24 checks</button><button class="k-btn" id="reset">Reset</button><span class="k-small k-muted" id="st">'+(results?"Last run: "+results.filter(function(r){return r.pass;}).length+"/24 passed":"Not run yet")+'</span></div></div>');
 app.appendChild(hero);
 hero.querySelector("#run").onclick=runAll;
 hero.querySelector("#reset").onclick=function(){results=null;store.set("results",null);render();};

 var split=K.el('<div class="k-split" style="align-items:start"></div>');app.appendChild(split);
 var left=K.el('<div class="k-card"><h3>🌐 Page under test <span class="k-small k-muted">— live DOM, not a screenshot</span></h3><div id="sampleHost"></div></div>');
 split.appendChild(left);
 left.querySelector("#sampleHost").innerHTML=sampleHTML();
 var right=K.el('<div class="k-card"><h3>📊 Score</h3><div id="score"></div></div>');
 split.appendChild(right);
 drawScore(right.querySelector("#score"));

 var resC=K.el('<div class="k-card" style="margin-top:14px"><h3>🧪 Check results</h3><div class="k-tabs cat-filter" id="cats"></div><div id="tbl"></div></div>');
 app.appendChild(resC);
 var cats=["All"].concat(CHECKS.map(function(c){return c.cat;}).filter(function(v,i,a){return a.indexOf(v)===i;}));
 var ch=resC.querySelector("#cats");
 cats.forEach(function(c){var b=K.el('<button class="k-tab'+(filter===c?" on":"")+'">'+c+'</button>');b.onclick=function(){filter=c;store.set("filter",filter);render();};ch.appendChild(b);});
 drawTable(resC.querySelector("#tbl"));
 if(results){var fails=results.filter(function(r){return !r.pass;});
  var cb=K.el('<button class="k-btn" style="margin-left:12px">\ud83d\udccb Copy all '+fails.length+' fixes</button>');
  cb.onclick=function(){K.copy(fails.map(function(r){return "### "+r.name+"\n"+r.fix;}).join("\n\n---\n\n"));K.toast("All "+fails.length+" fixes copied \u2014 paste into your PR","good");};
  resC.querySelector("h3").appendChild(cb);}
}
function drawScore(host){
 host.innerHTML="";
 if(!results){K.empty(host,"No run yet","Hit “Run all 24 checks” to score the sample page.");return;}
 var passed=results.filter(function(r){return r.pass;}).length;
 var kpis=K.el('<div class="k-grid" style="grid-template-columns:1fr 1fr 1fr"></div>');
 K.kpi(kpis,{label:"Score",value:passed+"/24",delta:Math.round(passed/24*100)+"%"});
 K.kpi(kpis,{label:"Passed",value:K.num(passed)});
 K.kpi(kpis,{label:"Failed",value:K.num(24-passed)});
 host.appendChild(kpis);
 var cats={};results.forEach(function(r){cats[r.cat]=cats[r.cat]||{p:0,f:0};if(r.pass)cats[r.cat].p++;else cats[r.cat].f++;});
 var bars=K.el('<div style="margin-top:12px"></div>');host.appendChild(bars);
 K.bars(bars,Object.keys(cats).map(function(c){return{label:c,value:cats[c].p,disp:cats[c].p+"/"+(cats[c].p+cats[c].f)+" ✓",color:cats[c].f?"#d29922":"#3fb950"};}));
 var fails=24-passed;
 var gate=K.el('<div style="margin-top:14px;border-radius:12px;padding:16px;border:2px solid '+(fails?"#b3382e":"#2e7d4f")+';background:'+(fails?"#fbe7e4":"#e4f2e9")+'"><div style="font-size:20px;font-weight:800">'+(fails?"\ud83d\udeab DEPLOY BLOCKED":"\u2705 CLEAR TO SHIP")+'</div><div class="k-small" style="margin-top:4px">'+(fails?fails+" failures on <b>main</b> \u2014 the build fails until every \u2715 is fixed. This is the CI gate, running in your browser.":"All 24 checks green \u2014 this deploy may proceed.")+'</div></div>');
 host.appendChild(gate);
}
function drawTable(host){
 host.innerHTML="";
 if(!results){K.empty(host,"Nothing to show","Run the checks first.");return;}
 var rows=results.filter(function(r){return filter==="All"||r.cat===filter;});
 var html='<div style="overflow-x:auto"><table class="k-table"><thead><tr><th></th><th>Check</th><th>Category</th><th>Finding</th></tr></thead><tbody>';
 rows.forEach(function(r,i){
  html+='<tr class="'+(r.pass?"":"fail-row")+'" data-i="'+i+'"><td class="'+(r.pass?"check-pass":"check-fail")+'">'+(r.pass?"✓":"✕")+'</td><td><b>'+K.esc(r.name)+'</b>'+(r.pass?"":'<br><span class="k-small" style="color:var(--accent2)">click for fix →</span>')+'</td><td>'+K.badge(r.cat,"info")+'</td><td class="k-small">'+K.esc(r.detail)+'</td></tr>';
 });
 host.innerHTML=html+"</tbody></table></div>";
 host.querySelectorAll("tr.fail-row").forEach(function(tr){
  tr.onclick=function(){var r=rows[+tr.dataset.i];showFix(r);};
 });
}
function showFix(r){
 K.modal({title:"✕ "+r.name,body:"<p class='k-small k-muted'>"+K.esc(r.detail)+"</p><p><b>Fix:</b></p><div class='fix-code'>"+K.esc(r.fix)+"</div>",
  actions:[{label:"Copy fix",primary:true,onClick:function(){K.copy(r.fix);}},{label:"Close"}]});
}
function runAll(){
 if(running)return;running=true;
 var host=document.getElementById("sampleHost");
 if(!host){running=false;return;}
 var root=host.querySelector("#samplePage");
 results=[];store.set("results",null);render();
 var logHost=document.getElementById("tbl");
 logHost.innerHTML='<div class="step-log" style="background:#0d1117;border-radius:8px;padding:14px" id="runlog"></div>';
 var rl=document.getElementById("runlog");
 var i=0;
 function next(){
  if(i>=CHECKS.length){
   store.set("results",results);running=false;render();
   var p=results.filter(function(r){return r.pass;}).length;
   K.toast("Done: "+p+"/24 passed",p>=20?"good":"bad");return;
  }
  var c=CHECKS[i],out;
  try{out=c.run(root);}catch(e){out=res(false,"check error: "+e.message,"");}
  results.push({id:c.id,name:c.name,cat:c.cat,pass:out.pass,detail:out.detail,fix:out.fix});
  if(rl){rl.innerHTML+='<div class="scan-line">['+(i+1)+'/24] '+(out.pass?'<span class="check-pass">PASS</span>':'<span class="check-fail">FAIL</span>')+' '+K.esc(c.name)+'</div>';rl.scrollTop=rl.scrollHeight;}
  i++;setTimeout(next,90);
 }
 next();
}
render();
})();

</script>
