K.tabs=function(host,tabs){host.innerHTML='';var bar=K.el('<div class="k-tabs"></div>'),body=K.el('<div class="k-tab-body"></div>');host.appendChild(bar);host.appendChild(body);tabs.forEach(function(t,i){var b=K.el('<button class="k-tab">'+K.esc(t.label)+'</button>');b.onclick=function(){bar.querySelectorAll('.k-tab').forEach(function(x){x.classList.remove('on');});b.classList.add('on');body.innerHTML='';t.render(body);};bar.appendChild(b);if(i===0)b.onclick();});};
K.table=function(host,cols,rows,opts){opts=opts||{};host.innerHTML='';var q='';if(opts.search){var inp=K.el('<input class="k-input k-table-s" placeholder="Search\u2026">');inp.oninput=function(){q=inp.value.toLowerCase();draw();};host.appendChild(inp);}var wrap=K.el('<div class="k-table-w"></div>');host.appendChild(wrap);function draw(){var r=rows.filter(function(x){return !q||cols.some(function(c){return String(x[c.key]==null?'':x[c.key]).toLowerCase().indexOf(q)>=0;});});var h='<table class="k-table"><thead><tr>'+cols.map(function(c){return '<th class="'+(c.num?'num':'')+'">'+K.esc(c.label)+'</th>';}).join('')+'</tr></thead><tbody>'+r.map(function(x){return '<tr>'+cols.map(function(c){var v=x[c.key];if(c.fmt)v=c.fmt(v,x);return '<td class="'+(c.num?'num':'')+'">'+(v==null?'':v)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';wrap.innerHTML=h;if(!r.length)wrap.innerHTML='<div class="k-empty"><h3>No results</h3></div>';}draw();};

<style>
:root{--bg:#f6f3ec;--panel:#fffdf8;--panel2:#efe9da;--ink:#22302e;--muted:#6f7a76;--line:#e2dac8;--accent:#0e7c7b;--accent2:#c96f2e;--good:#2e7d4f;--warn:#b97e1c;--bad:#b23b2e;}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;margin:0;}
.k-nav{background:#22302e;color:#f6f3ec;border-bottom:4px solid var(--accent);}
.k-nav .k-nav-t{font-family:Georgia,"Times New Roman",serif;font-size:26px;margin:0;letter-spacing:.5px;}
.k-nav .k-nav-s{color:#b9c6c2;margin:2px 0 0;}
.k-nav-in{display:flex;justify-content:space-between;align-items:center;padding:14px 0;}
.k-wrap{max-width:1180px;margin:0 auto;padding:0 20px;}
.hero{display:flex;gap:18px;align-items:center;margin:22px 0;}
.hero h2{font-family:Georgia,serif;font-size:30px;margin:0 0 6px;}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
@media(max-width:900px){.split{grid-template-columns:1fr;}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(34,48,46,.06);}
.pane h3{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
textarea.doc{width:100%;min-height:280px;border:1px solid var(--line);border-radius:8px;padding:12px;font:14px/1.65 Georgia,serif;background:#fffdf8;color:var(--ink);box-sizing:border-box;resize:vertical;}
.doc-out{font:14px/1.8 Georgia,serif;white-space:pre-wrap;min-height:280px;}
mark.fix{background:#ffe9b8;border-bottom:2px solid var(--warn);border-radius:3px;padding:0 2px;cursor:pointer;}
mark.dose{background:#d9efe6;border-bottom:2px solid var(--accent);border-radius:3px;padding:0 2px;cursor:pointer;}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
.k-kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.k-kpi-l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;}
.k-kpi-v{font-size:26px;font-weight:700;font-family:Georgia,serif;}
.k-kpi-d{font-size:12px;color:var(--good);}
.row-ctrl{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;align-items:center;}
.k-btn{background:#fffdf8;border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer;color:var(--ink);}
.k-btn:hover{border-color:var(--accent);}
.k-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.k-primary:hover{background:#0b6665;}
.k-select,.k-input{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;background:#fffdf8;color:var(--ink);}
.k-badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#e8e2d2;color:#5a5344;}
.k-badge.ok{background:#d9efe6;color:#1f6b45;}.k-badge.warn{background:#f7e8c8;color:#8a5f14;}.k-badge.bad{background:#f3d4cd;color:#93342a;}.k-badge.info{background:#d7e8f0;color:#2a5f80;}
.k-table{width:100%;border-collapse:collapse;font-size:13px;}
.k-table th{text-align:left;padding:8px;border-bottom:2px solid var(--line);color:var(--muted);font-weight:600;}
.k-table td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;}
.k-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#22302e;color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:all .3s;z-index:999;}
.k-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.k-modal-w{position:fixed;inset:0;background:rgba(34,48,46,.45);display:flex;align-items:center;justify-content:center;z-index:1000;}
.k-modal{background:#fffdf8;border-radius:12px;padding:20px;max-width:440px;width:90%;box-shadow:0 12px 40px rgba(0,0,0,.25);}
.k-modal h3{margin:0 0 10px;font-family:Georgia,serif;}
.k-modal-a{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
.alt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:14px;}
.alt:hover{border-color:var(--accent);}
.alt small{color:var(--muted);display:block;}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px;}
.legend i{display:inline-block;width:22px;height:8px;border-radius:4px;margin-right:6px;}
footer{color:var(--muted);font-size:12px;text-align:center;padding:24px;}
</style></head>

<div id="app"></div>
<script>
(function(){
var K=window.Kit, app=document.getElementById('app');
var store=K.store('termtune-v1');
var learned=store.get('learned',{});
var topnav=K.nav({title:'TermTune',sub:'Transcription that speaks your specialty'});
(function(){var b=K.el('<button class="k-btn">Copy corrected</button>');b.style.background='#0e7c7b';b.style.color='#fff';b.style.border='none';b.style.marginLeft='8px';b.onclick=function(){K.copy(state.corrected);};var na=topnav.querySelector('.k-nav-actions')||topnav.querySelector('.k-nav-a');if(na)na.appendChild(b);})();
var wrap=K.el('<div class="k-wrap"></div>');app.appendChild(wrap);
wrap.appendChild(K.el('<div class="hero"><div><h2>Dictation in, terminology out.</h2><p class="k-muted" style="margin:0;max-width:640px">TermTune learns your specialty\u2019s vocabulary \u2014 drug names, dosages, acronyms, eponyms \u2014 and repairs transcription errors before they reach the chart. Click any highlighted fix to review it.</p></div></div>'));

/* ---------- terminology engine ---------- */
var TERMS=[
 {c:'metformin',cat:'Drug',aliases:['metforeman','metformen','met fourman','metforman'],note:'First-line biguanide for type 2 diabetes'},
 {c:'lisinopril',cat:'Drug',aliases:['lysinopril','licinopril','lysinoprol','lisinoprol'],note:'ACE inhibitor for hypertension'},
 {c:'atorvastatin',cat:'Drug',aliases:['atorvastatan','a torvastatin','atorvastatine'],note:'Statin for hyperlipidemia'},
 {c:'gabapentin',cat:'Drug',aliases:['gabapenton','gabapentine','gabapantin'],note:'Anticonvulsant, neuropathic pain'},
 {c:'albuterol',cat:'Drug',aliases:['albuteral','albuteroll'],note:'SABA rescue inhaler'},
 {c:'levothyroxine',cat:'Drug',aliases:['levothyroxin','levothyroxene'],note:'Hypothyroidism replacement'},
 {c:'amlodipine',cat:'Drug',aliases:['amloadipine','amlodapine'],note:'Calcium channel blocker'},
 {c:'omeprazole',cat:'Drug',aliases:['omeprazol','omeprozole'],note:'PPI for GERD'},
 {c:'sertraline',cat:'Drug',aliases:['sirtraline','sertralin'],note:'SSRI antidepressant'},
 {c:'hypertension',cat:'Condition',aliases:['hypertention','hyper tension'],note:'Elevated blood pressure'},
 {c:'mellitus',cat:'Condition',aliases:['melitus','mellitis'],note:'As in diabetes mellitus'},
 {c:'myocardial',cat:'Condition',aliases:['miocardial','myocardial infarction'.slice(0,10)],note:'As in myocardial infarction'},
 {c:'pneumonia',cat:'Condition',aliases:['newmonia','pnumonia'],note:'Lung infection'},
 {c:'arrhythmia',cat:'Condition',aliases:['arythmia','arrythmia'],note:'Irregular heart rhythm'},
 {c:'hyperlipidemia',cat:'Condition',aliases:['hyperlipedemia','hyperlipidaemia'],note:'Elevated lipids'}
];
var aliasMap={};TERMS.forEach(function(t){t.aliases.forEach(function(a){aliasMap[a.toLowerCase()]=t;});});
var FREQ={'twice a day':'twice daily (BID)','two times a day':'twice daily (BID)','three times a day':'three times daily (TID)','once a day':'once daily (QD)','every day':'daily'};
function lev(a,b){var m=a.length,n=b.length;if(!m)return n;if(!n)return m;var d=[];for(var i=0;i<=m;i++)d[i]=[i];for(var j=0;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}

var DEMO="Patient is a 54-year-old male with history of hypertention and type 2 diabetes melitus.\n\nCurrent medications include metforeman 500mg twice a day, lysinopril 10mg once daily, and atorvastatan 20mg at bedtime. He reports a brief episode of chest tightness last week; rule out miocardial infarction.\n\nPlan: continue current regimen. Add gabapenton 300mg at bedtime for peripheral neuropathy. Albuteral inhaler as needed for wheezing. Follow up in 3 months with A1C and lipid panel.";

function analyze(text){
  var fixes=[];var seen={};
  // 1. frequency phrases
  Object.keys(FREQ).forEach(function(ph){
    var re=new RegExp('\\b'+ph.replace(/ /g,'\\s+')+'\\b','gi'),m;
    while((m=re.exec(text))){fixes.push({start:m.index,end:m.index+m[0].length,orig:m[0],repl:FREQ[ph],kind:'dose',note:'Frequency normalized to clinical shorthand'});}
  });
  // 2. dosage normalization: 500mg -> 500 mg
  var dre=/(\d+(?:\.\d+)?)\s*(mg|mcg|g|ml|units?|tablets?)\b/gi,m2;
  while((m2=dre.exec(text))){
    if(/\s/.test(m2[0].slice(m2[1].length))){/* already spaced */}
    else fixes.push({start:m2.index,end:m2.index+m2[0].length,orig:m2[0],repl:m2[1]+' '+m2[2],kind:'dose',note:'Dosage spacing normalized'});
  }
  // 3. terminology: alias exact + fuzzy
  var wre=/[A-Za-z][A-Za-z'\-]*/g,m3;
  while((m3=wre.exec(text))){
    var w=m3[0],wl=w.toLowerCase();
    if(seen[m3.index])continue;
    var lt=learned[wl];
    if(lt){fixes.push({start:m3.index,end:m3.index+w.length,orig:w,repl:lt,kind:'fix',note:'Your learned term — taught by you',term:null});continue;}
    var t=aliasMap[wl];
    if(t){fixes.push({start:m3.index,end:m3.index+w.length,orig:w,repl:t.c,kind:'fix',note:t.note,term:t});continue;}
    if(w.length>=6){
      var best=null,bd=3;
      TERMS.forEach(function(tt){var dd=lev(wl,tt.c);if(dd<bd){bd=dd;best=tt;}});
      if(best&&bd<=2)fixes.push({start:m3.index,end:m3.index+w.length,orig:w,repl:best.c,kind:'fix',note:best.note+' (fuzzy match, distance '+bd+')',term:best});
    }
  }
  fixes.sort(function(a,b){return a.start-b.start;});
  // drop overlaps
  var out=[];fixes.forEach(function(f){if(!out.length||f.start>=out[out.length-1].end)out.push(f);});
  return out;
}
function applyFixes(text,fixes){
  var r=text;
  for(var i=fixes.length-1;i>=0;i--){var f=fixes[i];r=r.slice(0,f.start)+f.repl+r.slice(f.end);}
  return r;
}
function alternatives(f){
  var alts=[f.repl];
  if(f.term){f.term.aliases.forEach(function(a){if(alts.indexOf(a)<0&&alts.length<4)alts.push(a);});}
  if(alts.indexOf(f.orig)<0)alts.push(f.orig);
  return alts;
}

var state={raw:DEMO,fixes:[],corrected:'',spec:'General Medicine'};

var split=K.el('<div class="split"></div>');wrap.appendChild(split);
var left=K.el('<div class="pane"><h3>Raw dictation</h3></div>');split.appendChild(left);
var ta=K.el('<textarea class="doc" id="rawIn"></textarea>');ta.value=state.raw;left.appendChild(ta);
var ctrl=K.el('<div class="row-ctrl"></div>');left.appendChild(ctrl);
var specSel=K.el('<select class="k-select"><option>General Medicine</option><option>Cardiology</option><option>Endocrinology</option><option>Neurology</option><option>Radiology</option></select>');
specSel.onchange=function(){state.spec=specSel.value;K.toast('Specialty glossary: '+state.spec);renderGloss();};
ctrl.appendChild(specSel);
var goBtn=K.el('<button class="k-btn k-primary" id="core-action" data-core>Correct transcript</button>');ctrl.appendChild(goBtn);
var resetBtn=K.el('<button class="k-btn">Reset demo</button>');resetBtn.onclick=function(){ta.value=DEMO;state.raw=DEMO;run();};ctrl.appendChild(resetBtn);

var right=K.el('<div class="pane"><h3>Corrected \u2014 click a highlight to review</h3></div>');split.appendChild(right);
var outDiv=K.el('<div class="doc-out" id="outDoc"></div>');right.appendChild(outDiv);
right.appendChild(K.el('<div class="legend"><span><i style="background:#ffe9b8;border-bottom:2px solid #b97e1c"></i>terminology fix</span><span><i style="background:#d9efe6;border-bottom:2px solid #0e7c7b"></i>dosage / frequency</span></div>'));

var kpis=K.el('<div class="kpi-row"></div>');wrap.appendChild(kpis);

function render(){
  var c=state.corrected,fx=state.fixes;
  var html='',pos=0;
  var sorted=fx.slice().sort(function(a,b){return a.start-b.start;});
  sorted.forEach(function(f,idx){
    // map original offsets to corrected offsets
    var shift=0;
    for(var i=0;i<idx;i++){shift+=sorted[i].repl.length-(sorted[i].end-sorted[i].start);}
    var s=f.start+shift,e=s+f.repl.length;
    html+=K.esc(c.slice(pos,s));
    html+='<mark class="'+(f.kind==='dose'?'dose':'fix')+'" data-i="'+idx+'">'+K.esc(c.slice(s,e))+'</mark>';
    pos=e;
  });
  html+=K.esc(c.slice(pos));
  outDiv.innerHTML=html||'<span class="k-muted">Corrected transcript appears here.</span>';
  outDiv.querySelectorAll('mark').forEach(function(mk){
    mk.onclick=function(){openFix(state.fixes[+mk.getAttribute('data-i')]);};
  });
  kpis.innerHTML='';
  K.kpi(kpis,{label:'Terms corrected',value:fx.filter(function(f){return f.kind==='fix';}).length});
  K.kpi(kpis,{label:'Dosages normalized',value:fx.filter(function(f){return f.kind==='dose';}).length});
  K.kpi(kpis,{label:'Glossary entries',value:TERMS.length});
  K.kpi(kpis,{label:'Specialty',value:state.spec.split(' ')[0]});
}
function openFix(f){
  var alts=alternatives(f);
  var body='<p><b>Heard:</b> &ldquo;'+K.esc(f.orig)+'&rdquo;</p><p class="k-muted">'+K.esc(f.note||'')+'</p><p><b>Choose:</b></p>'+
    alts.map(function(a,i){return '<button class="alt" data-i="'+i+'">'+K.esc(a)+(a===f.orig?'<small>keep original</small>':'')+'</button>';}).join('')+
    '<div class="k-note" style="margin-top:14px"><b>\uD83E\uDDE0 Teach TermTune</b><p class="k-small k-muted" style="margin:4px 0">Always fix &ldquo;'+K.esc(f.orig)+'&rdquo; as:</p><div class="k-flex"><input class="k-input" id="teachIn" value="'+K.esc(f.repl)+'" style="flex:1;min-width:0;font-size:16px"><button class="k-btn k-primary" id="teachBtn">Remember</button></div></div>';
  var close=K.modal({title:'Review correction',body:body,actions:[{label:'Done',primary:true}]});
  var box=document.querySelector('.k-modal-body')||document.querySelector('.k-modal-b');
  if(box){box.querySelectorAll('.alt').forEach(function(b){
    b.onclick=function(){f.repl=alts[+b.getAttribute('data-i')];state.corrected=applyFixes(state.raw,state.fixes);render();close();K.toast('Fix updated');};
  });
  var tb=box.querySelector('#teachBtn');
  if(tb)tb.onclick=function(){
    var v=box.querySelector('#teachIn').value.trim();
    if(!v){K.toast('Type what it should become','bad');return;}
    learned[f.orig.toLowerCase()]=v;store.set('learned',learned);
    run();renderGloss();close();K.toast('Learned: "'+f.orig+'" \u2192 "'+v+'"');
  };}
}
function run(){
  state.raw=ta.value;
  state.fixes=analyze(state.raw);
  state.corrected=applyFixes(state.raw,state.fixes);
  render();
  K.toast(state.fixes.length+' corrections applied','ok');
}
goBtn.onclick=run;

var glossPane=K.el('<div class="pane" style="margin-bottom:18px"><h3>Specialty glossary \u2014 <span id="gSpec">General Medicine</span> <span class="k-badge info" title="Terms you taught TermTune">🧠 <span id="learnedN">0</span> learned</span></h3><div id="glossHost"></div></div>');
wrap.appendChild(glossPane);
function renderGloss(){
  document.getElementById('gSpec').textContent=state.spec;
  document.getElementById('learnedN').textContent=Object.keys(learned).length;
  K.table(document.getElementById('glossHost'),
    [{key:'c',label:'Canonical term'},{key:'cat',label:'Type',fmt:function(v){return K.badge(v,v==='Drug'?'info':'ok');}},{key:'aliases',label:'Heard as',fmt:function(v){return K.esc(v.join(', '));}},{key:'note',label:'Note'}],
    TERMS.map(function(t){return{c:t.c,cat:t.cat,aliases:t.aliases,note:t.note};}),{search:true,pageSize:20});
}
renderGloss();
var foot=K.el('<footer>TermTune \u00b7 demo glossary ships with 16 clinical terms \u2014 production connects your EHR formulary</footer>');wrap.appendChild(foot);
run();
})();
</script></body></html>
