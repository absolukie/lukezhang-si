<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Domino — One life change, everything it touches</title>
<link rel="stylesheet" href="../../shared/kit.css">
<script src="../../shared/kit.js"></script>
<script src="../kit-fallback-w9.js"></script>
<style>
:root{--bg:#14181d;--panel:#1d232b;--panel2:#262e38;--ink:#eef1f4;--muted:#9aa4b0;--line:#2e3742;--accent:#f5a524;--accent2:#4cc3d9;--good:#4caf7d;--warn:#f5a524;--bad:#e05d4f;}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;margin:0;}
.k-nav{background:#10141a;border-bottom:1px solid var(--line);}
.k-nav-in{display:flex;justify-content:space-between;align-items:center;padding:14px 0;}
.k-nav-t{margin:0;font-size:24px;font-weight:800;letter-spacing:-.5px;}
.k-nav-t .dm{color:var(--accent);}
.k-nav-s{color:var(--muted);}
.k-wrap{max-width:1180px;margin:0 auto;padding:0 20px;}
.hero{margin:20px 0 14px;}
.hero h2{margin:0 0 4px;font-size:28px;letter-spacing:-.5px;}
.hero h2 .n{color:var(--accent);}
.changes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.chg{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 16px;cursor:pointer;font-size:14px;}
.chg b{display:block;font-size:15px;}
.chg small{color:var(--muted);}
.chg.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(245,165,36,.35);}
.layout{display:grid;grid-template-columns:1fr 380px;gap:16px;margin-bottom:16px;}
@media(max-width:960px){.layout{grid-template-columns:1fr;}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);}
.k-graph{width:100%;height:auto;}
.k-g-t{fill:#14181d;font-size:11px;font-weight:700;font-family:sans-serif;}
.k-g-s{fill:var(--muted);font-size:11px;font-family:sans-serif;}
.k-g-lbl{fill:var(--muted);font-size:10px;font-family:sans-serif;}
.cat{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.cat-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;cursor:pointer;background:var(--panel2);}
.cat-h b{font-size:14px;}
.cat-h small{color:var(--muted);}
.cat-items{display:none;padding:4px 12px 10px;}
.cat.open .cat-items{display:block;}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;cursor:pointer;}
.item:last-child{border:none;}
.item input{accent-color:var(--accent);width:16px;height:16px;margin-top:2px;flex:none;}
.item.done .it{color:var(--muted);text-decoration:line-through;}
.item .why{color:var(--muted);font-size:12px;display:block;margin-top:2px;}
.eff{font-size:10px;padding:2px 7px;border-radius:12px;background:#2e3742;color:#c6cfda;white-space:nowrap;margin-top:3px;}
.prog{height:10px;background:#2e3742;border-radius:6px;overflow:hidden;margin:8px 0 4px;}
.prog i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s;}
.k-badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#2e3742;color:#c6cfda;}
.k-badge.ok{background:#1d3a2a;color:#7fd6a4;}
.k-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#f5a524;color:#14181d;font-weight:600;padding:10px 18px;border-radius:8px;opacity:0;transition:all .3s;z-index:999;}
.k-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
footer{color:var(--muted);font-size:12px;text-align:center;padding:22px;}

/* design-critic: 8-node-wide graph was squeezed to ~40% scale in its column; let it scroll horizontally at a readable size */
.layout>*{min-width:0}
#gHost{overflow-x:auto}
#gHost svg{min-width:1150px}
</style></head>
<body>
<div id="app"></div>
<script>
(function(){
var K=window.Kit,app=document.getElementById('app');
K.nav({title:'Domino',sub:'One life change, everything it touches',actions:[]});
document.querySelector('.k-nav-title').innerHTML='<span class="dm">\u25c6</span> Domino';
var wrap=K.el('<div class="k-wrap"></div>');app.appendChild(wrap);
wrap.appendChild(K.el('<div class="hero"><h2>We\u2019re moving to <span class="n">Texas</span> \u2014 here\u2019s everything that falls.</h2><p style="margin:4px 0 0;color:var(--muted)">31 affected items across 8 categories. Check them off as you go; progress saves automatically.</p></div>'));

function I(t,cat,why,effort,dl){return{t:t,cat:cat,why:why,effort:effort,dl:dl};}
var CHANGES={
 texas:{label:"Moving to Texas",sub:"31 items \u00b7 8 categories",items:[
  I("File USPS change of address","Housing","Forwards mail 12 months; every agency pulls from this.","Quick","2 wks before move"),
  I("Update renter\u2019s / homeowner insurance address","Housing","Coverage follows the property address on file.","Quick","move week"),
  I("Transfer electric, gas, water, internet","Housing","Texas utilities need 3\u20135 days lead; deposits vary by provider.","An afternoon","1 wk before"),
  I("Sign Texas lease / close on home","Housing","TX leases often require TX renter\u2019s insurance at signing.","A project","before move"),
  I("Update voter registration","Legal & ID","TX requires registration 30 days before an election.","Quick","within 30 days"),
  I("Get a Texas driver\u2019s license","Legal & ID","Required within 90 days of establishing residency.","An afternoon","within 90 days"),
  I("Register vehicle + retitle in Texas","Legal & ID","Needs TX inspection first; ~$50\u2013$75 plus 6.25% use tax if recent purchase.","An afternoon","within 30 days"),
  I("Notify IRS of address change (Form 8822)","Legal & ID","Keeps refunds and notices routing correctly.","Quick","within 30 days"),
  I("Update bank + brokerage addresses","Finance","Statements, tax docs, and fraud alerts go to the address on file.","Quick","move week"),
  I("Update credit card billing addresses","Finance","Mismatched AVS declines online purchases.","Quick","move week"),
  I("Adjust state tax withholding","Finance","Texas has no income tax \u2014 update W-4 so you stop over-withholding for CA.","An afternoon","first TX paycheck"),
  I("Update payroll / HR address","Work","Pay stubs, W-2, and equity docs follow HRIS.","Quick","move week"),
  I("Confirm remote-work tax nexus","Work","Some employers restrict TX remote work for payroll registration reasons.","An afternoon","before move"),
  I("Update emergency contacts at work","Work","Facilities and HR use these in an incident.","Quick","move week"),
  I("Find a new primary-care doctor","Health","CA referrals don\u2019t transfer; re-establish before prescriptions lapse.","A project","within 60 days"),
  I("Transfer prescriptions to a TX pharmacy","Health","Controlled substances need a new prescriber visit.","An afternoon","before refills run out"),
  I("Check health plan\u2019s TX network","Health","Your CA PPO may treat TX care as out-of-network.","An afternoon","before move"),
  I("Transfer dental + vision records","Health","Avoid re-doing x-rays and exams.","Quick","within 60 days"),
  I("Re-shop auto insurance","Insurance","TX minimums differ; rates swing wildly by ZIP \u2014 almost always re-quote.","An afternoon","move week"),
  I("Update umbrella policy address","Insurance","Underlying auto/home limits must match the new state.","Quick","move week"),
  I("Update Amazon / shipping addresses","Subscriptions","Default address silently follows you to checkout.","Quick","move week"),
  I("Transfer or freeze gym membership","Subscriptions","National chains transfer; boutiques charge cancellation fees.","Quick","move week"),
  I("Update meal-kit delivery zone","Subscriptions","TX ZIPs change delivery days and cutoff times.","Quick","move week"),
  I("Update streaming billing ZIP","Subscriptions","Sales tax on digital goods varies by TX locality.","Quick","whenever"),
  I("Enroll kids in TX school","Family","Needs immunization records + proof of TX residency.","A project","before semester"),
  I("Update pet microchip registration","Family","The #1 reason lost pets aren\u2019t returned after a move.","Quick","move week"),
  I("Notify family + emergency contacts","Family","Someone should know the new address offline.","Quick","move week"),
  I("Update will / trust situs note","Family","TX is not a community-property wrinkle for most, but review anyway.","A project","within 6 months"),
  I("Get a TX toll tag (TxTag)","Housing","DFW/Austin toll roads bill by plate at higher rates without one.","Quick","first month"),
  I("Re-register car insurance ID cards","Insurance","Keep the TX card in the glove box \u2014 old CA card risks a ticket.","Quick","move week"),
  I("Update voter-adjacent: jury duty district","Legal & ID","TX jury pools pull from DPS + voter rolls at the new address.","Quick","within 60 days")
 ]},
 baby:{label:"New baby",sub:"12 items \u00b7 6 categories",items:[
  I("Add baby to health insurance","Health","Most plans allow 30 days; miss it and wait for open enrollment.","An afternoon","within 30 days"),
  I("Get birth certificate copies","Legal & ID","You\u2019ll need 3\u20134 for passport, insurance, school.","Quick","within 60 days"),
  I("Get baby\u2019s Social Security number","Legal & ID","Filed at the hospital or via SSA office.","Quick","within 60 days"),
  I("Update beneficiaries (401k, life insurance)","Finance","The single most-forgotten post-baby admin task.","Quick","within 90 days"),
  I("Buy / increase life insurance","Insurance","10\u201312x income is the usual rule of thumb.","A project","within 90 days"),
  I("Start / update 529 college savings","Finance","Earlier contributions compound longest.","An afternoon","within 6 months"),
  I("Update will + name a guardian","Legal & ID","Without this, a court decides.","A project","within 6 months"),
  I("Claim child tax credit at tax time","Finance","$2,000 per qualifying child for 2026.","Quick","tax season"),
  I("Notify employer (parental leave)","Work","File leave paperwork + benefits continuation.","Quick","before due date"),
  I("Find a pediatrician","Health","Interview before the birth; first visit is day 3\u20135.","A project","before due date"),
  I("Update emergency contacts","Family","Add the pediatrician + backup caregiver.","Quick","within 30 days"),
  I("Adjust budget for childcare","Finance","Infant care averages $1,200\u2013$2,000/mo in metros.","An afternoon","before due date")
 ]},
 job:{label:"New job",sub:"10 items \u00b7 6 categories",items:[
  I("Roll over old 401(k)","Finance","Direct rollover avoids withholding + penalties.","An afternoon","within 60 days"),
  I("Elect new health insurance","Health","You have 30 days from start date, no extensions.","Quick","within 30 days"),
  I("Update direct deposit","Finance","First paycheck timing depends on payroll cutoff.","Quick","day one"),
  I("File new W-4","Finance","Withholding resets with the new employer.","Quick","day one"),
  I("Transfer HSA / FSA balances","Health","HSA is yours; FSA grace period may strand funds.","An afternoon","within 30 days"),
  I("Update LinkedIn + resume","Work","Recruiters and references check.","Quick","first month"),
  I("Consolidate old stock / RSUs","Finance","Know vesting cliffs and post-termination exercise windows.","A project","within 90 days"),
  I("Update beneficiaries on new 401(k)","Finance","Defaults to estate if you skip it.","Quick","first month"),
  I("Return old employer equipment","Work","Unreturned laptops get payroll-deducted.","Quick","last week"),
  I("COBRA decision","Insurance","60 days to elect retroactively \u2014 a free option if you stay healthy.","Quick","within 60 days")
 ]},
 marriage:{label:"Getting married",sub:"10 items \u00b7 6 categories",items:[
  I("Update last name (SSA, then DMV)","Legal & ID","SSA first \u2014 everything else keys off it.","An afternoon","within 60 days"),
  I("Update passport","Legal & ID","Free within 1 year of issuance.","Quick","within 90 days"),
  I("Combine health insurance","Health","One family plan is usually cheaper than two singles.","An afternoon","within 30 days"),
  I("Update beneficiaries everywhere","Finance","401(k), IRA, life insurance, bank POD.","Quick","within 60 days"),
  I("Merge / retitle bank accounts","Finance","Decide joint vs separate with eyes open.","A project","within 90 days"),
  I("Update will + trust","Legal & ID","Marriage can void parts of an old will.","A project","within 6 months"),
  I("Re-shop auto + home insurance","Insurance","Multi-policy + married discounts stack.","An afternoon","within 60 days"),
  I("Update tax withholding (W-4)","Finance","Married filing jointly changes brackets.","Quick","first joint paycheck"),
  I("Notify employer of name change","Work","Payroll, email, badge, directory.","Quick","within 30 days"),
  I("Update emergency contacts","Family","Spouse becomes #1; keep a backup.","Quick","within 30 days")
 ]},
 retire:{label:"Retiring",sub:"9 items \u00b7 6 categories",items:[
  I("File for Social Security","Finance","File 3 months before you want benefits; every year you delay to 70 adds ~8%.","A project","3 mo before"),
  I("Bridge health coverage to Medicare","Health","COBRA or marketplace until 65 \u2014 the gap is the expensive part.","A project","before last day"),
  I("Enroll in Medicare (65)","Health","Initial enrollment is 7 months around your 65th birthday.","A project","at 65"),
  I("Set 401(k) withdrawal strategy","Finance","Sequence-of-returns risk peaks in year one.","A project","before retiring"),
  I("Update estate plan","Legal & ID","Powers of attorney matter more than the will now.","A project","within 6 months"),
  I("Notify pension administrator","Finance","Single vs survivor payout is irrevocable.","An afternoon","before last day"),
  I("Re-shop insurance (less commuting)","Insurance","Lower mileage can cut auto premiums 10\u201320%.","An afternoon","first month"),
  I("Update beneficiaries one last sweep","Finance","Decades of accounts drift.","An afternoon","within 90 days"),
  I("Plan required minimum distributions","Finance","RMDs start at 73 \u2014 penalties are 25% of the missed amount.","An afternoon","at 73")
 ]}
};
var CATS=["Housing","Finance","Legal & ID","Health","Insurance","Work","Subscriptions","Family"];
var CATCOLORS={"Housing":"#f5a524","Finance":"#4cc3d9","Legal & ID":"#b48be0","Health":"#4caf7d","Insurance":"#e05d4f","Work":"#7fa8d9","Subscriptions":"#d98bb0","Family":"#e8c547"};

var store=K.store('domino9');var doneMap=store.get('done',{});
var state={change:'texas',catFilter:null};

var chost=K.el('<div class="changes"></div>');wrap.appendChild(chost);
Object.keys(CHANGES).forEach(function(k){
  var c=CHANGES[k];
  var b=K.el('<button class="chg'+(k===state.change?' on':'')+'" id="core-action-'+k+'" data-core><b>'+K.esc(c.label)+'</b><small>'+K.esc(c.sub)+'</small></button>');
  b.onclick=function(){state.change=k;state.catFilter=null;render();};
  chost.appendChild(b);
});
var hero2=K.el('<div class="hero" style="margin-top:0"><h2 id="dTitle"></h2><p style="margin:4px 0 0;color:var(--muted)" id="dSub"></p></div>');wrap.appendChild(hero2);
var layout=K.el('<div class="layout"></div>');wrap.appendChild(layout);
var gcard=K.el('<div class="card"><h3>Dependency graph \u2014 click a category to filter</h3><div id="gHost"></div><p style="color:var(--muted);font-size:12px;margin:8px 0 0">Every item traces back to the life change. Knocking one down never breaks another \u2014 but missing the 90-day license deadline cascades into tickets and insurance gaps.</p></div>');
layout.appendChild(gcard);
var lcard=K.el('<div class="card"><div class="k-flex" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h3 style="margin:0">Checklist</h3><button class="k-btn" id="sharePlan">\uD83D\uDCCB Copy shareable plan</button></div><div class="prog"><i id="pbar"></i></div><p style="font-size:13px;color:var(--muted);margin:0 0 10px" id="ptext"></p><div id="cats"></div></div>');
layout.appendChild(lcard);
lcard.querySelector('#sharePlan').onclick=function(){
  var c=CHANGES[state.change],its=items();
  var dn=its.filter(function(_,i){return doneMap[key(i)];}).length;
  var lines=['\uD83D\uDCCB Domino \u2014 '+c.label+' ('+dn+'/'+its.length+' handled)'];
  var cats=[];its.forEach(function(it){if(cats.indexOf(it.cat)<0)cats.push(it.cat);});
  cats.forEach(function(cat){
    lines.push('');lines.push(cat.toUpperCase());
    its.forEach(function(it,i){if(it.cat!==cat)return;
      lines.push((doneMap[key(i)]?'\u2713':'\u2610')+' '+it.t+' \u2014 do by: '+it.dl);});
  });
  lines.push('');lines.push('\u2014 via Domino');
  K.copy(lines.join('\n'));
};

function items(){return CHANGES[state.change].items;}
function key(i){return state.change+':'+i;}
function render(){
  document.getElementById('dTitle').innerHTML='If <span class="n">'+K.esc(CHANGES[state.change].label.toLowerCase())+'</span>, these dominoes fall:';
  var its=items();
  var dn=its.filter(function(_,i){return doneMap[key(i)];}).length;
  document.getElementById('dSub').textContent=its.length+' affected items \u00b7 '+dn+' handled \u00b7 '+Math.round(dn/its.length*100)+'% done';
  document.getElementById('pbar').style.width=(dn/its.length*100)+'%';
  document.getElementById('ptext').textContent=dn+' of '+its.length+' handled';
  chost.querySelectorAll('.chg').forEach(function(b,idx){b.classList.toggle('on',Object.keys(CHANGES)[idx]===state.change);});
  // graph: center + categories present
  var present=[];its.forEach(function(it){if(present.indexOf(it.cat)<0)present.push(it.cat);});
  var nodes=[{id:'root',label:CHANGES[state.change].label,color:'#f5a524'}];
  var edges=[];
  present.forEach(function(c){nodes.push({id:'c:'+c,label:c,color:CATCOLORS[c]||'#888'});edges.push({a:'root',b:'c:'+c});});
  K.graph(document.getElementById('gHost'),{nodes:nodes,edges:edges});
  document.querySelectorAll('#gHost svg > g').forEach(function(gg,idx){
    var rc=gg.querySelector('rect'); /* design-critic: shared kit sets border-color (no-op on SVG); promote it to a real stroke so nodes are visible */
    if(rc&&rc.style.borderColor){rc.setAttribute('stroke',rc.style.borderColor);rc.setAttribute('stroke-width','2.5');}
    if(idx===0)return;
    gg.style.cursor='pointer';
    gg.addEventListener('click',function(){
      var cat=present[idx-1];
      state.catFilter=state.catFilter===cat?null:cat;renderCats();
      K.toast(state.catFilter?('Filtered: '+cat):'Showing all categories');
    });
  });
  renderCats();
}
function renderCats(){
  var host=document.getElementById('cats');host.innerHTML='';
  var present=[];items().forEach(function(it,idx){if(present.indexOf(it.cat)<0)present.push(it.cat);});
  present.forEach(function(c){
    if(state.catFilter&&state.catFilter!==c)return;
    var idxs=[];items().forEach(function(it,i){if(it.cat===c)idxs.push(i);});
    var dn=idxs.filter(function(i){return doneMap[key(i)];}).length;
    var cat=K.el('<div class="cat'+(state.catFilter===c?' open':'')+'"><div class="cat-h"><b><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+(CATCOLORS[c]||'#888')+';margin-right:8px"></span>'+K.esc(c)+'</b><small>'+dn+'/'+idxs.length+'</small></div><div class="cat-items"></div></div>');
    cat.querySelector('.cat-h').onclick=function(){cat.classList.toggle('open');};
    var box=cat.querySelector('.cat-items');
    idxs.forEach(function(i){
      var it=items()[i],d=!!doneMap[key(i)];
      var row=K.el('<label class="item'+(d?' done':'')+'"><input type="checkbox"'+(d?' checked':'')+'><span class="it">'+K.esc(it.t)+'<span class="why">'+K.esc(it.why)+' <b>Do by:</b> '+K.esc(it.dl)+'</span></span><span class="eff">'+K.esc(it.effort)+'</span></label>');
      row.querySelector('input').onchange=function(e){doneMap[key(i)]=e.target.checked;store.set('done',doneMap);render();};
      box.appendChild(row);
    });
    host.appendChild(box.parentNode?cat:cat);
  });
  if(state.catFilter){
    var clear=K.el('<button class="k-btn" style="width:100%;margin-top:6px;background:#262e38;border-color:#2e3742;color:#eef1f4">Clear filter: '+K.esc(state.catFilter)+'</button>');
    clear.onclick=function(){state.catFilter=null;render();};
    host.appendChild(clear);
  }
}
render();
wrap.appendChild(K.el('<footer>Domino \u00b7 demo knowledge base \u2014 production localizes deadlines to your county and dates</footer>'));
})();
</script></body></html>
