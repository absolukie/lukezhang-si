<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuestPilot — Security questionnaires on autopilot</title>
<link rel="stylesheet" href="../../shared/kit.css">
<script src="../../shared/kit.js"></script>
<script src="../kit-fallback-w9.js"></script>
<style>
:root{--bg:#eef1f5;--panel:#ffffff;--panel2:#e6eaf0;--ink:#1d2733;--muted:#68758a;--line:#d5dbe5;--accent:#2f4b7c;--accent2:#3f7d5c;--good:#2e7d4f;--warn:#b97e1c;--bad:#b23b2e;}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;margin:0;}
.k-nav{background:#1d2733;color:#fff;}
.k-nav-in{display:flex;justify-content:space-between;align-items:center;padding:14px 0;}
.k-nav-t{margin:0;font-size:24px;font-weight:700;}
.k-nav-t .qp{color:#7fa8d9;}
.k-nav-s{color:#9fb0c6;margin:2px 0 0;}
.k-wrap{max-width:1080px;margin:0 auto;padding:0 20px;}
.hero{margin:20px 0 14px;display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:12px;}
.hero h2{margin:0;font-size:28px;letter-spacing:-.5px;}
.prog{height:12px;background:#d5dbe5;border-radius:7px;overflow:hidden;margin:10px 0 4px;max-width:560px;}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2f4b7c,#3f7d5c);border-radius:7px;}
.k-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0;}
.k-tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 16px;font-size:13px;cursor:pointer;color:var(--ink);}
.k-tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.q{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff;}
.q.rev{border-left:4px solid var(--warn);}
.q .qq{font-weight:700;font-size:14px;margin:0 0 6px;}
.q .aa{font-size:14px;margin:0 0 8px;line-height:1.55;}
.q .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.src{font-size:12px;color:var(--accent);cursor:pointer;text-decoration:underline;}
.q .acts{margin-left:auto;display:flex;gap:6px;}
.k-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink);}
.k-btn.sm{padding:5px 10px;font-size:12px;}
.k-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.k-badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#e8e2d2;color:#5a5344;}
.k-badge.ok{background:#dcebd4;color:#2f6b3f;}.k-badge.warn{background:#f5e6c4;color:#8a5f14;}.k-badge.bad{background:#f0d2cb;color:#93342a;}.k-badge.info{background:#d7e6f2;color:#2a5f80;}
.k-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#1d2733;color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:all .3s;z-index:999;}
.k-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.k-modal-w{position:fixed;inset:0;background:rgba(29,39,51,.45);display:flex;align-items:center;justify-content:center;z-index:1000;}
.k-modal{background:#fff;border-radius:12px;padding:20px;max-width:520px;width:92%;max-height:84vh;overflow:auto;}
.k-modal h3{margin:0 0 10px;}
.k-modal-a{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
textarea.ov{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px;box-sizing:border-box;}
.excerpt{background:#f4f6f9;border-left:3px solid var(--accent);padding:10px 12px;font-size:13px;margin:8px 0;border-radius:0 8px 8px 0;}
footer{color:var(--muted);font-size:12px;text-align:center;padding:22px;}
</style></head>
<body>
<div id="app"></div>
<script>
(function(){
var K=window.Kit,app=document.getElementById('app');
K.nav({title:'QuestPilot',sub:'Security questionnaires on autopilot',actions:[]});
document.querySelector('.k-nav-title').innerHTML='<span class="qp">\u25c8</span> QuestPilot';
var wrap=K.el('<div class="k-wrap"></div>');app.appendChild(wrap);

/* ---------- 40-question SIG Lite, company profile: Northwind Cloud Inc. ---------- */
function Q(cat,q,a,src,conf,review,excerpt){return{cat:cat,q:q,a:a,src:src,conf:conf||'high',review:!!review,excerpt:excerpt||''};}
var QS=[
Q('Security Program','Do you have a documented information security program?','Yes. Northwind maintains an ISMS aligned to ISO 27001:2022, governed by the InfoSec Policy v3.2 (approved Jan 2026). The CISO reports to the CTO quarterly and to the board semi-annually.','InfoSec Policy v3.2 \u00a71','high',false,'\u00a71.1 The Company shall maintain an Information Security Management System aligned to ISO 27001:2022\u2026'),
Q('Security Program','Is your security program independently audited?','Yes. SOC 2 Type II audited annually by Aplomb Assurance; most recent period Oct 2025\u2013Sep 2026 with zero exceptions. ISO 27001:2022 certified (cert #IS-88412).','SOC 2 Type II report 2026','high',false,'Opinion: unqualified. All 47 trust-services criteria met without exception.'),
Q('Security Program','Do you conduct regular risk assessments?','Yes. Formal risk assessment quarterly; continuous control monitoring via Drata. Top risks tracked in the GRC register with named owners.','Risk Register Q3 2026','high'),
Q('Security Program','Do employees receive security awareness training?','Yes. Onboarding training plus monthly phishing simulations and annual refresher. 2026 phish-prone rate: 2.1% (industry avg 4.8%).','Security Training Report 2026','high'),
Q('Security Program','Do you perform background checks on employees?','Yes. Criminal + identity verification for all hires; enhanced checks (credit, sanctions) for finance and production-access roles.','HR Policy \u00a74.3','high'),
Q('Security Program','Is there a dedicated security team?','Yes. 6-person security team (CISO, 2 appsec engineers, 2 detection engineers, 1 GRC analyst) plus 24/7 SOC via Expel.','Org chart / InfoSec Policy','med'),
Q('Security Program','Do you have a vulnerability disclosure program?','Yes. Public policy at northwind.cloud/security with 90-day SLA and HackerOne bounty program (avg payout $850).','VDP page','high'),
Q('Security Program','Are penetration tests performed regularly?','Yes. Annual external pentest (Bishop Fox, Aug 2026: 0 critical, 2 medium remediated) plus continuous automated scanning.','Pentest report Aug 2026','high'),
Q('Data Protection','Is customer data encrypted at rest?','Yes. AES-256 encryption at rest on all datastores (RDS, S3, EBS) with AWS KMS; keys rotated annually.','InfoSec Policy \u00a76.2','high',false,'\u00a76.2 All customer data at rest shall be encrypted with AES-256 or stronger\u2026'),
Q('Data Protection','Is data encrypted in transit?','Yes. TLS 1.2+ enforced on all endpoints; HSTS preloaded. Internal service mesh uses mTLS.','InfoSec Policy \u00a76.3','high'),
Q('Data Protection','Where is customer data stored?','US only: us-east-1 (primary) and us-west-2 (DR). No cross-border transfers without DPA amendment.','DPA Schedule 2','high'),
Q('Data Protection','Do you support data deletion requests?','Yes. Self-serve deletion in-app; hard delete within 30 days, backups age out within 60 days. GDPR/CCPA verified in SOC 2.','Privacy Policy \u00a79','high'),
Q('Data Protection','Is production data used in non-production environments?','No. Staging uses synthetic data generated by Tonic; production snapshots never leave prod VPC.','SDLC Policy \u00a73.1','high'),
Q('Data Protection','Do you classify data?','Yes. Four tiers (Public, Internal, Confidential, Restricted) with handling rules; DLP scans egress for Restricted.','Data Classification Std','med'),
Q('Data Protection','Are backups encrypted and tested?','Yes. Encrypted backups every 6 hours, retained 30 days; restore tested monthly (last test Sep 28, 2026: RTO 3.2h).','Backup Runbook','high'),
Q('Data Protection','Can customers export their data?','Yes. Full export (JSON/CSV) via API or UI at any time; no egress fees for export under 1TB/mo.','Docs: Data Export','high'),
Q('Access Control','Do you enforce multi-factor authentication?','Yes. MFA required for all employees (WebAuthn/FIDO2) and all customer admin accounts; SMS not permitted.','InfoSec Policy \u00a75.1','high',false,'\u00a75.1 Multi-factor authentication is mandatory for all workforce and privileged customer accounts\u2026'),
Q('Access Control','Is access granted on least-privilege basis?','Yes. RBAC with quarterly access reviews; production access requires just-in-time elevation via PagerDuty with 4h TTL.','Access Review Q3 2026','high'),
Q('Access Control','How quickly is access revoked on termination?','Same business day: automated deprovisioning via Okta within 2 hours of HRIS termination event. 2026 avg: 47 minutes.','Offboarding SOP','high'),
Q('Access Control','Do you log and monitor privileged access?','Yes. All admin actions logged to immutable SIEM (Panther), retained 1 year; alerts on anomalous privilege use.','Logging Standard','high'),
Q('Access Control','Are passwords stored securely?','Yes. Argon2id hashing; 14-char minimum; breached-password screening via HIBP API.','InfoSec Policy \u00a75.4','med'),
Q('Access Control','Do third parties have access to customer data?','Subprocessors only: AWS, Cloudflare, Stripe, SendGrid (list at northwind.cloud/subprocessors). Each under DPA with SCCs where applicable.','Subprocessor list','high'),
Q('Access Control','Is there segregation of duties?','Yes. Deploy requires two approvals; billing changes require finance + engineering sign-off. Enforced in CI/CD and NetSuite.','SDLC Policy \u00a72.4','med'),
Q('Access Control','Do customers get SSO/SAML?','Yes. SAML 2.0 and OIDC on Business plans; SCIM provisioning included. Google Workspace and Okta verified.','Docs: SSO Setup','high'),
Q('Incident Response','Do you have an incident response plan?','Yes. IR Plan v2.4 with severity tiers, tested via tabletop quarterly (last: Sep 2026) and red-team annually.','IR Plan v2.4','high',false,'Severity 1: assemble war room within 30 minutes; customer notification within 72 hours\u2026'),
Q('Incident Response','What is your breach notification timeline?','Customers notified within 72 hours of confirmed breach involving their data; regulators per applicable law (GDPR 72h).','IR Plan \u00a74 / DPA \u00a78','high'),
Q('Incident Response','Have you had a material breach in the last 3 years?','No material breaches involving customer data in the last 3 years. One 2024 phishing incident contained to a single mailbox; disclosed in SOC 2.','SOC 2 2026 \u00a77.2','high',true,'No exceptions noted relating to security incidents during the audit period.'),
Q('Incident Response','Is there 24/7 security monitoring?','Yes. 24/7 SOC via Expel + in-house detection engineering; mean time to detect (2026): 11 minutes.','SOC contract / Metrics','high'),
Q('Incident Response','Do you run post-incident reviews?','Yes. Blameless postmortems for Sev1/Sev2 within 5 business days; action items tracked to closure in Jira.','IR Plan \u00a76','med'),
Q('Incident Response','Can customers get incident reports?','Yes. Affected customers receive a written incident report within 10 business days of containment.','DPA \u00a78.3','high'),
Q('Incident Response','Do you coordinate with law enforcement?','When legally required or requested; legal counsel approves all disclosures. No standing data-sharing agreements.','Legal Policy','med',true,'Requires General Counsel approval for any voluntary disclosure.'),
Q('Incident Response','Is ransomware specifically addressed?','Yes. Immutable backups + tested restore; no-ransom-payment policy; 2026 purple-team exercise covered ransomware scenario.','IR Plan App. C','med'),
Q('Business Continuity','Do you have a business continuity plan?','Yes. BCP v1.8 covering 12 critical processes; RTO 4h / RPO 1h for the platform. Tested via DR failover drill semi-annually.','BCP v1.8','high'),
Q('Business Continuity','What is your DR architecture?','Active-passive across us-east-1 / us-west-2; automated DNS failover; last drill Sep 2026 completed in 2h 41m.','DR Runbook','high'),
Q('Business Continuity','What uptime do you commit to?','99.9% monthly SLA with 10% service credits; trailing-12m actual: 99.97%.','MSA \u00a73 / Status page','high'),
Q('Business Continuity','How are customers told about outages?','Status page (status.northwind.cloud) + in-app banner + email for incidents >15 min; postmortems published.','Comms Runbook','high'),
Q('Business Continuity','Are key personnel cross-trained?','Yes. Bus-factor review quarterly; every critical system has 2+ trained operators. Current minimum: 3.','BCP App. A','med',true,'Two systems currently have exactly 2 trained operators; hiring third for on-call rotation.'),
Q('Business Continuity','Do you carry cyber insurance?','Yes. $5M cyber liability + $5M tech E&O with Corvus; certificate available under NDA.','Insurance cert 2026','high'),
Q('Business Continuity','What happens to our data if you shut down?','90-day wind-down with full export assistance and data return; escrow of source available on Enterprise plans.','MSA \u00a711','med'),
Q('Business Continuity','Are suppliers risk-assessed?','Yes. Annual review of critical suppliers; AWS and Cloudflare under enterprise agreements with SLA pass-through.','Vendor Risk Register','med')
];
var store=K.store('questpilot9');
var overrides=store.get('overrides',{}), approved=store.get('approved',{});
var state={tab:'All'};

var hero=K.el('<div class="hero"><div><h2>SIG Lite \u2014 Northwind Cloud Inc.</h2><div class="prog"><i id="pbar" style="width:0%"></i></div><p class="k-muted" style="margin:0;font-size:13px" id="ptext"></p></div><div style="display:flex;gap:8px"><button class="k-btn" id="expBtn">Export JSON</button><button class="k-btn k-primary" id="core-action">Open review queue</button></div></div>');
wrap.appendChild(hero);
var roi=K.el('<div style="background:#eef4ec;border:1px solid #c9ddc4;border-radius:12px;padding:12px 16px;margin:0 0 6px;font-size:14px"><b>\u23f1\ufe0f The math:</b> 40 questions \u00d7 ~20 min each \u2248 <b>13 hours</b> of security-review drudgery \u2014 done here in seconds, with the 3 answers it wouldn\u2019t vouch for flagged honestly. At $150/hr that\u2019s <b>~$2,000 saved per questionnaire</b>.</div>');
wrap.appendChild(roi);
var tabsHost=K.el('<div id="tabsHost"></div>');wrap.appendChild(tabsHost);

function counts(){
  var total=QS.length, auto=QS.filter(function(q){return !q.review;}).length;
  var done=QS.filter(function(q,i){return approved[i]||overrides[i];}).length;
  return{total:total,auto:auto,review:QS.filter(function(q){return q.review;}).length,done:done};
}
function renderHead(){
  var c=counts();
  var bar=document.getElementById('pbar'),tx=document.getElementById('ptext');
  var t0=performance.now(),dur=1500;
  function tick(t){
    var p=Math.min(1,(t-t0)/dur),n=Math.round(c.auto*p);
    bar.style.width=Math.round(n/c.total*100)+'%';
    tx.textContent=n+' of '+c.total+' auto-filled with source citations \u00b7 '+c.review+' need human review \u00b7 '+c.done+' reviewed';
    if(p<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function qCard(q,i){
  var ov=overrides[i],ap=approved[i];
  var el=K.el('<div class="q'+(q.review&&!ap&&!ov?' rev':'')+'"><p class="qq">'+(i+1)+'. '+K.esc(q.q)+'</p><p class="aa">'+K.esc(ov||q.a)+'</p><div class="meta">'+K.badge(q.conf==='high'?'high confidence':'medium confidence',q.conf==='high'?'ok':'warn')+(q.review&&!ap&&!ov?K.badge('needs human review','warn'):'')+(ap?K.badge('reviewed','ok'):'')+(ov?K.badge('overridden','info'):'')+'<span class="src" data-i="'+i+'">\uD83D\uDCC4 '+K.esc(q.src)+'</span><span class="acts"><button class="k-btn sm ovBtn">Override</button><button class="k-btn sm apBtn">'+(ap?'Unapprove':'Approve')+'</button></span></div></div>');
  el.querySelector('.src').onclick=function(){openSource(q);};
  el.querySelector('.ovBtn').onclick=function(){openOverride(q,i);};
  el.querySelector('.apBtn').onclick=function(){approved[i]=!approved[i];store.set('approved',approved);render();K.toast(approved[i]?'Approved':'Approval removed','ok');};
  return el;
}
function openSource(q){
  K.modal({title:q.src,body:'<div class="excerpt">'+K.esc(q.excerpt||'Source document on file. Full text available in the document vault.')+'</div><p class="k-muted" style="font-size:13px">Citation verified against the Northwind document vault, Sep 2026. Every auto-filled answer carries its source so auditors can spot-check.</p>',actions:[{label:'Close',primary:true}]});
}
function openOverride(q,i){
  var body='<p class="k-muted" style="font-size:13px">Original auto-fill:</p><p style="font-size:14px">'+K.esc(q.a)+'</p><textarea class="ov" id="ovTa" placeholder="Write the corrected answer\u2026">'+K.esc(overrides[i]||'')+'</textarea>';
  K.modal({title:'Override answer',body:body,actions:[{label:'Cancel'},{label:'Save override',primary:true,fn:function(){
    var v=((document.getElementById('ovTa')||{}).value||'').trim();
    if(v)overrides[i]=v;else delete overrides[i];
    store.set('overrides',overrides);render();K.toast('Override saved','ok');
  }}]});
}
function render(){
  renderHead();
  var cats=['All','Review queue'].concat(QS.map(function(q){return q.cat;}).filter(function(v,i,a){return a.indexOf(v)===i;}));
  K.tabs(tabsHost,cats.map(function(c){
    return{id:c,label:c==='Review queue'?('Review queue ('+counts().review+')'):c,render:function(host){
      var list=QS.map(function(q,i){return{i:i,q:q};}).filter(function(x){
        if(c==='All')return true;
        if(c==='Review queue')return x.q.review;
        return x.q.cat===c;
      });
      if(!list.length){K.empty(host,'All clear','No questions in this view.');return;}
      list.forEach(function(x){host.appendChild(qCard(x.q,x.i));});
    }};
  }));
}
document.getElementById('core-action').onclick=function(){
  var rq=QS.map(function(q,i){return{i:i,q:q};}).filter(function(x){return x.q.review&&!approved[x.i]&&!overrides[x.i];});
  if(!rq.length){K.toast('Review queue is clear','ok');return;}
  var body=rq.map(function(x){return '<button class="k-btn rqBtn" data-i="'+x.i+'" style="display:block;width:100%;text-align:left;margin-bottom:8px">'+(x.i+1)+'. '+K.esc(x.q.q)+'</button>';}).join('');
  var closeQ=K.modal({title:rq.length+' answers need a human',body:body,actions:[{label:'Close',primary:true}]});
  var box=document.querySelector('.k-modal-body')||document.querySelector('.k-modal-b');
  if(box)box.querySelectorAll('.rqBtn').forEach(function(b){
    b.onclick=function(){var x={i:+b.getAttribute('data-i')};x.q=QS[x.i];closeQ();openOverride(x.q,x.i);};
  });
};
document.getElementById('expBtn').onclick=function(){
  var data=QS.map(function(q,i){return{question:q.q,answer:overrides[i]||q.a,source:q.src,confidence:q.conf,auto_filled:!q.review,approved:!!approved[i],overridden:!!overrides[i]};});
  var blob=new Blob([JSON.stringify({company:'Northwind Cloud Inc.',questionnaire:'SIG Lite',exported:'2026-10-03',answers:data},null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sig-lite-northwind.json';a.click();
  K.toast('Exported '+data.length+' answers','ok');
};
render();
wrap.appendChild(K.el('<footer>QuestPilot \u00b7 demo answers for fictional Northwind Cloud \u2014 production verifies against your live document vault</footer>'));
})();
</script></body></html>
