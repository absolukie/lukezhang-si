<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northwind Trust Center — Security, compliance, and uptime</title>
<link rel="stylesheet" href="../../shared/kit.css">
<script src="../../shared/kit.js"></script>
<script src="../kit-fallback-w9.js"></script>
<style>
:root{--bg:#f7faf8;--panel:#ffffff;--panel2:#eef4f0;--ink:#16241d;--muted:#64766b;--line:#dbe5de;--accent:#1d7a4f;--accent2:#2f4b7c;--good:#1d7a4f;--warn:#b97e1c;--bad:#b23b2e;}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;margin:0;}
.k-nav{background:#fff;border-bottom:1px solid var(--line);}
.k-nav-in{display:flex;justify-content:space-between;align-items:center;padding:14px 0;}
.k-nav-t{margin:0;font-size:22px;font-weight:800;}
.k-nav-t .tc{color:var(--accent);}
.k-nav-s{color:var(--muted);}
.k-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer;color:var(--ink);}
.k-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.k-wrap{max-width:1080px;margin:0 auto;padding:0 20px;}
.hero{background:linear-gradient(135deg,#0f2e1f,#1d7a4f);color:#fff;border-radius:18px;padding:34px 32px;margin:22px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px;}
.hero h2{margin:0 0 6px;font-size:32px;letter-spacing:-.5px;}
.hero p{margin:0;color:#cfe6d8;max-width:520px;}
.status{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:20px;padding:8px 16px;font-weight:600;font-size:14px;}
.status .dot{width:10px;height:10px;border-radius:50%;background:#5be38b;box-shadow:0 0 8px #5be38b;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;}
.card h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);}
.k-kpi{background:var(--panel2);border:none;border-radius:12px;padding:14px;}
.k-kpi-v{font-size:30px;font-weight:800;color:var(--accent);}
.k-kpi-l{font-size:12px;color:var(--muted);}
.cert{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .15s;background:#fff;}
.cert:hover{border-color:var(--accent);}
.cert .ch{display:flex;gap:12px;align-items:center;}
.cert .seal{width:48px;height:48px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;}
.cert b{font-size:15px;display:block;}
.cert small{color:var(--muted);}
.cert .cd{display:none;margin-top:10px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;}
.cert.open .cd{display:block;}
.acc{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:#fff;}
.acc-h{padding:12px 14px;cursor:pointer;font-weight:600;font-size:14px;display:flex;justify-content:space-between;}
.acc-b{display:none;padding:0 14px 14px;font-size:13px;color:var(--muted);line-height:1.6;}
.acc.open .acc-b{display:block;}
.doc{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
.doc:last-child{border:none;}
.k-tl{border-left:3px solid var(--line);margin:6px 0 6px 8px;}
.k-tl-e{position:relative;padding:8px 0 8px 20px;}
.k-tl-e::before{content:'';position:absolute;left:-8px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--accent);}
.k-tl-e.warn::before{background:var(--warn);}
.k-tl-t{font-size:12px;color:var(--muted);font-weight:600;}
.k-tl-b b{font-size:14px;}.k-tl-b p{margin:2px 0 0;font-size:13px;}
.k-badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#e8e2d2;color:#5a5344;}
.k-badge.ok{background:#d8efdf;color:#1d7a4f;}
.k-input{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;width:100%;box-sizing:border-box;margin:8px 0;}
.k-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#16241d;color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:all .3s;z-index:999;}
.k-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.k-modal-w{position:fixed;inset:0;background:rgba(22,36,29,.45);display:flex;align-items:center;justify-content:center;z-index:1000;}
.k-modal{background:#fff;border-radius:12px;padding:20px;max-width:440px;width:90%;}
.k-modal-a{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
footer{color:var(--muted);font-size:12px;text-align:center;padding:22px;}
</style></head>
<body>
<div id="app"></div>
<script>
(function(){
var K=window.Kit,app=document.getElementById('app');
var nav=K.nav({title:'Trust Center',sub:'northwind.cloud/trust',actions:[]});
document.querySelector('.k-nav-title').innerHTML='<span class="tc">\u25c8</span> Northwind <span class="tc">Trust Center</span>';
var subBtn=K.el('<button class="k-btn k-primary" id="core-action">Subscribe to updates</button>');
subBtn.onclick=openSubscribe;
var na=nav.querySelector('.k-nav-actions')||nav.querySelector('.k-nav-a');if(na)na.appendChild(subBtn);
var wrap=K.el('<div class="k-wrap"></div>');app.appendChild(wrap);

wrap.appendChild(K.el('<div class="hero"><div><div class="status"><span class="dot"></span> All systems operational</div><h2 style="margin-top:12px">Security you can verify.</h2><p>Certifications, policies, uptime, and a public changelog \u2014 maintained automatically from our compliance vault. Last verified Oct 3, 2026.</p></div><div style="text-align:center"><div style="font-size:44px;font-weight:800">99.97%</div><div style="color:#cfe6d8;font-size:13px">trailing 90-day uptime</div></div></div>'));

var store=K.store('trustcenter9');
var kpis=K.el('<div class="grid"></div>');wrap.appendChild(kpis);
K.kpi(kpis,{label:'Uptime (90d)',value:'99.97%'});K.kpi(kpis,{label:'Incidents (90d)',value:'2 minor'});K.kpi(kpis,{label:'Certifications',value:'4 active'});K.kpi(kpis,{label:'Policies published',value:'18'});

/* uptime chart: seeded 90 days */
var rng=K.rng('uptime-90d');
var pts=[];for(var i=0;i<90;i++){var v=100;var r=rng();if(r<0.03)v=99.2+rng()*0.7;else if(r<0.12)v=99.9+rng()*0.09;pts.push(Math.round(v*100)/100);}
var uc=K.el('<div class="card"><h3>Uptime \u2014 last 90 days</h3><div id="upHost"></div></div>');wrap.appendChild(uc);
K.line(document.getElementById('upHost'),[{name:'Daily uptime %',color:'#1d7a4f',points:pts}]);

/* certifications */
var CERTS=[
 {n:'SOC 2 Type II',org:'Aplomb Assurance',icon:'\uD83D\uDEC1',valid:'Valid through Sep 2027',d:'Audited annually across security, availability, and confidentiality. 2026 period: zero exceptions across 47 criteria. Report available under NDA.'},
 {n:'ISO 27001:2022',org:'Cert. #IS-88412',icon:'\u2714\uFE0F',valid:'Valid through Mar 2027',d:'ISMS certified covering all production systems and corporate IT. Surveillance audit passed Jun 2026.'},
 {n:'GDPR',org:'EU / UK',icon:'\uD83C\uDF0D',valid:'DPA available',d:'Data Processing Agreement with Standard Contractual Clauses. EU data stays in the EU on request (eu-central-1 available on Enterprise).'},
 {n:'CCPA / CPRA',org:'California',icon:'\u2696\uFE0F',valid:'Attested Jan 2026',d:'Consumer rights portal live; deletion SLA 30 days; no sale of personal information. Annual attestation published.'}
];
var cc=K.el('<div class="card"><h3>Certifications & compliance</h3><div class="grid" id="certGrid"></div></div>');wrap.appendChild(cc);
CERTS.forEach(function(c){
  var el=K.el('<div class="cert"><div class="ch"><div class="seal">'+c.icon+'</div><div><b>'+K.esc(c.n)+'</b><small>'+K.esc(c.org)+' \u00b7 '+K.esc(c.valid)+'</small></div></div><div class="cd">'+K.esc(c.d)+'</div></div>');
  el.querySelector('.ch').onclick=function(){el.classList.toggle('open');};
  document.getElementById('certGrid').appendChild(el);
});

/* practices accordion */
var PRACT=[
 ['Encryption','AES-256 at rest (AWS KMS, annual rotation), TLS 1.2+ in transit with HSTS preload, mTLS inside the service mesh.'],
 ['Access control','FIDO2 MFA for all staff, RBAC with quarterly reviews, just-in-time production elevation with 4-hour TTL, automated deprovisioning in under 2 hours.'],
 ['Vulnerability management','Continuous scanning, annual Bishop Fox pentest (Aug 2026: 0 critical), public VDP with 90-day SLA, median patch time 6 days for highs.'],
 ['Incident response','24/7 SOC, 11-minute mean time to detect, customer notification within 72 hours, written incident reports within 10 business days.'],
 ['Data privacy','US-only storage by default, 30-day deletion SLA, no production data in staging (synthetic data via Tonic), subprocessor list published.'],
 ['Business continuity','Active-passive DR across us-east-1/us-west-2, RTO 4h / RPO 1h, semi-annual failover drills (last: 2h 41m).']
];
var pc=K.el('<div class="card"><h3>How we protect your data</h3><div id="accHost"></div></div>');wrap.appendChild(pc);
PRACT.forEach(function(p){
  var a=K.el('<div class="acc"><div class="acc-h"><span>'+K.esc(p[0])+'</span><span>+</span></div><div class="acc-b">'+K.esc(p[1])+'</div></div>');
  a.querySelector('.acc-h').onclick=function(){a.classList.toggle('open');};
  document.getElementById('accHost').appendChild(a);
});

/* documents with real downloads */
var DOCS=[
 ['Information Security Policy v3.2','PDF \u00b7 42 pages \u00b7 Jan 2026'],
 ['SOC 2 Type II Report (summary)','PDF \u00b7 18 pages \u00b7 Oct 2026'],
 ['Data Processing Agreement','PDF \u00b7 24 pages \u00b7 Jun 2026'],
 ['Penetration Test Executive Summary','PDF \u00b7 6 pages \u00b7 Aug 2026'],
 ['Business Continuity Plan (public)','PDF \u00b7 12 pages \u00b7 Sep 2026'],
 ['Subprocessor List','Web \u00b7 updated Sep 2026']
];
var dc=K.el('<div class="card"><h3>Documents</h3><div id="docHost"></div></div>');wrap.appendChild(dc);
DOCS.forEach(function(dd){
  var row=K.el('<div class="doc"><div><b>'+K.esc(dd[0])+'</b><br><small class="k-muted">'+K.esc(dd[1])+'</small></div><button class="k-btn">Download</button></div>');
  row.querySelector('button').onclick=function(){
    var txt='NORTHWIND CLOUD INC.\n'+dd[0]+'\n'+dd[1]+'\n\nThis is a demo export from the Northwind Trust Center.\nIn production this downloads the signed document from the compliance vault.\n\nVerified Oct 3, 2026 \u00b7 trust@northwind.cloud';
    var blob=new Blob([txt],{type:'text/plain'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=dd[0].replace(/[^a-z0-9]+/gi,'-')+'.txt';a.click();
    K.toast('Downloaded '+dd[0],'ok');
  };
  document.getElementById('docHost').appendChild(row);
});

/* changelog */
var LOG=[
 {t:'Oct 3, 2026',title:'SOC 2 Type II 2026 report published',body:'Zero exceptions. Summary now downloadable above.',kind:''},
 {t:'Sep 28, 2026',title:'DR failover drill completed',body:'us-east-1 \u2192 us-west-2 in 2h 41m, inside 4h RTO.',kind:''},
 {t:'Sep 15, 2026',title:'Subprocessor list updated',body:'Added Tonic (synthetic data) for staging environments.',kind:'warn'},
 {t:'Aug 20, 2026',title:'Pentest remediations closed',body:'2 medium findings from Bishop Fox verified fixed.',kind:''},
 {t:'Jul 1, 2026',title:'InfoSec Policy v3.2 approved',body:'MFA mandate extended to all customer admin accounts.',kind:''}
];
var lc=K.el('<div class="card"><h3>Changelog \u2014 updated automatically from the vault</h3><div id="logHost"></div></div>');wrap.appendChild(lc);
K.timeline(document.getElementById('logHost'),LOG);

/* questionnaire auto-responder: answers from the vault, with sources */
var VAULT=[];
CERTS.forEach(function(c){VAULT.push({src:c.n+' · '+c.org,text:(c.n+' '+c.org+' '+c.valid+' '+c.d).toLowerCase(),html:'<b>'+K.esc(c.n)+'</b> ('+K.esc(c.org)+' — '+K.esc(c.valid)+'): '+K.esc(c.d)});});
PRACT.forEach(function(p){VAULT.push({src:'Security practice · '+p[0],text:(p[0]+' '+p[1]).toLowerCase(),html:'<b>'+K.esc(p[0])+':</b> '+K.esc(p[1])});});
LOG.forEach(function(l){VAULT.push({src:'Changelog · '+l.t,text:(l.title+' '+l.body).toLowerCase(),html:'<b>'+K.esc(l.title)+'</b> ('+K.esc(l.t)+'): '+K.esc(l.body)});});
var STOP=['what','your','does','have','with','are','the','and','for','how','you','our','any','all','per','its','who','when','this','from','that'];
function answerQ(q){
 var words=q.toLowerCase().split(/[^a-z0-9]+/).filter(function(w){return w.length>2&&STOP.indexOf(w)<0;});
 var scored=VAULT.map(function(v){var s=0;words.forEach(function(w){if(v.text.indexOf(w)>=0)s++;});return {v:v,s:s};})
  .filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;});
 return scored.slice(0,2);
}
var qc=K.el('<div class="card"><h3>Security questionnaire auto-responder</h3><p class="k-muted" style="font-size:13px;margin-top:-6px">Ask a diligence question — it answers straight from the vault, with sources. This is what your buyers\' vendors wish they had.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px" id="qchips"></div><div style="display:flex;gap:8px"><input class="k-input" id="qq" placeholder="Do you encrypt data at rest?" style="flex:1"><button class="k-btn k-primary" id="qask">Answer</button></div><div id="qout" style="margin-top:12px"></div></div>');
wrap.appendChild(qc);
var SAMPLES=['Are you SOC 2 certified?','Where is customer data stored?','What happens during a security incident?','Do you encrypt data at rest?','When was your last penetration test?'];
SAMPLES.forEach(function(s){var b=K.el('<button class="k-btn" style="font-size:12px;padding:5px 12px">'+K.esc(s)+'</button>');b.onclick=function(){qc.querySelector('#qq').value=s;ask();};qc.querySelector('#qchips').appendChild(b);});
function ask(){
 var q=qc.querySelector('#qq').value.trim();
 if(!q){K.toast('Type a question first','warn');return;}
 var hits=answerQ(q), out=qc.querySelector('#qout');
 if(!hits.length){out.innerHTML='<div class="k-note">No vault record matches that question. In production this routes to the security team — and their answer becomes a new vault record.</div>';return;}
 out.innerHTML='<div style="font-size:14px;margin-bottom:8px"><b>Answer</b> <span class="k-muted">· from '+hits.length+' vault record'+(hits.length>1?'s':'')+'</span></div>'+hits.map(function(h){return '<div class="k-note" style="margin-bottom:8px"><div style="font-size:11px;font-weight:700;letter-spacing:.06em;color:#1d7a4f;margin-bottom:4px">SOURCE: '+K.esc(h.v.src.toUpperCase())+'</div><div style="font-size:13px">'+h.v.html+'</div></div>';}).join('');
}
qc.querySelector('#qask').onclick=ask;
qc.querySelector('#qq').onkeydown=function(e){if(e.key==='Enter')ask();};

function openSubscribe(){
  if(store.get('sub',null)){K.toast('You\u2019re subscribed \u2014 we\u2019ll email '+store.get('sub'),'ok');return;}
  var body='<p class="k-muted" style="font-size:13px">Get an email when certifications renew, policies change, or incidents post. One email per event, no marketing.</p><input class="k-input" id="subEmail" type="email" placeholder="you@company.com">';
  K.modal({title:'Subscribe to trust updates',body:body,actions:[{label:'Cancel'},{label:'Subscribe',primary:true,fn:function(){
    var v=((document.getElementById('subEmail')||{}).value||'').trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){K.toast('Enter a valid email','bad');setTimeout(openSubscribe,250);return;}
    store.set('sub',v);K.toast('Subscribed \u2014 welcome aboard','ok');
  }}]});
}
wrap.appendChild(K.el('<footer>Northwind Trust Center \u00b7 demo generated from a fictional compliance vault \u00b7 report issues to trust@northwind.cloud</footer>'));
})();
</script></body></html>
