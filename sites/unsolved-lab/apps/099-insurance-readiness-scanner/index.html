<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClaimReady — ClaimReady</title>
<link rel="stylesheet" href="../../shared/kit.css">
<style>:root{--bg:#f6f5f1;--panel:#ffffff;--panel2:#efece3;--ink:#1d1b16;--muted:#6f6a5e;--line:#e3dfd3;--accent:#b3541e;--accent2:#2e6f5e;--good:#2e7d4f;--warn:#b8860b;--bad:#c0392b;--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
.k-wrap{max-width:1100px;margin:0 auto;padding:20px}
.k-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1100px;margin:0 auto;padding:18px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.k-nav h1{margin:0;font-size:22px;letter-spacing:-.01em}
.k-nav p{margin:3px 0 0;font-size:13px}
.k-nav-actions{display:flex;gap:8px;flex-wrap:wrap}
.k-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin:14px 0}
.k-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.k-card h3{margin:0 0 8px;font-size:16px}
.k-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.k-btn:hover{border-color:var(--accent)}
.k-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.k-primary:hover{filter:brightness(1.08)}
.k-input,.k-select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--panel);color:var(--ink);font-family:inherit}
.k-input:focus,.k-select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
label.k-lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.k-table{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel)}
.k-table th,.k-table td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.k-table th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.k-table th.num,.k-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.k-table tbody tr:hover{background:var(--panel2)}
.k-badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--ink);white-space:nowrap}
.k-badge.ok{background:#e3f2e8;color:#1e6b3f}.k-badge.warn{background:#fbf0d3;color:#8a6100}.k-badge.bad{background:#f9e2de;color:#a93226}.k-badge.info{background:#ddebfb;color:#1d5fae}
.k-tabs{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}
.k-tab{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:99px;padding:8px 16px;cursor:pointer;font-size:14px;font-family:inherit}
.k-tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.k-tabpane{margin-top:6px}
.k-kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:150px;flex:1}
.k-kpi-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.k-kpi-v{font-size:28px;font-weight:750;margin-top:4px;letter-spacing:-.02em}
.k-kpi-d{font-size:13px;color:var(--muted);margin-top:2px}
.k-kpis{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.k-muted{color:var(--muted)}
.k-hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;margin:16px 0}
.k-hero h2{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.k-split{grid-template-columns:1fr}.k-kpi-v{font-size:22px}}
.k-toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:9999}
.k-toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 22px rgba(0,0,0,.25);transition:opacity .3s}
.k-toast.bad{background:var(--bad)}.k-toast.out{opacity:0}
.k-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9998;padding:18px}
.k-modal{background:var(--panel);border-radius:14px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:22px}
.k-modal h3{margin:0 0 10px;font-size:19px}
.k-modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.k-empty{text-align:center;padding:48px 20px;border:1px dashed var(--line);border-radius:var(--radius);background:var(--panel)}
.k-empty h3{margin:0 0 6px}
.k-bar-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.k-bar-label{width:170px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-bar-track{flex:1;background:var(--panel2);border-radius:99px;height:12px;overflow:hidden}
.k-bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.k-bar-val{width:90px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);flex-shrink:0}
.k-chart-lbl{font-size:12px;fill:var(--muted)}
.k-g-lbl{font-size:11px;fill:#fff;font-weight:700}
.k-donutw{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.k-donut-tot{font-size:26px;font-weight:750;fill:var(--ink)}
.k-legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.k-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px}
.k-tl-ev{display:flex;gap:14px;padding:12px 0;border-left:3px solid var(--line);padding-left:16px;margin-left:6px;position:relative}
.k-tl-ev:before{content:"";position:absolute;left:-7px;top:16px;width:11px;height:11px;border-radius:50%;background:var(--muted)}
.k-tl-ev.kind-bad{border-color:var(--bad)}.k-tl-ev.kind-bad:before{background:var(--bad)}
.k-tl-ev.kind-warn{border-color:var(--warn)}.k-tl-ev.kind-warn:before{background:var(--warn)}
.k-tl-ev.kind-good{border-color:var(--good)}.k-tl-ev.kind-good:before{background:var(--good)}
.k-tl-t{font-size:12px;color:var(--muted);min-width:110px;font-weight:600}
.k-tl-b strong{font-size:14px}
.k-tl-b p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.k-check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.k-check input{margin-top:3px;transform:scale(1.25);accent-color:var(--accent)}
.k-check.done span{color:var(--muted);text-decoration:line-through}
.k-tag{display:inline-block;background:var(--panel2);border-radius:6px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0;color:var(--muted)}
</style>
<style>/* appended after fallback CSS: align real-kit's class names with app expectations */
.k-tab.k-active{background:var(--ink);color:#fff;border-color:var(--ink)}
.k-toast-bad{background:var(--bad)!important;color:#fff}
.k-toast-warn{background:var(--warn)!important;color:#fff}
.k-toast-ok{background:var(--good)!important;color:#fff}
.k-toast-info{background:var(--ink);color:#fff}
/* shim nav: deterministic fixed dark bar regardless of which kit CSS wins */
.k-nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(16,18,22,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:none;margin:0;padding:0 16px;height:64px}
.k-nav .k-nav-t{display:flex;align-items:baseline;gap:10px;min-width:0}
.k-nav .k-nav-t h1{color:#f2f4f7;font-size:17px;margin:0;white-space:nowrap;letter-spacing:-.01em}
.k-nav .k-nav-t .k-muted{color:#9aa4b0;font-size:13px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body{padding-top:78px}
</style>

<style>
:root{--bg:#f2f6f7;--panel:#ffffff;--panel2:#e8eff1;--ink:#1a2a32;--muted:#63747d;--line:#dbe4e8;--accent:#0f6f8c;--accent2:#c26a1b;--good:#2e7d4f;--warn:#b8860b;--bad:#c0392b}
.k-nav h1{color:var(--accent)}
.room-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px}
.room-head h3{margin:0}
.iswatch{display:flex;gap:12px;align-items:center}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
.receipt{font-size:12px;color:var(--good)}
.noreceipt{font-size:12px;color:var(--warn)}
.pkg{background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:16px;font-family:ui-monospace,monospace;font-size:13px;white-space:pre-wrap}
</style>

</head>
<body>
<script src="../../shared/kit.js"></script>
<script>window.Kit = window.Kit || (function(){
'use strict';
function rng(seed){let s=String(seed),h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return function(){h=Math.imul(h^h>>>15,2246822519);h=Math.imul(h^h>>>13,3266489917);h^=h>>>16;return (h>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const int=(r,a,b)=>a+Math.floor(r()*(b-a+1));
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
let _uid=0;const uid=(p)=> (p||'id')+'-'+(++_uid)+'-'+Date.now().toString(36);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function el(html){const t=document.createElement('template');t.innerHTML=String(html).trim();return t.content.firstElementChild}
function store(ns){const k='kitfb:'+ns;return{get(d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(){try{localStorage.removeItem(k)}catch(e){}}}}
function nav(o){const h=el('<header class="k-nav"><div class="k-nav-t"><h1></h1><p class="k-muted"></p></div><div class="k-nav-actions"></div></header>');h.querySelector('h1').textContent=o.title||'';const sub=h.querySelector('p');if(o.sub)sub.textContent=o.sub;else sub.remove();const a=h.querySelector('.k-nav-actions');(o.actions||[]).forEach(x=>a.appendChild(typeof x==='string'?el(x):x));document.body.prepend(h);return h}
function toast(msg,kind){let c=document.querySelector('.k-toasts');if(!c){c=el('<div class="k-toasts"></div>');document.body.appendChild(c)}const t=el('<div class="k-toast"></div>');t.textContent=msg;if(kind)t.classList.add(kind);c.appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),350)},2600)}
function modal(o){const m=el('<div class="k-modal-ov"><div class="k-modal" role="dialog"><h3></h3><div class="k-modal-body"></div><div class="k-modal-actions"></div></div></div>');m.querySelector('h3').textContent=o.title||'';const b=m.querySelector('.k-modal-body');if(typeof o.body==='string')b.innerHTML=o.body;else if(o.body)b.appendChild(o.body);const ac=m.querySelector('.k-modal-actions');(o.actions||[]).forEach(x=>ac.appendChild(typeof x==='string'?el(x):x));m.addEventListener('click',e=>{if(e.target===m)m.remove()});document.body.appendChild(m);return m}
function tabs(host,defs){host.innerHTML='';const bar=el('<div class="k-tabs"></div>');const pane=el('<div class="k-tabpane"></div>');host.appendChild(bar);host.appendChild(pane);defs.forEach((d,i)=>{const b=el('<button type="button" class="k-tab"></button>');b.textContent=d.label;if(i===0)b.classList.add('active');b.onclick=()=>{bar.querySelectorAll('.k-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');pane.innerHTML='';d.render(pane)};bar.appendChild(b)});if(defs[0])defs[0].render(pane)}
function table(host,cols,rows,opt){opt=opt||{};host.innerHTML='';const w=el('<div class="k-tablew"></div>');const drawQ=(q)=>{let r=rows;if(q){q=q.toLowerCase();r=rows.filter(x=>cols.some(c=>String(x[c.key]==null?'':x[c.key]).toLowerCase().indexOf(q)>=0))}drawR(r)};if(opt.search){const s=el('<input class="k-input k-search" placeholder="Search\u2026" style="margin-bottom:10px">');s.oninput=()=>drawQ(s.value);w.appendChild(s)}const tw=el('<div></div>');w.appendChild(tw);host.appendChild(w);function drawR(r){const ps=opt.pageSize||r.length;const pg=r.slice(0,ps);tw.innerHTML='<table class="k-table"><thead><tr>'+cols.map(c=>'<th class="'+(c.num?'num':'')+'">'+esc(c.label)+'</th>').join('')+'</tr></thead><tbody>'+pg.map(x=>'<tr>'+cols.map(c=>'<td class="'+(c.num?'num':'')+'">'+(c.fmt?c.fmt(x[c.key],x):esc(x[c.key]==null?'':x[c.key]))+'</td>').join('')+'</tr>').join('')+'</tbody></table>'+(r.length>ps?'<p class="k-muted">Showing '+ps+' of '+r.length+'</p>':'')}drawR(rows)}
function bars(host,items){host.innerHTML='';items.forEach(i=>{const row=el('<div class="k-bar-row"><span class="k-bar-label"></span><div class="k-bar-track"><div class="k-bar-fill"></div></div><span class="k-bar-val"></span></div>');row.querySelector('.k-bar-label').textContent=i.label;const f=row.querySelector('.k-bar-fill');f.style.width=Math.min(100,Math.max(0,i.value))+'%';if(i.color)f.style.background=i.color;row.querySelector('.k-bar-val').textContent=i.valueText!=null?i.valueText:i.value;host.appendChild(row)})}
function line(host,series){const W=620,H=230,P=40;const all=[];series.forEach(s=>s.points.forEach(v=>all.push(v)));if(!all.length){host.innerHTML='<p class="k-muted">No data</p>';return}const mn=Math.min.apply(null,all),mx=Math.max.apply(null,all),rg=(mx-mn)||1;const npts=Math.max.apply(null,series.map(s=>s.points.length));const X=i=>P+i*(W-2*P)/Math.max(1,npts-1);const Y=v=>H-P-(v-mn)/rg*(H-2*P);host.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" class="k-chart" style="width:100%;height:auto"><text x="'+P+'" y="18" class="k-chart-lbl">'+mx+'</text><text x="'+P+'" y="'+(H-6)+'" class="k-chart-lbl">'+mn+'</text>'+series.map(s=>'<polyline fill="none" stroke="'+(s.color||'#888')+'" stroke-width="2.5" points="'+s.points.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')+'"/>').join('')+series.map((s,i)=>'<text x="'+(W-P-150)+'" y="'+(26+i*18)+'" fill="'+(s.color||'#888')+'" class="k-chart-lbl">'+esc(s.name)+'</text>').join('')+'</svg>'}
function donut(host,items){const tot=items.reduce((a,i)=>a+i.value,0)||1;let a0=0;const R=70,C=2*Math.PI*R;const segs=items.map(i=>{const f=i.value/tot;const s='<circle r="'+R+'" cx="90" cy="90" fill="none" stroke="'+(i.color||'#888')+'" stroke-width="26" stroke-dasharray="'+(f*C).toFixed(1)+' '+C.toFixed(1)+'" stroke-dashoffset="'+(-a0/360*C).toFixed(1)+'" transform="rotate(-90 90 90)"/>';a0+=f*360;return s}).join('');host.innerHTML='<div class="k-donutw"><svg viewBox="0 0 180 180" class="k-donut" style="width:170px">'+segs+'<text x="90" y="96" text-anchor="middle" class="k-donut-tot">'+tot+'</text></svg><div class="k-legend">'+items.map(i=>'<span><i style="background:'+(i.color||'#888')+'"></i>'+esc(i.label)+' ('+i.value+')</span>').join('')+'</div></div>'}
function timeline(host,events){host.innerHTML='';events.forEach(e=>{const d=el('<div class="k-tl-ev"><div class="k-tl-t"></div><div class="k-tl-b"><strong></strong><p></p></div></div>');d.classList.add('kind-'+(e.kind||'info'));d.querySelector('.k-tl-t').textContent=e.t;d.querySelector('strong').textContent=e.title;d.querySelector('p').textContent=e.body||'';host.appendChild(d)})}
function graph(host,g){const n=g.nodes.length||1,W=620,H=340;const pos={};g.nodes.forEach((x,i)=>{const a=i/n*Math.PI*2-Math.PI/2;pos[x.id]=[W/2+Math.cos(a)*(W/2-80),H/2+Math.sin(a)*(H/2-75)]});let svg='<svg viewBox="0 0 '+W+' '+H+'" class="k-graph" style="width:100%;height:auto">';g.edges.forEach(e=>{const p1=pos[e.a],p2=pos[e.b];if(!p1||!p2)return;svg+='<line x1="'+p1[0].toFixed(1)+'" y1="'+p1[1].toFixed(1)+'" x2="'+p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+'" stroke="var(--line)" stroke-width="2"/>';if(e.label)svg+='<text x="'+((p1[0]+p2[0])/2).toFixed(1)+'" y="'+((p1[1]+p2[1])/2).toFixed(1)+'" class="k-chart-lbl" text-anchor="middle">'+esc(e.label)+'</text>'});g.nodes.forEach(x=>{const p=pos[x.id];svg+='<g><circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="30" fill="'+(x.color||'var(--accent)')+'"/><text x="'+p[0].toFixed(1)+'" y="'+(p[1]+5).toFixed(1)+'" text-anchor="middle" class="k-g-lbl">'+esc(String(x.label).slice(0,11))+'</text><title>'+esc(x.label+(x.sub?'\u2014'+x.sub:''))+'</title></g>'});svg+='</svg>';host.innerHTML=svg}
const badge=(t,k)=>'<span class="k-badge '+(k||'')+'">'+esc(t)+'</span>';
function kpi(host,o){const d=el('<div class="k-kpi"><div class="k-kpi-l"></div><div class="k-kpi-v"></div></div>');d.querySelector('.k-kpi-l').textContent=o.label;d.querySelector('.k-kpi-v').textContent=o.value;if(o.delta){const dd=el('<div class="k-kpi-d"></div>');dd.textContent=o.delta;d.appendChild(dd)}host.appendChild(d)}
function empty(host,title,sub,al,afn){host.innerHTML='';const e=el('<div class="k-empty"><h3></h3><p class="k-muted"></p></div>');e.querySelector('h3').textContent=title;e.querySelector('p').textContent=sub||'';if(al){const b=el('<button type="button" class="k-btn k-primary"></button>');b.textContent=al;b.onclick=afn;e.appendChild(b)}host.appendChild(e)}
const money=n=>'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
const num=n=>Number(n).toLocaleString('en-US');
const pct=x=>(x*100).toFixed(1)+'%';
const when=d=>{try{return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}catch(e){return String(d)}};
const initials=n=>String(n).split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
function copy(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Copied to clipboard')).catch(()=>toast('Copy failed','bad'))}else toast('Copy unavailable','bad')}
return{rng:rng,pick:pick,int:int,shuffle:shuffle,uid:uid,esc:esc,el:el,store:store,nav:nav,toast:toast,modal:modal,tabs:tabs,table:table,bars:bars,line:line,donut:donut,timeline:timeline,graph:graph,badge:badge,kpi:kpi,empty:empty,money:money,num:num,pct:pct,when:when,initials:initials,copy:copy};
})();
</script>
<script>/* Kit compatibility shim: normalizes whichever Kit loaded (real shared kit
   or the inlined fallback) to the contract the apps were written against.
   - store: single-slot get(default)/set(value) over key-based or slot-based backends
   - nav: allows HTML-string and DOM-node actions (not just {href,label})
   - modal: allows DOM body + HTML-string/DOM actions (overlay class .k-modal-ov)
   - tabs: alias k-active styling */
(function(){
  var K = window.Kit;
  if (!K) return;
  var probe = null, keyBased = false;
  try {
    probe = K.store('__shim_probe__');
    if (probe && probe.set && probe.set.length >= 2) { keyBased = true; }
    else if (probe && probe.set) {
      probe.set('__k', '__v');
      try { keyBased = (probe.get('__k', '__miss') === '__v'); } catch (e) { keyBased = false; }
      try { probe.del('__k'); } catch (e) {}
    }
  } catch (e) { keyBased = false; }
  if (keyBased && K.store) {
    var origStore = K.store.bind(K);
    K.store = function (ns) {
      var s;
      try { s = origStore(ns); } catch (e) { return { get: function (d) { return d; }, set: function () {}, del: function () {} }; }
      return {
        get: function (d) { try { var v = s.get('__v', undefined); return v === undefined ? d : v; } catch (e) { return d; } },
        set: function (v) { try { s.set('__v', v); } catch (e) {} },
        del: function () { try { s.del('__v'); } catch (e) {} }
      };
    };
  }
  function isNode(a){ return a && typeof a === 'object' && a.nodeType === 1; }
  function needsRich(actions){
    return (actions || []).some(function (a) { return typeof a === 'string' || isNode(a); });
  }
  if (K.nav) {
    var origNav = K.nav.bind(K);
    K.nav = function (o) {
      o = o || {};
      if (!needsRich(o.actions)) return origNav(o);
      var h = document.createElement('header'); h.className = 'k-nav';
      var left = document.createElement('div'); left.className = 'k-nav-t';
      var h1 = document.createElement('h1'); h1.textContent = o.title || '';
      left.appendChild(h1);
      if (o.sub) { var p = document.createElement('p'); p.className = 'k-muted'; p.textContent = o.sub; left.appendChild(p); }
      var ra = document.createElement('div'); ra.className = 'k-nav-actions';
      (o.actions || []).forEach(function (a) {
        if (typeof a === 'string') {
          var t = document.createElement('template'); t.innerHTML = String(a).trim();
          if (t.content.firstElementChild) ra.appendChild(t.content.firstElementChild);
        } else if (isNode(a)) { ra.appendChild(a); }
        else if (a && a.label) {
          var b = document.createElement('button'); b.type = 'button'; b.className = 'k-btn'; b.textContent = a.label;
          if (typeof a.fn === 'function') b.addEventListener('click', a.fn);
          else if (a.href) b.addEventListener('click', function(){ location.href = a.href; });
          ra.appendChild(b);
        }
      });
      h.appendChild(left); h.appendChild(ra);
      document.body.insertBefore(h, document.body.firstChild);
      return h;
    };
  }
  if (K.modal) {
    var origModal = K.modal.bind(K);
    K.modal = function (o) {
      o = o || {};
      var bodyIsNode = isNode(o.body);
      if (!bodyIsNode && !needsRich(o.actions)) return origModal(o);
      var ov = document.createElement('div'); ov.className = 'k-modal-ov';
      var box = document.createElement('div'); box.className = 'k-modal'; box.setAttribute('role', 'dialog');
      var h3 = document.createElement('h3'); h3.textContent = o.title || '';
      var bd = document.createElement('div'); bd.className = 'k-modal-body';
      if (typeof o.body === 'string') bd.innerHTML = o.body; else if (o.body) bd.appendChild(o.body);
      var ac = document.createElement('div'); ac.className = 'k-modal-actions';
      (o.actions || []).forEach(function (a) {
        if (typeof a === 'string') {
          var t = document.createElement('template'); t.innerHTML = String(a).trim();
          if (t.content.firstElementChild) ac.appendChild(t.content.firstElementChild);
        } else if (isNode(a)) { ac.appendChild(a); }
        else if (a && a.label) {
          var b = document.createElement('button'); b.type = 'button';
          b.className = 'k-btn' + (a.primary ? ' k-primary' : ''); b.textContent = a.label;
          b.addEventListener('click', function(){ if (typeof a.fn === 'function') a.fn(); ov.remove(); });
          ac.appendChild(b);
        }
      });
      box.appendChild(h3); box.appendChild(bd); box.appendChild(ac); ov.appendChild(box);
      ov.addEventListener('click', function (e) { if (e.target === ov) ov.remove(); });
      document.body.appendChild(ov);
      return ov;
    };
  }
})();
</script>

<div class="k-wrap">
  <div class="k-hero">
    <h2>📋 ClaimReady</h2>
    <p class="k-muted">A visual household inventory with ownership evidence. If disaster strikes, you hand the adjuster a package — not a memory.</p>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="k-btn k-primary" id="exportBtn" data-core>📦 Export claim package</button>
      <button class="k-btn" id="addBtn">+ Add item</button>
    </div>
  </div>
  <div class="k-kpis" id="kpis"></div>
  <div id="gaps" style="margin-top:16px"></div>
  <div id="rooms"></div>
</div>


<script>
(function(){
const K=window.Kit, R=K.rng('claimready-v1');
const ROOMS={
 'Living Room':[['Sofa — Article Sven 3-seater',1299,'Article','2023-05','🧋',true],['LG C3 55" OLED TV',1399,'Best Buy','2024-02','📺',true],['MacBook Pro 14" (work)',1999,'Apple','2024-11','💻',true],['Rug — 8×10 wool',449,'Rugs USA','2022-09','🟫',false],['Bookshelf + ~120 books',800,'various','—','📚',false]],
 'Primary Bedroom':[['Queen bed frame — walnut',899,'Article','2023-05','🛏',true],['Mattress — Avocado Green',1799,'Avocado','2023-05','🛏',true],['Dresser — 6 drawer',649,'IKEA','2021-08','🗄',false],['Canon EOS R6 + 24-105mm',2499,'B&H','2022-12','📷',true]],
 'Kitchen':[['Samsung RF28R7351SR fridge',2149,'Best Buy','2023-08','🧊',true],['Bosch 800 dishwasher',1199,'Lowe\u2019s','2024-02','🍽',true],['KitchenAid stand mixer',499,'Amazon','2022-11','🎂',true],['Knife set — Wüsthof',399,'Sur La Table','2021-12','🔪',false],['Espresso machine — Breville Barista',749,'Williams Sonoma','2023-01','☕',true]],
 'Garage / Utility':[['Washer LG WM3900HWA',699,'Home Depot','2018-06','🌀',false],['Dryer Samsung DV45K',649,'Home Depot','2019-03','🌀',false],['Tool chest + power tools',1200,'various','—','🧰',false],['Bikes × 2',1800,'Mike\u2019s Bikes','2022-04','🚲',true]],
 'Office':[['Standing desk + Herman Miller Aeron',1694,'Herman Miller','2023-09','🪑',true],['Studio Display 27"',1599,'Apple','2024-01','🖥',true],['iPad Pro 12.9"',1099,'Apple','2023-12','📱',true]]
};
const store=K.store('claimready');let custom=store.get({});
const flagStore=K.store('claimready-flags');let flags=flagStore.get({});
K.nav({title:'ClaimReady',sub:'household inventory · evidence vault'});
function allRooms(){
 const r=JSON.parse(JSON.stringify(ROOMS));
 Object.entries(custom).forEach(([room,items])=>{r[room]=(r[room]||[]).concat(items)});
 Object.values(r).forEach(arr=>arr.forEach(it=>{if(flags[it[0]]!=null)it[5]=!!flags[it[0]]}));
 return r;
}
function totals(){
 let items=0,value=0,receipts=0;
 Object.values(allRooms()).forEach(arr=>arr.forEach(it=>{items++;value+=it[1];if(it[5])receipts++}));
 return {items:items,value:value,receipts:receipts};
}
function render(){
 const t=totals();
 const k=document.getElementById('kpis');k.innerHTML='';
 K.kpi(k,{label:'Items inventoried',value:String(t.items)});
 K.kpi(k,{label:'Total insured value',value:K.money(t.value)});
 K.kpi(k,{label:'With receipts',value:t.receipts+'/'+t.items,delta:Math.round(t.receipts/t.items*100)+'% evidenced'});
 K.kpi(k,{label:'Claim readiness',value:readiness(t)+'%',delta:readiness(t)>=80?'adjuster-ready':'add receipts + photos'});
 renderGaps();
 const host=document.getElementById('rooms');host.innerHTML='';
 Object.entries(allRooms()).forEach(([room,items])=>{
  const rv=items.reduce((s,i)=>s+i[1],0);
  const rh=K.el('<div class="room-head"><h3>🏠 '+K.esc(room)+'</h3><span class="k-muted">'+items.length+' items · '+K.money(rv)+'</span></div>');
  host.appendChild(rh);
  const g=K.el('<div class="k-grid"></div>');host.appendChild(g);
  items.forEach(it=>{
   const c=K.el('<div class="k-card"><div class="iswatch"><div class="thumb">'+it[4]+'</div><div><strong style="font-size:14px"></strong><div class="k-muted" style="font-size:12px"></div><div style="font-size:14px;font-weight:700;margin-top:2px"></div></div></div><div style="margin-top:8px"></div></div>');
   c.querySelector('strong').textContent=it[0];
   c.querySelectorAll('div')[3].textContent=it[2]+' · '+it[3];
   c.querySelectorAll('div')[4].textContent=K.money(it[1]);
   c.querySelectorAll('div')[5].innerHTML=it[5]?'<span class="receipt">✓ receipt on file</span>':'<span class="noreceipt">⚠ no receipt — photo + card statement?</span>';
   g.appendChild(c);
  });
 });
}
function readiness(t){return Math.round((t.receipts/t.items)*70+Math.min(30,t.items/2))}
function gaps(){
 const t=totals(),base=readiness(t);
 return Object.entries(allRooms()).flatMap(([room,arr])=>arr.filter(it=>!it[5]).map(it=>{
  const nr=t.receipts+1;
  return {room:room,it:it,gain:Math.round((nr/t.items)*70+Math.min(30,t.items/2))-base};
 })).sort((a,b)=>b.it[1]-a.it[1]).slice(0,5);
}
function renderGaps(){
 const host=document.getElementById('gaps'),gs=gaps();
 if(!gs.length){host.innerHTML='<div class="k-card"><h3>✅ Evidence complete</h3><p class="k-muted">Every item has a receipt on file. The adjuster will love you.</p></div>';return}
 host.innerHTML='<div class="k-card"><h3>🎯 Close these evidence gaps</h3><p class="k-muted">Highest-value items with no receipt — how much each one lifts your readiness score.</p><div id="gl"></div></div>';
 const gl=host.querySelector('#gl');
 gs.forEach(g=>{
  const row=K.el('<div class="k-flex" style="justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center"><span><b></b><br><span class="k-small k-muted"></span></span><span style="text-align:right;flex:none"></span></div>');
  row.children[0].children[0].textContent=g.it[4]+' '+g.it[0];
  row.children[0].children[2].textContent=g.room+' · '+K.money(g.it[1])+' · ⚠ no receipt';
  const gain=K.el('<div style="margin-bottom:6px"><b style="color:var(--good)">+'+g.gain+'% readiness</b></div>');
  const b=K.el('<button class="k-btn">✓ Receipt on file</button>');
  b.onclick=()=>{flags[g.it[0]]=true;flagStore.set(flags);K.toast('Receipt filed: '+g.it[0]);render()};
  row.children[1].appendChild(gain);row.children[1].appendChild(b);
  gl.appendChild(row);
 });
}
document.getElementById('exportBtn').onclick=()=>{
 const t=totals();
 let txt='HOUSEHOLD CLAIM PACKAGE\nGenerated '+new Date().toLocaleDateString()+' · 456 Oak Ave #12, Riverton CA 94000\nPolicy: State Farm HO-8841201 · Agent J. Park 650-555-0188\n'+'='.repeat(56)+'\n';
 Object.entries(allRooms()).forEach(([room,items])=>{
  txt+='\n## '+room.toUpperCase()+' ('+items.length+' items, '+K.money(items.reduce((s,i)=>s+i[1],0))+')\n';
  items.forEach(it=>{txt+='- '+it[0]+' — '+K.money(it[1])+' · '+it[2]+' '+it[3]+(it[5]?' [RECEIPT ✓]':' [NO RECEIPT]')+'\n'});
 });
 txt+='\nTOTAL INSURED VALUE: '+K.money(t.value)+'\nITEMS: '+t.items+' · RECEIPTS: '+t.receipts+'\n\nAttach: photos of each room, serial-number close-ups, PDF receipts.\n';
 const body=K.el('<div><p class="k-muted">A plain-text package any adjuster can open. Photos + PDF receipts attach separately.</p><div class="pkg"></div></div>');
 body.querySelector('.pkg').textContent=txt;
 const dl=K.el('<button class="k-btn k-primary">⬇ Download .txt</button>');
 dl.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='claim-package.txt';a.click();K.toast('Claim package downloaded')};
 K.modal({title:'Claim package — '+K.money(t.value),body:body,actions:['<button class="k-btn" onclick="this.closest(\'.k-modal-ov\').remove()">Close</button>',dl]});
};
document.getElementById('addBtn').onclick=()=>{
 const f=K.el('<div><label class="k-lbl">Item</label><input id="n" class="k-input"><label class="k-lbl">Room</label><input id="r" class="k-input" value="Living Room"><label class="k-lbl">Value ($)</label><input id="v" type="number" class="k-input" value="100"><label class="k-lbl">Receipt on file?</label><select id="rc" class="k-select"><option value="1">Yes</option><option value="0">No</option></select></div>');
 const sv=K.el('<button class="k-btn k-primary">Add item</button>');
 sv.onclick=()=>{const n=f.querySelector('#n').value.trim();if(!n){K.toast('Name the item','bad');return}
  const room=f.querySelector('#r').value||'Misc';
  custom[room]=custom[room]||[];custom[room].push([n,+f.querySelector('#v').value||0,'—','—','📦',f.querySelector('#rc').value==='1']);
  store.set(custom);document.querySelector('.k-modal-ov').remove();K.toast('Item added');render()};
 K.modal({title:'Add inventory item',body:f,actions:['<button class="k-btn" onclick="this.closest(\'.k-modal-ov\').remove()">Cancel</button>',sv]});
};
render();
})();
</script>
