<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>DR: The "Us" Book</title>
<style>
  :root { --accent: #b3402e; --paper: #faf7f1; --ink: #2b2620; --muted: #8a8177; --card: #fff; --line: #e8e0d3; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 16px; line-height: 1.55; padding-bottom: 110px; }
  button { touch-action: manipulation; font-size: 16px; }
  textarea, input { font-size: 16px !important; touch-action: manipulation; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px 40px; }
  .back { display: inline-block; margin: 8px 0 4px; color: var(--muted); text-decoration: none; font-size: 15px; }
  h1 { font-family: Georgia, serif; font-size: 30px; margin: 6px 0 4px; letter-spacing: -0.3px; }
  .sub { color: var(--muted); font-size: 15px; margin-bottom: 6px; }
  .privacy { background: #f3ece0; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: #6d6355; margin: 14px 0 22px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; margin: 0 0 16px; box-shadow: 0 1px 3px rgba(60,40,20,.05); }
  .qnum { font-size: 12px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .card h2 { font-family: Georgia, serif; font-size: 21px; margin: 4px 0 10px; }
  .curlabel { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .curbody { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 15.5px; }
  .curbody.big { font-family: Georgia, serif; font-size: 24px; text-align: center; }
  .kitstake { margin: 12px 0 4px; font-size: 14.5px; color: #5c554a; background: #fbf3e4; border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 0 8px 8px 0; }
  .kitstake span { font-weight: 700; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .opt { text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .opt .ot { font-weight: 700; display: block; margin-bottom: 2px; }
  .opt .od { font-size: 14px; color: #6d6355; }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: #fdf2ee; }
  .q { font-weight: 700; margin: 14px 0 4px; font-size: 15.5px; }
  textarea.notes { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; resize: vertical; font-family: inherit; }
  textarea.notes::placeholder { color: #b3a897; }
  .footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: rgba(250,247,241,.97); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 10px; }
  .pill { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #2fa84f; }
  .dot.busy { background: #e0a32e; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .fbtn { border: none; border-radius: 12px; padding: 12px 18px; font-weight: 700; cursor: pointer; }
  #copyBtn { background: #efe9dc; color: var(--ink); }
  #submitBtn { background: var(--accent); color: #fff; flex: 1; }
  #submitBtn:disabled { opacity: .7; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(10px); background: var(--accent); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14.5px; font-weight: 600; opacity: 0; transition: all .25s; z-index: 60; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .finalopts .opt { text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../design-docs/">‹ Design docs</a>
  <h1>DR: The &ldquo;Us&rdquo; Book</h1>
  <div class="sub">436 pages, 5 chapters, 12 highlights, 2,715 messages, 164 photos. Your calls below.</div>
  <div class="privacy">Privacy note: this board lives on your unlisted projects site, so her name appears as &ldquo;G.&rdquo; and no intimate message text is quoted here. The book itself is unchanged.</div>
  <div id="cards"></div>
</div>

<div class="footer">
  <div class="pill"><span class="dot" id="saveDot"></span><span id="saveTxt">Saved</span></div>
  <button class="fbtn" id="copyBtn">Copy answers</button>
  <button class="fbtn" id="submitBtn">Submit</button>
</div>
<div class="toast" id="toast"></div>

<script>
const SLUG = "us-book-dr";
const STORE_KEY = "dr-us-book-dr-v1";

const CARDS = [
{ key:"title", num:"1", h:"Book title",
  cur:'<div class="curbody big">Us</div>',
  take:"Short, warm, and it was your pick from the start. The new ideas below range from the poetic (Nuvole Bianche) to the inside joke (The Extended Warranty). My honest ranking: Us, Hey!, and Just Mine are the strongest covers.",
  q:"Your call: which title ships on the cover?",
  opts:[
    {v:"us", t:"\u201cUs\u201d", d:"The original pick. Simple, confident."},
    {v:"hey", t:"\u201cHey!\u201d", d:"Her first word to you. Playful, specific to your story."},
    {v:"rest", t:"\u201cThe Rest of My Life\u201d", d:"The emotional thesis, from her January 8 message."},
    {v:"true", t:"\u201cEvery Word of It True\u201d", d:"From the dedication. A quiet vow."},
    {v:"nuvole", t:"\u201cNuvole Bianche\u201d", d:"The piano piece he played for her. Poetic, private."},
    {v:"whyme", t:"\u201cWhy Me?\u201d", d:"His November prayer of gratitude. Humble, real."},
    {v:"justmine", t:"\u201cJust Mine\u201d", d:"From her October 26 message: you were mine, just mine."},
    {v:"septjan", t:"\u201cSeptember to January\u201d", d:"Plain and true. The whole story in four months."},
    {v:"sayit", t:"\u201cSay It First\u201d", d:"She said I love you first, and it mattered to her."},
    {v:"warranty", t:"\u201cThe Extended Warranty\u201d", d:"The meet-cute joke from night one. Funny, maybe too jokey for a cover."}
  ]},
{ key:"dedication", num:"2", h:"Dedication page",
  cur:'<div class="curbody big">For G. \u2014<br>every word of it true.</div>',
  take:"The current line is quietly devastating in the best way. The alternatives lean more playful. Depends whether you want the dedication to ache a little or smile.",
  q:"Your call: which dedication opens the book?",
  opts:[
    {v:"keep", t:"Keep it", d:"\u201cFor G. \u2014 every word of it true.\u201d"},
    {v:"heyfirst", t:"\u201cFor the girl who said hey first.\u201d", d:"Playful, calls back to chapter one."},
    {v:"babe", t:"\u201cFor babe\u201d", d:"Your words."},
    {v:"edamame", t:"\u201cFor my edamame bean\u201d", d:"Your words."},
    {v:"none", t:"Drop the dedication", d:"Let the title page stand alone."}
  ]},
{ key:"chapters", num:"3", h:"Chapter titles (the arc)",
  cur:'<div class="curbody">1. \u201cHey!\u201d (September)<br>2. \u201cI Love You\u201d (October)<br>3. \u201cThankful\u201d (November)<br>4. \u201cHome for Christmas\u201d (December)<br>5. \u201cThe Rest of My Life\u201d (January)</div>',
  take:"The quoted titles trace the relationship\u2019s escalation and each one is a real line from your story. Plain month names would be safer but far less moving.",
  q:"Your call: keep the story titles, or simplify?",
  opts:[
    {v:"keep", t:"Keep the story titles", d:"Each title is a beat in the relationship."},
    {v:"months", t:"Just use months", d:"September 2023, October 2023, etc. Cleaner, less exposed."},
    {v:"mixed", t:"Keep, but I will rename some", d:"Tell me which in the notes field."}
  ]},
{ key:"highlights", num:"4", h:"Highlights page (new)",
  cur:'<div class="curbody">A &ldquo;Highlights&rdquo; index right after the dedication: twelve landmark moments in order, each tappable to jump to it. In the flow, each moment gets a gold outline, a cream tint, and a &star; label like &ldquo;The 2 AM confession&rdquo;.</div>',
  take:"This solves the \u201c411 pages is a lot\u201d problem twice: she can read just the twelve moments, or dive deep. The twelve I picked trace the relationship arc, but swap any of them in the notes.",
  q:"Your call: keep the highlights page?",
  opts:[
    {v:"keep12", t:"Keep all twelve", d:"The first word, the second date ask, walls coming down, every date keeps getting better, the 2 AM confession, the park/church/hand-hold, caring through sickness, Thanksgiving, \u201cWhy me?\u201d, learning the hard way, the boundaries talk, \u201cthe rest of my life\u201d."},
    {v:"fewer", t:"Fewer highlights", d:"Name the keepers in the notes; I will cut the rest."},
    {v:"drop", t:"Drop the page", d:"No index, no gold bubbles. Just the flow."}
  ]},
{ key:"ch1", num:"5", h:"Chapter 1 summary \u2014 September",
  cur:'<div class="curbody">It started with a joke about a car’s extended warranty. From the first night, we never really stopped talking: piano pieces and nursing school, boba runs and Costco, Liverpool (the card game her family has played for forty years) and Nuvole Bianche. We talked about faith early and often, finding the same language right away. By the last week of the month we’d both stopped holding back, and it felt easy. A second date was already in the books. We didn’t know it yet, but the tone for everything after was set in these first twenty-six days: funny, honest, and just a little bit fearless.</div>',
  take:"Sets the meet-cute tone well. The shorter cut keeps every key beat if you want the chapters to breathe less.",
  q:"Your call: full summary or the shorter cut?",
  opts:[
    {v:"keep", t:"Keep as written", d:"The full 150-word version above."},
    {v:"short", t:"Shorter cut", d:"It started with a joke about a car’s extended warranty, and we never really stopped talking. Piano and nursing school, faith talked about early and often, walls coming down by week three. Funny, honest, and just a little bit fearless from day one."}
  ]},
{ key:"ch2", num:"6", h:"Chapter 2 summary \u2014 October",
  cur:'<div class="curbody">October was the month it turned real. The dates kept getting better. She left every one thinking how happy and blessed she was. Then came our first hard conversation, handled with unusual gentleness, and a 2 AM confession about old patterns of shame that could have ended things before they started. Instead, ten days later, the words appeared: I love you. Her late-night messages from October 26 read like a vow already. My church felt like family to her. Holding my hand felt like belonging. The month closed with me sick and her quoting John 9:3 back at me, caring for me the way she’d been cared for. Love, it turned out, looked a lot like showing up.</div>',
  take:"This is the emotional center of the book. I would not cut the 2 AM confession beat, it is the hinge the whole chapter turns on.",
  q:"Your call: full summary or the shorter cut?",
  opts:[
    {v:"keep", t:"Keep as written", d:"The full version above."},
    {v:"short", t:"Shorter cut", d:"The month it turned real. Great dates, one hard conversation handled gently, a 2 AM confession that could have ended everything. Instead: I love you. My church felt like family to her, holding my hand felt like belonging. Love looked a lot like showing up."}
  ]},
{ key:"ch3", num:"7", h:"Chapter 3 summary \u2014 November",
  cur:'<div class="curbody">By November we had a rhythm: morning texts, late-night goodnights, a steady drumbeat of I love yous. There was a wobble mid-month, a night she thought it might be over, and we talked through it like people who intended to stay. Her car got broken into and she turned it into a gratitude list. Thanksgiving came, and we spent it together. At the end of the month I wrote the line that says everything about where this was headed: “Why, Lord God, have you blessed me with such a wonderful and smart loving and beautiful woman? Why me?”</div>',
  take:"The wobble-then-repair beat is honest and worth keeping. November is the quiet chapter; the summary should stay warm, not dramatic.",
  q:"Your call: full summary or the shorter cut?",
  opts:[
    {v:"keep", t:"Keep as written", d:"The full version above."},
    {v:"short", t:"Shorter cut", d:"A rhythm set in: morning texts, nightly goodnights, I love yous on repeat. One wobble, talked through. Her car got broken into and she made it a gratitude list. Thanksgiving together. I ended the month asking God: why me, why this blessing?"}
  ]},
{ key:"ch4", num:"8", h:"Chapter 4 summary \u2014 December",
  cur:'<div class="curbody">December was about belonging. Christmas parties and gifts bought weeks early. She told me she had learned nearly every lesson the hard way, and I listened. I brought her into the hardest part of my life, my family, and the old ache of not feeling heard, and she met it with steadiness. We set boundaries together, deliberately, with accountability and grace, and I called it one of the best decisions of my life. By New Year’s Eve, we weren’t two people dating anymore. We were a unit.</div>',
  take:"\u201cThey were a unit\u201d is the line the whole chapter earns. The shorter cut keeps it.",
  q:"Your call: full summary or the shorter cut?",
  opts:[
    {v:"keep", t:"Keep as written", d:"The full version above."},
    {v:"short", t:"Shorter cut", d:"A month about belonging. Christmas parties, gifts bought early, her hard-won lessons heard with care. I brought her into the hardest part of my life and she met it with steadiness. Boundaries set together, with grace. By New Year’s Eve we were a unit."}
  ]},
{ key:"ch5", num:"9", h:"Chapter 5 summary \u2014 January",
  cur:'<div class="curbody">The new year opened with everything settled and nothing small. On January 8, past midnight, she wrote the message this whole book has been walking toward: it feels too early to say, but I want to spend the rest of my life with you. Not for the romance of it, she said, but for my character, the thing that gave her hope for the future. The days that followed were ordinary in the best way: daily words, inside jokes, furniture links, missing each other. The export ends mid-conversation on January 15, and that is exactly right. Our story doesn’t end here.</div>',
  take:"The closing line is doing real work: it turns \u201cthe export ran out\u201d into a feature. Keep it unless you want the book to feel finished.",
  q:"Your call: full summary or the shorter cut?",
  opts:[
    {v:"keep", t:"Keep as written", d:"The full version above."},
    {v:"short", t:"Shorter cut", d:"The new year opened certain. Past midnight on January 8 she wrote it: I want to spend the rest of my life with you. Not for romance, for character. Then ordinary days in the best way. It ends mid-conversation, because our story doesn’t end here."}
  ]},
{ key:"photos", num:"10", h:"Chat photos (150)",
  cur:'<div class="curbody">150 photos pulled from the messages, placed inline in the chat flow where they were shared, across 98 moments.</div>',
  take:"The photos are the soul of the book. 150 across 435 pages is roughly one every three pages, which feels right, not heavy.",
  q:"Your call: photo count?",
  opts:[
    {v:"keep150", t:"Keep all 150", d:"Roughly one photo every 3 pages."},
    {v:"trim75", t:"Trim to ~75 best", d:"Only the strongest, most personal shots."},
    {v:"more", t:"Add more", d:"I have 1,294 extracted; we can go denser."}
  ]},
{ key:"profiles", num:"11", h:"Dating profile screenshots (14)",
  cur:'<div class="curbody">14 screenshots from both of your dating profiles, alternating hers and yours, spread evenly through the whole book. Hers appear on her side, yours on your side.</div>',
  take:"Spread out, they are a nice recurring motif. Grouped at the front, they would read as a \u201chow we met\u201d prologue, which is arguably where they belong chronologically.",
  q:"Your call: where do the profiles live?",
  opts:[
    {v:"spread", t:"Keep spread throughout", d:"A recurring motif, one every ~30 pages."},
    {v:"front", t:"Group at the front", d:"A \u201chow we met\u201d prologue before chapter one."},
    {v:"drop", t:"Drop them", d:"Profiles stay out of the book."}
  ]},
{ key:"size", num:"12", h:"Book size (435 pages)",
  cur:'<div class="curbody">435 pages at 8\u00d710 in. Prints as one volume (under the 440-page single-book limit), but it is a hefty object.</div>',
  take:"Honest take: 435 pages is a lot to hand someone. A ~200-page cut would read in one sitting and feel like a gift instead of an archive. But nothing in the current cut is filler, so trimming means losing real moments.",
  q:"Your call: keep the tome or tighten it?",
  opts:[
    {v:"keep", t:"Keep 435 pages", d:"Everything stays. A hefty keepsake."},
    {v:"trim200", t:"Tighten to ~200 pages", d:"Lose the lighter moments, keep every peak."}
  ]}
];

const FINAL_Q = { key:"final", h:"Final call",
  opts:[
    {v:"print", t:"Print it", d:"Ship the book as decided above."},
    {v:"revise", t:"Revise first", d:"I will make the changes from your picks, then you review again."},
    {v:"hold", t:"Hold", d:"Not yet. Keep the draft warm."}
  ]};

let state = { picks:{}, notes:{}, final:null, otherNotes:"" };
try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (s) state = Object.assign(state, s); } catch(e) {}

const cardsEl = document.getElementById("cards");
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function render(){
  cardsEl.innerHTML = "";
  CARDS.forEach(c => {
    const sec = document.createElement("section");
    sec.className = "card";
    sec.innerHTML =
      '<div class="qnum">Question ' + c.num + '</div><h2>' + c.h + '</h2>' +
      '<div class="curlabel">Current</div>' + c.cur +
      '<div class="kitstake"><span>Kit\u2019s take:</span> ' + c.take + '</div>' +
      '<div class="opts">' + c.opts.map(o =>
        '<button class="opt" data-q="' + c.key + '" data-v="' + o.v + '" aria-pressed="' + (state.picks[c.key]===o.v) + '">' +
        '<span class="ot">' + o.t + '</span><span class="od">' + o.d + '</span></button>').join("") + '</div>' +
      '<div class="q">' + c.q + '</div>' +
      '<textarea class="notes" data-q="' + c.key + '" placeholder="My wording / notes\u2026">' + esc(state.notes[c.key]) + '</textarea>';
    cardsEl.appendChild(sec);
  });
  const f = document.createElement("section");
  f.className = "card";
  f.innerHTML = '<div class="qnum">Final</div><h2>' + FINAL_Q.h + '</h2>' +
    '<div class="opts finalopts">' + FINAL_Q.opts.map(o =>
      '<button class="opt" data-q="final" data-v="' + o.v + '" aria-pressed="' + (state.final===o.v) + '">' +
      '<span class="ot">' + o.t + '</span><span class="od">' + o.d + '</span></button>').join("") + '</div>' +
    '<div class="q">Your call: what happens next?</div>';
  cardsEl.appendChild(f);
  const o = document.createElement("section");
  o.className = "card";
  o.innerHTML = '<div class="qnum">Anything else</div><h2>Other notes</h2>' +
    '<textarea class="notes" id="otherNotes" placeholder="Anything the questions didn\u2019t cover\u2026">' + esc(state.otherNotes) + '</textarea>';
  cardsEl.appendChild(o);

  cardsEl.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    const q = b.dataset.q, v = b.dataset.v;
    if (q === "final") { state.final = (state.final === v) ? null : v; }
    else { state.picks[q] = (state.picks[q] === v) ? null : v; }
    save(); render();
  }));
  cardsEl.querySelectorAll("textarea.notes").forEach(t => {
    if (t.id === "otherNotes") t.addEventListener("input", () => { state.otherNotes = t.value; save(); });
    else t.addEventListener("input", () => { state.notes[t.dataset.q] = t.value; save(); });
  });
}

const dot = document.getElementById("saveDot"), saveTxt = document.getElementById("saveTxt");
function setPill(mode, txt){
  dot.className = "dot" + (mode === "busy" ? " busy" : "");
  saveTxt.textContent = txt;
}
let saveTimer = null;
function save(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doServerSave, 1200);
}
function doServerSave(){
  const now = new Date();
  const hm = now.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  setPill("busy", "Saving\u2026");
  fetch("/api/decision/autosave", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ slug: SLUG, picks: state.picks, notes: state.notes, final: state.final, otherNotes: state.otherNotes })
  }).then(r => { if (r.ok) setPill("", "Autosaved " + hm); else setPill("", "Saved on this device"); })
    .catch(() => setPill("", "Saved on this device"));
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

document.getElementById("copyBtn").addEventListener("click", async () => {
  const lines = ["DR: The Us Book \u2014 answers"];
  CARDS.forEach(c => {
    const o = c.opts.find(x => x.v === state.picks[c.key]);
    lines.push(c.num + ". " + c.h + ": " + (o ? o.t : "(no pick)"));
    if (state.notes[c.key]) lines.push("   notes: " + state.notes[c.key]);
  });
  const fo = FINAL_Q.opts.find(x => x.v === state.final);
  lines.push("Final: " + (fo ? fo.t : "(no pick)"));
  if (state.otherNotes) lines.push("Other: " + state.otherNotes);
  try { await navigator.clipboard.writeText(lines.join("\n")); toast("\u2713 Answers copied"); }
  catch(e){ toast("Copy failed"); }
});

const submitBtn = document.getElementById("submitBtn");
submitBtn.addEventListener("click", async () => {
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span>Submitting\u2026';
  try {
    const r = await fetch("/api/decision/submit", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ slug: SLUG, picks: state.picks, notes: state.notes, final: state.final, otherNotes: state.otherNotes }) });
    if (r.ok) toast("Submitted \u2014 Kit can read it now");
    else toast("Submit failed \u2014 answers are saved here");
  } catch(e){ toast("Submit failed \u2014 answers are saved here"); }
  submitBtn.disabled = false;
  submitBtn.textContent = "Submit";
});

render();
</script>
</body>
</html>
