<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yuru Ink — つぶやきProcessing recreations</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  /* bottom-sheet-drag-lock: lock the page to the viewport so downward drags
     stay in the artwork instead of yanking the native sheet */
  html,body{height:100%;background:#090909;color:#8a8a8a;
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    overscroll-behavior:none;position:fixed;inset:0;width:100%;overflow:hidden;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:20px;}
  .tabs{display:flex;background:#141414;border:1px solid #242424;border-radius:999px;
    padding:4px;margin-bottom:16px;}
  .tabs button{font:inherit;font-size:13px;color:#777;background:none;border:0;
    border-radius:999px;padding:8px 26px;cursor:pointer;touch-action:manipulation;}
  .tabs button.on{background:#2a2a2a;color:#eee;}
  #stage{width:min(92vmin,560px);touch-action:none;}
  #stage canvas{display:none;width:100%!important;height:auto!important;border-radius:6px;
    touch-action:none;user-select:none;-webkit-user-select:none;}
  #stage canvas.on{display:block;}
  .hint{margin-top:12px;font-size:12px;color:#4d4d4d;letter-spacing:.04em;
    transition:opacity .8s;}
  .hint.gone{opacity:0;}
  .cap{margin-top:14px;text-align:center;font-size:12.5px;line-height:1.7;max-width:560px;}
  .cap a{color:#b5b5b5;text-decoration:none;border-bottom:1px solid #3a3a3a;
    touch-action:manipulation;}
  .cap a:hover{color:#fff;}
  details{margin-top:10px;font-size:11.5px;color:#555;}
  details summary{cursor:pointer;touch-action:manipulation;list-style:none;color:#777;}
  details summary::-webkit-details-marker{display:none;}
  details summary:hover{color:#aaa;}
  details pre{margin-top:10px;padding:14px;background:#101010;border:1px solid #222;
    border-radius:8px;overflow:auto;max-height:38vh;text-align:left;font-size:11px;line-height:1.6;color:#999;
    white-space:pre-wrap;word-break:break-all;}
</style>
</head>
<body>
<div class="tabs">
  <button id="tab-ink" class="on">ink</button>
  <button id="tab-silk">silk</button>
</div>
<div id="stage"></div>
<div class="hint" id="hint">touch and drag to stir</div>
<div class="cap" id="cap"></div>
<script src="p5.min.js"></script>
<script>
/* bottom-sheet-drag-lock parts 3+4: kill default touch behavior so the
   webview never hands the drag to the native sheet. Full-viewport page with
   no scrollable content, so document-level prevention is correct. */
document.addEventListener("touchmove", function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
</script>
<script>
/* Two verbatim recreations of @yuruyurau's つぶやきProcessing sketches
   (reformatted only), plus one addition: each active finger (or pressed
   mouse) becomes a well that parts the artwork. Untouched, each piece is
   the original. */
var R = 55, PUSH = 45;

function makeWells(p){
  var wells = [];
  if (p.touches && p.touches.length){
    for (var m = 0; m < p.touches.length && m < 4; m++) wells.push(p.touches[m]);
  } else if (p.mouseIsPressed && p.mouseX >= 0 && p.mouseX <= 400 &&
             p.mouseY >= 0 && p.mouseY <= 400){
    wells.push({x: p.mouseX, y: p.mouseY});
  }
  return wells;
}
function part(px, py, wells){
  var R2 = R * R;
  for (var n = 0; n < wells.length; n++){
    var dx = px - wells[n].x, dy = py - wells[n].y;
    var d2 = dx*dx + dy*dy;
    if (d2 < R2 && d2 > 0.01){
      var dist = Math.sqrt(d2), push = (1 - dist / R) * PUSH;
      px += dx / dist * push;
      py += dy / dist * push;
    }
  }
  return [px, py];
}
function hideHint(){
  var h = document.getElementById('hint');
  if (h) h.classList.add('gone');
}

/* Piece 1: marbled ink (https://x.com/yuruyurau/status/2108944867930132499) */
function inkSketch(p){
  var t = 0, i, w, q, c, k, e, d, y;
  p.touchStarted = hideHint;
  p.mousePressed = hideHint;
  p.draw = function(){
    if (!t) p.createCanvas(w = 400, w);
    p.background(9);
    p.stroke(w, 166);
    var wells = makeWells(p), pt;
    for (t += Math.PI/60, i = 1e4; i--;){
      y = i/299;
      k = (4 + Math.cos(y)) * Math.cos(i/7);
      e = y/5 - 11;
      d = Math.sqrt(k*k + e*e) - 6; /* mag(k,e)-6 */
      q = 99 + Math.sin(t*2+e)*9 + 3*Math.sin(k*2) + d*d*Math.sin(t*2-d)
          + y/23*k*(e+Math.sin(-d*4));
      c = d/4 - t/4 + (i % 2) * 9;
      pt = part(q*Math.sin(c)+200, q*Math.cos(c)+200, wells);
      p.point(pt[0], pt[1]);
    }
  };
}

/* Piece 2: silk ribbons (https://x.com/yuruyurau/status/2108593527961899180) */
function silkSketch(p){
  var t = 0, i, w, q, c, k, e, d, y;
  p.touchStarted = hideHint;
  p.mousePressed = hideHint;
  p.draw = function(){
    if (!t) p.createCanvas(w = 400, w);
    p.background(9);
    p.stroke(w, 46);
    var wells = makeWells(p), pt;
    for (t += Math.PI/240, i = 2e4; i--;){
      y = i/885;
      k = (5 + 3*Math.sin(y+4)) * Math.cos(i/7);
      e = y/5 - 9;
      d = Math.sqrt(k*k + e*e) - 2.8 + Math.sin(t - k*k/9);
      q = 3*Math.sin(k*2) + k*y/25*(d*2.5 + 2*Math.sin(e*6 - d*5 + t*3));
      c = d - t;
      pt = part(q + 6*d*Math.cos(c) + 200, q*Math.sin(c) + d*39, wells);
      p.point(pt[0], pt[1]);
    }
  };
}

var CODE = {
  ink: 'a=(y,d=mag(k=(4+cos(y))*cos(i/7),e=y/5-11)-6)=&gt;point((q=99+sin(t*2+e)*9+3*sin(k*2)+d*d*sin(t*2-d)+y/23*k*(e+sin(-d*4)))*sin(c=d/4-t/4+i%2*9)+200,q*cos(c)+200)\nt=0,draw=$=&gt;{t||createCanvas(w=400,w);background(9).stroke(w,166);for(t+=PI/60,i=1e4;i--;)a(i/299)}',
  silk: 'a=(y,d=mag(k=(5+3*sin(y+4))*cos(i/7),e=y/5-9)-2.8+sin(t-k*k/9))=&gt;point((q=3*sin(k*2)+k*y/25*(d*2.5+2*sin(e*6-d*5+t*3)))+6*d*cos(c=d-t)+200,q*sin(c)+d*39)\nt=0,draw=$=&gt;{{t||createCanvas(w=400,w);background(9).stroke(w,46);for(t+=PI/240,i=2e4;i--;)a(i/885)}}'
};
var LINK = {
  ink: 'https://x.com/yuruyurau/status/2108944867930132499',
  silk: 'https://x.com/yuruyurau/status/2108593527961899180'
};

var stage = document.getElementById('stage');
var activePiece = 'ink';
var pieces = {};
function refreshCanvases(){
  var cs = stage.querySelectorAll('canvas');
  for (var n = 0; n < cs.length; n++)
    cs[n].classList.toggle('on', cs[n].dataset.piece === activePiece);
}
/* Piece 1: marbled ink (https://x.com/yuruyurau/status/2108944867930132499) */
function inkSketch(p){
  var t = 0, i, w, q, c, k, e, d, y;
  p.touchStarted = hideHint;
  p.mousePressed = hideHint;
  p.draw = function(){
    if (!t){ p.createCanvas(w = 400, w).elt.dataset.piece = 'ink'; refreshCanvases(); }
    p.background(9);
    p.stroke(w, 166);
    var wells = makeWells(p), pt;
    for (t += Math.PI/60, i = 1e4; i--;){
      y = i/299;
      k = (4 + Math.cos(y)) * Math.cos(i/7);
      e = y/5 - 11;
      d = Math.sqrt(k*k + e*e) - 6; /* mag(k,e)-6 */
      q = 99 + Math.sin(t*2+e)*9 + 3*Math.sin(k*2) + d*d*Math.sin(t*2-d)
          + y/23*k*(e+Math.sin(-d*4));
      c = d/4 - t/4 + (i % 2) * 9;
      pt = part(q*Math.sin(c)+200, q*Math.cos(c)+200, wells);
      p.point(pt[0], pt[1]);
    }
  };
}

/* Piece 2: silk ribbons (https://x.com/yuruyurau/status/2108593527961899180) */
function silkSketch(p){
  var t = 0, i, w, q, c, k, e, d, y;
  p.touchStarted = hideHint;
  p.mousePressed = hideHint;
  p.draw = function(){
    if (!t){ p.createCanvas(w = 400, w).elt.dataset.piece = 'silk'; refreshCanvases(); }
    p.background(9);
    p.stroke(w, 46);
    var wells = makeWells(p), pt;
    for (t += Math.PI/240, i = 2e4; i--;){
      y = i/885;
      k = (5 + 3*Math.sin(y+4)) * Math.cos(i/7);
      e = y/5 - 9;
      d = Math.sqrt(k*k + e*e) - 2.8 + Math.sin(t - k*k/9);
      q = 3*Math.sin(k*2) + k*y/25*(d*2.5 + 2*Math.sin(e*6 - d*5 + t*3));
      c = d - t;
      pt = part(q + 6*d*Math.cos(c) + 200, q*Math.sin(c) + d*39, wells);
      p.point(pt[0], pt[1]);
    }
  };
}

pieces.ink = new p5(inkSketch, stage);
pieces.silk = new p5(silkSketch, stage);
pieces.silk.noLoop();

function show(name){
  activePiece = name;
  var isInk = name === 'ink';
  document.getElementById('tab-ink').classList.toggle('on', isInk);
  document.getElementById('tab-silk').classList.toggle('on', !isInk);
  refreshCanvases();
  if (isInk){ pieces.silk.noLoop(); pieces.ink.loop(); }
  else { pieces.ink.noLoop(); pieces.silk.loop(); }
  document.getElementById('cap').innerHTML =
    'a recreation of <a href="' + LINK[name] + '">a つぶやきProcessing sketch by @yuruyurau</a><br>' +
    'the entire artwork is one tweet of code' +
    '<details><summary>show the code</summary><pre>' + CODE[name] + '</pre></details>';
}
document.getElementById('tab-ink').addEventListener('click', function(){ show('ink'); });
document.getElementById('tab-silk').addEventListener('click', function(){ show('silk'); });
show('ink');
</script>
</body>
</html>
