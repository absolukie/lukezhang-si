<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>swatlab</title><style>
  body{background:#222;color:#fff;font:13px monospace;padding:20px}
  .box{margin:14px 0;padding:10px;border:1px solid #555}
  svg{display:block;background:#333}
  .t{transform-box:fill-box;transform-origin:50% 12%}
  @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  @keyframes lift{0%{transform:translateY(0)}35%{transform:translateY(-34px)}70%{transform:translateY(-10px)}100%{transform:translateY(0)}}
  @keyframes liftvar{0%{transform:rotate(0)}35%{transform:rotate(var(--aim,0deg)) translateY(-34px)}70%{transform:rotate(var(--aim2,0deg)) translateY(-10px)}100%{transform:rotate(0)}}
  .t1{animation:spin 2s linear infinite}
  .t2go{animation:lift 6s linear}
  .t3go{animation:lift 6s linear}
  .t4go{animation:liftvar 6s linear}
</style></head><body>
<h2>swat lab — which JS-triggered SVG animations render?</h2>
<div class="box"><div id="l1">T1 starting</div><svg width="200" height="120"><g id="t1" class="t t1"><rect x="80" y="40" width="40" height="40" fill="#f66"/></g></svg></div>
<div class="box"><div id="l2">T2 starting</div><svg width="200" height="120"><g id="t2" class="t"><rect x="80" y="40" width="40" height="40" fill="#6f6"/></g></svg></div>
<div class="box"><div id="l3">T3 starting</div><svg width="200" height="120"><g id="t3" class="t"><rect x="80" y="40" width="40" height="40" fill="#66f"/></g></svg></div>
<div class="box"><div id="l4">T4 starting</div><svg width="200" height="120"><g id="t4" class="t"><rect x="80" y="40" width="40" height="40" fill="#ff6"/></g></svg></div>
<script>
function snap(id, el){
  var a = 0, tf = 'n/a';
  try { a = el.getAnimations().length; tf = getComputedStyle(el).transform; } catch(e){ tf = 'ERR'; }
  document.getElementById(id).textContent = id.toUpperCase() + ' anims=' + a + ' transform=' + tf;
}
var t1=document.getElementById('t1'), t2=document.getElementById('t2'),
    t3=document.getElementById('t3'), t4=document.getElementById('t4');
setTimeout(function(){
  t2.classList.add('t2go');                                    // plain add, var-free
  t3.classList.remove('t3go'); void t3.getBoundingClientRect(); t3.classList.add('t3go'); // reflow trick, var-free
  t4.style.setProperty('--aim','-20deg'); t4.style.setProperty('--aim2','14deg');
  t4.classList.add('t4go');                                    // plain add, var() keyframes
}, 500);
setInterval(function(){
  snap('l1',t1); snap('l2',t2); snap('l3',t3); snap('l4',t4);
  document.title = 'LAB ' + new Date().toISOString().substr(14,5);
}, 700);
</script></body></html>
