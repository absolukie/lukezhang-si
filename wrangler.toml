# lukezhang.si — Cloudflare Worker (cat site + blog + projects router).
#
# The dashboard build runs `npx wrangler deploy`, which auto-discovers this file.
# - "main" is the Worker's entrypoint: worker.js (host-based router).
#   NEVER rename it to _worker.js — that is a Pages-only convention; on a
#   Workers project wrangler tries to upload it as a static asset and the
#   build fails with "Uploading a Pages _worker.js file as an asset".
# - [assets] serves the repo root (index.html, blog/, design.html, sites/, …)
#   at the same URLs as before. worker.js itself is blocked from being served
#   by the router code (it would otherwise also be uploaded as an asset).
# - Custom domains (lukezhang.si, projects.lukezhang.si, launch subdomains)
#   are attached in the dashboard: Workers & Pages → lukezhang-si → Settings →
#   Domains & Routes. Not managed here.

name = "lukezhang-si"
main = "worker.js"
compatibility_date = "2026-10-05"

[assets]
directory = "./"
